name: Data Products v1.12.1 Same-Repository PR Publisher

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  publish-data-products-v1-12-1:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/data-products-v1-12-1-pr-target-trigger-003'
    concurrency:
      group: publish-data-products-v1-12-1-same-repository-pr
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact publication base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Publish and record Data Products v1.12.1
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_SOURCE_SHA: ${{ github.event.pull_request.base.sha }}
          PUBLICATION_PR: ${{ github.event.pull_request.number }}
        run: bash tools/publish_data_products_v1_12_1_20260803.sh
      - name: Remove temporary base-branch PR-target publisher
        shell: bash
        run: |
          rm -f .github/workflows/data-products-v1-12-1-pr-target-publisher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Temporary base-branch publisher already absent.'
            exit 0
          fi
          git commit -m 'fix(release): remove temporary PR target publisher'
          git push origin HEAD:main
