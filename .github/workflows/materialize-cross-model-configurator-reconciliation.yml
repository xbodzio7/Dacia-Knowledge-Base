name: Materialize Cross-model Configurator Reconciliation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/cross-model-configurator-reconciliation-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize reconciliation
        run: |
          python tools/materialize_cross_model_configurator_reconciliation.py
          python tools/dkb.py project-state --apply
      - name: Verify reconciliation
        run: |
          python -m unittest -v tests.test_cross_model_configurator_data_reconciliation_20260805
          python tools/dkb.py project-state --check
      - name: Commit bounded package
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          rm .github/workflows/materialize-cross-model-configurator-reconciliation.yml
          rm tools/materialize_cross_model_configurator_reconciliation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'data: reconcile cross-model configurator evidence'
          git push origin "HEAD:${HEAD_BRANCH}"
