name: Temporary Duster README Correction

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Correct exact-stock denominator wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = 'Cztery pozycje są jawnym `not_available`, a pozostałe 201 stanowią wyposażenie obecne w konkretnych kartach.'
          new = 'Nowy import zawiera 199 stanów `standard` i 4 jawne `not_available`; dwa wcześniejsze seryjne stany składanych lusterek Extreme i Journey są ponownie używane bez duplikacji.'
          if old not in text:
              raise SystemExit('README denominator sentence not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --check
          git commit -m "docs: clarify Duster equipment denominator"
          git push origin HEAD:${{ github.head_ref }}
