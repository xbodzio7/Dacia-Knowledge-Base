name: Temporary Project State Sync

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - project/state.json
      - .github/workflows/temp-project-state-sync.yml

permissions:
  contents: write

jobs:
  synchronize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/registered-source-completeness-reconciliation-20260802'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Synchronize generated documentation
        shell: bash
        run: |
          python tools/dkb.py documentation-baseline --apply
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          import project_state
          root = Path('.').resolve()
          state = project_state.read_state(root / 'project/state.json')
          project_state.validate_state(state)
          project_state.write_atomic(
              root / 'project/STATE_SUMMARY.md',
              project_state.render_summary(state),
          )
          PY

      - name: Commit synchronized files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md project/ROADMAP.md project/SESSION_STATE.md project/STATE_SUMMARY.md
          if git diff --cached --quiet; then
            echo 'Generated documentation is already synchronized.'
            exit 0
          fi
          git commit -m 'docs: synchronize review package state'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
