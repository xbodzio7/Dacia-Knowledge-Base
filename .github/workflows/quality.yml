name: Temporary Bigster page 20 Hybrid 155 voltage materializer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out materialization branch
        uses: actions/checkout@v4
        with:
          ref: agent/bigster-page20-hybrid155-voltage-materialize-20260730
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF backend
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Materialize and verify package
        run: python tools/materialize_bigster_page20_hybrid155_voltage.py
      - name: Commit deterministic outputs and restore workflow
        run: |
          git checkout origin/main -- .github/workflows/quality.yml
          rm -f tools/materialize_bigster_page20_hybrid155_voltage.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "data: materialize Bigster Hybrid 155 voltage observations"
          git push origin HEAD:agent/bigster-page20-hybrid155-voltage-materialize-20260730
