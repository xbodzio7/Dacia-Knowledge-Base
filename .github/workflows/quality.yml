name: Quality

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    env:
      DKB_EXPECTED_REPOSITORY: ${{ github.repository }}
      DKB_EXPECTED_DEFAULT_BRANCH: ${{ github.event.pull_request.base.repo.default_branch || github.event.repository.default_branch || 'main' }}
      DKB_EXPECTED_BASE_BRANCH: ${{ github.event.pull_request.base.ref || '' }}

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject pull requests behind the current base branch
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch || 'main' }}
        run: |
          git fetch --no-tags origin "refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          base_sha="$(git rev-parse "refs/remotes/origin/${BASE_BRANCH}")"
          head_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "${base_sha}" "${head_sha}"; then
            echo "PR head ${head_sha} does not contain current base ${base_sha}. Update the branch and rerun validation." >&2
            exit 1
          fi
          echo "Validated exact PR head ${head_sha} contains current base ${base_sha}."

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate canonical package-state transition
        if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && matrix.python-version == '3.14'
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch || 'main' }}
        run: python tools/project_state_transition.py --base-ref "origin/${BASE_BRANCH}" --head-ref HEAD

      - name: Enforce change-impact matrix for source and master-data changes
        if: github.event_name == 'pull_request' && matrix.python-version == '3.14'
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: python tools/change_impact_matrix.py --base-ref "origin/${BASE_BRANCH}" --head-ref HEAD

      - name: Show Python version
        run: python --version

      - name: Reject brittle shared-master test contracts
        if: github.event_name == 'pull_request' && matrix.python-version == '3.14'
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          python tools/check_shared_master_test_contracts.py --self-test
          python tools/check_shared_master_test_contracts.py --base-ref "origin/${BASE_BRANCH}" --head-ref HEAD

      - name: Install pinned Ruff static-analysis tool
        if: matrix.python-version == '3.14'
        run: python -m pip install --disable-pip-version-check ruff==0.14.10

      - name: Reject undefined names before running the test suite
        if: matrix.python-version == '3.14'
        run: python -m ruff check --select F821 tools scripts tests

      - name: Check Bigster brochure TPMS import contract
        run: python tools/import_bigster_brochure_tpms_availability.py --check

      - name: Check Bigster brochure equipment import contract
        run: python tools/import_bigster_brochure_equipment_availability.py --check

      - name: Install and verify pinned PDF text extraction backend
        if: matrix.python-version == '3.14'
        run: |
          if ! command -v pdftotext >/dev/null 2>&1 || ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
          expected_pdftotext="pdftotext version 24.02.0"
          actual_pdftotext="$(pdftotext -v 2>&1 | head -n 1)"
          expected_pdfinfo="pdfinfo version 24.02.0"
          actual_pdfinfo="$(pdfinfo -v 2>&1 | head -n 1)"
          test "$actual_pdftotext" = "$expected_pdftotext" || {
            echo "Expected $expected_pdftotext, got $actual_pdftotext" >&2
            exit 1
          }
          test "$actual_pdfinfo" = "$expected_pdfinfo" || {
            echo "Expected $expected_pdfinfo, got $actual_pdfinfo" >&2
            exit 1
          }
          printf '%s\n%s\n' "$actual_pdftotext" "$actual_pdfinfo"

      - name: Run repository data package preflight
        run: python tools/dkb.py package-preflight

      - name: Identify direct and transitive analytical report impacts
        if: github.event_name == 'pull_request' && matrix.python-version == '3.14'
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: python tools/dkb.py report-impact --base-ref "origin/${BASE_BRANCH}" --head-ref HEAD

      - name: Validate analytical report freshness
        run: python tools/dkb.py report-freshness
      - name: Run semantic Bigster source archive contract
        if: matrix.python-version == '3.14'
        run: |
          python -m unittest -q \
            tests.test_bigster_price_list_commercial_matrix_20261001_20261102.BigsterCommercialMatrixTests.test_source_and_config_scope


      - name: Compile Python sources
        if: matrix.python-version != '3.14'
        run: python -m compileall -q tools scripts tests

      - name: Run unit tests
        if: matrix.python-version != '3.14'
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -q

      - name: Run orchestration contract tests
        if: matrix.python-version != '3.14'
        run: |
          python -m unittest -q \
            tests.project_state_contract \
            tests.autonomy_policy_contract \
            tests.quality_artifact_manifest_contract \
            tests.test_dkb_cli \
            tests.test_report_freshness \
            tests.configuration_comparison_context_filter_contract \
            tests.configuration_comparison_pair_summary_contract

      - name: Check canonical project state
        if: matrix.python-version != '3.14'
        run: python tools/dkb.py project-state --check

      - name: Run full quality gate
        if: matrix.python-version == '3.14'
        run: |
          python tools/dkb.py quality \
            --concise \
            --database "${RUNNER_TEMP}/dacia_knowledge_base.sqlite" \
            --log-file "${RUNNER_TEMP}/quality.log" \
            --summary-json "${RUNNER_TEMP}/quality-summary.json"

      - name: Generate configuration comparison item catalog artifact
        if: matrix.python-version == '3.14'
        run: |
          python tools/dkb.py configuration-comparison-item-catalog \
            --csv "${RUNNER_TEMP}/configuration-comparison-item-catalog.csv"

      - name: Generate configuration comparison pair summary artifact
        if: matrix.python-version == '3.14'
        run: |
          python tools/dkb.py configuration-comparison-pair-summary \
            --csv "${RUNNER_TEMP}/configuration-comparison-pair-summary.csv"

      - name: Generate Duster mild hybrid 140 4x2 reporting artifacts
        if: matrix.python-version == '3.14'
