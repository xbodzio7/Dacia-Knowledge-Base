name: Temporary Bigster eco-mode materializer

on:
  push:
    branches:
      - agent/bigster-page20-eco-mode-materialize-20260730
    paths:
      - .github/workflows/quality.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out materialization branch
        uses: actions/checkout@v4
        with:
          ref: agent/bigster-page20-eco-mode-materialize-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PDF backend
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Narrow current-scalar contract update
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/materialize_bigster_page20_eco_mode.py')
          text = path.read_text(encoding='utf-8')
          old = '''    replace_once(closure_test, '"src_pl_bigster_brochure_20251210": 180,', '"src_pl_bigster_brochure_20251210": 194,')
'''
          new = '''    closure_text = closure_test.read_text(encoding="utf-8")
    marker = "EXPECTED_CURRENT_SCALAR = Counter("
    if closure_text.count(marker) != 1:
        raise RuntimeError("current scalar contract marker differs")
    prefix, current_section = closure_text.split(marker, 1)
    old_current = '"src_pl_bigster_brochure_20251210": 180,'
    if current_section.count(old_current) != 1:
        raise RuntimeError("expected one current Bigster scalar total")
    closure_test.write_text(
        prefix + marker + current_section.replace(old_current, '"src_pl_bigster_brochure_20251210": 194,', 1),
        encoding="utf-8",
        newline="\\n",
    )
'''
          if text.count(old) != 1:
              raise SystemExit('materializer patch target differs')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY

      - name: Materialize and verify package
        run: python tools/materialize_bigster_page20_eco_mode.py

      - name: Commit deterministic outputs and restore workflows
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout origin/main -- .github/workflows/quality.yml
          git rm tools/materialize_bigster_page20_eco_mode.py .github/workflows/materialize-bigster-page20-eco-mode.yml
          git add \
            data/imports/configuration_values/bigster-page20-eco-mode-20251210.json \
            data/master/configuration_attribute_values.csv \
            tests/test_bigster_page20_eco_mode.py \
            project/state.json project/STATE_SUMMARY.md \
            README.md CHANGELOG.md project/ROADMAP.md project/SESSION_STATE.md \
            data/reporting/verified_pdf_candidate_coverage_reconciliation.json \
            data/reporting/verified_pdf_candidate_coverage_reconciliation.md \
            tests/test_verified_pdf_candidate_coverage_reconciliation.py \
            tests/test_verified_pdf_candidate_residual_gap_prioritization.py \
            tools/review_official_brochure_technical_gap_resolution_closure_20260726.py \
            tests/test_official_brochure_technical_gap_resolution_closure.py \
            .github/workflows/quality.yml
          git commit -m 'build: materialize Bigster page 20 eco-mode package'
          git push origin HEAD
