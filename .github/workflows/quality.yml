name: Temporary Bigster page 20 deferred import materializer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out materialization branch
        uses: actions/checkout@v4
        with:
          ref: agent/bigster-page20-deferred-import-materialize-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PDF backend
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Show canonical page 20 text
        run: pdftotext -f 20 -l 20 -layout "PDF/Broszury/DACIA BIGSTER broszura 20251210.pdf" -

      - name: Materialize and verify package
        run: python tools/materialize_bigster_page20_deferred_import.py

      - name: Commit deterministic outputs and restore workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout origin/main -- .github/workflows/quality.yml
          git rm -f tools/materialize_bigster_page20_deferred_import.py
          git add -A
          git commit -m 'build: materialize Bigster page 20 deferred import package'
          git push origin HEAD
