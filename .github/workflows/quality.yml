name: Temporary materializer template decoder

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Check out inspection branch
        uses: actions/checkout@v4
        with:
          ref: agent/bigster-page20-battery-capacity-materializer-inspect-20260730
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Decode materializer template
        run: python tools/decode_voltage_materializer_template.py
      - name: Commit decoded template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/_decoded_voltage_materializer_template.py
          git commit -m "chore: decode materializer template"
          git push origin HEAD:agent/bigster-page20-battery-capacity-materializer-inspect-20260730
