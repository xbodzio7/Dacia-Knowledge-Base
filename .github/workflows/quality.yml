          python tools/dkb.py configuration-completeness \
            --spec data/reporting/duster_mildhybrid140_4x2_completeness.json \
            --as-of 2026-02-06 \
            --json "${RUNNER_TEMP}/duster-mildhybrid140-4x2-completeness.json" \
            --markdown "${RUNNER_TEMP}/duster-mildhybrid140-4x2-completeness.md"
          python tools/dkb.py source-coverage \
            --spec data/reporting/duster_mildhybrid140_4x2_completeness.json \
