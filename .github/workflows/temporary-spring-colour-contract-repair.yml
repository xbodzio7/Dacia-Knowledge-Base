name: Temporary Spring Colour Contract Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-spring-colour-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'agent/spring-exterior-colour-options-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Isolate the earlier Spring package contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          importer_path = Path("tools/import_spring_commercial_packages.py")
          importer = importer_path.read_text(encoding="utf-8")
          old = 'actual_items = _selected(items, lambda row: row.get("source_code") == SOURCE_CODE)'
          new = (
              'actual_items = _selected(\n'
              '        items,\n'
              '        lambda row: row.get("source_code") == SOURCE_CODE\n'
              '        and row.get("code") in EXPECTED_ITEMS,\n'
              '    )'
          )
          if importer.count(old) != 1:
              raise SystemExit("Spring commercial check predicate not found exactly once")
          importer = importer.replace(old, new, 1)

          old = 'lambda row: row.get("source_code") == SOURCE_CODE,\n        EXPECTED_ITEM_IDS[0],'
          new = (
              'lambda row: row.get("source_code") == SOURCE_CODE\n'
              '        and row.get("code") in EXPECTED_ITEMS,\n'
              '        EXPECTED_ITEM_IDS[0],'
          )
          if importer.count(old) != 1:
              raise SystemExit("Spring commercial append predicate not found exactly once")
          importer = importer.replace(old, new, 1)
          importer_path.write_text(importer, encoding="utf-8")

          test_path = Path("tests/test_spring_commercial_packages.py")
          test = test_path.read_text(encoding="utf-8")
          old = 'spring_items = [row for row in self.items if row["source_code"] == importer.SOURCE_CODE]'
          new = (
              'spring_items = [\n'
              '            row\n'
              '            for row in self.items\n'
              '            if row["source_code"] == importer.SOURCE_CODE\n'
              '            and row["code"] in importer.EXPECTED_ITEMS\n'
              '        ]'
          )
          if test.count(old) != 1:
              raise SystemExit("Spring item test predicate not found exactly once")
          test = test.replace(old, new, 1)

          old = '''        self.assertEqual(
            {code: len(rows) for code, rows in components.items()},
            {
                "spring_essential_electric70_automatic": 1,
                "spring_expression_electric70_automatic": 3,
                "spring_extreme_electric100_automatic": 3,
            },
        )
        self.assertTrue(all(row["amount"] is None for rows in components.values() for row in rows))
        self.assertTrue(all(row["price_date"] == "" for rows in components.values() for row in rows))'''
          new = '''        package_components = {
            code: [row for row in rows if row["code"] in importer.EXPECTED_ITEMS]
            for code, rows in components.items()
        }
        self.assertEqual(
            {code: len(rows) for code, rows in package_components.items()},
            {
                "spring_essential_electric70_automatic": 1,
                "spring_expression_electric70_automatic": 3,
                "spring_extreme_electric100_automatic": 3,
            },
        )
        self.assertTrue(
            all(row["amount"] is None for rows in package_components.values() for row in rows)
        )
        self.assertTrue(
            all(row["price_date"] == "" for rows in package_components.values() for row in rows)
        )'''
          if test.count(old) != 1:
              raise SystemExit("Spring component assertion block not found exactly once")
          test_path.write_text(test.replace(old, new, 1), encoding="utf-8")

          state_path = Path("project/state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          paths = set(state["current_package"]["manifest_paths"])
          paths.update({
              "tests/test_spring_commercial_packages.py",
              "tools/import_spring_commercial_packages.py",
          })
          state["current_package"]["manifest_paths"] = sorted(paths)
          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          package_path = Path("project/packages/spring-exterior-colour-options-20260731.md")
          package = package_path.read_text(encoding="utf-8")
          old = "The final pull-request diff contains exactly fourteen declared package paths and no temporary workflow or extraction file. This human-authored commit triggers the final standard CI verification after materialization."
          new = "The final pull-request diff contains exactly sixteen declared package paths and no temporary workflow or extraction file. The earlier Spring package importer and its regression test are narrowed to their five exact commercial-item codes so later items from the same registered source cannot leak into that independent contract."
          if package.count(old) != 1:
              raise SystemExit("Package final-manifest statement not found exactly once")
          package_path.write_text(package.replace(old, new, 1), encoding="utf-8")
          PY

          python tools/dkb.py project-state --apply

      - name: Verify repaired contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_spring_exterior_colour_options \
            tests.test_spring_commercial_packages \
            tests.test_commercial_items_20260703 \
            -v
          python tools/import_spring_exterior_colour_options.py --check
          python tools/import_spring_commercial_packages.py --check
          python tools/validate_dkb.py
          python tools/dkb.py project-state --check

      - name: Commit final package and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/temporary-spring-colour-contract-repair.yml
          git add -- \
            project/ROADMAP.md \
            project/SESSION_STATE.md \
            project/STATE_SUMMARY.md \
            project/packages/spring-exterior-colour-options-20260731.md \
            project/state.json \
            tests/test_spring_commercial_packages.py \
            tools/import_spring_commercial_packages.py
          git commit -m "fix(data): isolate Spring commercial package contract"
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = sorted(
              json.loads(Path("project/state.json").read_text(encoding="utf-8"))
              ["current_package"]["manifest_paths"]
          )
          actual = sorted(
              line
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"],
                  text=True,
              ).splitlines()
              if line
          )
          if actual != expected:
              raise SystemExit(
                  f"Final manifest mismatch:\nexpected={expected!r}\nactual={actual!r}"
              )
          print(f"Final package manifest verified: {len(actual)} paths.")
          PY
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
