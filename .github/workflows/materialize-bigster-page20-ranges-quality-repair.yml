name: Materialize Bigster page 20 range quality repair

on:
  push:
    branches:
      - agent/bigster-page20-ranges-quality-repair-materialize-20260730
    paths:
      - .github/workflows/materialize-bigster-page20-ranges-quality-repair.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Materialize and validate repair
        run: python tools/repair_bigster_page20_ranges_quality.py

      - name: Commit deterministic outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            data/imports/configuration_value_ranges/bigster-page20-emissions-consumption-ranges-20251210.json \
            data/master/configuration_attribute_value_ranges.csv \
            tests/test_bigster_page20_emissions_consumption_ranges.py \
            project/state.json project/STATE_SUMMARY.md \
            README.md CHANGELOG.md project/ROADMAP.md project/SESSION_STATE.md \
            tools/review_official_brochure_technical_gap_resolution_closure_20260726.py \
            tests/test_configuration_value_ranges.py \
            tests/test_jogger_payload_performance_ranges.py \
            tests/test_official_brochure_technical_gap_resolution_closure.py \
            tests/test_verified_pdf_candidate_coverage_reconciliation.py \
            data/reporting/verified_pdf_candidate_coverage_reconciliation.json \
            data/reporting/verified_pdf_candidate_coverage_reconciliation.md
          git rm tools/repair_bigster_page20_ranges_quality.py .github/workflows/materialize-bigster-page20-ranges-quality-repair.yml
          git commit -m 'build: materialize Bigster range quality repair'
          git push origin HEAD
