name: Temporary verified PDF queue re-entry materialization

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/verified-pdf-queue-reentry-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/verified-pdf-queue-reentry-20260730
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Materialize and validate queue review
        run: python tools/temporary_materialize_verified_pdf_queue_reentry.py
      - name: Commit final package and remove temporary tools
        run: |
          rm .github/workflows/temporary-verified-pdf-queue-reentry-diagnostic.yml
          rm .github/workflows/temporary-verified-pdf-queue-reentry-materialization.yml
          rm tools/temporary_materialize_verified_pdf_queue_reentry.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/reporting/verified_pdf_residual_queue_reentry_review.json \
            data/reporting/verified_pdf_residual_queue_reentry_review.md \
            project/reviews/verified-pdf-residual-queue-reentry-review-2026-07-30.md \
            project/state.json project/STATE_SUMMARY.md \
            .github/workflows/temporary-verified-pdf-queue-reentry-diagnostic.yml \
            .github/workflows/temporary-verified-pdf-queue-reentry-materialization.yml \
            tools/temporary_materialize_verified_pdf_queue_reentry.py
          git commit -m "docs(queue): select Duster page 20 reconciliation"
          git push origin HEAD:agent/verified-pdf-queue-reentry-20260730
