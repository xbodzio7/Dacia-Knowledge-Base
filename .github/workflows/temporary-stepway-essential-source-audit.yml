name: Temporary Stepway Essential Source Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/stepway-essential-source-gap-20260801'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install PDF backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Inspect exact source usage and contexts
        run: |
          CONFIG='sandero_stepway_iii_essential_ecog120_manual'
          SOURCE='src_pl_sandero_stepway_essential_ecog120_mt_20260626'
          echo '===== MASTER FILES ====='
          find data/master -maxdepth 1 -type f -printf '%f\n' | sort
          echo '===== CONFIGURATION SCALAR VALUES ====='
          head -n 1 data/master/configuration_attribute_values.csv
          grep -F "$CONFIG" data/master/configuration_attribute_values.csv || true
          echo '===== CONFIGURATION VALUE RANGES ====='
          head -n 1 data/master/configuration_attribute_value_ranges.csv
          grep -F "$CONFIG" data/master/configuration_attribute_value_ranges.csv || true
          echo '===== SOURCE USAGE ====='
          grep -R -n -F "$SOURCE" data project tests tools --exclude='*.pdf' || true
          echo '===== CONTEXT-RELATED HEADERS AND ROWS ====='
          for file in data/master/*context*.csv data/master/*basis*.csv; do
            [ -f "$file" ] || continue
            echo "--- $file"
            head -n 1 "$file"
            grep -F "$CONFIG" "$file" || true
          done
          echo '===== EXACT MISSING ENTRY ====='
          python - <<'PY'
          import json
          from pathlib import Path
          code = 'sandero_stepway_iii_essential_ecog120_manual'
          payload = json.loads(Path('data/reporting/existing_configuration_missing_data_analysis.json').read_text(encoding='utf-8'))
          for item in payload['configurations']:
              if item['configuration_code'] == code:
                  print(json.dumps(item, ensure_ascii=False, indent=2))
          PY
