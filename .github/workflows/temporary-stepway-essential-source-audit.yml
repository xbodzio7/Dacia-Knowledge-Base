name: Temporary Stepway Essential Source Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/stepway-essential-source-gap-20260801'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Inspect wheel-finish domain and source peers
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          values = list(csv.DictReader(Path('data/master/configuration_attribute_values.csv').open(encoding='utf-8-sig', newline='')))
          attrs = list(csv.DictReader(Path('data/master/attributes.csv').open(encoding='utf-8-sig', newline='')))
          print('===== ATTRIBUTE =====')
          for row in attrs:
              if row['code'] == 'wheel_finish':
                  print(json.dumps(row, ensure_ascii=False, sort_keys=True))
          print('===== EXISTING VALUES =====')
          for row in values:
              if row['attribute_code'] == 'wheel_finish':
                  print(json.dumps(row, ensure_ascii=False, sort_keys=True))
          print('===== PEER SOURCE TEXT =====')
          for path in Path('data').rglob('*.json'):
              text = path.read_text(encoding='utf-8', errors='replace')
              if 'ERALIA' in text or 'stalowe obręcze kół 16' in text:
                  print(path)
                  for line in text.splitlines():
                      if 'ERALIA' in line or 'stalowe obręcze kół 16' in line:
                          print(line)
          PY
