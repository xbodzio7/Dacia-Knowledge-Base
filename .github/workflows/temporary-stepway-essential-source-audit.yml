name: Temporary Stepway Essential Source Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/stepway-essential-source-gap-20260801'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Inspect dimension conventions and gear coverage
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          values = list(csv.DictReader(Path('data/master/configuration_attribute_values.csv').open(encoding='utf-8-sig', newline='')))
          print('===== DIMENSION CONVENTIONS =====')
          for row in values:
              if row['attribute_code'] in {'overall_height', 'overall_width_with_mirrors'}:
                  print(json.dumps(row, ensure_ascii=False, sort_keys=True))

          print('===== SANDERO GEAR-4 COVERAGE =====')
          for scope_name in ('configuration_completeness.json', 'sandero_ecog120_manual_completeness.json'):
              payload = json.loads(Path('data/reporting', scope_name).read_text(encoding='utf-8'))
              codes = [item['configuration_code'] if isinstance(item, dict) else item for item in payload['configurations']]
              print(scope_name, len(codes))
              for code in codes:
                  found = sorted(
                      (row['fuel_type_code'], row['gear_number'], row['value'], row['source_code'])
                      for row in values
                      if row['configuration_code'] == code
                      and row['attribute_code'] == 'elasticity_80_120'
                      and row['gear_number'] == '4'
                  )
                  print(code, found)
          PY
