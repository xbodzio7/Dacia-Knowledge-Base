name: Temporary Stepway Essential Source-Gap Materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temporary-stepway-essential-source-gap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/stepway-essential-source-gap-20260801'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install PDF backend
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
      - name: Align importer with configuration schema
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/import_sandero_stepway_essential_source_gap_20260626.py')
          text = path.read_text(encoding='utf-8')
          obsolete = '''    if configuration.get("model_code") != MODEL_CODE:\n        raise ContractError(f"unexpected model identity for {CONFIGURATION}")\n'''
          if obsolete in text:
              path.write_text(text.replace(obsolete, ''), encoding='utf-8')
          PY
      - name: Materialize package
        run: |
          python -m tools.import_sandero_stepway_essential_source_gap_20260626
          python tools/dkb.py project-state --apply
          python tools/dkb.py documentation-baseline --apply
      - name: Check deterministic outputs
        run: python -m tools.import_sandero_stepway_essential_source_gap_20260626 --check
      - name: Run package tests
        run: |
          python -m unittest -v tests.test_sandero_stepway_essential_source_gap_20260626
          python -m unittest -v tests.test_existing_configuration_missing_data_analysis
      - name: Run full quality gate
        id: quality
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/dkb.py quality --database "$RUNNER_TEMP/dkb.sqlite" 2>&1 | tee stepway-essential-quality-diagnostic.txt
      - name: Commit quality diagnostics
        if: steps.quality.outcome == 'failure'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stepway-essential-quality-diagnostic.txt
          git commit -m 'chore(ci): capture Stepway Essential quality failure'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Fail after diagnostics
        if: steps.quality.outcome == 'failure'
        run: exit 1
      - name: Commit package
        if: steps.quality.outcome == 'success'
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'data(sandero): resolve Stepway Essential source gaps'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
