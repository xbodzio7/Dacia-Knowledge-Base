name: Temporary regenerate existing analysis

on:
  push:
    branches:
      - agent/duster-jogger-july-technical-reconciliation-007

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regenerate dependent analysis
        run: python tools/existing_configuration_missing_data_analysis.py
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reporting/existing_configuration_missing_data_analysis.json data/reporting/existing_configuration_missing_data_analysis.md project/packages/post-jogger-context-completeness-reanalysis-20260801.md project/state.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(reporting): regenerate dependent completeness analysis"
          git push
