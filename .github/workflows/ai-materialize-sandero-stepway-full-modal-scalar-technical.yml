name: AI materialize Sandero Stepway full-modal scalar technical

on:
  push:
    branches:
      - agent/sandero-stepway-full-modal-scalar-technical-001
    paths:
      - .github/workflows/ai-materialize-sandero-stepway-full-modal-scalar-technical.yml
      - tools/materialize_sandero_stepway_full_modal_scalar_technical_20260912.py
      - project/sources/dacia-pl-sandero-stepway-full-technical-standard-equipment-20260809.json
      - data/master/attributes.csv
      - data/master/configuration_attribute_values.csv

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sandero-stepway-full-modal-scalar-technical-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize exact scalar technical observations
        run: python tools/materialize_sandero_stepway_full_modal_scalar_technical_20260912.py
      - name: Commit generated master data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master/configuration_attribute_values.csv \
            data/reporting/sandero_stepway_full_modal_scalar_technical_20260912.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "data(sandero): materialize full-modal scalar technical values"
          git push origin HEAD:agent/sandero-stepway-full-modal-scalar-technical-001
