name: Temporary Spring Saved-State Documentation Sync

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'agent/spring-saved-state-artifact-intake-20260802'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-saved-state-artifact-intake-20260802
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Synchronize generated documentation
        run: |
          python tools/dkb.py documentation-baseline --apply
          python tools/dkb.py project-state --apply
      - name: Commit synchronized documentation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-sync-spring-saved-state-docs.yml
          git add CHANGELOG.md README.md project/SESSION_STATE.md project/STATE_SUMMARY.md project/state.json
          if git diff --cached --quiet; then
            echo "No documentation changes to commit"
            exit 1
          fi
          git commit -m "Sync Spring saved-state documentation"
          git push origin HEAD:agent/spring-saved-state-artifact-intake-20260802
