name: Temporary Fix Khaki Downstream Contracts

on:
  push:
    branches:
      - agent/spring-essential-khaki-price-apply-20260802
    paths:
      - .github/workflows/temp-fix-khaki-downstream-contracts.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-essential-khaki-price-apply-20260802
          fetch-depth: 0

      - name: Repair exact downstream contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path_name}: {old[:80]!r}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          importer = "tools/import_spring_exterior_colour_options.py"
          replace_once(
              importer,
              'EXPECTED_CONFIGURATION_IDS = (150, 167)\n',
              'EXPECTED_CONFIGURATION_IDS = (150, 167)\n'
              'APPROVED_CURRENT_MAPPING_CODE = (\n'
              '    "spring_colour_lichen_khaki__spring_essential_electric70_automatic"\n'
              ')\n'
              'APPROVED_CURRENT_MAPPING_STATE = {\n'
              '    "availability_status": "optional",\n'
              '    "amount": "2300",\n'
              '    "currency_code": "PLN",\n'
              '    "price_date": "2026-08-02",\n'
              '    "source_code": "src_pl_spring_commercial_context_20260802",\n'
              '}\n',
          )
          replace_once(
              importer,
              'def selected(rows: list[dict[str, str]], predicate) -> list[dict[str, str]]:\n'
              '    return [row for row in rows if predicate(row)]\n\n\n'
              'def assert_payload(',
              'def selected(rows: list[dict[str, str]], predicate) -> list[dict[str, str]]:\n'
              '    return [row for row in rows if predicate(row)]\n\n\n'
              'def normalize_reviewed_configuration_rows(\n'
              '    rows: list[dict[str, str]],\n'
              ') -> list[dict[str, str]]:\n'
              '    expected = {row["code"]: row for row in generated_configurations()}\n'
              '    normalized: list[dict[str, str]] = []\n'
              '    for row in rows:\n'
              '        if row["code"] != APPROVED_CURRENT_MAPPING_CODE:\n'
              '            normalized.append(row)\n'
              '            continue\n'
              '        historical = expected[APPROVED_CURRENT_MAPPING_CODE]\n'
              '        if all(row.get(field, "") == historical[field] for field in CONFIGURATION_FIELDS[1:]):\n'
              '            normalized.append(row)\n'
              '            continue\n'
              '        if any(\n'
              '            row.get(field, "") != value\n'
              '            for field, value in APPROVED_CURRENT_MAPPING_STATE.items()\n'
              '        ):\n'
              '            raise ContractError("Essential Lichen Khaki mapping is outside the approved transition")\n'
              '        restored = dict(row)\n'
              '        for field in CONFIGURATION_FIELDS[1:]:\n'
              '            restored[field] = historical[field]\n'
              '        normalized.append(restored)\n'
              '    return normalized\n\n\n'
              'def assert_payload(',
          )
          replace_once(
              importer,
              'def append_contract(\n'
              '    current: list[dict[str, str]], expected: list[dict[str, str]], fields: Sequence[str],\n'
              '    predicate, first_id: int, label: str\n'
              ') -> list[dict[str, str]]:\n'
              '    actual = selected(current, predicate)\n'
              '    if actual:\n'
              '        assert_payload(actual, expected, fields, label)\n',
              'def append_contract(\n'
              '    current: list[dict[str, str]], expected: list[dict[str, str]], fields: Sequence[str],\n'
              '    predicate, first_id: int, label: str, normalizer=None\n'
              ') -> list[dict[str, str]]:\n'
              '    actual = selected(current, predicate)\n'
              '    if actual:\n'
              '        checked = normalizer(actual) if normalizer else actual\n'
              '        assert_payload(checked, expected, fields, label)\n',
          )
          replace_once(
              importer,
              '    mappings = selected(\n'
              '        read_rows(CONFIGURATIONS_OUTPUT),\n'
              '        lambda row: row.get("source_code") == SOURCE_CODE and row.get("commercial_item_code") in colour_codes,\n'
              '    )\n'
              '    assert_payload(items, generated_items(), ITEM_FIELDS[1:], "Spring colour items")\n'
              '    assert_payload(attributes, generated_attributes(), ATTRIBUTE_FIELDS[1:], "Spring colour memberships")\n'
              '    assert_payload(mappings, generated_configurations(), CONFIGURATION_FIELDS[1:], "Spring colour mappings")\n',
              '    mappings = selected(\n'
              '        read_rows(CONFIGURATIONS_OUTPUT),\n'
              '        lambda row: row.get("commercial_item_code") in colour_codes,\n'
              '    )\n'
              '    assert_payload(items, generated_items(), ITEM_FIELDS[1:], "Spring colour items")\n'
              '    assert_payload(attributes, generated_attributes(), ATTRIBUTE_FIELDS[1:], "Spring colour memberships")\n'
              '    assert_payload(\n'
              '        normalize_reviewed_configuration_rows(mappings),\n'
              '        generated_configurations(),\n'
              '        CONFIGURATION_FIELDS[1:],\n'
              '        "Spring colour mappings",\n'
              '    )\n',
          )
          replace_once(
              importer,
              '    mappings = append_contract(\n'
              '        read_rows(CONFIGURATIONS_OUTPUT), generated_configurations(), CONFIGURATION_FIELDS[1:],\n'
              '        lambda row: row.get("source_code") == SOURCE_CODE and row.get("commercial_item_code") in colour_codes,\n'
              '        EXPECTED_CONFIGURATION_IDS[0], "Spring colour mapping",\n'
              '    )\n',
              '    mappings = append_contract(\n'
              '        read_rows(CONFIGURATIONS_OUTPUT), generated_configurations(), CONFIGURATION_FIELDS[1:],\n'
              '        lambda row: row.get("commercial_item_code") in colour_codes,\n'
              '        EXPECTED_CONFIGURATION_IDS[0], "Spring colour mapping",\n'
              '        normalize_reviewed_configuration_rows,\n'
              '    )\n',
          )

          colours_test = "tests/test_spring_exterior_colour_options.py"
          replace_once(
              colours_test,
              '    def test_colour_options_remain_unpriced(self) -> None:\n'
              '        components = collect_commercial_components(ROOT, list(importer.CONFIGURATIONS), importer.DATE)\n'
              '        colour_codes = set(importer.EXPECTED_COLOURS)\n'
              '        selected = [\n'
              '            row for rows in components.values() for row in rows\n'
              '            if row["code"] in colour_codes\n'
              '        ]\n'
              '        self.assertEqual(len(selected), 18)\n'
              '        self.assertTrue(all(row["amount"] is None for row in selected))\n'
              '        self.assertTrue(all(row["currency_code"] == "PLN" and row["price_date"] == "" for row in selected))\n',
              '    def test_only_approved_essential_khaki_mapping_is_priced(self) -> None:\n'
              '        components = collect_commercial_components(ROOT, list(importer.CONFIGURATIONS), "2026-08-02")\n'
              '        colour_codes = set(importer.EXPECTED_COLOURS)\n'
              '        selected = [\n'
              '            row for rows in components.values() for row in rows\n'
              '            if row["code"] in colour_codes\n'
              '        ]\n'
              '        self.assertEqual(len(selected), 18)\n'
              '        priced = [row for row in selected if row["amount"] is not None]\n'
              '        self.assertEqual(len(priced), 1)\n'
              '        self.assertEqual(priced[0]["code"], "spring_colour_lichen_khaki")\n'
              '        self.assertEqual(priced[0]["configuration_code"], "spring_essential_electric70_automatic")\n'
              '        self.assertEqual(priced[0]["amount"], 2300.0)\n'
              '        self.assertEqual(priced[0]["currency_code"], "PLN")\n'
              '        self.assertEqual(priced[0]["price_date"], "2026-08-02")\n'
              '        unpriced = [row for row in selected if row["amount"] is None]\n'
              '        self.assertEqual(len(unpriced), 17)\n'
              '        self.assertTrue(all(row["currency_code"] == "PLN" and row["price_date"] == "" for row in unpriced))\n',
          )

          commercial_test = "tests/test_commercial_items_20260703.py"
          replace_once(
              commercial_test,
              'SPRING_CONFIGURATOR_DATE = "2026-07-31"\n',
              'SPRING_CONFIGURATOR_DATE = "2026-07-31"\nSPRING_CURRENT_CONTEXT_DATE = "2026-08-02"\n',
          )
          replace_once(
              commercial_test,
              '{"", DATE, STOCK_DATE, SPRING_CONFIGURATOR_DATE},',
              '{"", DATE, STOCK_DATE, SPRING_CONFIGURATOR_DATE, SPRING_CURRENT_CONTEXT_DATE},',
          )

          registered_test = "tests/test_registered_source_completeness_reconciliation_20260802.py"
          replace_once(
              registered_test,
              '        self.assertGreaterEqual(state["baseline"]["tests"], 1788)\n'
              '        self.assertEqual(state["baseline"]["rows"], 11713)\n',
              '        self.assertGreaterEqual(state["baseline"]["tests"], 1788)\n'
              '        current_id = state["current_package"]["package_id"]\n'
              '        expected_rows = 11714 if current_id in {\n'
              '            "spring_essential_khaki_price_apply_001",\n'
              '            "spring_standard_equipment_representation_review_001",\n'
              '        } else 11713\n'
              '        self.assertEqual(state["baseline"]["rows"], expected_rows)\n',
          )

          materialization_test = "tests/test_reviewed_gap_state_materialization_20260802.py"
          replace_once(
              materialization_test,
              '        self.assertEqual(len(reviewed), 29)\n'
              '        self.assertEqual(\n'
              '            Counter(item["review_state"] for item in reviewed),\n'
              '            Counter({"importable": 2, "source-not-stated": 7, "source-conflict": 2, "context-unmodeled": 18}),\n'
              '        )\n',
              '        self.assertEqual(len(reviewed), 28)\n'
              '        self.assertEqual(\n'
              '            Counter(item["review_state"] for item in reviewed),\n'
              '            Counter({"importable": 2, "source-not-stated": 6, "source-conflict": 2, "context-unmodeled": 18}),\n'
              '        )\n',
          )
          replace_once(
              materialization_test,
              '        self.assertEqual(amounts["spring_city_package"], 1800.0)\n'
              '        self.assertEqual(amounts["spring_power_package"], 3000.0)\n',
              '        self.assertEqual(amounts["spring_city_package"], 1800.0)\n'
              '        self.assertEqual(amounts["spring_power_package"], 3000.0)\n'
              '        essential = self.by_code["spring_essential_electric70_automatic"]\n'
              '        khaki = next(\n'
              '            item for item in essential["price_components"]\n'
              '            if item["code"] == "spring_colour_lichen_khaki"\n'
              '        )\n'
              '        self.assertEqual(khaki["amount"], 2300.0)\n'
              '        self.assertFalse(khaki.get("review_state"))\n',
          )
          replace_once(
              materialization_test,
              '        self.assertGreaterEqual(state["baseline"]["tests"], 1788)\n'
              '        self.assertEqual(state["baseline"]["rows"], 11713)\n',
              '        self.assertGreaterEqual(state["baseline"]["tests"], 1788)\n'
              '        current_id = state["current_package"]["package_id"]\n'
              '        expected_rows = 11714 if current_id in {\n'
              '            "spring_essential_khaki_price_apply_001",\n'
              '            "spring_standard_equipment_representation_review_001",\n'
              '        } else 11713\n'
              '        self.assertEqual(state["baseline"]["rows"], expected_rows)\n',
          )
          PY

      - name: Run focused downstream regressions
        run: |
          python -m unittest -v \
            tests.test_spring_exterior_colour_options \
            tests.test_commercial_items_20260703 \
            tests.test_registered_source_completeness_reconciliation_20260802 \
            tests.test_reviewed_gap_state_materialization_20260802

      - name: Commit repaired contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/import_spring_exterior_colour_options.py \
            tests/test_spring_exterior_colour_options.py \
            tests/test_commercial_items_20260703.py \
            tests/test_registered_source_completeness_reconciliation_20260802.py \
            tests/test_reviewed_gap_state_materialization_20260802.py
          git commit -m "test: preserve downstream contracts after Khaki price"
          git push origin HEAD:agent/spring-essential-khaki-price-apply-20260802
