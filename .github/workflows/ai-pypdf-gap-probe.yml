name: AI pypdf gap probe

on:
  push:
    branches:
      - ai/dacia-configurator-pdf-archive-20260809
    paths:
      - .github/workflows/ai-pypdf-gap-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --quiet pypdf
      - name: Probe page 3 and exact source review
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > project/pypdf-gap-probe-20260809.txt
          from pathlib import Path
          from pypdf import PdfReader
          p=Path('PDF/Cenniki/NOWE SANDERO expression Eco-G 120 f.pdf')
          r=PdfReader(str(p))
          print('pages=',len(r.pages))
          text=r.pages[2].extract_text() or ''
          print('page3_chars=',len(text))
          print('page3_nonspace=',len(''.join(text.split())))
          print('page3_prefix=',repr(text[:1000]))
          PY
          set +e
          python tools/dkb.py configuration-gap-source-review --verify \
            --json /tmp/gap-review.json --markdown /tmp/gap-review.md \
            >> project/pypdf-gap-probe-20260809.txt 2>&1
          code=$?
          set -e
          echo "review_exit_code=$code" >> project/pypdf-gap-probe-20260809.txt
      - name: Commit probe receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/pypdf-gap-probe-20260809.txt
          git commit -m "chore(quality): capture pypdf gap probe" || true
          git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
