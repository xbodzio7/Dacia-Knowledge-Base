name: Temporary Spring Dependent Report Fix

on:
  push:
    branches:
      - agent/spring-nonconflicting-common-technical-observations-migration-001
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'agent/spring-nonconflicting-common-technical-observations-migration-001'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-nonconflicting-common-technical-observations-migration-001
          fetch-depth: 1
      - name: Apply dependent-report repair
        shell: bash
        run: |
          set -euo pipefail
          base64 -d project/spring-migration-dependent-report-fix.patch.gz.b64 | gzip -d > /tmp/spring-dependent-report-fix.patch
          git apply --index /tmp/spring-dependent-report-fix.patch
          rm -f project/spring-migration-dependent-report-fix.patch.gz.b64
          rm -f .github/workflows/temporary-spring-dependent-report-fix.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: refresh dependent Spring completeness analysis'
          git push origin HEAD:agent/spring-nonconflicting-common-technical-observations-migration-001
