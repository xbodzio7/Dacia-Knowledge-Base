name: Materialize Jogger Brochure Cargo

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/materialize-jogger-brochure-cargo.yml
      - data/imports/configuration_cargo_values/jogger-brochure-cargo-20251217.json
      - tools/import_jogger_brochure_cargo_20260726.py
      - tools/complete_jogger_brochure_cargo_20260726.py
      - tests/test_jogger_brochure_cargo_20260726.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/jogger-brochure-cargo-import
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Materialize package and persist diagnostics
        run: |
          set +e
          : > .github/jogger-cargo-diagnostic.log
          status=0

          python tools/complete_jogger_brochure_cargo_20260726.py --apply >> .github/jogger-cargo-diagnostic.log 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            python tools/import_jogger_brochure_cargo_20260726.py --apply >> .github/jogger-cargo-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> .github/jogger-cargo-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/complete_jogger_brochure_cargo_20260726.py --check >> .github/jogger-cargo-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/import_jogger_brochure_cargo_20260726.py --check >> .github/jogger-cargo-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> .github/jogger-cargo-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' >> .github/jogger-cargo-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            git diff --check >> .github/jogger-cargo-diagnostic.log 2>&1 || status=$?
          fi

          cat .github/jogger-cargo-diagnostic.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(data): persist Jogger cargo materialization'
            git push origin HEAD:agent/jogger-brochure-cargo-import
          fi
          exit "$status"
