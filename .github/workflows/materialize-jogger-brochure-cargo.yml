name: Materialize Jogger Brochure Cargo

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/materialize-jogger-brochure-cargo.yml
      - data/imports/configuration_cargo_values/jogger-brochure-cargo-20251217.json
      - tools/import_jogger_brochure_cargo_20260726.py
      - tools/complete_jogger_brochure_cargo_20260726.py
      - tests/test_jogger_brochure_cargo_20260726.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/jogger-brochure-cargo-import
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Materialize package and run tests
        run: |
          set -euo pipefail
          python tools/complete_jogger_brochure_cargo_20260726.py --apply
          python tools/import_jogger_brochure_cargo_20260726.py --apply
          python tools/dkb.py project-state --apply
          python tools/complete_jogger_brochure_cargo_20260726.py --check
          python tools/import_jogger_brochure_cargo_20260726.py --check
          python tools/dkb.py project-state --check
          python -m unittest discover -s tests -p 'test_*.py'
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat(data): materialize Jogger brochure cargo values'
            git push origin HEAD:agent/jogger-brochure-cargo-import
          fi
