name: AI repair PR 465 contracts

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 465
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Regenerate canonical migration outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py --apply
          python3 tools/dkb.py project-state --apply || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: regenerate Spring white migration outputs'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
