name: AI validate PR 465

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.number == 465
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Validate migration and repository state
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q tools scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          python3 tools/dkb.py project-state --check
