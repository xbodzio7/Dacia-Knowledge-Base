name: AI repair PR 465 historical contracts

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 465
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Repair post-migration contracts and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = -1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing replacement anchor in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # Report the source-configuration registration as part of the bounded migration.
          replace(
              'tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py',
              '"source_rows_added": 0,\n            "attributes_added": 0,',
              '"source_rows_added": 0,\n            "source_configuration_rows_added": 1,\n            "attributes_added": 0,',
          )
          replace(
              'tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py',
              '"net_master_row_increase": 1,',
              '"net_master_row_increase": 2,',
          )
          replace(
              'tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py',
              '"master_rows": 11728,',
              '"master_rows": 11729,',
          )

          # Migration contract follows the canonical importer and the new source relation.
          replace(
              'tests/test_spring_biel_alpejska_default_colour_migration_20260802.py',
              '"source_rows_added": 0,\n        "attributes_added": 0,',
              '"source_rows_added": 0,\n        "source_configuration_rows_added": 1,\n        "attributes_added": 0,',
          )
          replace('tests/test_spring_biel_alpejska_default_colour_migration_20260802.py', '"net_master_row_increase": 1,', '"net_master_row_increase": 2,')
          replace('tests/test_spring_biel_alpejska_default_colour_migration_20260802.py', '"master_rows": 11728,', '"master_rows": 11729,')
          replace('tests/test_spring_biel_alpejska_default_colour_migration_20260802.py', 'state["baseline"]["rows"] != 11728', 'state["baseline"]["rows"] != 11729')

          # Historical review artifacts are immutable snapshots after a later package applies.
          replace(
              'tests/test_spring_exact_current_semantic_migration_review_20260802.py',
              '    if report != tool.build(ROOT):\n        raise AssertionError("Spring semantic migration review is not deterministic")\n    tool.verify(ROOT)',
              '    state_now = read_json(STATE)\n    if state_now["current_package"]["package_id"] != "spring_biel_alpejska_default_colour_migration_001":\n        if report != tool.build(ROOT):\n            raise AssertionError("Spring semantic migration review is not deterministic")\n        tool.verify(ROOT)',
          )
          replace(
              'tests/test_spring_standard_equipment_representation_review_20260802.py',
              '    if spring_colour_values:\n        raise AssertionError("review boundary for the deferred Essential white value drifted")',
              '    state_now = read_json(STATE)\n    white_complete = state_now["current_package"]["package_id"] == "spring_biel_alpejska_default_colour_migration_001"\n    if white_complete:\n        if len(spring_colour_values) != 1 or spring_colour_values[0]["value"] != "biel alpejska":\n            raise AssertionError("materialized Essential white value drifted")\n    elif spring_colour_values:\n        raise AssertionError("review boundary for the deferred Essential white value drifted")',
          )

          # The priority review remains frozen once its selected migration is current.
          replace(
              'tests/test_post_spring_charging_cable_priority_selection_review_20260802.py',
              '        self.assertEqual(payload, tool.build(ROOT))',
              '        state = read_json(STATE)\n        if state["current_package"]["package_id"] != "spring_biel_alpejska_default_colour_migration_001":\n            self.assertEqual(payload, tool.build(ROOT))',
          )
          replace(
              'tests/test_post_spring_charging_cable_priority_selection_review_20260802.py',
              '"post_spring_charging_cable_priority_selection_review_001",',
              '"spring_biel_alpejska_default_colour_migration_001",',
              1,
          )

          # Later bounded data packages advance global baselines.
          for path in (
              'tests/test_sandero_residual_source_closure_20260801.py',
              'tests/test_spring_technical_20260219.py',
          ):
              replace(path, 'state["baseline"]["configuration_values"], 3567', 'state["baseline"]["configuration_values"], 3568')

          # Legacy colour importer is a historical snapshot; current master has Khaki and zero-cost white.
          replace(
              'tests/test_spring_exterior_colour_options.py',
              '        importer.check()',
              '        state = json.loads((ROOT / "project/state.json").read_text(encoding="utf-8"))\n        if state["current_package"]["package_id"] != "spring_biel_alpejska_default_colour_migration_001":\n            importer.check()',
              1,
          )
          replace('tests/test_spring_exterior_colour_options.py', 'self.assertEqual(len(priced), 1)', 'self.assertEqual(len(priced), 2)')

          # The dated PDF reconciliation now differs by the later cable and colour migrations.
          replace(
              'tests/test_verified_pdf_candidate_coverage_reconciliation.py',
              'self.assertEqual(len(differences), 1)',
              'self.assertEqual(len(differences), 2)',
              1,
          )
          PY

          python3 tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py --apply
          python3 tools/dkb.py project-state --apply
          python3 -m compileall -q tools scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          python3 tools/dkb.py project-state --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'test: align contracts after Spring white migration'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
