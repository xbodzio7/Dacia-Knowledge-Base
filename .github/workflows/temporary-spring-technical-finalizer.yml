name: Temporary Spring Technical Finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temporary-spring-technical-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/spring-brochure-technical-observations-20260219'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Install PDF backend
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
      - name: Materialize canonical package
        run: |
          python tools/import_spring_technical_20260219.py --apply
          python tools/materialize_spring_technical_package_20260219.py
          python tools/dkb.py project-state --apply
          python tools/dkb.py documentation-baseline --apply
          rm -f tools/materialize_spring_technical_package_20260219.py
          rm -f .github/workflows/temporary-spring-technical-dispatcher.yml
          rm -f .github/workflows/temporary-spring-technical-finalizer.yml
      - name: Verify package and full quality
        run: |
          python tools/import_spring_technical_20260219.py --check
          python -m unittest -v tests.test_spring_technical_20260219
          python tools/dkb.py project-state --check
          python tools/dkb.py documentation-baseline --check
          python tools/dkb.py quality --concise --database "$RUNNER_TEMP/dkb.sqlite" --log-file "$RUNNER_TEMP/quality.log" --summary-json "$RUNNER_TEMP/quality-summary.json"
      - name: Commit clean package
        run: |
          git diff --check
          git diff --name-status origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat(data): add Spring brochure technical observations'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
