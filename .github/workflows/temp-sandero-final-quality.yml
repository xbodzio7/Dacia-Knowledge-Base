name: Temporary Sandero Final Quality

on:
  push:
    branches:
      - data/sandero-residual-source-closure-006
    paths:
      - .github/workflows/temp-sandero-final-quality.yml

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/sandero-residual-source-closure-006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Close rules and run final quality
        shell: bash
        run: |
          set +e
          export PYTHONPATH="$PWD:$PWD/tools"
          mkdir -p project/tmp/sandero-final-quality
          status=0
          python tools/patch_sandero_source_review_rules.py \
            > project/tmp/sandero-final-quality/patch.log 2>&1 || status=$?
          rm -f tools/patch_sandero_source_review_rules.py
          if [ "$status" -eq 0 ]; then
            python -m tools.import_sandero_residual_source_closure_20260801 \
              > project/tmp/sandero-final-quality/materialize.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m tools.align_sandero_residual_source_closure_contracts_20260801 \
              > project/tmp/sandero-final-quality/align.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply \
              > project/tmp/sandero-final-quality/project-state-apply.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m tools.import_sandero_residual_source_closure_20260801 --check \
              > project/tmp/sandero-final-quality/package-check.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m tools.align_sandero_residual_source_closure_contracts_20260801 --check \
              > project/tmp/sandero-final-quality/align-check.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py quality \
              --concise \
              --database "$RUNNER_TEMP/dacia_knowledge_base.sqlite" \
              --log-file project/tmp/sandero-final-quality/quality.log \
              --summary-json project/tmp/sandero-final-quality/quality-summary.json \
              > project/tmp/sandero-final-quality/quality-console.log 2>&1 || status=$?
          fi
          echo "$status" > project/tmp/sandero-final-quality/status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: close Sandero source-review rules" || true
          git push origin HEAD:data/sandero-residual-source-closure-006
          exit "$status"
