name: Temporary retry Data Products v1.9.0 audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-retry-audit-data-products-v1.9.0.yml'

permissions:
  contents: write

concurrency:
  group: data-products-v1.9.0-public-audit-retry
  cancel-in-progress: true

jobs:
  audit-and-record:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: xbodzio7/Dacia-Knowledge-Base
      PACKAGE_BRANCH: agent/data-products-v1.9.0-public-audit-20260731
      RELEASE_VERSION: 1.9.0
      RELEASE_TAG: data-products-v1.9.0
      SOURCE_COMMIT: 6c8f6f68c21022fa3bd6b6248d06b87d5d484d5c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/data-products-v1.9.0-public-audit-20260731
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Download verified public workspace from scratch
        shell: bash
        run: |
          set -euo pipefail
          python tools/dkb.py data-product-release-download \
            --version "$RELEASE_VERSION" \
            --output-directory "$RUNNER_TEMP/public-workspace"
          python tools/dkb.py data-product-workspace-verify \
            --workspace-directory "$RUNNER_TEMP/public-workspace" \
            --json > "$RUNNER_TEMP/workspace-verification.json"

      - name: Extract and run corrected audit contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tmp-audit-data-products-v1.9.0.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = "      - name: Audit public contents and semantic boundaries\n        shell: python\n        run: |\n"
          end_marker = "\n      - name: Commit exact one-file audit package"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          code = "\n".join(line[10:] if line.startswith('          ') else line for line in lines) + "\n"
          code = code.replace("'snapshot_date': '2026-07-31'", "'snapshot_date': '2026-07-24'")
          target = Path('/tmp/v1_9_0_public_audit.py')
          target.write_text(code, encoding='utf-8')
          PY
          python /tmp/v1_9_0_public_audit.py

      - name: Commit exact one-file audit package
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-audit-data-products-v1.9.0.yml
          rm .github/workflows/tmp-retry-audit-data-products-v1.9.0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/data-products-v1.9.0-public-audit.json
          git add -u .github/workflows/tmp-audit-data-products-v1.9.0.yml
          git add -u .github/workflows/tmp-retry-audit-data-products-v1.9.0.yml
          git commit -m 'release(data-products): independently audit public v1.9.0'
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          test "$changed" = '.github/data-products-v1.9.0-public-audit.json'
          git push origin "HEAD:$PACKAGE_BRANCH"
