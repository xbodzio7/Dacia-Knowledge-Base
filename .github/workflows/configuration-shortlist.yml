name: Configuration Shortlist

on:
  pull_request:
    paths-ignore:
      - project/state.json
      - project/STATE_SUMMARY.md
      - project/reviews/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shortlist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Generate shortlist artifacts
        run: |
          python tools/configuration_shortlist.py \
            --json "${RUNNER_TEMP}/configuration-shortlist-all.json" \
            --markdown "${RUNNER_TEMP}/configuration-shortlist-all.md" \
            --csv "${RUNNER_TEMP}/configuration-shortlist-all.csv"
          python tools/configuration_shortlist.py \
            --transmission automatic \
            --max-price 100000 \
            --json "${RUNNER_TEMP}/configuration-shortlist-automatic-under-100000.json" \
            --markdown "${RUNNER_TEMP}/configuration-shortlist-automatic-under-100000.md" \
            --csv "${RUNNER_TEMP}/configuration-shortlist-automatic-under-100000.csv"
      - name: Generate artifact manifest
        run: |
          python tools/quality_artifact_manifest.py \
            --output "${RUNNER_TEMP}/configuration-shortlist-manifest.json" \
            --file "${RUNNER_TEMP}/configuration-shortlist-all.json" \
            --file "${RUNNER_TEMP}/configuration-shortlist-all.md" \
            --file "${RUNNER_TEMP}/configuration-shortlist-all.csv" \
            --file "${RUNNER_TEMP}/configuration-shortlist-automatic-under-100000.json" \
            --file "${RUNNER_TEMP}/configuration-shortlist-automatic-under-100000.md" \
            --file "${RUNNER_TEMP}/configuration-shortlist-automatic-under-100000.csv"
      - name: Upload shortlist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: configuration-shortlist
          path: |
            ${{ runner.temp }}/configuration-shortlist-all.json
            ${{ runner.temp }}/configuration-shortlist-all.md
            ${{ runner.temp }}/configuration-shortlist-all.csv
            ${{ runner.temp }}/configuration-shortlist-automatic-under-100000.json
            ${{ runner.temp }}/configuration-shortlist-automatic-under-100000.md
            ${{ runner.temp }}/configuration-shortlist-automatic-under-100000.csv
            ${{ runner.temp }}/configuration-shortlist-manifest.json
          if-no-files-found: error
          retention-days: 7

  update-downloader-contract-test:
    if: github.head_ref == 'agent/cross-model-workspace-entry-point'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/cross-model-workspace-entry-point
          fetch-depth: 0
          persist-credentials: true
      - name: Update exact workflow assertions and restore this workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_data_product_release_download.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def test_workflow_is_read_only_and_checks_public_v1(self) -> None:
        workflow = (
            REPOSITORY
            / ".github/workflows/data-product-release-download.yml"
        ).read_text(encoding="utf-8")
        self.assertIn("contents: read", workflow)
        self.assertNotIn("contents: write", workflow)
        self.assertIn("ubuntu-latest", workflow)
        self.assertIn("windows-latest", workflow)
        self.assertIn("--version 1.0.0", workflow)
        self.assertIn("653ddacf9dcaeefa356f53e3c00e71666f5c5b3e", workflow)
'''
          new = '''    def test_workflow_is_read_only_and_checks_public_v1_8_1(self) -> None:
        workflow = (
            REPOSITORY
            / ".github/workflows/data-product-release-download.yml"
        ).read_text(encoding="utf-8")
        self.assertIn("contents: read", workflow)
        self.assertNotIn("contents: write", workflow)
        self.assertIn("ubuntu-latest", workflow)
        self.assertIn("windows-latest", workflow)
        self.assertIn("--version 1.8.1", workflow)
        self.assertIn("0b7009fd1950693e347638a6b96756aeefb43b8a", workflow)
        self.assertIn("len(local)==84", workflow)
        self.assertIn("Models and comparison scopes", workflow)
        self.assertIn("compare-workspace-index", workflow)
'''
          if old not in text:
              raise SystemExit("downloader workflow assertion block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")
          PY
          git checkout origin/main -- .github/workflows/configuration-shortlist.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_data_product_release_download.py .github/workflows/configuration-shortlist.yml
          git commit -m "test(workspace): update public downloader contract"
          git push origin HEAD:agent/cross-model-workspace-entry-point
