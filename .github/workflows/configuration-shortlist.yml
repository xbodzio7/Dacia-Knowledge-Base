name: Configuration Shortlist

on:
  pull_request:
    paths-ignore:
      - project/state.json
      - project/STATE_SUMMARY.md
      - project/reviews/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shortlist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Generate shortlist artifacts
        run: |
          python tools/configuration_shortlist.py \
            --json "${RUNNER_TEMP}/configuration-shortlist-all.json" \
            --markdown "${RUNNER_TEMP}/configuration-shortlist-all.md" \
            --csv "${RUNNER_TEMP}/configuration-shortlist-all.csv"
          python tools/configuration_shortlist.py \
            --transmission automatic \
            --max-price 100000 \
            --json "${RUNNER_TEMP}/configuration-shortlist-automatic-under-100000.json" \
            --markdown "${RUNNER_TEMP}/configuration-shortlist-automatic-under-100000.md" \
            --csv "${RUNNER_TEMP}/configuration-shortlist-automatic-under-100000.csv"
      - name: Generate artifact manifest
        run: |
          python tools/quality_artifact_manifest.py \
            --output "${RUNNER_TEMP}/configuration-shortlist-manifest.json" \
            --file "${RUNNER_TEMP}/configuration-shortlist-all.json" \
            --file "${RUNNER_TEMP}/configuration-shortlist-all.md" \
            --file "${RUNNER_TEMP}/configuration-shortlist-all.csv" \
            --file "${RUNNER_TEMP}/configuration-shortlist-automatic-under-100000.json" \
            --file "${RUNNER_TEMP}/configuration-shortlist-automatic-under-100000.md" \
            --file "${RUNNER_TEMP}/configuration-shortlist-automatic-under-100000.csv"
      - name: Upload shortlist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: configuration-shortlist
          path: |
            ${{ runner.temp }}/configuration-shortlist-all.json
            ${{ runner.temp }}/configuration-shortlist-all.md
            ${{ runner.temp }}/configuration-shortlist-all.csv
            ${{ runner.temp }}/configuration-shortlist-automatic-under-100000.json
            ${{ runner.temp }}/configuration-shortlist-automatic-under-100000.md
            ${{ runner.temp }}/configuration-shortlist-automatic-under-100000.csv
            ${{ runner.temp }}/configuration-shortlist-manifest.json
          if-no-files-found: error
          retention-days: 7

  materialize-cross-model-entry-point:
    if: github.head_ref == 'agent/cross-model-workspace-entry-point'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/cross-model-workspace-entry-point
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Materialize and restore workflow
        shell: bash
        run: |
          set +e
          git show 4a1649199236b3b323594689fbeae56c166a7bf8:.github/workflows/materialize-cross-model-workspace-entry-point.yml > "${RUNNER_TEMP}/original.yml"
          python - <<'PY' > "${RUNNER_TEMP}/materializer.log" 2>&1
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "original.yml"
          lines = path.read_text(encoding="utf-8").splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "from __future__ import annotations")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == "PY")
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines[start:end]
          ) + "\n"
          exec(compile(script, str(path), "exec"), {"__name__": "__main__"})
          PY
          status=$?
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> "${RUNNER_TEMP}/materializer.log" 2>&1
            status=$?
          fi
          git checkout origin/main -- .github/workflows/configuration-shortlist.yml
          rm -f .github/workflows/materialize-cross-model-workspace-entry-point-v4.yml
          rm -f .github/cross-model-workspace-entry-point.trigger
          rm -f .github/cross-model-workspace-entry-point-materializer.log
          if [ "$status" -ne 0 ]; then
            {
              echo "status: ${status}"
              echo "head_before_commit: $(git rev-parse HEAD)"
              echo "---"
              cat "${RUNNER_TEMP}/materializer.log"
            } > .github/cross-model-workspace-entry-point-materializer.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes to commit"
            exit 1
          fi
          git commit -m "feat(workspace): add cross-model entry point"
          git pull --rebase origin agent/cross-model-workspace-entry-point
          git push origin HEAD:agent/cross-model-workspace-entry-point
      - name: Upload materializer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cross-model-workspace-entry-point-materializer
          path: ${{ runner.temp }}/materializer.log
          if-no-files-found: error
          retention-days: 1
