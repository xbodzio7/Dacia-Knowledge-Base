name: Materialize Official Brochure Gap Resolution Closure

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/materialize-official-brochure-gap-resolution-closure.yml
      - data/reporting/official_brochure_technical_gap_resolution_closure_review.json
      - tools/review_official_brochure_technical_gap_resolution_closure_20260726.py
      - tools/materialize_official_brochure_technical_gap_resolution_closure_20260726.py
      - tests/test_official_brochure_technical_gap_resolution_closure.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/official-brochure-technical-gap-resolution-closure
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Materialize and validate closure review
        shell: bash
        run: |
          set +e
          log=.github/official-brochure-gap-resolution-closure.log
          : > "$log"
          status=0
          python tools/materialize_official_brochure_technical_gap_resolution_closure_20260726.py >> "$log" 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/review_official_brochure_technical_gap_resolution_closure_20260726.py --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py validate >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tests/test_official_brochure_technical_gap_resolution_closure.py -v >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' -v >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            git diff --check >> "$log" 2>&1 || status=$?
          fi
          cat "$log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'docs(data): materialize official brochure gap closure'
            git push origin HEAD:agent/official-brochure-technical-gap-resolution-closure
          fi
          exit "$status"
