name: AI dry-run current configurator PDF import
on:
  push:
    branches: [ai/dacia-configurator-pdf-archive-20260809]
    paths: [.github/workflows/ai-dry-run-current-configurator-pdf-import.yml]
permissions:
  contents: write
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Dry-run importer
        run: python tools/import_current_configurator_pdfs_20260809.py
      - name: Commit dry-run report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reporting/dacia_configurator_pdf_canonical_import_20260809.json
          git commit -m "data(reporting): dry-run current configurator PDF import"
          git pull --rebase origin ai/dacia-configurator-pdf-archive-20260809
          git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
