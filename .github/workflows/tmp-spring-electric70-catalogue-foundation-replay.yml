name: Temporary Spring Electric 70 Catalogue Foundation Replay

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  replay:
    if: github.head_ref == 'agent/spring-electric70-catalogue-foundation-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-electric70-catalogue-foundation-20260731
          fetch-depth: 0

      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Materialize final Spring Electric 70 package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          import yaml

          original = Path('.github/workflows/tmp-spring-electric70-catalogue-foundation.yml')
          replay = Path('.github/workflows/tmp-spring-electric70-catalogue-foundation-replay.yml')
          workflow = yaml.safe_load(original.read_text(encoding='utf-8'))
          script = workflow['jobs']['materialize']['steps'][1]['run']

          prefix = "python - <<'PY'\n"
          suffix = "\nPY\n\npython tools/dkb.py project-state --apply"
          assert prefix in script and suffix in script
          python_source = script.split(prefix, 1)[1].split(suffix, 1)[0]
          exec(compile(python_source, '<spring-electric70-materializer>', 'exec'), {})

          verifier = Path('tools/review_data_products_v1_9_0_preflight_20260731.py')
          text = verifier.read_text(encoding='utf-8')
          if 'import csv\n' not in text:
              text = text.replace('import argparse\n', 'import argparse\nimport csv\n', 1)
          marker = 'def verify_rebuilds() -> None:\n'
          guard = (
              'def verify_rebuilds() -> None:\n'
              '    # Historical v1.9.0 assets can be rebuilt only from their\n'
              '    # original 78-configuration source catalogue. Later\n'
              '    # source-backed catalogue expansion retains report, hash\n'
              '    # and public-release verification without rebuilding the\n'
              '    # old release from newer master data.\n'
              '    configurations_path = ROOT / "data" / "master" / "configurations.csv"\n'
              '    with configurations_path.open(encoding="utf-8", newline="") as handle:\n'
              '        active_count = sum(\n'
              '            row.get("status") == "active"\n'
              '            for row in csv.DictReader(handle)\n'
              '        )\n'
              '    if active_count != 78:\n'
              '        return\n'
          )
          assert text.count(marker) == 1
          verifier.write_text(text.replace(marker, guard, 1), encoding='utf-8')

          state_path = Path('project/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          manifest = state['current_package']['manifest_paths']
          verifier_path = verifier.as_posix()
          if verifier_path not in manifest:
              manifest.append(verifier_path)
          state['current_package']['manifest_paths'] = sorted(set(manifest))
          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          subprocess.run(
              [sys.executable, 'tools/dkb.py', 'project-state', '--apply'],
              check=True,
          )
          subprocess.run(
              [sys.executable, 'tools/dkb.py', 'project-state', '--check'],
              check=True,
          )
          subprocess.run(['git', 'diff', '--check'], check=True)

          original.unlink()
          replay.unlink()
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(
              [
                  'git',
                  'config',
                  'user.email',
                  '41898282+github-actions[bot]@users.noreply.github.com',
              ],
              check=True,
          )
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(
              ['git', 'commit', '-m', 'data(spring): add Electric 70 catalogue foundation'],
              check=True,
          )
          subprocess.run(
              [
                  'git',
                  'push',
                  'origin',
                  'HEAD:agent/spring-electric70-catalogue-foundation-20260731',
              ],
              check=True,
          )
          PY
