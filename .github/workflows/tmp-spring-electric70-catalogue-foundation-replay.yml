name: Temporary Spring Electric 70 Catalogue Foundation Replay

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  replay:
    if: github.head_ref == 'agent/spring-electric70-catalogue-foundation-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-electric70-catalogue-foundation-20260731
          fetch-depth: 0

      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Replay materializer with historical preflight guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path

          import yaml

          original = Path('.github/workflows/tmp-spring-electric70-catalogue-foundation.yml')
          replay = Path('.github/workflows/tmp-spring-electric70-catalogue-foundation-replay.yml')
          workflow = yaml.safe_load(original.read_text(encoding='utf-8'))
          script = workflow['jobs']['materialize']['steps'][1]['run']

          patch = r'''
          python - <<'PATCHPY'
          import json
          from pathlib import Path

          path = Path('tools/review_data_products_v1_9_0_preflight_20260731.py')
          text = path.read_text(encoding='utf-8')
          marker = 'def verify_rebuilds() -> None:\n'
          guard = '''def verify_rebuilds() -> None:\n    # Historical v1.9.0 assets can be rebuilt only from their 78-configuration\n    # source catalogue. After later source-backed catalogue expansion, retain\n    # report, hash and public-release verification without pretending that the\n    # old release can be reconstructed from new master data.\n    configurations_path = ROOT / "data" / "master" / "configurations.csv"\n    active_count = sum(\n        1\n        for line in configurations_path.read_text(encoding="utf-8-sig").splitlines()[1:]\n        if line and ",active," in f",{line},"\n    )\n    if active_count != 78:\n        return\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, guard, 1)
          path.write_text(text, encoding='utf-8')

          state_path = Path('project/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          manifest = state['current_package']['manifest_paths']
          verifier = 'tools/review_data_products_v1_9_0_preflight_20260731.py'
          if verifier not in manifest:
              manifest.append(verifier)
          state['current_package']['manifest_paths'] = sorted(set(manifest))
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PATCHPY
          '''
          script = script.replace(
              'python tools/dkb.py project-state --apply',
              patch + '\npython tools/dkb.py project-state --apply',
              1,
          )
          replay.unlink()
          subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
          PY
