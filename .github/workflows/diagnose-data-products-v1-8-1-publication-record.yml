name: Diagnose Data Products v1.8.1 Publication Record

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/diagnose-data-products-v1-8-1-publication-record.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication-record branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/data-products-v1-8-1-publication-record
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Extract and run materialization block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/materialize-data-products-v1-8-1-publication-record.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = lines.index('      - name: Materialize publication record and contracts')
          run_index = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          end = next(i for i in range(run_index + 1, len(lines)) if lines[i].startswith('      - name: '))
          script_lines = []
          for line in lines[run_index + 1:end]:
              if line.startswith('          '):
                  script_lines.append(line[10:])
              else:
                  script_lines.append(line)
          Path('/tmp/materialize-publication-record.sh').write_text('\n'.join(script_lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/materialize-publication-record.sh
          python tools/dkb.py project-state --apply
          python tools/dkb.py project-state --check
          python -m py_compile \
            tools/review_data_products_v1_8_1_publication_20260727.py \
            tools/review_data_products_v1_8_1_preflight_20260727.py \
            tests/test_data_products_v1_8_1_publication.py \
            tests/test_data_products_v1_8_1_preflight.py

      - name: Record focused command results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          commands = [
              ['python', 'tools/review_data_products_v1_8_1_release_preparation_20260727.py', '--check'],
              ['python', 'tools/review_data_products_v1_8_1_preflight_20260727.py', '--check'],
              ['python', 'tools/review_data_products_v1_8_1_publication_20260727.py', '--check'],
              ['python', '-m', 'unittest', '-q', 'tests.test_data_products_v1_8_1_release_preparation'],
              ['python', '-m', 'unittest', '-q', 'tests.test_data_products_v1_8_1_preflight'],
              ['python', '-m', 'unittest', '-q', 'tests.test_data_products_v1_8_1_publication'],
          ]
          results = []
          for command in commands:
              completed = subprocess.run(command, text=True, capture_output=True, check=False)
              results.append({
                  'command': command,
                  'returncode': completed.returncode,
                  'stdout': completed.stdout,
                  'stderr': completed.stderr,
              })
          output = Path('.github/data-products-v1.8.1-publication-record-diagnostic.json')
          output.write_text(json.dumps({'results': results}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/data-products-v1.8.1-publication-record-diagnostic.json
          git commit -m 'ci(release): diagnose v1.8.1 publication record'
          git push origin HEAD:agent/data-products-v1-8-1-publication-record
