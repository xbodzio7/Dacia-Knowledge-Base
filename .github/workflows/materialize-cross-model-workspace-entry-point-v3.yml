name: Materialize Cross-Model Workspace Entry Point v3

on:
  push:
    branches:
      - agent/cross-model-workspace-entry-point

permissions:
  contents: write

concurrency:
  group: materialize-cross-model-workspace-entry-point
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/cross-model-workspace-entry-point
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Materialize or record exact failure
        shell: bash
        run: |
          set +e
          git show 4a1649199236b3b323594689fbeae56c166a7bf8:.github/workflows/materialize-cross-model-workspace-entry-point.yml > "${RUNNER_TEMP}/original.yml"
          python - <<'PY' > "${RUNNER_TEMP}/materializer.log" 2>&1
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "original.yml"
          lines = path.read_text(encoding="utf-8").splitlines()
          start = next(
              index
              for index, line in enumerate(lines)
              if line.strip() == "from __future__ import annotations"
          )
          end = next(
              index
              for index in range(start + 1, len(lines))
              if lines[index].strip() == "PY"
          )
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines[start:end]
          ) + "\n"
          exec(compile(script, str(path), "exec"), {"__name__": "__main__"})
          PY
          status=$?
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> "${RUNNER_TEMP}/materializer.log" 2>&1
            status=$?
          fi
          mkdir -p .github
          {
            echo "status: ${status}"
            echo "head_before_commit: $(git rev-parse HEAD)"
            echo "---"
            cat "${RUNNER_TEMP}/materializer.log"
          } > .github/cross-model-workspace-entry-point-materializer.log
          rm -f .github/cross-model-workspace-entry-point.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(workspace): materialize cross-model entry point"
          git push origin HEAD:agent/cross-model-workspace-entry-point
