        actual = selected_by_codes(read_rows(path), {row["code"] for row in expected})
        if semantic(actual, fields[1:]) != semantic(expected, fields[1:]):
            raise ContractError(f"stored observations differ from generated contract: {path}")
        ids = sorted(int(row["id"]) for row in actual)
        if ids != list(range(first_id, last_id + 1)):
            raise ContractError(f"observation IDs differ from exact suffix {first_id}-{last_id}: {path}")
