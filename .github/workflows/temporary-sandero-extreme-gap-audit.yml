def update_analysis_outputs() -> dict[str, object]:
    payload = analysis.collect(ROOT)
    write_json(analysis.OUT_JSON, payload)
    analysis.OUT_MD.write_text(analysis.render_markdown(payload), encoding="utf-8")
    return payload


