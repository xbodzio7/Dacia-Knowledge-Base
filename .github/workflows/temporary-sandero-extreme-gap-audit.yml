import json
import unittest
from pathlib import Path

from tools import import_sandero_stepway_extreme_source_gap_20260626 as package

ROOT = Path(__file__).resolve().parents[1]


class SanderoStepwayExtremeSourceGapTests(unittest.TestCase):
    @classmethod
    def setUpClass(cls) -> None:
        cls.spec = package.load_spec()
        cls.values = package.generated_value_rows(cls.spec)
