name: Temporary Sandero Extreme Source Gap Materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temporary-sandero-extreme-gap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/sandero-extreme-source-gap-20260801'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install PDF backend
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
      - name: Apply package
        run: |
          python -m tools.import_sandero_stepway_extreme_source_gap_20260626
          python -m tools.close_stepway_extreme_reporting_dependencies_20260801
          python tools/dkb.py configuration-gap-resolution-plan \
            --write-plan-spec data/reporting/configuration_gap_resolution_plan.json \
            --json "$RUNNER_TEMP/configuration-gap-resolution-plan.json" \
            --markdown "$RUNNER_TEMP/configuration-gap-resolution-plan.md"
          python tools/dkb.py project-state --apply
          python -m tools.align_sandero_stepway_extreme_snapshot_contracts_20260801
          python tools/dkb.py project-state --apply
          python tools/dkb.py documentation-baseline --apply
          python -m tools.import_sandero_stepway_extreme_source_gap_20260626 --check
          python -m tools.close_stepway_extreme_reporting_dependencies_20260801 --check
          python tools/dkb.py project-state --check
      - name: Run focused tests
        run: |
          python -m unittest -v tests.test_sandero_stepway_extreme_source_gap_20260626
          python -m unittest -v tests.test_sandero_ecog120_manual_reporting_scope
          python -m unittest -v tests.configuration_comparison_context_filter_contract
          python -m unittest -v tests.configuration_comparison_pair_summary_contract
          python -m unittest -v tests.test_configuration_value_ranges
          python -m unittest -v tests.test_sandero_equipment_availability
          python -m unittest -v tests.test_official_brochure_residual_evidence_review
      - name: Run full quality gate
        run: |
          set +e
          python tools/dkb.py quality --database "$RUNNER_TEMP/dkb.sqlite" > "$RUNNER_TEMP/quality.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            grep -nE 'FAIL|ERROR|AssertionError|Traceback|FAILED|expected|actual|ContractError|AlignmentError' "$RUNNER_TEMP/quality.log" | tail -n 180 || true
            tail -n 300 "$RUNNER_TEMP/quality.log"
          else
            tail -n 100 "$RUNNER_TEMP/quality.log"
          fi
          exit "$code"
      - name: Commit generated package
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- ':!.github/workflows/temporary-sandero-extreme-gap-audit.yml'
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'data: close Sandero Stepway Extreme source gap'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
