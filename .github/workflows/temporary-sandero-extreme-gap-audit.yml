    if summary["missing_technical_count"] != 115:
        raise ContractError(f"expected 115 remaining technical records, found {summary['missing_technical_count']}")
    if summary["exhausted_source_candidate_count"] != 4:
        raise ContractError(f"expected four exhausted-source candidates, found {summary['exhausted_source_candidate_count']}")
    current = next(item for item in expected_analysis["ranked_candidates"] if item["source_code"] == SOURCE_CODE)
    if current["missing_technical"] != 8 or current["selection_status"] != EXHAUSTED_CLASSIFICATION:
        raise ContractError(f"unexpected post-review source candidate: {current}")
    resolved_technical = {"ground_clearance", "overall_height", "overall_width_with_mirrors", "max_torque_rpm"}
    scoped = [item for item in expected_analysis["configurations"] if item["configuration_code"] == CONFIGURATION]
    if not scoped:
        raise ContractError("exact configuration is absent from completeness analysis")
    for item in scoped:
        missing_technical = {slot["attribute_code"] for slot in item["missing_technical_slots"]}
