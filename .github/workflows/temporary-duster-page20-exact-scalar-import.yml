name: Temporary Duster page 20 exact scalar import

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/duster-page20-exact-scalar-import-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/duster-page20-exact-scalar-import-20260730
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install PDF text extraction backend
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Align exact Polish source literals
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/temporary_materialize_duster_page20_exact_scalar_import.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('Filtr cząstek stałych Da Da', 'Filtr cząstek stałych(1) Tak Tak'),
              ('Stop & Start Da Da', 'Stop & Start(2) Tak Tak'),
              ('Tryb Eco Da Da', 'Tryb Eco Tak'),
              ('Dopuszczalna masa całkowita pojazdu (DMC) 1805 1830', 'Dopuszczalna masa całkowita (DMC) pojazdu 1805 1830'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'source literal target count is {text.count(old)}: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Materialize and validate import
        run: python tools/temporary_materialize_duster_page20_exact_scalar_import.py
      - name: Commit final package and remove temporary tools
        run: |
          rm .github/workflows/temporary-duster-page20-exact-scalar-import.yml
          rm tools/temporary_materialize_duster_page20_exact_scalar_import.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/imports/configuration_values/duster-mini-page20-emission-standard-20251020.json \
            data/imports/configuration_values/duster-mini-page20-particulate-filter-20251020.json \
            data/imports/configuration_values/duster-mini-page20-start-stop-20251020.json \
            data/imports/configuration_values/duster-mini-page20-eco-mode-20251020.json \
            data/imports/configuration_values/duster-mini-page20-gross-vehicle-weight-20251020.json \
            data/master/configuration_attribute_values.csv \
            tests/test_duster_mini_page20_exact_scalar_gap_import.py \
            data/reporting/verified_pdf_candidate_coverage_reconciliation.json \
            data/reporting/verified_pdf_candidate_coverage_reconciliation.md \
            tests/test_verified_pdf_candidate_coverage_reconciliation.py \
            tests/test_verified_pdf_candidate_residual_gap_prioritization.py \
            tools/review_official_brochure_technical_gap_resolution_closure_20260726.py \
            tests/test_official_brochure_technical_gap_resolution_closure.py \
            README.md CHANGELOG.md project/ROADMAP.md project/SESSION_STATE.md \
            project/state.json project/STATE_SUMMARY.md \
            .github/workflows/temporary-duster-page20-exact-scalar-import.yml \
            tools/temporary_materialize_duster_page20_exact_scalar_import.py
          git commit -m "data(duster): add page 20 exact scalar gaps"
          git push origin HEAD:agent/duster-page20-exact-scalar-import-20260730
