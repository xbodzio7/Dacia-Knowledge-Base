name: Temporary Duster page 20 exact scalar import

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/duster-page20-exact-scalar-import-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/duster-page20-exact-scalar-import-20260730
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install PDF text extraction backend
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Align exact source and dependent contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} target count is {count}: {old!r}')
              return text.replace(old, new)

          script = Path('tools/temporary_materialize_duster_page20_exact_scalar_import.py')
          text = script.read_text(encoding='utf-8')
          replacements = [
              ('Filtr cząstek stałych Da Da', 'Filtr cząstek stałych(1) Tak Tak'),
              ('Stop & Start Da Da', 'Stop & Start(2) Tak Tak'),
              ('OSIĄGI I ZUŻYCIE PALIWA', 'OSIĄGI'),
              ('Tryb Eco Da Da', 'Tryb Eco Tak'),
              ('Dopuszczalna masa całkowita pojazdu (DMC) 1805 1830', 'Dopuszczalna masa całkowita (DMC) pojazdu 1805 1830'),
          ]
          for old, new in replacements:
              text = replace_once(text, old, new, 'source literal')

          manifest_anchor = '            "tests/test_duster_mini_page20_exact_scalar_gap_import.py",\n'
          manifest_extension = manifest_anchor + ''.join([
              '            "data/reporting/duster_ecog120_completeness.json",\n',
              '            "data/reporting/duster_mildhybrid140_4x2_completeness.json",\n',
              '            "tests/test_duster_ecog120_reporting_scope.py",\n',
              '            "tests/test_attribute_enum_domains.py",\n',
              '            "tests/test_bigster_page20_eco_mode.py",\n',
              '            "tests/test_sandero_euro_6e_bis_model.py",\n',
          ])
          text = replace_once(text, manifest_anchor, manifest_extension, 'state manifest')
          script.write_text(text, encoding='utf-8', newline='\n')

          new_slots = [
              {"attribute_code": "eco_mode", "fuel_type_code": ""},
              {"attribute_code": "emission_standard", "fuel_type_code": ""},
              {"attribute_code": "gross_vehicle_weight", "fuel_type_code": ""},
              {"attribute_code": "particulate_filter", "fuel_type_code": ""},
              {"attribute_code": "start_stop_system", "fuel_type_code": ""},
          ]
          for path_text in (
              'data/reporting/duster_ecog120_completeness.json',
              'data/reporting/duster_mildhybrid140_4x2_completeness.json',
          ):
              path = Path(path_text)
              payload = json.loads(path.read_text(encoding='utf-8'))
              existing = {
                  (row['attribute_code'], row.get('fuel_type_code', ''))
                  for row in payload['technical_slots']
              }
              for slot in new_slots:
                  key = (slot['attribute_code'], slot['fuel_type_code'])
                  if key in existing:
                      raise SystemExit(f'{path}: technical slot already exists: {key}')
                  payload['technical_slots'].append(slot)
              payload['technical_slots'].sort(
                  key=lambda row: (row['attribute_code'], row.get('fuel_type_code', ''))
              )
              path.write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
                  newline='\n',
              )

          file_replacements = {
              'tests/test_duster_ecog120_reporting_scope.py': [
                  ('        "technical_slots": 37,\n', '        "technical_slots": 42,\n'),
                  ('        "technical_records": 148,\n', '        "technical_records": 168,\n'),
                  ('        "technical_comparisons": 240,\n', '        "technical_comparisons": 270,\n'),
                  ('        "technical_slots": 34,\n', '        "technical_slots": 39,\n'),
                  ('        "technical_records": 102,\n', '        "technical_records": 117,\n'),
                  ('        "technical_comparisons": 123,\n', '        "technical_comparisons": 138,\n'),
              ],
              'tests/test_attribute_enum_domains.py': [
                  ('        self.assertEqual(len(enum_rows), 232)\n', '        self.assertEqual(len(enum_rows), 239)\n'),
              ],
              'tests/test_bigster_page20_eco_mode.py': [
                  ('        self.assertEqual(len(all_eco), 14)\n', '        self.assertEqual(len(all_eco), 21)\n'),
              ],
              'tests/test_sandero_euro_6e_bis_model.py': [
                  ('        self.assertEqual(len(all_emission_values), 65)\n', '        self.assertEqual(len(all_emission_values), 72)\n'),
              ],
          }
          for path_text, pairs in file_replacements.items():
              path = Path(path_text)
              current = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  current = replace_once(current, old, new, path_text)
              path.write_text(current, encoding='utf-8', newline='\n')
          PY
      - name: Materialize and validate import
        run: python tools/temporary_materialize_duster_page20_exact_scalar_import.py
      - name: Commit final package and remove temporary tools
        run: |
          rm .github/workflows/temporary-duster-page20-exact-scalar-import.yml
          rm tools/temporary_materialize_duster_page20_exact_scalar_import.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/imports/configuration_values/duster-mini-page20-emission-standard-20251020.json \
            data/imports/configuration_values/duster-mini-page20-particulate-filter-20251020.json \
            data/imports/configuration_values/duster-mini-page20-start-stop-20251020.json \
            data/imports/configuration_values/duster-mini-page20-eco-mode-20251020.json \
            data/imports/configuration_values/duster-mini-page20-gross-vehicle-weight-20251020.json \
            data/master/configuration_attribute_values.csv \
            tests/test_duster_mini_page20_exact_scalar_gap_import.py \
            data/reporting/duster_ecog120_completeness.json \
            data/reporting/duster_mildhybrid140_4x2_completeness.json \
            tests/test_duster_ecog120_reporting_scope.py \
            tests/test_attribute_enum_domains.py \
            tests/test_bigster_page20_eco_mode.py \
            tests/test_sandero_euro_6e_bis_model.py \
            data/reporting/verified_pdf_candidate_coverage_reconciliation.json \
            data/reporting/verified_pdf_candidate_coverage_reconciliation.md \
            tests/test_verified_pdf_candidate_coverage_reconciliation.py \
            tests/test_verified_pdf_candidate_residual_gap_prioritization.py \
            tools/review_official_brochure_technical_gap_resolution_closure_20260726.py \
            tests/test_official_brochure_technical_gap_resolution_closure.py \
            README.md CHANGELOG.md project/ROADMAP.md project/SESSION_STATE.md \
            project/state.json project/STATE_SUMMARY.md \
            .github/workflows/temporary-duster-page20-exact-scalar-import.yml \
            tools/temporary_materialize_duster_page20_exact_scalar_import.py
          git commit -m "data(duster): add page 20 exact scalar gaps"
          git push origin HEAD:agent/duster-page20-exact-scalar-import-20260730
