name: Materialize Sandero Stepway Residual Equipment

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Materialize bounded residual equipment
        run: python tools/materialize_sandero_stepway_full_modal_residual_equipment_20260910.py --apply

      - name: Run focused tests
        run: python -m unittest -q tests/test_sandero_stepway_full_modal_residual_equipment_20260910.py

      - name: Commit generated master data and remove temporary workflow
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master/configuration_attribute_availability.csv
          git rm .github/workflows/materialize-sandero-stepway-residual-equipment.yml
          git diff --cached --check
          git commit -m "data(sandero): materialize residual standard equipment [skip ci]"
          git push origin "HEAD:${HEAD_BRANCH}"