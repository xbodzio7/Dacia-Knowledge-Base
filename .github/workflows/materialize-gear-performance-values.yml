name: Materialize Gear Performance Values

on:
  push:
    branches:
      - agent/brochure-gear-performance-value-import
    paths:
      - .github/workflows/materialize-gear-performance-values.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/brochure-gear-performance-value-import
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Materialize values and verify package
        shell: bash
        run: |
          set +e
          log=.github/gear-performance-materialization.log
          : > "$log"
          status=0

          python - <<'PY' >> "$log" 2>&1 || status=$?
          from pathlib import Path

          replacements = {
              Path('tools/import_brochure_gear_performance_20260726.py'): (
                  'EXPECTED_FUEL_COUNTS = {"lpg": 30, "petrol": 40}',
                  'EXPECTED_FUEL_COUNTS = {"lpg": 29, "petrol": 41}',
              ),
              Path('tests/test_brochure_gear_performance_values_20260726.py'): (
                  'Counter({"lpg": 30, "petrol": 40})',
                  'Counter({"lpg": 29, "petrol": 41})',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if new not in text:
                  if old not in text:
                      raise RuntimeError(f'fuel-count anchor missing: {path}')
                  path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('PASS: corrected reviewed fuel distribution to LPG=29, petrol=41')
          PY

          if [ "$status" -eq 0 ]; then
            python tools/import_brochure_gear_performance_20260726.py --apply >> "$log" 2>&1 || status=$?
          fi

          if [ "$status" -eq 0 ]; then
            python - <<'PY' >> "$log" 2>&1 || status=$?
          import json
          from pathlib import Path

          state_path = Path('project/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['updated_on'] = '2026-07-26'
          state['phase'] = 'Brochure Gear-Specific Performance Value Import'
          state['current_package'] = {
              'name': 'Brochure Gear-Specific Performance Value Import',
              'status': 'complete',
              'goal': 'Import exact Sandero, Sandero Stepway and Jogger 80-120 km/h elasticity observations with selected-gear, fuel and exact-configuration context.',
          }
          state['next_package'] = {
              'name': 'Brochure Gear-Specific Performance Import Closure Review',
              'status': 'planned',
              'goal': 'Verify the cross-model selected-gear import milestone, reporting preservation and all explicit non-import boundaries before selecting the next evidence package.',
          }
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = '* Imported 70 exact `elasticity_80_120` observations from the official Sandero, Sandero Stepway and Jogger brochures across 31 configurations, preserving selected gear, fuel and five-/seven-seat context without filling unstated Stepway automatic gears.\n'
          if entry not in changelog:
              marker = '### Added\n\n'
              if marker not in changelog:
                  raise RuntimeError('CHANGELOG Added marker missing')
              changelog = changelog.replace(marker, marker + entry, 1)
              changelog_path.write_text(changelog, encoding='utf-8')
          print('PASS: package state and changelog updated')
          PY
          fi

          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/import_brochure_gear_performance_20260726.py --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py validate >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tests/test_brochure_gear_performance_values_20260726.py -v >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' -v >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            git diff --check >> "$log" 2>&1 || status=$?
          fi

          cat "$log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat(data): materialize selected-gear performance values'
            git push origin HEAD:agent/brochure-gear-performance-value-import
          fi
          exit "$status"
