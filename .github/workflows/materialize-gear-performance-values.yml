name: Materialize Gear Performance Values

on:
  push:
    branches:
      - agent/brochure-gear-performance-value-import
    paths:
      - .github/workflows/materialize-gear-performance-values.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/brochure-gear-performance-value-import
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Capture updated reporting fixtures
        shell: bash
        run: |
          set +e
          log=.github/gear-performance-fixture-capture.log
          : > "$log"
          status=0

          python - <<'PY' >> "$log" 2>&1 || status=$?
          from __future__ import annotations

          import json
          import re
          import sys
          from pathlib import Path

          root = Path('.')
          sys.path.insert(0, str(root / 'tools'))

          import configuration_completeness
          import configuration_comparison
          import source_coverage

          test_files = [
              'tests/test_sandero_ecog120_manual_reporting_scope.py',
              'tests/test_sandero_stepway_ecog120_automatic_reporting_scope.py',
              'tests/test_jogger_ecog120_manual_reporting_scope.py',
              'tests/test_jogger_ecog120_automatic_reporting_scope.py',
              'tests/test_jogger_tce110_manual_reporting_scope.py',
              'tests/test_jogger_hybrid155_automatic_reporting_scope.py',
          ]

          result = {}
          for filename in test_files:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              as_of_match = re.search(r'^AS_OF\s*=\s*"([^"]+)"', text, re.MULTILINE)
              spec_match = re.search(r'^(?:SPEC|COMPLETENESS)\s*=\s*REPOSITORY\s*/\s*"([^"]+)"', text, re.MULTILINE)
              evidence_match = re.search(r'^EVIDENCE\s*=\s*REPOSITORY\s*/\s*"([^"]+)"', text, re.MULTILINE)
              if not (as_of_match and spec_match and evidence_match):
                  raise RuntimeError(f'cannot parse reporting constants: {filename}')
              as_of = as_of_match.group(1)
              spec = root / spec_match.group(1)
              evidence = root / evidence_match.group(1)
              completeness = configuration_completeness.collect_report(root, spec, as_of)
              coverage = source_coverage.collect_report(root, spec, as_of)
              comparison = configuration_comparison.collect_report(root, spec, evidence, as_of)
              result[path.name] = {
                  'as_of': as_of,
                  'scope': completeness['scope'],
                  'technical': completeness['technical'],
                  'coverage_technical': coverage['records']['technical'],
                  'comparison_summary': comparison['summary'],
              }

          default_comparison = configuration_comparison.collect_report(
              root,
              root / configuration_comparison.DEFAULT_COMPLETENESS_SPEC,
              root / configuration_comparison.DEFAULT_EVIDENCE_SPEC,
          )
          result['_default_comparison_summary'] = default_comparison['summary']
          result['_repository'] = {
              'master_rows': 8852,
              'configuration_values': 2188,
              'import_specs': 117,
              'gear_populated': 70,
          }
          output = root / '.github' / 'gear-performance-expected-fixtures.json'
          output.write_text(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(output.read_text(encoding='utf-8'))
          PY

          cat "$log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/gear-performance-fixture-capture.log .github/gear-performance-expected-fixtures.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore(test): capture selected-gear reporting fixtures'
            git push origin HEAD:agent/brochure-gear-performance-value-import
          fi
          exit "$status"
