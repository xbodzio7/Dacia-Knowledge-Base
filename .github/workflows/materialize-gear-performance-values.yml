name: Materialize Gear Performance Values

on:
  push:
    branches:
      - agent/brochure-gear-performance-value-import
    paths:
      - .github/workflows/materialize-gear-performance-values.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/brochure-gear-performance-value-import
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Repair remaining gear-aware keys and verify
        shell: bash
        run: |
          set +e
          log=.github/gear-performance-materialization.log
          : > "$log"
          status=0

          python - <<'PY' >> "$log" 2>&1 || status=$?
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f'anchor missing in {path}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          source = Path('tools/_source_coverage_base.py')
          replace_once(
              source,
              '    annotate_scalar_values,\n    read_context_rows,\n',
              '    annotate_scalar_values,\n    observation_signature,\n    read_context_rows,\n',
          )
          replace_once(
              source,
              'field not in {"fuel_type_code", "_cargo_context_signature"}',
              'field not in {"fuel_type_code", "gear_number", "_cargo_context_signature"}',
          )
          replace_once(
              source,
              '{**row, "_cargo_context_signature": "", "_cargo_context": None}',
              '{**row, "gear_number": "", "_cargo_context_signature": "", "_cargo_context": None}',
          )
          text = source.read_text(encoding='utf-8')
          old = '            "fuel_type_code",\n            "_cargo_context_signature",\n'
          new = '            "fuel_type_code",\n            "gear_number",\n            "_cargo_context_signature",\n'
          occurrences = text.count(old)
          if occurrences:
              source.write_text(text.replace(old, new), encoding='utf-8')
          replace_once(
              source,
              '        current_value_groups.setdefault(base_key, {})[current_key[3]] = current_row',
              '        signature = observation_signature(current_key[3], current_key[4])\n        current_value_groups.setdefault(base_key, {})[signature] = current_row',
          )

          gap = Path('tools/configuration_gap_resolution_plan.py')
          replace_once(
              gap,
              'from reporting.cargo_context import context_index, semantic_signature',
              'from reporting.cargo_context import context_index, semantic_signature',
          )
          replace_once(
              gap,
              '        default_fuel = require_string(\n            payload.get("fuel_type_code", ""),\n            f"{path.name}.fuel_type_code",\n            allow_empty=True,\n        )\n',
              '        default_fuel = require_string(\n            payload.get("fuel_type_code", ""),\n            f"{path.name}.fuel_type_code",\n            allow_empty=True,\n        )\n        default_gear = require_string(\n            payload.get("gear_number", ""),\n            f"{path.name}.gear_number",\n            allow_empty=True,\n        )\n',
          )
          replace_once(
              gap,
              '            semantic = (\n                configuration_code,\n                attribute_code,\n                fuel_type_code,\n                observation_date,\n                "",\n            )',
              '            gear_number = require_string(\n                item.get("gear_number", default_gear),\n                f"{path.name}.row.gear_number",\n                allow_empty=True,\n            )\n            semantic = (\n                configuration_code,\n                attribute_code,\n                fuel_type_code,\n                gear_number,\n                observation_date,\n                "",\n            )',
          )
          replace_once(
              gap,
              '            row.get("fuel_type_code", ""),\n            row.get("observation_date", ""),\n            semantic_signature(cargo_context) if cargo_context else "",\n',
              '            row.get("fuel_type_code", ""),\n            row.get("gear_number", ""),\n            row.get("observation_date", ""),\n            semantic_signature(cargo_context) if cargo_context else "",\n',
          )
          replace_once(
              gap,
              '        fuel_type_code,\n        observation_date,\n        "",\n    )',
              '        fuel_type_code,\n        "",\n        observation_date,\n        "",\n    )',
          )

          tests = Path('tests/test_configuration_value_import_specs.py')
          replace_once(
              tests,
              '                "sandero-acceleration-0-100-petrol-20260626.json",\n                "sandero-engine-power-lpg-20260626.json",',
              '                "sandero-acceleration-0-100-petrol-20260626.json",\n                "sandero-brochure-elasticity-80-120-20260202.json",\n                "sandero-engine-power-lpg-20260626.json",',
          )
          replace_once(
              tests,
              '                "sandero-standing-km-petrol-20260626.json",\n                "sandero-stepway-essential-wheel-design-20260626.json",',
              '                "sandero-standing-km-petrol-20260626.json",\n                "sandero-stepway-brochure-elasticity-80-120-20260202.json",\n                "sandero-stepway-essential-wheel-design-20260626.json",',
          )
          replace_once(
              tests,
              '        semantic: list[tuple[str, str, str, str]] = []',
              '        semantic: list[tuple[str, str, str, str, str]] = []',
          )
          replace_once(
              tests,
              '                    row["fuel_type_code"],\n                    row["observation_date"],',
              '                    row["fuel_type_code"],\n                    row["gear_number"],\n                    row["observation_date"],',
          )

          print('PASS: source coverage and gap-planning keys include gear_number')
          print('PASS: shared import-spec contract includes three new specs')
          PY

          if [ "$status" -eq 0 ]; then
            python tools/import_brochure_gear_performance_20260726.py --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py validate >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tests/test_brochure_gear_performance_values_20260726.py -v >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' -v >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            git diff --check >> "$log" 2>&1 || status=$?
          fi

          cat "$log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix(reporting): complete gear-aware integration'
            git push origin HEAD:agent/brochure-gear-performance-value-import
          fi
          exit "$status"
