name: Apply Cross-Model Navigation Review Documentation

on:
  push:
    branches:
      - agent/cross-model-navigation-usability-review-v2

permissions:
  contents: write

concurrency:
  group: apply-cross-model-navigation-review-docs
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/cross-model-navigation-usability-review-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install PDF backend
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi

      - name: Synchronize generated documentation
        run: python tools/dkb.py project-state --apply

      - name: Run focused review contracts
        run: |
          python tools/review_data_products_v1_8_1_publication_20260727.py --check
          python tools/review_cross_model_navigation_usability_20260727.py --check
          python -m unittest -q \
            tests.test_data_products_v1_8_1_publication \
            tests.test_cross_model_navigation_usability_review

      - name: Run complete validation
        run: |
          python -m unittest discover -s tests -p "test_*.py" -q
          python -m unittest -q \
            tests.project_state_contract \
            tests.autonomy_policy_contract \
            tests.quality_artifact_manifest_contract \
            tests.configuration_comparison_context_filter_contract \
            tests.configuration_comparison_pair_summary_contract
          python tools/dkb.py project-state --check
          python tools/dkb.py quality \
            --concise \
            --database "${RUNNER_TEMP}/dacia_knowledge_base.sqlite" \
            --log-file "${RUNNER_TEMP}/quality.log" \
            --summary-json "${RUNNER_TEMP}/quality-summary.json"

      - name: Commit synchronized documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md project/ROADMAP.md project/SESSION_STATE.md project/STATE_SUMMARY.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(review): synchronize cross-model navigation state"
            git push origin HEAD:agent/cross-model-navigation-usability-review-v2
          fi
