name: Temporary Reviewed Gap Workbook Contract Fix

on:
  push:
    branches:
      - agent/reviewed-gap-state-materialization-20260802
    paths:
      - .github/workflows/temp-fix-reviewed-gap-workbook-date.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Update workbook contract and package manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          test_path = Path('tests/test_configuration_comparison_workbook.py')
          text = test_path.read_text(encoding='utf-8')
          old = 'self.assertEqual(overview["commercial_equipment_as_of"], "2026-07-24")'
          new = 'self.assertEqual(overview["commercial_equipment_as_of"], "2026-07-31")'
          if text.count(old) != 1:
              raise SystemExit('expected one stale workbook date contract')
          test_path.write_text(text.replace(old, new), encoding='utf-8')

          state_path = Path('project/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          manifest = state['current_package']['manifest_paths']
          entry = 'tests/test_configuration_comparison_workbook.py'
          if entry not in manifest:
              insert_at = manifest.index('tests/test_reviewed_gap_state_materialization_20260802.py')
              manifest.insert(insert_at, entry)
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python tools/dkb.py project-state --apply
          python -m unittest -q \
            tests.test_configuration_comparison_workbook \
            tests.test_reviewed_gap_state_materialization_20260802
      - name: Commit clean fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-fix-reviewed-gap-workbook-date.yml
          git add tests/test_configuration_comparison_workbook.py project/state.json project/STATE_SUMMARY.md CHANGELOG.md README.md project/ROADMAP.md project/SESSION_STATE.md
          git diff --cached --check
          git commit -m 'test: align workbook commercial date'
          git push
