name: Materialize Data Products v1.7.0 Preparation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/materialize-data-products-v1-7-0-preparation.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preparation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/data-products-v1-7-0-release-preparation
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install PDF backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Build, reproduce and verify candidate
        shell: bash
        run: |
          set +e
          log=.github/data-products-v1.7.0-preparation.log
          : > "$log"
          status=0
          source_sha="$(git rev-parse HEAD)"
          first="${RUNNER_TEMP}/release-first"
          second="${RUNNER_TEMP}/release-second"
          workspace="${RUNNER_TEMP}/workspace"
          public_workspace="${RUNNER_TEMP}/public-v1.6.1"

          echo "source_sha=$source_sha" >> "$log"
          python tools/dkb.py data-product-release \
            --version 1.7.0 \
            --commit-sha "$source_sha" \
            --output-directory "$first" >> "$log" 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "PASS: first build" >> "$log"
            python tools/dkb.py data-product-release \
              --version 1.7.0 \
              --commit-sha "$source_sha" \
              --output-directory "$second" >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo "PASS: second build" >> "$log"
            python tools/dkb.py data-product-release \
              --output-directory "$first" \
              --verify >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo "PASS: release verify" >> "$log"
            cmp "$first/dacia-knowledge-base-data-products-v1.7.0.zip" \
                "$second/dacia-knowledge-base-data-products-v1.7.0.zip" >> "$log" 2>&1 || status=$?
            cmp "$first/data-product-release-manifest.json" \
                "$second/data-product-release-manifest.json" >> "$log" 2>&1 || status=$?
            cmp "$first/SHA256SUMS" "$second/SHA256SUMS" >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo "PASS: deterministic double build" >> "$log"
            mkdir -p "$workspace"
            python - "$first/dacia-knowledge-base-data-products-v1.7.0.zip" "$workspace" >> "$log" 2>&1 <<'PY' || status=$?
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2]).resolve()
          with ZipFile(archive) as handle:
              for item in handle.infolist():
                  target = (destination / item.filename).resolve()
                  if destination not in target.parents and target != destination:
                      raise SystemExit(f"unsafe archive member: {item.filename}")
              handle.extractall(destination)
          print(f"extracted to {destination}")
          PY
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py data-product-workspace-verify \
              --workspace-directory "$workspace" \
              --json > "${RUNNER_TEMP}/workspace-verification.json" 2>> "$log" || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo "PASS: candidate workspace verification" >> "$log"
            python tools/dkb.py data-product-release-download \
              --version 1.6.1 \
              --output-directory "$public_workspace" >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo "PASS: public v1.6.1 download" >> "$log"
            python tools/dkb.py data-product-workspace-verify \
              --workspace-directory "$public_workspace" \
              --json > "${RUNNER_TEMP}/public-workspace-verification.json" 2>> "$log" || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo "PASS: public v1.6.1 workspace verification" >> "$log"
            python - "$first" "$source_sha" \
              "${RUNNER_TEMP}/workspace-verification.json" \
              "${RUNNER_TEMP}/public-workspace-verification.json" >> "$log" 2>&1 <<'PY' || status=$?
          import hashlib
          import json
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          release = Path(sys.argv[1])
          source_sha = sys.argv[2]
          workspace_verification = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          public_verification = json.loads(Path(sys.argv[4]).read_text(encoding="utf-8"))
          manifest_path = release / "data-product-release-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          archive = release / "dacia-knowledge-base-data-products-v1.7.0.zip"
          checksums = release / "SHA256SUMS"

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          with ZipFile(archive) as handle:
              archive_members = len(handle.infolist())

          payload = {
              "version": 1,
              "kind": "data_products_v1_7_0_preparation_candidate",
              "source_commit": source_sha,
              "release_version": "1.7.0",
              "release_tag": "data-products-v1.7.0",
              "deterministic_double_build": True,
              "release_verify": "pass",
              "candidate_assets": {
                  archive.name: {"size_bytes": archive.stat().st_size, "sha256": sha256(archive)},
                  manifest_path.name: {"size_bytes": manifest_path.stat().st_size, "sha256": sha256(manifest_path)},
                  checksums.name: {"size_bytes": checksums.stat().st_size, "sha256": sha256(checksums)},
              },
              "archive_members": archive_members,
              "manifest": {
                  "source_commit": manifest.get("source_commit"),
                  "release_version": manifest.get("release_version"),
                  "configuration_count": manifest.get("configuration_count"),
                  "comparison_scope_count": manifest.get("comparison_scope_count"),
                  "pair_count": manifest.get("pair_count"),
                  "difference_count": manifest.get("difference_count"),
                  "file_count": len(manifest.get("files", [])),
              },
              "candidate_workspace_verification": workspace_verification,
              "public_v1_6_1_download_and_workspace_verification": public_verification,
              "publication_performed": False,
          }
          output = Path(".github/data-products-v1.7.0-preparation-candidate.json")
          output.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("PASS: preparation candidate receipt written")
          PY
          fi

          echo "exit_status=$status" >> "$log"
          cat "$log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$log"
          if [ -f .github/data-products-v1.7.0-preparation-candidate.json ]; then
            git add .github/data-products-v1.7.0-preparation-candidate.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist v1.7.0 preparation diagnostics'
            git push origin HEAD:agent/data-products-v1-7-0-release-preparation
          fi
          exit "$status"
