name: Temporary Duster Project State Output Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Reproduce state and capture output
        run: |
          python tools/import_duster_ecog120_automatic_homologation_20260725.py --apply
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("project/state.json")
          state = json.loads(path.read_text(encoding="utf-8"))
          state["updated_on"] = "2026-07-25"
          state["phase"] = "Duster Eco-G 120 Automatic Homologation Evidence"
          state["current_package"] = {
              "name": "Duster Eco-G 120 Automatic Homologation Evidence",
              "status": "complete",
              "goal": "Import exact automatic-specific power, torque, performance, WLTP, mass and towing evidence for the 2026 Duster Eco-G 120 Expression, Extreme and Journey configurations without inheriting manual cargo values.",
          }
          state["next_package"] = {
              "name": "Duster Eco-G 120 Automatic Cargo and Emissions Gap Review",
              "status": "planned",
              "goal": "Locate exact automatic-specific luggage-volume and petrol CO2 evidence while preserving current unknown states if no authoritative source exists.",
          }
          path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          set +e
          python tools/dkb.py project-state --apply > .github/duster-project-state-error.log 2>&1
          status=$?
          cat .github/duster-project-state-error.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/duster-project-state-error.log
            git commit -m "diagnostic: capture Duster project-state failure"
            git push origin HEAD:${{ github.head_ref }}
          fi
          exit "$status"
