name: Diagnose Equipment HTML

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/diagnose-equipment-html.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out regression-fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/equipment-filter-regression-model-price-order
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Apply diagnostic transformations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap
          text = Path('.github/workflows/diagnose-equipment-materializer.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"          python - <<'PY'\n(.*?)\n          PY", text, flags=re.DOTALL)
          for block in blocks[:2]:
              exec(compile(textwrap.dedent(block), '<diagnostic-transform>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Verify primary equipment explanation
        run: |
          python - <<'PY'
          import tools.review_equipment_filter_regression_model_price_order_20260726 as m
          rendered = m.render_html(m.collect_browser_catalog(m.ROOT, m.ShortlistCriteria()))
          m.ensure('potwierdzone jako dostępne w co najmniej jednej' in rendered, 'corrected equipment explanation is missing')
          PY
      - name: Verify missing-data explanation
        run: |
          python - <<'PY'
          import tools.review_equipment_filter_regression_model_price_order_20260726 as m
          rendered = m.render_html(m.collect_browser_catalog(m.ROOT, m.ShortlistCriteria()))
          m.ensure('Brak danych i status nieustalony nie spełniają filtra' in rendered, 'unknown handling explanation is missing')
          PY
      - name: Verify rendered model picker order
        run: |
          python - <<'PY'
          import tools.review_equipment_filter_regression_model_price_order_20260726 as m
          rendered = m.render_html(m.collect_browser_catalog(m.ROOT, m.ShortlistCriteria()))
          m.ensure(rendered.index('data-value="sandero_iii"') < rendered.index('data-value="sandero_stepway_iii"') < rendered.index('data-value="jogger"') < rendered.index('data-value="duster_iii"') < rendered.index('data-value="bigster"'), 'rendered model picker order differs')
          PY
