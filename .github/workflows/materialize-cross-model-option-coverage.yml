name: Materialize cross-model option coverage

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: materialize-cross-model-option-coverage
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/official-configurator-cross-model-option-coverage'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/official-configurator-cross-model-option-coverage
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Apply normalized source contract
        shell: bash
        run: |
          sed -i 's|MASTER / "equipment_availability_statuses.csv"|MASTER / "enums" / "equipment_availability_statuses.csv"|' tools/import_official_cross_model_option_coverage_20260724.py
          python tools/import_official_cross_model_option_coverage_20260724.py --apply
          python - <<'PY'
          from pathlib import Path
          for name in (
              'tests/test_jogger_payload_performance_ranges.py',
              'tests/test_jogger_wltp_efficiency_ranges.py',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('self.assertEqual(baseline["tests"], 719)', 'self.assertEqual(baseline["tests"], 727)')
              text = text.replace('self.assertEqual(baseline["rows"], 7699)', 'self.assertEqual(baseline["rows"], 7780)')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Update narrative documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def insert_after(path: str, anchor: str, addition: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if addition.strip() in text:
                  return
              if anchor not in text:
                  raise SystemExit(f'missing documentation anchor in {path}')
              target.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')

          insert_after(
              'CHANGELOG.md',
              '* Published and independently re-verified patch release `data-products-v1.6.1` from exact main commit `4b77571c788b862a6543161b9343a35f464bd7c6`, preserving selected equipment, making list search visible and hiding only incompatible or source-incomplete additions without changing catalogue data.\n',
              '* Imported 37 dated factory-equipment observations from nine official Dacia Polska grade pages: exact shark-fin antenna coverage for 31 configurations and six newer standard power-folding-mirror states for Jogger Journey, with historical rows and non-inference boundaries preserved.\n',
          )
          insert_after(
              'README.md',
              'Najnowsza poprawka [`data-products-v1.6.1`](https://github.com/xbodzio7/Dacia-Knowledge-Base/releases/tag/data-products-v1.6.1) została opublikowana z dokładnego commita `4b77571c788b862a6543161b9343a35f464bd7c6`. Pole „Filtruj listę wyposażenia” rzeczywiście ukrywa niedopasowane nazwy, wybrane pozycje pozostają aktywne do jawnego usunięcia, a lista oferuje wyłącznie źródłowo kompletne dodatki zgodne z bieżącym wyborem. Alternatywy wzajemnie się wykluczające są ukrywane, natomiast braki danych o opcjach innych modeli nadal pozostają niewiadomą. Trwały zapis publikacji znajduje się w `project/releases/data-products-v1.6.1.md`, a opis poprawki w `project/packages/equipment-facet-interaction-fix.md`.\n',
              '\nBieżący przekrojowy import wyposażenia zapisuje 31 dokładnych obserwacji fabrycznej anteny typu „płetwa rekina” dla Sandero, Sandero Stepway i Joggera oraz sześć nowszych obserwacji seryjnych elektrycznie składanych lusterek dla Joggera Journey. Wersje z jawnie wskazaną anteną biczową otrzymują status fabrycznej płetwy `not_available`; akcesoria, nieudowodnione rozszerzenia pakietów i niejednoznaczne stany Dustera pozostają poza importem. Szczegóły zawiera `project/packages/official-configurator-cross-model-option-coverage-20260724.md`.\n',
          )
          insert_after(
              'project/ROADMAP.md',
              '- poprawka `data-products-v1.6.1` naprawiająca widoczne wyszukiwanie wyposażenia, zachowanie zaznaczeń i kompatybilne fasety, z niezależną weryfikacją publicznych assetów oraz dokładnego HTML,\n',
              '- przekrojowy import dwóch myląco niepełnych cech wyposażenia z dziewięciu oficjalnych stron wersji: 31 obserwacji anteny typu „płetwa rekina”, sześć aktualizacji składanych lusterek Joggera Journey i jawny non-import Dustera,\n',
          )
          PY
      - name: Remove transport workflows
        run: |
          rm -f .github/workflows/diagnose-cross-model-option-coverage.yml
          rm -f .github/workflows/materialize-cross-model-option-coverage.yml
      - name: Synchronize canonical state
        run: python tools/dkb.py project-state --apply
      - name: Verify targeted contract
        run: |
          python -m unittest -q tests.test_official_cross_model_option_coverage_20260724
          python tools/import_official_cross_model_option_coverage_20260724.py --check
      - name: Run complete unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Run full quality gate
        shell: bash
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
          python tools/dkb.py quality \
            --concise \
            --database "${RUNNER_TEMP}/dacia_knowledge_base.sqlite" \
            --log-file "${RUNNER_TEMP}/quality.log" \
            --summary-json "${RUNNER_TEMP}/quality-summary.json"
      - name: Commit one logical package
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/diagnose-cross-model-option-coverage.yml
          test ! -e .github/workflows/materialize-cross-model-option-coverage.yml
          git diff --check
          git status --short
          git config user.name 'Dacia Knowledge Base Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(data): import official cross-model option coverage'
          git push origin HEAD:agent/official-configurator-cross-model-option-coverage
