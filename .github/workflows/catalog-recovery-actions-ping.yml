name: Catalog Recovery Actions Ping

on:
  push:
    branches:
      - agent/sandero-stepway-catalog-recovery
    paths:
      - .github/workflows/catalog-recovery-actions-ping.yml

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record ping
        run: |
          mkdir -p diagnostics/catalog-recovery
          printf '{"actions_trigger":"ok"}\n' > diagnostics/catalog-recovery/actions-ping.json
      - name: Commit ping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/catalog-recovery/actions-ping.json
          git commit -m "chore(data): confirm recovery Actions trigger"
          git push origin HEAD:agent/sandero-stepway-catalog-recovery
