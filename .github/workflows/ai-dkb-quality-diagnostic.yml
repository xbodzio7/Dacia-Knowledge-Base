name: AI capture DKB quality failure

on:
  push:
    branches:
      - ai/dacia-configurator-pdf-archive-20260809
    paths:
      - .github/workflows/ai-dkb-quality-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Capture quality output
        shell: bash
        run: |
          set +e
          python tools/dkb.py quality > project/quality-diagnostic-20260809.txt 2>&1
          code=$?
          echo >> project/quality-diagnostic-20260809.txt
          echo "EXIT_CODE=$code" >> project/quality-diagnostic-20260809.txt
          exit 0
      - name: Commit diagnostic receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/quality-diagnostic-20260809.txt
          git commit -m "chore(quality): capture final quality diagnostic" || true
          git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
