name: Temporary Refresh Documentation Baseline

on:
  push:
    branches:
      - agent/spring-essential-khaki-price-apply-20260802
    paths:
      - .github/workflows/temp-refresh-documentation-baseline.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-essential-khaki-price-apply-20260802
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Refresh managed documentation blocks
        run: |
          python tools/documentation_baseline.py --apply
          python tools/documentation_baseline.py --check

      - name: Commit refreshed documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md project/SESSION_STATE.md
          git commit -m "docs: refresh verified repository baseline"
          git push origin HEAD:agent/spring-essential-khaki-price-apply-20260802
