name: Residual Review Bundle

on:
  pull_request_target:
    types: [reopened]

permissions:
  contents: write

jobs:
  residual-review-bundle:
    if: github.event.pull_request.number == 466
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/legacy-pdf-source-audit-governance-20260802
          fetch-depth: 0
          persist-credentials: true
      - name: Persist historical contract repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/repair_spring_flexicharger_historical_contracts_20260802.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools tests
          if ! git diff --cached --quiet; then
            git commit -m 'fix: align historical Spring FlexiCharger contracts'
            git push origin HEAD:agent/legacy-pdf-source-audit-governance-20260802
          fi
