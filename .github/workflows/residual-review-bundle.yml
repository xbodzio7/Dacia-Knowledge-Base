name: Residual Review Bundle

on:
  pull_request:
    paths:
      - .github/workflows/residual-review-bundle.yml
      - tools/residual_review_bundle.py
      - tests/residual_review_bundle_contract.py
      - project/state.json
      - project/sources/official-dacia-brochures-20260725.json
      - data/reporting/verified_pdf_candidate_residual_gap_prioritization.json
  workflow_dispatch:
    inputs:
      package_id:
        description: Canonical residual package ID; empty uses project/state.json
        required: false
        type: string

permissions:
  contents: read

jobs:
  residual-review-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install PDF rendering backend
        run: |
          if ! command -v pdftotext >/dev/null 2>&1 || ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
          pdftotext -v
          pdftoppm -v

      - name: Run residual review bundle tests
        run: python -m unittest -v tests.residual_review_bundle_contract

      - name: Resolve residual package
        id: package
        env:
          REQUESTED_PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from tools import residual_review_bundle

          state = json.loads(Path("project/state.json").read_text(encoding="utf-8"))
          requested = os.environ.get("REQUESTED_PACKAGE_ID", "").strip()
          queue_complete = False
          if requested:
              package_id = requested
          else:
              try:
                  package_id = residual_review_bundle.default_package_id(state)
              except residual_review_bundle.ResidualReviewBundleError:
                  packages = json.loads(
                      Path(
                          "data/reporting/verified_pdf_candidate_residual_gap_prioritization.json"
                      ).read_text(encoding="utf-8")
                  )["packages"]
                  current = state.get("current_package")
                  if not (
                      isinstance(current, dict)
                      and current.get("kind") == "residual_review"
                      and current.get("status") == "complete"
                      and packages
                      and current.get("package_id") == packages[-1].get("package_id")
                  ):
                      raise
                  package_id = current["package_id"]
                  queue_complete = True
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"package_id={package_id}\n")
              output.write(f"queue_complete={str(queue_complete).lower()}\n")
          PY

      - name: Generate source-verified review bundle
        run: |
          python tools/residual_review_bundle.py \
            --package-id "${{ steps.package.outputs.package_id }}" \
            --output-directory "${RUNNER_TEMP}/residual-review-bundle"
          if [ "${{ steps.package.outputs.queue_complete }}" = "true" ]; then
            echo "Canonical residual review queue is complete at ${{ steps.package.outputs.package_id }}."
          fi

      - name: Upload residual review bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: residual-review-bundle
          path: ${{ runner.temp }}/residual-review-bundle
          if-no-files-found: error
          retention-days: 14
