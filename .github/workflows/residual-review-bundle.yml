name: Residual Review Bundle

on:
  pull_request_target:
    types: [reopened]

permissions:
  contents: write

jobs:
  residual-review-bundle:
    if: github.event.pull_request.number == 466
    runs-on: ubuntu-latest
    steps:
      - name: Check out source-audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/legacy-pdf-source-audit-governance-20260802
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize confirmed correction
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_spring_expression_flexicharger_correction_20260802.py
          rm -f project/source-audit/.audit-branch-anchor project/source-audit/pr466-status.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/master/commercial_items.csv data/master/commercial_item_configurations.csv project/source-audit
          if ! git diff --cached --quiet; then
            git commit -m 'fix(data): add Spring Expression FlexiCharger mapping'
            git push origin HEAD:agent/legacy-pdf-source-audit-governance-20260802
          fi
