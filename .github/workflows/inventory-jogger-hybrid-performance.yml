name: Inventory Jogger Hybrid Performance

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/inventory-jogger-hybrid-performance.yml
      - tools/inventory_jogger_hybrid_performance_20260726.py

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/jogger-brochure-hybrid-performance-completion
          fetch-depth: 0
      - name: Install PDF extraction backend
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Build inventory
        shell: bash
        run: |
          output=.github/jogger-hybrid-performance-inventory.txt
          {
            echo '=== JOGGER PDF PAGE 19 ==='
            pdftotext -f 19 -l 19 -layout 'PDF/Broszury/DACIA JOGGER broszura 20251217.pdf' -
            echo
            python tools/inventory_jogger_hybrid_performance_20260726.py
          } > "$output"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$output"
          if ! git diff --cached --quiet; then
            git commit -m 'chore(data): persist Jogger hybrid performance inventory'
            git push origin HEAD:agent/jogger-brochure-hybrid-performance-completion
          fi
