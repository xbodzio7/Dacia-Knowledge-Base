name: Temporary v1.12.1 Documentation Sync

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/data-products-v1-12-1-corrective-release-preparation-001'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/data-products-v1-12-1-corrective-release-preparation-001
          fetch-depth: 0
          persist-credentials: true
      - name: Generate canonical documentation
        shell: bash
        run: |
          set -euo pipefail
          python tools/dkb.py project-state --apply
          python tools/dkb.py documentation-baseline --apply
          python tools/dkb.py project-state --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/STATE_SUMMARY.md README.md CHANGELOG.md project/ROADMAP.md project/SESSION_STATE.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: synchronize v1.12.1 corrective release baseline'
            git push origin HEAD:agent/data-products-v1-12-1-corrective-release-preparation-001
          fi
