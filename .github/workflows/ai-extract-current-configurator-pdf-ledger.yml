name: AI extract current configurator PDF ledger

on:
  push:
    branches:
      - ai/dacia-configurator-pdf-archive-20260809
    paths:
      - .github/workflows/ai-extract-current-configurator-pdf-ledger.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install extraction backends
        run: |
          python -m pip install --disable-pip-version-check --quiet pypdf
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
      - name: Extract all pages and verify rendering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re,subprocess,tempfile,unicodedata
          from collections import Counter
          from pathlib import Path
          from pypdf import PdfReader

          root=Path.cwd()
          manifest=json.loads((root/'project/sources/dacia-pl-configurator-native-pdf-archive-20260809.json').read_text(encoding='utf-8'))
          out={
            'kind':'dacia_pl_current_configurator_pdf_page_ledger',
            'observed_date':'2026-08-09',
            'source_manifest':'project/sources/dacia-pl-configurator-native-pdf-archive-20260809.json',
            'review_status':'partial_review',
            'visual_review_status':'all_pages_rendered_for_layout_verification_not_manually_classified',
            'documents':[],
          }
          section_counts=Counter(); total_pages=0; empty_pages=[]; render_failures=[]
          def clean(s):
            s=unicodedata.normalize('NFKC',s or '').replace('\u00a0',' ')
            return '\n'.join(' '.join(line.split()) for line in s.replace('\r','\n').split('\n') if line.split())
          def classify(text,page,pages):
            low=text.casefold()
            labels=[]
            checks=[
              ('summary', ['twój samochód','twoja konfiguracja','kod konfiguracji','cena katalogowa']),
              ('design', ['wygląd','kolor nadwozia','tapicerka','obręcze','felgi']),
              ('standard_equipment', ['wyposażenie seryjne','wyposażenie standardowe']),
              ('options', ['wyposażenie dodatkowe','opcje','pakiet']),
              ('technical', ['dane techniczne','silnik','zużycie paliwa','emisja co2','wymiary']),
              ('legal', ['dacia zastrzega','informacje prawne','niniejszy dokument']),
            ]
            for label, needles in checks:
              if any(n in low for n in needles): labels.append(label)
            if not labels and page==pages: labels.append('legal_or_footer')
            return labels or ['unclassified']
          for doc in manifest['documents']:
            path=root/doc['file_path']; raw=path.read_bytes()
            if hashlib.sha256(raw).hexdigest()!=doc['sha256']: raise SystemExit(f'hash mismatch {path}')
            reader=PdfReader(str(path))
            if len(reader.pages)!=doc['pages']: raise SystemExit(f'page count mismatch {path}')
            item={k:doc[k] for k in ('family','grade','engine','configuration_code','dacia_configuration_code','file_path','sha256','pages')}
            item['source_code']=f"src_pl_cfgpdf_{doc['configuration_code']}_20260809"
            item['pages_ledger']=[]
            with tempfile.TemporaryDirectory() as td:
              td=Path(td)
              for idx,p in enumerate(reader.pages,start=1):
                text=clean(p.extract_text() or '')
                if not text: empty_pages.append(f"{doc['configuration_code']}:{idx}")
                prefix=td/f'p{idx}'
                cp=subprocess.run(['pdftoppm','-f',str(idx),'-l',str(idx),'-singlefile','-scale-to','512','-png',str(path),str(prefix)],capture_output=True)
                png=prefix.with_suffix('.png')
                render_ok=cp.returncode==0 and png.is_file() and png.stat().st_size>1000
                if not render_ok: render_failures.append(f"{doc['configuration_code']}:{idx}")
                labels=classify(text,idx,len(reader.pages))
                section_counts.update(labels); total_pages+=1
                item['pages_ledger'].append({
                  'page':idx,
                  'text_sha256':hashlib.sha256(text.encode('utf-8')).hexdigest(),
                  'text_chars':len(text),
                  'render_ok':render_ok,
                  'render_sha256':hashlib.sha256(png.read_bytes()).hexdigest() if render_ok else '',
                  'sections':labels,
                  'text':text,
                })
            out['documents'].append(item)
          out['summary']={
            'documents':len(out['documents']),
            'pages':total_pages,
            'empty_text_pages':empty_pages,
            'render_failures':render_failures,
            'section_tag_counts':dict(sorted(section_counts.items())),
          }
          if len(out['documents'])!=70 or total_pages!=654: raise SystemExit(f'coverage mismatch docs={len(out["documents"])} pages={total_pages}')
          if render_failures: raise SystemExit(f'render failures: {render_failures}')
          dest=root/'project/sources/dacia-pl-configurator-native-pdf-page-ledger-20260809.json'
          dest.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          summary=root/'data/reporting/dacia_configurator_pdf_page_inventory_20260809.csv'
          summary.parent.mkdir(parents=True,exist_ok=True)
          import csv
          with summary.open('w',encoding='utf-8',newline='') as f:
            fields=['configuration_code','family','page','text_chars','render_ok','sections','text_sha256','render_sha256']
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader()
            for d in out['documents']:
              for p in d['pages_ledger']:
                w.writerow({'configuration_code':d['configuration_code'],'family':d['family'],'page':p['page'],'text_chars':p['text_chars'],'render_ok':str(p['render_ok']).lower(),'sections':'|'.join(p['sections']),'text_sha256':p['text_sha256'],'render_sha256':p['render_sha256']})
          print(json.dumps(out['summary'],ensure_ascii=False,indent=2))
          PY
      - name: Commit page ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/sources/dacia-pl-configurator-native-pdf-page-ledger-20260809.json data/reporting/dacia_configurator_pdf_page_inventory_20260809.csv
          git commit -m "data(source): inventory all current configurator PDF pages"
          git pull --rebase origin ai/dacia-configurator-pdf-archive-20260809
          git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
