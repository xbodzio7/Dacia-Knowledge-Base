name: Temporary record Data Products v1.9.0 publication

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-publish-data-products-v1.9.0.yml'

permissions:
  contents: write

concurrency:
  group: data-products-v1.9.0-publication-record
  cancel-in-progress: true

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: xbodzio7/Dacia-Knowledge-Base
      PACKAGE_BRANCH: agent/data-products-v1.9.0-publication-20260731
      SOURCE_COMMIT: 6c8f6f68c21022fa3bd6b6248d06b87d5d484d5c
      RELEASE_TAG: data-products-v1.9.0
      ARCHIVE_NAME: dacia-knowledge-base-data-products-v1.9.0.zip
      ARCHIVE_SIZE: '82612470'
      ARCHIVE_SHA256: 4e114f171a80445369f2439466d0d102e894145614d9a221a0390452309f453d
      MANIFEST_SIZE: '21600'
      MANIFEST_SHA256: 519f371be16251533befdeb8147caba30bdf2f3bd2c0122f474c03924574c7ad
      CHECKSUMS_SIZE: '213'
      CHECKSUMS_SHA256: 48c9b648d6a2e848f6e35118c9530024637f06e50ff71cea861acd1a0c7bd9cb
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-products-v1.9.0-publication-20260731
          fetch-depth: 0

      - name: Download and verify public release
        shell: bash
        run: |
          set -euo pipefail
          mkdir public-redownload
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --dir public-redownload
          gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" > public-release.json
          gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" > public-tag.json
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          expected = {
              os.environ['ARCHIVE_NAME']: (int(os.environ['ARCHIVE_SIZE']), os.environ['ARCHIVE_SHA256']),
              'data-product-release-manifest.json': (int(os.environ['MANIFEST_SIZE']), os.environ['MANIFEST_SHA256']),
              'SHA256SUMS': (int(os.environ['CHECKSUMS_SIZE']), os.environ['CHECKSUMS_SHA256']),
          }
          root = Path('public-redownload')
          if {path.name for path in root.iterdir() if path.is_file()} != set(expected):
              raise RuntimeError('public asset set differs')
          for name, (size, digest) in expected.items():
              path = root / name
              if path.stat().st_size != size:
                  raise RuntimeError(f'public {name} size differs')
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise RuntimeError(f'public {name} SHA-256 differs')

          release = json.loads(Path('public-release.json').read_text())
          tag = json.loads(Path('public-tag.json').read_text())
          if release.get('draft') or release.get('prerelease'):
              raise RuntimeError('release is not final')
          if tag.get('object', {}).get('sha') != os.environ['SOURCE_COMMIT']:
              raise RuntimeError('tag target differs')
          api_assets = release.get('assets', [])
          if len(api_assets) != 3:
              raise RuntimeError('release asset count differs')
          assets = {}
          for item in api_assets:
              name = item['name']
              if name not in expected:
                  raise RuntimeError(f'unexpected asset: {name}')
              size, digest = expected[name]
              if item['size'] != size:
                  raise RuntimeError(f'API size differs: {name}')
              api_digest = item.get('digest')
              if api_digest not in (None, f'sha256:{digest}'):
                  raise RuntimeError(f'API digest differs: {name}')
              assets[name] = {
                  'asset_id': item['id'],
                  'size_bytes': size,
                  'sha256': digest,
                  'api_digest': api_digest,
                  'download_url': item['browser_download_url'],
              }
          receipt = {
              'version': 1,
              'kind': 'data_products_v1_9_0_publication',
              'status': 'PASS',
              'release_id': release['id'],
              'release_tag': os.environ['RELEASE_TAG'],
              'release_url': release['html_url'],
              'published_at': release['published_at'],
              'source_commit': os.environ['SOURCE_COMMIT'],
              'publication_workflow_run': 30621546974,
              'receipt_workflow_run': int(os.environ['GITHUB_RUN_ID']),
              'draft': release['draft'],
              'prerelease': release['prerelease'],
              'asset_count': len(assets),
              'assets': dict(sorted(assets.items())),
              'private_redownload_verification': 'PASS',
              'public_redownload_verification': 'PASS',
          }
          Path('.github/data-products-v1.9.0-publication.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit exact one-file publication package
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-publish-data-products-v1.9.0.yml
          rm -rf public-redownload public-release.json public-tag.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/data-products-v1.9.0-publication.json
          git add -u .github/workflows/tmp-publish-data-products-v1.9.0.yml
          git commit -m 'release(data-products): publish v1.9.0 exact assets'
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          test "$changed" = '.github/data-products-v1.9.0-publication.json'
          git push origin "HEAD:$PACKAGE_BRANCH"
