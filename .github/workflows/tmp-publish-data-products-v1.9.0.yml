name: Temporary publish Data Products v1.9.0

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-publish-data-products-v1.9.0.yml'

permissions:
  contents: write

concurrency:
  group: data-products-v1.9.0-publication
  cancel-in-progress: true

jobs:
  publish-and-record:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: xbodzio7/Dacia-Knowledge-Base
      PACKAGE_BRANCH: agent/data-products-v1.9.0-publication-20260731
      SOURCE_COMMIT: 6c8f6f68c21022fa3bd6b6248d06b87d5d484d5c
      RELEASE_VERSION: 1.9.0
      RELEASE_TAG: data-products-v1.9.0
      ARCHIVE_NAME: dacia-knowledge-base-data-products-v1.9.0.zip
      ARCHIVE_SIZE: '82612470'
      ARCHIVE_SHA256: 4e114f171a80445369f2439466d0d102e894145614d9a221a0390452309f453d
      MANIFEST_SIZE: '21600'
      MANIFEST_SHA256: 519f371be16251533befdeb8147caba30bdf2f3bd2c0122f474c03924574c7ad
      CHECKSUMS_SIZE: '213'
      CHECKSUMS_SHA256: 48c9b648d6a2e848f6e35118c9530024637f06e50ff71cea861acd1a0c7bd9cb
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-products-v1.9.0-publication-20260731
          fetch-depth: 0

      - name: Check out exact preparation source
        uses: actions/checkout@v4
        with:
          ref: 6c8f6f68c21022fa3bd6b6248d06b87d5d484d5c
          path: source
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install PDF extraction backend
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Rebuild exact preflight assets
        shell: bash
        run: |
          set -euo pipefail
          python source/tools/dkb.py data-product-release \
            --output-directory "$GITHUB_WORKSPACE/release-assets" \
            --version "$RELEASE_VERSION" \
            --commit-sha "$SOURCE_COMMIT"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os

          root = Path('release-assets')
          expected = {
              os.environ['ARCHIVE_NAME']: (int(os.environ['ARCHIVE_SIZE']), os.environ['ARCHIVE_SHA256']),
              'data-product-release-manifest.json': (int(os.environ['MANIFEST_SIZE']), os.environ['MANIFEST_SHA256']),
              'SHA256SUMS': (int(os.environ['CHECKSUMS_SIZE']), os.environ['CHECKSUMS_SHA256']),
          }
          if {path.name for path in root.iterdir() if path.is_file()} != set(expected):
              raise RuntimeError('release asset set differs from preflight')
          for name, (size, digest) in expected.items():
              path = root / name
              if path.stat().st_size != size:
                  raise RuntimeError(f'{name} size differs')
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise RuntimeError(f'{name} SHA-256 differs')
          PY
          unzip -p "release-assets/$ARCHIVE_NAME" RELEASE_NOTES.md > release-notes.md

      - name: Remove stale drafts and confirm target absence
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/releases?per_page=100" > releases.json
          python - <<'PY' > stale-draft-ids.txt
          import json
          import os
          from pathlib import Path
          releases = json.loads(Path('releases.json').read_text())
          for release in releases:
              if release.get('tag_name') == os.environ['RELEASE_TAG'] and release.get('draft') is True:
                  print(release['id'])
              elif release.get('tag_name') == os.environ['RELEASE_TAG']:
                  raise RuntimeError('final target release already exists')
          PY
          while read -r release_id; do
            [ -z "$release_id" ] || gh api -X DELETE "repos/$REPOSITORY/releases/$release_id"
          done < stale-draft-ids.txt
          if gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Target tag already exists" >&2
            exit 1
          fi

      - name: Create exact tag, draft and assets
        shell: bash
        run: |
          set -euo pipefail
          release_id=''
          published=0
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$published" -eq 0 ]; then
              if [ -n "$release_id" ]; then
                gh api -X DELETE "repos/$REPOSITORY/releases/$release_id" || true
              fi
              gh api -X DELETE "repos/$REPOSITORY/git/refs/tags/$RELEASE_TAG" || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          gh api -X POST "repos/$REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$SOURCE_COMMIT" > tag-ref.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          request = {
              'tag_name': os.environ['RELEASE_TAG'],
              'target_commitish': os.environ['SOURCE_COMMIT'],
              'name': 'Dacia Knowledge Base Data Products v1.9.0',
              'body': Path('release-notes.md').read_text(encoding='utf-8'),
              'draft': True,
              'prerelease': False,
          }
          Path('release-request.json').write_text(json.dumps(request), encoding='utf-8')
          PY
          gh api -X POST "repos/$REPOSITORY/releases" \
            --input release-request.json > draft-release.json
          release_id="$(python -c "import json; print(json.load(open('draft-release.json'))['id'])")"
          echo "$release_id" > release-id.txt

          for name in "$ARCHIVE_NAME" data-product-release-manifest.json SHA256SUMS; do
            curl --fail-with-body --silent --show-error -L \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@release-assets/$name" \
              "https://uploads.github.com/repos/$REPOSITORY/releases/$release_id/assets?name=$name" \
              > "uploaded-$name.json"
          done

          gh api "repos/$REPOSITORY/releases/$release_id" > draft-with-assets.json
          mkdir private-redownload
          python - <<'PY' > asset-downloads.tsv
          import json
          from pathlib import Path
          release = json.loads(Path('draft-with-assets.json').read_text())
          if len(release.get('assets', [])) != 3:
              raise RuntimeError('draft asset count differs')
          for asset in release['assets']:
              print(f"{asset['id']}\t{asset['name']}")
          PY
          while IFS=$'\t' read -r asset_id name; do
            curl --fail-with-body --silent --show-error -L \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/releases/assets/$asset_id" \
              -o "private-redownload/$name"
          done < asset-downloads.tsv

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          expected = {
              os.environ['ARCHIVE_NAME']: (int(os.environ['ARCHIVE_SIZE']), os.environ['ARCHIVE_SHA256']),
              'data-product-release-manifest.json': (int(os.environ['MANIFEST_SIZE']), os.environ['MANIFEST_SHA256']),
              'SHA256SUMS': (int(os.environ['CHECKSUMS_SIZE']), os.environ['CHECKSUMS_SHA256']),
          }
          root = Path('private-redownload')
          if {path.name for path in root.iterdir() if path.is_file()} != set(expected):
              raise RuntimeError('private redownload asset set differs')
          for name, (size, digest) in expected.items():
              path = root / name
              if path.stat().st_size != size:
                  raise RuntimeError(f'private {name} size differs')
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise RuntimeError(f'private {name} SHA-256 differs')
          PY

          printf '{"draft":false,"prerelease":false}' > finalize-release.json
          gh api -X PATCH "repos/$REPOSITORY/releases/$release_id" \
            --input finalize-release.json > final-release.json
          published=1
          trap - EXIT

      - name: Verify public redownload and record receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir public-redownload
          gh release download "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --dir public-redownload
          gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" > public-release.json
          gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" > public-tag.json
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          expected = {
              os.environ['ARCHIVE_NAME']: (int(os.environ['ARCHIVE_SIZE']), os.environ['ARCHIVE_SHA256']),
              'data-product-release-manifest.json': (int(os.environ['MANIFEST_SIZE']), os.environ['MANIFEST_SHA256']),
              'SHA256SUMS': (int(os.environ['CHECKSUMS_SIZE']), os.environ['CHECKSUMS_SHA256']),
          }
          root = Path('public-redownload')
          if {path.name for path in root.iterdir() if path.is_file()} != set(expected):
              raise RuntimeError('public redownload asset set differs')
          for name, (size, digest) in expected.items():
              path = root / name
              if path.stat().st_size != size:
                  raise RuntimeError(f'public {name} size differs')
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise RuntimeError(f'public {name} SHA-256 differs')

          release = json.loads(Path('public-release.json').read_text())
          tag = json.loads(Path('public-tag.json').read_text())
          if release.get('draft') or release.get('prerelease'):
              raise RuntimeError('release is not final')
          if tag.get('object', {}).get('sha') != os.environ['SOURCE_COMMIT']:
              raise RuntimeError('final tag target differs')
          api_assets = release.get('assets', [])
          if len(api_assets) != 3:
              raise RuntimeError('release asset count differs')
          assets = {}
          for item in api_assets:
              name = item['name']
              if name not in expected:
                  raise RuntimeError(f'unexpected release asset: {name}')
              size, digest = expected[name]
              if item['size'] != size:
                  raise RuntimeError(f'API size differs: {name}')
              api_digest = item.get('digest')
              if api_digest not in (None, f'sha256:{digest}'):
                  raise RuntimeError(f'API digest differs: {name}')
              assets[name] = {
                  'asset_id': item['id'],
                  'size_bytes': size,
                  'sha256': digest,
                  'api_digest': api_digest,
                  'download_url': item['browser_download_url'],
              }
          receipt = {
              'version': 1,
              'kind': 'data_products_v1_9_0_publication',
              'status': 'PASS',
              'release_id': release['id'],
              'release_tag': os.environ['RELEASE_TAG'],
              'release_url': release['html_url'],
              'published_at': release['published_at'],
              'source_commit': os.environ['SOURCE_COMMIT'],
              'workflow_run': int(os.environ['GITHUB_RUN_ID']),
              'draft': release['draft'],
              'prerelease': release['prerelease'],
              'asset_count': len(assets),
              'assets': dict(sorted(assets.items())),
              'public_redownload_verification': 'PASS',
          }
          Path('.github/data-products-v1.9.0-publication.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit exact one-file publication package
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-publish-data-products-v1.9.0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release(data-products): publish v1.9.0 exact assets'
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          test "$changed" = '.github/data-products-v1.9.0-publication.json'
          git push origin "HEAD:$PACKAGE_BRANCH"
