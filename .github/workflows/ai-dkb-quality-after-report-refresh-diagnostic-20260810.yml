name: AI diagnose full quality after report refresh
# Rerun after preserving dated reporting contracts.

on:
  push:
    branches:
      - ai/dacia-configurator-pdf-archive-20260809
    paths:
      - .github/workflows/ai-dkb-quality-after-report-refresh-diagnostic-20260810.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install PDF extraction backends
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check --quiet pypdf

      - name: Reproduce imported state with refreshed dependent reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/current-configurator-baseline-codes.txt
          import csv
          from pathlib import Path
          path = Path('data/master/configuration_attribute_values.csv')
          with path.open(encoding='utf-8-sig', newline='') as handle:
              rows = list(csv.DictReader(handle))
          for code in sorted((row.get('code') or '').strip() for row in rows if (row.get('code') or '').strip()):
              print(code)
          PY

          baseline=/tmp/current-configurator-baseline-codes.txt
          python tools/import_current_configurator_pdfs_20260809.py --apply > /tmp/import-stage1.log 2>&1
          python tools/import_current_configurator_pdfs_completion_20260809.py --apply > /tmp/import-stage2.log 2>&1
          python tools/reconcile_current_configurator_values_20260810.py --baseline-codes-file "$baseline" --apply > /tmp/reconcile.log 2>&1

          python - <<'PY' > /tmp/report-refresh.log 2>&1
          from tools import existing_configuration_missing_data_analysis as analysis
          payload = analysis.collect(analysis.ROOT)
          analysis.write_json(analysis.OUT_JSON, payload)
          analysis.OUT_MD.write_text(analysis.render_markdown(payload), encoding='utf-8')
          print('missing_technical_count=', payload['summary']['missing_technical_count'])
          PY
          python tools/portfolio_model_family_summary.py \
            --json data/reporting/portfolio_model_family_summary.json \
            --markdown data/reporting/portfolio_model_family_summary.md \
            --html data/reporting/portfolio_model_family_summary.html \
            >> /tmp/report-refresh.log 2>&1
          python tools/portfolio_model_family_comparison_matrix.py \
            --json data/reporting/portfolio_model_family_comparison_matrix.json \
            --csv data/reporting/portfolio_model_family_comparison_matrix.csv \
            --html data/reporting/portfolio_model_family_comparison_matrix.html \
            >> /tmp/report-refresh.log 2>&1
          python tools/portfolio_model_version_comparison_matrix.py \
            --json data/reporting/portfolio_model_version_comparison_matrix.json \
            --csv data/reporting/portfolio_model_version_comparison_matrix.csv \
            --html data/reporting/portfolio_model_version_comparison_matrix.html \
            >> /tmp/report-refresh.log 2>&1

          set +e
          python tools/dkb.py quality \
            --concise \
            --database "${RUNNER_TEMP}/dacia_knowledge_base.sqlite" \
            --log-file "${RUNNER_TEMP}/quality.log" \
            --summary-json "${RUNNER_TEMP}/quality-summary.json" \
            > /tmp/dkb-quality-stdout.log 2>&1
          quality_code=$?
          set -e

          mkdir -p /tmp/dkb-diagnostic
          {
            echo "quality_exit_code=$quality_code"
            echo "head_sha=$(git rev-parse HEAD)"
            echo
            echo "=== IMPORT SUMMARY TAIL ==="
            tail -n 45 /tmp/import-stage1.log || true
            tail -n 45 /tmp/import-stage2.log || true
            tail -n 45 /tmp/reconcile.log || true
            echo
            echo "=== REPORT REFRESH ==="
            cat /tmp/report-refresh.log || true
            echo
            echo "=== QUALITY FAILURE INDEX ==="
            grep -n -E '^FAIL:|^ERROR:|AssertionError:|RuntimeError:|ContractError:|FAILED \(|error:|ERROR: checker failed|Quality receipt rejected|quality receipt|stale|differs|mismatch|duplicate|expected .* found|uses attribute .* expected' /tmp/dkb-quality-stdout.log | tail -n 800 || true
            echo
            echo "=== QUALITY STDOUT TAIL ==="
            tail -n 1000 /tmp/dkb-quality-stdout.log || true
            echo
            echo "=== QUALITY LOG TAIL ==="
            if test -f "${RUNNER_TEMP}/quality.log"; then
              tail -n 500 "${RUNNER_TEMP}/quality.log"
            else
              echo "quality.log missing"
            fi
            echo
            echo "=== QUALITY SUMMARY JSON ==="
            if test -f "${RUNNER_TEMP}/quality-summary.json"; then
              cat "${RUNNER_TEMP}/quality-summary.json"
            else
              echo "quality-summary.json missing"
            fi
          } > /tmp/dkb-diagnostic/dkb-quality-after-report-refresh-20260810.txt

          git reset --hard HEAD
          git clean -fd -- data/master data/reporting || true
          mkdir -p project/diagnostics
          cp /tmp/dkb-diagnostic/dkb-quality-after-report-refresh-20260810.txt project/diagnostics/dkb-quality-after-report-refresh-20260810.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/diagnostics/dkb-quality-after-report-refresh-20260810.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(diagnostic): capture quality after report refresh"
            git pull --rebase origin ai/dacia-configurator-pdf-archive-20260809
            git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
          fi
          exit 0
