name: Temporary project documentation sync

on:
  push:
    branches:
      - agent/sandero-stepway-full-modal-residual-equipment-001

permissions:
  contents: write

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[skip-doc-sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Synchronize generated project documentation
        run: |
          python tools/dkb.py documentation-baseline --apply
          python tools/dkb.py project-state --apply
      - name: Commit synchronized documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md project/ROADMAP.md project/SESSION_STATE.md project/STATE_SUMMARY.md project/state.json
          if git diff --cached --quiet; then
            echo 'No documentation changes required.'
            exit 0
          fi
          git commit -m 'chore(project): synchronize generated state documentation [skip-doc-sync]'
          git push

# trigger sync after workflow registration
