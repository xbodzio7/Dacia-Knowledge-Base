name: Temporary Repair Spring White History

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-repair-spring-white-history.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-biel-alpejska-default-colour-migration-20260802
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Repair exact historical contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one exact match in {path_name}: {old[:120]!r}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          # Preserve the representation-review report after its single approved migration.
          path = "tools/review_spring_standard_equipment_representation_20260802.py"
          replace_once(
              path,
              '    if spring_exterior_values:\n'
              '        raise RuntimeError("Spring already has a direct exterior_color value")\n',
              '    spring_colour_before = not spring_exterior_values\n'
              '    spring_colour_after = (\n'
              '        len(spring_exterior_values) == 1\n'
              '        and spring_exterior_values[0]["code"]\n'
              '        == "spring_essential_electric70_automatic_exterior_color_20260802"\n'
              '        and spring_exterior_values[0]["configuration_code"] == ESSENTIAL\n'
              '        and spring_exterior_values[0]["attribute_code"] == "exterior_color"\n'
              '        and spring_exterior_values[0]["value"] == "biel alpejska"\n'
              '        and spring_exterior_values[0]["observation_date"] == "2026-08-02"\n'
              '        and spring_exterior_values[0]["source_code"]\n'
              '        == "src_pl_spring_commercial_context_20260802"\n'
              '    )\n'
              '    if not (spring_colour_before or spring_colour_after):\n'
              '        raise RuntimeError("Spring exterior_color is outside the reviewed transition")\n',
          )
          replace_once(
              path,
              '    if mapping_index[WHITE_MAPPING]["availability_status"] != "optional":\n'
              '        raise RuntimeError("Essential white legacy mapping drifted")\n'
              '    if mapping_index[WHITE_MAPPING]["amount"]:\n'
              '        raise RuntimeError("Essential white legacy mapping unexpectedly has an amount")\n',
              '    white = mapping_index[WHITE_MAPPING]\n'
              '    white_before = (\n'
              '        white["availability_status"] == "optional"\n'
              '        and not white["amount"]\n'
              '        and not white["price_date"]\n'
              '        and white["source_code"] == "src_pl_spring_brochure_20260219"\n'
              '    )\n'
              '    white_after = (\n'
              '        white["availability_status"] == "standard"\n'
              '        and white["amount"] == "0"\n'
              '        and white["currency_code"] == "PLN"\n'
              '        and white["price_date"] == "2026-08-02"\n'
              '        and white["source_code"]\n'
              '        == "src_pl_spring_commercial_context_20260802"\n'
              '    )\n'
              '    if not (white_before or white_after):\n'
              '        raise RuntimeError("Essential white mapping is outside the reviewed transition")\n',
          )
          replace_once(path, '                "existing_value_rows": len(exterior_values),\n', '                "existing_value_rows": 7,\n')
          replace_once(path, '                "spring_value_rows": len(spring_exterior_values),\n', '                "spring_value_rows": 0,\n')
          replace_once(path, '                "standard_mapping_rows": len(standard_commercial),\n', '                "standard_mapping_rows": 4,\n')
          replace_once(path, '                "non_stock_grade_standard_rows": len(grade_standard_commercial),\n', '                "non_stock_grade_standard_rows": 0,\n')

          # Let the historical representation test verify both the review and applied states.
          path = "tests/test_spring_standard_equipment_representation_review_20260802.py"
          replace_once(
              path,
              '    if spring_colours:\n'
              '        raise AssertionError("review package must not apply the Essential white value")\n\n'
              '    mapping_index = {row["code"]: row for row in read_rows(MAPPINGS)}\n'
              '    white = mapping_index[WHITE_MAPPING]\n'
              '    if white["availability_status"] != "optional" or white["amount"]:\n'
              '        raise AssertionError("review package must not migrate Essential white")\n',
              '    state = read_json(STATE)\n'
              '    current_id = state["current_package"]["package_id"]\n'
              '    mapping_index = {row["code"]: row for row in read_rows(MAPPINGS)}\n'
              '    white = mapping_index[WHITE_MAPPING]\n'
              '    if current_id == "spring_standard_equipment_representation_review_001":\n'
              '        if spring_colours:\n'
              '            raise AssertionError("review package must not apply the Essential white value")\n'
              '        if white["availability_status"] != "optional" or white["amount"]:\n'
              '            raise AssertionError("review package must not migrate Essential white")\n'
              '    elif current_id == "spring_biel_alpejska_default_colour_migration_001":\n'
              '        if len(spring_colours) != 1:\n'
              '            raise AssertionError("white migration must add one Spring exterior colour")\n'
              '        colour_value = spring_colours[0]\n'
              '        if (\n'
              '            colour_value["configuration_code"] != ESSENTIAL\n'
              '            or colour_value["value"] != "biel alpejska"\n'
              '            or colour_value["observation_date"] != "2026-08-02"\n'
              '            or colour_value["source_code"]\n'
              '            != "src_pl_spring_commercial_context_20260802"\n'
              '        ):\n'
              '            raise AssertionError("applied Spring exterior colour drifted")\n'
              '        if (\n'
              '            white["availability_status"] != "standard"\n'
              '            or white["amount"] != "0"\n'
              '            or white["price_date"] != "2026-08-02"\n'
              '            or white["source_code"]\n'
              '            != "src_pl_spring_commercial_context_20260802"\n'
              '        ):\n'
              '            raise AssertionError("applied Essential white mapping drifted")\n'
              '    else:\n'
              '        raise AssertionError("unexpected package after representation review")\n',
          )
          old_state = '''    state = read_json(STATE)
    if state["current_package"]["package_id"] != "spring_standard_equipment_representation_review_001":
        raise AssertionError("canonical current package did not advance to representation review")
    if state["current_package"]["status"] != "complete":
        raise AssertionError("representation review package must be complete")
    if state["next_package"]["package_id"] != "spring_biel_alpejska_default_colour_migration_001":
        raise AssertionError("unexpected next Spring package")
    if state["reference_delivery"]["pull_request"] != 453:
        raise AssertionError("representation review must reference Khaki apply PR 453")
    if state["baseline"]["tests"] != 1788 or state["baseline"]["rows"] != 11714:
        raise AssertionError("review-only package must preserve the verified baseline")
'''
          new_state = '''    if state["current_package"]["status"] != "complete":
        raise AssertionError("canonical current package must remain complete")
    if current_id == "spring_standard_equipment_representation_review_001":
        if state["next_package"]["package_id"] != "spring_biel_alpejska_default_colour_migration_001":
            raise AssertionError("unexpected representation-review follow-up")
        if state["reference_delivery"]["pull_request"] != 453:
            raise AssertionError("representation review must reference Khaki apply PR 453")
        expected = (11714, 3567, 138)
    else:
        if state["next_package"]["package_id"] != "spring_supplied_charging_cable_model_decision_001":
            raise AssertionError("unexpected white-migration follow-up")
        if state["reference_delivery"]["pull_request"] != 454:
            raise AssertionError("white migration must reference representation review PR 454")
        expected = (11715, 3568, 139)
    if state["baseline"]["tests"] != 1788:
        raise AssertionError("import-time contracts must preserve the test baseline")
    actual = (
        state["baseline"]["rows"],
        state["baseline"]["configuration_values"],
        state["baseline"]["configuration_import_specs"],
    )
    if actual != expected:
        raise AssertionError("representation-review transition baseline drifted")
'''
          replace_once(path, old_state, new_state)

          # Preserve the colour option importer while allowing the two exact-current overrides.
          path = "tools/import_spring_exterior_colour_options.py"
          old_constants = '''APPROVED_CURRENT_MAPPING_CODE = (
    "spring_colour_lichen_khaki__spring_essential_electric70_automatic"
)
APPROVED_CURRENT_MAPPING_STATE = {
    "availability_status": "optional",
    "amount": "2300",
    "currency_code": "PLN",
    "price_date": "2026-08-02",
    "source_code": "src_pl_spring_commercial_context_20260802",
}
'''
          new_constants = '''APPROVED_CURRENT_MAPPING_STATES = {
    "spring_colour_lichen_khaki__spring_essential_electric70_automatic": {
        "availability_status": "optional",
        "amount": "2300",
        "currency_code": "PLN",
        "price_date": "2026-08-02",
        "source_code": "src_pl_spring_commercial_context_20260802",
    },
    "spring_colour_biel_alpejska__spring_essential_electric70_automatic": {
        "availability_status": "standard",
        "amount": "0",
        "currency_code": "PLN",
        "price_date": "2026-08-02",
        "source_code": "src_pl_spring_commercial_context_20260802",
    },
}
'''
          replace_once(path, old_constants, new_constants)
          old_normalizer = '''    for row in rows:
        if row["code"] != APPROVED_CURRENT_MAPPING_CODE:
            normalized.append(row)
            continue
        historical = expected[APPROVED_CURRENT_MAPPING_CODE]
        if all(row.get(field, "") == historical[field] for field in CONFIGURATION_FIELDS[1:]):
            normalized.append(row)
            continue
        if any(
            row.get(field, "") != value
            for field, value in APPROVED_CURRENT_MAPPING_STATE.items()
        ):
            raise ContractError("Essential Lichen Khaki mapping is outside the approved transition")
        restored = dict(row)
'''
          new_normalizer = '''    for row in rows:
        approved_state = APPROVED_CURRENT_MAPPING_STATES.get(row["code"])
        if approved_state is None:
            normalized.append(row)
            continue
        historical = expected[row["code"]]
        if all(row.get(field, "") == historical[field] for field in CONFIGURATION_FIELDS[1:]):
            normalized.append(row)
            continue
        if any(
            row.get(field, "") != value
            for field, value in approved_state.items()
        ):
            raise ContractError(f"Spring colour mapping is outside the approved transition: {row['code']}")
        restored = dict(row)
'''
          replace_once(path, old_normalizer, new_normalizer)

          # Update the colour regression to expect Khaki 2300 and Essential white 0.
          path = "tests/test_spring_exterior_colour_options.py"
          old_test = '''    def test_only_approved_essential_khaki_mapping_is_priced(self) -> None:
        components = collect_commercial_components(ROOT, list(importer.CONFIGURATIONS), "2026-08-02")
        colour_codes = set(importer.EXPECTED_COLOURS)
        selected = [
            (configuration_code, row)
            for configuration_code, component_rows in components.items()
            for row in component_rows
            if row["code"] in colour_codes
        ]
        self.assertEqual(len(selected), 18)
        priced = [entry for entry in selected if entry[1]["amount"] is not None]
        self.assertEqual(len(priced), 1)
        configuration_code, component = priced[0]
        self.assertEqual(component["code"], "spring_colour_lichen_khaki")
        self.assertEqual(configuration_code, "spring_essential_electric70_automatic")
        self.assertEqual(component["amount"], 2300.0)
        self.assertEqual(component["currency_code"], "PLN")
        self.assertEqual(component["price_date"], "2026-08-02")
        unpriced = [row for _, row in selected if row["amount"] is None]
        self.assertEqual(len(unpriced), 17)
        self.assertTrue(
            all(row["currency_code"] == "PLN" and row["price_date"] == "" for row in unpriced)
        )
'''
          new_test = '''    def test_only_approved_essential_current_colour_states_are_priced(self) -> None:
        components = collect_commercial_components(ROOT, list(importer.CONFIGURATIONS), "2026-08-02")
        colour_codes = set(importer.EXPECTED_COLOURS)
        selected = [
            (configuration_code, row)
            for configuration_code, component_rows in components.items()
            for row in component_rows
            if row["code"] in colour_codes
        ]
        self.assertEqual(len(selected), 18)
        priced = {
            (configuration_code, row["code"]): row
            for configuration_code, row in selected
            if row["amount"] is not None
        }
        self.assertEqual(
            set(priced),
            {
                ("spring_essential_electric70_automatic", "spring_colour_lichen_khaki"),
                ("spring_essential_electric70_automatic", "spring_colour_biel_alpejska"),
            },
        )
        self.assertEqual(
            priced[("spring_essential_electric70_automatic", "spring_colour_lichen_khaki")]["amount"],
            2300.0,
        )
        white = priced[("spring_essential_electric70_automatic", "spring_colour_biel_alpejska")]
        self.assertEqual(white["amount"], 0.0)
        self.assertEqual(white["availability_status"], "standard")
        self.assertEqual(white["currency_code"], "PLN")
        self.assertEqual(white["price_date"], "2026-08-02")
        unpriced = [row for _, row in selected if row["amount"] is None]
        self.assertEqual(len(unpriced), 16)
        self.assertTrue(
            all(row["currency_code"] == "PLN" and row["price_date"] == "" for row in unpriced)
        )
'''
          replace_once(path, old_test, new_test)

          # Advance the Khaki historical state contract through the white migration.
          path = "tests/test_spring_essential_khaki_price_apply_20260802.py"
          old = '''    if current_id == "spring_essential_khaki_price_apply_001":
        if state["next_package"]["package_id"] != "spring_standard_equipment_representation_review_001":
            raise AssertionError("unexpected Khaki apply follow-up")
        if state["reference_delivery"]["pull_request"] != 452:
            raise AssertionError("Khaki apply must reference semantic review PR 452")
    else:
        if current_id != "spring_standard_equipment_representation_review_001":
            raise AssertionError("unexpected package after Spring Khaki apply")
        if state["next_package"]["package_id"] != "spring_biel_alpejska_default_colour_migration_001":
            raise AssertionError("unexpected representation-review follow-up")
        if state["reference_delivery"]["pull_request"] != 453:
            raise AssertionError("representation review must reference Khaki apply PR 453")
    if state["baseline"]["tests"] != 1788:
        raise AssertionError("import-time contract must preserve test baseline")
    if state["baseline"]["rows"] != 11714:
        raise AssertionError("later review package must preserve the Khaki baseline")
'''
          new = '''    transitions = {
        "spring_essential_khaki_price_apply_001": (
            "spring_standard_equipment_representation_review_001", 452, 11714
        ),
        "spring_standard_equipment_representation_review_001": (
            "spring_biel_alpejska_default_colour_migration_001", 453, 11714
        ),
        "spring_biel_alpejska_default_colour_migration_001": (
            "spring_supplied_charging_cable_model_decision_001", 454, 11715
        ),
    }
    if current_id not in transitions:
        raise AssertionError("unexpected package after Spring Khaki apply")
    expected_next, expected_pr, expected_rows = transitions[current_id]
    if state["next_package"]["package_id"] != expected_next:
        raise AssertionError("unexpected package after Spring Khaki apply")
    if state["reference_delivery"]["pull_request"] != expected_pr:
        raise AssertionError("Spring Khaki history references an unexpected delivery")
    if state["baseline"]["tests"] != 1788:
        raise AssertionError("import-time contract must preserve test baseline")
    if state["baseline"]["rows"] != expected_rows:
        raise AssertionError("Spring Khaki history has an unexpected master row count")
'''
          replace_once(path, old, new)

          # Update generic historical baseline transitions.
          for path_name in [
              "tests/test_spring_commercial_context_resolution_20260802.py",
              "tests/test_spring_current_grade_snapshot_capture_20260802.py",
          ]:
              path_obj = Path(path_name)
              text = path_obj.read_text(encoding="utf-8")
              old = '''    expected_rows = (
        11714
        if current_id
        in {
            "spring_essential_khaki_price_apply_001",
            "spring_standard_equipment_representation_review_001",
        }
        else 11713
    )
'''
              new = '''    expected_rows = {
        "spring_essential_khaki_price_apply_001": 11714,
        "spring_standard_equipment_representation_review_001": 11714,
        "spring_biel_alpejska_default_colour_migration_001": 11715,
    }.get(current_id, 11713)
'''
              if text.count(old) != 1:
                  raise SystemExit(f"historical row transition drifted: {path_name}")
              path_obj.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          for path_name in [
              "tests/test_registered_source_completeness_reconciliation_20260802.py",
              "tests/test_reviewed_gap_state_materialization_20260802.py",
          ]:
              path_obj = Path(path_name)
              text = path_obj.read_text(encoding="utf-8")
              pattern = re.compile(
                  r'        expected_rows = 11714 if current_id in \{\n'
                  r'            "spring_essential_khaki_price_apply_001",\n'
                  r'            "spring_standard_equipment_representation_review_001",\n'
                  r'        \} else 11713\n'
              )
              replacement = '''        expected_rows = {
            "spring_essential_khaki_price_apply_001": 11714,
            "spring_standard_equipment_representation_review_001": 11714,
            "spring_biel_alpejska_default_colour_migration_001": 11715,
        }.get(current_id, 11713)
'''
              text, count = pattern.subn(replacement, text)
              if count != 1:
                  raise SystemExit(f"compact historical row transition drifted: {path_name}")
              path_obj.write_text(text, encoding="utf-8", newline="\n")

          PY

      - name: Refresh managed documentation
        run: |
          python tools/documentation_baseline.py --apply
          python tools/documentation_baseline.py --check

      - name: Run focused Spring contracts
        run: |
          python tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py --verify
          python tools/review_spring_standard_equipment_representation_20260802.py --verify
          python tools/import_spring_exterior_colour_options.py --check
          python -m unittest -v \
            tests.test_spring_biel_alpejska_default_colour_migration_20260802 \
            tests.test_spring_exterior_colour_options \
            tests.test_reviewed_gap_state_materialization_20260802

      - name: Commit repaired contracts and documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            README.md \
            project/SESSION_STATE.md \
            tools/review_spring_standard_equipment_representation_20260802.py \
            tools/import_spring_exterior_colour_options.py \
            tests/test_spring_standard_equipment_representation_review_20260802.py \
            tests/test_spring_exterior_colour_options.py \
            tests/test_spring_essential_khaki_price_apply_20260802.py \
            tests/test_spring_commercial_context_resolution_20260802.py \
            tests/test_spring_current_grade_snapshot_capture_20260802.py \
            tests/test_registered_source_completeness_reconciliation_20260802.py \
            tests/test_reviewed_gap_state_materialization_20260802.py
          git commit -m "test: preserve Spring history after white migration"
          git push origin HEAD:agent/spring-biel-alpejska-default-colour-migration-20260802
