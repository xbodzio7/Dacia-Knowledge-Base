name: Temporary Build Official Configurator Coverage Package

on:
  push:
    branches:
      - agent/official-configurator-coverage-reconciliation-20260802
    paths:
      - .github/workflows/temp-build-official-configurator-coverage.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/official-configurator-coverage-reconciliation-20260802
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and verify package
        shell: bash
        env:
          PACKAGE_SCRIPT_GZ_B64: ""
        run: |
          python - <<'PY'
          import base64, gzip, os
          script = gzip.decompress(base64.b64decode(os.environ["PACKAGE_SCRIPT_GZ_B64"])).decode("utf-8")
          exec(compile(script, "<official-configurator-package>", "exec"))
          PY
          python tools/documentation_baseline.py --apply
          python tools/dkb.py project-state --apply
          python tools/review_official_configurator_coverage_20260802.py --verify
          python -m unittest -v tests.test_official_configurator_coverage_reconciliation_20260802
      - name: Commit package and remove builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temp-build-official-configurator-coverage.yml
          git add -A
          git commit -m "data: reconcile official configurator coverage"
          git push origin HEAD:agent/official-configurator-coverage-reconciliation-20260802
