name: AI Dacia configurator PDF diagnostic

on:
  push:
    branches:
      - ai/dacia-configurator-pdf-archive-20260809
    paths:
      - .github/workflows/ai-dacia-configurator-pdf-diagnostic.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser tooling
        run: python -m pip install --quiet selenium
      - name: Inspect configurator DOM
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          pages = {
              'sandero': 'https://www.dacia.pl/samochody/sandero-miejskie/konfigurator.html',
              'sandero_stepway': 'https://www.dacia.pl/samochody/sandero-stepway/konfigurator.html',
              'jogger_5': 'https://www.dacia.pl/samochody/jogger-hybydowy/konfigurator.html',
              'jogger_7': 'https://www.dacia.pl/samochody/jogger-7/konfigurator.html',
              'duster': 'https://www.dacia.pl/hybrydy-i-elektryczne/duster-suv/konfigurator.html',
              'bigster': 'https://www.dacia.pl/hybrydy-i-elektryczne/bigster-suv/konfigurator.html',
              'spring': 'https://www.dacia.pl/hybrydy-i-elektryczne/spring-miejski/konfigurator.html',
          }

          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1600,1200')
          opts.add_argument('--lang=pl-PL')
          driver = webdriver.Chrome(options=opts)
          results = {}
          try:
              for key, url in pages.items():
                  print('OPEN', key, url, flush=True)
                  driver.get(url)
                  time.sleep(8)
                  for txt in ['Akceptuj wszystkie', 'Akceptuj', 'Zgadzam się', 'Zaakceptuj wszystkie']:
                      try:
                          el = driver.find_element(By.XPATH, f"//*[self::button or self::a][contains(normalize-space(.), {json.dumps(txt)})]")
                          if el.is_displayed():
                              el.click(); time.sleep(1); break
                      except Exception:
                          pass
                  data = driver.execute_script(r'''
                    const out = {title: document.title, url: location.href, inputs: [], buttons: [], links: []};
                    for (const el of document.querySelectorAll('input')) {
                      const id = el.id || '';
                      let label = '';
                      if (id) {
                        const l = document.querySelector(`label[for="${CSS.escape(id)}"]`);
                        if (l) label = l.innerText.trim();
                      }
                      if (!label) {
                        const p = el.closest('label,[role="radio"],[role="checkbox"],li,article,section,div');
                        if (p) label = (p.innerText || '').trim().replace(/\s+/g,' ').slice(0,300);
                      }
                      out.inputs.push({type:el.type,name:el.name,value:el.value,id,checked:el.checked,disabled:el.disabled,label});
                    }
                    for (const el of document.querySelectorAll('button,[role="button"]')) {
                      const text=(el.innerText||el.getAttribute('aria-label')||'').trim().replace(/\s+/g,' ');
                      if (text) out.buttons.push({text:text.slice(0,300),disabled:!!el.disabled,tag:el.tagName,cls:el.className});
                    }
                    for (const el of document.querySelectorAll('a')) {
                      const text=(el.innerText||el.getAttribute('aria-label')||'').trim().replace(/\s+/g,' ');
                      if (text) out.links.push({text:text.slice(0,300),href:el.href});
                    }
                    return out;
                  ''')
                  results[key] = data
                  print(key, 'inputs', len(data['inputs']), 'buttons', len(data['buttons']), 'links', len(data['links']), flush=True)
          finally:
              driver.quit()

          path = Path('project/sources/dacia-pl-configurator-dom-diagnostic-20260809.json')
          path.write_text(json.dumps(results, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/sources/dacia-pl-configurator-dom-diagnostic-20260809.json
          git commit -m "chore(source): inspect current configurator controls"
          git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
