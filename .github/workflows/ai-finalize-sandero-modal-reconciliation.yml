name: AI finalize Sandero modal reconciliation

on:
  push:
    branches:
      - ai/sandero-stepway-full-modal-reconciliation-001
    paths:
      - .github/workflows/ai-finalize-sandero-modal-reconciliation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/sandero-stepway-full-modal-reconciliation-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply final repository-evolution contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s) of {old!r}, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace('tools/reporting/portfolio_source_coverage_matrix.py', 'if active_relationship_count != 269:', 'if active_relationship_count != 284:')
          replace('tools/reporting/portfolio_source_coverage_matrix.py', '"expected 269 active source-to-configuration relationships, "', '"expected 284 active source-to-configuration relationships, "')
          replace('tools/reporting/portfolio_source_coverage_matrix.py', 'if len(relations_by_source) != 34:', 'if len(relations_by_source) != 35:')
          replace('tools/reporting/portfolio_source_coverage_matrix.py', 'f"expected 34 used provenance sources, found {len(relations_by_source)}"', 'f"expected 35 used provenance sources, found {len(relations_by_source)}"')
          replace('tools/reporting/portfolio_source_coverage_matrix.py', 'if sum(record["relationship_count"] for record in records) != 269:', 'if sum(record["relationship_count"] for record in records) != 284:')
          replace('tools/reporting/portfolio_source_coverage_matrix.py', '"source rows do not preserve all 269 relationships exactly once"', '"source rows do not preserve all 284 relationships exactly once"')

          replace('tests/source_matrix_checks.py', '"provenance_source_count": 34', '"provenance_source_count": 35')
          replace('tests/source_matrix_checks.py', '"source_configuration_relationship_count": 269', '"source_configuration_relationship_count": 284')
          replace('tests/source_matrix_checks.py', 'testcase.assertEqual(len(records), 34)', 'testcase.assertEqual(len(records), 35)')
          replace('tests/source_matrix_checks.py', 'testcase.assertEqual(relationship_total, 269)', 'testcase.assertEqual(relationship_total, 284)')
          replace('tests/source_matrix_checks.py', 'testcase.assertEqual(len(csv_rows), 34)', 'testcase.assertEqual(len(csv_rows), 35)')
          replace('tests/source_matrix_checks.py', 'sum(int(row["relationship_count"]) for row in csv_rows),\n        269,', 'sum(int(row["relationship_count"]) for row in csv_rows),\n        284,')
          replace('tests/source_matrix_checks.py', 'html_text.count("<tr>"), 35', 'html_text.count("<tr>"), 36')
          replace('tests/source_matrix_checks.py', 'html_text.count("SHA-256 "), 34', 'html_text.count("SHA-256 "), 35')

          replace('tools/reporting/portfolio_source_coverage_matrix_release_integration.py', '"provenance_source_count": 34,', '"provenance_source_count": 35,')
          replace('tools/reporting/portfolio_source_coverage_matrix_release_integration.py', '"source_configuration_relationship_count": 269,', '"source_configuration_relationship_count": 284,')
          replace('tools/reporting/portfolio_source_coverage_matrix_release_integration.py', 'if not isinstance(sources, list) or len(sources) != 34:', 'if not isinstance(sources, list) or len(sources) != 35:')
          replace('tools/reporting/portfolio_source_coverage_matrix_release_integration.py', '"portfolio source coverage matrix must contain 34 source rows"', '"portfolio source coverage matrix must contain 35 source rows"')
          replace('tools/reporting/portfolio_source_coverage_matrix_release_integration.py', 'if relationship_count != 269:', 'if relationship_count != 284:')

          replace('tools/reporting/portfolio_model_version_comparison_release_integration.py', '"provenance_source_count": 34', '"provenance_source_count": 35')
          replace('tools/reporting/portfolio_model_version_comparison_release_integration.py', '"source_configuration_relationship_count": 269', '"source_configuration_relationship_count": 284')
          replace('tools/reporting/portfolio_model_version_comparison_release_integration.py', 'if relationship_count != 269:', 'if relationship_count != 284:')

          # Integration tests describe current verified products, not the immutable text
          # of historical v1.15.0 release notes.
          replace('tests/test_portfolio_model_family_release_integration.py', 'self.assertEqual(version_summary["provenance_source_count"], 34)', 'self.assertEqual(version_summary["provenance_source_count"], 35)')
          replace('tests/test_portfolio_model_family_release_integration.py', '            269,\n        )\n\n        self.assertEqual(source_matrix["kind"]', '            284,\n        )\n\n        self.assertEqual(source_matrix["kind"]')
          replace('tests/test_portfolio_model_family_release_integration.py', '"provenance_source_count": 34,', '"provenance_source_count": 35,')
          replace('tests/test_portfolio_model_family_release_integration.py', '"source_configuration_relationship_count": 269,', '"source_configuration_relationship_count": 284,')
          replace('tests/test_portfolio_model_family_release_integration.py', 'self.assertEqual(len(source_rows), 34)', 'self.assertEqual(len(source_rows), 35)')
          replace('tests/test_portfolio_model_family_release_integration.py', 'self.assertEqual(len({row["source_code"] for row in source_rows}), 34)', 'self.assertEqual(len({row["source_code"] for row in source_rows}), 35)')
          replace('tests/test_portfolio_model_family_release_integration.py', 'sum(row["relationship_count"] for row in source_rows),\n            269,', 'sum(row["relationship_count"] for row in source_rows),\n            284,')
          replace('tests/test_portfolio_model_family_release_integration.py', 'self.assertEqual(source_html.count("<tr>"), 35)', 'self.assertEqual(source_html.count("<tr>"), 36)')

          path = Path('tests/test_verified_pdf_candidate_coverage_reconciliation.py')
          text = path.read_text(encoding='utf-8')
          old = '''            final_key = path[-1]\n            if isinstance(target, list):\n                target[int(final_key)] = committed_value\n            else:\n                target[final_key] = committed_value\n'''
          new = '''            final_key = path[-1]\n            if isinstance(target, list) and final_key == "length":\n                historical: Any = committed_payload\n                for key in path[:-1]:\n                    historical = (\n                        historical[int(key)] if isinstance(historical, list) else historical[key]\n                    )\n                target[:] = copy.deepcopy(historical)\n            elif isinstance(target, list):\n                target[int(final_key)] = committed_value\n            else:\n                target[final_key] = committed_value\n'''
          if text.count(old) != 1:
              raise SystemExit('dated PDF normalization block not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Refresh provenance-dependent artifacts
        run: |
          python tools/portfolio_source_coverage_matrix.py \
            --json data/reporting/portfolio_source_coverage_matrix.json \
            --csv data/reporting/portfolio_source_coverage_matrix.csv \
            --html data/reporting/portfolio_source_coverage_matrix.html
          python tools/portfolio_model_version_comparison_matrix.py \
            --json data/reporting/portfolio_model_version_comparison_matrix.json \
            --csv data/reporting/portfolio_model_version_comparison_matrix.csv \
            --html data/reporting/portfolio_model_version_comparison_matrix.html
          python tools/dkb.py documentation-baseline --apply
          python tools/dkb.py project-state --apply
      - name: Run focused final tests
        run: |
          python -m unittest -q \
            tests.test_verified_pdf_candidate_coverage_reconciliation \
            tests.test_portfolio_model_family_release_integration \
            tests.test_portfolio_model_family_summary
      - name: Commit final artifacts and contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/ai-finalize-sandero-modal-reconciliation.yml
          if ! git diff --cached --quiet; then
            git commit -m "test(data): finalize provenance evolution contracts"
            git push origin HEAD:ai/sandero-stepway-full-modal-reconciliation-001
          fi
      - name: Run full unit suite
        run: python -m unittest discover -s tests -p "test_*.py" -q
