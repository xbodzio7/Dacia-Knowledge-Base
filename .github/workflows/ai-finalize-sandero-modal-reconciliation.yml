name: AI finalize Sandero modal reconciliation

on:
  push:
    branches:
      - ai/sandero-stepway-full-modal-reconciliation-001
    paths:
      - .github/workflows/ai-finalize-sandero-modal-reconciliation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/sandero-stepway-full-modal-reconciliation-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Repair remaining evolution contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s) of {old!r}, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Restore the immutable source hash accidentally touched by a previous mechanical count edit.
          replace(
              'tools/import_sandero_stepway_essential_source_gap_20260626.py',
              '14dbd68fc58d63bc81595f64784e37081ef25ed0103e2a74768477e602b29ea1',
              '14dbd68fc58d63bc81595f64784e37089ef25ed0103e2a74768477e602b29ea1',
          )

          # Current portfolio provenance gained one exact source and fifteen exact relationships.
          replace('tools/reporting/portfolio_model_family_comparison_release_integration.py', '"provenance_source_count": 34', '"provenance_source_count": 35')
          replace('tools/reporting/portfolio_model_family_comparison_release_integration.py', '"source_configuration_relationship_count": 269', '"source_configuration_relationship_count": 284')
          replace('tests/version_matrix_checks.py', '"provenance_source_count": 34', '"provenance_source_count": 35')
          replace('tests/version_matrix_checks.py', '"source_configuration_relationship_count": 269', '"source_configuration_relationship_count": 284')

          # Current completeness reflects the new source-backed standard equipment observations.
          replace('tests/test_post_v1_11_0_release_priority_selection_20260803.py', 'completeness["missing_equipment_count"], 36', 'completeness["missing_equipment_count"], 12')

          # Closed exact-configurator package verifier must allow later global source relationships.
          replace('tools/import_sandero_stepway_exact_configurator_states_20260809.py', '"source_configurations.csv": 269', '"source_configurations.csv": 284')
          replace('tests/test_sandero_stepway_exact_design_factory_option_normalization_20260809.py', 'len(self.source_configurations), 269', 'len(self.source_configurations), 284')
          PY
      - name: Print dated PDF reconciliation differences
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'tests')
          import test_verified_pdf_candidate_coverage_reconciliation as t
          current, _ = t.reconciliation.build_from_paths(
              t.ROOT, t.reconciliation.DEFAULT_LEDGER, t.reconciliation.DEFAULT_REVIEW
          )
          committed = json.loads(t.ARTIFACT_JSON.read_text(encoding='utf-8'))
          diffs = t.json_differences(committed, current)
          print('PDF_DIFF_COUNT', len(diffs))
          for d in diffs:
              print('PDF_DIFF', repr(d))
          PY
      - name: Refresh generated documentation
        run: |
          python tools/dkb.py documentation-baseline --apply
          python tools/dkb.py project-state --apply
      - name: Commit repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/ai-finalize-sandero-modal-reconciliation.yml
          if ! git diff --cached --quiet; then
            git commit -m "test(data): repair later-evidence contracts"
            git push origin HEAD:ai/sandero-stepway-full-modal-reconciliation-001
          fi
      - name: Run full unit suite
        run: python -m unittest discover -s tests -p "test_*.py" -q
