name: AI finalize Sandero modal reconciliation

on:
  push:
    branches:
      - ai/sandero-stepway-full-modal-reconciliation-001
    paths:
      - .github/workflows/ai-finalize-sandero-modal-reconciliation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/sandero-stepway-full-modal-reconciliation-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Align repository evolution contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found == 0:
                  print(f'already aligned or absent: {path}: {old!r}')
                  return
              if count is not None and found != count:
                  raise SystemExit(f'{path}: expected {count} occurrences of {old!r}, found {found}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'aligned {path}: {found} replacement(s)')

          # Current completeness genuinely gained eight technical observations.
          for path in [
              'tests/test_sandero_stepway_essential_source_gap_20260626.py',
              'tests/test_sandero_stepway_expression_source_gap_20260626.py',
              'tests/test_post_v1_11_0_release_priority_selection_20260803.py',
              'tests/test_spring_nonconflicting_common_technical_observations_migration_20260802.py',
              'tools/import_sandero_stepway_essential_source_gap_20260626.py',
              'tools/import_sandero_stepway_expression_source_gap_20260626.py',
          ]:
              replace(path, '89', '81')

          # One later registered source and its 15 exact configuration relationships are valid evolution.
          replace('tools/reporting/portfolio_model_family_release_integration.py', '"source_configuration_relationship_count": 269', '"source_configuration_relationship_count": 284', 1)
          p = 'tests/test_portfolio_model_family_summary.py'
          replace(p, '"provenance_source_count": 34', '"provenance_source_count": 35', 2)
          replace(p, '"source_configuration_relationship_count": 269', '"source_configuration_relationship_count": 284', 2)
          replace(p, '"sandero_iii": (9, 36, "2026-02-02", "2026-08-09")', '"sandero_iii": (10, 43, "2026-02-02", "2026-08-09")', 1)
          replace(p, '"sandero_stepway_iii": (12, 44, "2026-02-02", "2026-08-09")', '"sandero_stepway_iii": (13, 52, "2026-02-02", "2026-08-09")', 1)
          replace(p, 'self.assertEqual(matrix_relationship_total, 269)', 'self.assertEqual(matrix_relationship_total, 284)', 1)
          replace(p, 'self.assertEqual(relation_total, 269)', 'self.assertEqual(relation_total, 284)', 1)
          replace(p, 'self.assertEqual(len(used_sources), 34)', 'self.assertEqual(len(used_sources), 35)', 1)
          replace(p, 'summary_rendered.count("SHA-256 "), 39', 'summary_rendered.count("SHA-256 "), 41', 1)

          # Closed package verifiers must tolerate the one legitimate later source in the global registry.
          replace('tools/import_sandero_stepway_exact_configurator_states_20260809.py', '"sources.csv": 37', '"sources.csv": 38', 1)
          replace('tests/test_sandero_stepway_exact_design_factory_option_normalization_20260809.py', 'len(self.sources), 37', 'len(self.sources), 38', 1)

          # Reconciliation contract reflects conservative standard-only and gap-fill-only semantics.
          p = 'tests/test_sandero_stepway_full_modal_canonical_reconciliation_20260809.py'
          replace(p, 'summary["technical_rows_safely_mapped"]\n            + summary["technical_rows_preserved_unmatched_or_ambiguous"]', 'summary["technical_rows_safely_mapped"]\n            + summary["technical_rows_already_canonically_covered"]\n            + summary["technical_rows_preserved_unmatched_or_ambiguous"]', 1)
          replace(p, 'self.assertEqual(len(equipment), 655)', 'self.assertEqual(len(equipment), 588)', 1)
          replace(p, 'self.assertEqual(len(technical), 180)', 'self.assertEqual(len(technical), 26)', 1)
          replace(p, 'summary["equipment_rows_preserved_unmatched_or_ambiguous"], 374', 'summary["equipment_rows_preserved_unmatched_or_ambiguous"], 441', 1)
          PY
      - name: Refresh generated documentation
        shell: bash
        run: |
          set -euo pipefail
          python tools/dkb.py documentation-baseline --apply
          python tools/dkb.py project-state --apply
      - name: Commit aligned contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/ai-finalize-sandero-modal-reconciliation.yml
          if ! git diff --cached --quiet; then
            git commit -m "test(data): align contracts with later source evidence"
            git push origin HEAD:ai/sandero-stepway-full-modal-reconciliation-001
          fi
      - name: Run full unit suite
        run: python -m unittest discover -s tests -p "test_*.py" -q
