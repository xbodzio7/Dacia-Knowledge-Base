# Temporary package hook: removed by its own successful run.
name: AI rematerialize Sandero residual equipment

on:
  push:
    branches:
      - agent/sandero-stepway-full-modal-residual-equipment-001
    paths:
      - .github/workflows/ai-rematerialize-sandero-modal-reconciliation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sandero-stepway-full-modal-residual-equipment-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply residual equipment
        run: python tools/materialize_sandero_stepway_full_modal_residual_equipment_20260910.py --apply
      - name: Verify residual equipment
        run: python -m unittest tests/test_sandero_stepway_full_modal_residual_equipment_20260910.py
      - name: Commit materialized data and remove hook
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master/configuration_attribute_availability.csv
          git rm .github/workflows/ai-rematerialize-sandero-modal-reconciliation.yml
          git rm .github/workflows/ai-rematerialize-sandero-residual-equipment.yml
          git commit -m "data(sandero): materialize residual standard equipment"
          git push origin HEAD:agent/sandero-stepway-full-modal-residual-equipment-001
