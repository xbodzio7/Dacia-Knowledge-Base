name: Reconcile final source coverage guard

on:
  push:
    branches:
      - agent/sandero-stepway-full-modal-canonical-reconciliation-001
    paths:
      - .github/workflows/_reconcile_final_source_guard.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align final release guard and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = (
              ('"provenance_source_count": 34,', '"provenance_source_count": 35,'),
              ('"source_configuration_relationship_count": 269,', '"source_configuration_relationship_count": 284,'),
              ('not isinstance(sources, list) or len(sources) != 34', 'not isinstance(sources, list) or len(sources) != 35'),
              ('must contain 34 source rows', 'must contain 35 source rows'),
              ('if relationship_count != 269:', 'if relationship_count != 284:'),
              ('m["source_rows"],34', 'm["source_rows"],35'),
              ('m["source_rows"], 34', 'm["source_rows"], 35'),
              ('["source_rows"], 34', '["source_rows"], 35'),
              ('["source_rows"],34', '["source_rows"],35'),
          )

          candidates = [Path('tools/reporting/portfolio_source_coverage_matrix_release_integration.py')]
          candidates += list(Path('tests').rglob('*.py'))
          changed = []
          for path in candidates:
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
          print('patched:', *changed, sep='\n- ')
          if not changed:
              raise SystemExit('no final source-coverage guards required patching')
          PY
      - name: Run full quality and finalize
        shell: bash
        run: |
          python tools/dkb.py quality
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .reconcile-quality.log 2>/dev/null || true
          git rm -f .github/workflows/_reconcile_sandero_full_modal_once.yml
          git rm -f .github/workflows/_reconcile_final_source_guard.yml
          git add data/master data/reporting tools tests project .github/workflows
          git commit -m "data: reconcile Sandero full-modal canonical observations"
          git push origin HEAD
