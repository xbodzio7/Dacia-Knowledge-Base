name: Temporary Jogger acceleration documentation baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/jogger-page19-acceleration-observations-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/jogger-page19-acceleration-observations-20260730
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install PDF text extraction backend
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Extend package manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('project/state.json')
          state = json.loads(path.read_text(encoding='utf-8'))
          manifest = state['current_package']['manifest_paths']
          additions = [
              'README.md',
              'CHANGELOG.md',
              'project/ROADMAP.md',
              'project/SESSION_STATE.md',
          ]
          for item in additions:
              if item not in manifest:
                  manifest.insert(-2, item)
          if len(manifest) != len(set(manifest)):
              raise SystemExit('current package manifest contains duplicates')
          path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
      - name: Synchronize managed documentation
        run: |
          python tools/dkb.py documentation-baseline --apply
          python tools/dkb.py documentation-baseline --check
          python tools/dkb.py project-state --apply
          python tools/dkb.py project-state --check
      - name: Run full repository tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Commit final documentation and remove workflow
        run: |
          rm .github/workflows/temporary-jogger-acceleration-documentation-baseline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            CHANGELOG.md \
            project/ROADMAP.md \
            project/SESSION_STATE.md \
            project/state.json \
            project/STATE_SUMMARY.md \
            .github/workflows/temporary-jogger-acceleration-documentation-baseline.yml
          git commit -m "docs(jogger): synchronize documentation baseline"
          git push origin HEAD:agent/jogger-page19-acceleration-observations-20260730
