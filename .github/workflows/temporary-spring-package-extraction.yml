name: Temporary Spring Package Extraction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  extract:
    if: github.head_ref == 'agent/spring-commercial-packages-and-charging-options-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install extraction backend
        run: python -m pip install --disable-pip-version-check pypdf==6.0.0
      - name: Verify source and extract exact package pages
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from pypdf import PdfReader

          path = Path('PDF/Broszury/DACIA SPRING broszura 20260219.pdf')
          expected = '73a4c568ce273bc095f6ecf1cfa4f5f2a92324bb2f0bbc171ba45bb4a4cf3c8d'
          actual = sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA mismatch: {actual}')
          reader = PdfReader(path)
          print(f'SOURCE_SHA256={actual}')
          print(f'PAGE_COUNT={len(reader.pages)}')
          for page_number in (12, 13, 14):
              print(f'\n===== PDF PAGE {page_number + 1} =====')
              print(reader.pages[page_number].extract_text(extraction_mode="layout"))
          PY
