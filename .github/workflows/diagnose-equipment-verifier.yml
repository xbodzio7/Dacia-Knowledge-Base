name: Diagnose Equipment Verifier

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/diagnose-equipment-verifier.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out regression-fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/equipment-filter-regression-model-price-order
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Apply diagnostic transformations
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          text = Path('.github/workflows/diagnose-equipment-materializer.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"          python - <<'PY'\n(.*?)\n          PY", text, flags=re.DOTALL)
          if len(blocks) < 2:
              raise SystemExit(f'expected two Python transformation blocks, got {len(blocks)}')
          for block in blocks[:2]:
              exec(compile(textwrap.dedent(block), '<diagnostic-transform>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Apply canonical project state
        run: python tools/dkb.py project-state --apply
      - name: Verify static report contract
        run: |
          python - <<'PY'
          import tools.review_equipment_filter_regression_model_price_order_20260726 as m
          m.verify_report(m.load_json(m.REPORT))
          PY
      - name: Verify catalog counts and model price order
        run: |
          python - <<'PY'
          import tools.review_equipment_filter_regression_model_price_order_20260726 as m
          catalog = m.collect_browser_catalog(m.ROOT, m.ShortlistCriteria())
          configurations = catalog.get('configurations')
          facets = catalog.get('facets')
          m.ensure(isinstance(configurations, list) and len(configurations) == 72, 'current configuration count differs')
          m.ensure(isinstance(facets, dict), 'catalog facets are missing')
          equipment = facets.get('equipment')
          models = facets.get('models')
          m.ensure(isinstance(equipment, list) and len(equipment) == 110, 'current equipment facet count differs')
          m.ensure(isinstance(models, list) and len(models) == 5, 'current model facet count differs')
          m.ensure([item.get('code') for item in models] == ['sandero_iii','sandero_stepway_iii','jogger','duster_iii','bigster'], 'current model order differs')
          m.ensure([item.get('minimum_catalog_price_pln') for item in models] == [68000,71700,77900,82000,101400], 'current model minimum prices differ')
          PY
      - name: Verify Node filtering semantics
        run: |
          python - <<'PY'
          import tools.review_equipment_filter_regression_model_price_order_20260726 as m
          catalog = m.collect_browser_catalog(m.ROOT, m.ShortlistCriteria())
          contract = m.node_contract(catalog)
          initial = contract.get('initial')
          m.ensure(isinstance(initial, dict), 'initial equipment state is missing')
          available = initial.get('available_equipment')
          m.ensure(isinstance(available, list) and len(available) == 108, 'visible equipment choices differ')
          m.ensure('rear_view_camera' in available, 'rear-view camera is not selectable')
          m.ensure(contract.get('camera_match_count') == 66, 'rear-view camera result count differs')
          m.ensure(contract.get('synthetic_facets') == ['partial','unknown_state'], 'partial-coverage facet semantics differ')
          missing_reason = contract.get('missing_reason')
          m.ensure(isinstance(missing_reason, list) and 'equipment_missing:partial' in missing_reason, 'missing equipment was treated as available')
          PY
      - name: Verify rendered HTML contract
        run: |
          python - <<'PY'
          import tools.review_equipment_filter_regression_model_price_order_20260726 as m
          catalog = m.collect_browser_catalog(m.ROOT, m.ShortlistCriteria())
          rendered = m.render_html(catalog)
          m.ensure('potwierdzone jako dostępne w co najmniej jednej' in rendered, 'corrected equipment explanation is missing')
          m.ensure('Brak danych i status nieustalony nie spełniają filtra' in rendered, 'unknown handling explanation is missing')
          m.ensure(rendered.index('data-value="sandero_iii"') < rendered.index('data-value="sandero_stepway_iii"') < rendered.index('data-value="jogger"') < rendered.index('data-value="duster_iii"') < rendered.index('data-value="bigster"'), 'rendered model picker order differs')
          PY
      - name: Verify canonical state contract
        run: |
          python - <<'PY'
          import tools.review_equipment_filter_regression_model_price_order_20260726 as m
          state = m.load_json(m.STATE)
          m.ensure(state.get('phase') == 'Equipment Filter Regression and Model Price Ordering', 'project phase differs')
          m.ensure(state.get('current_package', {}).get('name') == 'Equipment Filter Regression and Model Price Ordering', 'current package differs')
          m.ensure(state.get('current_package', {}).get('status') == 'complete', 'current package is not complete')
          m.ensure(state.get('next_package', {}).get('name') == 'Data Products v1.8.1 Release Preparation', 'state next package differs')
          baseline = state.get('baseline', {})
          m.ensure(baseline.get('tests') == 1030, 'test baseline differs')
          m.ensure(baseline.get('csv_files') == 46, 'CSV baseline changed')
          m.ensure(baseline.get('rows') == 9688, 'master row baseline changed')
          m.ensure(baseline.get('configuration_values') == 2949, 'configuration values changed')
          m.ensure(baseline.get('configuration_value_ranges') == 244, 'configuration ranges changed')
          m.ensure(baseline.get('availability_records') == 4754, 'availability baseline changed')
          m.ensure(baseline.get('attributes') == 385, 'attribute baseline changed')
          PY
