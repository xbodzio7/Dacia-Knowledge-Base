name: Materialize Post-Brochure Priority

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/materialize-post-brochure-priority.yml
      - data/reporting/post_brochure_priority_selection_review.json
      - tools/review_post_brochure_priority_selection_20260726.py
      - tools/fix_post_brochure_priority_scope_name_20260726.py
      - tests/test_post_brochure_priority_selection_review.py
      - project/state.json

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/post-brochure-priority-selection-review
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Materialize and validate priority review
        shell: bash
        run: |
          set +e
          log=.github/post-brochure-priority.log
          : > "$log"
          status=0
          python tools/fix_post_brochure_priority_scope_name_20260726.py >> "$log" 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/review_post_brochure_priority_selection_20260726.py --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py validate >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tests/test_post_brochure_priority_selection_review.py -v >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' -v >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            git diff --check >> "$log" 2>&1 || status=$?
          fi
          cat "$log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'docs(report): materialize post-brochure priority'
            git push origin HEAD:agent/post-brochure-priority-selection-review
          fi
          exit "$status"
