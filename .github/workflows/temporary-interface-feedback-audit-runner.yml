name: Temporary Interface Feedback Audit Runner

on:
  push:
    branches:
      - agent/interface-source-coverage-repair-20260801

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message == 'chore: trigger interface feedback audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/interface-source-coverage-repair-20260801
          fetch-depth: 0
      - run: python tools/temporary_interface_feedback_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/tmp/interface-feedback-price-coverage.json project/tmp/spring-media-probe.json project/tmp/sandero-stepway-price-20260703.txt
          git commit -m "chore: record interface feedback audit"
          git push origin HEAD:agent/interface-source-coverage-repair-20260801
