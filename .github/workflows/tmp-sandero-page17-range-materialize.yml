name: Temporary Sandero page 17 RPM range materialization

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-sandero-page17-range-materialize.yml'
      - 'tools/tmp_materialize_sandero_page17_ranges.py'
      - 'tools/tmp_complete_sandero_range_contracts.py'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/sandero-page17-power-torque-rpm-ranges-20260731
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF text extraction backend
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Register exact TCe brochure relationships
        shell: python
        run: |
          import csv
          from pathlib import Path

          path = Path("data/master/source_configurations.csv")
          with path.open(encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle)
              fields = list(reader.fieldnames or [])
              rows = list(reader)
          source = "src_pl_sandero_brochure_20260202"
          targets = [
              "sandero_iii_essential_tce100_manual",
              "sandero_iii_expression_tce100_manual",
              "sandero_iii_journey_tce100_manual",
          ]
          existing = {(row["source_code"], row["configuration_code"]) for row in rows}
          next_id = max(int(row["id"]) for row in rows) + 1
          for code in targets:
              if (source, code) in existing:
                  continue
              item = {field: "" for field in fields}
              item.update({
                  "id": str(next_id),
                  "source_code": source,
                  "configuration_code": code,
                  "relationship": "brochure_technical_data_for",
                  "notes": "The model-level official brochure explicitly lists the represented 100 TCe powertrain and engine-speed rows on page 17.",
              })
              rows.append(item)
              next_id += 1
          with path.open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fields, lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
      - name: Align dependent reporting and historical contracts
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('.')

          def replace(path_name: str, old: str, new: str) -> None:
              path = root / path_name
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'expected contract not found: {path_name}: {old[:80]}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          def add_slots(path_name: str, slots: list[tuple[str, str]]) -> None:
              path = root / path_name
              payload = json.loads(path.read_text(encoding='utf-8'))
              existing = {(item['attribute_code'], item.get('fuel_type_code', '')) for item in payload['technical_slots']}
              for attribute, fuel in slots:
                  if (attribute, fuel) not in existing:
                      payload['technical_slots'].append({'attribute_code': attribute, 'fuel_type_code': fuel})
              payload['technical_slots'].sort(key=lambda item: (item['attribute_code'], item.get('fuel_type_code', '')))
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manual_slots = [
              ('max_power_rpm', 'lpg'),
              ('max_power_rpm', 'petrol'),
              ('max_torque_rpm', 'lpg'),
              ('max_torque_rpm', 'petrol'),
          ]
          automatic_slots = [
              ('max_power_rpm', 'lpg'),
              ('max_power_rpm', 'petrol'),
              ('max_torque_rpm', 'lpg'),
          ]
          add_slots('data/reporting/configuration_completeness.json', manual_slots)
          add_slots('data/reporting/sandero_ecog120_manual_completeness.json', manual_slots)
          add_slots('data/reporting/sandero_stepway_ecog120_automatic_completeness.json', automatic_slots)

          # The authored prioritization file is a preserved review snapshot. Current
          # queue tests rebuild from reconciliation dynamically, so do not rewrite it
          # inside this data package.
          replace(
              'tools/tmp_materialize_sandero_page17_ranges.py',
              'subprocess.run(["python", "tools/dkb.py", "pdf-candidate-residual-gap-prioritization"], cwd=ROOT, check=True)\n',
              '',
          )

          replace(
              'tests/test_official_brochure_technical_gap_resolution_closure.py',
              'self.assertEqual(len(self.ranges), 102)',
              'self.assertEqual(len(self.ranges), 122)',
          )

          replace(
              'tools/review_brochure_chassis_modeling_closure_20260726.py',
              'ensure(by_source == value_targets, "brochure source relationships differ from imported chassis targets")',
              'ensure(all(value_targets[source] <= by_source[source] for source in SOURCE_CONTRACTS), "brochure source relationships omit imported chassis targets")',
          )
          replace(
              'tests/test_brochure_chassis_modeling_closure_review.py',
              'self.assertEqual(actual, expected, source)',
              'self.assertTrue(expected <= actual, source)',
          )

          dimensions_tool = root / 'tools/review_brochure_generic_dimensions_semantic_mapping_20260726.py'
          text = dimensions_tool.read_text(encoding='utf-8')
          marker = '''EXPECTED_RELATIONSHIPS = {\n    "src_pl_sandero_brochure_20260202": 4,\n    "src_pl_jogger_brochure_20251217": 22,\n    "src_pl_duster_mini_brochure_20251020": 10,\n}\n'''
          addition = marker + '''SANDERO_DIMENSION_TARGETS = {\n    "sandero_iii_expression_ecog120_manual",\n    "sandero_iii_journey_ecog120_manual",\n    "sandero_iii_expression_ecog120_automatic",\n    "sandero_iii_journey_ecog120_automatic",\n}\n'''
          if marker not in text:
              raise RuntimeError('dimension relationship marker not found')
          text = text.replace(marker, addition)
          old_function = '''def source_relationship_targets() -> dict[str, set[str]]:\n    return {\n        source: {\n            row.get("configuration_code", "")\n            for row in rows(MASTER / "source_configurations.csv")\n            if row.get("source_code") == source and row.get("relationship") == "brochure_technical_data_for"\n        }\n        for source in SOURCE_CODES\n    }\n'''
          new_function = '''def source_relationship_targets() -> dict[str, set[str]]:\n    relationships = rows(MASTER / "source_configurations.csv")\n    result = {\n        source: {\n            row.get("configuration_code", "")\n            for row in relationships\n            if row.get("source_code") == source and row.get("relationship") == "brochure_technical_data_for"\n        }\n        for source in SOURCE_CODES\n    }\n    ensure(SANDERO_DIMENSION_TARGETS <= result["src_pl_sandero_brochure_20260202"], "historical Sandero dimension targets are no longer source-linked")\n    result["src_pl_sandero_brochure_20260202"] = set(SANDERO_DIMENSION_TARGETS)\n    return result\n'''
          if old_function not in text:
              raise RuntimeError('dimension target function not found')
          dimensions_tool.write_text(text.replace(old_function, new_function), encoding='utf-8')

          test_path = root / 'tests/test_brochure_generic_dimensions_semantic_mapping_review.py'
          text = test_path.read_text(encoding='utf-8')
          old_counts = '''        counts = Counter(\n            row["source_code"]\n            for row in self.relationships\n            if row["relationship"] == "brochure_technical_data_for"\n            and row["source_code"] in self.sources\n        )\n'''
          new_counts = '''        sandero_dimension_targets = {\n            "sandero_iii_expression_ecog120_manual",\n            "sandero_iii_journey_ecog120_manual",\n            "sandero_iii_expression_ecog120_automatic",\n            "sandero_iii_journey_ecog120_automatic",\n        }\n        counts = Counter(\n            row["source_code"]\n            for row in self.relationships\n            if row["relationship"] == "brochure_technical_data_for"\n            and row["source_code"] in self.sources\n            and (row["source_code"] != "src_pl_sandero_brochure_20260202" or row["configuration_code"] in sandero_dimension_targets)\n        )\n'''
          if old_counts not in text:
              raise RuntimeError('dimension test count block not found')
          test_path.write_text(text.replace(old_counts, new_counts), encoding='utf-8')
      - name: Complete reporting and evidence contracts
        run: python tools/tmp_complete_sandero_range_contracts.py
      - name: Finalize exact report assertions
        shell: python
        run: |
          from pathlib import Path

          def replace(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'expected final assertion not found: {path_name}: {old}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'tests/test_sandero_ecog120_manual_reporting_scope.py',
              'self.assertEqual(len(ranged), 40)',
              'self.assertEqual(len(ranged), 28)',
          )
          replace(
              'tests/test_sandero_stepway_ecog120_automatic_reporting_scope.py',
              '''                "covered": 60,\n                "denominator": 70,\n                "missing": 2,\n                "not_applicable": 0,\n                "partial": 8,\n                "source_missing": 0,''',
              '''                "covered": 58,\n                "denominator": 70,\n                "missing": 2,\n                "not_applicable": 0,\n                "partial": 10,\n                "source_missing": 0,''',
          )
      - name: Materialize and validate ranges
        run: python tools/tmp_materialize_sandero_page17_ranges.py
      - name: Commit final package and remove temporary tools
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-sandero-page17-range-diagnostic.yml
          rm -f .github/workflows/tmp-sandero-page17-range-materialize.yml
          rm -f tools/tmp_materialize_sandero_page17_ranges.py
          rm -f tools/tmp_complete_sandero_range_contracts.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data(sandero): add page 17 power and torque RPM ranges'
          git push origin HEAD:agent/sandero-page17-power-torque-rpm-ranges-20260731
