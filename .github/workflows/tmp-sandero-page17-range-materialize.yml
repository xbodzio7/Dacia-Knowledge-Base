name: Temporary Sandero page 17 RPM range materialization

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-sandero-page17-range-materialize.yml'
      - 'tools/tmp_materialize_sandero_page17_ranges.py'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/sandero-page17-power-torque-rpm-ranges-20260731
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF text extraction backend
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Materialize and validate ranges
        run: python tools/tmp_materialize_sandero_page17_ranges.py
      - name: Commit final package and remove temporary tools
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-sandero-page17-range-diagnostic.yml
          rm -f .github/workflows/tmp-sandero-page17-range-materialize.yml
          rm -f tools/tmp_materialize_sandero_page17_ranges.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data(sandero): add page 17 power and torque RPM ranges'
          git push origin HEAD:agent/sandero-page17-power-torque-rpm-ranges-20260731
