name: Temporary Spring Review Applicator Trigger

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/spring-nonconflicting-technical-observations-review-001'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Apply verified package payload
        shell: bash
        run: |
          set -euo pipefail
          awk '/^H4sI/{capture=1} capture {if ($0 == "PAYLOAD") exit; print}' .github/workflows/temporary-spring-repository-snapshot.yml > /tmp/spring-review.patch.gz.b64
          base64 -d /tmp/spring-review.patch.gz.b64 | gzip -d > /tmp/spring-review.patch
          git apply --index /tmp/spring-review.patch
          rm -f .github/workflows/temporary-spring-repository-snapshot.yml
          rm -f .github/workflows/temporary-spring-applicator-trigger.yml
          rm -f .github/spring-review-trigger.txt
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Review Spring non-conflicting technical observations [spring-review-applied]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
