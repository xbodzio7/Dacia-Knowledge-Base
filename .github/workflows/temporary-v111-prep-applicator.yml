name: Temporary v1.11 Preparation Applicator

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/data-products-v1-11-0-accelerated-release-preparation-001'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Apply verified package payload
        shell: bash
        run: |
          set -euo pipefail
          echo '4edd63f52a69bc851b16f787d2a7dbaf80301ff9f7a2684f6034431e45d1b135  project/v111-prep.chunk.00' | sha256sum --check
          echo '6efae2368ad7e9d2c6c963d96bd65a5baf94f8daa18bec073413ff094a0259fa  project/v111-prep.chunk.01' | sha256sum --check
          echo '9ae87cb75771ca175519019491a2f7503c33c35c779021eecd0b5a0a2ac248c9  project/v111-prep.chunk.02' | sha256sum --check
          echo '8590c01dfd80040ec71ffad949993998c61241f1430ff9dea1adeb18e9edce6b  project/v111-prep.chunk.03' | sha256sum --check
          cat project/v111-prep.chunk.* > /tmp/v111-prep.patch.gz.b64
          echo 'b83939e08b61f3bc14652d8352f253fda45415cca421acb47b15848f76bf6307  /tmp/v111-prep.patch.gz.b64' | sha256sum --check
          base64 -d /tmp/v111-prep.patch.gz.b64 | gzip -d > /tmp/v111-prep.patch
          echo 'acbd9c24a44fe95daf50d6bbe57a218010d1c2d7e08abe16ecc0d375ac5418b4  /tmp/v111-prep.patch' | sha256sum --check
          git apply --index /tmp/v111-prep.patch
          rm -f project/v111-prep.chunk.*
          rm -f .github/workflows/temporary-v111-prep-applicator.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare Data Products v1.11.0 accelerated release [v111-prep-applied]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
