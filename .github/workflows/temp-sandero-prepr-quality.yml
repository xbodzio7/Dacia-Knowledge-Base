name: Temporary Sandero Pre-PR Quality

on:
  push:
    branches:
      - data/sandero-residual-source-closure-006
    paths:
      - .github/workflows/temp-sandero-prepr-quality.yml

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/sandero-residual-source-closure-006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Run full quality gate
        shell: bash
        run: |
          set +e
          export PYTHONPATH="$PWD:$PWD/tools"
          mkdir -p project/tmp/sandero-prepr-quality
          python tools/dkb.py quality \
            --concise \
            --database "$RUNNER_TEMP/dacia_knowledge_base.sqlite" \
            --log-file project/tmp/sandero-prepr-quality/quality.log \
            --summary-json project/tmp/sandero-prepr-quality/quality-summary.json \
            > project/tmp/sandero-prepr-quality/console.log 2>&1
          status=$?
          echo "$status" > project/tmp/sandero-prepr-quality/status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/tmp/sandero-prepr-quality
          git commit -m "test: record Sandero pre-PR quality" || true
          git push origin HEAD:data/sandero-residual-source-closure-006
          exit "$status"
