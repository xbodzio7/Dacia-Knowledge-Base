name: Temporary Sandero Contract Repair v2

on:
  push:
    branches:
      - data/sandero-residual-source-closure-006
    paths:
      - .github/workflows/temp-sandero-prepr-quality.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/sandero-residual-source-closure-006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Correct aligner implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/align_sandero_residual_source_closure_contracts_20260801.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def replace_test_selection_block")
          end = text.index("def replace_importer_selection_block")
          replacement = '''def replace_test_selection_block(path: str, end_method: str) -> None:
              content = read(path)
              lines = content.splitlines(keepends=True)
              try:
                  start = next(
                      index
                      for index, line in enumerate(lines)
                      if "selected = " in line and '["selected_next_package"]' in line
                  )
                  end = next(
                      index
                      for index in range(start + 1, len(lines))
                      if lines[index].startswith(f"    def {end_method}")
                  )
              except StopIteration:
                  if 'self.assertIsNone(selected)' in content and '["eligible_candidate_count"], 0' in content:
                      return
                  raise AlignmentError(f"selection test block not found: {path}")
              selected_expression = lines[start].strip().split(" = ", 1)[1]
              payload_expression = selected_expression.rsplit("[", 1)[0]
              replacement = [
                  f"        selected = {selected_expression}\\n",
                  '        self.assertIsNone(selected)\\n',
                  f'        self.assertEqual({payload_expression}["summary"]["eligible_candidate_count"], 0)\\n',
                  "\\n",
              ]
              lines[start:end] = replacement
              write(path, "".join(lines))


'''
          text = text[:start] + replacement + text[end:]
          old = '''    for path in (
              "tests/test_sandero_stepway_essential_source_gap_20260626.py",
              "tests/test_sandero_stepway_expression_source_gap_20260626.py",
          ):
              replace_number(path, 101, 97)
              replace_number(path, 6, 7)
'''
          new = '''    for path in (
              "tests/test_sandero_stepway_essential_source_gap_20260626.py",
              "tests/test_sandero_stepway_expression_source_gap_20260626.py",
          ):
              replace_exact(
                  path,
                  '        self.assertEqual(payload["summary"]["missing_technical_count"], 101)',
                  '        self.assertEqual(payload["summary"]["missing_technical_count"], 97)',
              )
              replace_exact(
                  path,
                  '        self.assertEqual(payload["summary"]["exhausted_source_candidate_count"], 6)',
                  '        self.assertEqual(payload["summary"]["exhausted_source_candidate_count"], 7)',
              )
          replace_exact(
              "tests/test_sandero_stepway_expression_source_gap_20260626.py",
              '        self.assertEqual(review["reconciliation"]["resolved_unique_slots"], 7)',
              '        self.assertEqual(review["reconciliation"]["resolved_unique_slots"], 6)',
          )
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("historical-source test replacement block not found")
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Align contracts and run quality
        shell: bash
        run: |
          set +e
          export PYTHONPATH="$PWD:$PWD/tools"
          mkdir -p project/tmp/sandero-contract-repair
          status=0
          python -m tools.align_sandero_residual_source_closure_contracts_20260801 \
            > project/tmp/sandero-contract-repair/align.log 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply \
              > project/tmp/sandero-contract-repair/project-state-apply.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m tools.align_sandero_residual_source_closure_contracts_20260801 --check \
              > project/tmp/sandero-contract-repair/align-check.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m tools.import_sandero_residual_source_closure_20260801 --check \
              > project/tmp/sandero-contract-repair/package-check.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest -q \
              tests.test_duster_ecog120_reporting_scope \
              tests.test_existing_configuration_missing_data_analysis \
              tests.test_sandero_50_kmh_noise_level_model \
              tests.test_sandero_50_kmh_noise_level_values \
              tests.test_sandero_ecog120_manual_reporting_scope \
              tests.test_sandero_equipment_availability \
              tests.test_sandero_euro_6e_bis_model \
              tests.test_sandero_euro_6e_bis_values \
              tests.test_sandero_exterior_colour_values \
              tests.test_sandero_front_wheel_drive_values \
              tests.test_sandero_maximum_payload_model \
              tests.test_sandero_number_of_doors_values \
              tests.test_sandero_passive_safety_availability \
              tests.test_sandero_residual_source_closure_20260801 \
              tests.test_sandero_standard_tyre_specification \
              tests.test_sandero_stepway_essential_source_gap_20260626 \
              tests.test_sandero_stepway_expression_auto_source_gap_20260626 \
              tests.test_sandero_stepway_expression_source_gap_20260626 \
              tests.test_sandero_stepway_extreme_auto_source_gap_20260626 \
              tests.test_sandero_stepway_extreme_source_gap_20260626 \
              tests.test_sandero_total_valve_count_model \
              tests.test_spring_technical_20260219 \
              > project/tmp/sandero-contract-repair/focused-tests.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py quality \
              --concise \
              --database "$RUNNER_TEMP/dacia_knowledge_base.sqlite" \
              --log-file project/tmp/sandero-contract-repair/quality.log \
              --summary-json project/tmp/sandero-contract-repair/quality-summary.json \
              > project/tmp/sandero-contract-repair/quality-console.log 2>&1 || status=$?
          fi
          echo "$status" > project/tmp/sandero-contract-repair/status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align Sandero residual closure contracts" || true
          git push origin HEAD:data/sandero-residual-source-closure-006
          exit "$status"
