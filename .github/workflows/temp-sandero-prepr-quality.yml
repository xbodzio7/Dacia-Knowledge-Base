name: Temporary Sandero Failure Index

on:
  push:
    branches:
      - data/sandero-residual-source-closure-006
    paths:
      - .github/workflows/temp-sandero-prepr-quality.yml

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/sandero-residual-source-closure-006
          fetch-depth: 0
      - name: Index current quality failures
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^(FAIL|ERROR):' project/tmp/sandero-prepr-quality/console.log \
            > project/tmp/sandero-prepr-quality/failure-index.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/tmp/sandero-prepr-quality/failure-index.txt
          git commit -m "test: index Sandero quality failures"
          git push origin HEAD:data/sandero-residual-source-closure-006
