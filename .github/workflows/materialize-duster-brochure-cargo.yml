name: Materialize Duster Brochure Cargo

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/materialize-duster-brochure-cargo.yml
      - data/imports/configuration_cargo_values/duster-brochure-cargo-20251020.json
      - tools/import_duster_brochure_cargo_20260726.py
      - tools/patch_duster_cargo_reporting_20260726.py
      - tests/test_duster_brochure_cargo_20260726.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/duster-brochure-cargo-import
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Materialize package and persist diagnostics
        run: |
          set +e
          : > .github/duster-cargo-diagnostic.log
          status=0
          python tools/patch_duster_cargo_reporting_20260726.py >> .github/duster-cargo-diagnostic.log 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            python tools/import_duster_brochure_cargo_20260726.py --apply >> .github/duster-cargo-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> .github/duster-cargo-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/import_duster_brochure_cargo_20260726.py --check >> .github/duster-cargo-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> .github/duster-cargo-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tests/test_duster_brochure_cargo_20260726.py -v >> .github/duster-cargo-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' -v >> .github/duster-cargo-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            git diff --check >> .github/duster-cargo-diagnostic.log 2>&1 || status=$?
          fi
          cat .github/duster-cargo-diagnostic.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(data): persist Duster cargo materialization'
            git push origin HEAD:agent/duster-brochure-cargo-import
          fi
          exit "$status"
