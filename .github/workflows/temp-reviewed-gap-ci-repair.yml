name: Temporary Reviewed Gap CI Repair

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/temp-reviewed-gap-ci-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/reviewed-gap-state-materialization-20260802'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Apply all reviewed-gap contract repairs
        shell: bash
        run: |
          python tools/temp_fix_reviewed_gap_ci.py
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_spring_commercial_packages.py')
          text = path.read_text(encoding='utf-8')
          needle = 'Counter(row["configuration_code"] for row in unknown)'
          position = text.find(needle)
          start = text.rfind('        self.assertEqual(', 0, position)
          end_marker = '        self.assertTrue(all(row["price_date"] == "" for row in unknown))'
          end = text.find(end_marker, position)
          if position < 0 or start < 0 or end < 0:
              raise SystemExit('Spring unknown-count test block not found')
          replacement = '''        self.assertEqual(
              {
                  code: sum(row["amount"] is None for row in rows)
                  for code, rows in package_components.items()
              },
              {
                  "spring_essential_electric70_automatic": 1,
                  "spring_expression_electric70_automatic": 3,
                  "spring_extreme_electric100_automatic": 1,
              },
          )
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python tools/dkb.py documentation-baseline --apply
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          import project_state
          root = Path('.').resolve()
          state = project_state.read_state(root / 'project/state.json')
          project_state.validate_state(state)
          project_state.write_atomic(
              root / 'project/STATE_SUMMARY.md',
              project_state.render_summary(state),
          )
          PY

      - name: Run focused regression contracts
        shell: bash
        run: |
          python -m py_compile \
            tools/configuration_shortlist.py \
            tools/import_spring_commercial_packages.py \
            tools/apply_reviewed_gap_state_materialization_20260802.py
          python -m unittest -q \
            tests.test_reviewed_gap_state_materialization_20260802 \
            tests.test_spring_commercial_packages \
            tests.test_commercial_items_20260703 \
            tests.test_registered_source_completeness_reconciliation_20260802 \
            tests.test_sandero_residual_source_closure_20260801 \
            tests.test_configuration_shortlist_html \
            tests.test_configuration_comparison_workbook

      - name: Commit clean package and remove temporary helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch \
            .github/workflows/temp-reviewed-gap-ci-repair.yml \
            .github/workflows/temp-fix-reviewed-gap-optional-report.yml \
            tools/temp_fix_reviewed_gap_ci.py
          git add \
            CHANGELOG.md \
            README.md \
            project/ROADMAP.md \
            project/SESSION_STATE.md \
            project/STATE_SUMMARY.md \
            project/state.json \
            tests/test_commercial_items_20260703.py \
            tests/test_registered_source_completeness_reconciliation_20260802.py \
            tests/test_sandero_residual_source_closure_20260801.py \
            tests/test_spring_commercial_packages.py \
            tools/configuration_shortlist.py \
            tools/import_spring_commercial_packages.py
          git diff --cached --check
          git commit -m 'fix: align reviewed gap regression contracts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
