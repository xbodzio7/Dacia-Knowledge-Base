name: Temporary Spring Electric 100 Singleton Replay

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  replay:
    if: github.head_ref == 'agent/spring-electric100-singleton-foundation-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-electric100-singleton-foundation-20260731
          fetch-depth: 0

      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Materialize non-workflow package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          import yaml

          original = Path('.github/workflows/tmp-spring-electric100-singleton-foundation.yml')
          replay = Path('.github/workflows/tmp-spring-electric100-singleton-replay.yml')
          workflow = yaml.safe_load(original.read_text(encoding='utf-8'))
          script = workflow['jobs']['materialize']['steps'][1]['run']

          prefix = "python - <<'PY'\n"
          suffix = "\nPY\n\npython tools/dkb.py project-state --apply"
          assert prefix in script and suffix in script
          python_source = script.split(prefix, 1)[1].split(suffix, 1)[0]
          exec(compile(python_source, '<spring-electric100-materializer>', 'exec'), {})

          workflow_paths = [
              '.github/workflows/configuration-comparison-bundle.yml',
              '.github/workflows/configuration-selection-export.yml',
          ]
          subprocess.run(['git', 'checkout', 'HEAD', '--', *workflow_paths], check=True)

          subprocess.run(
              [sys.executable, 'tools/dkb.py', 'project-state', '--apply'],
              check=True,
          )
          subprocess.run(
              [sys.executable, 'tools/dkb.py', 'project-state', '--check'],
              check=True,
          )
          subprocess.run(['git', 'diff', '--check'], check=True)

          original.unlink()
          replay.unlink()
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(
              [
                  'git',
                  'config',
                  'user.email',
                  '41898282+github-actions[bot]@users.noreply.github.com',
              ],
              check=True,
          )
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(
              ['git', 'commit', '-m', 'data(spring): add Electric 100 singleton foundation'],
              check=True,
          )
          subprocess.run(
              [
                  'git',
                  'push',
                  'origin',
                  'HEAD:agent/spring-electric100-singleton-foundation-20260731',
              ],
              check=True,
          )
          PY
