name: Materialize Data Products v1.8.1 Release Preparation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/materialize-data-products-v1-8-1-release-preparation.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out preparation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/data-products-v1-8-1-release-preparation
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install PDF backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Materialize release notes and project state
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          release = Path("tools/reporting/data_product_release.py")
          text = release.read_text(encoding="utf-8")
          start = text.index("def _release_notes(\n")
          end = text.index("\n\ndef _archive_record", start)
          replacement = '''def _release_notes(
              version: str,
              commit_sha: str,
              shortlist: Mapping[str, Any],
              bundle: Mapping[str, Any],
          ) -> str:
              summary = shortlist["summary"]
              assert isinstance(summary, dict)
              lines = [
                  f"# Dacia Knowledge Base Data Products v{version}",
                  "",
                  f"- Release tag: `{release_tag(version)}`",
                  f"- Repository commit: `{commit_sha}`",
                  f"- Snapshot date: `{shortlist['as_of']}`",
                  "- Selected configurations: "
                  f"{bundle['selected_configuration_count']}",
                  f"- Independent scopes: {bundle['scope_group_count']}",
                  f"- Comparable scopes: {bundle['comparable_scope_count']}",
                  f"- Singleton scopes: {bundle['singleton_scope_count']}",
                  "- Cross-scope pairs: none",
                  "- Formats: " + ", ".join(PRODUCT_FORMATS),
                  "",
                  "The archive contains the complete active-configuration shortlist, "
                  "one full-portfolio comparison bundle and a scope-preserving "
                  "cross-model navigation view. Existing source dates, evidence "
                  "states and independent reporting scopes are preserved.",
                  "",
              ]
              if version == "1.8.1":
                  lines.extend(
                      [
                          "Equipment filtering is restored for partially covered source data: "
                          "108 equipment choices remain visible in the current 72-configuration "
                          "catalog, and selecting the rear-view camera narrows the result to 66.",
                          "",
                          "Missing and unknown evidence remains excluded rather than inferred as "
                          "availability. Model choices are ordered by the minimum current "
                          "catalogue price, from Sandero through Bigster.",
                          "",
                          "The public v1.8.0 remains immutable; this correction is delivered only "
                          "as the new data-products-v1.8.1 patch release.",
                          "",
                      ]
                  )
              lines.extend(
                  [
                      "No ranking, recommendations or inferred values are generated.",
                      "",
                  ]
              )
              return "\\n".join(lines)
          '''
          release.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          historical_verifier = Path(
              "tools/review_equipment_filter_regression_model_price_order_20260726.py"
          )
          text = historical_verifier.read_text(encoding="utf-8")
          start = text.index("    state = load_json(STATE)\n")
          end = text.index("\n\ndef verify() -> None:\n", start)
          replacement = '''    state = load_json(STATE)
              ensure(isinstance(state.get("phase"), str) and bool(state["phase"]), "project phase is missing")
              current = state.get("current_package")
              ensure(isinstance(current, Mapping), "current package is missing")
              ensure(isinstance(current.get("name"), str) and bool(current["name"]), "current package name is missing")
              ensure(current.get("status") in {"planned", "active", "blocked", "complete"}, "current package status differs")
              next_package = state.get("next_package")
              ensure(isinstance(next_package, Mapping), "next package is missing")
              ensure(isinstance(next_package.get("name"), str) and bool(next_package["name"]), "next package name is missing")
              baseline = state.get("baseline", {})
              ensure(baseline.get("tests", 0) >= 1030, "test baseline regressed")
              ensure(baseline.get("csv_files", 0) >= 46, "CSV baseline regressed")
              ensure(baseline.get("rows", 0) >= 9688, "master row baseline regressed")
              ensure(baseline.get("configuration_values", 0) >= 2949, "configuration values regressed")
              ensure(baseline.get("configuration_value_ranges", 0) >= 244, "configuration ranges regressed")
              ensure(baseline.get("availability_records", 0) >= 4754, "availability baseline regressed")
              ensure(baseline.get("attributes", 0) >= 385, "attribute baseline regressed")
          '''
          historical_verifier.write_text(
              text[:start] + replacement + text[end:],
              encoding="utf-8",
          )

          historical_tests = Path(
              "tests/test_equipment_filter_regression_model_price_order.py"
          )
          text = historical_tests.read_text(encoding="utf-8")
          marker = "    def test_verifier_and_project_state_accept_fix(self) -> None:\n"
          start = text.index(marker)
          end = text.index("\n\nif __name__ == \"__main__\":", start)
          replacement = '''    def test_verifier_and_project_state_preserve_fix_history(self) -> None:
              completed = subprocess.run(
                  [sys.executable, str(VERIFIER), "--check"],
                  cwd=ROOT,
                  text=True,
                  capture_output=True,
                  check=False,
              )
              self.assertEqual(
                  completed.returncode,
                  0,
                  completed.stderr or completed.stdout,
              )
              self.assertIn(
                  "PASS: equipment filter regression and model price ordering",
                  completed.stdout,
              )
              state = json.loads(STATE.read_text(encoding="utf-8"))
              self.assertTrue(state["phase"])
              self.assertTrue(state["current_package"]["name"])
              self.assertIn(
                  state["current_package"]["status"],
                  {"planned", "active", "blocked", "complete"},
              )
              self.assertTrue(state["next_package"]["name"])
              self.assertGreaterEqual(state["baseline"]["tests"], 1030)
          '''
          historical_tests.write_text(
              text[:start] + replacement + text[end:],
              encoding="utf-8",
          )

          state_path = Path("project/state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          state["updated_on"] = "2026-07-27"
          state["phase"] = "Data Products v1.8.1 Release Preparation"
          state["reference_delivery"] = {
              "name": "Equipment Filter Regression and Model Price Ordering",
              "pull_request": 289,
              "head_sha": "c425b3997c11132e7c325b843e9e13f44a5a9105",
              "quality_run": 2040,
          }
          state["baseline"]["tests"] = 1038
          state["current_package"] = {
              "name": "Data Products v1.8.1 Release Preparation",
              "status": "complete",
              "goal": "Prepare and verify an immutable patch-release candidate containing the restored equipment filtering and cheapest-to-most-expensive model ordering without changing source-backed data or rewriting older public releases.",
          }
          state["next_package"] = {
              "name": "Data Products v1.8.1 Preflight",
              "status": "planned",
              "goal": "Build the v1.8.1 assets twice from the exact squash-merged preparation commit, prove byte identity, verify the real Chromium equipment-filter behavior and all release contracts, and record final identities without publishing.",
          }
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
          python tools/dkb.py project-state --apply
      - name: Compile v1.8.1 verifier
        run: python -m py_compile tools/review_data_products_v1_8_1_release_preparation_20260727.py
      - name: Check shortlist browser JavaScript
        run: node --check tools/reporting/configuration_shortlist_browser.js
      - name: Run v1.8.1 preparation verifier
        run: python tools/review_data_products_v1_8_1_release_preparation_20260727.py --check
      - name: Run v1.8.1 preparation tests
        run: python -m unittest tests.test_data_products_v1_8_1_release_preparation
      - name: Run regression package tests
        run: python -m unittest tests.test_equipment_filter_regression_model_price_order
      - name: Preserve v1.8.0 preparation history
        run: python -m unittest tests.test_data_products_v1_8_0_release_preparation
      - name: Preserve v1.8.0 publication history
        run: python -m unittest tests.test_data_products_v1_8_0_publication
      - name: Run full repository validation
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/dkb.py validate
          python tools/dkb.py project-state --check
      - name: Commit materialized preparation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md project/ROADMAP.md project/SESSION_STATE.md \
            project/STATE_SUMMARY.md project/state.json \
            tools/reporting/data_product_release.py \
            tools/review_equipment_filter_regression_model_price_order_20260726.py \
            tests/test_equipment_filter_regression_model_price_order.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat(data-products): prepare v1.8.1 release candidate'
            git push origin HEAD:agent/data-products-v1-8-1-release-preparation
          fi
