name: Inventory Official Brochure Technical Gaps

on:
  push:
    branches:
      - agent/official-brochure-technical-gap-review
    paths:
      - .github/workflows/inventory-official-brochure-technical-gaps.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/official-brochure-technical-gap-review
          fetch-depth: 0
      - name: Install PDF extraction backend
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Inventory technical pages and current evidence
        shell: bash
        run: |
          set -euo pipefail
          output=.github/official-brochure-technical-gap-inventory.txt
          : > "$output"

          scan_pdf() {
            local label="$1"
            local pdf="$2"
            local pages="$3"
            printf '\n########################################################################\n' >> "$output"
            printf '### %s\n' "$label" >> "$output"
            printf '### %s\n' "$pdf" >> "$output"
            printf '########################################################################\n' >> "$output"
            local page
            for page in $(seq 1 "$pages"); do
              text=$(pdftotext -f "$page" -l "$page" -layout "$pdf" - 2>/dev/null || true)
              if printf '%s' "$text" | grep -Eqi 'DANE TECHNICZNE|SILNIKI|OSIĄGI|MASY I POJEMNOŚCI|WYMIARY|ZUŻYCIE PALIWA|UKŁAD KIEROWNICZY|ZAWIESZENIE'; then
                printf '\n===== PDF PAGE %s =====\n' "$page" >> "$output"
                printf '%s\n' "$text" >> "$output"
              fi
            done
          }

          scan_pdf "BIGSTER" "PDF/Broszury/DACIA BIGSTER broszura 20251210.pdf" 24
          scan_pdf "JOGGER" "PDF/Broszury/DACIA JOGGER broszura 20251217.pdf" 23
          scan_pdf "SANDERO" "PDF/Broszury/DACIA SANDERO broszura 20260202.pdf" 21
          scan_pdf "SANDERO STEPWAY" "PDF/Broszury/DACIA SANDERO STEPWAY broszura 20260202.pdf" 21
          scan_pdf "DUSTER" "PDF/Broszury/DACIA DUSTER mini broszura 20251020.pdf" 25

          python - <<'PY' >> "$output"
          from __future__ import annotations

          import csv
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path('.')
          master = root / 'data' / 'master'
          brochure_sources = {
              'src_pl_bigster_brochure_20251210',
              'src_pl_jogger_brochure_20251217',
              'src_pl_sandero_brochure_20260202',
              'src_pl_sandero_stepway_brochure_20260202',
              'src_pl_duster_mini_brochure_20251020',
          }

          def rows(name: str):
              with (master / name).open(encoding='utf-8-sig', newline='') as handle:
                  return list(csv.DictReader(handle))

          values = rows('configuration_attribute_values.csv')
          ranges = rows('configuration_attribute_value_ranges.csv')
          relations = rows('source_configurations.csv')
          attributes = {row['code']: row for row in rows('attributes.csv')}
          configurations = {row['code']: row for row in rows('configurations.csv')}

          brochure_values = [row for row in values if row.get('source_code') in brochure_sources]
          brochure_ranges = [row for row in ranges if row.get('source_code') in brochure_sources]
          brochure_relations = [row for row in relations if row.get('source_code') in brochure_sources]

          print('\n########################################################################')
          print('### CURRENT BROCHURE MASTER-DATA COVERAGE')
          print('########################################################################')
          print('scalar values:', len(brochure_values))
          print('ranges:', len(brochure_ranges))
          print('source-configuration relationships:', len(brochure_relations))
          print('attributes:', json.dumps(Counter(row['attribute_code'] for row in brochure_values), ensure_ascii=False, sort_keys=True))
          print('sources:', json.dumps(Counter(row['source_code'] for row in brochure_values), ensure_ascii=False, sort_keys=True))
          print('gears:', json.dumps(Counter(row.get('gear_number', '') for row in brochure_values), ensure_ascii=False, sort_keys=True))

          print('\n### ATTRIBUTE REGISTRY — TECHNICAL CANDIDATES')
          technical_categories = {'Engine', 'Performance', 'Fuel and emissions', 'Mass and towing', 'Dimensions and capacity', 'Drivetrain', 'Chassis'}
          for code, row in sorted(attributes.items()):
              if row.get('category') in technical_categories:
                  print(json.dumps(row, ensure_ascii=False, sort_keys=True))

          print('\n### EXISTING NON-BROCHURE TECHNICAL COVERAGE BY MODEL/ATTRIBUTE')
          grouped = defaultdict(set)
          for row in values:
              if row.get('source_code') in brochure_sources:
                  continue
              cfg = configurations.get(row.get('configuration_code', ''), {})
              version = cfg.get('version_code', '')
              model = (
                  'sandero_stepway' if version.startswith('sandero_stepway') else
                  'sandero' if version.startswith('sandero_') else
                  'jogger' if version.startswith('jogger_') else
                  'bigster' if version.startswith('bigster_') else
                  'duster' if version.startswith('duster_') else
                  ''
              )
              if model:
                  grouped[(model, row.get('attribute_code', ''))].add(row.get('configuration_code', ''))
          for (model, attribute), configs in sorted(grouped.items()):
              print(f'{model}|{attribute}|configurations={len(configs)}')

          print('\n### ACTIVE CONFIGURATIONS BY MODEL/POWERTRAIN/TRANSMISSION/SEATS')
          for code, row in sorted(configurations.items()):
              if row.get('status') != 'active':
                  continue
              if not any(code.startswith(prefix) for prefix in ('bigster_', 'jogger_', 'sandero_', 'duster_')):
                  continue
              seat_rows = [
                  item for item in values
                  if item.get('configuration_code') == code and item.get('attribute_code') == 'number_of_seats'
              ]
              seats = seat_rows[-1].get('value', '') if seat_rows else ''
              print(json.dumps({
                  'code': code,
                  'version_code': row.get('version_code', ''),
                  'powertrain_label': row.get('powertrain_label', ''),
                  'transmission_type': row.get('transmission_type', ''),
                  'number_of_seats': seats,
              }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Persist inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/official-brochure-technical-gap-inventory.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore(data): persist official brochure technical gap inventory'
            git push origin HEAD:agent/official-brochure-technical-gap-review
          fi
