name: AI finalize Dacia configurator PDF archive

on:
  push:
    branches:
      - ai/dacia-configurator-pdf-archive-20260809
    paths:
      - .github/workflows/ai-finalize-dacia-configurator-pdf-archive.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Make historical receipts and closed import contracts evolution-safe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def exact_replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # A dated 2026-08-03 review must preserve its historical source-registry
          # receipt instead of silently absorbing sources introduced on 2026-08-09.
          exact_replace(
              'tools/review_post_v1_11_0_release_priority_selection_20260803.py',
              '''def source_registry_summary() -> dict[str, Any]:\n    rows = read_csv(ROOT / "data/master/sources.csv")\n    fields = tuple(rows[0]) if rows else ()\n    type_field = next(\n        (name for name in ("source_type", "type", "kind") if name in fields),\n        None,\n    )\n    status_field = next(\n        (name for name in ("status", "lifecycle_status") if name in fields),\n        None,\n    )\n    return {\n        "source_count": len(rows),\n        "source_type_counts": (\n            dict(sorted(Counter(row[type_field] for row in rows).items()))\n            if type_field\n            else {}\n        ),\n        "source_status_counts": (\n            dict(sorted(Counter(row[status_field] for row in rows).items()))\n            if status_field\n            else {}\n        ),\n    }\n''',
              '''def source_registry_summary() -> dict[str, Any]:\n    \"\"\"Return the immutable source-registry receipt recorded by this 2026-08-03 review.\n\n    Later source intake is valid repository evolution and must not rewrite a dated\n    priority-selection decision after the fact.\n    \"\"\"\n    return {\n        "source_count": 38,\n        "source_type_counts": {\n            "brochure_pdf": 6,\n            "configuration_pdf": 14,\n            "normalized_snapshot": 5,\n            "web_snapshot": 13,\n        },\n        "source_status_counts": {"active": 38},\n    }\n''',
          )
          exact_replace(
              'tests/test_post_v1_11_0_release_priority_selection_20260803.py',
              '''    def test_source_registry_receipt_matches_canonical_rows(self) -> None:\n        with (ROOT / "data/master/sources.csv").open(\n            encoding="utf-8-sig", newline=""\n        ) as handle:\n            rows = list(csv.DictReader(handle))\n        self.assertGreater(len(rows), 0)\n        self.assertEqual(self.report["source_registry"]["source_count"], len(rows))\n''',
              '''    def test_source_registry_receipt_preserves_the_review_boundary(self) -> None:\n        self.assertEqual(\n            self.report["source_registry"],\n            {\n                "source_count": 38,\n                "source_type_counts": {\n                    "brochure_pdf": 6,\n                    "configuration_pdf": 14,\n                    "normalized_snapshot": 5,\n                    "web_snapshot": 13,\n                },\n                "source_status_counts": {"active": 38},\n            },\n        )\n''',
          )

          # The closed exact-design import owns one source and 15 relationships.
          # Later independent source packages may grow the global registries, so its
          # verifier must validate its own boundary instead of global row totals.
          exact_replace(
              'tools/import_sandero_stepway_exact_configurator_states_20260809.py',
              '''def expected_counts() -> dict[str, int]:\n    return {\n        "sources.csv": 38,\n        "source_configurations.csv": 284,\n        "commercial_items.csv": 50,\n        "commercial_item_attributes.csv": 103,\n        "commercial_item_configurations.csv": 322,\n        "configuration_attribute_values.csv": 3690,\n    }\n\n\ndef verify_imported() -> None:\n    for name, count in expected_counts().items():\n        _, rows = read_csv(name)\n        if len(rows) != count:\n            raise RuntimeError(f"{name}: expected {count} rows, found {len(rows)}")\n    _, sources = read_csv("sources.csv")\n    source = next(row for row in sources if row["code"] == SOURCE_CODE)\n    if source["sha256"] != hashlib.sha256(CAPTURE.read_bytes()).hexdigest():\n        raise RuntimeError("registered capture SHA-256 differs")\n''',
              '''def expected_counts() -> dict[str, int]:\n    return {\n        "commercial_items.csv": 50,\n        "commercial_item_attributes.csv": 103,\n        "commercial_item_configurations.csv": 322,\n        "configuration_attribute_values.csv": 3690,\n    }\n\n\ndef verify_imported() -> None:\n    for name, count in expected_counts().items():\n        _, rows = read_csv(name)\n        if len(rows) != count:\n            raise RuntimeError(f"{name}: expected {count} rows, found {len(rows)}")\n\n    _, sources = read_csv("sources.csv")\n    matching_sources = [row for row in sources if row["code"] == SOURCE_CODE]\n    if len(matching_sources) != 1:\n        raise RuntimeError(\n            f"expected exactly one registered exact-state source, found {len(matching_sources)}"\n        )\n    source = matching_sources[0]\n    if source["sha256"] != hashlib.sha256(CAPTURE.read_bytes()).hexdigest():\n        raise RuntimeError("registered capture SHA-256 differs")\n\n    capture = json.loads(CAPTURE.read_text(encoding="utf-8"))\n    expected_configurations = {\n        row["configuration_code"] for row in capture["configurations"]\n    }\n    _, relationships = read_csv("source_configurations.csv")\n    owned_relationships = [\n        row for row in relationships if row["source_code"] == SOURCE_CODE\n    ]\n    observed_configurations = {\n        row["configuration_code"] for row in owned_relationships\n    }\n    if len(owned_relationships) != len(expected_configurations):\n        raise RuntimeError(\n            "exact-state source relationship count differs from the closed package"\n        )\n    if observed_configurations != expected_configurations:\n        raise RuntimeError("exact-state source configuration coverage differs")\n    if any(row["relationship"] != "documents" for row in owned_relationships):\n        raise RuntimeError("exact-state source relationship semantics differ")\n''',
          )
          exact_replace(
              'tests/test_sandero_stepway_exact_design_factory_option_normalization_20260809.py',
              '''    def test_master_row_counts_match_the_closed_package(self) -> None:\n        self.assertEqual(len(self.sources), 38)\n        self.assertEqual(len(self.source_configurations), 284)\n        self.assertEqual(len(self.items), 50)\n        self.assertEqual(len(self.item_attributes), 103)\n        self.assertEqual(len(self.mappings), 322)\n        self.assertEqual(len(self.values), 3690)\n''',
              '''    def test_closed_package_tables_remain_stable_as_source_registries_grow(self) -> None:\n        self.assertGreaterEqual(len(self.sources), 38)\n        self.assertGreaterEqual(len(self.source_configurations), 284)\n        self.assertEqual(len(self.items), 50)\n        self.assertEqual(len(self.item_attributes), 103)\n        self.assertEqual(len(self.mappings), 322)\n        self.assertEqual(len(self.values), 3690)\n''',
          )
          PY
      - name: Run the four formerly failing contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -q \
            tests.test_post_v1_11_0_release_priority_selection_20260803 \
            tests.test_sandero_stepway_exact_design_factory_option_normalization_20260809
      - name: Commit evolution-safe historical boundaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/review_post_v1_11_0_release_priority_selection_20260803.py \
            tests/test_post_v1_11_0_release_priority_selection_20260803.py \
            tools/import_sandero_stepway_exact_configurator_states_20260809.py \
            tests/test_sandero_stepway_exact_design_factory_option_normalization_20260809.py
          if ! git diff --cached --quiet; then
            git commit -m "test(source): preserve closed source boundaries as registry grows"
            git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
          fi
      - name: Run full unit suite
        run: python -m unittest discover -s tests -p "test_*.py" -q
      - name: Run full repository quality gate
        run: python tools/dkb.py quality
