name: Temporary Reviewed Gap Materialization

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/temp-reviewed-gap-materialization.yml
      - tools/temp_patch_reviewed_gap_ui.py

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/reviewed-gap-state-materialization-20260802'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Apply reviewed data and interface states
        shell: bash
        run: |
          python tools/apply_reviewed_gap_state_materialization_20260802.py
          python tools/temp_patch_reviewed_gap_ui.py
          python tools/dkb.py documentation-baseline --apply
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          import project_state
          root = Path('.').resolve()
          state = project_state.read_state(root / 'project/state.json')
          project_state.validate_state(state)
          project_state.write_atomic(
              root / 'project/STATE_SUMMARY.md',
              project_state.render_summary(state),
          )
          PY

      - name: Run focused contracts
        shell: bash
        run: |
          python -m py_compile tools/configuration_shortlist.py tools/apply_reviewed_gap_state_materialization_20260802.py
          python -m unittest tests.test_reviewed_gap_state_materialization_20260802

      - name: Commit materialized package
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md data/master/commercial_item_configurations.csv project/ROADMAP.md project/SESSION_STATE.md project/STATE_SUMMARY.md project/state.json tools/configuration_shortlist.py tools/reporting/configuration_shortlist_v12_pricing.js
          if git diff --cached --quiet; then
            echo 'Package files are already materialized.'
            exit 0
          fi
          git commit -m 'feat: apply reviewed gap state materialization'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
