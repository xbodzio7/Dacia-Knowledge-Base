name: Temporary Sandero Page 17 Coverage Matrix

on:
  push:
    branches:
      - agent/sandero-page17-reviewed-fact-reconciliation-20260731
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: agent/sandero-page17-reviewed-fact-reconciliation-20260731
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build compact coverage matrix
        run: python tools/materialize_sandero_page17_coverage_matrix.py

      - name: Commit matrix and remove temporary tools
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/temporary-sandero-page17-coverage-matrix.yml
          rm tools/materialize_sandero_page17_coverage_matrix.py
          git add \
            project/tmp/sandero-page17-coverage-matrix.json \
            .github/workflows/temporary-sandero-page17-coverage-matrix.yml \
            tools/materialize_sandero_page17_coverage_matrix.py
          git commit -m "chore(review): capture compact Sandero page 17 coverage matrix"
          git push origin HEAD:agent/sandero-page17-reviewed-fact-reconciliation-20260731
