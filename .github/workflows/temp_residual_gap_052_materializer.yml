name: Temporary residual gap 052 review materializer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out materialization branch
        uses: actions/checkout@v4
        with:
          ref: agent/residual-gap-052-materialize-20260730
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize and verify review
        run: python tools/materialize_residual_gap_052_review.py
      - name: Commit deterministic outputs and remove temporary tooling
        run: |
          rm -f tools/materialize_residual_gap_052_review.py
          rm -f .github/workflows/temp_residual_gap_052_materializer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "review: materialize Sandero page 19 unresolved chunk 2"
          git push origin HEAD:agent/residual-gap-052-materialize-20260730
