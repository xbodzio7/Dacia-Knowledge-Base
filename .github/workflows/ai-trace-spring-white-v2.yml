name: AI trace Spring white v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture migration trace
        shell: bash
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/ai-trace-spring-white-v2.yml
          git add -A && git commit -m 'ci: remove Spring white v2 tracer' && git push origin HEAD:main
          branch=agent/spring-biel-alpejska-default-colour-migration-v2-20260802
          old=7d99eb39ba2c5e7db791d6244ddebd8d5650edf8
          git fetch origin "$branch" > /tmp/fetch.log 2>&1; s1=$?
          git checkout -B "$branch" "origin/$branch" > /tmp/checkout.log 2>&1; s2=$?
          git merge origin/main --no-edit > /tmp/merge.log 2>&1; s3=$?
          mkdir -p data/imports/configuration_values data/reporting project/packages tests tools
          git show "${old}:data/imports/configuration_values/spring_biel_alpejska_default_colour_20260802.json" > data/imports/configuration_values/spring_biel_alpejska_default_colour_20260802.json 2>/tmp/show1.log; s4=$?
          git show "${old}:tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py" > tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py 2>/tmp/show2.log; s5=$?
          git show "${old}:tests/test_spring_biel_alpejska_default_colour_migration_20260802.py" > tests/test_spring_biel_alpejska_default_colour_migration_20260802.py 2>/tmp/show3.log; s6=$?
          git show "${old}:project/packages/spring-biel-alpejska-default-colour-migration-20260802.md" > project/packages/spring-biel-alpejska-default-colour-migration-20260802.md 2>/tmp/show4.log; s7=$?
          python3 - <<'PY' > /tmp/patch.log 2>&1
          from pathlib import Path
          for name in ['tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py','tests/test_spring_biel_alpejska_default_colour_migration_20260802.py','project/packages/spring-biel-alpejska-default-colour-migration-20260802.md']:
              p=Path(name); t=p.read_text(encoding='utf-8'); t=t.replace('11715','11728').replace('spring_supplied_charging_cable_model_decision_001','post_spring_biel_alpejska_priority_selection_review_001'); p.write_text(t,encoding='utf-8')
          PY
          s8=$?
          python3 tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py --apply > /tmp/apply.log 2>&1; s9=$?
          git reset --hard HEAD >/dev/null 2>&1
          rm -f project/spring-white-v2-trace.txt
          {
            echo "fetch=$s1"; cat /tmp/fetch.log
            echo "checkout=$s2"; cat /tmp/checkout.log
            echo "merge=$s3"; cat /tmp/merge.log
            echo "show_spec=$s4"; cat /tmp/show1.log
            echo "show_tool=$s5"; cat /tmp/show2.log
            echo "show_test=$s6"; cat /tmp/show3.log
            echo "show_package=$s7"; cat /tmp/show4.log
            echo "patch=$s8"; cat /tmp/patch.log
            echo "apply=$s9"; cat /tmp/apply.log
          } > project/spring-white-v2-trace.txt
          git add project/spring-white-v2-trace.txt
          git commit -m 'diagnostic: capture Spring white v2 materializer trace'
          git push origin HEAD:"$branch"
          exit 0
