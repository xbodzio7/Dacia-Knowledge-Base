name: Materialize Duster Chassis

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/inventory-duster-chassis.yml
      - data/imports/brochure_technical_values/duster-chassis-20251020.json
      - tools/import_duster_chassis_20260726.py
      - tools/materialize_duster_chassis_20260726.py
      - tools/repair_duster_chassis_import_scope_20260726.py
      - tools/repair_duster_chassis_regressions_20260726.py
      - tests/test_duster_chassis_20260726.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/duster-chassis-observation-import
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Materialize and validate package
        shell: bash
        run: |
          set +e
          log=.github/duster-chassis-materialization.log
          : > "$log"
          status=0
          python tools/repair_duster_chassis_import_scope_20260726.py >> "$log" 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            python tools/import_duster_chassis_20260726.py --apply >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/materialize_duster_chassis_20260726.py >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/repair_duster_chassis_regressions_20260726.py >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/import_duster_chassis_20260726.py --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/verify_brochure_chassis_measurement_context_model_20260726.py --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py validate >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tests/test_duster_chassis_20260726.py -v >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' -v >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            git diff --check >> "$log" 2>&1 || status=$?
          fi
          cat "$log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat(data): materialize Duster chassis observations'
            git push origin HEAD:agent/duster-chassis-observation-import
          fi
          exit "$status"
