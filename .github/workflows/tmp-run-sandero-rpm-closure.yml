name: Temporary run Sandero RPM closure

on:
  push:
    branches:
      - agent/sandero-page17-rpm-range-import-closure-20260731
    paths:
      - '.github/workflows/tmp-run-sandero-rpm-closure.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sandero-page17-rpm-range-import-closure-20260731
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install PDF backend
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify import and materialize closure
        run: |
          python -m unittest -q tests.test_sandero_page17_power_torque_rpm_ranges
          python .github/scripts/tmp_materialize_sandero_rpm_closure.py
          python tools/dkb.py project-state --apply
          python tools/dkb.py project-state --check
          python tools/dkb.py documentation-baseline --check
      - name: Verify five-file working manifest
        shell: python
        run: |
          import subprocess
          expected = {
              'data/reporting/sandero_page17_power_torque_rpm_range_import_closure.json',
              'data/reporting/sandero_page17_power_torque_rpm_range_import_closure.md',
              'project/reviews/sandero-page17-power-torque-rpm-range-import-closure-2026-07-31.md',
              'project/state.json',
              'project/STATE_SUMMARY.md',
          }
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()))
          if changed != expected:
              raise RuntimeError(f'unexpected materialized manifest: {sorted(changed)}')
      - name: Run full quality gate
        run: python tools/dkb.py quality --concise --database '${{ runner.temp }}/dkb.sqlite' --log-file '${{ runner.temp }}/quality.log' --summary-json '${{ runner.temp }}/quality-summary.json'
      - name: Commit exact final package
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-run-sandero-rpm-closure.yml
          rm -f .github/workflows/tmp-bootstrap-sandero-page17-rpm-closure.yml
          rm -f .github/workflows/tmp-materialize-sandero-page17-rpm-range-import-closure.yml
          rm -f .github/scripts/tmp_materialize_sandero_rpm_closure.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(sandero): close page 17 RPM range import'
          git fetch origin main
          python - <<'PY'
          import subprocess
          expected = {
              'data/reporting/sandero_page17_power_torque_rpm_range_import_closure.json',
              'data/reporting/sandero_page17_power_torque_rpm_range_import_closure.md',
              'project/reviews/sandero-page17-power-torque-rpm-range-import-closure-2026-07-31.md',
              'project/state.json',
              'project/STATE_SUMMARY.md',
          }
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True).splitlines()))
          if changed != expected:
              raise RuntimeError(f'unexpected final PR manifest: {sorted(changed)}')
          PY
          git push origin HEAD:agent/sandero-page17-rpm-range-import-closure-20260731
