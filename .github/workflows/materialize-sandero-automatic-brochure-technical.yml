name: Materialize Sandero Automatic Brochure Technical Values

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/materialize-sandero-automatic-brochure-technical.yml
      - data/imports/brochure_technical_values/sandero-ecog120-automatic-20260202.json
      - tools/import_sandero_ecog120_automatic_brochure_technical_20260726.py
      - tests/test_sandero_ecog120_automatic_brochure_technical_20260726.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/sandero-ecog120-automatic-brochure-technical-import
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Materialize exact values and verify package
        shell: bash
        run: |
          set +e
          log=.github/sandero-automatic-brochure-technical.log
          : > "$log"
          status=0

          python tools/import_sandero_ecog120_automatic_brochure_technical_20260726.py --apply >> "$log" 2>&1 || status=$?

          if [ "$status" -eq 0 ]; then
            python - <<'PY' >> "$log" 2>&1 || status=$?
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f'anchor missing in {path}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          reporting_path = Path('data/reporting/sandero_ecog120_automatic_completeness.json')
          reporting = json.loads(reporting_path.read_text(encoding='utf-8'))
          slots = reporting['technical_slots']
          existing = {
              (str(item.get('attribute_code', '')), str(item.get('fuel_type_code', '')))
              for item in slots
          }
          for slot in (
              {'attribute_code': 'gearbox_type', 'fuel_type_code': ''},
              {'attribute_code': 'minimum_kerb_weight', 'fuel_type_code': ''},
          ):
              key = (slot['attribute_code'], slot['fuel_type_code'])
              if key not in existing:
                  slots.append(slot)
                  existing.add(key)
          slots.sort(key=lambda item: (str(item.get('attribute_code', '')), str(item.get('fuel_type_code', ''))))
          reporting_path.write_text(json.dumps(reporting, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          review_path = Path('tools/review_official_brochure_technical_gaps_20260726.py')
          review = review_path.read_text(encoding='utf-8')
          old_coverage = '''    ensure(len(brochure_values) == 357, "brochure scalar value total differs")
    ensure(not brochure_ranges, "review unexpectedly contains brochure ranges")
    ensure(Counter(row.get("attribute_code", "") for row in brochure_values) == Counter({"boot_capacity": 287, "elasticity_80_120": 70}), "brochure attribute coverage differs")
    ensure(len(brochure_relationships) == 52, "brochure relationship total differs")'''
          new_coverage = '''    baseline_counts = Counter(row.get("attribute_code", "") for row in brochure_values)
    ensure(baseline_counts["boot_capacity"] == 287, "brochure cargo baseline differs")
    ensure(baseline_counts["elasticity_80_120"] == 70, "brochure selected-gear baseline differs")
    ensure(len(brochure_values) >= 357, "brochure scalar value baseline regressed")
    ensure(len(brochure_relationships) >= 52, "brochure relationship baseline regressed")
    ensure(isinstance(brochure_ranges, list), "brochure range inventory is invalid")'''
          if new_coverage not in review:
              if old_coverage not in review:
                  raise RuntimeError('historical coverage anchor missing')
              review = review.replace(old_coverage, new_coverage, 1)

          old_candidate = '''        present = {attribute for configuration, attribute in pairs if configuration == code}
        ensure(not (present & SANDERO_AUTOMATIC_CANDIDATE_ATTRIBUTES), f"automatic Sandero candidate is already populated: {code}")'''
          new_candidate = '''        present = {attribute for configuration, attribute in pairs if configuration == code}
        materialized = present & SANDERO_AUTOMATIC_CANDIDATE_ATTRIBUTES
        ensure(
            not materialized or materialized == SANDERO_AUTOMATIC_CANDIDATE_ATTRIBUTES,
            f"automatic Sandero candidate is only partially populated: {code}",
        )'''
          if new_candidate not in review:
              if old_candidate not in review:
                  raise RuntimeError('automatic candidate anchor missing')
              review = review.replace(old_candidate, new_candidate, 1)

          review = re.sub(
              r'\n    ensure\(not any\(\(code, "gross_train_weight"\) in pairs for code in bigster\), "Bigster gross train weight candidate already populated"\)\n    ensure\(not any\(\(code, "unbraked_trailer_weight"\) in pairs for code in bigster\), "Bigster unbraked towing candidate already populated"\)',
              '',
              review,
              count=1,
          )
          review = re.sub(
              r'\n    ensure\(not any\(\(code, "acceleration_0_100"\) in pairs for code in jogger_hybrid\), "Jogger hybrid acceleration candidate already populated"\)\n    ensure\(not any\(\(code, "hybrid_battery_capacity_source_stated"\) in pairs for code in jogger_hybrid\), "Jogger battery capacity candidate already populated"\)',
              '',
              review,
              count=1,
          )
          review = re.sub(
              r'\n    ensure\(not any\(\(code, "gross_train_weight"\) in pairs for code in duster_exact\), "Duster gross train weight candidate already populated"\)\n    ensure\(not any\(\(code, "unbraked_trailer_weight"\) in pairs for code in duster_exact\), "Duster unbraked towing candidate already populated"\)',
              '',
              review,
              count=1,
          )
          review_path.write_text(review, encoding='utf-8')

          historical_test = Path('tests/test_official_brochure_technical_gap_review.py')
          text = historical_test.read_text(encoding='utf-8')
          old_live = '''        self.assertEqual(len(values), 357)
        self.assertEqual(
            Counter(row["attribute_code"] for row in values),
            Counter({"boot_capacity": 287, "elasticity_80_120": 70}),
        )'''
          new_live = '''        counts = Counter(row["attribute_code"] for row in values)
        self.assertEqual(counts["boot_capacity"], 287)
        self.assertEqual(counts["elasticity_80_120"], 70)
        self.assertGreaterEqual(len(values), 357)'''
          if new_live not in text:
              if old_live not in text:
                  raise RuntimeError('historical live coverage anchor missing')
              text = text.replace(old_live, new_live, 1)

          pattern = re.compile(
              r'^    def test_project_state_advances_to_automatic_sandero_import\(self\) -> None:\n.*?(?=^\n\nif __name__)',
              re.MULTILINE | re.DOTALL,
          )
          replacement = '''    def test_project_state_preserves_review_baseline_after_follow_up_packages(self) -> None:
        state = json.loads((ROOT / "project" / "state.json").read_text(encoding="utf-8"))
        self.assertEqual(state["current_package"]["status"], "complete")
        self.assertGreaterEqual(state["baseline"]["tests"], 842)
        self.assertGreaterEqual(state["baseline"]["rows"], 8852)
        self.assertGreaterEqual(state["baseline"]["configuration_values"], 2188)
        self.assertGreaterEqual(state["baseline"]["configuration_import_specs"], 117)
'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise RuntimeError('historical project-state method missing')
          historical_test.write_text(text, encoding='utf-8')

          state_path = Path('project/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['updated_on'] = '2026-07-26'
          state['phase'] = 'Sandero Eco-G 120 Automatic Brochure Technical Import'
          state['current_package'] = {
              'name': 'Sandero Eco-G 120 Automatic Brochure Technical Import',
              'status': 'complete',
              'goal': 'Import the exact existing-schema engine, performance, transmission, mass and towing observations from the official Sandero brochure for the two active Eco-G 120 automatic Expression and Journey configurations, while excluding placeholder WLTP cells, maximum kerb weight and model-wide chassis fields.',
          }
          state['next_package'] = {
              'name': 'Bigster and Duster Brochure Towing Mass Import',
              'status': 'planned',
              'goal': 'Import exact gross train weight and unbraked trailer weight observations from the official Bigster and Duster brochures for the reviewed active configurations, using existing attributes and preserving powertrain boundaries.',
          }
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = '* Imported 36 exact brochure technical observations for the two active Sandero Eco-G 120 automatic Expression and Journey configurations, preserving LPG/petrol context for power, torque and acceleration while excluding WLTP placeholders, maximum kerb weight and model-wide chassis rows.\n'
          if entry not in changelog:
              marker = '### Added\n\n'
              if marker not in changelog:
                  raise RuntimeError('CHANGELOG Added marker missing')
              changelog = changelog.replace(marker, marker + entry, 1)
              changelog_path.write_text(changelog, encoding='utf-8')

          print('PASS: reporting slots, historical contracts and project state updated')
          PY
          fi

          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/import_sandero_ecog120_automatic_brochure_technical_20260726.py --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/review_official_brochure_technical_gaps_20260726.py --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py validate >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tests/test_sandero_ecog120_automatic_brochure_technical_20260726.py -v >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' -v >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            git diff --check >> "$log" 2>&1 || status=$?
          fi

          cat "$log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat(data): materialize Sandero automatic brochure technical values'
            git push origin HEAD:agent/sandero-ecog120-automatic-brochure-technical-import
          fi
          exit "$status"
