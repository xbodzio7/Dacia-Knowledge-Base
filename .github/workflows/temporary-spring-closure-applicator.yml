name: Temporary Spring Closure Payload Applicator

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/spring-legacy-pdf-assimilation-closure-001'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Apply verified closure package
        shell: bash
        run: |
          set -euo pipefail
          cat project/spring-closure.chunk.* > /tmp/spring-closure.patch.gz.b64
          echo '03affd3aae0eea3191163d375403f95463ecf1a12bed1b8ecba1053dbc224920  /tmp/spring-closure.patch.gz.b64' | sha256sum --check
          base64 -d /tmp/spring-closure.patch.gz.b64 | gzip -d > /tmp/spring-closure.patch
          echo '193d4057f7a5067f729a9345f65a7c04218cd1b7936e4483059a1c78d1a82459  /tmp/spring-closure.patch' | sha256sum --check
          git apply --index /tmp/spring-closure.patch
          rm -f project/spring-closure.patch.gz.b64
          rm -f project/spring-closure.chunk.*
          rm -f .github/workflows/temporary-spring-closure-applicator.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Close Spring legacy PDF assimilation milestone [spring-closure-applied]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
