name: Materialize equipment facet interaction fix PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/equipment-facet-interaction'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: fix/equipment-facet-interaction
          fetch-depth: 0

      - name: Execute reviewed materializer
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/materialize-equipment-facet-interaction-fix.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          body = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(body, '<equipment-facet-materializer>', 'exec'))
          PY
          rm -f .github/workflows/materialize-equipment-facet-interaction-fix-pr.yml
          rm -f project/tmp/please-ignore.txt project/tmp/ignore-marker-*.txt

      - name: Validate package
        run: |
          git diff --check
          python tools/dkb.py project-state --check
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): make equipment facets monotonic and searchable"
          git push origin HEAD:fix/equipment-facet-interaction
