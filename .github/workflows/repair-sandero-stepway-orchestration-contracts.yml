name: Repair Sandero Stepway Orchestration Contracts

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/repair-sandero-stepway-orchestration-contracts.yml
      - tools/repair_sandero_stepway_orchestration_contracts_20260726.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/sandero-stepway-chassis-observation-import
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Repair and verify orchestration contracts
        shell: bash
        run: |
          set -euo pipefail
          python tools/repair_sandero_stepway_orchestration_contracts_20260726.py
          python -m unittest -q \
            tests.project_state_contract \
            tests.autonomy_policy_contract \
            tests.quality_artifact_manifest_contract \
            tests.configuration_comparison_context_filter_contract \
            tests.configuration_comparison_pair_summary_contract
          python tools/dkb.py project-state --check
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'test(reporting): update Sandero Stepway orchestration snapshots'
            git push origin HEAD:agent/sandero-stepway-chassis-observation-import
          fi
