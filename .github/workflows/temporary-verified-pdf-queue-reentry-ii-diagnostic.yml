name: Temporary Verified PDF Queue Re-entry II Materialization

on:
  push:
    branches:
      - agent/verified-pdf-queue-reentry-review-ii-20260731
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out queue review branch
        uses: actions/checkout@v4
        with:
          ref: agent/verified-pdf-queue-reentry-review-ii-20260731
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Materialize and validate queue review
        run: python tools/materialize_verified_pdf_queue_reentry_review_ii.py

      - name: Commit final review and remove temporary tools
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/temporary-verified-pdf-queue-reentry-ii-diagnostic.yml
          rm tools/materialize_verified_pdf_queue_reentry_review_ii.py
          git add \
            data/reporting/verified_pdf_residual_queue_reentry_review.json \
            data/reporting/verified_pdf_residual_queue_reentry_review.md \
            project/reviews/verified-pdf-residual-queue-reentry-review-2026-07-31.md \
            project/state.json \
            project/STATE_SUMMARY.md \
            .github/workflows/temporary-verified-pdf-queue-reentry-ii-diagnostic.yml \
            tools/materialize_verified_pdf_queue_reentry_review_ii.py
          git commit -m "review(pdf): select Sandero page 17 for reconciliation"
          git push origin HEAD:agent/verified-pdf-queue-reentry-review-ii-20260731
