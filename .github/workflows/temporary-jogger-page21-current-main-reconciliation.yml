name: Temporary Jogger Page 21 Current Main Reconciliation
on:
  push:
    branches:
      - agent/jogger-page21-current-main-reconciliation-20261104-001
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.ref_name }}
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconcile against the exact PR base
        env:
          EXPECTED_MAIN_SHA: 86e28a0b15a7bc26c214f8422e4ab95e7b4a5454
          HEAD_BRANCH: \${{ github.ref_name }}
        run: |
          git fetch origin main
          python tools/reconcile_jogger_equipment_page21_current_main_20261104.py \
            --main-sha "$(git rev-parse origin/main)" \
            --expected-main-sha "$EXPECTED_MAIN_SHA"
          python -m unittest tests.test_jogger_equipment_page21_current_main_reconciliation_20261104
          python tools/dkb.py project-state --apply
          python tools/dkb.py documentation-baseline --apply
          python tools/dkb.py project-state --check
          python tools/dkb.py documentation-baseline --check
          rm .github/workflows/temporary-jogger-page21-current-main-reconciliation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(review): reconcile Jogger equipment page 21 against current main"
          git push origin "HEAD:$HEAD_BRANCH"
