name: Temporary Reviewed Gap Direct Cleanup

on:
  push:
    branches:
      - agent/reviewed-gap-state-materialization-20260802
    paths:
      - .github/workflows/temporary-reviewed-gap-direct-cleanup.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/reviewed-gap-state-materialization-20260802
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Apply optional-report compatibility fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/configuration_shortlist.py')
          text = path.read_text(encoding='utf-8')
          old = '''    try:
        payload = json.loads(path.read_text(encoding="utf-8"))
    except (OSError, json.JSONDecodeError) as exc:
        raise ShortlistError(f"cannot read reviewed gap report: {exc}") from exc
'''
          new = '''    try:
        payload = json.loads(path.read_text(encoding="utf-8"))
    except FileNotFoundError:
        return {}
    except (OSError, json.JSONDecodeError) as exc:
        raise ShortlistError(f"cannot read reviewed gap report: {exc}") from exc
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('reviewed report loader marker mismatch')

          old_apply = '''    payload = _read_reviewed_gap_report(repository)
    configurations = catalog.get("configurations")
'''
          new_apply = '''    payload = _read_reviewed_gap_report(repository)
    if not payload:
        return
    configurations = catalog.get("configurations")
'''
          if old_apply in text:
              text = text.replace(old_apply, new_apply, 1)
          elif new_apply not in text:
              raise SystemExit('reviewed state apply marker mismatch')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run focused regression contracts
        shell: bash
        run: |
          python -m py_compile tools/configuration_shortlist.py
          python -m unittest -q \
            tests.test_configuration_shortlist_html \
            tests.test_configuration_comparison_workbook \
            tests.test_reviewed_gap_state_materialization_20260802
      - name: Commit product fix and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch \
            .github/workflows/temporary-reviewed-gap-direct-cleanup.yml \
            .github/workflows/temp-reviewed-gap-ci-repair.yml \
            .github/workflows/temp-fix-reviewed-gap-optional-report.yml \
            tools/temp_fix_reviewed_gap_ci.py
          git add tools/configuration_shortlist.py
          git diff --cached --check
          git commit -m 'fix: preserve shortlist fixture compatibility'
          git push origin HEAD:agent/reviewed-gap-state-materialization-20260802
