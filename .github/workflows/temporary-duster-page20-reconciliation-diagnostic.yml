name: Temporary Duster page 20 reconciliation diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/duster-page20-reviewed-fact-reconciliation-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/duster-page20-reviewed-fact-reconciliation-20260730
          persist-credentials: false
      - name: Print current Duster page 20 coverage
        run: |
          python - <<'PY'
          import csv
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          ROOT = Path('.')
          SOURCE = 'src_pl_duster_mini_brochure_20251020'

          def rows(path):
              with Path(path).open(encoding='utf-8-sig', newline='') as handle:
                  return list(csv.DictReader(handle))

          values = [row for row in rows('data/master/configuration_attribute_values.csv') if row['source_code'] == SOURCE]
          ranges = [row for row in rows('data/master/configuration_attribute_value_ranges.csv') if row['source_code'] == SOURCE]
          configs = {row['code']: row for row in rows('data/master/configurations.csv')}
          attributes = {row['code']: row for row in rows('data/master/attributes.csv')}

          print('VALUE_SUMMARY', len(values), json.dumps(Counter(row['attribute_code'] for row in values), sort_keys=True))
          print('RANGE_SUMMARY', len(ranges), json.dumps(Counter(row['attribute_code'] for row in ranges), sort_keys=True))
          grouped = defaultdict(list)
          for row in values:
              grouped[row['attribute_code']].append(row)
          for attribute in sorted(grouped):
              selected = grouped[attribute]
              print('VALUE_ATTR', attribute, 'COUNT', len(selected), 'VALUES', sorted({row['value'] for row in selected}), 'FUELS', sorted({row['fuel_type_code'] for row in selected}), 'IDS', [row['id'] for row in selected[:3]], [row['id'] for row in selected[-3:]])
              for row in selected[:8]:
                  print('  VALUE', json.dumps({
                      'id': row['id'], 'code': row['code'], 'configuration': row['configuration_code'],
                      'powertrain': configs.get(row['configuration_code'], {}).get('powertrain_label'),
                      'fuel': row['fuel_type_code'], 'gear': row['gear_number'], 'value': row['value'],
                      'notes': row['notes'],
                  }, ensure_ascii=False, sort_keys=True))
          grouped_ranges = defaultdict(list)
          for row in ranges:
              grouped_ranges[row['attribute_code']].append(row)
          for attribute in sorted(grouped_ranges):
              selected = grouped_ranges[attribute]
              print('RANGE_ATTR', attribute, 'COUNT', len(selected), 'BOUNDS', sorted({(row['minimum_value'], row['maximum_value']) for row in selected}), 'FUELS', sorted({row['fuel_type_code'] for row in selected}))
              for row in selected[:10]:
                  print('  RANGE', json.dumps({
                      'id': row['id'], 'code': row['code'], 'configuration': row['configuration_code'],
                      'powertrain': configs.get(row['configuration_code'], {}).get('powertrain_label'),
                      'fuel': row['fuel_type_code'], 'gear': row['gear_number'],
                      'minimum': row['minimum_value'], 'maximum': row['maximum_value'], 'notes': row['notes'],
                  }, ensure_ascii=False, sort_keys=True))

          relevant = [
              'propulsion_system','fully_electric_driving','max_power','max_power_rpm','maximum_torque','max_torque_rpm',
              'injection_type','engine_displacement','cylinder_count','valve_count','emission_standard',
              'particulate_filter','stop_start','traction_battery_type','traction_battery_voltage',
              'traction_battery_capacity','top_speed','acceleration_0_100','drive_type','transmission_type',
              'gear_count','front_brake_disc_diameter','front_brake_disc_thickness','homologation_protocol',
              'eco_mode','fuel_tank_capacity','gross_vehicle_weight','gross_train_weight',
              'braked_trailer_weight','unbraked_trailer_weight','boot_capacity'
          ]
          print('ATTRIBUTE_CONTRACTS')
          for code in relevant:
              row = attributes.get(code)
              print(code, json.dumps(row, ensure_ascii=False, sort_keys=True) if row else 'MISSING')
          PY
