name: Audit Public Data Products v1.8.1

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/data-products-v1-8-1-public-audit.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 0b7009fd1950693e347638a6b96756aeefb43b8a
      VERSION: 1.8.1
      TAG: data-products-v1.8.1
      ARCHIVE: dacia-knowledge-base-data-products-v1.8.1.zip
      EXPECTED_RELEASE_ID: '360138130'
      EXPECTED_ARCHIVE_ID: '490767591'
      EXPECTED_ARCHIVE_SIZE: '62141954'
      EXPECTED_ARCHIVE_SHA256: 3bb8ba7c48195651bbe24cae042560273c5e4083467c01b203bb07dab7401bc5
      EXPECTED_MANIFEST_ID: '490767592'
      EXPECTED_MANIFEST_SIZE: '20607'
      EXPECTED_MANIFEST_SHA256: f4ed40ed7e469876c80ee95c6b1ad18fcf6c86f215934ab5942373f2889a54fd
      EXPECTED_CHECKSUMS_ID: '490767593'
      EXPECTED_CHECKSUMS_SIZE: '213'
      EXPECTED_CHECKSUMS_SHA256: ca59fb187c8fbdcbacf7c62d0c65559a8f604defc5634b1d7fe257df7f7e668e
      PUBLICATION_RUN: '30224467755'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/data-products-v1-8-1-public-audit
          fetch-depth: 0

      - name: Check out exact source tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 0b7009fd1950693e347638a6b96756aeefb43b8a
          path: source
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Download and verify public workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/public-v1.8.1-workspace"
          python source/tools/dkb.py data-product-release-download \
            --version "$VERSION" \
            --output-directory "$workspace"
          python source/tools/dkb.py data-product-workspace-verify \
            --workspace-directory "$workspace" --json \
            > "$RUNNER_TEMP/public-v1.8.1-workspace-verification.json"
          python source/tools/dkb.py data-product-release \
            --verify \
            --version "$VERSION" \
            --commit-sha "$SOURCE_SHA" \
            --output-directory "$workspace/assets"
          gh api "repos/xbodzio7/Dacia-Knowledge-Base/releases/tags/$TAG" > "$RUNNER_TEMP/public-release.json"
          gh api "repos/xbodzio7/Dacia-Knowledge-Base/git/ref/tags/$TAG" > "$RUNNER_TEMP/public-tag-ref.json"

      - name: Audit public identity and content
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$RUNNER_TEMP/public-v1.8.1-workspace" \
          WORKSPACE_REPORT="$RUNNER_TEMP/public-v1.8.1-workspace-verification.json" \
          RELEASE_JSON="$RUNNER_TEMP/public-release.json" \
          TAG_JSON="$RUNNER_TEMP/public-tag-ref.json" \
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import posixpath
          import re
          import subprocess
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          workspace = Path(os.environ["WORKSPACE"])
          assets = workspace / "assets"
          contents = workspace / "contents"
          report = json.loads(Path(os.environ["WORKSPACE_REPORT"]).read_text(encoding="utf-8"))
          release = json.loads(Path(os.environ["RELEASE_JSON"]).read_text(encoding="utf-8"))
          tag = json.loads(Path(os.environ["TAG_JSON"]).read_text(encoding="utf-8"))
          source_sha = os.environ["SOURCE_SHA"]

          expected = {
              os.environ["ARCHIVE"]: (
                  int(os.environ["EXPECTED_ARCHIVE_SIZE"]),
                  os.environ["EXPECTED_ARCHIVE_SHA256"],
                  int(os.environ["EXPECTED_ARCHIVE_ID"]),
              ),
              "data-product-release-manifest.json": (
                  int(os.environ["EXPECTED_MANIFEST_SIZE"]),
                  os.environ["EXPECTED_MANIFEST_SHA256"],
                  int(os.environ["EXPECTED_MANIFEST_ID"]),
              ),
              "SHA256SUMS": (
                  int(os.environ["EXPECTED_CHECKSUMS_SIZE"]),
                  os.environ["EXPECTED_CHECKSUMS_SHA256"],
                  int(os.environ["EXPECTED_CHECKSUMS_ID"]),
              ),
          }
          assert release["id"] == int(os.environ["EXPECTED_RELEASE_ID"])
          assert release["tag_name"] == os.environ["TAG"]
          assert release["draft"] is False
          assert release["prerelease"] is False
          assert tag["object"]["type"] == "commit"
          assert tag["object"]["sha"] == source_sha
          assert {item["name"] for item in release["assets"]} == set(expected)
          asset_records = {}
          for asset in release["assets"]:
              size, digest, asset_id = expected[asset["name"]]
              assert asset["id"] == asset_id
              assert asset["size"] == size
              assert asset["digest"] == "sha256:" + digest
              path = assets / asset["name"]
              assert path.stat().st_size == size
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest
              asset_records[asset["name"]] = {
                  "asset_id": asset["id"],
                  "size_bytes": size,
                  "sha256": digest,
                  "api_digest": asset["digest"],
              }

          assert report["status"] == "verified"
          assert report["release_version"] == "1.8.1"
          assert report["release_tag"] == os.environ["TAG"]
          assert report["repository_commit"] == source_sha
          assert report["asset_count"] == 3
          assert report["content_file_count"] == 85
          assert report["selected_configuration_count"] == 72
          assert report["scope_group_count"] == 19
          assert report["index_local_link_count"] == 83

          files = [path for path in contents.rglob("*") if path.is_file()]
          assert len(files) == 85
          content_names = {path.relative_to(contents).as_posix() for path in files}

          shortlist_name = "shortlist/configuration-shortlist.html"
          shortlist = (contents / shortlist_name).read_text(encoding="utf-8")
          match = re.search(
              r'<script id="configuration-catalog" type="application/json">(.*?)</script>',
              shortlist,
              flags=re.DOTALL,
          )
          assert match is not None
          catalog = json.loads(match.group(1))
          assert len(catalog["configurations"]) == 72
          assert len(catalog["facets"]["equipment"]) == 110
          models = catalog["facets"]["models"]
          assert [item["code"] for item in models] == [
              "sandero_iii", "sandero_stepway_iii", "jogger", "duster_iii", "bigster"
          ]
          assert [item["minimum_catalog_price_pln"] for item in models] == [
              68000, 71700, 77900, 82000, 101400
          ]
          browser = Path("source/tools/reporting/configuration_shortlist_browser.js")
          program = r'''
          const fs = require("fs");
          const api = require(process.argv[1]);
          const catalog = JSON.parse(fs.readFileSync(0, "utf8"));
          const initial = api.reconcileEquipmentSelection(catalog, {
            models: [], versions: [], transmissions: [], powertrains: [],
            required_equipment: [], required_standard_equipment: []
          });
          const camera = api.filterCatalog(catalog, {
            required_equipment: ["rear_view_camera"],
            required_standard_equipment: []
          });
          const missing = {
            configuration_code: "missing", model_code: "m", version_code: "v",
            transmission_type: "manual", powertrain_label: "p",
            catalog_price: {state: "missing"}, number_of_seats: {state: "missing"},
            equipment: {}
          };
          process.stdout.write(JSON.stringify({
            visible: initial.available_equipment.length,
            camera_matches: camera.results.length,
            missing_reasons: api.evaluate(missing, {
              required_equipment: ["rear_view_camera"], required_standard_equipment: []
            })
          }));
          '''
          completed = subprocess.run(
              ["node", "-e", program, str(browser)],
              input=json.dumps(catalog, ensure_ascii=False),
              text=True,
              capture_output=True,
              check=False,
          )
          assert completed.returncode == 0, completed.stderr or completed.stdout
          filter_contract = json.loads(completed.stdout)
          assert filter_contract["visible"] == 108
          assert filter_contract["camera_matches"] == 66
          assert "equipment_missing:rear_view_camera" in filter_contract["missing_reasons"]

          notes = (contents / "RELEASE_NOTES.md").read_text(encoding="utf-8")
          assert "Equipment filtering is restored" in notes
          assert "Missing and unknown evidence remains excluded" in notes
          assert "minimum current catalogue price" in notes
          assert "v1.8.0 remains immutable" in notes

          view_name = "cross-model/cross-model-comparison-view.json"
          html_name = "cross-model/cross-model-comparison-view.html"
          view = json.loads((contents / view_name).read_text(encoding="utf-8"))
          html = (contents / html_name).read_text(encoding="utf-8")
          summary = view["summary"]
          assert summary["model_family_count"] == 5
          assert summary["reporting_scope_count"] == 19
          assert summary["active_configuration_count"] == 72
          assert summary["within_scope_pair_count"] == 114
          assert summary["cross_scope_pairs_generated"] is False
          assert summary["ranking_generated"] is False
          assert summary["recommendations_generated"] is False
          assert summary["inferred_values_generated"] is False
          assert "<script" not in html.lower()
          assert "<img" not in html.lower()
          assert "nie podano" in html

          models_by_code = {item["model_code"]: item for item in view["models"]}
          for code in ("bigster", "duster_iii"):
              assert models_by_code[code]["seat_summary_state"] == "not_stated"
              assert models_by_code[code]["recorded_seat_values"] == []

          def target(source: str, href: str) -> str:
              value = posixpath.normpath(posixpath.join(posixpath.dirname(source), href))
              assert value != ".." and not value.startswith("../")
              return value

          comparison_paths = [
              value
              for scope in view["scopes"]
              for value in scope["comparison_paths"].values()
          ]
          assert len(comparison_paths) == 76
          navigation_paths = [
              view["navigation"]["shortlist_html"],
              view["navigation"]["comparison_bundle_manifest"],
          ]
          for href in comparison_paths + navigation_paths:
              assert target(view_name, href) in content_names

          class Links(HTMLParser):
              def __init__(self) -> None:
                  super().__init__()
                  self.hrefs: list[str] = []

              def handle_starttag(self, tag_name, attrs):
                  if tag_name.lower() == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.hrefs.append(href)

          parser = Links()
          parser.feed(html)
          local_hrefs = [
              href
              for href in parser.hrefs
              if not href.startswith("#")
              and not urlsplit(href).scheme
              and not urlsplit(href).netloc
          ]
          assert len(local_hrefs) == 57
          for href in local_hrefs:
              assert target(html_name, href) in content_names

          audit = {
              "version": 1,
              "kind": "data_products_v1_8_1_public_audit",
              "status": "PASS",
              "release_id": release["id"],
              "release_tag": release["tag_name"],
              "release_url": release["html_url"],
              "published_at": release["published_at"],
              "source_commit": source_sha,
              "publication_workflow_run": int(os.environ["PUBLICATION_RUN"]),
              "audit_workflow_run": int(os.environ["GITHUB_RUN_ID"]),
              "asset_count": 3,
              "assets": dict(sorted(asset_records.items())),
              "content_file_count": report["content_file_count"],
              "workspace_index_local_link_count": report["index_local_link_count"],
              "workspace_index_sha256": report["index_sha256"],
              "selected_configuration_count": report["selected_configuration_count"],
              "scope_group_count": report["scope_group_count"],
              "within_scope_pair_count": summary["within_scope_pair_count"],
              "equipment_filter": {
                  "facet_count": 110,
                  "visible_choices": filter_contract["visible"],
                  "camera_matches": filter_contract["camera_matches"],
                  "missing_and_unknown_are_exclusions": True,
              },
              "model_order": [
                  {"model_code": item["code"], "minimum_catalog_price_pln": item["minimum_catalog_price_pln"]}
                  for item in models
              ],
              "cross_model": {
                  "model_family_count": summary["model_family_count"],
                  "reporting_scope_count": summary["reporting_scope_count"],
                  "active_configuration_count": summary["active_configuration_count"],
                  "comparison_path_count": len(comparison_paths),
                  "navigation_path_count": len(navigation_paths),
                  "html_local_file_link_count": len(local_hrefs),
                  "unknown_seat_models": ["bigster", "duster_iii"],
                  "unknown_state": "not_stated",
              },
              "semantic_boundaries": {
                  "cross_scope_pairs_generated": False,
                  "ranking_generated": False,
                  "recommendations_generated": False,
                  "inferred_values_generated": False,
                  "public_v1_8_0_rewritten": False,
              },
              "verification": "PASS",
          }
          output = Path(".github/data-products-v1.8.1-public-audit.json")
          output.write_text(
              json.dumps(audit, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(audit, ensure_ascii=False, indent=2))
          PY

      - name: Record independent audit receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/data-products-v1.8.1-public-audit.json
          if git diff --cached --quiet; then
            echo "Public audit receipt already recorded."
          else
            git commit -m 'ci(release): record v1.8.1 public audit'
            git push origin HEAD:agent/data-products-v1-8-1-public-audit
          fi
