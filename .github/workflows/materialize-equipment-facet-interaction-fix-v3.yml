name: Materialize equipment facet interaction fix v3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/equipment-facet-interaction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/equipment-facet-interaction
          fetch-depth: 0
      - name: Apply fix
        run: python project/tmp/materialize_equipment_facet_fix.py
      - name: Remove transport files
        run: |
          rm -f .github/workflows/materialize-equipment-facet-interaction-fix.yml
          rm -f .github/workflows/materialize-equipment-facet-interaction-fix-pr.yml
          rm -f .github/workflows/materialize-equipment-facet-interaction-fix-v2.yml
          rm -f .github/workflows/materialize-equipment-facet-interaction-fix-v3.yml
          rm -f .github/workflows/diagnose-equipment-facet-materializer.yml
          rm -f project/tmp/materialize_equipment_facet_fix.py
          rm -f project/tmp/please-ignore.txt project/tmp/ignore-marker-*.txt
      - name: Validate and commit
        run: |
          git diff --check
          python tools/dkb.py project-state --check
          python -m unittest discover -s tests -p 'test_*.py'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): make equipment facets monotonic and searchable"
          git push origin HEAD:fix/equipment-facet-interaction
