name: Diagnose cross-model option coverage

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/official-configurator-cross-model-option-coverage'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build diagnostic report
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path('.')
          master = root / 'data' / 'master'

          def rows(name):
              with (master / name).open(encoding='utf-8-sig', newline='') as handle:
                  return list(csv.DictReader(handle))

          models = {row['code']: row for row in rows('models.csv')}
          versions = {row['code']: row for row in rows('versions.csv')}
          configs = [row for row in rows('configurations.csv') if row['status'] == 'active']
          target_models = {'sandero_iii', 'sandero_stepway_iii', 'jogger', 'duster_iii', 'bigster'}

          catalogue = []
          for cfg in configs:
              version = versions[cfg['version_code']]
              model_code = version['model_code']
              if model_code in target_models:
                  catalogue.append({
                      'configuration_code': cfg['code'],
                      'model_code': model_code,
                      'version_code': cfg['version_code'],
                      'powertrain_label': cfg['powertrain_label'],
                      'transmission_type': cfg['transmission_type'],
                  })

          availability = [
              row for row in rows('configuration_attribute_availability.csv')
              if row['attribute_code'] in {'shark_fin_antenna', 'side_mirrors_folding'}
          ]
          item_attributes = [
              row for row in rows('commercial_item_attributes.csv')
              if row['attribute_code'] in {'shark_fin_antenna', 'side_mirrors_folding'}
          ]
          item_codes = {row['commercial_item_code'] for row in item_attributes}
          items = [row for row in rows('commercial_items.csv') if row['code'] in item_codes]
          item_configurations = [
              row for row in rows('commercial_item_configurations.csv')
              if row['commercial_item_code'] in item_codes
          ]

          report = {
              'catalogue': sorted(catalogue, key=lambda row: (row['model_code'], row['version_code'], row['configuration_code'])),
              'availability': sorted(availability, key=lambda row: (row['attribute_code'], row['configuration_code'], row['observation_date'])),
              'commercial_items': items,
              'commercial_item_attributes': item_attributes,
              'commercial_item_configurations': sorted(item_configurations, key=lambda row: (row['commercial_item_code'], row['configuration_code'])),
          }
          Path('cross-model-option-coverage-diagnostic.json').write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          print(json.dumps({key: len(value) for key, value in report.items()}, indent=2))
          PY
      - name: Upload diagnostic report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cross-model-option-coverage-diagnostic
          path: cross-model-option-coverage-diagnostic.json
          if-no-files-found: error
          retention-days: 1
