name: Temporary generated-baseline refresh for Jogger PR
on:
  push:
    branches:
      - agent/jogger-catalogue-price-history-20261107-001
permissions:
  contents: write
jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[baseline-bot]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/jogger-catalogue-price-history-20261107-001
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Refresh canonical project state
        run: python tools/dkb.py project-state --apply
      - name: Refresh generated documentation
        run: python tools/dkb.py documentation-baseline --apply
      - name: Verify generated state
        run: |
          python tools/dkb.py project-state --check
          python tools/dkb.py documentation-baseline --check
      - name: Commit generated updates to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore: refresh generated baselines [baseline-bot]"
            git push origin HEAD:agent/jogger-catalogue-price-history-20261107-001
          fi
