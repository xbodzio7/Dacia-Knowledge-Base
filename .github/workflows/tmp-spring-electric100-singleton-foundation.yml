name: Temporary Spring Electric 100 Singleton Foundation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/spring-electric100-singleton-foundation-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-electric100-singleton-foundation-20260731
          fetch-depth: 0

      - name: Materialize Spring Electric 100 singleton foundation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          ROOT = Path('.')
          MASTER = ROOT / 'data' / 'master'
          REPORTING = ROOT / 'data' / 'reporting'

          def read_rows(path: Path):
              with path.open(encoding='utf-8', newline='') as handle:
                  reader = csv.DictReader(handle)
                  assert reader.fieldnames
                  return reader.fieldnames, list(reader)

          def append_rows(path: Path, new_rows):
              fieldnames, rows = read_rows(path)
              existing_codes = {row.get('code', '') for row in rows}
              next_id = max(int(row['id']) for row in rows) + 1
              with path.open('a', encoding='utf-8', newline='') as handle:
                  writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator='\n')
                  for offset, row in enumerate(new_rows):
                      code = row.get('code', '')
                      assert code and code not in existing_codes, (path, code)
                      existing_codes.add(code)
                      payload = {field: row.get(field, '') for field in fieldnames}
                      payload['id'] = str(next_id + offset)
                      writer.writerow(payload)

          append_rows(
              MASTER / 'versions.csv',
              [{
                  'code': 'spring_extreme',
                  'model_code': 'spring',
                  'name': 'Extreme',
                  'status': 'active',
                  'notes': 'Source-backed current Spring grade from the official Polish brochure and exact configurator snapshot observed 2026-07-31.',
              }],
          )
          append_rows(
              MASTER / 'configurations.csv',
              [{
                  'code': 'spring_extreme_electric100_automatic',
                  'version_code': 'spring_extreme',
                  'powertrain_label': 'electric 100',
                  'transmission_type': 'automatic',
                  'status': 'active',
                  'notes': 'Exact current official comparison state observed 2026-07-31; kept separate from Electric 70 reporting scope.',
              }],
          )
          append_rows(
              MASTER / 'configuration_prices.csv',
              [{
                  'code': 'spring_extreme_electric100_automatic_pl_20260731',
                  'configuration_code': 'spring_extreme_electric100_automatic',
                  'market': 'PL',
                  'price_type': 'catalog_gross',
                  'amount': '85900',
                  'currency_code': 'PLN',
                  'price_date': '2026-07-31',
                  'source_code': 'src_pl_spring_official_configurator_20260731',
                  'notes': 'Exact current official Spring Extreme Electric 100 comparison-page catalogue price observed 2026-07-31.',
              }],
          )
          append_rows(
              MASTER / 'source_versions.csv',
              [
                  {
                      'code': 'src_pl_spring_brochure_20260219__spring_extreme',
                      'source_code': 'src_pl_spring_brochure_20260219',
                      'version_code': 'spring_extreme',
                      'relationship': 'documents',
                      'notes': 'Official brochure grade column and equipment matrix; technical and equipment observation imports remain separate.',
                  },
                  {
                      'code': 'src_pl_spring_official_configurator_20260731__spring_extreme',
                      'source_code': 'src_pl_spring_official_configurator_20260731',
                      'version_code': 'spring_extreme',
                      'relationship': 'documents',
                      'notes': 'Exact current official version state observed 2026-07-31.',
                  },
              ],
          )
          append_rows(
              MASTER / 'source_configurations.csv',
              [{
                  'code': 'src_pl_spring_official_configurator_20260731__spring_extreme_electric100_automatic',
                  'source_code': 'src_pl_spring_official_configurator_20260731',
                  'configuration_code': 'spring_extreme_electric100_automatic',
                  'relationship': 'documents',
                  'notes': 'Exact official Extreme Electric 100 automatic state and catalogue price observed 2026-07-31.',
              }],
          )

          completeness = {
              'version': 1,
              'configuration_scope': 'explicit_subset',
              'configuration_status': 'active',
              'configurations': [{
                  'configuration_code': 'spring_extreme_electric100_automatic',
                  'source_code': 'src_pl_spring_official_configurator_20260731',
              }],
              'technical_slots': [],
              'equipment_attributes': [],
              'not_applicable': {'technical': [], 'equipment': []},
          }
          REPORTING.mkdir(parents=True, exist_ok=True)
          (REPORTING / 'spring_electric100_automatic_completeness.json').write_text(
              json.dumps(completeness, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          (REPORTING / 'spring_electric100_automatic_gap_evidence.spec').write_text(
              json.dumps({'as_of': '2026-07-31', 'decisions': [], 'version': 1}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          helper = ROOT / 'tools' / 'catalog_completion_history.py'
          text = helper.read_text(encoding='utf-8')
          marker = '        "spring_expression_electric70_automatic",\n'
          assert marker in text
          text = text.replace(
              marker,
              marker + '        "spring_extreme_electric100_automatic",\n',
              1,
          )
          marker = 'LATER_SCOPE_SLUGS = frozenset({"spring_electric70_automatic"})'
          assert marker in text
          text = text.replace(
              marker,
              'LATER_SCOPE_SLUGS = frozenset({"spring_electric70_automatic", "spring_electric100_automatic"})',
              1,
          )
          helper.write_text(text, encoding='utf-8')

          workflow_updates = {
              ROOT / '.github/workflows/configuration-comparison-bundle.yml': {
                  'assert manifest["selected_configuration_count"] == 10': 'assert manifest["selected_configuration_count"] == 11',
                  'assert manifest["scope_group_count"] == 6': 'assert manifest["scope_group_count"] == 7',
                  'assert manifest["singleton_scope_count"] == 2': 'assert manifest["singleton_scope_count"] == 3',
              },
              ROOT / '.github/workflows/configuration-selection-export.yml': {
                  'payload.results.length !== 9': 'payload.results.length !== 10',
                  'expected 9 selected configurations': 'expected 10 selected configurations',
                  '!== 9) {': '!== 10) {',
                  'does not contain nine lines': 'does not contain ten lines',
                  '== 9\n': '== 10\n',
                  'bundle["selected_configuration_count"] == 9': 'bundle["selected_configuration_count"] == 10',
                  'bundle["singleton_scope_count"] == 1': 'bundle["singleton_scope_count"] == 2',
              },
          }
          changed_workflows = []
          for path, replacements in workflow_updates.items():
              source = path.read_text(encoding='utf-8')
              updated = source
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              assert updated != source, path
              path.write_text(updated, encoding='utf-8')
              changed_workflows.append(path.as_posix())

          replacements = {
              'self.assertEqual(len(scopes), 21)': 'self.assertEqual(len(scopes), 22)',
              'sum(scope.slug.startswith("spring_") for scope in scopes),\n            1,': 'sum(scope.slug.startswith("spring_") for scope in scopes),\n            2,',
              'self.assertEqual(len(codes), 80)': 'self.assertEqual(len(codes), 81)',
              'self.assertEqual(len(set(codes)), 80)': 'self.assertEqual(len(set(codes)), 81)',
              'self.manifest["selected_configuration_count"], 80': 'self.manifest["selected_configuration_count"], 81',
              'self.manifest["scope_group_count"], 21': 'self.manifest["scope_group_count"], 22',
              'self.manifest["singleton_scope_count"], 0': 'self.manifest["singleton_scope_count"], 1',
              'self.assertEqual(len(names), 93)': 'self.assertEqual(len(names), 97)',
              'report["summary"]["active_configurations"], 80': 'report["summary"]["active_configurations"], 81',
              'report["summary"]["matched_configurations"], 80': 'report["summary"]["matched_configurations"], 81',
              'self.assertEqual(len(report["results"]), 80)': 'self.assertEqual(len(report["results"]), 81)',
              'self.assertEqual(len(rows), 80)': 'self.assertEqual(len(rows), 81)',
              'bundle["selected_configuration_count"], 80': 'bundle["selected_configuration_count"], 81',
              'bundle["scope_group_count"], 21': 'bundle["scope_group_count"], 22',
              'self.assertEqual(len(bundle["groups"]), 21)': 'self.assertEqual(len(bundle["groups"]), 22)',
              'view["summary"]["reporting_scope_count"], 21': 'view["summary"]["reporting_scope_count"], 22',
              'view["summary"]["active_configuration_count"], 80': 'view["summary"]["active_configuration_count"], 81',
              'rendered.count(\'class="scope-card"\'), 21': 'rendered.count(\'class="scope-card"\'), 22',
              '"Selected configurations: 80"': '"Selected configurations: 81"',
              '"Independent scopes: 21"': '"Independent scopes: 22"',
              'report["scope"]["repository_status_configurations"], 80': 'report["scope"]["repository_status_configurations"], 81',
              'scope["repository_status_configurations"], 80': 'scope["repository_status_configurations"], 81',
              'scope["excluded_configurations"], 73': 'scope["excluded_configurations"], 74',
              'report["scope"]["excluded_configurations"], 73': 'report["scope"]["excluded_configurations"], 74',
          }
          changed_tests = []
          for path in sorted((ROOT / 'tests').glob('test_*.py')):
              source = path.read_text(encoding='utf-8')
              updated = source
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if path.name == 'test_cross_model_comparison_view.py':
                  updated = updated.replace(
                      '"reporting_scope_count": 21,',
                      '"reporting_scope_count": 22,',
                  ).replace(
                      '"single_model_scope_count": 19,',
                      '"single_model_scope_count": 20,',
                  ).replace(
                      '"active_configuration_count": 80,',
                      '"active_configuration_count": 81,',
                  ).replace(
                      '"catalog_price_recorded_count": 80,',
                      '"catalog_price_recorded_count": 81,',
                  ).replace(
                      '"spring": (2, 2, 73500, 81500, 2),',
                      '"spring": (3, 3, 73500, 85900, 3),',
                  ).replace(
                      'self.assertEqual(len(codes), 80)',
                      'self.assertEqual(len(codes), 81)',
                  ).replace(
                      'self.assertEqual(html_text.count(\'class="scope-card"\'), 21)',
                      'self.assertEqual(html_text.count(\'class="scope-card"\'), 22)',
                  ).replace(
                      'self.assertEqual(len(comparison_links), 63)',
                      'self.assertEqual(len(comparison_links), 66)',
                  )
              if updated != source:
                  path.write_text(updated, encoding='utf-8')
                  changed_tests.append(path.as_posix())

          package = ROOT / 'project' / 'packages' / 'spring-electric100-singleton-catalogue-foundation-20260731.md'
          package.parent.mkdir(parents=True, exist_ok=True)
          package.write_text(
              '''# Spring Electric 100 Singleton Catalogue Foundation\n\nDate: 2026-07-31\n\nStatus: **complete**\n\n## Catalogue entity\n\nThis package adds the source-backed Spring Extreme version and its exact Electric 100 automatic configuration.\n\n## Price\n\nThe exact current official catalogue price is 85,900 PLN, observed on 2026-07-31 in the registered official configurator/comparison snapshot.\n\n## Singleton boundary\n\nThe new `spring_electric100_automatic` scope contains one configuration, zero pairs and zero differences. It remains visible in shortlist, workbook, workspace and cross-model navigation, but is never combined with Electric 70 or another independent scope.\n\n## Deferred evidence\n\nTechnical values, equipment, packages, stock cards and Cargo remain separate source-backed packages.\n''',
              encoding='utf-8',
          )

          state_path = ROOT / 'project' / 'state.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['updated_on'] = '2026-07-31'
          state['phase'] = 'Spring Electric 100 Singleton Catalogue Foundation'
          state['reference_delivery'] = {
              'name': 'Spring Electric 100 Singleton Catalogue Review',
              'pull_request': 425,
              'head_sha': 'bef39aa4b5234a0511ee2a8494317363dc36ab2d',
              'quality_run': 2772,
          }
          state['baseline']['rows'] = 11405
          current_paths = [
              *changed_workflows,
              'CHANGELOG.md',
              'README.md',
              'data/master/configuration_prices.csv',
              'data/master/configurations.csv',
              'data/master/source_configurations.csv',
              'data/master/source_versions.csv',
              'data/master/versions.csv',
              'data/reporting/spring_electric100_automatic_completeness.json',
              'data/reporting/spring_electric100_automatic_gap_evidence.spec',
              'project/SESSION_STATE.md',
              'project/STATE_SUMMARY.md',
              'project/packages/spring-electric100-singleton-catalogue-foundation-20260731.md',
              'project/state.json',
              'tools/catalog_completion_history.py',
              *changed_tests,
          ]
          state['current_package'] = {
              'package_id': 'spring_electric100_singleton_catalogue_foundation_001',
              'kind': 'singleton_catalogue_foundation',
              'name': 'Spring Electric 100 Singleton Catalogue Foundation',
              'status': 'complete',
              'goal': 'Add the source-backed Spring Extreme version, its exact Electric 100 automatic configuration, the exact current catalogue price of 85,900 PLN, explicit source relationships and one zero-pair singleton reporting scope, without importing technical values, equipment, packages, stock-card observations or cross-scope comparisons.',
              'manifest_paths': sorted(set(current_paths)),
          }
          state['next_package'] = {
              'package_id': 'spring_dated_technical_observation_review_001',
              'kind': 'technical_import_review',
              'name': 'Spring Dated Technical Observation Review',
              'status': 'planned',
              'goal': 'Compare the registered Spring brochure, MY25 stock price list and dated configurator snapshot, select exact source-specific technical observations for Electric 70 and Electric 100, and preserve date, grade, wheel, charging and conflicting-value boundaries before any import.',
              'manifest_paths': [
                  'data/reporting/spring_dated_technical_observation_review.json',
                  'data/reporting/spring_dated_technical_observation_review.md',
                  'project/reviews/spring-dated-technical-observation-review-2026-07-31.md',
                  'project/state.json',
                  'project/STATE_SUMMARY.md',
              ],
          }
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python tools/dkb.py project-state --apply
          python tools/dkb.py project-state --check
          git diff --check

          rm .github/workflows/tmp-spring-electric100-singleton-foundation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data(spring): add Electric 100 singleton foundation'
          git push origin HEAD:agent/spring-electric100-singleton-foundation-20260731
