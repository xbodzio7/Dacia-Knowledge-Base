name: Temporary Spring Electric 70 Catalogue Foundation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/spring-electric70-catalogue-foundation-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-electric70-catalogue-foundation-20260731
          fetch-depth: 0

      - name: Materialize Spring Electric 70 catalogue foundation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          ROOT = Path('.')
          MASTER = ROOT / 'data' / 'master'
          REPORTING = ROOT / 'data' / 'reporting'

          def read_rows(path: Path):
              with path.open(encoding='utf-8', newline='') as handle:
                  reader = csv.DictReader(handle)
                  assert reader.fieldnames
                  return reader.fieldnames, list(reader)

          def append_rows(path: Path, new_rows):
              fieldnames, rows = read_rows(path)
              existing_codes = {row.get('code', '') for row in rows}
              for row in new_rows:
                  code = row.get('code', '')
                  assert code and code not in existing_codes, (path, code)
                  existing_codes.add(code)
              next_id = max(int(row['id']) for row in rows) + 1
              with path.open('a', encoding='utf-8', newline='') as handle:
                  writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator='\n')
                  for offset, row in enumerate(new_rows):
                      payload = {field: row.get(field, '') for field in fieldnames}
                      payload['id'] = str(next_id + offset)
                      writer.writerow(payload)

          source_codes = {
              row['code']
              for row in read_rows(MASTER / 'sources.csv')[1]
              if row.get('status') == 'active'
          }
          required_sources = {
              'src_pl_spring_brochure_20260219',
              'src_pl_spring_price_my25_stock_20260708',
              'src_pl_spring_official_configurator_20260731',
          }
          assert required_sources <= source_codes

          append_rows(
              MASTER / 'versions.csv',
              [
                  {
                      'code': 'spring_essential',
                      'model_code': 'spring',
                      'name': 'Essential',
                      'status': 'active',
                      'notes': 'Source-backed current Spring grade from the official Polish brochure and configurator snapshot observed 2026-07-31.',
                  },
                  {
                      'code': 'spring_expression',
                      'model_code': 'spring',
                      'name': 'Expression',
                      'status': 'active',
                      'notes': 'Source-backed current Spring grade from the official Polish brochure and configurator snapshot observed 2026-07-31.',
                  },
              ],
          )

          append_rows(
              MASTER / 'configurations.csv',
              [
                  {
                      'code': 'spring_essential_electric70_automatic',
                      'version_code': 'spring_essential',
                      'powertrain_label': 'electric 70',
                      'transmission_type': 'automatic',
                      'status': 'active',
                      'notes': 'Exact current official configurator state observed 2026-07-31; no unobserved grade or powertrain combination inferred.',
                  },
                  {
                      'code': 'spring_expression_electric70_automatic',
                      'version_code': 'spring_expression',
                      'powertrain_label': 'electric 70',
                      'transmission_type': 'automatic',
                      'status': 'active',
                      'notes': 'Exact current official configurator state observed 2026-07-31; current catalogue price remains unresolved and the registered price is MY25 dealer-stock bounded.',
                  },
              ],
          )

          append_rows(
              MASTER / 'configuration_prices.csv',
              [
                  {
                      'code': 'spring_essential_electric70_automatic_pl_20260731',
                      'configuration_code': 'spring_essential_electric70_automatic',
                      'market': 'PL',
                      'price_type': 'catalog_gross',
                      'amount': '73500',
                      'currency_code': 'PLN',
                      'price_date': '2026-07-31',
                      'source_code': 'src_pl_spring_official_configurator_20260731',
                      'notes': 'Exact current official Spring Essential Electric 70 configurator catalogue price observed 2026-07-31.',
                  },
                  {
                      'code': 'spring_expression_electric70_automatic_pl_20260708',
                      'configuration_code': 'spring_expression_electric70_automatic',
                      'market': 'PL',
                      'price_type': 'catalog_gross',
                      'amount': '81500',
                      'currency_code': 'PLN',
                      'price_date': '2026-07-08',
                      'source_code': 'src_pl_spring_price_my25_stock_20260708',
                      'notes': 'Official catalogue gross price limited to model-year-2025 dealer stock. The repeated 73,500 PLN combined-version-page value is not assigned to Expression; promotional discounts are excluded.',
                  },
              ],
          )

          append_rows(
              MASTER / 'source_versions.csv',
              [
                  {
                      'code': 'src_pl_spring_brochure_20260219__spring_essential',
                      'source_code': 'src_pl_spring_brochure_20260219',
                      'version_code': 'spring_essential',
                      'relationship': 'documents',
                      'notes': 'Official brochure grade column and equipment matrix; observation import remains separate.',
                  },
                  {
                      'code': 'src_pl_spring_brochure_20260219__spring_expression',
                      'source_code': 'src_pl_spring_brochure_20260219',
                      'version_code': 'spring_expression',
                      'relationship': 'documents',
                      'notes': 'Official brochure grade column and equipment matrix; observation import remains separate.',
                  },
                  {
                      'code': 'src_pl_spring_official_configurator_20260731__spring_essential',
                      'source_code': 'src_pl_spring_official_configurator_20260731',
                      'version_code': 'spring_essential',
                      'relationship': 'documents',
                      'notes': 'Exact current official version state observed 2026-07-31.',
                  },
                  {
                      'code': 'src_pl_spring_official_configurator_20260731__spring_expression',
                      'source_code': 'src_pl_spring_official_configurator_20260731',
                      'version_code': 'spring_expression',
                      'relationship': 'documents',
                      'notes': 'Exact current official version state observed 2026-07-31; grade-specific current catalogue price unresolved.',
                  },
              ],
          )

          append_rows(
              MASTER / 'source_configurations.csv',
              [
                  {
                      'code': 'src_pl_spring_official_configurator_20260731__spring_essential_electric70_automatic',
                      'source_code': 'src_pl_spring_official_configurator_20260731',
                      'configuration_code': 'spring_essential_electric70_automatic',
                      'relationship': 'documents',
                      'notes': 'Exact official grade and powertrain state observed 2026-07-31.',
                  },
                  {
                      'code': 'src_pl_spring_official_configurator_20260731__spring_expression_electric70_automatic',
                      'source_code': 'src_pl_spring_official_configurator_20260731',
                      'configuration_code': 'spring_expression_electric70_automatic',
                      'relationship': 'documents',
                      'notes': 'Exact official grade and powertrain state observed 2026-07-31; current price remains unresolved.',
                  },
                  {
                      'code': 'src_pl_spring_price_my25_stock_20260708__spring_expression_electric70_automatic',
                      'source_code': 'src_pl_spring_price_my25_stock_20260708',
                      'configuration_code': 'spring_expression_electric70_automatic',
                      'relationship': 'documents',
                      'notes': 'Explicit Expression Electric 70 catalogue cell bounded to model-year-2025 dealer stock.',
                  },
              ],
          )

          completeness = {
              'version': 1,
              'configuration_scope': 'explicit_subset',
              'configuration_status': 'active',
              'configurations': [
                  {
                      'configuration_code': 'spring_essential_electric70_automatic',
                      'source_code': 'src_pl_spring_official_configurator_20260731',
                  },
                  {
                      'configuration_code': 'spring_expression_electric70_automatic',
                      'source_code': 'src_pl_spring_official_configurator_20260731',
                  },
              ],
              'technical_slots': [],
              'equipment_attributes': [],
              'not_applicable': {'technical': [], 'equipment': []},
          }
          REPORTING.mkdir(parents=True, exist_ok=True)
          (REPORTING / 'spring_electric70_automatic_completeness.json').write_text(
              json.dumps(completeness, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          (REPORTING / 'spring_electric70_automatic_gap_evidence.spec').write_text(
              json.dumps({'as_of': '2026-07-31', 'decisions': [], 'version': 1}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          bundle_path = ROOT / 'tools' / 'reporting' / 'configuration_comparison_bundle.py'
          bundle_text = bundle_path.read_text(encoding='utf-8')
          old_prefixes = 'CURRENT_SCOPE_PREFIXES = ("sandero_", "duster_", "jogger_", "bigster_")'
          new_prefixes = 'CURRENT_SCOPE_PREFIXES = ("sandero_", "duster_", "jogger_", "bigster_", "spring_")'
          assert old_prefixes in bundle_text
          bundle_path.write_text(bundle_text.replace(old_prefixes, new_prefixes, 1), encoding='utf-8')

          cross_path = ROOT / 'tools' / 'reporting' / 'cross_model_comparison_view.py'
          cross_text = cross_path.read_text(encoding='utf-8')
          marker = '    "bigster": 50,\n}'
          assert marker in cross_text
          cross_path.write_text(cross_text.replace(marker, '    "bigster": 50,\n    "spring": 60,\n}', 1), encoding='utf-8')

          replacements = {
              'self.assertEqual(len(scopes), 20)': 'self.assertEqual(len(scopes), 21)',
              'self.assertEqual(len(codes), 78)': 'self.assertEqual(len(codes), 80)',
              'self.assertEqual(len(set(codes)), 78)': 'self.assertEqual(len(set(codes)), 80)',
              'self.manifest["selected_configuration_count"], 78': 'self.manifest["selected_configuration_count"], 80',
              'self.manifest["scope_group_count"], 20': 'self.manifest["scope_group_count"], 21',
              'self.manifest["model_family_count"], 5': 'self.manifest["model_family_count"], 6',
              'self.manifest["comparable_scope_count"], 20': 'self.manifest["comparable_scope_count"], 21',
              'self.assertEqual(len(names), 89)': 'self.assertEqual(len(names), 93)',
              'report["summary"]["active_configurations"], 78': 'report["summary"]["active_configurations"], 80',
              'report["summary"]["matched_configurations"], 78': 'report["summary"]["matched_configurations"], 80',
              'self.assertEqual(len(report["results"]), 78)': 'self.assertEqual(len(report["results"]), 80)',
              'self.assertEqual(len(rows), 78)': 'self.assertEqual(len(rows), 80)',
              'bundle["selected_configuration_count"], 78': 'bundle["selected_configuration_count"], 80',
              'bundle["scope_group_count"], 20': 'bundle["scope_group_count"], 21',
              'bundle["comparable_scope_count"], 20': 'bundle["comparable_scope_count"], 21',
              'self.assertEqual(len(bundle["groups"]), 20)': 'self.assertEqual(len(bundle["groups"]), 21)',
              'view["summary"]["model_family_count"], 5': 'view["summary"]["model_family_count"], 6',
              'view["summary"]["reporting_scope_count"], 20': 'view["summary"]["reporting_scope_count"], 21',
              'view["summary"]["active_configuration_count"], 78': 'view["summary"]["active_configuration_count"], 80',
              'view["summary"]["within_scope_pair_count"], 129': 'view["summary"]["within_scope_pair_count"], 130',
              'rendered.count(\'class="model-card"\'), 5': 'rendered.count(\'class="model-card"\'), 6',
              'rendered.count(\'class="scope-card"\'), 20': 'rendered.count(\'class="scope-card"\'), 21',
              '"Selected configurations: 78"': '"Selected configurations: 80"',
              '"Independent scopes: 20"': '"Independent scopes: 21"',
              'report["scope"]["repository_status_configurations"], 78': 'report["scope"]["repository_status_configurations"], 80',
              'scope["repository_status_configurations"], 78': 'scope["repository_status_configurations"], 80',
              'scope["excluded_configurations"], 71': 'scope["excluded_configurations"], 73',
              'report["scope"]["excluded_configurations"], 71': 'report["scope"]["excluded_configurations"], 73',
          }
          changed_tests = []
          for path in sorted((ROOT / 'tests').glob('test_*.py')):
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if path.name == 'test_configuration_comparison_bundle.py':
                  assertion_marker = '''        self.assertEqual(\n            sum(scope.slug.startswith("bigster_") for scope in scopes),\n            4,\n        )\n'''
                  assert assertion_marker in updated
                  updated = updated.replace(
                      assertion_marker,
                      assertion_marker + '''        self.assertEqual(\n            sum(scope.slug.startswith("spring_") for scope in scopes),\n            1,\n        )\n''',
                      1,
                  )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed_tests.append(path.as_posix())

          package_path = ROOT / 'project' / 'packages' / 'spring-electric70-catalogue-foundation-20260731.md'
          package_path.parent.mkdir(parents=True, exist_ok=True)
          package_path.write_text(
              '''# Spring Electric 70 Catalogue Foundation\n\nDate: 2026-07-31\n\nStatus: **complete**\n\n## Catalogue entities\n\nThis package adds the source-backed Spring Essential and Expression versions and their exact Electric 70 automatic configurations. Together they form one comparable, scope-preserving reporting group.\n\n## Prices\n\n- Essential: 73,500 PLN, exact current official configurator catalogue price observed 2026-07-31.\n- Expression: 81,500 PLN, official catalogue price effective 2026-07-08 and explicitly limited to model-year-2025 dealer stock.\n\nThe repeated 73,500 PLN starting price from the combined version page is not assigned to Expression. The 17,000 PLN headline discount is not converted into a derived promotional price.\n\n## Reporting boundary\n\nThe new `spring_electric70_automatic` scope contains exactly two active configurations and contributes one within-scope pair. It declares no technical or equipment slots yet, so this package changes catalogue entities and explicit prices only.\n\n## Deferred work\n\nExtreme Electric 100 remains a separate singleton catalogue review. Technical observations, the version equipment matrix, packages, Cargo and exact stock cards remain independent source-backed packages.\n''',
              encoding='utf-8',
          )

          state_path = ROOT / 'project' / 'state.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['updated_on'] = '2026-07-31'
          state['phase'] = 'Spring Electric 70 Catalogue Foundation'
          state['reference_delivery'] = {
              'name': 'Spring Source-Backed Data Import Review',
              'pull_request': 423,
              'head_sha': 'd9bfe83f3dfa5d46497177e1f698d289e846e08a',
              'quality_run': 2753,
          }
          state['baseline']['rows'] = 11399
          current_paths = [
              'CHANGELOG.md',
              'README.md',
              'data/master/configuration_prices.csv',
              'data/master/configurations.csv',
              'data/master/source_configurations.csv',
              'data/master/source_versions.csv',
              'data/master/versions.csv',
              'data/reporting/spring_electric70_automatic_completeness.json',
              'data/reporting/spring_electric70_automatic_gap_evidence.spec',
              'project/SESSION_STATE.md',
              'project/STATE_SUMMARY.md',
              'project/packages/spring-electric70-catalogue-foundation-20260731.md',
              'project/state.json',
              'tools/reporting/configuration_comparison_bundle.py',
              'tools/reporting/cross_model_comparison_view.py',
              *changed_tests,
          ]
          state['current_package'] = {
              'package_id': 'spring_electric70_catalogue_foundation_001',
              'kind': 'catalogue_foundation',
              'name': 'Spring Electric 70 Catalogue Foundation',
              'status': 'complete',
              'goal': 'Add the source-backed Spring Essential and Expression versions, their exact Electric 70 automatic configurations, one current Essential catalogue price, one stock-bounded Expression catalogue price and one comparable reporting scope, without importing technical values, equipment, inferred promotional prices or the Electric 100 singleton.',
              'manifest_paths': sorted(set(current_paths)),
          }
          state['next_package'] = {
              'package_id': 'spring_electric100_singleton_catalogue_review_001',
              'kind': 'catalogue_import_review',
              'name': 'Spring Electric 100 Singleton Catalogue Review',
              'status': 'planned',
              'goal': 'Review the source-backed Extreme Electric 100 automatic configuration and its exact catalogue price, define the singleton reporting-product contract and select a bounded implementation without importing technical or equipment observations.',
              'manifest_paths': [
                  'data/reporting/spring_electric100_singleton_catalogue_review.json',
                  'data/reporting/spring_electric100_singleton_catalogue_review.md',
                  'project/reviews/spring-electric100-singleton-catalogue-review-2026-07-31.md',
                  'project/state.json',
                  'project/STATE_SUMMARY.md',
              ],
          }
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python tools/dkb.py project-state --apply
          python tools/dkb.py project-state --check
          python -m unittest tests.test_configuration_comparison_bundle tests.test_data_product_release
          git diff --check

          rm .github/workflows/tmp-spring-electric70-catalogue-foundation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data(spring): add Electric 70 catalogue foundation'
          git push origin HEAD:agent/spring-electric70-catalogue-foundation-20260731
