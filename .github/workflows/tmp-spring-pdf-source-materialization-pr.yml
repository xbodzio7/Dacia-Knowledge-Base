name: Temporary Spring PDF Source Materialization PR Trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/spring-official-pdf-source-registration-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-official-pdf-source-registration-20260731
          fetch-depth: 0

      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Replay corrected materializer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          import yaml

          source = Path('.github/workflows/tmp-spring-pdf-source-materialization.yml')
          trigger = Path('.github/workflows/tmp-spring-pdf-source-materialization-pr.yml')
          workflow = yaml.safe_load(source.read_text(encoding='utf-8'))
          steps = workflow['jobs']['materialize']['steps']
          env = os.environ.copy()

          for step in steps:
              name = step.get('name', '')
              script = step.get('run')
              if not script:
                  continue

              if name == 'Verify package state':
                  state_path = Path('project/state.json')
                  state = json.loads(state_path.read_text(encoding='utf-8'))
                  manifest = state['current_package']['manifest_paths']
                  for path in ('CHANGELOG.md', 'README.md', 'project/SESSION_STATE.md'):
                      if path not in manifest:
                          manifest.append(path)
                  state_path.write_text(
                      json.dumps(state, ensure_ascii=False, indent=2) + '\n',
                      encoding='utf-8',
                  )
                  script = '''
                  set -euo pipefail
                  python tools/dkb.py project-state --apply
                  python tools/dkb.py project-state --check
                  git diff --check
                  '''

              if name == 'Commit materialized package and remove temporary workflow':
                  trigger.unlink()

              subprocess.run(
                  ['bash', '-euo', 'pipefail', '-c', script],
                  check=True,
                  env=env,
              )

              env_file = Path(env['GITHUB_ENV'])
              if env_file.exists():
                  for line in env_file.read_text(encoding='utf-8').splitlines():
                      if '=' in line:
                          key, value = line.split('=', 1)
                          env[key] = value
          PY
