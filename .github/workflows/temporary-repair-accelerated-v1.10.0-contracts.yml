name: Temporary Repair Accelerated v1.10.0 Contracts

on:
  push:
    branches:
      - agent/accelerated-v1.10.0-release-20260801
    paths:
      - tools/repair_accelerated_v1_10_0_historical_contracts_20260801.py
      - .github/workflows/temporary-repair-accelerated-v1.10.0-contracts.yml

permissions:
  contents: write

concurrency:
  group: repair-accelerated-v1-10-0-contracts
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/accelerated-v1.10.0-release-20260801
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Apply batched historical contract repair
        run: |
          python tools/repair_accelerated_v1_10_0_historical_contracts_20260801.py
          python tools/dkb.py project-state --apply

      - name: Verify affected contracts
        run: |
          python -m unittest -q \
            tests.test_sandero_stepway_essential_source_gap_20260626 \
            tests.test_sandero_stepway_expression_auto_source_gap_20260626 \
            tests.test_sandero_stepway_expression_source_gap_20260626 \
            tests.test_sandero_stepway_extreme_auto_source_gap_20260626 \
            tests.test_sandero_stepway_extreme_source_gap_20260626 \
            tests.test_data_products_v1_10_0_release_contract
          python tools/dkb.py project-state --check
          python -m compileall -q tools tests

      - name: Commit stable non-workflow repair
        run: |
          rm tools/repair_accelerated_v1_10_0_historical_contracts_20260801.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/**'
          git commit -m "fix(contracts): decouple completed source packages from current state"
          git push origin HEAD:agent/accelerated-v1.10.0-release-20260801
