name: AI archive all current Dacia configurator PDFs v2

on:
  push:
    branches:
      - ai/dacia-configurator-pdf-archive-20260809
    paths:
      - .github/workflows/ai-dacia-configurator-pdf-archive-v2.yml

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser and PDF tooling
        run: python -m pip install --quiet selenium pypdf
      - name: Download and validate all current configurator PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, re, shutil, time, unicodedata
          from pathlib import Path
          from pypdf import PdfReader
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          OBS_DATE='2026-08-09'
          EXPECTED_COUNT=70
          pages=[
            ('sandero',None,'https://www.dacia.pl/samochody/sandero-miejskie/konfigurator.html'),
            ('sandero_stepway',None,'https://www.dacia.pl/samochody/sandero-stepway/konfigurator.html'),
            ('jogger_5',5,'https://www.dacia.pl/samochody/jogger-hybydowy/konfigurator.html'),
            ('jogger_7',7,'https://www.dacia.pl/samochody/jogger-7/konfigurator.html'),
            ('duster',None,'https://www.dacia.pl/hybrydy-i-elektryczne/duster-suv/konfigurator.html'),
            ('bigster',None,'https://www.dacia.pl/hybrydy-i-elektryczne/bigster-suv/konfigurator.html'),
            ('spring',None,'https://www.dacia.pl/hybrydy-i-elektryczne/spring-miejski/konfigurator.html'),
          ]
          root=Path.cwd()
          archive_root=root/'PDF'/'Konfiguratory'/OBS_DATE
          if archive_root.exists(): shutil.rmtree(archive_root)
          archive_root.mkdir(parents=True)
          download_dir=Path('/tmp/dacia-configurator-downloads').resolve()
          if download_dir.exists(): shutil.rmtree(download_dir)
          download_dir.mkdir(parents=True)

          def norm(s):
            s=unicodedata.normalize('NFKC',s or '').replace('\u00a0',' ')
            return re.sub(r'\s+',' ',s).strip().casefold()

          with (root/'data/master/configurations.csv').open(encoding='utf-8',newline='') as f:
            configs=[r for r in csv.DictReader(f) if r['status']=='active']

          def canonical_match(family,seat_count,grade,engine):
            g=norm(grade)
            if family=='sandero_stepway':
              g=g.removeprefix('stepway '); version=f'sandero_stepway_iii_{g.replace(" ","_")}'
            elif family=='sandero': version=f'sandero_iii_{g.replace(" ","_")}'
            elif family.startswith('jogger_'): version=f'jogger_{g.replace(" ","_")}'
            elif family=='duster': version=f'duster_iii_{g.replace(" ","_")}'
            elif family=='bigster': version=f'bigster_{g.replace(" ","_")}'
            elif family=='spring': version=f'spring_{g.replace(" ","_")}'
            else: raise AssertionError(family)
            e=re.sub(r'\s+auto$','',engine,flags=re.I).strip(); el=norm(e)
            if family in {'duster','bigster'} and el in {'eco-g 120','mild hybrid 140','mild hybrid-g 140','hybrid 155'}:
              powertrain=e+' 4x2'
            else: powertrain=e
            automatic=(norm(engine).endswith(' auto') or el.startswith('hybrid 155') or el.startswith('hybrid-g 150') or family=='spring')
            transmission='automatic' if automatic else 'manual'
            matches=[r for r in configs if norm(r['version_code'])==norm(version) and norm(r['powertrain_label'])==norm(powertrain) and r['transmission_type']==transmission]
            if family.startswith('jogger_'):
              needle=f'_{seat_count}seat_'; matches=[r for r in matches if needle in r['code']]
            if len(matches)!=1:
              raise RuntimeError(f'Canonical mapping not unique: {family=} {seat_count=} {grade=} {engine=} {[(r["code"],r["powertrain_label"],r["transmission_type"]) for r in matches]}')
            return matches[0]

          opts=Options(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--window-size=1600,1200'); opts.add_argument('--lang=pl-PL')
          opts.add_experimental_option('prefs',{'download.default_directory':str(download_dir),'download.prompt_for_download':False,'download.directory_upgrade':True,'plugins.always_open_pdf_externally':True})
          driver=webdriver.Chrome(options=opts)
          driver.execute_cdp_cmd('Page.setDownloadBehavior',{'behavior':'allow','downloadPath':str(download_dir)})

          def accept_cookies():
            for txt in ['Akceptuj wszystkie','Akceptuj','Zaakceptuj wszystkie','Zgadzam się']:
              try:
                for el in driver.find_elements(By.XPATH,f"//*[self::button or self::a][contains(normalize-space(.), '{txt}')]"):
                  driver.execute_script('arguments[0].click()',el); time.sleep(1); return
              except Exception: pass

          def wait_for_selectors(name='config-grades',timeout=60):
            WebDriverWait(driver,timeout).until(lambda d: len(d.find_elements(By.CSS_SELECTOR,f'input[type="radio"][name="{name}"]'))>0)

          def load_configurator(family,url):
            last=None
            for attempt in range(1,4):
              try:
                print(f'OPEN {family} attempt {attempt}: {url}',flush=True)
                driver.get(url); time.sleep(3); accept_cookies(); wait_for_selectors('config-grades',60)
                print('  ready:',driver.title,flush=True); return
              except Exception as exc:
                last=exc; print(f'  load attempt {attempt} failed: {exc!r}',flush=True)
                try: driver.delete_all_cookies()
                except Exception: pass
                time.sleep(3*attempt)
            raise RuntimeError(f'Configurator did not expose grade selectors for {family}: {last!r}')

          def radios(name):
            return driver.execute_script(r'''
              const name=arguments[0];
              return [...document.querySelectorAll(`input[type="radio"][name="${CSS.escape(name)}"]`)]
                .map(el=>{const id=el.id||''; let label=''; if(id){const l=document.querySelector(`label[for="${CSS.escape(id)}"]`); if(l) label=(l.innerText||'').trim().replace(/\s+/g,' ');} return {id,value:el.value,label,checked:el.checked,disabled:el.disabled};})
                .filter(x=>!x.disabled && x.id);
            ''',name)

          def click_radio(radio_id):
            WebDriverWait(driver,45).until(lambda d: len(d.find_elements(By.ID,radio_id))>0)
            el=driver.find_element(By.ID,radio_id); driver.execute_script('arguments[0].click()',el)
            WebDriverWait(driver,45).until(lambda d: d.find_element(By.ID,radio_id).is_selected())
            time.sleep(2.5)

          def download_pdf():
            for p in download_dir.iterdir():
              if p.is_file(): p.unlink()
            WebDriverWait(driver,45).until(lambda d: d.execute_script(r'''return [...document.querySelectorAll('button,[role="button"]')].some(el=>((el.innerText||el.getAttribute('aria-label')||'').toLowerCase().includes('pobierz pdf')));'''))
            clicked=driver.execute_script(r'''
              const els=[...document.querySelectorAll('button,[role="button"]')].filter(el=>((el.innerText||el.getAttribute('aria-label')||'').toLowerCase().includes('pobierz pdf')));
              if(!els.length) return false; const target=els.find(el=>el.getClientRects().length && getComputedStyle(el).visibility!=='hidden')||els[0]; target.scrollIntoView({block:'center'}); target.click(); return true;
            ''')
            if not clicked: raise RuntimeError('Pobierz PDF click failed')
            deadline=time.time()+70; last_size=-1; stable=0
            while time.time()<deadline:
              partial=list(download_dir.glob('*.crdownload')); candidates=list(download_dir.glob('*.pdf'))
              if candidates and not partial:
                pdf=max(candidates,key=lambda p:p.stat().st_mtime); size=pdf.stat().st_size
                if size>10000:
                  stable=stable+1 if size==last_size else 0; last_size=size
                  if stable>=1: return pdf
              time.sleep(1)
            raise RuntimeError('Native PDF download did not complete')

          manifest={'source_kind':'dacia_pl_current_configurator_native_pdf_archive','observed_date':OBS_DATE,'origin':'https://www.dacia.pl/konfiguruj.html','native_exports_only':True,'expected_configuration_count':EXPECTED_COUNT,'documents':[]}
          try:
            for family,seat_count,url in pages:
              load_configurator(family,url)
              grade_radios=radios('config-grades')
              for grade in grade_radios:
                click_radio(grade['id']); wait_for_selectors('config-engines',45); engine_radios=radios('config-engines')
                if not engine_radios: raise RuntimeError(f'No engines for {family}/{grade["value"]}')
                for engine in engine_radios:
                  click_radio(engine['id']); canonical=canonical_match(family,seat_count,grade['value'],engine['value'])
                  print('  PDF',canonical['code'],'|',grade['value'],'|',engine['value'],flush=True)
                  downloaded=download_pdf(); raw=downloaded.read_bytes()
                  if not raw.startswith(b'%PDF-'): raise RuntimeError(f'Not PDF: {downloaded}')
                  reader=PdfReader(str(downloaded)); text='\n'.join((p.extract_text() or '') for p in reader.pages[:3])
                  if not reader.pages: raise RuntimeError(f'Zero-page PDF: {downloaded}')
                  if norm(grade['value'].replace('stepway ','')) not in norm(text): raise RuntimeError(f'Grade not confirmed in {canonical["code"]}')
                  m=re.search(r'kod konfiguracji:\s*([A-Z0-9]{6})',text,flags=re.I)
                  if not m: raise RuntimeError(f'Dacia configuration code missing in {canonical["code"]}')
                  dacia_code=m.group(1).upper(); family_dir=archive_root/family; family_dir.mkdir(parents=True,exist_ok=True); dest=family_dir/f'{canonical["code"]}.pdf'; shutil.copyfile(downloaded,dest)
                  manifest['documents'].append({'family':family,'seat_count':seat_count,'grade':grade['value'],'engine':engine['value'],'configuration_code':canonical['code'],'dacia_configuration_code':dacia_code,'source_url':driver.current_url,'original_filename':downloaded.name,'file_path':dest.relative_to(root).as_posix(),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'pages':len(reader.pages)})
          finally:
            driver.quit()

          docs=manifest['documents']; counts={}
          for d in docs: counts[d['family']]=counts.get(d['family'],0)+1
          print('CAPTURED',len(docs),counts,flush=True)
          if len(docs)!=EXPECTED_COUNT: raise RuntimeError(f'Expected {EXPECTED_COUNT}, captured {len(docs)}: {counts}')
          codes=[d['configuration_code'] for d in docs]; hashes=[d['sha256'] for d in docs]; dacia_codes=[d['dacia_configuration_code'] for d in docs]
          if len(set(codes))!=70: raise RuntimeError('Canonical configuration duplication detected')
          if len(set(hashes))!=70: raise RuntimeError('Distinct selections produced identical PDF binaries')
          if len(set(dacia_codes))!=70: raise RuntimeError('Distinct selections produced duplicate Dacia configuration codes')
          manifest['configuration_count']=70; manifest['family_counts']=counts; manifest['total_bytes']=sum(d['bytes'] for d in docs); manifest['total_pages']=sum(d['pages'] for d in docs)
          Path('project/sources/dacia-pl-configurator-native-pdf-archive-20260809.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          sources_path=Path('data/master/sources.csv'); rels_path=Path('data/master/source_configurations.csv')
          with sources_path.open(encoding='utf-8',newline='') as f: source_rows=list(csv.DictReader(f)); source_fields=list(source_rows[0].keys())
          with rels_path.open(encoding='utf-8',newline='') as f: rel_rows=list(csv.DictReader(f)); rel_fields=list(rel_rows[0].keys())
          prefix='src_pl_cfgpdf_'; old={r['code'] for r in source_rows if r['code'].startswith(prefix) and r['code'].endswith('_20260809')}; source_rows=[r for r in source_rows if r['code'] not in old]; rel_rows=[r for r in rel_rows if r['source_code'] not in old]
          next_source=max(int(r['id']) for r in source_rows)+1; next_rel=max(int(r['id']) for r in rel_rows)+1
          for d in sorted(docs,key=lambda x:x['configuration_code']):
            sc=f"{prefix}{d['configuration_code']}_20260809"
            source_rows.append({'id':str(next_source),'code':sc,'source_type':'configuration_pdf','title':f"Dacia configurator {d['configuration_code']} — {d['grade']} {d['engine']}",'publisher':'Dacia','market':'PL','document_date':OBS_DATE,'external_reference':d['dacia_configuration_code'],'file_path':d['file_path'],'sha256':d['sha256'],'status':'active','notes':'Native PDF generated by the official current Dacia Poland configurator; binary archived unchanged, file renamed only to the canonical configuration code.'})
            rel_rows.append({'id':str(next_rel),'source_code':sc,'configuration_code':d['configuration_code'],'relationship':'documents','notes':'Exact official configurator PDF generated for this configuration on 2026-08-09.'}); next_source+=1; next_rel+=1
          with sources_path.open('w',encoding='utf-8',newline='') as f: w=csv.DictWriter(f,fieldnames=source_fields,lineterminator='\n'); w.writeheader(); w.writerows(source_rows)
          with rels_path.open('w',encoding='utf-8',newline='') as f: w=csv.DictWriter(f,fieldnames=rel_fields,lineterminator='\n'); w.writeheader(); w.writerows(rel_rows)
          print(json.dumps({'captured':70,'families':counts,'total_bytes':manifest['total_bytes'],'total_pages':manifest['total_pages'],'source_rows':len(source_rows),'relations':len(rel_rows)},ensure_ascii=False,indent=2),flush=True)
          PY
      - name: Verify 70 native PDFs and exact source relations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          from pypdf import PdfReader
          m=json.loads(Path('project/sources/dacia-pl-configurator-native-pdf-archive-20260809.json').read_text(encoding='utf-8')); assert m['configuration_count']==70 and len(m['documents'])==70
          for d in m['documents']:
            p=Path(d['file_path']); raw=p.read_bytes(); assert raw.startswith(b'%PDF-'); assert len(raw)==d['bytes']; assert hashlib.sha256(raw).hexdigest()==d['sha256']; assert len(PdfReader(str(p)).pages)==d['pages']
          with open('data/master/sources.csv',encoding='utf-8',newline='') as f: sources=list(csv.DictReader(f))
          with open('data/master/source_configurations.csv',encoding='utf-8',newline='') as f: rels=list(csv.DictReader(f))
          codes={r['code'] for r in sources if r['code'].startswith('src_pl_cfgpdf_') and r['code'].endswith('_20260809')}; assert len(codes)==70; assert sum(1 for r in rels if r['source_code'] in codes)==70
          print('Archive verification: PASS — 70 native PDFs / 70 source rows / 70 exact relations')
          PY
      - name: Commit native PDF archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PDF/Konfiguratory/2026-08-09 project/sources/dacia-pl-configurator-native-pdf-archive-20260809.json data/master/sources.csv data/master/source_configurations.csv
          git commit -m "data(source): archive all current Dacia configurator PDFs"
          git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
