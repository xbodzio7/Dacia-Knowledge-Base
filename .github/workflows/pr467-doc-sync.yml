name: PR 467 Documentation Sync

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.number == 467
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python tools/dkb.py documentation-baseline --apply
      - name: Commit generated documentation
        run: |
          if git diff --quiet -- CHANGELOG.md README.md project/ROADMAP.md project/SESSION_STATE.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md project/ROADMAP.md project/SESSION_STATE.md
          git commit -m "docs(state): synchronize documentation baseline"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
