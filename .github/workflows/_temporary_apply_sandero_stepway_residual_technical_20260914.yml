name: Temporary Apply Sandero Stepway Residual Technical

on:
  push:
    branches:
      - agent/sandero-stepway-full-modal-residual-technical-materialization-001

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply bounded materialization
        run: python tools/materialize_sandero_stepway_full_modal_residual_technical_20260914.py --apply

      - name: Commit data and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master/configuration_attribute_values.csv
          git rm .github/workflows/_temporary_apply_sandero_stepway_residual_technical_20260914.yml
          git commit -m "data(sandero): materialize residual full-modal technical values"
          git push origin HEAD:agent/sandero-stepway-full-modal-residual-technical-materialization-001
