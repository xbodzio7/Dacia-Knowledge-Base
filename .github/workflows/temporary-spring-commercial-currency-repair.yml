name: Temporary Spring Commercial Currency Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-spring-commercial-currency-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'agent/spring-commercial-packages-and-charging-options-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Repair required-currency contract and materialize
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          importer_path = Path("tools/import_spring_commercial_packages.py")
          importer = importer_path.read_text(encoding="utf-8")
          old = '''        if row["amount"] or row["currency_code"]:
              raise ContractError(f"brochure-stated blank price was not preserved: {row['code']}")'''
          new = '''        if row["amount"] or row["currency_code"] != "PLN":
              raise ContractError(
                  f"Spring mapping must preserve a blank amount and required PLN currency: {row['code']}"
              )'''
          if old not in importer:
              raise SystemExit("Importer blank-price validation anchor not found")
          importer = importer.replace(old, new, 1)
          old = '''            "amount": "",
              "currency_code": "",
              "price_date": "",'''
          new = '''            "amount": "",
              "currency_code": row["currency_code"],
              "price_date": "",'''
          if old not in importer:
              raise SystemExit("Importer generated currency anchor not found")
          importer_path.write_text(importer.replace(old, new, 1), encoding="utf-8")

          spring_test_path = Path("tests/test_spring_commercial_packages.py")
          spring_test = spring_test_path.read_text(encoding="utf-8")
          old = 'self.assertTrue(all(not row["amount"] and not row["currency_code"] for row in mappings))'
          new = 'self.assertTrue(all(not row["amount"] and row["currency_code"] == "PLN" for row in mappings))'
          if old not in spring_test:
              raise SystemExit("Spring test currency anchor not found")
          spring_test_path.write_text(spring_test.replace(old, new, 1), encoding="utf-8")

          aggregate_path = Path("tests/test_commercial_items_20260703.py")
          aggregate = aggregate_path.read_text(encoding="utf-8")
          old = 'self.assertEqual({row["currency_code"] for row in self.mappings}, {"", "PLN"})'
          new = 'self.assertEqual({row["currency_code"] for row in self.mappings}, {"PLN"})'
          if old not in aggregate:
              raise SystemExit("Aggregate currency anchor not found")
          aggregate_path.write_text(aggregate.replace(old, new, 1), encoding="utf-8")

          package_path = Path("project/packages/spring-commercial-packages-and-charging-options-20260731.md")
          package = package_path.read_text(encoding="utf-8")
          old = "Therefore `amount`, `currency_code` and `price_date` remain blank. No zero price, estimated price, configurator price or price transferred from another document is introduced."
          new = "Therefore `amount` and `price_date` remain blank. `currency_code` is `PLN` only because the commercial mapping schema requires a valid currency reference; it does not create a price. No zero price, estimated price, configurator price or price transferred from another document is introduced."
          if old not in package:
              raise SystemExit("Package price-boundary anchor not found")
          package_path.write_text(package.replace(old, new, 1), encoding="utf-8")
          PY

          python tools/import_spring_commercial_packages.py --apply

          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          manifest = sorted([
              "CHANGELOG.md",
              "README.md",
              "data/imports/spring_commercial_item_attributes_20260219.csv",
              "data/imports/spring_commercial_item_configurations_20260219.csv",
              "data/imports/spring_commercial_items_20260219.csv",
              "data/master/commercial_item_attributes.csv",
              "data/master/commercial_item_configurations.csv",
              "data/master/commercial_items.csv",
              "project/ROADMAP.md",
              "project/SESSION_STATE.md",
              "project/STATE_SUMMARY.md",
              "project/packages/spring-commercial-packages-and-charging-options-20260731.md",
              "project/state.json",
              "tests/test_commercial_items_20260703.py",
              "tests/test_spring_commercial_packages.py",
              "tools/import_spring_commercial_packages.py",
          ])
          state_path = Path("project/state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          state["phase"] = "Spring Commercial Packages and Charging Options"
          state["current_package"] = {
              "package_id": "spring_commercial_packages_and_charging_options_001",
              "kind": "commercial_catalog_import",
              "name": "Spring Commercial Packages and Charging Options",
              "status": "complete",
              "goal": "Import brochure-bounded applicability and membership for Pakiet Techno, the standalone Expression DC 40 kW option, Pakiet Power, Pakiet City and the Type 2 charging-cable option across the three exact existing Spring configurations, preserving blank amounts because the brochure states no prices.",
              "manifest_paths": manifest,
          }
          state["next_package"] = {
              "package_id": "spring_exterior_colour_price_options_001",
              "kind": "commercial_catalog_import",
              "name": "Spring Exterior Colour Price Options",
              "status": "planned",
              "goal": "Import exact source-bounded Spring exterior-colour option status and prices for the existing configurations, separating metallic and non-metallic colours and preserving every grade, model-year and campaign boundary.",
              "manifest_paths": [
                  "CHANGELOG.md",
                  "README.md",
                  "data/imports/spring_exterior_colour_options_20260219.csv",
                  "data/master/commercial_items.csv",
                  "data/master/commercial_item_attributes.csv",
                  "data/master/commercial_item_configurations.csv",
                  "project/STATE_SUMMARY.md",
                  "project/packages/spring-exterior-colour-price-options-20260731.md",
                  "project/state.json",
                  "tests/test_spring_exterior_colour_options.py",
                  "tools/import_spring_exterior_colour_options.py",
              ],
          }
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          anchor = (
              "Pakiety handlowe, przewód typu\n"
              "2, kolory, dane techniczne, Cargo oraz elementy bez bezpiecznego mapowania\n"
              "pozostają poza tym pakietem.\n"
          )
          addition = anchor + (
              "\nOsobny import handlowy stron 13-15 rejestruje pięć pozycji Spring: przewód\n"
              "ładowania Type 2 dla wszystkich trzech wersji, Pakiet Techno i samodzielną\n"
              "opcję ładowania DC 40 kW dla Expression oraz Pakiety Power i City dla\n"
              "Extreme. Obejmuje 18 powiązań z istniejącymi atrybutami i siedem dokładnych\n"
              "mapowań do obecnych konfiguracji. Broszura nie podaje kwot, dlatego kwoty\n"
              "i daty cen pozostają puste; techniczna waluta `PLN` spełnia wymagany klucz\n"
              "schematu i nie tworzy ceny. Nie dodano modeli, wersji ani konfiguracji.\n"
          )
          if addition not in readme:
              if anchor not in readme:
                  raise SystemExit("Spring README anchor not found")
              readme_path.write_text(readme.replace(anchor, addition, 1), encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "### Added\n\n"
          bullet = (
              "* Added five source-bounded Spring commercial items from brochure pages 13-15: the Type 2 charging cable for all three existing grades, Pakiet Techno and the standalone DC 40 kW option for Expression, plus Pakiet Power and Pakiet City for Extreme, with 18 exact equipment memberships, seven optional configuration mappings, deliberately blank amounts and dates, schema-required PLN currency references and no new models, versions or configurations.\n"
          )
          if bullet not in changelog:
              if marker not in changelog:
                  raise SystemExit("CHANGELOG Added marker not found")
              changelog_path.write_text(changelog.replace(marker, marker + bullet, 1), encoding="utf-8")
          PY

          python tools/dkb.py project-state --apply

      - name: Verify repaired package
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_spring_commercial_packages tests.test_commercial_items_20260703 -v
          python tools/import_spring_commercial_packages.py --check
          python tools/validate_dkb.py
          python tools/dkb.py project-state --check

      - name: Commit final package and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- \
            .github/workflows/temporary-spring-package-extraction.yml \
            .github/workflows/temporary-spring-commercial-materializer.yml \
            .github/workflows/temporary-spring-commercial-currency-repair.yml
          git add -- \
            CHANGELOG.md README.md \
            data/imports/spring_commercial_item_attributes_20260219.csv \
            data/imports/spring_commercial_item_configurations_20260219.csv \
            data/imports/spring_commercial_items_20260219.csv \
            data/master/commercial_item_attributes.csv \
            data/master/commercial_item_configurations.csv \
            data/master/commercial_items.csv \
            project/ROADMAP.md project/SESSION_STATE.md project/STATE_SUMMARY.md \
            project/packages/spring-commercial-packages-and-charging-options-20260731.md \
            project/state.json \
            tests/test_commercial_items_20260703.py tests/test_spring_commercial_packages.py \
            tools/import_spring_commercial_packages.py
          git commit -m "feat(data): import Spring commercial packages and charging options"
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          expected = sorted(json.loads(Path("project/state.json").read_text(encoding="utf-8"))["current_package"]["manifest_paths"])
          actual = sorted(line for line in subprocess.check_output(["git", "diff", "--name-only", "origin/main...HEAD"], text=True).splitlines() if line)
          if actual != expected:
              raise SystemExit(f"Final manifest mismatch:\nexpected={expected!r}\nactual={actual!r}")
          print(f"Final package manifest verified: {len(actual)} paths.")
          PY
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
