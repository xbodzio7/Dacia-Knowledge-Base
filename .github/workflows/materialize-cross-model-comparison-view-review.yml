name: Materialize Cross-Model Comparison View Review

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/materialize-cross-model-comparison-view-review.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/cross-model-comparison-view-review
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install PDF backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Synchronize and verify review
        shell: bash
        run: |
          set +e
          log=.github/cross-model-comparison-view-review.log
          : > "$log"
          status=0

          python - >> "$log" 2>&1 <<'PY' || status=$?
          from pathlib import Path

          verifier = Path("tools/review_data_products_v1_7_0_release_preparation_20260726.py")
          text = verifier.read_text(encoding="utf-8")
          marker = "    state = load_json(STATE)\n"
          start = text.find(marker)
          end_marker = '    ensure(state.get("baseline", {}).get("rows") == 9688, "master row baseline changed")\n'
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("v1.7.0 verifier state block is missing")
          replacement = '''    state = load_json(STATE)
          ensure(isinstance(state.get("phase"), str) and state["phase"], "project phase is missing")
          current = state.get("current_package")
          ensure(isinstance(current, dict), "current package is missing")
          ensure(isinstance(current.get("name"), str) and current["name"], "current package name is missing")
          ensure(current.get("status") in {"planned", "active", "blocked", "complete"}, "current package status differs")
          next_package = state.get("next_package")
          ensure(isinstance(next_package, dict), "next package is missing")
          ensure(isinstance(next_package.get("name"), str) and next_package["name"], "next package name is missing")
          '''
          text = text[:start] + replacement + text[end:]
          verifier.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_data_products_v1_7_0_release_preparation.py")
          test_text = test_path.read_text(encoding="utf-8")
          function_marker = "    def test_project_state_advances_after_release_preparation(self) -> None:\n"
          function_start = test_text.find(function_marker)
          function_end = test_text.find('\n\nif __name__ == "__main__":', function_start)
          if function_start < 0 or function_end < 0:
              raise SystemExit("v1.7.0 historical state test is missing")
          function = '''    def test_project_state_preserves_published_release_baseline(self) -> None:
              state = json.loads(STATE.read_text(encoding="utf-8"))
              self.assertTrue(state["phase"])
              self.assertTrue(state["current_package"]["name"])
              self.assertIn(
                  state["current_package"]["status"],
                  {"planned", "active", "blocked", "complete"},
              )
              self.assertTrue(state["next_package"]["name"])
              self.assertGreaterEqual(state["baseline"]["tests"], 971)
              self.assertGreaterEqual(state["baseline"]["rows"], 9688)
              self.assertGreaterEqual(state["baseline"]["configuration_values"], 2949)
              self.assertGreaterEqual(state["baseline"]["configuration_value_ranges"], 244)
              self.assertGreaterEqual(state["baseline"]["attributes"], 385)
          '''
          test_text = test_text[:function_start] + function + test_text[function_end:]
          test_path.write_text(test_text, encoding="utf-8")
          print("PASS: v1.7.0 publication contracts normalized for later packages")
          PY

          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/review_cross_model_comparison_view_20260726.py --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest tests.test_cross_model_comparison_view_review >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py validate >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> "$log" 2>&1 || status=$?
          fi

          echo "exit_status=$status" >> "$log"
          cat "$log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$log" README.md CHANGELOG.md project/ROADMAP.md \
            project/SESSION_STATE.md project/STATE_SUMMARY.md project/state.json \
            tools/review_data_products_v1_7_0_release_preparation_20260726.py \
            tests/test_data_products_v1_7_0_release_preparation.py
          if ! git diff --cached --quiet; then
            git commit -m 'docs(report): materialize cross-model view review'
            git push origin HEAD:agent/cross-model-comparison-view-review
          fi
          exit "$status"
