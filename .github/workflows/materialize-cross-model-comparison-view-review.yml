name: Materialize Cross-Model Comparison View Review

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/materialize-cross-model-comparison-view-review.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/cross-model-comparison-view-review
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install PDF backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Synchronize and verify review
        shell: bash
        run: |
          set +e
          log=.github/cross-model-comparison-view-review.log
          : > "$log"
          status=0

          python - >> "$log" 2>&1 <<'PY' || status=$?
          from pathlib import Path

          verifier = Path("tools/review_data_products_v1_7_0_release_preparation_20260726.py")
          verifier_text = verifier.read_text(encoding="utf-8")
          if "project phase is missing" not in verifier_text:
              raise SystemExit("v1.7.0 verifier was not normalized")

          test_path = Path("tests/test_data_products_v1_7_0_release_preparation.py")
          lines = test_path.read_text(encoding="utf-8").splitlines(keepends=True)
          function_line = (
              "    def test_project_state_preserves_published_release_baseline"
              "(self) -> None:\n"
          )
          try:
              start = lines.index(function_line)
          except ValueError as exc:
              raise SystemExit("v1.7.0 normalized state test is missing") from exc
          try:
              end = next(
                  index
                  for index in range(start + 1, len(lines))
                  if lines[index].startswith('if __name__ == "__main__":')
              )
          except StopIteration as exc:
              raise SystemExit("v1.7.0 state test boundary is missing") from exc
          body = [index for index in range(start + 1, end) if lines[index].strip()]
          if not body:
              raise SystemExit("v1.7.0 state test has no body")
          if lines[body[0]].startswith("    state ="):
              for index in body:
                  lines[index] = "    " + lines[index]
              test_path.write_text("".join(lines), encoding="utf-8")
          elif not lines[body[0]].startswith("        state ="):
              raise SystemExit("v1.7.0 state test indentation is unknown")
          print("PASS: v1.7.0 publication contracts normalized for later packages")
          PY

          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/review_cross_model_comparison_view_20260726.py --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest tests.test_cross_model_comparison_view_review >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py validate >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> "$log" 2>&1 || status=$?
          fi

          echo "exit_status=$status" >> "$log"
          cat "$log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$log" README.md CHANGELOG.md project/ROADMAP.md \
            project/SESSION_STATE.md project/STATE_SUMMARY.md project/state.json \
            tests/test_data_products_v1_7_0_release_preparation.py
          if ! git diff --cached --quiet; then
            git commit -m 'docs(report): materialize cross-model view review'
            git push origin HEAD:agent/cross-model-comparison-view-review
          fi
          exit "$status"
