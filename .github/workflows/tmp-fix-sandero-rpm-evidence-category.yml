name: Temporary fix Sandero RPM evidence category

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-sandero-rpm-evidence-category.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/sandero-page17-power-torque-rpm-ranges-20260731
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install PDF text extraction backend
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Correct evidence categories and regenerate plan
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path

          root = Path('.')
          paths = [
              root / 'data/reporting/configuration_gap_evidence.json',
              root / 'data/reporting/sandero_ecog120_manual_gap_evidence.json',
              root / 'data/reporting/sandero_stepway_ecog120_automatic_gap_evidence.json',
          ]
          changed = 0
          for path in paths:
              payload = json.loads(path.read_text(encoding='utf-8'))
              for item in payload.get('decisions', []):
                  if item.get('attribute_code') not in {'max_power_rpm', 'max_torque_rpm'}:
                      continue
                  if not item.get('configuration_code', '').startswith('sandero_stepway_iii_'):
                      continue
                  if item.get('category') != 'Engine':
                      item['category'] = 'Engine'
                      changed += 1
                  fuel = item.get('fuel_type_code') or 'none'
                  item['triage_key'] = '|'.join([
                      'technical',
                      item.get('source_code', ''),
                      item.get('configuration_code', ''),
                      'Engine',
                      item.get('attribute_code', ''),
                      fuel,
                  ])
              payload['decisions'].sort(key=lambda item: item.get('triage_key', ''))
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          if changed != 38:
              raise RuntimeError(f'expected 38 category corrections across scoped/global evidence, got {changed}')
          subprocess.run([
              'python', 'tools/configuration_gap_resolution_plan.py',
              '--write-plan-spec', 'data/reporting/configuration_gap_resolution_plan.json'
          ], check=True)
      - name: Run full quality gate
        run: python tools/dkb.py quality --concise --database '${{ runner.temp }}/dkb.sqlite' --log-file '${{ runner.temp }}/quality.log' --summary-json '${{ runner.temp }}/quality-summary.json'
      - name: Check canonical state and documentation
        run: |
          python tools/dkb.py project-state --check
          python tools/dkb.py documentation-baseline --check
      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-fix-sandero-rpm-evidence-category.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(evidence): classify Sandero RPM gaps as engine data'
          git push origin HEAD:agent/sandero-page17-power-torque-rpm-ranges-20260731
