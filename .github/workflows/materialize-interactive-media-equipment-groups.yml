name: Materialize Interactive Media and Equipment Groups

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: materialize-interactive-media-equipment-groups-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/interactive-media-equipment-groups-correction-001'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Materialize correction
        run: |
          python tools/materialize_interactive_media_equipment_groups.py
          python tools/dkb.py project-state --apply
      - name: Verify focused contracts
        run: |
          python -m unittest -v \
            tests.test_configuration_shortlist_html \
            tests.test_configuration_selection_export \
            tests.test_data_product_release
          python tools/dkb.py project-state --check
      - name: Generate corrected standalone HTML
        run: |
          python tools/dkb.py configuration-shortlist \
            --html "${RUNNER_TEMP}/configuration-shortlist-corrected-v1.7.html"
      - name: Upload corrected preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: configuration-shortlist-corrected-v1.7
          path: ${{ runner.temp }}/configuration-shortlist-corrected-v1.7.html
          if-no-files-found: error
          retention-days: 7
      - name: Commit final bounded package
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          rm .github/workflows/materialize-interactive-media-equipment-groups.yml
          rm tools/materialize_interactive_media_equipment_groups.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ui): complete media and equipment group interface"
          git push origin "HEAD:${HEAD_BRANCH}"
