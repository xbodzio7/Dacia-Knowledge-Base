name: Temporary Spring Analysis Refresh

on:
  push:
    branches:
      - agent/spring-my26-dimension-dc40-review-20261120-001
    paths:
      - project/packages/.temporary-spring-analysis-refresh.txt

permissions:
  contents: write

concurrency:
  group: temporary-spring-analysis-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Regenerate Spring dependent reports
        run: python tools/import_spring_nonconflicting_common_technical_20260219.py --apply
      - name: Verify dependent source-gap packages
        run: |
          python tools/import_spring_nonconflicting_common_technical_20260219.py --verify
          python tools/import_sandero_stepway_essential_source_gap_20260626.py --check
          python tools/import_sandero_stepway_expression_auto_source_gap_20260626.py --check
          python tools/import_sandero_stepway_expression_source_gap_20260626.py --check
          python tools/import_sandero_stepway_extreme_auto_source_gap_20260626.py --check
          python tools/import_sandero_stepway_extreme_source_gap_20260626.py --check
      - name: Run focused regression tests
        run: |
          python -m unittest tests.test_existing_configuration_missing_data_analysis
          python -m unittest tests.test_spring_my26_dimension_dc40_review_20261120
          python -m unittest tests.test_spring_nonconflicting_common_technical_observations_migration_20260802
          python -m unittest tests.test_spring_technical_20260219
          python -m unittest tests.test_verified_pdf_candidate_coverage_reconciliation
          python -m unittest tests.test_jogger_paint_heated_seat_applicability_review_20261120
      - name: Commit refreshed reports
        run: |
          git add data/reporting/existing_configuration_missing_data_analysis.json data/reporting/existing_configuration_missing_data_analysis.md data/reporting/spring_nonconflicting_common_technical_migration.json data/reporting/spring_nonconflicting_common_technical_migration.md
          if git diff --cached --quiet; then
            echo "Generated reports are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(reporting): refresh Spring source-scoped analysis"
          git push origin "HEAD:${{ github.ref_name }}"
