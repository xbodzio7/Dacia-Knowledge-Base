name: AI capture current post-import DKB quality failure

on:
  push:
    branches:
      - ai/dacia-configurator-pdf-archive-20260809
    paths:
      - .github/workflows/ai-dkb-quality-diagnostic-20260809.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install PDF extraction backends
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check --quiet pypdf
      - name: Reproduce post-import quality state and persist compact diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/current-configurator-baseline-codes.txt
          import csv
          from pathlib import Path
          path = Path('data/master/configuration_attribute_values.csv')
          with path.open(encoding='utf-8-sig', newline='') as handle:
              rows = list(csv.DictReader(handle))
          for code in sorted((row.get('code') or '').strip() for row in rows if (row.get('code') or '').strip()):
              print(code)
          PY
          baseline=/tmp/current-configurator-baseline-codes.txt
          python tools/import_current_configurator_pdfs_20260809.py --apply > /tmp/import-stage1.log 2>&1
          python tools/import_current_configurator_pdfs_completion_20260809.py --apply > /tmp/import-stage2.log 2>&1
          python tools/reconcile_current_configurator_values_20260810.py --baseline-codes-file "$baseline" --apply > /tmp/reconcile.log 2>&1

          set +e
          python tools/dkb.py quality \
            --concise \
            --database "${RUNNER_TEMP}/dacia_knowledge_base.sqlite" \
            --log-file "${RUNNER_TEMP}/quality.log" \
            --summary-json "${RUNNER_TEMP}/quality-summary.json" \
            > /tmp/dkb-quality-stdout.log 2>&1
          code=$?
          set -e

          mkdir -p /tmp/diagnostic project/diagnostics
          {
            echo "exit_code=$code"
            echo "=== IMPORT SUMMARIES ==="
            tail -n 80 /tmp/import-stage1.log || true
            tail -n 80 /tmp/import-stage2.log || true
            tail -n 80 /tmp/reconcile.log || true
            echo "=== QUALITY FAILURE INDEX ==="
            grep -n -E '^FAIL:|^ERROR:|AssertionError:|RuntimeError:|ContractError:|FAILED \(|error:|ERROR: checker failed|stale|differs|mismatch|duplicate|expected .* found|uses attribute .* expected' /tmp/dkb-quality-stdout.log | tail -n 500 || true
            echo "=== QUALITY STDOUT TAIL ==="
            tail -n 650 /tmp/dkb-quality-stdout.log
            echo "=== QUALITY LOG TAIL ==="
            if test -f "${RUNNER_TEMP}/quality.log"; then tail -n 300 "${RUNNER_TEMP}/quality.log"; fi
            echo "=== QUALITY SUMMARY ==="
            if test -f "${RUNNER_TEMP}/quality-summary.json"; then cat "${RUNNER_TEMP}/quality-summary.json"; fi
          } > /tmp/diagnostic/dkb-quality-20260810.txt

          git reset --hard HEAD
          git clean -fd -- data/master data/reporting project || true
          mkdir -p project/diagnostics
          cp /tmp/diagnostic/dkb-quality-20260810.txt project/diagnostics/dkb-quality-20260810.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/diagnostics/dkb-quality-20260810.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(diagnostic): capture current post-import quality failure"
            git pull --rebase origin ai/dacia-configurator-pdf-archive-20260809
            git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
          fi
          exit 0
