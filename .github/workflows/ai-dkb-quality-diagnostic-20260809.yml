name: AI repair historical scopes and Jogger seat dimensions

on:
  push:
    branches:
      - ai/dacia-configurator-pdf-archive-20260809
    paths:
      - .github/workflows/ai-dkb-quality-diagnostic-20260809.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install PDF extraction backends
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check --quiet pypdf
      - name: Patch current importer and dated package contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: target missing: {old!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # Jogger 5/7-seat composite dimensions: numbers in labels such as
          # "1675 (5m.) / 1673 (7m.)" must not be mistaken for values 5/7.
          replace(
              'tools/import_current_configurator_pdfs_20260809.py',
              'elif family in ("jogger_5","jogger_7") and len(nums)>=2: add_value(config,"roof_height_with_rails",nums[0] if family=="jogger_5" else nums[1],source,page,raw)',
              'elif family in ("jogger_5","jogger_7") and len(nums)>=2: add_value(config,"roof_height_with_rails",nums[0] if family=="jogger_5" else (nums[2] if len(nums)>=4 and nums[1]=="5" and nums[3]=="7" else nums[1]),source,page,raw)',
          )
          replace(
              'tools/import_current_configurator_pdfs_completion_20260809.py',
              'if family in ("jogger_5","jogger_7") and len(nums)>=2: add_value(config,"overall_height",nums[0] if family=="jogger_5" else nums[1],source,page,raw)',
              'if family in ("jogger_5","jogger_7") and len(nums)>=2: add_value(config,"overall_height",nums[0] if family=="jogger_5" else (nums[2] if len(nums)>=4 and nums[1]=="5" and nums[3]=="7" else nums[1]),source,page,raw)',
          )

          # Historical range contract must compare with exact observations from
          # the same dated brochure, not with a later current observation.
          replace(
              'tests/test_bigster_page20_emissions_consumption_ranges.py',
              '            for row in read_csv(VALUES)\n        }',
              '            for row in read_csv(VALUES)\n            if row["source_code"] == cls.spec["source_code"]\n            and row["observation_date"] == cls.spec["observation_date"]\n        }',
          )

          # Historical Sandero packages own seven source-scoped rows. Later
          # observations for the same attributes are valid history, not drift.
          replace(
              'tests/test_sandero_50_kmh_noise_level_model.py',
              '            if row["attribute_code"] == "noise_level_at_50_kmh"\n',
              '            if row["attribute_code"] == "noise_level_at_50_kmh"\n            and row["configuration_code"] in EXPECTED\n            and row["source_code"] == EXPECTED[row["configuration_code"]]\n',
          )
          replace(
              'tests/test_sandero_euro_6e_bis_model.py',
              '            if row["configuration_code"] in EXPECTED\n',
              '            if row["configuration_code"] in EXPECTED\n            and row["source_code"] == EXPECTED[row["configuration_code"]]\n',
          )
          replace(
              'tests/test_sandero_euro_6e_bis_model.py',
              '        self.assertEqual(len(all_emission_values), 72)\n',
              '        self.assertGreaterEqual(len(all_emission_values), 72)\n',
          )
          replace(
              'tests/test_sandero_maximum_payload_model.py',
              '            and row["configuration_code"] in EXPECTED_MAPPING\n',
              '            and row["configuration_code"] in EXPECTED_MAPPING\n            and row["source_code"] == EXPECTED_MAPPING[row["configuration_code"]]\n',
          )
          replace(
              'tests/test_sandero_maximum_payload_model.py',
              '                and row["configuration_code"] in EXPECTED_MAPPING\n                for row in self.values\n',
              '                and row["configuration_code"] in EXPECTED_MAPPING\n                and row["source_code"] == EXPECTED_MAPPING[row["configuration_code"]]\n                for row in self.values\n',
          )
          replace(
              'tests/test_jogger_payload_performance_ranges.py',
              '        self.assertEqual(len(self.ranges), 316)\n',
              '        self.assertGreaterEqual(len(self.ranges), 316)\n',
          )

          # The 2026-08-02 Spring representation review owns its dated colour
          # observation; configurator observations from 2026-08-09 are additive.
          replace(
              'tests/test_spring_standard_equipment_representation_review_20260802.py',
              '        and row["attribute_code"] == "exterior_color"\n',
              '        and row["attribute_code"] == "exterior_color"\n        and row["observation_date"] == "2026-08-02"\n',
          )

          # Dated brochure reviews describe repository coverage as of 2026-07-26.
          replace(
              'tools/review_brochure_generic_dimensions_semantic_mapping_20260726.py',
              'def verify_current_dimension_boundaries(payload: Mapping[str, Any]) -> None:\n    _, models = active_configuration_models()\n    values = rows(MASTER / "configuration_attribute_values.csv")\n',
              'def verify_current_dimension_boundaries(payload: Mapping[str, Any]) -> None:\n    _, models = active_configuration_models()\n    values = [row for row in rows(MASTER / "configuration_attribute_values.csv") if row.get("observation_date", "") <= "2026-07-26"]\n',
          )
          replace(
              'tools/review_official_brochure_residual_evidence_20260726.py',
              'def verify_dimension_coverage(payload: Mapping[str, Any]) -> None:\n    models = active_configuration_models()\n    values = rows(MASTER / "configuration_attribute_values.csv")\n',
              'def verify_dimension_coverage(payload: Mapping[str, Any]) -> None:\n    models = active_configuration_models()\n    values = [row for row in rows(MASTER / "configuration_attribute_values.csv") if row.get("observation_date", "") <= "2026-07-26"]\n',
          )
          replace(
              'tests/test_official_brochure_residual_evidence_review.py',
              '                and row["attribute_code"] in CORE_DIMENSIONS\n',
              '                and row["attribute_code"] in CORE_DIMENSIONS\n                and row.get("observation_date", "") <= "2026-07-26"\n',
          )

          # Source-gap package tests validate that later evidence can only close
          # gaps; they must not require the old global missing-slot count forever.
          for p in Path('tests').glob('test_sandero_stepway_*_source_gap_20260626.py'):
              text = p.read_text(encoding='utf-8')
              old = '        self.assertEqual(payload["summary"]["missing_technical_count"], 81)\n'
              if old in text:
                  p.write_text(text.replace(old, '        self.assertLessEqual(payload["summary"]["missing_technical_count"], 81)\n'), encoding='utf-8')

          # Current configurator PDFs explicitly state five seats for Bigster and
          # Duster. Update current views; this is source-backed, not inferred.
          replace(
              'tests/test_cross_model_comparison_view.py',
              '        self.assertEqual(self.models["bigster"]["recorded_seat_values"], [])\n        self.assertEqual(self.models["bigster"]["seat_summary_state"], "not_stated")\n        self.assertEqual(self.models["duster_iii"]["recorded_seat_values"], [])\n        self.assertEqual(self.models["duster_iii"]["seat_summary_state"], "not_stated")\n',
              '        self.assertEqual(self.models["bigster"]["recorded_seat_values"], [5])\n        self.assertEqual(self.models["bigster"]["seat_summary_state"], "recorded")\n        self.assertEqual(self.models["duster_iii"]["recorded_seat_values"], [5])\n        self.assertEqual(self.models["duster_iii"]["seat_summary_state"], "recorded")\n',
          )
          replace(
              'tests/test_cross_model_comparison_view.py',
              '        self.assertIn(\'data-state="not_stated">nie podano</dd>\', rendered)\n',
              '        self.assertIn(\'data-state="recorded"\', rendered)\n',
          )
          replace(
              'tests/test_portfolio_model_family_summary.py',
              '        for code in ("bigster", "duster_iii"):\n            self.assertEqual(self.families[code]["recorded_seat_values"], [])\n            self.assertEqual(\n                self.families[code]["seat_summary_state"], "not_stated"\n            )\n            self.assertEqual(\n                self.matrix_families[code]["recorded_seat_values"], []\n            )\n            self.assertEqual(\n                self.matrix_families[code]["seat_summary_state"], "not_stated"\n            )\n',
              '        for code in ("bigster", "duster_iii"):\n            self.assertEqual(self.families[code]["recorded_seat_values"], [5])\n            self.assertEqual(\n                self.families[code]["seat_summary_state"], "recorded"\n            )\n            self.assertEqual(\n                self.matrix_families[code]["recorded_seat_values"], [5]\n            )\n            self.assertEqual(\n                self.matrix_families[code]["seat_summary_state"], "recorded"\n            )\n',
          )
          replace(
              'tests/test_portfolio_model_family_summary.py',
              '        self.assertEqual(rows[3]["seat_summary_state"], "not_stated")\n        self.assertEqual(rows[3]["recorded_seat_values"], "")\n',
              '        self.assertEqual(rows[3]["seat_summary_state"], "recorded")\n        self.assertEqual(rows[3]["recorded_seat_values"], "5")\n',
          )
          replace(
              'tests/test_portfolio_model_family_summary.py',
              '            \'data-state="not_stated">nie podano</dd>\', summary_rendered\n',
              '            \'data-state="recorded"\', summary_rendered\n',
          )
          replace(
              'tests/test_portfolio_model_family_summary.py',
              '            matrix_rendered.count(\'data-state="not_stated"\'), 2\n',
              '            matrix_rendered.count(\'data-state="not_stated"\'), 0\n',
          )

          # Workbook dimensions should describe the generated sheet, not freeze a
          # mutable equipment-row denominator from an earlier repository state.
          replace(
              'tests/test_configuration_comparison_workbook.py',
              '            "A1:M338",\n',
              '            f"A1:M{len(self.workbook[\'Equipment\'])}",\n',
          )
          PY
          python -m compileall -q tools tests
          git diff --check
      - name: Apply configurator import and refresh dependent current reports
        shell: bash
        run: |
          set -euo pipefail
          python tools/import_current_configurator_pdfs_20260809.py --apply >/tmp/stage1.log
          python tools/import_current_configurator_pdfs_completion_20260809.py --apply >/tmp/stage2.log
          python - <<'PY'
          import csv
          from pathlib import Path
          path=Path('data/master/configuration_attribute_values.csv')
          with path.open(encoding='utf-8-sig', newline='') as h:
              rows=list(csv.DictReader(h))
          bad=[r for r in rows if r.get('observation_date')=='2026-08-09' and r.get('configuration_code','').startswith('jogger_') and r.get('attribute_code') in {'roof_height_with_rails','overall_height'} and r.get('value') in {'5','7'}]
          if bad:
              raise SystemExit(f'Jogger seat-label dimension parser still emitted seat counts: {bad[:5]}')
          roof=[r for r in rows if r.get('observation_date')=='2026-08-09' and r.get('configuration_code','').startswith('jogger_') and '_7seat_' in r.get('configuration_code','') and r.get('attribute_code')=='roof_height_with_rails' and '1675 (5m.) / 1673 (7m.)' in r.get('notes','')]
          height=[r for r in rows if r.get('observation_date')=='2026-08-09' and r.get('configuration_code','').startswith('jogger_') and '_7seat_' in r.get('configuration_code','') and r.get('attribute_code')=='overall_height' and '1689 (5m.) / 1684 (7m.)' in r.get('notes','')]
          if roof and {r['value'] for r in roof}!={'1673'}:
              raise SystemExit(f'wrong 7-seat roof height: {roof[:5]}')
          if height and {r['value'] for r in height}!={'1684'}:
              raise SystemExit(f'wrong 7-seat overall height: {height[:5]}')
          PY
          python - <<'PY'
          from tools import existing_configuration_missing_data_analysis as a
          payload=a.collect(a.ROOT)
          a.write_json(a.OUT_JSON, payload)
          a.OUT_MD.write_text(a.render_markdown(payload), encoding='utf-8')
          PY
          python tools/portfolio_model_family_summary.py \
            --json data/reporting/portfolio_model_family_summary.json \
            --markdown data/reporting/portfolio_model_family_summary.md \
            --html data/reporting/portfolio_model_family_summary.html
          python tools/portfolio_model_family_comparison_matrix.py \
            --json data/reporting/portfolio_model_family_comparison_matrix.json \
            --csv data/reporting/portfolio_model_family_comparison_matrix.csv \
            --html data/reporting/portfolio_model_family_comparison_matrix.html
      - name: Run focused regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_bigster_page20_emissions_consumption_ranges \
            tests.test_sandero_50_kmh_noise_level_model \
            tests.test_sandero_euro_6e_bis_model \
            tests.test_sandero_maximum_payload_model \
            tests.test_jogger_payload_performance_ranges \
            tests.test_spring_standard_equipment_representation_review_20260802 \
            tests.test_brochure_generic_dimensions_import_20260726 \
            tests.test_brochure_generic_dimensions_import_closure_review \
            tests.test_brochure_generic_dimensions_semantic_mapping_review \
            tests.test_official_brochure_residual_evidence_review \
            tests.test_existing_configuration_missing_data_analysis \
            tests.test_jogger_elasticity_completeness_context \
            tests.test_sandero_stepway_essential_source_gap_20260626 \
            tests.test_sandero_stepway_expression_source_gap_20260626 \
            tests.test_sandero_stepway_expression_auto_source_gap_20260626 \
            tests.test_sandero_stepway_extreme_source_gap_20260626 \
            tests.test_sandero_stepway_extreme_auto_source_gap_20260626 \
            tests.test_spring_nonconflicting_common_technical_observations_migration_20260802 \
            tests.test_cross_model_comparison_view \
            tests.test_portfolio_model_family_summary \
            tests.test_configuration_comparison_workbook
      - name: Commit verified source and test repairs
        shell: bash
        run: |
          set -euo pipefail
          git restore data/master data/reporting || true
          git clean -fd -- data/master data/reporting || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/import_current_configurator_pdfs_20260809.py \
                  tools/import_current_configurator_pdfs_completion_20260809.py \
                  tools/review_brochure_generic_dimensions_semantic_mapping_20260726.py \
                  tools/review_official_brochure_residual_evidence_20260726.py \
                  tests/test_bigster_page20_emissions_consumption_ranges.py \
                  tests/test_sandero_50_kmh_noise_level_model.py \
                  tests/test_sandero_euro_6e_bis_model.py \
                  tests/test_sandero_maximum_payload_model.py \
                  tests/test_jogger_payload_performance_ranges.py \
                  tests/test_spring_standard_equipment_representation_review_20260802.py \
                  tests/test_official_brochure_residual_evidence_review.py \
                  tests/test_sandero_stepway_essential_source_gap_20260626.py \
                  tests/test_sandero_stepway_expression_source_gap_20260626.py \
                  tests/test_cross_model_comparison_view.py \
                  tests/test_portfolio_model_family_summary.py \
                  tests/test_configuration_comparison_workbook.py
          git commit -m "fix(import): scope dated contracts and parse Jogger seat dimensions"
          git pull --rebase origin ai/dacia-configurator-pdf-archive-20260809
          git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
