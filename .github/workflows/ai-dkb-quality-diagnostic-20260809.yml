name: AI capture residual post-import unit failures

on:
  push:
    branches:
      - ai/dacia-configurator-pdf-archive-20260809
    paths:
      - .github/workflows/ai-dkb-quality-diagnostic-20260809.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install PDF fallback
        run: python -m pip install --disable-pip-version-check --quiet pypdf
      - name: Import, test, and capture failures
        shell: bash
        run: |
          set -euo pipefail
          python tools/import_current_configurator_pdfs_20260809.py --apply >/tmp/stage1.log
          python tools/import_current_configurator_pdfs_completion_20260809.py --apply >/tmp/stage2.log
          set +e
          python -m unittest discover -s tests -p 'test_*.py' -v >/tmp/tests.log 2>&1
          code=$?
          set -e
          {
            echo "exit_code=$code"
            echo "=== FAILURES ==="
            grep -n -E '^FAIL:|^ERROR:|^FAILED \(' /tmp/tests.log || true
            echo "=== ASSERTIONS / CONTRACT ERRORS ==="
            grep -n -E 'AssertionError:|ContractError:|RuntimeError:|post-import|Outdated dependent|expected .* found|stale$' /tmp/tests.log | tail -n 400 || true
          } >/tmp/report.txt
          git reset --hard HEAD
          cp /tmp/report.txt project/diagnostics/dkb-quality-20260809.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/diagnostics/dkb-quality-20260809.txt
          git commit -m "chore(diagnostic): capture residual post-import unit failures" || true
          git pull --rebase origin ai/dacia-configurator-pdf-archive-20260809
          git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
