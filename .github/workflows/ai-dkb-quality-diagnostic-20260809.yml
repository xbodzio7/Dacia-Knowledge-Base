name: AI inspect degenerate imported ranges

on:
  push:
    branches:
      - ai/dacia-configurator-pdf-archive-20260809
    paths:
      - .github/workflows/ai-dkb-quality-diagnostic-20260809.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Reproduce and record degenerate ranges
        shell: bash
        run: |
          set -euo pipefail
          python tools/import_current_configurator_pdfs_20260809.py --apply >/tmp/stage1.log
          python tools/import_current_configurator_pdfs_completion_20260809.py --apply >/tmp/stage2.log
          python - <<'PY' >/tmp/report.txt
          import csv
          from decimal import Decimal
          from pathlib import Path
          p=Path('data/master/configuration_attribute_value_ranges.csv')
          with p.open(encoding='utf-8-sig', newline='') as f:
              rows=list(csv.DictReader(f))
          bad=[r for r in rows if Decimal(r['minimum_value']) >= Decimal(r['maximum_value'])]
          print(f'degenerate_or_reversed={len(bad)}')
          for r in bad:
              print({k:r.get(k,'') for k in ('id','code','configuration_code','attribute_code','fuel_type_code','minimum_value','maximum_value','observation_date','source_code','notes')})
          PY
          git reset --hard HEAD
          cp /tmp/report.txt project/diagnostics/dkb-quality-20260809.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/diagnostics/dkb-quality-20260809.txt
          git commit -m "chore(diagnostic): inspect degenerate configurator ranges" || true
          git pull --rebase origin ai/dacia-configurator-pdf-archive-20260809
          git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
