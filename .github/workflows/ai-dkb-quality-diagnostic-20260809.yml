name: AI capture post-import DKB quality failure

on:
  push:
    branches:
      - ai/dacia-configurator-pdf-archive-20260809
    paths:
      - .github/workflows/ai-dkb-quality-diagnostic-20260809.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install PDF extraction backends
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
          python -m pip install --disable-pip-version-check --quiet pypdf
      - name: Reproduce post-import quality state and persist compact diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/current-configurator-baseline-codes.txt
          import csv
          from pathlib import Path
          path = Path('data/master/configuration_attribute_values.csv')
          with path.open(encoding='utf-8-sig', newline='') as handle:
              rows = list(csv.DictReader(handle))
          for code in sorted((row.get('code') or '').strip() for row in rows if (row.get('code') or '').strip()):
              print(code)
          PY
          baseline=/tmp/current-configurator-baseline-codes.txt
          python tools/import_current_configurator_pdfs_20260809.py --apply > /tmp/import-stage1.log 2>&1
          python tools/import_current_configurator_pdfs_completion_20260809.py --apply > /tmp/import-stage2.log 2>&1
          python tools/reconcile_current_configurator_values_20260810.py --baseline-codes-file "$baseline" --apply > /tmp/reconcile.log 2>&1

          set +e
          python tools/dkb.py quality \
            --concise \
            --database "${RUNNER_TEMP}/dacia_knowledge_base.sqlite" \
            --log-file "${RUNNER_TEMP}/quality.log" \
            --summary-json "${RUNNER_TEMP}/quality-summary.json" \
            > /tmp/dkb-quality-stdout.log 2>&1
          code=$?
          set -e

          mkdir -p /tmp/diagnostic project/diagnostics
          {
            echo "exit_code=$code"
            echo "=== QUALITY STDOUT MATCHES ==="
            grep -n -E 'FAIL|ERROR|Traceback|RuntimeError|AssertionError|expected|Expected|stale|differs|mismatch|missing|FAILED|invalid|Invalid' /tmp/dkb-quality-stdout.log | tail -n 300 || true
            echo "=== QUALITY STDOUT TAIL ==="
            tail -n 500 /tmp/dkb-quality-stdout.log
            echo "=== QUALITY LOG MATCHES ==="
            if test -f "${RUNNER_TEMP}/quality.log"; then
              grep -n -E 'FAIL|ERROR|Traceback|RuntimeError|AssertionError|expected|Expected|stale|differs|mismatch|missing|FAILED|invalid|Invalid' "${RUNNER_TEMP}/quality.log" | tail -n 300 || true
              echo "=== QUALITY LOG TAIL ==="
              tail -n 500 "${RUNNER_TEMP}/quality.log"
            fi
            echo "=== QUALITY SUMMARY ==="
            if test -f "${RUNNER_TEMP}/quality-summary.json"; then
              cat "${RUNNER_TEMP}/quality-summary.json"
            fi
            echo "=== RECONCILER TAIL ==="
            tail -n 100 /tmp/reconcile.log
          } > /tmp/diagnostic/dkb-quality-20260809.txt

          git reset --hard HEAD
          cp /tmp/diagnostic/dkb-quality-20260809.txt project/diagnostics/dkb-quality-20260809.txt
          git clean -fd -- data/master data/reporting project || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/diagnostics/dkb-quality-20260809.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(diagnostic): capture post-import DKB quality result"
            git pull --rebase origin ai/dacia-configurator-pdf-archive-20260809
            git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
          fi
          exit 0
