name: AI repair overlapping console aliases

on:
  push:
    branches:
      - ai/dacia-configurator-pdf-archive-20260809
    paths:
      - .github/workflows/ai-dkb-quality-diagnostic-20260809.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Patch longest-match console parsing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/import_current_configurator_pdfs_completion_20260809.py')
          text=p.read_text(encoding='utf-8')
          old='''        ]:\n            if pat in st: add_value(config,"centre_console_variant",val,source,3,pat)\n'''
          new='''        ]:\n            if pat in st:\n                add_value(config,"centre_console_variant",val,source,3,pat)\n                break\n'''
          if old not in text:
              raise SystemExit('centre-console alias block not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile tools/import_current_configurator_pdfs_completion_20260809.py
          git diff --check
      - name: Commit parser repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/import_current_configurator_pdfs_completion_20260809.py
          git commit -m "fix(import): prefer specific console equipment alias"
          git pull --rebase origin ai/dacia-configurator-pdf-archive-20260809
          git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
