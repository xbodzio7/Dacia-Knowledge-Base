name: AI repair configurator cargo observation import

on:
  push:
    branches:
      - ai/dacia-configurator-pdf-archive-20260809
    paths:
      - .github/workflows/ai-dkb-quality-diagnostic-20260809.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Patch cargo observation semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/import_current_configurator_pdfs_completion_20260809.py')
          text=p.read_text(encoding='utf-8')
          old='''    def add_value(config, attr, value, source, page, raw, fuel="", suffix="cfgpdf2"):\n        nonlocal value_id\n        if attr not in attrs_by_code:\n            defer("missing_attribute", f"{attr}: {raw}"); return None\n        value=str(value).replace(",",".") if attrs_by_code[attr]["data_type"] in ("integer","decimal") else str(value)\n        same=[r for r in values if r["configuration_code"]==config and r["attribute_code"]==attr and r.get("fuel_type_code","")==fuel and r["value"]==value]\n        if same: counters["values_already_covered"]+=1; return same[-1]["code"]\n        base=f"{config}_{attr}_{fuel or 'all'}_20260809_{suffix}"\n        code=base; n=2\n        existing={r["code"] for r in values}\n        while code in existing: code=f"{base}_{n}"; n+=1\n'''
          new='''    def add_value(config, attr, value, source, page, raw, fuel="", suffix="cfgpdf2", force_distinct=False):\n        nonlocal value_id\n        if attr not in attrs_by_code:\n            defer("missing_attribute", f"{attr}: {raw}"); return None\n        value=str(value).replace(",",".") if attrs_by_code[attr]["data_type"] in ("integer","decimal") else str(value)\n        base=f"{config}_{attr}_{fuel or 'all'}_20260809_{suffix}"\n        existing={r["code"] for r in values}\n        if force_distinct and base in existing:\n            counters["values_already_covered"]+=1; return base\n        if not force_distinct:\n            same=[r for r in values if r["configuration_code"]==config and r["attribute_code"]==attr and r.get("fuel_type_code","")==fuel and r["value"]==value]\n            if same: counters["values_already_covered"]+=1; return same[-1]["code"]\n        code=base; n=2\n        while code in existing: code=f"{base}_{n}"; n+=1\n'''
          if old not in text:
              raise SystemExit('add_value block not found')
          text=text.replace(old,new,1)
          text=text.replace('(m.group(1),"vda_iso_3832","present","","cargo_volume_vda","spare_vda")','(m.group(1),"vda_iso_3832","present","","boot_capacity","spare_vda")')
          text=text.replace('(m.group(2),"vda_iso_3832","","present","cargo_volume_vda","kit_vda")','(m.group(2),"vda_iso_3832","","present","boot_capacity","kit_vda")')
          text=text.replace('(vda,"vda_iso_3832","cargo_volume_vda","vda")','(vda,"vda_iso_3832","boot_capacity","vda")')
          text=text.replace('(m.group(1),"vda_iso_3832","cargo_volume_vda","vda")','(m.group(1),"vda_iso_3832","boot_capacity","vda")')
          text=text.replace('vc=add_value(config,"cargo_volume_vda",m.group(1),source,page,raw,suffix=f"cargo_{state}_vda")','vc=add_value(config,"boot_capacity",m.group(1),source,page,raw,suffix=f"cargo_{state}_vda",force_distinct=True)')
          text=text.replace('vc=add_value(config,attr,val,source,page,raw,suffix=f"cargo_{state}_{tag}")','vc=add_value(config,attr,val,source,page,raw,suffix=f"cargo_{state}_{tag}",force_distinct=True)')
          p.write_text(text,encoding='utf-8')
          PY
          python -m py_compile tools/import_current_configurator_pdfs_completion_20260809.py
          git diff --check
      - name: Commit importer repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/import_current_configurator_pdfs_completion_20260809.py
          git commit -m "fix(import): isolate contextual cargo observations"
          git pull --rebase origin ai/dacia-configurator-pdf-archive-20260809
          git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
