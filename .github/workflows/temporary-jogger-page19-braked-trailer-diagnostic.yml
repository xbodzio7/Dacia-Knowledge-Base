name: Temporary Jogger page 19 braked trailer diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/jogger-page19-braked-trailer-weight-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/jogger-page19-braked-trailer-weight-20260730
          persist-credentials: false
      - name: Install PDF text extraction backend
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Show page 19 trailer rows
        run: |
          pdftotext -f 19 -l 19 -layout 'PDF/Broszury/DACIA JOGGER broszura 20251217.pdf' - | grep -E -i 'przyczep|1200|1000' || true
