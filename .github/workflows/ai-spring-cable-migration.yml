name: AI Spring cable migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply repository migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          attrs_path = Path('data/master/attributes.csv')
          availability_path = Path('data/master/configuration_attribute_availability.csv')

          def read_csv(path):
              with path.open(encoding='utf-8', newline='') as f:
                  return list(csv.DictReader(f))

          def write_csv(path, fieldnames, rows):
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open('w', encoding='utf-8', newline='') as f:
                  writer = csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\n')
                  writer.writeheader()
                  writer.writerows(rows)

          attrs = read_csv(attrs_path)
          attr_fields = list(attrs[0].keys())
          existing_codes = {r['code'] for r in attrs}
          next_id = max(int(r['id']) for r in attrs) + 1
          new_attrs = [
              ('type2_charging_cable_supplied', 'Charging', 'Type 2 charging cable supplied', 'Physical Type 2 charging cable supplied with the vehicle; distinct from the vehicle charging connector type and from a domestic-socket cable.'),
              ('domestic_socket_charging_cable', 'Charging', 'Domestic-socket charging cable', 'Separate charging cable for a regular domestic socket; distinct from the Type 2 cable supplied with the vehicle.'),
          ]
          for code, category, name, description in new_attrs:
              if code not in existing_codes:
                  attrs.append({'id': str(next_id), 'code': code, 'category': category, 'name': name, 'data_type': 'boolean', 'unit': '', 'description': description, 'status': 'active'})
                  next_id += 1
          write_csv(attrs_path, attr_fields, attrs)

          rows = read_csv(availability_path)
          fields = list(rows[0].keys())
          existing = {r['code'] for r in rows}
          next_row_id = max(int(r['id']) for r in rows) + 1
          specs = [
              ('cfg_spring_essential_electric_70', 'type2_charging_cable_supplied', 'standard', 'src_spring_essential_pricing_pdf_2026-08-02', 'Official saved-configuration PDF confirms a Type 2 cable supplied as standard.'),
              ('cfg_spring_expression_electric_70', 'type2_charging_cable_supplied', 'standard', 'src_spring_expression_pricing_pdf_2026-08-02', 'Official saved-configuration PDF confirms a Type 2 cable supplied as standard.'),
              ('cfg_spring_extreme_electric_100', 'type2_charging_cable_supplied', 'standard', 'src_spring_extreme_pricing_pdf_2026-08-02', 'Official saved-configuration PDF confirms a Type 2 cable supplied as standard.'),
              ('cfg_spring_essential_electric_70', 'domestic_socket_charging_cable', 'option', 'src_spring_essential_pricing_pdf_2026-08-02', 'Official saved-configuration PDF confirms the domestic-socket charging cable as a 1500 PLN option.'),
              ('cfg_spring_extreme_electric_100', 'domestic_socket_charging_cable', 'option', 'src_spring_extreme_pricing_pdf_2026-08-02', 'Official saved-configuration PDF confirms the domestic-socket charging cable as a 1500 PLN option.'),
          ]
          inserted_codes = []
          for cfg, attr, status, source, note in specs:
              code = f'{cfg}_{attr}_20260802'
              inserted_codes.append(code)
              if code not in existing:
                  rows.append({'id': str(next_row_id), 'code': code, 'configuration_code': cfg, 'attribute_code': attr, 'availability_status': status, 'observation_date': '2026-08-02', 'source_code': source, 'notes': note})
                  next_row_id += 1
          write_csv(availability_path, fields, rows)

          source_path = Path('data/imports/configuration_attribute_availability_sources.csv')
          source_fields = ['id', 'code', 'source_artifact_id', 'source_type', 'observation_date', 'notes']
          source_rows = [
              {'id': '1', 'code': 'spring_essential_charging_cable_evidence_20260802', 'source_artifact_id': 'src_spring_essential_pricing_pdf_2026-08-02', 'source_type': 'official_saved_configuration_pdf', 'observation_date': '2026-08-02', 'notes': 'Evidence for Type 2 standard cable and domestic-socket cable option priced at 1500 PLN.'},
              {'id': '2', 'code': 'spring_expression_charging_cable_evidence_20260802', 'source_artifact_id': 'src_spring_expression_pricing_pdf_2026-08-02', 'source_type': 'official_saved_configuration_pdf', 'observation_date': '2026-08-02', 'notes': 'Evidence for Type 2 standard cable only; absence of a selected domestic cable is not negative availability evidence.'},
              {'id': '3', 'code': 'spring_extreme_charging_cable_evidence_20260802', 'source_artifact_id': 'src_spring_extreme_pricing_pdf_2026-08-02', 'source_type': 'official_saved_configuration_pdf', 'observation_date': '2026-08-02', 'notes': 'Evidence for Type 2 standard cable and domestic-socket cable option priced at 1500 PLN.'},
          ]
          write_csv(source_path, source_fields, source_rows)

          link_path = Path('data/imports/configuration_attribute_availability_source_links.csv')
          link_fields = ['id', 'availability_code', 'availability_source_code', 'notes']
          source_by_cfg = {
              'cfg_spring_essential_electric_70': 'spring_essential_charging_cable_evidence_20260802',
              'cfg_spring_expression_electric_70': 'spring_expression_charging_cable_evidence_20260802',
              'cfg_spring_extreme_electric_100': 'spring_extreme_charging_cable_evidence_20260802',
          }
          link_rows = []
          for idx, (cfg, attr, status, source, note) in enumerate(specs, start=1):
              code = f'{cfg}_{attr}_20260802'
              link_rows.append({'id': str(idx), 'availability_code': code, 'availability_source_code': source_by_cfg[cfg], 'notes': 'Record-level provenance for the accepted Spring charging-cable evidence.'})
          write_csv(link_path, link_fields, link_rows)

          test_path = Path('tests/test_spring_charging_cable_representation_migration_20260802.py')
          test_path.write_text('''import csv\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\n\ndef rows(path):\n    with (ROOT / path).open(encoding="utf-8", newline="") as handle:\n        return list(csv.DictReader(handle))\n\ndef test_charging_cable_attributes_are_semantically_separate_booleans():\n    attributes = {row["code"]: row for row in rows("data/master/attributes.csv")}\n    assert attributes["type2_charging_cable_supplied"]["data_type"] == "boolean"\n    assert attributes["domestic_socket_charging_cable"]["data_type"] == "boolean"\n    assert "connector" not in attributes["type2_charging_cable_supplied"]["code"]\n\ndef test_spring_cable_availability_respects_evidence_boundary():\n    availability = rows("data/master/configuration_attribute_availability.csv")\n    selected = {(r["configuration_code"], r["attribute_code"]): r for r in availability if r["attribute_code"] in {"type2_charging_cable_supplied", "domestic_socket_charging_cable"}}\n    for cfg in {"cfg_spring_essential_electric_70", "cfg_spring_expression_electric_70", "cfg_spring_extreme_electric_100"}:\n        assert selected[(cfg, "type2_charging_cable_supplied")]["availability_status"] == "standard"\n    for cfg in {"cfg_spring_essential_electric_70", "cfg_spring_extreme_electric_100"}:\n        row = selected[(cfg, "domestic_socket_charging_cable")]\n        assert row["availability_status"] == "option"\n        assert "1500 PLN" in row["notes"]\n    assert ("cfg_spring_expression_electric_70", "domestic_socket_charging_cable") not in selected\n\ndef test_every_new_availability_record_has_artifact_provenance():\n    availability = [r for r in rows("data/master/configuration_attribute_availability.csv") if r["attribute_code"] in {"type2_charging_cable_supplied", "domestic_socket_charging_cable"}]\n    sources = {r["code"]: r for r in rows("data/imports/configuration_attribute_availability_sources.csv")}\n    links = {r["availability_code"]: r for r in rows("data/imports/configuration_attribute_availability_source_links.csv")}\n    assert len(availability) == 5\n    for row in availability:\n        link = links[row["code"]]\n        assert sources[link["availability_source_code"]]["source_artifact_id"].startswith("src_spring_")\n''', encoding='utf-8')

          state_path = Path('project/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['updated_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          state['summary'] = 'Pakiet `spring_charging_cable_representation_migration_001` został przygotowany w PR #460: rozdzielono przewód Type 2 od przewodu do gniazdka domowego, wpisano wyłącznie potwierdzoną dostępność Spring i dodano provenance na poziomie rekordów.'
          candidates = [c for c in state.get('candidate_next_work_packages', []) if c.get('id') != 'spring_charging_cable_representation_migration_001']
          state['candidate_next_work_packages'] = candidates
          if candidates:
              next_candidate = sorted(candidates, key=lambda c: c.get('priority', 999))[0]
              state['next_work_package'] = {
                  'id': next_candidate['id'],
                  'objective': next_candidate['objective'],
                  'acceptance_criteria': [
                      'Zdefiniować jawny scoring wiarygodności źródeł zgodny z governance i lifecycle obserwacji.',
                      'Wdrożyć model danych i walidację bez zmiany znaczenia istniejących obserwacji.',
                      'Dodać testy regresji, uruchomić `make check` oraz `python3 tools/project_state.py --check`.'
                  ],
                  'recommended_context': ['project/SCHEMA_GOVERNANCE.md', 'project/DATA_ARCHITECTURE.md', 'project/SOURCE_INTAKE_CHECKLIST.md', 'data/master/sources.csv']
              }
          state.setdefault('context', {}).setdefault('recently_merged', []).append('PR #460')
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Regenerate the human-readable state summary and remove this temporary workflow.
          import subprocess
          subprocess.run(['python3', 'tools/project_state.py'], check=True)
          Path('.github/workflows/ai-spring-cable-migration.yml').unlink()
          PY
          python3 -m pytest -q tests/test_spring_charging_cable_representation_migration_20260802.py
          python3 tools/project_state.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(data): migrate Spring charging cable representation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
