name: AI Spring cable migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply corrected migration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/review_spring_charging_cable_representation_migration_20260802.py
          python3 -m pytest -q tests/test_spring_charging_cable_representation_migration_20260802.py
          python3 tools/project_state.py --check
          rm .github/workflows/ai-spring-cable-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(data): migrate Spring charging cable representation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
