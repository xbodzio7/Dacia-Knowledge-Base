name: AI Spring cable migration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect migration inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/project_state.py --check
          echo '--- attributes tail ---'
          tail -n 8 data/master/attributes.csv
          echo '--- availability header and Spring rows ---'
          head -n 2 data/master/configuration_attribute_availability.csv
          grep -n 'cfg_spring_\(essential\|expression\|extreme\)_electric_\(70\|100\)' data/master/configuration_attribute_availability.csv | tail -n 30 || true
          echo '--- availability provenance files ---'
          find data -maxdepth 4 -type f -iname '*configuration*availability*source*' -print
          for f in $(find data -maxdepth 4 -type f -iname '*configuration*availability*source*'); do
            echo "--- $f ---"
            head -n 3 "$f"
            tail -n 5 "$f"
          done
          echo '--- relevant tests ---'
          find tests -maxdepth 1 -type f | sort | tail -n 30
