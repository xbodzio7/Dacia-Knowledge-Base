name: Temporary Source Coverage Fix Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Fix source coverage implementation and test import
        run: |
          sed -i '316,335s/^/    /' tools/_source_coverage_base.py
          sed -i 's/from tests\.test_source_coverage import SourceCoverageTests/from test_source_coverage import SourceCoverageTests/' tests/test_source_coverage_repository_as_of.py
          python -m py_compile tools/_source_coverage_base.py tests/test_source_coverage_repository_as_of.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/_source_coverage_base.py tests/test_source_coverage_repository_as_of.py
          git commit -m "fix(reporting): align source coverage repository clock"
          git push origin HEAD:${{ github.head_ref }}
