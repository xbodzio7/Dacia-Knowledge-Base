name: Materialize Brochure Gear Performance Model

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/materialize-brochure-gear-performance-model.yml
      - data/reporting/brochure_gear_performance_context_model.json
      - project/state.json
      - tests/test_brochure_gear_performance_context_model.py
      - tools/model_brochure_gear_performance_context_20260726.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/brochure-gear-performance-context-model
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Materialize decision and run tests
        run: |
          set +e
          : > .github/brochure-gear-performance-model-diagnostic.log
          status=0
          python tools/model_brochure_gear_performance_context_20260726.py --apply >> .github/brochure-gear-performance-model-diagnostic.log 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> .github/brochure-gear-performance-model-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/model_brochure_gear_performance_context_20260726.py --check >> .github/brochure-gear-performance-model-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> .github/brochure-gear-performance-model-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tests/test_brochure_gear_performance_context_model.py -v >> .github/brochure-gear-performance-model-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' -v >> .github/brochure-gear-performance-model-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            git diff --check >> .github/brochure-gear-performance-model-diagnostic.log 2>&1 || status=$?
          fi
          cat .github/brochure-gear-performance-model-diagnostic.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(model): persist gear performance context decision'
            git push origin HEAD:agent/brochure-gear-performance-context-model
          fi
          exit "$status"
