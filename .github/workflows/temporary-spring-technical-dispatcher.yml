name: Temporary Spring Technical Dispatcher

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-spring-technical-dispatcher-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/spring-brochure-technical-observations-20260219'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install PDF text extraction backend
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
          pdftotext -v

      - name: Extract verified package payload
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import tarfile
          from pathlib import Path

          workflow = Path('.github/workflows/temporary-spring-technical-materializer.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = "<<'PAYLOAD'\n"
          payload = text.split(marker, 1)[1].split('\nPAYLOAD\n', 1)[0].strip()
          archive = base64.b64decode(payload, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected = 'fa8d31e56e73caea58fdf9e99a2db45c926c680b3714c4f117e8b1b30e793d5b'
          if digest != expected:
              raise SystemExit(f'payload SHA-256 differs: {digest}')
          archive_path = Path('/tmp/spring-package.tar.gz')
          archive_path.write_bytes(archive)
          with tarfile.open(archive_path, mode='r:gz') as handle:
              handle.extractall('.', filter='data')
          PY

      - name: Apply exact Spring technical import
        run: |
          python tools/import_spring_technical_20260219.py --apply
          python tools/materialize_spring_technical_package_20260219.py
          rm tools/materialize_spring_technical_package_20260219.py
          rm .github/workflows/temporary-spring-technical-materializer.yml
          rm .github/workflows/temporary-spring-technical-dispatcher.yml

      - name: Verify package contract
        run: |
          python tools/import_spring_technical_20260219.py --check
          python -m unittest -v tests.test_spring_technical_20260219
          python tools/dkb.py project-state --check
          python tools/dkb.py quality \
            --concise \
            --database "$RUNNER_TEMP/dacia_knowledge_base.sqlite" \
            --log-file "$RUNNER_TEMP/quality.log" \
            --summary-json "$RUNNER_TEMP/quality-summary.json"

      - name: Verify final manifest
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/expected-manifest.txt" <<'EOF'
          CHANGELOG.md
          README.md
          data/imports/spring_technical_20260219.csv
          data/master/configuration_attribute_value_ranges.csv
          data/master/configuration_attribute_values.csv
          data/reporting/spring_electric70_automatic_completeness.json
          data/reporting/verified_pdf_candidate_coverage_reconciliation.json
          project/ROADMAP.md
          project/SESSION_STATE.md
          project/STATE_SUMMARY.md
          project/packages/spring-brochure-technical-observations-20260219.md
          project/state.json
          tests/test_spring_technical_20260219.py
          tools/import_spring_technical_20260219.py
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/expected-manifest.txt"
          git diff --name-only origin/main | LC_ALL=C sort > "$RUNNER_TEMP/actual-manifest.txt"
          diff -u "$RUNNER_TEMP/expected-manifest.txt" "$RUNNER_TEMP/actual-manifest.txt"
          git diff --check

      - name: Commit materialized package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat(data): add Spring brochure technical observations"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
