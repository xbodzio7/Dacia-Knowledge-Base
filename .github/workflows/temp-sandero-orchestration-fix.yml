name: Temporary Sandero Orchestration Fix

on:
  push:
    branches:
      - data/sandero-residual-source-closure-006
    paths:
      - .github/workflows/temp-sandero-orchestration-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/sandero-residual-source-closure-006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Align orchestration snapshots
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD:$PWD/tools"
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"contract not found: {path}")
              target.write_text(text, encoding="utf-8", newline="\n")

          replace(
              "tests/configuration_comparison_context_filter_contract.py",
              "        self.assertEqual(len(core.difference_csv_rows(report)), 400)",
              "        self.assertEqual(len(core.difference_csv_rows(report)), 411)",
          )
          replace(
              "tests/configuration_comparison_pair_summary_contract.py",
              '''        self.assertEqual(
              sum(int(row["total_different"]) for row in rows),
              400,
          )''',
              '''        self.assertEqual(
              sum(int(row["total_different"]) for row in rows),
              411,
          )''',
          )

          aligner = Path("tools/align_sandero_residual_source_closure_contracts_20260801.py")
          text = aligner.read_text(encoding="utf-8")
          manifest_anchor = '            "tests/test_duster_ecog120_reporting_scope.py",\n'
          manifest_addition = (
              '            "tests/configuration_comparison_context_filter_contract.py",\n'
              '            "tests/configuration_comparison_pair_summary_contract.py",\n'
          )
          if manifest_addition not in text:
              if manifest_anchor not in text:
                  raise SystemExit("aligner manifest anchor not found")
              text = text.replace(manifest_anchor, manifest_addition + manifest_anchor, 1)

          apply_anchor = '''    replace_exact(
              "tests/test_duster_ecog120_reporting_scope.py",
              '        self.assertEqual(default["summary"]["total_differences"], 400)',
              '        self.assertEqual(default["summary"]["total_differences"], 411)',
          )
'''
          apply_addition = '''    replace_exact(
              "tests/configuration_comparison_context_filter_contract.py",
              "        self.assertEqual(len(core.difference_csv_rows(report)), 400)",
              "        self.assertEqual(len(core.difference_csv_rows(report)), 411)",
          )
          replace_exact(
              "tests/configuration_comparison_pair_summary_contract.py",
              '''        self.assertEqual(
              sum(int(row["total_different"]) for row in rows),
              400,
          )''',
              '''        self.assertEqual(
              sum(int(row["total_different"]) for row in rows),
              411,
          )''',
          )
'''
          if apply_addition not in text:
              if apply_anchor not in text:
                  raise SystemExit("aligner apply anchor not found")
              text = text.replace(apply_anchor, apply_anchor + apply_addition, 1)

          aligner.write_text(text, encoding="utf-8", newline="\n")
          PY
          python -m tools.align_sandero_residual_source_closure_contracts_20260801
          python tools/dkb.py project-state --apply
          python -m tools.align_sandero_residual_source_closure_contracts_20260801 --check
          python -m tools.import_sandero_residual_source_closure_20260801 --check
          python -m unittest -q \
            tests.configuration_comparison_context_filter_contract \
            tests.configuration_comparison_pair_summary_contract \
            tests.project_state_contract
          python tools/dkb.py validate
          python tools/dkb.py project-state --check
          rm -f .github/workflows/temp-sandero-orchestration-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align comparison orchestration snapshots"
          git push origin HEAD:data/sandero-residual-source-closure-006
