name: Temporary Duster page 20 exact scalar import closure

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/duster-page20-exact-scalar-import-closure-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out closure branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/duster-page20-exact-scalar-import-closure-20260731
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Materialize and validate closure
        run: python tools/temporary_materialize_duster_page20_exact_scalar_import_closure.py
      - name: Commit final closure and remove temporary tools
        run: |
          rm .github/workflows/temporary-duster-page20-exact-scalar-import-closure.yml
          rm tools/temporary_materialize_duster_page20_exact_scalar_import_closure.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/reporting/duster_mini_page20_exact_scalar_import_closure.json \
            data/reporting/duster_mini_page20_exact_scalar_import_closure.md \
            project/reviews/duster-mini-page20-exact-scalar-import-closure-2026-07-30.md \
            project/state.json project/STATE_SUMMARY.md \
            .github/workflows/temporary-duster-page20-exact-scalar-import-closure.yml \
            tools/temporary_materialize_duster_page20_exact_scalar_import_closure.py
          git commit -m "docs(duster): close page 20 exact scalar import"
          git push origin HEAD:agent/duster-page20-exact-scalar-import-closure-20260731
