name: Temporary Jogger minimum kerb weight materialization

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/jogger-page19-minimum-kerb-weight-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/jogger-page19-minimum-kerb-weight-20260730
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install PDF text extraction backend
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Normalize materializer verifier block
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/temporary_materialize_jogger_minimum_kerb_weight.py')
          text = path.read_text(encoding='utf-8')
          old = '    replace_once(verifier, old, textwrap.indent(textwrap.dedent(block), "    "))\n'
          new = (
              '    block_lines = block.splitlines()\n'
              '    replacement = (\n'
              '        "    " + block_lines[0] + "\\n"\n'
              '        + textwrap.indent(textwrap.dedent("\\n".join(block_lines[1:])), "    ")\n'
              '        + "\\n"\n'
              '    )\n'
              '    replace_once(verifier, old, replacement)\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'verifier replacement target count is {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
      - name: Preserve exact ambiguous mass boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          checker = Path('tools/import_jogger_chassis_20260726.py')
          text = checker.read_text(encoding='utf-8')
          old = '    ensure(not any(row["source_code"] == SOURCE_CODE and row["attribute_code"] in MASS_ATTRIBUTES and row["observation_date"] == "2025-12-17" for row in read_rows(VALUE_PATH)), "ambiguous Jogger mass evidence was imported")\n'
          new = '''    ensure(
              not any(
                  row["source_code"] == SOURCE_CODE
                  and row["attribute_code"] in {"maximum_kerb_weight", "gross_vehicle_weight", "gross_train_weight"}
                  and row["observation_date"] == "2025-12-17"
                  for row in read_rows(VALUE_PATH)
              ),
              "ambiguous Jogger mass evidence was imported",
          )
          '''
          if text.count(old) != 1:
              raise SystemExit(f'ambiguous boundary replacement target count is {text.count(old)}')
          checker.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          materializer = Path('tools/temporary_materialize_jogger_minimum_kerb_weight.py')
          text = materializer.read_text(encoding='utf-8')
          old = '            "tools/review_official_brochure_technical_gap_resolution_closure_20260726.py",\n'
          new = old + '            "tools/import_jogger_chassis_20260726.py",\n'
          if text.count(old) != 1:
              raise SystemExit(f'manifest insertion target count is {text.count(old)}')
          materializer.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
      - name: Materialize and validate package
        run: python tools/temporary_materialize_jogger_minimum_kerb_weight.py
      - name: Commit final package and remove temporary tools
        run: |
          rm .github/workflows/temporary-jogger-minimum-kerb-weight-materialization.yml
          rm tools/temporary_materialize_jogger_minimum_kerb_weight.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/imports/configuration_values/jogger-brochure-minimum-kerb-weight-20251217.json \
            data/master/configuration_attribute_values.csv \
            tests/test_jogger_page19_minimum_kerb_weight_source_observations.py \
            tools/review_official_brochure_technical_gap_resolution_closure_20260726.py \
            tools/import_jogger_chassis_20260726.py \
            tests/test_official_brochure_technical_gap_resolution_closure.py \
            data/reporting/verified_pdf_candidate_coverage_reconciliation.json \
            data/reporting/verified_pdf_candidate_coverage_reconciliation.md \
            tests/test_verified_pdf_candidate_coverage_reconciliation.py \
            README.md CHANGELOG.md project/ROADMAP.md project/SESSION_STATE.md \
            project/state.json project/STATE_SUMMARY.md \
            .github/workflows/temporary-jogger-minimum-kerb-weight-materialization.yml \
            tools/temporary_materialize_jogger_minimum_kerb_weight.py
          git commit -m "data(jogger): add page 19 minimum kerb weights"
          git push origin HEAD:agent/jogger-page19-minimum-kerb-weight-20260730
