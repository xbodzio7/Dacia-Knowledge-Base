name: Diagnose Generic Dimension Evidence

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/diagnose-generic-dimension-quality.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/brochure-generic-dimensions-observation-import
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Persist missing reviewed-page diagnostics
        shell: bash
        run: |
          python tools/diagnose_gap_evidence_reviewed_pages_20260726.py
          cat .github/gap-evidence-reviewed-pages-diagnostics.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/gap-evidence-reviewed-pages-diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist reviewed-page diagnostics'
            git push origin HEAD:agent/brochure-generic-dimensions-observation-import
          fi
