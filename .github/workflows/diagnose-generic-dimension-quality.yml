name: Repair Generic Dimension Evidence

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/diagnose-generic-dimension-quality.yml
      - tools/repair_gap_evidence_reviewed_pages_20260726.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/brochure-generic-dimensions-observation-import
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Repair and verify evidence contracts
        shell: bash
        run: |
          python tools/repair_gap_evidence_reviewed_pages_20260726.py
          python tools/dkb.py configuration-gap-evidence \
            --json "${RUNNER_TEMP}/configuration-gap-evidence.json" \
            --markdown "${RUNNER_TEMP}/configuration-gap-evidence.md"
          python tools/dkb.py configuration-gap-resolution-plan \
            --json "${RUNNER_TEMP}/configuration-gap-resolution-plan.json" \
            --markdown "${RUNNER_TEMP}/configuration-gap-resolution-plan.md"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/reporting/configuration_gap_evidence.json \
            data/reporting/configuration_gap_resolution_plan.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(reporting): restore reviewed dimension pages'
            git push origin HEAD:agent/brochure-generic-dimensions-observation-import
          fi
