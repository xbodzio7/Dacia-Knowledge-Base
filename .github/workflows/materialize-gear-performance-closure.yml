name: Materialize Gear Performance Closure Review

on:
  push:
    branches:
      - agent/brochure-gear-performance-import-closure-review
    paths:
      - .github/workflows/materialize-gear-performance-closure.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out closure branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/brochure-gear-performance-import-closure-review
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Materialize closure state and verify
        shell: bash
        run: |
          set +e
          log=.github/gear-performance-closure.log
          : > "$log"
          status=0

          python - <<'PY' >> "$log" 2>&1 || status=$?
          import json
          from pathlib import Path

          state_path = Path('project/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['updated_on'] = '2026-07-26'
          state['phase'] = 'Brochure Gear-Specific Performance Import Closure Review'
          state['current_package'] = {
              'name': 'Brochure Gear-Specific Performance Import Closure Review',
              'status': 'complete',
              'goal': 'Verify the cross-model selected-gear import milestone, reporting preservation and all explicit non-import boundaries before selecting the next evidence package.',
          }
          state['next_package'] = {
              'name': 'Official Brochure Technical Gap Review',
              'status': 'planned',
              'goal': 'Classify the remaining non-cargo and non-selected-gear technical evidence in the archived official brochures, separating exact reusable observations from duplicates, ambiguous tables and evidence requiring additional context modeling.',
          }
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = '* Closed the selected-gear brochure performance milestone after verifying 70 exact observations across three sources, 31 configurations, six gear/fuel contexts, eight reporting surfaces and six explicit non-import boundaries.\n'
          if entry not in changelog:
              marker = '### Added\n\n'
              if marker not in changelog:
                  raise RuntimeError('CHANGELOG Added marker missing')
              changelog = changelog.replace(marker, marker + entry, 1)
              changelog_path.write_text(changelog, encoding='utf-8')
          print('PASS: closure state and changelog updated')
          PY

          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/review_brochure_gear_performance_import_closure_20260726.py --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py validate >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tests/test_brochure_gear_performance_import_closure_review.py -v >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' -v >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            git diff --check >> "$log" 2>&1 || status=$?
          fi

          cat "$log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'docs(data): materialize gear performance closure review'
            git push origin HEAD:agent/brochure-gear-performance-import-closure-review
          fi
          exit "$status"
