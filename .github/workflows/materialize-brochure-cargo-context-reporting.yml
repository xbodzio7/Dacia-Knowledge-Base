name: Materialize Brochure Cargo Context Reporting

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/materialize-brochure-cargo-context-reporting.yml
      - tools/establish_brochure_cargo_context_reporting_20260725.py
      - tools/reporting/cargo_context.py
      - tests/test_brochure_cargo_context_reporting_foundation.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/brochure-cargo-context-reporting-foundation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Materialize and verify reporting package
        run: |
          python tools/establish_brochure_cargo_context_reporting_20260725.py --apply
          python tools/dkb.py project-state --apply
          python tools/establish_brochure_cargo_context_reporting_20260725.py --check
          python tools/dkb.py project-state --check
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit materialized package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'feat(reporting): preserve cargo measurement context'
            git push origin HEAD:agent/brochure-cargo-context-reporting-foundation
          fi
