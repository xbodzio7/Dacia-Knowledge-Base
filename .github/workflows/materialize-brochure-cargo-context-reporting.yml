name: Materialize Brochure Cargo Context Reporting

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/materialize-brochure-cargo-context-reporting.yml
      - tools/establish_brochure_cargo_context_reporting_20260725.py
      - tools/reporting/cargo_context.py
      - tests/test_brochure_cargo_context_reporting_foundation.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/brochure-cargo-context-reporting-foundation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Repair fixture loading and reporting contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_brochure_cargo_context_reporting_foundation.py")
          text = test_path.read_text(encoding="utf-8")
          old_import = '''from tests.test_configuration_comparison import (  # noqa: E402
              ConfigurationComparisonTests,
          )
          '''.replace("          ", "")
          factory = '''def _configuration_comparison_fixture():
              from importlib.util import module_from_spec, spec_from_file_location

              spec = spec_from_file_location(
                  "dkb_test_configuration_comparison_fixture",
                  REPOSITORY / "tests" / "test_configuration_comparison.py",
              )
              if spec is None or spec.loader is None:
                  raise RuntimeError("cannot load comparison fixture")
              module = module_from_spec(spec)
              spec.loader.exec_module(module)
              return module.ConfigurationComparisonTests()
          '''.replace("          ", "")
          if factory not in text:
              if old_import not in text:
                  raise SystemExit("fixture import patch anchor missing")
              text = text.replace(old_import, factory + "\n", 1)
          text = text.replace(
              "        self.base = ConfigurationComparisonTests()\n",
              "        self.base = _configuration_comparison_fixture()\n",
              1,
          )
          test_path.write_text(text, encoding="utf-8")

          tool_path = Path("tools/establish_brochure_cargo_context_reporting_20260725.py")
          tool = tool_path.read_text(encoding="utf-8")
          changed = False

          comparison_anchor = "def _patch_comparison_base() -> None:\n"
          comparison_addition = '''def _patch_comparison_base() -> None:
              _patch(
                  BASE,
                  '            if not item and field != "fuel_type_code":\\n',
                  '            if not item and field not in {"fuel_type_code", "_cargo_context_signature"}:\\n',
                  'field not in {"fuel_type_code", "_cargo_context_signature"}',
              )
          '''.replace("          ", "")
          if 'field not in {"fuel_type_code", "_cargo_context_signature"}' not in tool:
              if comparison_anchor not in tool:
                  raise SystemExit("comparison base patch function anchor missing")
              tool = tool.replace(comparison_anchor, comparison_addition, 1)
              changed = True

          constant_anchor = 'WORKBOOK_ROWS = ROOT / "tools" / "reporting" / "configuration_comparison_workbook_rows.py"\n'
          constant_line = 'WORKBOOK_TEST = ROOT / "tests" / "test_configuration_comparison_workbook.py"\n'
          if constant_line not in tool:
              if constant_anchor not in tool:
                  raise SystemExit("workbook constant anchor missing")
              tool = tool.replace(constant_anchor, constant_anchor + constant_line, 1)
              changed = True

          workbook_anchor = "def _patch_workbook() -> None:\n"
          workbook_addition = '''def _patch_workbook() -> None:
              _patch(
                  WORKBOOK_TEST,
                  '            "A1:AQ204",\\n',
                  '            "A1:AS204",\\n',
                  '"A1:AS204",',
              )
          '''.replace("          ", "")
          if '"A1:AS204",' not in tool:
              if workbook_anchor not in tool:
                  raise SystemExit("workbook patch function anchor missing")
              tool = tool.replace(workbook_anchor, workbook_addition, 1)
              changed = True

          if changed:
              tool_path.write_text(tool, encoding="utf-8")
          PY

      - name: Materialize and persist diagnostics
        run: |
          set +e
          : > .github/cargo-reporting-diagnostic.log
          python tools/establish_brochure_cargo_context_reporting_20260725.py --apply >> .github/cargo-reporting-diagnostic.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> .github/cargo-reporting-diagnostic.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/establish_brochure_cargo_context_reporting_20260725.py --check >> .github/cargo-reporting-diagnostic.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> .github/cargo-reporting-diagnostic.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' >> .github/cargo-reporting-diagnostic.log 2>&1
            status=$?
          fi
          cat .github/cargo-reporting-diagnostic.log

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'chore(reporting): persist cargo context diagnostics'
            git push origin HEAD:agent/brochure-cargo-context-reporting-foundation
          fi
          exit "$status"
