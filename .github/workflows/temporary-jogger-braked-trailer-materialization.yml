name: Temporary Jogger braked trailer materialization

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/jogger-page19-braked-trailer-weight-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/jogger-page19-braked-trailer-weight-20260730
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install PDF text extraction backend
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Align global braked-trailer receipt
        run: |
          python - <<'PY'
          from pathlib import Path

          checker = Path('tools/review_official_brochure_technical_gap_resolution_closure_20260726.py')
          text = checker.read_text(encoding='utf-8')
          anchor = '    ensure(len(scalar) == expected_total, f"expected exactly {expected_total} brochure scalar values")\n'
          block = '''    jogger_braked_trailer_weight = [
              row
              for row in scalar
              if row.get("source_code") == "src_pl_jogger_brochure_20251217"
              and row.get("attribute_code") == "braked_trailer_weight"
          ]
          if jogger_braked_trailer_weight:
              ensure(len(jogger_braked_trailer_weight) == 16, "Jogger non-Hybrid braked-trailer source-observation receipt differs")
              ensure(
                  [int(row["id"]) for row in jogger_braked_trailer_weight] == list(range(3448, 3464)),
                  "Jogger non-Hybrid braked-trailer source-observation IDs differ",
              )
              ensure(
                  {row.get("configuration_code", "") for row in jogger_braked_trailer_weight}
                  == {
                      "jogger_expression_5seat_tce110_manual",
                      "jogger_extreme_5seat_tce110_manual",
                      "jogger_journey_5seat_tce110_manual",
                      "jogger_essential_5seat_ecog120_manual",
                      "jogger_expression_5seat_ecog120_manual",
                      "jogger_extreme_5seat_ecog120_manual",
                      "jogger_extreme_5seat_ecog120_automatic",
                      "jogger_journey_5seat_ecog120_automatic",
                      "jogger_expression_7seat_tce110_manual",
                      "jogger_extreme_7seat_tce110_manual",
                      "jogger_journey_7seat_tce110_manual",
                      "jogger_essential_7seat_ecog120_manual",
                      "jogger_expression_7seat_ecog120_manual",
                      "jogger_extreme_7seat_ecog120_manual",
                      "jogger_extreme_7seat_ecog120_automatic",
                      "jogger_journey_7seat_ecog120_automatic",
                  },
                  "Jogger non-Hybrid braked-trailer targets differ",
              )
              ensure(
                  {row.get("value", "") for row in jogger_braked_trailer_weight} == {"1200"},
                  "Jogger non-Hybrid braked-trailer values differ",
              )
              expected_scalar.update({"src_pl_jogger_brochure_20251217": 16})
              expected_total += 16
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'checker anchor count is {text.count(anchor)}')
          checker.write_text(text.replace(anchor, block + anchor), encoding='utf-8', newline='\n')

          test = Path('tests/test_official_brochure_technical_gap_resolution_closure.py')
          text = test.read_text(encoding='utf-8')
          replacements = [
              ('        "src_pl_jogger_brochure_20251217": 602,\n', '        "src_pl_jogger_brochure_20251217": 618,\n'),
              ('        self.assertEqual(len(self.scalar), 1298)\n', '        self.assertEqual(len(self.scalar), 1314)\n'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'test replacement target count is {text.count(old)}: {old!r}')
              text = text.replace(old, new)
          test.write_text(text, encoding='utf-8', newline='\n')

          materializer = Path('tools/temporary_materialize_jogger_braked_trailer_weight.py')
          text = materializer.read_text(encoding='utf-8')
          old = '            "tests/test_verified_pdf_candidate_residual_gap_prioritization.py",\n            "README.md",\n'
          new = (
              '            "tests/test_verified_pdf_candidate_residual_gap_prioritization.py",\n'
              '            "tools/review_official_brochure_technical_gap_resolution_closure_20260726.py",\n'
              '            "tests/test_official_brochure_technical_gap_resolution_closure.py",\n'
              '            "README.md",\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'manifest insertion target count is {text.count(old)}')
          materializer.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
      - name: Materialize and validate package
        run: python tools/temporary_materialize_jogger_braked_trailer_weight.py
      - name: Commit final package and remove temporary tools
        run: |
          rm .github/workflows/temporary-jogger-page19-braked-trailer-diagnostic.yml
          rm .github/workflows/temporary-jogger-braked-trailer-materialization.yml
          rm tools/temporary_materialize_jogger_braked_trailer_weight.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/imports/configuration_values/jogger-brochure-braked-trailer-weight-non-hybrid-20251217.json \
            data/master/configuration_attribute_values.csv \
            tests/test_jogger_page19_braked_trailer_weight_non_hybrid_source_observations.py \
            data/reporting/verified_pdf_candidate_coverage_reconciliation.json \
            data/reporting/verified_pdf_candidate_coverage_reconciliation.md \
            tests/test_verified_pdf_candidate_coverage_reconciliation.py \
            tests/test_verified_pdf_candidate_residual_gap_prioritization.py \
            tools/review_official_brochure_technical_gap_resolution_closure_20260726.py \
            tests/test_official_brochure_technical_gap_resolution_closure.py \
            README.md CHANGELOG.md project/ROADMAP.md project/SESSION_STATE.md \
            project/state.json project/STATE_SUMMARY.md \
            .github/workflows/temporary-jogger-page19-braked-trailer-diagnostic.yml \
            .github/workflows/temporary-jogger-braked-trailer-materialization.yml \
            tools/temporary_materialize_jogger_braked_trailer_weight.py
          git commit -m "data(jogger): add non-hybrid braked trailer weights"
          git push origin HEAD:agent/jogger-page19-braked-trailer-weight-20260730
