name: Materialize Brochure Cargo Closure

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/materialize-brochure-cargo-closure.yml
      - data/reporting/brochure_cargo_import_closure_review.json
      - tests/test_brochure_cargo_import_closure_review.py
      - project/state.json

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/brochure-cargo-import-closure-review
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Synchronize closure and run tests
        run: |
          set +e
          : > .github/brochure-cargo-closure-diagnostic.log
          status=0
          python tools/dkb.py project-state --apply >> .github/brochure-cargo-closure-diagnostic.log 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> .github/brochure-cargo-closure-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tests/test_brochure_cargo_import_closure_review.py -v >> .github/brochure-cargo-closure-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' -v >> .github/brochure-cargo-closure-diagnostic.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            git diff --check >> .github/brochure-cargo-closure-diagnostic.log 2>&1 || status=$?
          fi
          cat .github/brochure-cargo-closure-diagnostic.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(data): persist brochure cargo closure review'
            git push origin HEAD:agent/brochure-cargo-import-closure-review
          fi
          exit "$status"
