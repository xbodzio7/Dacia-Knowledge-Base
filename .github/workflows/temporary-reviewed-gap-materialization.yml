name: Temporary Reviewed Gap Materialization

on:
  push:
    branches:
      - agent/reviewed-gap-state-materialization-20260802
    paths:
      - .github/workflows/temporary-reviewed-gap-materialization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Assemble and apply package
        shell: bash
        run: |
          cat \
            .github/materialization_parts/part1.txt \
            .github/materialization_parts/part2.txt \
            .github/materialization_parts/part3.txt \
            .github/materialization_parts/part4.txt \
            .github/materialization_parts/part5.txt \
            > tools/apply_reviewed_gap_state_materialization_20260802.py
          python -m py_compile tools/apply_reviewed_gap_state_materialization_20260802.py
          python tools/apply_reviewed_gap_state_materialization_20260802.py
          python tools/dkb.py project-state --apply
          python -m unittest -q \
            tests.test_reviewed_gap_state_materialization_20260802 \
            tests.test_registered_source_completeness_reconciliation_20260802 \
            tests.test_sandero_residual_source_closure_20260801
      - name: Commit generated package
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            CHANGELOG.md \
            README.md \
            data/imports/reviewed_gap_state_materialization_20260802.csv \
            data/master/commercial_item_configurations.csv \
            data/reporting/reviewed_gap_state_materialization.json \
            data/reporting/reviewed_gap_state_materialization.md \
            project/ROADMAP.md \
            project/SESSION_STATE.md \
            project/packages/reviewed-gap-state-materialization-20260802.md \
            project/state.json \
            project/STATE_SUMMARY.md \
            tests/test_registered_source_completeness_reconciliation_20260802.py \
            tests/test_reviewed_gap_state_materialization_20260802.py \
            tests/test_sandero_residual_source_closure_20260801.py \
            tools/apply_reviewed_gap_state_materialization_20260802.py \
            tools/configuration_shortlist.py \
            tools/reporting/configuration_shortlist_selection.js \
            tools/reporting/configuration_shortlist_v12_pricing.js
          git diff --cached --check
          git commit -m 'data: materialize reviewed gap states'
          git push
