name: Inspect Final Orchestration

on:
  push:
    branches:
      - agent/brochure-gear-performance-value-import
    paths:
      - .github/workflows/inspect-final-orchestration.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/brochure-gear-performance-value-import
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
      - name: Run remaining contracts
        shell: bash
        run: |
          set +e
          log=.github/final-orchestration.log
          python -m unittest -v \
            tests.configuration_comparison_context_filter_contract.ConfigurationComparisonContextFilterContractTests.test_repository_snapshot_context_counts_and_default_compatibility \
            tests.configuration_comparison_pair_summary_contract.ConfigurationComparisonPairSummaryContractTests.test_repository_snapshot_has_21_pairs_and_expected_types \
            > "$log" 2>&1
          status=$?
          cat "$log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$log"
          if ! git diff --cached --quiet; then
            git commit -m 'chore(test): persist final orchestration diagnostics'
            git push origin HEAD:agent/brochure-gear-performance-value-import
          fi
          exit "$status"
