name: Temporary Finalize And Clean Spring White

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-finalize-and-clean-spring-white.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-biel-alpejska-default-colour-migration-20260802
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set exact package manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("project/state.json")
          state = json.loads(path.read_text(encoding="utf-8"))
          state["current_package"]["manifest_paths"] = [
              "CHANGELOG.md",
              "README.md",
              "data/imports/configuration_values/spring_biel_alpejska_default_colour_20260802.json",
              "data/master/commercial_item_configurations.csv",
              "data/master/configuration_attribute_values.csv",
              "data/reporting/spring_biel_alpejska_default_colour_migration.json",
              "data/reporting/spring_biel_alpejska_default_colour_migration.md",
              "project/SESSION_STATE.md",
              "project/STATE_SUMMARY.md",
              "project/packages/spring-biel-alpejska-default-colour-migration-20260802.md",
              "project/state.json",
              "tests/test_registered_source_completeness_reconciliation_20260802.py",
              "tests/test_reviewed_gap_state_materialization_20260802.py",
              "tests/test_spring_biel_alpejska_default_colour_migration_20260802.py",
              "tests/test_spring_commercial_context_resolution_20260802.py",
              "tests/test_spring_current_grade_snapshot_capture_20260802.py",
              "tests/test_spring_essential_khaki_price_apply_20260802.py",
              "tests/test_spring_exact_current_semantic_migration_review_20260802.py",
              "tests/test_spring_exterior_colour_options.py",
              "tests/test_spring_standard_equipment_representation_review_20260802.py",
              "tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py",
              "tools/import_spring_exterior_colour_options.py",
              "tools/review_spring_standard_equipment_representation_20260802.py"
          ]
          path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Regenerate and verify package
        run: |
          python tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py --apply
          python tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py --verify
          python tools/review_spring_standard_equipment_representation_20260802.py --verify
          python tools/import_spring_exterior_colour_options.py --check

      - name: Refresh managed documentation
        run: |
          python tools/documentation_baseline.py --apply
          python tools/documentation_baseline.py --check

      - name: Run focused contracts
        run: |
          python -m unittest -v \
            tests.test_spring_biel_alpejska_default_colour_migration_20260802 \
            tests.test_spring_standard_equipment_representation_review_20260802 \
            tests.test_spring_exact_current_semantic_migration_review_20260802 \
            tests.test_spring_exterior_colour_options \
            tests.test_reviewed_gap_state_materialization_20260802

      - name: Remove temporary files
        run: |
          git rm -f .github/workflows/temp-*.yml || true
          rm -f \
            project/tmp_configuration_value_spec_probe.json \
            project/tmp_spring_white_finalization_status.txt \
            tools/temp_repair_spring_white_history.py
          git add -A

      - name: Commit finalized package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No finalization changes"
          else
            git commit -m "data: finalize Spring Essential default colour"
            git push origin HEAD:agent/spring-biel-alpejska-default-colour-migration-20260802
          fi
