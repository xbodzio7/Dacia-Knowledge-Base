name: Materialize Configurator Conflict Closure

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: materialize-configurator-conflict-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/cross-model-configurator-conflict-closure-001'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Apply canonical project state
        run: python tools/dkb.py project-state --apply
      - name: Verify closure contracts
        run: |
          python -m unittest -v tests.test_cross_model_configurator_conflict_closure_20260805
          python tools/dkb.py project-state --check
      - name: Commit generated documentation
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          rm .github/workflows/materialize-configurator-conflict-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(project): materialize configurator closure state"
          git push origin "HEAD:${HEAD_BRANCH}"
