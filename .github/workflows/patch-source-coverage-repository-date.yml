name: Temporary Source Coverage Repository Date Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Align source coverage default date
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/_source_coverage_base.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if as_of_value is None:
              dated_values: list[date] = []
              for row in sources:
                  if row.get("code") in scoped_source_codes and row.get("document_date"):
                      dated_values.append(
                          iso_date(row["document_date"], "source document_date")
                      )
              for rows, field, label in (
                  (prices, "price_date", "configuration price"),
                  (values, "observation_date", "configuration value"),
                  (ranges, "observation_date", "configuration value range"),
                  (
                      availability,
                      "observation_date",
                      "configuration availability",
                  ),
              ):
                  for row in rows:
                      if (
                          row.get("configuration_code") in configuration_sources
                          and row.get(field)
                      ):
                          dated_values.append(iso_date(row[field], label))
              if not dated_values:
                  raise SourceCoverageError("no dated source-backed records found")
              as_of = max(dated_values)
          '''
          new = '''    if as_of_value is None:
              # Use the same repository-wide observation clock as
              # configuration-completeness so downstream gap triage combines
              # reports generated for one deterministic date. The selected
              # reporting subset still controls record and source counts.
              dated_values: list[date] = []
              for rows, field, label in (
                  (values, "observation_date", "configuration value"),
                  (ranges, "observation_date", "configuration value range"),
                  (
                      availability,
                      "observation_date",
                      "configuration availability",
                  ),
              ):
                  for row in rows:
                      if row.get(field):
                          dated_values.append(iso_date(row[field], label))
              if not dated_values:
                  raise SourceCoverageError("no dated configuration observations found")
              as_of = max(dated_values)
          '''
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit("expected source coverage date block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/_source_coverage_base.py
          git commit -m "fix(reporting): align source coverage report date"
          git push origin HEAD:${{ github.head_ref }}
