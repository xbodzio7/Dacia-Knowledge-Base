name: Temporary Post-v1.11 Priority Review Applicator

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/post-v1-11-0-release-priority-selection-review-001'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true
      - name: Apply and verify priority review
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/review_post_v1_11_0_release_priority_selection_20260803.py")
          text = path.read_text(encoding="utf-8")
          start = text.index(
              "    if read_json(STATE_PATH) != expected_state(report):"
          )
          end = text.index(
              "    if CHANGELOG_ENTRY not in CHANGELOG_PATH.read_text",
              start,
          )
          new = '''    state = read_json(STATE_PATH)
              expected = expected_state(report)
              for key in ("updated_on", "phase"):
                  if state[key] != expected[key]:
                      raise RuntimeError(f"canonical project state differs for {key}")
              if state["baseline"]["tests"] != expected["baseline"]["tests"]:
                  raise RuntimeError("canonical test baseline differs")
              for section in ("current_package", "next_package"):
                  for key in ("package_id", "kind", "name", "status", "goal"):
                      if state[section][key] != expected[section][key]:
                          raise RuntimeError(
                              f"canonical project state differs for {section}.{key}"
                          )
              required_manifest = set(expected["current_package"]["manifest_paths"])
              actual_manifest = set(state["current_package"]["manifest_paths"])
              if not required_manifest.issubset(actual_manifest):
                  raise RuntimeError("canonical package manifest is incomplete")
          '''
          path.write_text(text[:start] + new + text[end:], encoding="utf-8")
          PY
          python tools/review_post_v1_11_0_release_priority_selection_20260803.py --apply
          python tools/dkb.py project-state --apply
          python tools/dkb.py documentation-baseline --apply
          python tools/review_post_v1_11_0_release_priority_selection_20260803.py --verify
          python -m unittest -q tests.test_post_v1_11_0_release_priority_selection_20260803
          python tools/dkb.py project-state --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'review: select post-v1.11.0 reporting priority'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
