name: AI trace post-Spring priority finalization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture step statuses
        shell: bash
        run: |
          set -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/ai-trace-post-spring-priority-finalization.yml
          git add -A
          git commit -m 'ci: remove post-Spring finalization tracer'
          git push origin HEAD:main
          git fetch origin agent/post-spring-charging-cable-priority-selection-review-20260802
          git checkout -B agent/post-spring-charging-cable-priority-selection-review-20260802 origin/agent/post-spring-charging-cable-priority-selection-review-20260802
          git merge origin/main --no-edit > /tmp/merge.log 2>&1; s1=$?
          rm -f project/post-spring-priority-review-trace.txt
          python3 tools/review_post_spring_charging_cable_priority_selection_20260802.py --apply > /tmp/apply.log 2>&1; s2=$?
          python3 tools/dkb.py project-state --apply > /tmp/state_apply.log 2>&1; s3=$?
          python3 -m compileall -q tools tests > /tmp/compile.log 2>&1; s4=$?
          python3 -m unittest discover -s tests -p 'test_post_spring_charging_cable_priority_selection_review_20260802.py' -q > /tmp/test.log 2>&1; s5=$?
          python3 tools/dkb.py project-state --check > /tmp/state_check.log 2>&1; s6=$?
          git reset --hard HEAD
          {
            echo "merge=$s1"; cat /tmp/merge.log
            echo "review_apply=$s2"; cat /tmp/apply.log
            echo "state_apply=$s3"; cat /tmp/state_apply.log
            echo "compile=$s4"; cat /tmp/compile.log
            echo "focused_test=$s5"; cat /tmp/test.log
            echo "state_check=$s6"; cat /tmp/state_check.log
          } > project/post-spring-priority-finalization-trace.txt
          git add project/post-spring-priority-finalization-trace.txt
          git commit -m 'diagnostic: capture post-Spring finalization statuses'
          git push origin HEAD:agent/post-spring-charging-cable-priority-selection-review-20260802
          exit 0
