name: AI archive all current Dacia configurator PDFs v4

on:
  push:
    branches:
      - ai/dacia-configurator-pdf-archive-20260809
    paths:
      - .github/workflows/ai-dacia-configurator-pdf-archive-v4.yml

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tooling
        run: python -m pip install --quiet selenium pypdf requests pyyaml
      - name: Prepare corrected archive scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/ai-dacia-configurator-pdf-archive-v3.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['archive']['steps']
          by_name = {step.get('name'): step.get('run') for step in steps if step.get('name') and step.get('run')}
          archive = by_name['Download and validate all current native configurator PDFs']
          old_text = "text='\\n'.join((p.extract_text() or '') for p in reader.pages[:3])"
          new_text = "text='\\n'.join((p.extract_text() or '') for p in reader.pages)"
          if archive.count(old_text) != 1:
              raise SystemExit(f'expected one first-three-pages extraction, found {archive.count(old_text)}')
          archive = archive.replace(old_text, new_text)
          old_code = "m=re.search(r'kod konfiguracji:\\s*([A-Z0-9]{6})',text,re.I)"
          new_code = "code_text=unicodedata.normalize('NFKC',text).replace('ﬁ','fi').replace('ﬂ','fl'); m=re.search(r'kod\\s+konfiguracji\\s*:?\\s*([A-Z0-9]{6})',code_text,re.I|re.S)"
          if archive.count(old_code) != 1:
              raise SystemExit(f'expected one Dacia-code parser, found {archive.count(old_code)}')
          archive = archive.replace(old_code, new_code)
          Path('/tmp/archive.sh').write_text(archive, encoding='utf-8')
          Path('/tmp/verify.sh').write_text(by_name['Verify archive before commit'], encoding='utf-8')
          Path('/tmp/commit.sh').write_text(by_name['Commit native archive'], encoding='utf-8')
          PY
      - name: Download and validate all 70 native PDFs
        shell: bash
        run: bash /tmp/archive.sh
      - name: Verify complete archive
        shell: bash
        run: bash /tmp/verify.sh
      - name: Commit native archive
        shell: bash
        run: bash /tmp/commit.sh
