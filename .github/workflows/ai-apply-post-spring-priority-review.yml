name: AI apply post-Spring priority review

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply review package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm .github/workflows/ai-apply-post-spring-priority-review.yml
          git add -A
          git commit -m 'ci: remove post-Spring priority review runner'
          git push origin HEAD:main

          git fetch origin agent/post-spring-charging-cable-priority-selection-review-20260802
          git checkout -B agent/post-spring-charging-cable-priority-selection-review-20260802 origin/agent/post-spring-charging-cable-priority-selection-review-20260802
          git merge origin/main --no-edit
          python3 tools/review_post_spring_charging_cable_priority_selection_20260802.py --apply
          python3 tools/dkb.py project-state --apply
          python3 -m compileall -q tools tests
          python3 -m unittest discover -s tests -p 'test_post_spring_charging_cable_priority_selection_review_20260802.py' -q
          python3 tools/dkb.py project-state --check
          git add -A
          git commit -m 'review: select post-Spring charging cable priority'
          git push origin HEAD:agent/post-spring-charging-cable-priority-selection-review-20260802
