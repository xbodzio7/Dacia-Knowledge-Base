name: Agent Portfolio Source Coverage Matrix

on:
  push:
    branches:
      - agent/portfolio-source-coverage-matrix-001
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-portfolio-source-coverage-matrix
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/portfolio-source-coverage-matrix-001
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Integrate source matrix regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/version_matrix_checks.py")
          text = path.read_text(encoding="utf-8")
          import_line = "from source_matrix_checks import run_source_matrix_checks\n"
          if import_line not in text:
              marker = "from typing import Any\n\n"
              if marker not in text:
                  raise RuntimeError("version matrix import anchor not found")
              text = text.replace(marker, marker + import_line + "\n", 1)
          call_line = "    run_source_matrix_checks(testcase, repository)\n"
          if call_line not in text:
              text = text.rstrip() + "\n\n" + call_line
          path.write_text(text, encoding="utf-8", newline="")
          PY

      - name: Generate deterministic products
        run: |
          python tools/portfolio_source_coverage_matrix.py \
            --json data/reporting/portfolio_source_coverage_matrix.json \
            --csv data/reporting/portfolio_source_coverage_matrix.csv \
            --html data/reporting/portfolio_source_coverage_matrix.html

      - name: Run focused verification
        run: |
          python -m compileall -q tools tests
          python -m unittest -q tests.test_portfolio_model_family_summary
          python tools/dkb.py project-state --check

      - name: Commit verified products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/reporting/portfolio_source_coverage_matrix.csv \
            data/reporting/portfolio_source_coverage_matrix.html \
            data/reporting/portfolio_source_coverage_matrix.json \
            tests/version_matrix_checks.py
          if git diff --cached --quiet; then
            echo "Verified products are already materialized."
            exit 0
          fi
          git commit -m "feat(reporting): materialize source coverage matrix"
          git push origin HEAD:agent/portfolio-source-coverage-matrix-001
