name: Export main for equipment facet fix PR

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/export-main-equipment-facet-fix-pr.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - run: git rev-parse HEAD | tee MAIN_SHA.txt
      - name: Build snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('.')
          out=Path('dkb-main-equipment-facet-fix.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and p != out and '.git' not in p.parts and '__pycache__' not in p.parts:
                      z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dkb-main-equipment-facet-fix
          path: |
            dkb-main-equipment-facet-fix.zip
            MAIN_SHA.txt
          retention-days: 1
