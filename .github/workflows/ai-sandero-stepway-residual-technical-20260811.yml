name: AI Sandero Stepway residual technical materialization 20260811

on:
  push:
    branches:
      - agent/sandero-stepway-full-modal-residual-technical-001
    paths:
      - .github/workflows/ai-sandero-stepway-residual-technical-20260811.yml
      - tools/materialize_sandero_stepway_full_modal_residual_technical_20260811.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sandero-stepway-full-modal-residual-technical-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify candidate contract
        run: python -m unittest tests.test_sandero_stepway_full_modal_residual_technical_20260811 -v
      - name: Materialize scalar technical residual candidates
        run: python tools/materialize_sandero_stepway_full_modal_residual_technical_20260811.py --apply
      - name: Verify materialization
        run: |
          python tools/materialize_sandero_stepway_full_modal_residual_technical_20260811.py
          python -m unittest tests.test_sandero_stepway_full_modal_residual_technical_20260811 -v
      - name: Commit materialized data and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master/configuration_attribute_values.csv
          git rm .github/workflows/ai-sandero-stepway-residual-technical-20260811.yml
          git commit -m "data(sandero): materialize residual technical scalars"
          git push origin HEAD:agent/sandero-stepway-full-modal-residual-technical-001
