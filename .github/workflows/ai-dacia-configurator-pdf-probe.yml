name: AI Dacia configurator PDF probe

on:
  push:
    branches:
      - ai/dacia-configurator-pdf-archive-20260809
    paths:
      - .github/workflows/ai-dacia-configurator-pdf-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tooling
        run: python -m pip install --quiet selenium pypdf requests
      - name: Capture one native configurator PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, time
          from pathlib import Path
          import requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from pypdf import PdfReader

          out = Path('/tmp/dacia-pdf-probe').resolve()
          out.mkdir(parents=True, exist_ok=True)
          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1600,1200')
          opts.add_argument('--lang=pl-PL')
          opts.set_capability('goog:loggingPrefs', {'performance': 'ALL'})
          opts.add_experimental_option('prefs', {
              'download.default_directory': str(out),
              'download.prompt_for_download': False,
              'download.directory_upgrade': True,
              'plugins.always_open_pdf_externally': True,
          })
          driver = webdriver.Chrome(options=opts)
          try:
              driver.execute_cdp_cmd('Page.setDownloadBehavior', {'behavior':'allow','downloadPath':str(out)})
              url='https://www.dacia.pl/hybrydy-i-elektryczne/bigster-suv/konfigurator.html'
              driver.get(url)
              time.sleep(12)
              for txt in ['Akceptuj wszystkie','Akceptuj','Zaakceptuj wszystkie','Zgadzam się']:
                  try:
                      for el in driver.find_elements(By.XPATH, f"//*[self::button or self::a][contains(normalize-space(.), '{txt}')]"):
                          driver.execute_script('arguments[0].click()', el)
                          time.sleep(1)
                          raise StopIteration
                  except StopIteration:
                      break
                  except Exception:
                      pass

              matches = driver.execute_script(r'''
                return [...document.querySelectorAll('button,[role="button"]')]
                  .filter(el => ((el.innerText||el.getAttribute('aria-label')||'').toLowerCase().includes('pdf')))
                  .map((el,i) => ({
                    index:i,
                    text:(el.innerText||el.getAttribute('aria-label')||'').trim(),
                    cls:el.className,
                    display:getComputedStyle(el).display,
                    visibility:getComputedStyle(el).visibility,
                    rect:[el.getBoundingClientRect().x,el.getBoundingClientRect().y,el.getBoundingClientRect().width,el.getBoundingClientRect().height],
                    html:el.outerHTML.slice(0,1200)
                  }));
              ''')
              print('PDF DOM matches:', json.dumps(matches, ensure_ascii=False, indent=2), flush=True)
              if not matches:
                  raise SystemExit('No PDF control in DOM')
              driver.execute_script(r'''
                const els=[...document.querySelectorAll('button,[role="button"]')]
                  .filter(el => ((el.innerText||el.getAttribute('aria-label')||'').toLowerCase().includes('pdf')));
                const target=els.find(el => el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden') || els[0];
                target.scrollIntoView({block:'center'});
                target.click();
              ''')
              time.sleep(15)

              network=[]
              for entry in driver.get_log('performance'):
                  try:
                      msg=json.loads(entry['message'])['message']
                  except Exception:
                      continue
                  if msg.get('method') != 'Network.responseReceived':
                      continue
                  resp=msg.get('params',{}).get('response',{})
                  u=resp.get('url','')
                  mime=resp.get('mimeType','')
                  if ('pdf' in u.lower() or 'download' in u.lower() or 'document' in u.lower() or mime == 'application/pdf'):
                      network.append({'url':u,'mimeType':mime,'status':resp.get('status')})
              print('Candidate network responses:', json.dumps(network[-30:], ensure_ascii=False, indent=2), flush=True)

              pdf=None
              deadline=time.time()+45
              while time.time()<deadline:
                  candidates=[p for p in out.iterdir() if p.suffix.lower()=='.pdf']
                  partial=list(out.glob('*.crdownload'))
                  if candidates and not partial:
                      p=max(candidates,key=lambda x:x.stat().st_mtime)
                      if p.stat().st_size>10000:
                          pdf=p; break
                  time.sleep(1)

              downloaded_by='browser'
              if pdf is None:
                  session=requests.Session()
                  for c in driver.get_cookies():
                      session.cookies.set(c['name'], c['value'], domain=c.get('domain'))
                  headers={'User-Agent': driver.execute_script('return navigator.userAgent')}
                  for item in reversed(network):
                      u=item['url']
                      if item['mimeType']=='application/pdf' or '.pdf' in u.lower():
                          r=session.get(u,headers=headers,timeout=60)
                          if r.ok and r.content.startswith(b'%PDF-'):
                              pdf=out/'native-configurator-probe.pdf'
                              pdf.write_bytes(r.content)
                              downloaded_by='network_replay'
                              break
              if pdf is None:
                  Path('project/sources/dacia-pl-configurator-native-pdf-probe-20260809.json').write_text(
                      json.dumps({'status':'failed','dom_matches':matches,'network_candidates':network[-30:]},ensure_ascii=False,indent=2)+'\n', encoding='utf-8')
                  raise SystemExit('Native PDF was not captured')

              raw=pdf.read_bytes()
              if not raw.startswith(b'%PDF-'):
                  raise SystemExit('Captured file is not PDF')
              reader=PdfReader(str(pdf))
              text='\n'.join((page.extract_text() or '') for page in reader.pages[:2])[:5000]
              meta={
                  'status':'success',
                  'downloaded_by':downloaded_by,
                  'filename':pdf.name,
                  'bytes':len(raw),
                  'sha256':hashlib.sha256(raw).hexdigest(),
                  'pages':len(reader.pages),
                  'source_url':driver.current_url,
                  'title':driver.title,
                  'text_sample':text,
                  'network_candidates':network[-30:]
              }
              print(json.dumps(meta,ensure_ascii=False,indent=2),flush=True)
              Path('project/sources/dacia-pl-configurator-native-pdf-probe-20260809.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          finally:
              driver.quit()
          PY
      - name: Commit probe metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f project/sources/dacia-pl-configurator-native-pdf-probe-20260809.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/sources/dacia-pl-configurator-native-pdf-probe-20260809.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(source): inspect native configurator PDF request"
            git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
          fi
