name: AI Rematerialize Sandero Residual Equipment

on:
  push:
    branches:
      - agent/sandero-stepway-full-modal-residual-equipment-001

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/sandero-stepway-full-modal-residual-equipment-001
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize residual equipment
        run: python tools/materialize_sandero_stepway_full_modal_residual_equipment_20260910.py --apply

      - name: Commit materialized rows
        run: |
          if git diff --quiet -- data/master/configuration_attribute_availability.csv; then
            echo 'No materialization changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/master/configuration_attribute_availability.csv
          git commit -m 'data(sandero): materialize residual standard equipment'
          git push origin HEAD:agent/sandero-stepway-full-modal-residual-equipment-001
