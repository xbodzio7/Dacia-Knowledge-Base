name: Materialize PDF Candidate Coverage Reconciliation

on:
  push:
    branches:
      - agent/pdf-candidate-coverage-reconciliation-20260728
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: materialize-pdf-candidate-coverage-reconciliation
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/pdf-candidate-coverage-reconciliation-20260728
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install PDF extraction backend
        run: |
          if ! command -v pdftotext >/dev/null 2>&1 || ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
          pdftotext -v
          pdfinfo -v

      - name: Materialize package sources
        run: |
          cat .github/materializer/pdf-candidate-coverage-reconciliation/payload-*.txt > "${RUNNER_TEMP}/payload.b64"
          base64 --decode "${RUNNER_TEMP}/payload.b64" > "${RUNNER_TEMP}/payload.tar.gz"
          tar -xzf "${RUNNER_TEMP}/payload.tar.gz" -C .
          python .github/materializer/apply_patch.py

      - name: Generate deterministic reconciliation artifacts
        run: |
          python tools/dkb.py pdf-candidate-coverage-reconciliation
          python tools/dkb.py project-state --apply

      - name: Verify package contract and boundaries
        env:
          BASE_SHA: d86e581836e949d20369ba85d94192e430761aa5
        run: |
          python tools/dkb.py pdf-candidate-coverage-reconciliation --verify
          python tools/dkb.py project-state --check
          git diff --exit-code "${BASE_SHA}" -- data/master data/imports

      - name: Run full quality gate
        run: |
          python tools/dkb.py quality \
            --concise \
            --database "${RUNNER_TEMP}/dacia_knowledge_base.sqlite" \
            --log-file "${RUNNER_TEMP}/quality.log" \
            --summary-json "${RUNNER_TEMP}/quality-summary.json"

      - name: Commit final package tree
        env:
          BASE_SHA: d86e581836e949d20369ba85d94192e430761aa5
        run: |
          rm -f .github/workflows/materialize-pdf-candidate-coverage-reconciliation.yml
          rm -rf .github/materializer

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          python - <<'PY'
          import os
          import subprocess

          base = os.environ["BASE_SHA"]
          allowed = {
              "CHANGELOG.md",
              "README.md",
              "data/reporting/verified_pdf_candidate_coverage_reconciliation.json",
              "data/reporting/verified_pdf_candidate_coverage_reconciliation.md",
              "project/ROADMAP.md",
              "project/SESSION_STATE.md",
              "project/STATE_SUMMARY.md",
              "project/reviews/verified-pdf-candidate-coverage-reconciliation-2026-07-28.md",
              "project/state.json",
              "tests/test_verified_pdf_candidate_coverage_reconciliation.py",
              "tools/dkb.py",
              "tools/verified_pdf_candidate_coverage_reconciliation.py",
          }
          required = {
              "data/reporting/verified_pdf_candidate_coverage_reconciliation.json",
              "data/reporting/verified_pdf_candidate_coverage_reconciliation.md",
              "project/state.json",
              "tests/test_verified_pdf_candidate_coverage_reconciliation.py",
              "tools/verified_pdf_candidate_coverage_reconciliation.py",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only", base],
                  text=True,
              ).splitlines()
          )
          unexpected = sorted(changed - allowed)
          missing = sorted(required - changed)
          if unexpected or missing:
              raise SystemExit(
                  f"package allowlist failure; unexpected={unexpected}; missing={missing}"
              )
          print(f"Final package contains {len(changed)} allowed paths")
          PY

          git commit -m "tooling(pdf): reconcile verified candidate coverage"
          git push origin HEAD:agent/pdf-candidate-coverage-reconciliation-20260728
