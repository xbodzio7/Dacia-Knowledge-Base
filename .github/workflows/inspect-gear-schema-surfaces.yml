name: Materialize Gear Performance Schema

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/inspect-gear-schema-surfaces.yml
      - tools/establish_brochure_gear_performance_schema_20260726.py
      - tools/validators/gear_contexts.py
      - tests/test_brochure_gear_performance_schema_foundation.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out schema branch
        uses: actions/checkout@v4
        with:
          ref: agent/brochure-gear-performance-schema-foundation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Materialize schema and run tests
        run: |
          set +e
          : > .github/gear-schema-materialization.log
          status=0
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/establish_brochure_gear_performance_schema_20260726.py')
          text = path.read_text(encoding='utf-8')
          old = "replace_once(path, '                \"fuel_type_code\": fuel,\\n                \"value\": row.value,', '                \"fuel_type_code\": fuel,\\n                \"gear_number\": gear,\\n                \"value\": row.value,')"
          new = "replace_once(path, '                \"fuel_type_code\": fuel,\\n                \"gear_number\": \"\",\\n                \"value\": row.value,', '                \"fuel_type_code\": fuel,\\n                \"gear_number\": gear,\\n                \"value\": row.value,')"
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          elif new not in text:
              raise SystemExit('materializer repair anchor missing')
          PY
          python tools/establish_brochure_gear_performance_schema_20260726.py >> .github/gear-schema-materialization.log 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> .github/gear-schema-materialization.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py validate >> .github/gear-schema-materialization.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> .github/gear-schema-materialization.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tests/test_brochure_gear_performance_schema_foundation.py -v >> .github/gear-schema-materialization.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' -v >> .github/gear-schema-materialization.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            git diff --check >> .github/gear-schema-materialization.log 2>&1 || status=$?
          fi
          cat .github/gear-schema-materialization.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(schema): persist selected-gear foundation'
            git push origin HEAD:agent/brochure-gear-performance-schema-foundation
          fi
          exit "$status"
