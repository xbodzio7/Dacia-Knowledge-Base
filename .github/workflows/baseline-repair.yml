name: Baseline Repair

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open same-repository PR number to repair"
        required: true
        type: number
      pr_branch:
        description: "Exact same-repository PR head branch"
        required: true
        type: string
      expected_head_sha:
        description: "Exact current 40-character PR head SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: baseline-repair-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-baseline-repair:
    name: Generate canonical baseline repair (read-only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branch: ${{ steps.verify.outputs.branch }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
      pr_number: ${{ steps.verify.outputs.pr_number }}
    steps:
      - name: Verify exact open same-repository PR head
        id: verify
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const number = Number(context.payload.inputs.pr_number);
            const expected = String(context.payload.inputs.expected_head_sha || "");
            const expectedBranch = String(context.payload.inputs.pr_branch || "");
            if (!/^[A-Za-z0-9._/-]{1,200}$/.test(expectedBranch) || expectedBranch.startsWith("-") || expectedBranch.includes("..")) {
              throw new Error("Provide a valid PR branch name.");
            }
            if (!Number.isInteger(number) || number < 1 || !/^[0-9a-f]{40}$/.test(expected)) {
              throw new Error("Provide a valid PR number and exact 40-character lowercase head SHA.");
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: number
            });
            if (pr.state !== "open" || pr.base.ref !== "main") {
              throw new Error("Target must be an open PR against main.");
            }
            if (!pr.head.repo || pr.head.repo.full_name.toLowerCase() !== `${context.repo.owner}/${context.repo.repo}`.toLowerCase()) {
              throw new Error("Fork PRs are not eligible for a baseline repair.");
            }
            if (pr.head.ref !== expectedBranch) {
              throw new Error(`Branch mismatch: supplied ${expectedBranch}, current PR branch is ${pr.head.ref}.`);
            }
            if (pr.head.sha !== expected) {
              throw new Error(`Stale SHA: supplied ${expected}, current PR head is ${pr.head.sha}.`);
            }
            core.setOutput("branch", pr.head.ref);
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("pr_number", String(number));

      - name: Check out the verified immutable PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.verify.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Apply canonical project-state generator
        env:
          DKB_EXPECTED_REPOSITORY: ${{ github.repository }}
          DKB_EXPECTED_DEFAULT_BRANCH: main
          DKB_EXPECTED_BASE_BRANCH: main
        run: python tools/dkb.py project-state --apply

      - name: Apply canonical documentation baseline generator
        run: python tools/dkb.py documentation-baseline --apply

      - name: Recheck both generated baselines
        env:
          DKB_EXPECTED_REPOSITORY: ${{ github.repository }}
          DKB_EXPECTED_DEFAULT_BRANCH: main
          DKB_EXPECTED_BASE_BRANCH: main
        run: |
          python tools/dkb.py project-state --check
          python tools/dkb.py documentation-baseline --check

      - name: Reject unexpected generated paths
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short --untracked-files=all | sed -E 's/^...//')"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              CHANGELOG.md|README.md|project/ROADMAP.md|project/SESSION_STATE.md|project/state.json|project/STATE_SUMMARY.md)
                ;;
              *)
                echo "Unexpected generated path: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"
          [[ -n "$changed" ]] || {
            echo "No baseline changes were generated; nothing to repair."
            exit 1
          }

      - name: Upload canonical generated files for reviewed write-back
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: canonical-baseline-repair
          path: |
            CHANGELOG.md
            README.md
            project/ROADMAP.md
            project/SESSION_STATE.md
            project/state.json
            project/STATE_SUMMARY.md
          if-no-files-found: error
          retention-days: 1

  write-back-baseline-repair:
    name: Apply verified baseline repair to the PR branch
    needs: generate-baseline-repair
    if: needs.generate-baseline-repair.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      - name: Re-verify the exact open PR before write-back
        id: verify
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          PR_NUMBER: ${{ needs.generate-baseline-repair.outputs.pr_number }}
          PR_BRANCH: ${{ needs.generate-baseline-repair.outputs.branch }}
          EXPECTED_HEAD_SHA: ${{ needs.generate-baseline-repair.outputs.head_sha }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            const branch = String(process.env.PR_BRANCH || "");
            const expected = String(process.env.EXPECTED_HEAD_SHA || "");
            if (!Number.isInteger(number) || number < 1 ||
                !/^[A-Za-z0-9._/-]{1,200}$/.test(branch) ||
                branch.startsWith("-") || branch.includes("..") ||
                !/^[0-9a-f]{40}$/.test(expected)) {
              throw new Error("Invalid verified PR write-back inputs.");
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: number
            });
            if (pr.state !== "open" || pr.base.ref !== "main" ||
                !pr.head.repo ||
                pr.head.repo.full_name.toLowerCase() !== `${context.repo.owner}/${context.repo.repo}`.toLowerCase() ||
                pr.head.ref !== branch || pr.head.sha !== expected) {
              throw new Error("PR identity or exact head changed; refusing baseline write-back.");
            }
            core.setOutput("branch", branch);
            core.setOutput("head_sha", expected);

      - name: Check out the verified immutable PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.verify.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Download generated baseline artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: canonical-baseline-repair
          path: baseline-repair

      - name: Validate artifact manifest and apply only allowlisted files
        id: apply
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.verify.outputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD_SHA" ]] || {
            echo "Checked-out commit does not match the verified PR head." >&2
            exit 1
          }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || {
            echo "Checkout is not clean before artifact application." >&2
            exit 1
          }
          [[ -z "$(find baseline-repair -type l -print -quit)" ]] || {
            echo "Artifact contains a symbolic link; refusing write-back." >&2
            exit 1
          }
          expected="$(printf '%s\n' \
            CHANGELOG.md \
            README.md \
            project/ROADMAP.md \
            project/SESSION_STATE.md \
            project/state.json \
            project/STATE_SUMMARY.md)"
          actual="$(find baseline-repair -type f -printf '%P\n' | LC_ALL=C sort)"
          expected_sorted="$(printf '%s\n' "$expected" | LC_ALL=C sort)"
          [[ "$actual" == "$expected_sorted" ]] || {
            echo "Artifact file manifest differs from the exact six-file allowlist." >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_sorted" "$actual" >&2
            exit 1
          }
          while IFS= read -r path; do
            install -D -- "baseline-repair/$path" "$path"
          done <<< "$expected"
          git add -- \
            CHANGELOG.md \
            README.md \
            project/ROADMAP.md \
            project/SESSION_STATE.md \
            project/state.json \
            project/STATE_SUMMARY.md
          staged="$(git diff --cached --name-only | LC_ALL=C sort)"
          while IFS= read -r path; do
            case "$path" in
              CHANGELOG.md|README.md|project/ROADMAP.md|project/SESSION_STATE.md|project/state.json|project/STATE_SUMMARY.md) ;;
              *) echo "Unexpected staged path: $path" >&2; exit 1 ;;
            esac
          done <<< "$staged"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated content differs from the verified PR branch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(state): apply canonical baseline repair"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push the repair commit without force
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        env:
          PR_BRANCH: ${{ steps.verify.outputs.branch }}
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$PR_BRANCH"

      - name: Verify write-back and dispatch required PR checks
        if: steps.apply.outputs.changed == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          PR_NUMBER: ${{ needs.generate-baseline-repair.outputs.pr_number }}
          PR_BRANCH: ${{ steps.verify.outputs.branch }}
          COMMIT_SHA: ${{ steps.apply.outputs.commit_sha }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            const branch = process.env.PR_BRANCH;
            const commit = process.env.COMMIT_SHA;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: number
            });
            if (pr.state !== "open" || pr.head.ref !== branch || pr.head.sha !== commit) {
              throw new Error("Write-back was pushed, but PR head verification failed.");
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: "quality.yml", ref: branch
            });
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: "repository-baselines.yml", ref: branch
            });
            core.notice(`Applied baseline repair as ${commit} to PR #${number}; dispatched Quality and Repository Baselines on the updated branch.`);

      - name: Record no-op result
        if: steps.apply.outputs.changed != 'true'
        run: echo "No commit was needed; the six generated files already match the PR branch."
