name: AI apply current configurator PDF import
# Full import gate: refresh all deterministic reports affected by current observations.

on:
  push:
    branches:
      - ai/dacia-configurator-pdf-archive-20260809
    paths:
      - .github/workflows/ai-apply-current-configurator-pdf-import.yml
      - tools/import_current_configurator_pdfs_20260809.py
      - tools/import_current_configurator_pdfs_completion_20260809.py
      - tools/reconcile_current_configurator_values_20260810.py
      - tools/review_post_v1_11_0_release_priority_selection_20260803.py
      - tests/test_portfolio_model_family_release_integration.py

permissions:
  contents: write

jobs:
  apply-and-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install PDF extraction backends
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check pypdf

      - name: Capture pre-import canonical value baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/current-configurator-baseline-codes.txt
          import csv
          from pathlib import Path
          path = Path('data/master/configuration_attribute_values.csv')
          with path.open(encoding='utf-8-sig', newline='') as handle:
              rows = list(csv.DictReader(handle))
          codes = sorted(
              (row.get('code') or '').strip()
              for row in rows
              if (row.get('code') or '').strip()
          )
          for code in codes:
              print(code)
          PY
          test -s /tmp/current-configurator-baseline-codes.txt
          echo "Baseline canonical value codes: $(wc -l < /tmp/current-configurator-baseline-codes.txt)"

      - name: Apply complete current configurator PDF assimilation
        shell: bash
        run: |
          set -euo pipefail
          baseline=/tmp/current-configurator-baseline-codes.txt
          python tools/import_current_configurator_pdfs_20260809.py --apply
          python tools/import_current_configurator_pdfs_completion_20260809.py --apply
          python tools/reconcile_current_configurator_values_20260810.py --baseline-codes-file "$baseline" --apply

      - name: Verify importer idempotency
        shell: bash
        run: |
          set -euo pipefail
          baseline=/tmp/current-configurator-baseline-codes.txt
          python tools/import_current_configurator_pdfs_20260809.py > /tmp/import-pass1-second-run.txt
          cp data/reporting/dacia_configurator_pdf_canonical_import_20260809.json /tmp/import-pass1-second-run.json
          python tools/import_current_configurator_pdfs_completion_20260809.py > /tmp/import-pass2-second-run.txt
          cp data/reporting/dacia_configurator_pdf_completion_import_20260809.json /tmp/import-pass2-second-run.json
          python tools/reconcile_current_configurator_values_20260810.py --baseline-codes-file "$baseline" > /tmp/reconcile-second-run.txt
          python - <<'PY'
          import json
          from pathlib import Path
          checks = [
              (Path('/tmp/import-pass1-second-run.json'), ('values_added','ranges_added','availability_added','prices_added')),
              (Path('/tmp/import-pass2-second-run.json'), ('attributes_added','values_added','ranges_added','availability_added','cargo_contexts_added')),
          ]
          bad=[]
          for path, keys in checks:
              data=json.loads(path.read_text(encoding='utf-8'))
              summary=data['summary']
              for key in keys:
                  if int(summary.get(key,0)) != 0:
                      bad.append(f'{path.name}: {key}={summary.get(key)}')
          reconcile_text=Path('/tmp/reconcile-second-run.txt').read_text(encoding='utf-8')
          if 'canonical current-value reconciliations: 0' not in reconcile_text:
              bad.append('reconciler would still modify canonical current values')
          if bad:
              raise SystemExit('Importer is not idempotent: ' + '; '.join(bad))
          print('Importer idempotency: OK')
          PY

      - name: Restore apply-mode audit reports
        shell: bash
        run: |
          set -euo pipefail
          baseline=/tmp/current-configurator-baseline-codes.txt
          python tools/import_current_configurator_pdfs_20260809.py --apply
          python tools/import_current_configurator_pdfs_completion_20260809.py --apply
          python tools/reconcile_current_configurator_values_20260810.py --baseline-codes-file "$baseline" --apply

      - name: Refresh deterministic dependent reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from tools import existing_configuration_missing_data_analysis as analysis
          payload = analysis.collect(analysis.ROOT)
          analysis.write_json(analysis.OUT_JSON, payload)
          analysis.OUT_MD.write_text(analysis.render_markdown(payload), encoding='utf-8')
          print(
              'Missing technical slots:',
              payload['summary']['missing_technical_count'],
          )
          PY
          python tools/portfolio_model_family_summary.py \
            --json data/reporting/portfolio_model_family_summary.json \
            --markdown data/reporting/portfolio_model_family_summary.md \
            --html data/reporting/portfolio_model_family_summary.html
          python tools/portfolio_model_family_comparison_matrix.py \
            --json data/reporting/portfolio_model_family_comparison_matrix.json \
            --csv data/reporting/portfolio_model_family_comparison_matrix.csv \
            --html data/reporting/portfolio_model_family_comparison_matrix.html
          python tools/portfolio_model_version_comparison_matrix.py \
            --json data/reporting/portfolio_model_version_comparison_matrix.json \
            --csv data/reporting/portfolio_model_version_comparison_matrix.csv \
            --html data/reporting/portfolio_model_version_comparison_matrix.html
          git diff --check

      - name: Run full quality gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/dkb.py quality \
            --concise \
            --database "${RUNNER_TEMP}/dacia_knowledge_base.sqlite" \
            --log-file "${RUNNER_TEMP}/quality.log" \
            --summary-json "${RUNNER_TEMP}/quality-summary.json"
          cp "${RUNNER_TEMP}/quality.log" data/reporting/dkb-quality-current-configurator-20260809.txt
          cp "${RUNNER_TEMP}/quality-summary.json" data/reporting/dkb-quality-current-configurator-20260809.json

      - name: Commit quality-gated data and dependent reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master \
                  data/reporting/dacia_configurator_pdf_canonical_import_20260809.json \
                  data/reporting/dacia_configurator_pdf_completion_import_20260809.json \
                  data/reporting/existing_configuration_missing_data_analysis.json \
                  data/reporting/existing_configuration_missing_data_analysis.md \
                  data/reporting/portfolio_model_family_summary.json \
                  data/reporting/portfolio_model_family_summary.md \
                  data/reporting/portfolio_model_family_summary.html \
                  data/reporting/portfolio_model_family_comparison_matrix.json \
                  data/reporting/portfolio_model_family_comparison_matrix.csv \
                  data/reporting/portfolio_model_family_comparison_matrix.html \
                  data/reporting/portfolio_model_version_comparison_matrix.json \
                  data/reporting/portfolio_model_version_comparison_matrix.csv \
                  data/reporting/portfolio_model_version_comparison_matrix.html \
                  data/reporting/dkb-quality-current-configurator-20260809.txt \
                  data/reporting/dkb-quality-current-configurator-20260809.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git diff --cached --check
          git commit -m "data(configurator): assimilate current Dacia PDF portfolio"
          git pull --rebase origin ai/dacia-configurator-pdf-archive-20260809
          git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
