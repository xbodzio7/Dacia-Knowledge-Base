name: Temporary Duster Automatic Homologation Materializer

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: temporary-duster-auto-homologation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install PDF text extraction backend
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
          pdftotext -v

      - name: Materialize homologation data
        run: python tools/import_duster_ecog120_automatic_homologation_20260725.py --apply

      - name: Synchronize package contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          replacements = {
              Path("tests/test_duster_ecog120_automatic_stock_20260724.py"): (
                  ('self.assertEqual(report["scope"]["technical_slots"], 3)', 'self.assertEqual(report["scope"]["technical_slots"], 29)'),
                  ('self.assertEqual(report["technical"]["present"], 9)', 'self.assertEqual(report["technical"]["present"], 87)'),
              ),
              Path("tests/test_jogger_payload_performance_ranges.py"): (
                  ('self.assertEqual(baseline["tests"], 743)', 'self.assertEqual(baseline["tests"], 751)'),
                  ('self.assertEqual(baseline["rows"], 8032)', 'self.assertEqual(baseline["rows"], 8126)'),
                  ('self.assertEqual(baseline["configuration_values"], 1765)', 'self.assertEqual(baseline["configuration_values"], 1825)'),
                  ('self.assertEqual(baseline["configuration_value_ranges"], 158)', 'self.assertEqual(baseline["configuration_value_ranges"], 176)'),
              ),
              Path("tests/test_jogger_wltp_efficiency_ranges.py"): (
                  ('self.assertEqual(baseline["tests"], 743)', 'self.assertEqual(baseline["tests"], 751)'),
                  ('self.assertEqual(baseline["rows"], 8032)', 'self.assertEqual(baseline["rows"], 8126)'),
                  ('self.assertEqual(baseline["configuration_values"], 1765)', 'self.assertEqual(baseline["configuration_values"], 1825)'),
                  ('self.assertEqual(baseline["configuration_value_ranges"], 158)', 'self.assertEqual(baseline["configuration_value_ranges"], 176)'),
              ),
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new, 1)
                  elif new not in text:
                      raise SystemExit(f"expected contract not found in {path}: {old}")
              path.write_text(text, encoding="utf-8")

          state_path = Path("project/state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          state["updated_on"] = "2026-07-25"
          state["phase"] = "Duster Eco-G 120 Automatic Homologation Evidence"
          state["current_package"] = {
              "name": "Duster Eco-G 120 Automatic Homologation Evidence",
              "status": "complete",
              "goal": "Import exact automatic-specific power, torque, performance, WLTP, mass and towing evidence for the 2026 Duster Eco-G 120 Expression, Extreme and Journey configurations without inheriting manual cargo values.",
          }
          state["next_package"] = {
              "name": "Duster Eco-G 120 Automatic Cargo and Emissions Gap Review",
              "status": "planned",
              "goal": "Locate exact automatic-specific luggage-volume and petrol CO2 evidence while preserving current unknown states if no authoritative source exists.",
          }
          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          anchor = (
              "Najnowsze rozszerzenie dokładnych konfiguracji Dustera zapisuje 203 nowe "
              "datowane obserwacje wyposażenia dla automatów Expression, Extreme i Journey "
              "bez kopiowania danych z wersji manualnych."
          )
          paragraph = (
              "Kolejny pakiet uzupełnia te trzy automaty o 60 dokładnych wartości i 18 "
              "przedziałów technicznych potwierdzonych na oficjalnych kartach automatycznego "
              "Eco-G 120. Obejmuje moc i moment dla benzyny/LPG, osiągi, spalanie, masy, "
              "ładowność oraz holowanie; pojemność bagażnika i emisja CO2 dla benzyny nadal "
              "pozostają niewiadome. Szczegóły zawiera "
              "`project/packages/duster-ecog120-automatic-homologation-evidence-20260725.md`."
          )
          if paragraph not in text:
              start = text.find(anchor)
              if start < 0:
                  raise SystemExit("README Duster equipment anchor not found")
              end = text.find("\n\n", start)
              if end < 0:
                  raise SystemExit("README paragraph boundary not found")
              text = text[: end + 2] + paragraph + "\n\n" + text[end + 2 :]
              readme.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          bullet = (
              "* Added 60 automatic-specific Duster Eco-G 120 scalar technical observations "
              "and 18 closed ranges for power, torque, performance, WLTP, mass and towing, "
              "while retaining cargo volume and petrol CO2 as explicit unknowns."
          )
          if bullet not in text:
              anchor = (
                  "* Expanded the three exact Duster Eco-G 120 automatic stock configurations "
                  "with 203 new dated equipment observations"
              )
              start = text.find(anchor)
              if start < 0:
                  raise SystemExit("CHANGELOG Duster equipment anchor not found")
              end = text.find("\n", start)
              text = text[: end + 1] + bullet + "\n" + text[end + 1 :]
              changelog.write_text(text, encoding="utf-8")

          roadmap = Path("project/ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")
          item = (
              "- automatyczne dane homologacyjne Duster Eco-G 120: 60 wartości skalarnych "
              "i 18 przedziałów mocy, momentu, osiągów, WLTP, mas oraz holowania, bez "
              "dziedziczenia niepotwierdzonego bagażnika,"
          )
          if item not in text:
              anchor = (
                  "- dokładne wyposażenie trzech automatów Duster Eco-G 120 z 203 nowymi "
                  "obserwacjami"
              )
              start = text.find(anchor)
              if start < 0:
                  raise SystemExit("ROADMAP Duster equipment anchor not found")
              end = text.find("\n", start)
              text = text[: end + 1] + item + "\n" + text[end + 1 :]
              roadmap.write_text(text, encoding="utf-8")
          PY
          python tools/dkb.py project-state --apply
          python tools/dkb.py documentation-baseline --apply

      - name: Run focused package tests
        run: |
          set +e
          python -m unittest -v \
            tests.test_duster_ecog120_automatic_homologation_20260725 \
            tests.test_duster_ecog120_automatic_stock_20260724 \
            tests.test_jogger_payload_performance_ranges \
            tests.test_jogger_wltp_efficiency_ranges \
            tests.test_configuration_comparison_workbook \
            > "${RUNNER_TEMP}/focused-tests.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/focused-tests.log"
          if [ "$status" -ne 0 ]; then
            tail -n 220 "${RUNNER_TEMP}/focused-tests.log" > .github/duster-auto-homologation-focused-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/duster-auto-homologation-focused-error.log
            git commit -m "diagnostic: capture Duster homologation test failure"
            git push origin HEAD:${{ github.head_ref }}
            exit "$status"
          fi

      - name: Run full test discovery
        run: python -m unittest discover -s tests -p "test_*.py" -q

      - name: Run full quality gate
        run: |
          python tools/dkb.py quality \
            --concise \
            --database "${RUNNER_TEMP}/dacia_knowledge_base.sqlite" \
            --log-file "${RUNNER_TEMP}/quality.log" \
            --summary-json "${RUNNER_TEMP}/quality-summary.json"

      - name: Verify canonical state
        run: python tools/dkb.py project-state --check

      - name: Commit materialized package
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            CHANGELOG.md \
            data/master/sources.csv \
            data/master/source_models.csv \
            data/master/source_versions.csv \
            data/master/source_configurations.csv \
            data/master/configuration_attribute_values.csv \
            data/master/configuration_attribute_value_ranges.csv \
            project/ROADMAP.md \
            project/SESSION_STATE.md \
            project/STATE_SUMMARY.md \
            project/state.json \
            tests/test_duster_ecog120_automatic_stock_20260724.py \
            tests/test_jogger_payload_performance_ranges.py \
            tests/test_jogger_wltp_efficiency_ranges.py
          git commit -m "feat(data): import Duster automatic homologation evidence"
          git push origin HEAD:${{ github.head_ref }}
