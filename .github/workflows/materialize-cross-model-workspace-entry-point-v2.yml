name: Materialize Cross-Model Workspace Entry Point v2

on:
  push:
    branches:
      - agent/cross-model-workspace-entry-point

permissions:
  contents: write

concurrency:
  group: materialize-cross-model-workspace-entry-point
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/cross-model-workspace-entry-point
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Reuse original materialization block
        run: |
          git show 4a1649199236b3b323594689fbeae56c166a7bf8:.github/workflows/materialize-cross-model-workspace-entry-point.yml > "${RUNNER_TEMP}/original.yml"
          python - <<'PY'
          import os
          from pathlib import Path
          import textwrap

          path = Path(os.environ["RUNNER_TEMP"]) / "original.yml"
          text = path.read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          script = textwrap.dedent(text[start:end])
          exec(compile(script, str(path), "exec"), {"__name__": "__main__"})
          PY

      - name: Synchronize generated documentation
        run: python tools/dkb.py project-state --apply

      - name: Compile changed Python contracts
        run: |
          python -m compileall -q \
            tools/reporting/data_product_workspace_index.py \
            tools/review_cross_model_workspace_entry_point_20260727.py \
            tests/test_cross_model_workspace_entry_point.py \
            tests/workspace_index_checks.py

      - name: Commit materialized package
        run: |
          rm -f .github/cross-model-workspace-entry-point.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat(workspace): add cross-model entry point"
            git push origin HEAD:agent/cross-model-workspace-entry-point
          fi
