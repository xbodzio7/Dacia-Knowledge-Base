name: Catalog Recovery Source Slices Rerun

on:
  push:
    branches:
      - agent/sandero-stepway-catalog-recovery
    paths:
      - .github/workflows/catalog-recovery-source-slices-rerun.yml

permissions:
  contents: write

jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute source-slice workflow steps serially
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          import textwrap
          from pathlib import Path

          workflow = Path('.github/workflows/catalog-recovery-source-slices.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          scripts = []
          index = 0
          while index < len(lines):
              if lines[index].strip() == 'run: |':
                  indent = len(lines[index]) - len(lines[index].lstrip())
                  index += 1
                  collected = []
                  while index < len(lines):
                      line = lines[index]
                      current_indent = len(line) - len(line.lstrip())
                      if line.strip() and current_indent <= indent:
                          break
                      collected.append(line[indent + 2:] if len(line) >= indent + 2 else '')
                      index += 1
                  scripts.append('\n'.join(collected))
                  continue
              index += 1

          if len(scripts) != 4:
              raise SystemExit(f'expected four run blocks, found {len(scripts)}')

          log = Path('diagnostics/catalog-recovery/source-slices-rerun.log')
          log.parent.mkdir(parents=True, exist_ok=True)
          with log.open('w', encoding='utf-8') as handle:
              for number, script in enumerate(scripts[:3], 1):
                  handle.write(f'===== embedded step {number} =====\n')
                  completed = subprocess.run(
                      ['bash', '-lc', script],
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      check=False,
                  )
                  handle.write(completed.stdout)
                  handle.write(f'\nexit={completed.returncode}\n')
                  handle.flush()
                  if completed.returncode:
                      raise SystemExit(completed.returncode)
          PY

      - name: Commit serial migration result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data project/sources tools tests diagnostics/catalog-recovery/source-slices-*.log diagnostics/catalog-recovery/unit-v3.log diagnostics/catalog-recovery/unit-v3-summary.json
          git commit -m "refactor(data): isolate catalogue completion source slices"
          git push origin HEAD:agent/sandero-stepway-catalog-recovery
