name: Preflight data-products v1.7.0

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preflight-data-products-v1.7.0
  cancel-in-progress: false

jobs:
  build:
    if: github.head_ref == 'release/preflight-data-products-v1.7.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact green main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 99e0e19b86cad6eae619f37702464e6a5a761cd8
          persist-credentials: false
          fetch-depth: 0

      - name: Confirm exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "99e0e19b86cad6eae619f37702464e6a5a761cd8"
          git diff --quiet
          git diff --cached --quiet
          python tools/dkb.py project-state --check
          python tools/review_data_products_v1_7_0_release_preparation_20260726.py --check

      - name: Confirm unused public identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --tags origin refs/tags/data-products-v1.7.0 | grep -q .; then
            echo "ERROR: tag data-products-v1.7.0 already exists" >&2
            exit 1
          fi
          status="$({ curl --silent --show-error --output /tmp/release.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/xbodzio7/Dacia-Knowledge-Base/releases/tags/data-products-v1.7.0; } 2>/tmp/release-curl.err)"
          cat /tmp/release-curl.err
          test "$status" = "404"
          echo "PASS: v1.7.0 tag and release identity are unused"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Build twice and verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -q tests.test_data_product_release
          python tools/data_product_release.py \
            --version 1.7.0 \
            --commit-sha 99e0e19b86cad6eae619f37702464e6a5a761cd8 \
            --output-directory release-first
          python tools/data_product_release.py \
            --version 1.7.0 \
            --commit-sha 99e0e19b86cad6eae619f37702464e6a5a761cd8 \
            --output-directory release-second
          python tools/data_product_release.py \
            --verify \
            --version 1.7.0 \
            --commit-sha 99e0e19b86cad6eae619f37702464e6a5a761cd8 \
            --output-directory release-first
          python tools/data_product_release.py \
            --verify \
            --version 1.7.0 \
            --commit-sha 99e0e19b86cad6eae619f37702464e6a5a761cd8 \
            --output-directory release-second
          cmp release-first/SHA256SUMS release-second/SHA256SUMS
          cmp \
            release-first/dacia-knowledge-base-data-products-v1.7.0.zip \
            release-second/dacia-knowledge-base-data-products-v1.7.0.zip
          cmp \
            release-first/data-product-release-manifest.json \
            release-second/data-product-release-manifest.json
          echo "PASS: exact candidate is byte-identical across two builds"

      - name: Record final preflight identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZipFile

          root = Path("release-first")
          names = [
              "SHA256SUMS",
              "dacia-knowledge-base-data-products-v1.7.0.zip",
              "data-product-release-manifest.json",
          ]

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          archive = root / "dacia-knowledge-base-data-products-v1.7.0.zip"
          manifest = json.loads(
              (root / "data-product-release-manifest.json").read_text(encoding="utf-8")
          )
          with ZipFile(archive) as handle:
              archive_members = len(handle.infolist())
          payload = {
              "version": 1,
              "kind": "data_products_v1_7_0_preflight",
              "status": "pass",
              "source_commit": "99e0e19b86cad6eae619f37702464e6a5a761cd8",
              "release_version": "1.7.0",
              "release_tag": "data-products-v1.7.0",
              "tag_absent": True,
              "release_absent": True,
              "deterministic_double_build": True,
              "release_verify": "pass",
              "selected_configuration_count": manifest["selected_configuration_count"],
              "scope_group_count": manifest["scope_group_count"],
              "archive_member_count": archive_members,
              "assets": {
                  name: {
                      "size_bytes": (root / name).stat().st_size,
                      "sha256": sha256(root / name),
                  }
                  for name in names
              },
              "publication_performed": False,
          }
          output = Path("data-products-v1.7.0-preflight-identity.json")
          output.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(output.read_text(encoding="utf-8"))
          with Path("preflight-summary.md").open("w", encoding="utf-8") as handle:
              handle.write("# data-products-v1.7.0 preflight\n\n")
              handle.write(f"- Source commit: `{payload['source_commit']}`\n")
              handle.write("- Tag absent: yes\n- Release absent: yes\n")
              handle.write("- Deterministic double build: PASS\n")
              handle.write("- Release verification: PASS\n")
              handle.write(f"- Configurations: {payload['selected_configuration_count']}\n")
              handle.write(f"- Scopes: {payload['scope_group_count']}\n")
              handle.write(f"- Archive members: {payload['archive_member_count']}\n\n")
              handle.write("| Asset | Bytes | SHA-256 |\n| --- | ---: | --- |\n")
              for name, record in payload["assets"].items():
                  handle.write(
                      f"| `{name}` | {record['size_bytes']} | `{record['sha256']}` |\n"
                  )
          PY
          cat preflight-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: data-products-v1.7.0-preflight-candidate
          path: |
            release-first
            data-products-v1.7.0-preflight-identity.json
            preflight-summary.md
          if-no-files-found: error
          retention-days: 7
