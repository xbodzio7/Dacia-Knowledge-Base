name: AI materialize Spring white v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize bounded migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/ai-materialize-spring-white-v2.yml .github/ai-trigger-spring-white-v2.txt
          git add -A
          git commit -m 'ci: remove temporary Spring white v2 materializer'
          git push origin HEAD:main

          branch=agent/spring-biel-alpejska-default-colour-migration-v2-20260802
          old=7d99eb39ba2c5e7db791d6244ddebd8d5650edf8
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          git merge origin/main --no-edit
          mkdir -p data/imports/configuration_values data/reporting project/packages tests tools
          git show "$old:data/imports/configuration_values/spring_biel_alpejska_default_colour_20260802.json" > data/imports/configuration_values/spring_biel_alpejska_default_colour_20260802.json
          git show "$old:tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py" > tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py
          git show "$old:tests/test_spring_biel_alpejska_default_colour_migration_20260802.py" > tests/test_spring_biel_alpejska_default_colour_migration_20260802.py
          git show "$old:project/packages/spring-biel-alpejska-default-colour-migration-20260802.md" > project/packages/spring-biel-alpejska-default-colour-migration-20260802.md
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py',
              'tests/test_spring_biel_alpejska_default_colour_migration_20260802.py',
              'project/packages/spring-biel-alpejska-default-colour-migration-20260802.md',
          ]:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = text.replace('11715', '11728')
              text = text.replace('spring_supplied_charging_cable_model_decision_001', 'post_spring_biel_alpejska_priority_selection_review_001')
              text = text.replace('Spring Supplied Charging Cable Model Decision', 'Post-Spring Biel Alpejska Priority Selection Review')
              p.write_text(text, encoding='utf-8')
          PY
          python3 tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py --apply
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('project/state.json')
          state = json.loads(p.read_text(encoding='utf-8'))
          state['phase'] = 'Spring Essential Biel Alpejska Default Colour Migration'
          state['reference_delivery'] = {
              'name': 'Post-Spring Charging Cable Priority Selection Review',
              'pull_request': 464,
              'head_sha': '8027dadecb320c2c70a8e373ed6eebf77526409b',
              'quality_run': 30755752601,
          }
          state['baseline']['tests'] = 1794
          state['baseline']['rows'] = 11728
          state['baseline']['configuration_values'] = 3568
          state['baseline']['configuration_import_specs'] = 139
          state['current_package'] = {
              'package_id': 'spring_biel_alpejska_default_colour_migration_001',
              'kind': 'bounded_configuration_value_and_commercial_mapping_migration',
              'name': 'Spring Essential Biel Alpejska Default Colour Migration',
              'status': 'complete',
              'goal': 'Add the exact-current Spring Essential Biel Alpejska direct exterior_color value through the canonical declarative import contract and convert only its existing commercial mapping to standard at zero surcharge.',
              'manifest_paths': [
                  'data/imports/configuration_values/spring_biel_alpejska_default_colour_20260802.json',
                  'data/master/configuration_attribute_values.csv',
                  'data/master/commercial_item_configurations.csv',
                  'data/reporting/spring_biel_alpejska_default_colour_migration.json',
                  'data/reporting/spring_biel_alpejska_default_colour_migration.md',
                  'project/packages/spring-biel-alpejska-default-colour-migration-20260802.md',
                  'project/STATE_SUMMARY.md',
                  'project/state.json',
                  'tests/test_spring_biel_alpejska_default_colour_migration_20260802.py',
                  'tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py',
              ],
          }
          state['next_package'] = {
              'package_id': 'post_spring_biel_alpejska_priority_selection_review_001',
              'kind': 'bounded_priority_selection_review',
              'name': 'Post-Spring Biel Alpejska Priority Selection Review',
              'status': 'planned',
              'goal': 'Select the next bounded repository package after completing the accepted Spring default-colour migration without changing master data.',
              'manifest_paths': ['project/state.json', 'project/STATE_SUMMARY.md', 'data/reporting/'],
          }
          p.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python3 tools/dkb.py project-state --apply
          python3 -m compileall -q tools tests
          python3 -m unittest discover -s tests -p 'test_spring_biel_alpejska_default_colour_migration_20260802.py' -q
          python3 tools/dkb.py project-state --check
          git add -A
          git commit -m 'data: migrate Spring Essential Biel Alpejska default colour'
          git push origin HEAD:"$branch"
