name: Spring Source Assimilation Bundle

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/source-assimilation-spring-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-audit-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Download and diagnose live official Spring PDF identity
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.dacia.pgd.pl/SiteData/Dacia/images/NowaStrona/Cenniki/2026/kwiecien/Spring.pdf"
          # The previous CDN asset paths returned the registered MY25 binary on 2026-11-14.
          # This dealer-hosted Dacia price-list PDF independently reproduces the MY26 edition effective 2026-02-06.
          # Its first page identifies ROCZNIK 2026 and catalogue prices; retain the exact mirror URL in the capture manifest.
          capture_dir="source-assimilation-bundle/live-my26"
          pdf="$capture_dir/DACIA SPRING cennik MY26 20260206.pdf"
          mkdir -p "$capture_dir/pages"
          curl --fail --location --retry 3 --retry-delay 2 --max-time 120 "$url" --output "$pdf"
          pdfinfo "$pdf" > "$capture_dir/pdfinfo.txt"
          pdftotext -f 1 -l 1 -layout "$pdf" "$capture_dir/first_page.txt"
          pdftotext -layout "$pdf" "$capture_dir/document.txt"
          sha256sum "$pdf" > "$capture_dir/sha256.txt"
          pdftoppm -png -r 120 "$pdf" "$capture_dir/pages/page" >/dev/null 2>&1
          python - <<'PY'
          from datetime import datetime, timezone
          from hashlib import sha256
          from pathlib import Path
          import json
          import os
          import re

          capture_dir = Path("source-assimilation-bundle/live-my26")
          pdf = capture_dir / "DACIA SPRING cennik MY26 20260206.pdf"
          raw = pdf.read_bytes()
          first_page = (capture_dir / "first_page.txt").read_text(encoding="utf-8", errors="replace")
          normalized = " ".join(first_page.split())
          pdfinfo = (capture_dir / "pdfinfo.txt").read_text(encoding="utf-8", errors="replace")
          page_match = re.search(r"(?m)^Pages:\s*(\d+)", pdfinfo)
          page_count = int(page_match.group(1)) if page_match else None
          digest = sha256(raw).hexdigest()
          registered_my25_sha256 = "295deb2f8136c2f0ff090c88183579a135e7220a38d628973667a8824c0db5d0"
          markers = (
              "Ceny katalogowe",
              "ROCZNIK 2026",
              "Cennik obowiązuje od 06.02.2026",
              "73 500",
              "81 500",
              "85 900",
          )
          missing = [marker for marker in markers if marker not in normalized]
          # The captured PGD distribution copy is seven pages: price list and equipment,
          # technical data, a dimension drawing page, and final legal/finance terms.
          # Page 6 contains vehicle dimension drawings (not a blank page); page 7 contains terms.
          if page_count != 7:
              missing.append(f"expected 7 pages, got {page_count}")
          if digest == registered_my25_sha256:
              missing.append("downloaded SHA-256 matches the registered MY25 PDF")
          verified = not missing
          manifest = {
              "source_code": "src_pl_spring_price_my26_20260206",
              "document_date": "2026-02-06",
              "model_year": "MY26",
              "market": "PL",
              "source_url": "https://www.dacia.pgd.pl/SiteData/Dacia/images/NowaStrona/Cenniki/2026/kwiecien/Spring.pdf",
              "file_path": "PDF/Cenniki/DACIA SPRING cennik MY26 20260206.pdf",
              "sha256": digest,
              "file_size_bytes": len(raw),
              "page_count": page_count,
              "registered_my25_sha256": registered_my25_sha256,
              "matches_registered_my25_sha256": digest == registered_my25_sha256,
              "verification_status": "verified_my26" if verified else "identity_not_verified",
              "missing_markers": missing,
              "first_page_text": first_page,
              "captured_at_utc": datetime.now(timezone.utc).isoformat(),
              "expected_first_page_markers": list(markers),
              "price_cells": [
                  {"grade": "Essential", "powertrain": "Electric 70", "amount_pln": 73500},
                  {"grade": "Expression", "powertrain": "Electric 70", "amount_pln": 81500},
                  {"grade": "Extreme", "powertrain": "Electric 100", "amount_pln": 85900}
              ],
              "price_context": "The web-extracted document heading/footer state catalogue prices; the matrix row labels say 'Cena promocyjna'. Both contexts remain distinct.",
              "versioning_note": "Never overwrite the owner-supplied MY25 Library PDF associated with this same CDN URL."
          }
          (capture_dir / "capture-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"verified={str(verified).lower()}\n")
          print("DOWNLOADED_PDF_SHA256=" + digest)
          print("DOWNLOADED_PDF_SIZE_BYTES=" + str(len(raw)))
          print("DOWNLOADED_PDF_PAGE_COUNT=" + str(page_count))
          print("REGISTERED_MY25_SHA256_MATCH=" + str(digest == registered_my25_sha256))
          print("MY26_VERIFICATION=" + str(verified))
          print("MISSING_MARKERS=" + json.dumps(missing, ensure_ascii=False))
          print("FIRST_PAGE_TEXT_BEGIN")
          print(first_page)
          print("FIRST_PAGE_TEXT_END")
          PY

      - name: Build page text and rendered page bundle for archived sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-assimilation-bundle
          while IFS= read -r pdf; do
            [ -f "$pdf" ] || continue
            base=$(basename "$pdf" .pdf | tr ' /' '__')
            out="source-assimilation-bundle/$base"
            mkdir -p "$out/pages"
            sha256sum "$pdf" > "$out/sha256.txt"
            pdfinfo "$pdf" > "$out/pdfinfo.txt"
            pdftotext -layout "$pdf" "$out/document.txt"
            pdftoppm -png -r 120 "$pdf" "$out/pages/page" >/dev/null 2>&1
          done <<'PDFS'
          PDF/Cenniki/DACIA SPRING cennik MY25 stock 20260708.pdf
          PDF/Broszury/DACIA SPRING broszura 20260219.pdf
          PDFS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spring-source-assimilation-bundle
          path: source-assimilation-bundle
          retention-days: 7

      - name: Archive verified MY26 binary on a dedicated source branch
        if: steps.capture.outputs.verified == 'true'
        shell: bash
        env:
          TARGET_BRANCH: data/spring-my26-cennik-assimilation-20261114-001
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Target source branch already exists; refusing to overwrite it."
            exit 1
          fi
          mkdir -p "PDF/Cenniki" "data/source_intake"
          cp "source-assimilation-bundle/live-my26/DACIA SPRING cennik MY26 20260206.pdf" \
             "PDF/Cenniki/DACIA SPRING cennik MY26 20260206.pdf"
          cp "source-assimilation-bundle/live-my26/capture-manifest.json" \
             "data/source_intake/spring_my26_20260206_capture.json"
          sha256sum "PDF/Cenniki/DACIA SPRING cennik MY26 20260206.pdf" \
            > "data/source_intake/spring_my26_20260206.sha256"
          git checkout -b "$TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "PDF/Cenniki/DACIA SPRING cennik MY26 20260206.pdf" \
                  "data/source_intake/spring_my26_20260206_capture.json" \
                  "data/source_intake/spring_my26_20260206.sha256"
          git commit -m "source(spring): capture official MY26 2026-02-06 cennik PDF"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Stop without committing if downloaded source is not verified as MY26
        if: steps.capture.outputs.verified != 'true'
        shell: bash
        run: |
          echo "The downloaded PDF did not pass MY26 identity verification. Diagnostic artifact retained; no binary was committed."
          exit 1
