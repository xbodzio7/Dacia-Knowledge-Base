name: Temporary materialize Jogger page 19 acceleration observations

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/jogger-page19-acceleration-materialize-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out materialization branch
        uses: actions/checkout@v4
        with:
          ref: agent/jogger-page19-acceleration-materialize-20260730
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF text extraction backend
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Apply and verify import
        run: |
          python tools/dkb.py import-configuration-values \
            --spec data/imports/configuration_values/jogger-brochure-acceleration-0-100-20251217.json \
            --apply
          python tools/dkb.py import-configuration-values \
            --spec data/imports/configuration_values/jogger-brochure-acceleration-0-100-20251217.json \
            --verify
      - name: Validate package and synchronize state
        run: |
          python -m unittest -v tests.test_jogger_page19_acceleration_source_observations
          python tools/dkb.py project-state --apply
          python tools/dkb.py project-state --check
      - name: Commit final package outputs
        run: |
          rm .github/workflows/temporary-jogger-page19-acceleration-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/imports/configuration_values/jogger-brochure-acceleration-0-100-20251217.json \
            data/master/configuration_attribute_values.csv \
            tests/test_jogger_page19_acceleration_source_observations.py \
            project/state.json \
            project/STATE_SUMMARY.md \
            .github/workflows/temporary-jogger-page19-acceleration-materialize.yml
          git commit -m "feat(data): add Jogger page 19 acceleration observations"
          git push origin HEAD:agent/jogger-page19-acceleration-materialize-20260730
