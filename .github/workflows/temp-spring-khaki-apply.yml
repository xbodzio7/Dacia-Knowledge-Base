name: Temporary Spring Khaki Apply

on:
  push:
    branches:
      - agent/spring-essential-khaki-price-apply-20260802
    paths:
      - .github/workflows/temp-spring-khaki-apply.yml
      - tools/apply_spring_essential_khaki_price_20260802.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-essential-khaki-price-apply-20260802
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Finalize deterministic apply report
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/apply_spring_essential_khaki_price_20260802.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('"rows_added": source_added,', '"rows_added": 1,')
          text = text.replace('"rows_changed": 0 if before == after else 1,', '"rows_changed": 1,')
          text = text.replace(
              '"availability_status": before["availability_status"],\n'
              '                "amount": before["amount"] or None,\n'
              '                "currency_code": before["currency_code"],\n'
              '                "price_date": before["price_date"] or None,\n'
              '                "source_code": before["source_code"],',
              '"availability_status": "optional",\n'
              '                "amount": None,\n'
              '                "currency_code": "PLN",\n'
              '                "price_date": None,\n'
              '                "source_code": EXPECTED_OLD_SOURCE,',
          )
          text = text.replace('"source_rows_added": source_added,', '"source_rows_added": 1,')
          text = text.replace(
              '"commercial_mapping_rows_updated": 0 if before == after else 1,',
              '"commercial_mapping_rows_updated": 1,',
          )
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Apply bounded source and price update
        run: python tools/apply_spring_essential_khaki_price_20260802.py --apply

      - name: Verify deterministic state
        run: python tools/apply_spring_essential_khaki_price_20260802.py --verify

      - name: Commit generated package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/apply_spring_essential_khaki_price_20260802.py \
            data/master/sources.csv \
            data/master/commercial_item_configurations.csv \
            data/reporting/spring_essential_khaki_price_apply.json \
            data/reporting/spring_essential_khaki_price_apply.md
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "data: apply Spring Essential Khaki price"
            git push origin HEAD:agent/spring-essential-khaki-price-apply-20260802
          fi
