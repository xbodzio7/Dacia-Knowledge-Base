name: Materialize Equipment Filter Regression and Model Price Ordering

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/materialize-equipment-filter-regression-model-price-order.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out regression-fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/equipment-filter-regression-model-price-order
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install PDF and browser backends
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils chromium-browser || \
            sudo apt-get install --yes --no-install-recommends poppler-utils chromium
      - name: Apply source fix
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, pattern: str, replacement: str, label: str, flags: int = 0) -> None:
              text = path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected one replacement, got {count}")
              path.write_text(updated, encoding="utf-8")

          browser = Path("tools/reporting/configuration_shortlist_browser.js")
          replace_once(
              browser,
              r"return coverage\.missing === 0 && coverage\.unknown === 0\s*&& coverage\.available > 0 && coverage\.not_available > 0;",
              "const excluded = coverage.not_available + coverage.unknown + coverage.missing;\n      return coverage.available > 0 && excluded > 0;",
              "equipment visibility guard",
          )

          html = Path("tools/reporting/configuration_shortlist_html.py")
          text = html.read_text(encoding="utf-8")
          anchor = "    catalog_configurations.sort(key=sort_key)\n"
          if text.count(anchor) != 1:
              raise SystemExit("catalog sort anchor differs")
          model_order = '''    model_min_prices: dict[str, float] = {}
              for item in catalog_configurations:
                  price = item["catalog_price"]
                  if price.get("state") != "recorded":
                      continue
                  model_code = item["model_code"]
                  amount = float(price["amount"])
                  current = model_min_prices.get(model_code)
                  if current is None or amount < current:
                      model_min_prices[model_code] = amount
              ordered_model_codes = sorted(
                  active_model_codes,
                  key=lambda code: (
                      code not in model_min_prices,
                      model_min_prices.get(code, float("inf")),
                      models[code].get("name", ""),
                      code,
                  ),
              )
          '''
          text = text.replace(anchor, anchor + model_order, 1)
          pattern = re.compile(
              r'            "models": \[\n'
              r'                \{"code": code, "name": models\[code\]\.get\("name", ""\), "media": media\.get\(code, \{\}\)\}\n'
              r'                for code in sorted\(active_model_codes\)\n'
              r'            \],'
          )
          replacement = '''            "models": [
                          {
                              "code": code,
                              "name": models[code].get("name", ""),
                              "media": media.get(code, {}),
                              "minimum_catalog_price_pln": (
                                  int(model_min_prices[code])
                                  if code in model_min_prices
                                  and model_min_prices[code].is_integer()
                                  else model_min_prices.get(code)
                              ),
                          }
                          for code in ordered_model_codes
                      ],'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"model facet block: expected one replacement, got {count}")
          html.write_text(text, encoding="utf-8")

          ui = Path("tools/reporting/configuration_shortlist_v12.js")
          text = ui.read_text(encoding="utf-8")
          changes = {
              "Lista pokazuje tylko pozycje, które można teraz dodać bez utraty wszystkich wyników. Już wybrane pozycje pozostają zaznaczone.":
                  "Lista pokazuje pozycje potwierdzone jako dostępne w co najmniej jednej bieżącej konfiguracji. Brak danych i status nieustalony nie spełniają filtra. Już wybrane pozycje pozostają zaznaczone.",
              "Lista pokazuje tylko źródłowo kompletne pozycje, które można dodać do bieżącego wyboru i które nadal różnicują pozostałe konfiguracje. Alternatywy wykluczające się oraz pozycje z brakami danych są ukryte.":
                  "Lista pokazuje pozycje potwierdzone jako dostępne w co najmniej jednej zgodnej konfiguracji i nadal różnicujące wyniki. Brak danych i status nieustalony nie spełniają filtra; po zaznaczeniu taka konfiguracja zostaje wykluczona.",
          }
          for old, new in changes.items():
              if text.count(old) != 1:
                  raise SystemExit(f"equipment explanation differs: {old[:40]}")
              text = text.replace(old, new, 1)
          ui.write_text(text, encoding="utf-8")

          tests = Path("tests/test_configuration_shortlist_html.py")
          text = tests.read_text(encoding="utf-8")
          old_name = "def test_equipment_facets_require_complete_source_coverage_and_real_difference(self) -> None:"
          if text.count(old_name) != 1:
              raise SystemExit("equipment facet test name differs")
          text = text.replace(
              old_name,
              "def test_equipment_facets_include_partial_coverage_without_inference(self) -> None:",
              1,
          )
          old_assert = '        self.assertEqual(result["facets"], ["complete_difference"])\n'
          if text.count(old_assert) != 1:
              raise SystemExit("equipment facet expectation differs")
          tests.write_text(
              text.replace(
                  old_assert,
                  '        self.assertEqual(result["facets"], ["complete_difference", "missing_only"])\n',
                  1,
              ),
              encoding="utf-8",
          )
          PY
      - name: Normalize historical publication contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          verifier = Path("tools/review_data_products_v1_8_0_publication_20260726.py")
          text = verifier.read_text(encoding="utf-8")
          start = text.index("def verify_state() -> None:\n")
          end = text.index("\n\ndef verify() -> None:\n", start)
          state_block = '''def verify_state() -> None:
              state = load_json(STATE)
              ensure(isinstance(state.get("phase"), str) and bool(state["phase"]), "project phase is missing")
              current = state.get("current_package")
              ensure(isinstance(current, Mapping), "current package is missing")
              ensure(isinstance(current.get("name"), str) and bool(current["name"]), "current package name is missing")
              ensure(current.get("status") in {"planned", "active", "blocked", "complete"}, "current package status differs")
              next_package = state.get("next_package")
              ensure(isinstance(next_package, Mapping), "next package is missing")
              ensure(isinstance(next_package.get("name"), str) and bool(next_package["name"]), "next package name is missing")
              baseline = state.get("baseline", {})
              ensure(baseline.get("tests", 0) >= 1022, "test baseline regressed")
              ensure(baseline.get("csv_files", 0) >= 46, "CSV baseline regressed")
              ensure(baseline.get("rows", 0) >= 9688, "master row baseline regressed")
              ensure(baseline.get("configuration_values", 0) >= 2949, "configuration values regressed")
              ensure(baseline.get("configuration_value_ranges", 0) >= 244, "configuration ranges regressed")
              ensure(baseline.get("availability_records", 0) >= 4754, "availability baseline regressed")
              ensure(baseline.get("attributes", 0) >= 385, "attribute baseline regressed")
          '''
          text = text[:start] + state_block + text[end:]
          exact = "    verify_release_record()\n    verify_deterministic_assets()\n    verify_state()\n"
          historical = "    verify_release_record()\n    verify_state()\n"
          if text.count(exact) != 1:
              raise SystemExit("publication verifier call sequence differs")
          verifier.write_text(text.replace(exact, historical, 1), encoding="utf-8")

          tests = Path("tests/test_data_products_v1_8_0_publication.py")
          text = tests.read_text(encoding="utf-8")
          marker = "    def test_verifier_and_project_state_accept_publication(self) -> None:\n"
          start = text.index(marker)
          end = text.index("\n\nif __name__ == \"__main__\":", start)
          replacement = '''    def test_verifier_and_project_state_preserve_publication_history(self) -> None:
              completed = subprocess.run(
                  [sys.executable, str(VERIFIER), "--check"],
                  cwd=ROOT,
                  text=True,
                  capture_output=True,
                  check=False,
              )
              self.assertEqual(
                  completed.returncode,
                  0,
                  completed.stderr or completed.stdout,
              )
              self.assertIn(
                  "PASS: Data Products v1.8.0 publication",
                  completed.stdout,
              )
              state = json.loads(STATE.read_text(encoding="utf-8"))
              self.assertTrue(state["phase"])
              self.assertTrue(state["current_package"]["name"])
              self.assertIn(
                  state["current_package"]["status"],
                  {"planned", "active", "blocked", "complete"},
              )
              self.assertTrue(state["next_package"]["name"])
              self.assertGreaterEqual(state["baseline"]["tests"], 1022)
          '''
          tests.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
      - name: Synchronize state and run focused contracts
        run: |
          set -euo pipefail
          python tools/dkb.py project-state --apply
          node --check tools/reporting/configuration_shortlist_browser.js
          node --check tools/reporting/configuration_shortlist_v12.js
          node tests/contracts/configuration_shortlist_v12_contract.js
          python tools/review_equipment_filter_regression_model_price_order_20260726.py --check
          python -m unittest tests.test_equipment_filter_regression_model_price_order
          python -m unittest tests.test_configuration_shortlist_html
      - name: Run real Chromium equipment smoke test
        run: |
          set -euo pipefail
          python tools/dkb.py configuration-shortlist --html "$RUNNER_TEMP/configuration-shortlist.html"
          HTML="$RUNNER_TEMP/configuration-shortlist.html" python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["HTML"])
          text = path.read_text(encoding="utf-8")
          smoke = r'''
          <script>
          window.addEventListener("load", () => {
            setTimeout(() => {
              const shown = (button) => !button.hidden && !button.closest("section[hidden]");
              const initial = [...document.querySelectorAll(".equipment-choice")].filter(shown).length;
              const search = document.querySelector("[data-equipment-search]");
              search.value = "kamera";
              search.dispatchEvent(new Event("input", {bubbles: true}));
              const camera = [...document.querySelectorAll(".equipment-choice")].filter(shown);
              if (camera.length === 1) camera[0].click();
              setTimeout(() => {
                document.body.dataset.equipmentSmoke = JSON.stringify({
                  initial,
                  camera: [...document.querySelectorAll(".equipment-choice")].filter(shown).length,
                  selected: Number(document.querySelector("[data-selected-count]").textContent),
                  matched: Number(document.querySelector("#matched-count").textContent),
                  pressed: camera.length === 1 ? camera[0].getAttribute("aria-pressed") : null
                });
              }, 250);
            }, 250);
          });
          </script>
          '''
          path.write_text(text.replace("</body>", smoke + "</body>", 1), encoding="utf-8")
          PY
          browser="$(command -v chromium-browser || command -v chromium || command -v google-chrome)"
          "$browser" --headless --no-sandbox --disable-gpu --allow-file-access-from-files \
            --virtual-time-budget=4000 --dump-dom \
            "file://$RUNNER_TEMP/configuration-shortlist.html" \
            > "$RUNNER_TEMP/configuration-shortlist-dom.html"
          DOM="$RUNNER_TEMP/configuration-shortlist-dom.html" python - <<'PY'
          import html
          import json
          import os
          import re
          from pathlib import Path

          text = Path(os.environ["DOM"]).read_text(encoding="utf-8")
          match = re.search(r'data-equipment-smoke="([^"]+)"', text)
          if not match:
              raise SystemExit("Chromium smoke result is missing")
          result = json.loads(html.unescape(match.group(1)))
          expected = {
              "initial": 108,
              "camera": 1,
              "selected": 1,
              "matched": 66,
              "pressed": "true",
          }
          if result != expected:
              raise SystemExit(f"Chromium smoke mismatch: {result!r}")
          print("PASS: Chromium equipment filtering and selection", result)
          PY
      - name: Run full repository validation
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/dkb.py validate
          python tools/dkb.py project-state --check
      - name: Commit materialized package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md project/ROADMAP.md project/SESSION_STATE.md \
            project/STATE_SUMMARY.md project/state.json \
            tools/reporting/configuration_shortlist_browser.js \
            tools/reporting/configuration_shortlist_html.py \
            tools/reporting/configuration_shortlist_v12.js \
            tests/test_configuration_shortlist_html.py \
            tools/review_data_products_v1_8_0_publication_20260726.py \
            tests/test_data_products_v1_8_0_publication.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix(data-products): restore equipment filtering and price-order models'
            git push origin HEAD:agent/equipment-filter-regression-model-price-order
          fi
