name: Temporary Apply Spring Cable Commercial Semantics

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/spring-charging-cable-commercial-semantics-20260802'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/spring-charging-cable-commercial-semantics-20260802
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'

      - name: Harden migrator idempotence
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/migrate_spring_charging_cable_commercial_semantics_20260802.py')
          text = path.read_text(encoding='utf-8')
          old = '''    before_counts = {
        "commercial_items": len(items),
        "commercial_item_attributes": len(memberships),
        "commercial_item_configurations": len(mappings),
        "master_rows": before_master,
    }

    historical = spec["historical_type2_membership"]
'''
          new = '''    before_counts = {
        "commercial_items": len(items),
        "commercial_item_attributes": len(memberships),
        "commercial_item_configurations": len(mappings),
        "master_rows": before_master,
    }

    item_codes = {row["code"] for row in items}
    membership_codes = {row["code"] for row in memberships}
    mapping_codes = {row["code"] for row in mappings}
    expected_item_code = expected_current_item(spec)["code"]
    expected_type2_code = expected_type2_membership(spec)["code"]
    expected_domestic_membership_code = expected_domestic_membership(spec)["code"]
    expected_mapping_codes = {
        row["code"] for row in expected_domestic_mappings(spec)
    }
    already_applied = (
        expected_item_code in item_codes
        and expected_type2_code in membership_codes
        and expected_domestic_membership_code in membership_codes
        and expected_mapping_codes.issubset(mapping_codes)
        and spec["historical_type2_membership"]["old_membership_code"]
        not in membership_codes
        and (root / REPORT_JSON.relative_to(ROOT)).is_file()
    )
    if already_applied:
        verify(root)
        return

    historical = spec["historical_type2_membership"]
'''
          if text.count(old) != 1:
              raise SystemExit('idempotence patch target drifted')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply bounded migration
        run: |
          python tools/migrate_spring_charging_cable_commercial_semantics_20260802.py --apply
          python tools/migrate_spring_charging_cable_commercial_semantics_20260802.py --apply
          python tools/dkb.py documentation-baseline --apply
          python tools/dkb.py project-state --apply
          python tools/migrate_spring_charging_cable_commercial_semantics_20260802.py --verify
          python - <<'PY'
          from pathlib import Path
          path = Path('project/packages/spring-charging-cable-commercial-semantics-review-20260802.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'Status: in progress until generated migration output and full Quality are verified',
              'Status: complete',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit migration and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            README.md \
            data/master/commercial_items.csv \
            data/master/commercial_item_attributes.csv \
            data/master/commercial_item_configurations.csv \
            data/reporting/spring_charging_cable_commercial_semantics_review.json \
            data/reporting/spring_charging_cable_commercial_semantics_review.md \
            project/SESSION_STATE.md \
            project/STATE_SUMMARY.md \
            project/packages/spring-charging-cable-commercial-semantics-review-20260802.md \
            project/state.json \
            tools/migrate_spring_charging_cable_commercial_semantics_20260802.py
          git rm .github/workflows/temp-apply-spring-cable-commercial-semantics.yml
          git commit -m "data: apply Spring cable commercial semantics"
          git push origin HEAD:agent/spring-charging-cable-commercial-semantics-20260802
