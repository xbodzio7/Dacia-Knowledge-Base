name: AI sync PR 465 generated documentation

on:
  pull_request_target:
    types: [reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.number == 465
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
      - name: Synchronize canonical generated documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/dkb.py project-state --apply
          python3 tools/dkb.py project-state --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md project/SESSION_STATE.md project/STATE_SUMMARY.md project/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs: synchronize project state after Spring white migration'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
