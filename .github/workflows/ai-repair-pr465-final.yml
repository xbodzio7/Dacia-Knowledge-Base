name: AI validate final PR 465 head

on:
  pull_request_target:
    types: [reopened]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.number == 465
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate exact final head
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools scripts tests
          python -m unittest discover -s tests -p 'test_*.py' -q
          python -m unittest -q \
            tests.project_state_contract \
            tests.autonomy_policy_contract \
            tests.quality_artifact_manifest_contract \
            tests.configuration_comparison_context_filter_contract \
            tests.configuration_comparison_pair_summary_contract
          python tools/dkb.py project-state --check
          python tools/run_quality_checks.py
