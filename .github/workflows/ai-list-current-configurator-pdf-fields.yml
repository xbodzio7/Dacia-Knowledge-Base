name: AI list current configurator PDF fields
on:
  push:
    branches: [ai/dacia-configurator-pdf-archive-20260809]
    paths: [.github/workflows/ai-list-current-configurator-pdf-fields.yml]
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
      - name: Write list
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/reporting/dacia_configurator_pdf_compact_field_inventory_20260809.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          lines=[]
          for i,x in enumerate(d['technical_fields'],1):
              ex=' | '.join(e['value'] for e in x['examples'][:4])
              lines.append(f"{i:02d}\t{x['label']}\t{','.join(x['families'])}\t{ex}")
          lines.append('\nUNPARSED')
          lines.extend(f"{x['occurrences']}\t{x['line']}" for x in d['unparsed_technical_lines'])
          Path('data/reporting/dacia_configurator_pdf_technical_fields_20260809.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reporting/dacia_configurator_pdf_technical_fields_20260809.txt
          git commit -m "data(reporting): list configurator PDF technical fields"
          git pull --rebase origin ai/dacia-configurator-pdf-archive-20260809
          git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
