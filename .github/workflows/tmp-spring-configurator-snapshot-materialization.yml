name: Temporary Spring Configurator Snapshot Materialization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/spring-official-configurator-snapshot-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-official-configurator-snapshot-20260731
          fetch-depth: 0

      - name: Materialize registered snapshot package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          snapshot = {
            "version": 1,
            "source_code": "src_pl_spring_official_configurator_20260731",
            "source_type": "web_snapshot",
            "publisher": "Dacia",
            "market": "PL",
            "observed_on": "2026-07-31",
            "model_code": "spring",
            "model_name": "SPRING",
            "volatility": "dynamic_official_web",
            "entry_points": {
              "configurator": "https://www.dacia.pl/hybrydy-i-elektryczne/spring-miejski/konfigurator.html",
              "versions": "https://www.dacia.pl/hybrydy-i-elektryczne/spring-miejski/ceny-i-wersje.html",
              "comparison": "https://www.dacia.pl/hybrydy-i-elektryczne/spring-miejski/porownaj.html",
              "equipment": "https://www.dacia.pl/hybrydy-i-elektryczne/spring-miejski/wyposazenie.html"
            },
            "version_observations": [
              {
                "version_code": "spring_essential",
                "version_name": "essential",
                "grade_code": "ENS_MDL2P1SERIELIM1",
                "version_url": "https://www.dacia.pl/hybrydy-i-elektryczne/spring-miejski/ceny-i-wersje.html?gradeCode=ENS_MDL2P1SERIELIM1",
                "equipment_url": "https://www.dacia.pl/hybrydy-i-elektryczne/spring-miejski/wyposazenie.html?gradeCode=ENS_MDL2P1SERIELIM1",
                "configuration_state": {
                  "state_label": "SPRING essential 70 MY26.b",
                  "powertrain_label": "electric 70",
                  "transmission_type": "automatic",
                  "catalog_price_pln": 73500,
                  "price_evidence": "exact_visible_default_configurator_state",
                  "power_kw": 52,
                  "power_hp": 70,
                  "battery_capacity_kwh": 24.3,
                  "wltp_range_km": 221,
                  "wltp_consumption_kwh_per_100km": 12.7,
                  "zero_to_100_seconds": 12.3
                },
                "standard_highlights": [
                  {"source_label": "Media Control"},
                  {"source_label": "silnik 70 KM"},
                  {"source_label": "światła do jazdy dziennej LED"},
                  {"source_label": "tylne czujniki parkowania"},
                  {"source_label": "cyfrowy zestaw wskaźników 7″"}
                ],
                "unassigned_items": [
                  {
                    "name": "kabel do ładowania z gniazda domowego",
                    "visible_price_pln": 1500,
                    "imported": false,
                    "reason": "Snapshot registration does not import option applicability or prices."
                  }
                ]
              },
              {
                "version_code": "spring_expression",
                "version_name": "expression",
                "grade_code": "ENS_MDL2P1SERIELIM2",
                "version_url": "https://www.dacia.pl/hybrydy-i-elektryczne/spring-miejski/ceny-i-wersje.html?gradeCode=ENS_MDL2P1SERIELIM2",
                "equipment_url": "https://www.dacia.pl/hybrydy-i-elektryczne/spring-miejski/wyposazenie.html?gradeCode=ENS_MDL2P1SERIELIM2",
                "configuration_state": {
                  "state_label": "SPRING expression electric 70",
                  "powertrain_label": "electric 70",
                  "transmission_type": "automatic",
                  "catalog_price_pln": null,
                  "price_evidence": "not_accepted",
                  "visible_repeated_price_pln": 73500,
                  "price_rejection_reason": "The combined version page repeats the Essential starting price in the Expression and Extreme sections and does not provide a reliable grade-specific catalogue price."
                },
                "standard_highlights": [
                  {"source_label": "dwukolorowa tapicerka"},
                  {"source_label": "klimatyzacja manualna"},
                  {"source_label": "klamki w kolorze nadwozia"},
                  {"source_label": "koła 15″"},
                  {"source_label": "osłony dołu drzwi"}
                ],
                "unassigned_items": [
                  {
                    "name": "pakiet TECHNO",
                    "visible_components": ["Media Display", "wyjście USB-C", "kamera cofania"],
                    "imported": false,
                    "reason": "The broad grade equipment page does not prove an exact configuration-level package price or selected state."
                  }
                ]
              },
              {
                "version_code": "spring_extreme",
                "version_name": "extreme",
                "grade_code": "ENS_MDL2P1SERIELIM3",
                "version_url": "https://www.dacia.pl/hybrydy-i-elektryczne/spring-miejski/ceny-i-wersje.html?gradeCode=ENS_MDL2P1SERIELIM3",
                "equipment_url": "https://www.dacia.pl/hybrydy-i-elektryczne/spring-miejski/wyposazenie.html?gradeCode=ENS_MDL2P1SERIELIM3",
                "comparison_url": "https://www.dacia.pl/hybrydy-i-elektryczne/spring-miejski/porownaj.html",
                "configuration_state": {
                  "state_label": "SPRING extreme electric 100",
                  "powertrain_label": "electric 100",
                  "transmission_type": "automatic",
                  "catalog_price_pln": 85900,
                  "price_evidence": "exact_official_comparison_state",
                  "power_kw": 75,
                  "power_hp": 100,
                  "battery_capacity_kwh": 24.3,
                  "wltp_range_km": 225,
                  "zero_to_100_seconds": 9.6,
                  "ac_charging_kw": 7,
                  "dc_charging_kw": 40
                },
                "standard_highlights": [
                  {"source_label": "Media Display"},
                  {"source_label": "kamera cofania"},
                  {"source_label": "komputer pokładowy"},
                  {"source_label": "silnik 100 KM"},
                  {"source_label": "elektryczne lusterka wsteczne"}
                ],
                "unassigned_items": [
                  {
                    "name": "pakiet POWER",
                    "visible_price_pln": 3000,
                    "imported": false,
                    "reason": "The comparison page is retained as snapshot evidence; package selection and exact applicability require a separate import review."
                  },
                  {
                    "name": "pakiet CITY",
                    "visible_price_pln": 1800,
                    "imported": false,
                    "reason": "The comparison page is retained as snapshot evidence; package selection and exact applicability require a separate import review."
                  }
                ]
              }
            ],
            "cross_page_findings": [
              {"finding": "three_current_grades", "value": ["essential", "expression", "extreme"]},
              {"finding": "two_current_powertrain_families", "value": ["electric 70", "electric 100"]},
              {
                "finding": "grade_powertrain_applicability",
                "accepted": [
                  {"grade": "essential", "powertrain": "electric 70"},
                  {"grade": "expression", "powertrain": "electric 70"},
                  {"grade": "extreme", "powertrain": "electric 100"}
                ],
                "rejected_generalization": "No other grade/powertrain combination is created without an exact official state."
              },
              {
                "finding": "price_conflict",
                "accepted_prices": [
                  {"grade": "essential", "powertrain": "electric 70", "catalog_price_pln": 73500},
                  {"grade": "extreme", "powertrain": "electric 100", "catalog_price_pln": 85900}
                ],
                "unresolved_grade": "expression",
                "reason": "The version page repeats 73,500 PLN across grade sections while the independent configurator/comparison pages prove only Essential and Extreme prices."
              }
            ],
            "normalization_rules": [
              "Only an exact official grade and powertrain state is recorded as observed.",
              "A catalogue price is accepted only when an exact grade/powertrain state is visible on the configurator or comparison page.",
              "A repeated starting price on a combined version page is not reassigned to another grade.",
              "Grade-level equipment pages remain supporting evidence and are not flattened into configuration-level availability.",
              "Options, packages, accessories, financing, campaigns and dealer-stock prices are excluded from master-data import in this snapshot package.",
              "The dynamic snapshot does not supersede the registered 2026-02-19 brochure or the 2026-07-08 model-year-2025 stock price list.",
              "Spring Cargo is not represented as a passenger configurator state without an exact current configurator page."
            ],
            "registration_only": true
          }

          source_path = Path('project/sources/dacia-pl-spring-configurator-20260731.json')
          source_path.parent.mkdir(parents=True, exist_ok=True)
          source_text = json.dumps(snapshot, ensure_ascii=False, indent=2) + '\n'
          source_path.write_text(source_text, encoding='utf-8')
          source_sha = hashlib.sha256(source_text.encode('utf-8')).hexdigest()

          sources_path = Path('data/master/sources.csv')
          with sources_path.open(encoding='utf-8', newline='') as handle:
              source_rows = list(csv.DictReader(handle))
          assert max(int(row['id']) for row in source_rows) == 32
          assert snapshot['source_code'] not in {row['code'] for row in source_rows}
          with sources_path.open('a', encoding='utf-8', newline='') as handle:
              csv.writer(handle, lineterminator='\n').writerow([
                  33,
                  snapshot['source_code'],
                  'web_snapshot',
                  'Dacia Polska Spring official configurator and version observations',
                  'Dacia',
                  'PL',
                  '2026-07-31',
                  snapshot['entry_points']['configurator'],
                  str(source_path),
                  source_sha,
                  'active',
                  'Dated exact Spring grade and powertrain observations. Essential 70 and Extreme 100 prices are accepted from exact states; the repeated Expression price remains unresolved and no observations are imported in the registration package.',
              ])

          source_models_path = Path('data/master/source_models.csv')
          with source_models_path.open(encoding='utf-8', newline='') as handle:
              relation_rows = list(csv.DictReader(handle))
          assert max(int(row['id']) for row in relation_rows) == 36
          with source_models_path.open('a', encoding='utf-8', newline='') as handle:
              csv.writer(handle, lineterminator='\n').writerow([
                  37,
                  snapshot['source_code'],
                  'spring',
                  'web_configuration_for',
                  'Official Polish Spring configurator, comparison, version and grade-equipment pages observed 2026-07-31; exact states only.',
              ])

          receipt = {
            'version': 1,
            'kind': 'spring_official_configurator_snapshot',
            'observed_on': '2026-07-31',
            'status': 'complete',
            'source_code': snapshot['source_code'],
            'snapshot_path': str(source_path),
            'snapshot_sha256': source_sha,
            'observed_grade_count': 3,
            'observed_state_count': 3,
            'accepted_catalog_price_count': 2,
            'unresolved_catalog_price_count': 1,
            'accepted_states': [
              {'grade': 'essential', 'powertrain': 'electric 70', 'catalog_price_pln': 73500},
              {'grade': 'expression', 'powertrain': 'electric 70', 'catalog_price_pln': None},
              {'grade': 'extreme', 'powertrain': 'electric 100', 'catalog_price_pln': 85900}
            ],
            'boundaries': {
              'master_configurations_imported': False,
              'catalog_prices_imported': False,
              'equipment_imported': False,
              'technical_values_imported': False,
              'repeated_expression_price_accepted': False,
              'unobserved_grade_powertrain_combinations_created': False,
              'cargo_state_created': False,
              'registered_pdf_sources_superseded': False,
              'public_release_modified': False
            },
            'decision': 'REGISTER_SPRING_OFFICIAL_CONFIGURATOR_SNAPSHOT',
            'next_package': 'Spring Source-Backed Data Import Review'
          }
          report_dir = Path('data/reporting')
          report_dir.mkdir(parents=True, exist_ok=True)
          (report_dir / 'spring_official_configurator_snapshot.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          (report_dir / 'spring_official_configurator_snapshot.md').write_text(
              f'''# Spring Official Configurator Snapshot\n\nDate: 2026-07-31\n\nStatus: **complete**\n\n## Registered snapshot\n\nThe dated normalized snapshot is stored at `project/sources/dacia-pl-spring-configurator-20260731.json` with SHA-256 `{source_sha}`.\n\nIt records three exact official grade/powertrain states:\n\n- Essential — electric 70 — exact configurator price 73,500 PLN;\n- Expression — electric 70 — grade and powertrain accepted, catalogue price unresolved;\n- Extreme — electric 100 — exact comparison price 85,900 PLN.\n\n## Conflict preserved\n\nThe combined version page repeats the Essential starting price of 73,500 PLN in the Expression and Extreme sections. That repeated value is not treated as a grade-specific price. The independently visible Essential configurator and Extreme comparison prices remain the only accepted catalogue prices in this snapshot.\n\n## Boundaries\n\nThis package registers dated evidence only. It imports no configuration, price, equipment, option, package or technical observation, creates no Cargo state and does not supersede the immutable Spring brochure or MY25 stock price list.\n\nDecision: `REGISTER_SPRING_OFFICIAL_CONFIGURATOR_SNAPSHOT`.\n\n## Next package\n\n**Spring Source-Backed Data Import Review** — determine which exact configurations, prices, equipment and technical values are import-ready across the two PDFs and this dynamic snapshot while preserving the unresolved Expression price.\n''',
              encoding='utf-8'
          )

          state_path = Path('project/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['updated_on'] = '2026-07-31'
          state['phase'] = 'Spring Official Configurator Snapshot'
          state['reference_delivery'] = {
              'name': 'Spring Official PDF Source Registration',
              'pull_request': 421,
              'head_sha': 'eed558adfe1260b19598837b5b80b9e9efa384ee',
              'quality_run': 2746,
          }
          state['baseline']['rows'] = 11386
          state['current_package'] = {
              'package_id': 'spring_official_configurator_snapshot_001',
              'kind': 'source_snapshot',
              'name': 'Spring Official Configurator Snapshot',
              'status': 'complete',
              'goal': 'Capture and register dated exact official Dacia Poland Spring configurator states for every explicitly observed grade and powertrain combination, preserving applicability and catalogue-price boundaries without importing master data.',
              'manifest_paths': [
                  'project/sources/dacia-pl-spring-configurator-20260731.json',
                  'data/master/sources.csv',
                  'data/master/source_models.csv',
                  'data/reporting/spring_official_configurator_snapshot.json',
                  'data/reporting/spring_official_configurator_snapshot.md',
                  'project/state.json',
                  'project/STATE_SUMMARY.md',
                  'CHANGELOG.md',
                  'README.md',
                  'project/SESSION_STATE.md',
              ],
          }
          state['next_package'] = {
              'package_id': 'spring_source_backed_data_import_review_001',
              'kind': 'data_import_review',
              'name': 'Spring Source-Backed Data Import Review',
              'status': 'planned',
              'goal': 'Review the registered Spring brochure, MY25 stock price list and dated configurator snapshot to select exact import-ready configurations, prices, equipment and technical values while preserving grade, powertrain, stock, footnote and unresolved-price boundaries.',
              'manifest_paths': [
                  'data/reporting/spring_source_backed_data_import_review.json',
                  'data/reporting/spring_source_backed_data_import_review.md',
                  'project/reviews/spring-source-backed-data-import-review-2026-07-31.md',
                  'project/state.json',
                  'project/STATE_SUMMARY.md',
              ],
          }
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python tools/dkb.py project-state --apply
          python tools/dkb.py project-state --check
          git diff --check

          rm .github/workflows/tmp-spring-configurator-snapshot-materialization.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data(sources): register Spring configurator snapshot'
          git push origin HEAD:agent/spring-official-configurator-snapshot-20260731
