name: Refresh Existing Configuration Gap Analysis

on:
  push:
    branches:
      - codex/bigster-brochure-grade-details-20251210
    paths:
      - ".github/workflows/refresh-existing-configuration-gap-analysis.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Regenerate dependent analysis outputs without changing project state
        run: |
          python - <<'PY'
          from tools.existing_configuration_missing_data_analysis import (
              OUT_JSON, OUT_MD, collect, render_markdown, write_json,
          )
          payload = collect()
          write_json(OUT_JSON, payload)
          OUT_MD.write_text(render_markdown(payload), encoding="utf-8")
          print(payload["summary"])
          PY

      - name: Commit refreshed analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reporting/existing_configuration_missing_data_analysis.json data/reporting/existing_configuration_missing_data_analysis.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh dependent completeness analysis [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
