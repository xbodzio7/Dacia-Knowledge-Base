name: Versioned Data Product Release

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - project/state.json
      - project/STATE_SUMMARY.md
      - project/reviews/**
  workflow_dispatch:
    inputs:
      version:
        description: Semantic data-product version MAJOR.MINOR.PATCH
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version || '0.0.0' }}
      RELEASE_DIR: release-candidate
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Run release regression tests
        run: python -m unittest -q tests.test_data_product_release
      - name: Build release candidate
        run: |
          python tools/data_product_release.py \
            --version "${RELEASE_VERSION}" \
            --commit-sha "${GITHUB_SHA}" \
            --output-directory "${RELEASE_DIR}"
      - name: Verify release candidate
        run: |
          python tools/data_product_release.py \
            --verify \
            --version "${RELEASE_VERSION}" \
            --commit-sha "${GITHUB_SHA}" \
            --output-directory "${RELEASE_DIR}"
      - name: Upload verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: versioned-data-product-release-candidate
          path: release-candidate
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: github.event_name == 'workflow_dispatch'
    needs: build-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ github.event.inputs.version }}
      RELEASE_DIR: release-candidate
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release publication is allowed only from main." >&2
            exit 1
          fi
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Download verified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: versioned-data-product-release-candidate
          path: release-candidate
      - name: Verify downloaded candidate
        run: |
          python tools/data_product_release.py \
            --verify \
            --version "${RELEASE_VERSION}" \
            --commit-sha "${GITHUB_SHA}" \
            --output-directory "${RELEASE_DIR}"
      - name: Resolve release identity
        id: identity
        shell: bash
        run: |
          python - <<'PY' >> "${GITHUB_OUTPUT}"
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "tools"))
          from reporting.data_product_release_model import archive_name, release_tag

          version = os.environ["RELEASE_VERSION"]
          print(f"tag={release_tag(version)}")
          print(f"archive={archive_name(version)}")
          PY
      - name: Reject existing tag or release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          check_absent() {
            local endpoint="$1"
            local label="$2"
            local output
            local status
            set +e
            output="$(gh api --silent "${endpoint}" 2>&1)"
            status=$?
            set -e
            if [[ ${status} -eq 0 ]]; then
              echo "${label} already exists: ${RELEASE_TAG}" >&2
              exit 1
            fi
            if [[ "${output}" != *"(HTTP 404)"* ]]; then
              echo "Unable to prove ${label} absence; refusing publication." >&2
              printf '%s\n' "${output}" >&2
              exit 1
            fi
          }
          check_absent \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            "Release"
          check_absent \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            "Tag"
      - name: Extract deterministic release notes
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.identity.outputs.archive }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          root = Path(os.environ["RELEASE_DIR"])
          with ZipFile(root / os.environ["ARCHIVE_NAME"]) as archive:
              notes = archive.read("RELEASE_NOTES.md")
          (root / "RELEASE_NOTES.md").write_bytes(notes)
          PY
      - name: Publish immutable GitHub Release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          ARCHIVE_NAME: ${{ steps.identity.outputs.archive }}
        run: |
          gh release create "${RELEASE_TAG}" \
            "${RELEASE_DIR}/${ARCHIVE_NAME}" \
            "${RELEASE_DIR}/data-product-release-manifest.json" \
            "${RELEASE_DIR}/SHA256SUMS" \
            --target "${GITHUB_SHA}" \
            --title "Dacia Knowledge Base Data Products v${RELEASE_VERSION}" \
            --notes-file "${RELEASE_DIR}/RELEASE_NOTES.md"

  # BEGIN TEMPORARY DATA PRODUCTS V1.12.1 PUBLISHER
  publish-data-products-v1-12-1:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release: activate Data Products v1.12.1 through registered workflow')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact publication commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Verify publication state and release absence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("project/state.json").read_text(encoding="utf-8"))
          assert state["next_package"]["package_id"] == "data_products_v1_12_1_publication_001"
          assert state["execution_policy"]["release_double_build_required"] is True
          assert state["execution_policy"]["release_exact_source_sha_required"] is True
          PY
          if gh release view data-products-v1.12.1 >/dev/null 2>&1; then
            echo "Release already exists; refusing to rewrite it."
            exit 1
          fi
          if git rev-parse data-products-v1.12.1 >/dev/null 2>&1; then
            echo "Tag already exists; refusing to rewrite it."
            exit 1
          fi

      - name: Run focused release contracts
        run: |
          python -m unittest -q \
            tests.test_data_products_v1_12_1_corrective_release \
            tests.test_portfolio_model_family_release_integration \
            tests.test_portfolio_model_family_workspace_entry_point \
            tests.test_data_product_release \
            tests.test_data_product_release_download
          python tools/dkb.py project-state --check

      - name: Build exact assets twice
        run: |
          python tools/dkb.py data-product-release \
            --output-directory "${RUNNER_TEMP}/release-a" \
            --version 1.12.1 \
            --commit-sha "${GITHUB_SHA}"
          python tools/dkb.py data-product-release \
            --output-directory "${RUNNER_TEMP}/release-b" \
            --version 1.12.1 \
            --commit-sha "${GITHUB_SHA}"
          diff -qr "${RUNNER_TEMP}/release-a" "${RUNNER_TEMP}/release-b"

      - name: Verify assets and complete offline workspace
        run: |
          python tools/dkb.py data-product-release \
            --output-directory "${RUNNER_TEMP}/release-a" \
            --verify
          export RELEASE_ASSETS="${RUNNER_TEMP}/release-a"
          export OFFLINE_WORKSPACE="${RUNNER_TEMP}/workspace"
          PYTHONPATH=tools python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          from reporting.data_product_release_download import ASSETS_DIRECTORY_NAME, CONTENTS_DIRECTORY_NAME, _extract_verified_contents
          from reporting.data_product_release_model import verify_release_assets
          from reporting.data_product_workspace_index import write_workspace_index

          release_assets = Path(os.environ["RELEASE_ASSETS"])
          workspace = Path(os.environ["OFFLINE_WORKSPACE"])
          assets = workspace / ASSETS_DIRECTORY_NAME
          contents = workspace / CONTENTS_DIRECTORY_NAME
          shutil.copytree(release_assets, assets)
          manifest = verify_release_assets(assets)
          entry_points = _extract_verified_contents(assets, contents, manifest)
          metadata = {
              "release_version": manifest["release_version"],
              "release_tag": manifest["release_tag"],
              "repository_commit": manifest["repository_commit"],
              "release_url": "https://github.com/xbodzio7/Dacia-Knowledge-Base/releases/tag/" + manifest["release_tag"],
          }
          write_workspace_index(workspace, manifest, metadata)
          assert entry_points["model_family_summary_html"] == "contents/model-families/portfolio_model_family_summary.html"
          family = workspace / entry_points["model_family_summary_html"]
          assert family.is_file()
          index = (workspace / "index.html").read_text(encoding="utf-8")
          assert "Model family summary" in index
          assert "contents/model-families/portfolio_model_family_summary.html" in index
          cross_model = (contents / "cross-model" / "cross-model-comparison-view.html").read_text(encoding="utf-8")
          assert "../model-families/portfolio_model_family_summary.html" in cross_model
          PY
          python tools/dkb.py data-product-workspace-verify \
            --workspace-directory "${RUNNER_TEMP}/workspace" \
            --json
          unzip -p \
            "${RUNNER_TEMP}/release-a/dacia-knowledge-base-data-products-v1.12.1.zip" \
            RELEASE_NOTES.md > "${RUNNER_TEMP}/release-notes.md"
          grep -F "v1.12.1 corrective workspace interface" "${RUNNER_TEMP}/release-notes.md"

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create data-products-v1.12.1 \
            "${RUNNER_TEMP}/release-a/dacia-knowledge-base-data-products-v1.12.1.zip" \
            "${RUNNER_TEMP}/release-a/data-product-release-manifest.json" \
            "${RUNNER_TEMP}/release-a/SHA256SUMS" \
            --target "${GITHUB_SHA}" \
            --title "Dacia Knowledge Base Data Products v1.12.1" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
          gh release view data-products-v1.12.1 --json databaseId -q '.databaseId' > "${RUNNER_TEMP}/release-id.txt"

      - name: Verify public assets byte for byte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "${RUNNER_TEMP}/public"
          gh release download data-products-v1.12.1 --dir "${RUNNER_TEMP}/public"
          diff -q "${RUNNER_TEMP}/release-a/dacia-knowledge-base-data-products-v1.12.1.zip" "${RUNNER_TEMP}/public/dacia-knowledge-base-data-products-v1.12.1.zip"
          diff -q "${RUNNER_TEMP}/release-a/data-product-release-manifest.json" "${RUNNER_TEMP}/public/data-product-release-manifest.json"
          diff -q "${RUNNER_TEMP}/release-a/SHA256SUMS" "${RUNNER_TEMP}/public/SHA256SUMS"
          python tools/dkb.py data-product-release \
            --output-directory "${RUNNER_TEMP}/public" \
            --verify

      - name: Record publication and remove temporary automation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/release-a
          RELEASE_ID_FILE: ${{ runner.temp }}/release-id.txt
          SOURCE_SHA: ${{ github.sha }}
        run: |
          export RELEASE_ID="$(cat "${RELEASE_ID_FILE}")"
          export PUBLICATION_PR="497"
          export PUBLICATION_RUN_ID="${GITHUB_RUN_ID}"
          python tools/record_data_products_v1_12_1_publication_20260803.py
          python tools/dkb.py project-state --apply
          python tools/dkb.py documentation-baseline --apply
          python tools/dkb.py project-state --check
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/data-product-release.yml')
          marker = '  # BEGIN TEMPORARY DATA PRODUCTS V1.12.1 PUBLISHER\n'
          text = path.read_text(encoding='utf-8')
          path.write_text(text.split(marker, 1)[0].rstrip() + '\n', encoding='utf-8')
          PY
          rm tools/record_data_products_v1_12_1_publication_20260803.py
          rm .github/workflows/temporary-publish-data-products-v1.12.1.yml
          rm project/packages/data-products-v1.12.1-publication-trigger-20260803.md
          rm project/packages/data-products-v1.12.1-quality-publisher-bridge-20260803.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release(data-products): record v1.12.1 publication"
          git push origin HEAD:main
  # END TEMPORARY DATA PRODUCTS V1.12.1 PUBLISHER
