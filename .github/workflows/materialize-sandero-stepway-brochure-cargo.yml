name: Materialize Sandero Stepway Brochure Cargo

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/materialize-sandero-stepway-brochure-cargo.yml
      - data/imports/configuration_cargo_values/sandero-stepway-brochure-cargo-20260202.json
      - tools/import_sandero_stepway_brochure_cargo_20260725.py
      - tools/complete_sandero_stepway_brochure_cargo_20260725.py
      - tests/test_sandero_stepway_brochure_cargo_20260725.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/sandero-stepway-brochure-cargo-import
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore test classes, materialize and persist diagnostics
        run: |
          set +e
          : > .github/sandero-cargo-diagnostic.log
          python - <<'PY' >> .github/sandero-cargo-diagnostic.log 2>&1
          from pathlib import Path

          def indent_first_method(path_name: str, start: str, end: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              if "    " + start in text:
                  return
              left = text.find(start)
              if left < 0:
                  raise RuntimeError(f"top-level method missing: {path_name}: {start!r}")
              right = text.find(end, left)
              if right < 0:
                  raise RuntimeError(f"next class method missing: {path_name}: {end!r}")
              block = text[left:right]
              lines = block.splitlines(keepends=True)
              repaired = "".join(
                  ("    " + line if line.strip() else line)
                  for line in lines
              )
              path.write_text(text[:left] + repaired + text[right:], encoding="utf-8")

          indent_first_method(
              "tests/test_brochure_cargo_context_schema_foundation.py",
              "def test_semantic_validator_accepts_materialized_relation(self) -> None:\n",
              "    def test_semantic_validator_rejects_duplicate_value_context(self) -> None:\n",
          )
          indent_first_method(
              "tests/test_official_dacia_brochure_sources_20260725.py",
              "def test_registration_keeps_versions_unprojected_and_derived_links_unique(self) -> None:\n",
              "    def test_gap_review_preserves_context_and_explicit_non_imports(self) -> None:\n",
          )

          workbook = Path("tests/test_configuration_comparison_workbook.py")
          text = workbook.read_text(encoding="utf-8")
          old = '            "A1:K9",\n'
          new = '            "A1:K10",\n'
          if new not in text:
              if old not in text:
                  raise RuntimeError("Sources worksheet dimension anchor missing")
              workbook.write_text(text.replace(old, new, 1), encoding="utf-8")
          print("PASS: test class boundaries and workbook dimensions restored")
          PY
          status=$?

          if [ "$status" -eq 0 ]; then
            python tools/complete_sandero_stepway_brochure_cargo_20260725.py --apply >> .github/sandero-cargo-diagnostic.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/import_sandero_stepway_brochure_cargo_20260725.py --apply >> .github/sandero-cargo-diagnostic.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> .github/sandero-cargo-diagnostic.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/complete_sandero_stepway_brochure_cargo_20260725.py --check >> .github/sandero-cargo-diagnostic.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/import_sandero_stepway_brochure_cargo_20260725.py --check >> .github/sandero-cargo-diagnostic.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> .github/sandero-cargo-diagnostic.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' >> .github/sandero-cargo-diagnostic.log 2>&1
            status=$?
          fi
          cat .github/sandero-cargo-diagnostic.log

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'chore(data): persist Sandero cargo diagnostics'
            git push origin HEAD:agent/sandero-stepway-brochure-cargo-import
          fi
          exit "$status"
