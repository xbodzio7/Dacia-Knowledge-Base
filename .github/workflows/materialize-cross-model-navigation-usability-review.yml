          write(
              "data/reporting/cross_model_navigation_usability_review.json",
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
          )

          review = """# Cross-Model Navigation Usability Review

Date: 2026-07-27

## Decision

Select a conditional fifth `Start here` card in the generated workspace `index.html`.

The card should be titled `Models and comparison scopes`, describe the product as a model-family route to existing reports and link to:

```text
contents/cross-model/cross-model-comparison-view.html
```

It must appear only when the exact verified release member `cross-model/cross-model-comparison-view.html` exists.

## Current discoverability gap

Public `data-products-v1.8.1` contains eighty-five verified content files. Its generated workspace index contains eighty-three local links:

- four primary product cards;
- seventy-six report links across nineteen scopes;
- three original-asset links.

The four current primary cards lead to the shortlist, workbook, bundle manifest and release notes. Neither cross-model member is linked from the landing page.

The published cross-model HTML is already a complete consumer-facing navigation product. It presents five model families, nineteen established scopes and fifty-seven local report launches while preserving all comparison boundaries. Because the landing page does not link it, a user must know the internal path or discover it through documentation outside the workspace.

## Selected option

The selected option is one conditional primary card.

For a release containing the verified HTML member:

- the primary-card count changes from four to five;
- the total local-link count for the current v1.8.1 workspace changes from eighty-three to eighty-four;
- the card opens the existing immutable cross-model HTML;
- no cross-model JSON parsing or duplicated model rendering is added to the workspace index.

For an older release without the member, the index remains byte-compatible with its existing four-card product set after regeneration by the same implementation version.

## Why this option

The existing cross-model product already provides model-family cards, anchors to relevant scopes and links to existing reports. Recreating those structures in `index.html` would duplicate logic and increase maintenance risk.

Adding search or filtering to the cross-model page would change an immutable release member and require a new semantic version. That is not necessary to close the current discovery gap.

The selected card is therefore the smallest change with the highest consumer value. It uses the existing verified inventory and safe-path mechanisms, requires no new architecture and leaves release assets untouched.

## Implementation contract

The implementation package must:

- detect the exact HTML member in the verified release manifest;
- require the corresponding local file to exist under `contents/`;
- use the existing safe relative-path and percent-encoding helpers;
- add exactly one primary card when present;
- retain exactly four primary cards when absent;
- keep the cross-model JSON as a non-primary machine-readable product;
- preserve an offline, JavaScript-free workspace index;
- update synthetic fixtures for both member-present and member-absent cases;
- verify every local link;
- preserve deterministic Linux/Windows bytes;
- smoke-test a public v1.8.1 download.

## Boundaries

This review changes no public tag or release asset, imports no data and changes no schema or comparison engine. It creates no pair, ranking, recommendation or inferred value.

The historical v1.8.1 audit remains exact at eighty-three workspace links. A later downloader implementation may generate an eighty-four-link index from the same immutable assets; that does not rewrite the historical public audit.

## Next package

`Cross-Model Workspace Entry Point` — implement the selected conditional primary card and its compatibility tests without modifying or republishing `data-products-v1.8.1`.
"""
