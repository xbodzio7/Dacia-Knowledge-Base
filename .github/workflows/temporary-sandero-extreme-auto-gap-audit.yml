name: Temporary Sandero Extreme Automatic Gap Materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temporary-sandero-extreme-auto-gap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/sandero-stepway-extreme-auto-source-gap-20260801'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install PDF backend
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
      - name: Generate package contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace_required(text: str, old: str, new: str) -> str:
              if old not in text:
                  if new in text:
                      return text
                  raise SystemExit(f'missing replacement anchor: {old[:100]!r}')
              return text.replace(old, new)

          importer = (root / 'tools/import_sandero_stepway_expression_auto_source_gap_20260626.py').read_text(encoding='utf-8')
          replacements = [
              ('Stepway Expression automatic', 'Stepway Extreme automatic'),
              ('Stepway Expression Automatic', 'Stepway Extreme Automatic'),
              ('sandero_stepway_expression_auto_source_gap_20260626', 'sandero_stepway_extreme_auto_source_gap_20260626'),
              ('sandero-stepway-expression-auto-source-gap-20260801', 'sandero-stepway-extreme-auto-source-gap-20260801'),
              ('NOWE SANDERO STEPWAY expression stepway Eco-G 120 auto f.pdf', 'NOWE SANDERO STEPWAY extreme stepway Eco-G 120 auto f.pdf'),
              ('src_pl_sandero_stepway_expression_ecog120_at_20260626', 'src_pl_sandero_stepway_extreme_ecog120_at_20260626'),
              ('385409e33a0932e48cbd901b5805f873831ec005c6451cd6ed1623a06fa15667', 'a519c2002231cd28f92999c2d8af76fb5c58e6129ac6d5521c6436e471349aff'),
              ('sandero_stepway_iii_expression_ecog120_automatic', 'sandero_stepway_iii_extreme_ecog120_automatic'),
              ('EXPECTED_VALUE_FIRST_ID = 3561', 'EXPECTED_VALUE_FIRST_ID = 3564'),
              ('EXPECTED_VALUE_LAST_ID = 3563', 'EXPECTED_VALUE_LAST_ID = 3565'),
              ('EXPECTED_RANGE_FIRST_ID = 311', 'EXPECTED_RANGE_FIRST_ID = 314'),
              ('EXPECTED_RANGE_LAST_ID = 313', 'EXPECTED_RANGE_LAST_ID = 316'),
              ('EXPECTED_AVAILABILITY_FIRST_ID = 5904', 'EXPECTED_AVAILABILITY_FIRST_ID = 5905'),
              ('EXPECTED_AVAILABILITY_LAST_ID = 5904', 'EXPECTED_AVAILABILITY_LAST_ID = 5905'),
              ('if len(rows) != 7:', 'if len(rows) != 6:'),
              ('expected 7 specification rows', 'expected 6 specification rows'),
              ('"reviewed_unique_slots": 14', '"reviewed_unique_slots": 13'),
              ('"technical_slots": 12', '"technical_slots": 11'),
              ('"resolved_unique_slots": 7', '"resolved_unique_slots": 6'),
              ('against 14 unique gap decisions', 'against 13 unique gap decisions'),
              ('"source_page": 3', '"source_page": 4'),
              ('rear parking-assistance statement', 'front/rear parking-assistance statement'),
              ('Imported three exact scalar observations', 'Imported two exact scalar observations'),
              ('(3 values + 3 ranges + 1 availability)', '(2 values + 3 ranges + 1 availability)'),
              ('sandero_stepway_expression_auto_source_gap_004', 'sandero_stepway_extreme_auto_source_gap_005'),
              ('highest_impact_eligible_gap_005', 'highest_impact_eligible_gap_006'),
          ]
          for old, new in replacements:
              importer = replace_required(importer, old, new)

          importer = replace_required(
              importer,
              '    ("value", "wheel_finish", "", "stalowe", "", "", ""),\n',
              '',
          )
          importer = replace_required(
              importer,
              '                {"attribute_code": "wheel_finish", "value": "stalowe", "source_page": 2},\n',
              '',
          )
          importer = replace_required(
              importer,
              '        "- `wheel_finish = stalowe` from the selected 16-inch ATARA steel wheels.\\n"\n',
              '',
          )
          importer = replace_required(
              importer,
              '        "wheel_finish",\n',
              '',
          )
          importer = replace_required(
              importer,
              'based on the direct rear parking-assistance statement',
              'based on the direct front/rear parking-assistance statement',
          )
          importer = replace_required(
              importer,
              'Resolve every safely representable missing slot from the exact Stepway Expression Eco-G 120 automatic source',
              'Resolve every safely representable missing slot from the exact Stepway Extreme Eco-G 120 automatic source',
          )
          (root / 'tools/import_sandero_stepway_extreme_auto_source_gap_20260626.py').write_text(importer, encoding='utf-8')

          close = (root / 'tools/close_stepway_expression_auto_reporting_dependencies_20260801.py').read_text(encoding='utf-8')
          close = close.replace('Stepway Expression automatic', 'Stepway Extreme automatic')
          close = close.replace('sandero_stepway_iii_expression_ecog120_automatic', 'sandero_stepway_iii_extreme_ecog120_automatic')
          close = close.replace('src_pl_sandero_stepway_expression_ecog120_at_20260626', 'src_pl_sandero_stepway_extreme_ecog120_at_20260626')
          close = close.replace('    ("technical", "wheel_finish", ""),\n', '')
          (root / 'tools/close_stepway_extreme_auto_reporting_dependencies_20260801.py').write_text(close, encoding='utf-8')

          align = (root / 'tools/align_sandero_stepway_expression_auto_snapshot_contracts_20260801.py').read_text(encoding='utf-8')
          align = align.replace('Stepway Expression automatic', 'Stepway Extreme automatic')
          align = align.replace('sandero_stepway_expression_auto_snapshot_contracts_20260801', 'sandero_stepway_extreme_auto_snapshot_contracts_20260801')
          align = align.replace('close_stepway_expression_auto_reporting_dependencies_20260801', 'close_stepway_extreme_auto_reporting_dependencies_20260801')
          align = align.replace('import_sandero_stepway_expression_auto_source_gap_20260626 as package', 'import_sandero_stepway_extreme_auto_source_gap_20260626 as package')
          align = align.replace('import_sandero_stepway_expression_auto_source_gap_20260626.py', 'import_sandero_stepway_extreme_auto_source_gap_20260626.py')
          align = align.replace('test_sandero_stepway_expression_auto_source_gap_20260626.py', 'test_sandero_stepway_extreme_auto_source_gap_20260626.py')
          history = '''\n\ndef align_previous_auto_contract() -> None:\n    target = ROOT / "tools/import_sandero_stepway_expression_auto_source_gap_20260626.py"\n    text = target.read_text(encoding="utf-8")\n    old = ''' + '"""' + '''    state = json.loads(STATE.read_text(encoding="utf-8"))\n    if (\n        state["current_package"]["package_id"]\n        != "sandero_stepway_expression_auto_source_gap_004"\n    ):\n        raise ContractError("project state does not identify the completed package")\n''' + '"""' + '''\n    new = ''' + '"""' + '''    state = json.loads(STATE.read_text(encoding="utf-8"))\n    if int(state["baseline"]["configuration_values"]) < EXPECTED_VALUE_LAST_ID:\n        raise ContractError("project state baseline predates the completed package")\n''' + '"""' + '''\n    if old in text:\n        text = text.replace(old, new, 1)\n    elif new not in text:\n        raise AlignmentError("Expression automatic historical state contract not found")\n    write_text(target, text)\n'''
          align = replace_required(align, '\n\ndef align_range_contracts(range_count: int) -> None:\n', history + '\n\ndef align_range_contracts(range_count: int) -> None:\n')
          align = replace_required(align, '    align_previous_contracts()\n', '    align_previous_contracts()\n    align_previous_auto_contract()\n')
          align = replace_required(
              align,
              '    "tools/import_sandero_stepway_extreme_auto_source_gap_20260626.py",\n',
              '    "tools/import_sandero_stepway_extreme_auto_source_gap_20260626.py",\n    "tools/import_sandero_stepway_expression_auto_source_gap_20260626.py",\n',
          )
          (root / 'tools/align_sandero_stepway_extreme_auto_snapshot_contracts_20260801.py').write_text(align, encoding='utf-8')
          PY
          cat > tests/test_sandero_stepway_extreme_auto_source_gap_20260626.py <<'PYTEST'
          """Contract tests for the exact Stepway Extreme automatic source-gap package."""
          from __future__ import annotations

          import json
          import unittest

          from tools import import_sandero_stepway_extreme_auto_source_gap_20260626 as package


          class SanderoStepwayExtremeAutomaticSourceGapTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  cls.spec = package.load_spec()
                  cls.values = package.generated_value_rows(cls.spec)
                  cls.ranges = package.generated_range_rows(cls.spec)
                  cls.availability = package.generated_availability_rows(cls.spec)

              def test_exact_source_identity_and_specification(self) -> None:
                  self.assertEqual(package.sha256(package.SOURCE), package.SOURCE_SHA256)
                  self.assertEqual(len(self.spec), 6)
                  self.assertEqual(len(self.values), 2)
                  self.assertEqual(len(self.ranges), 3)
                  self.assertEqual(len(self.availability), 1)

              def test_two_scalar_values_are_exact(self) -> None:
                  self.assertEqual(
                      {(row["attribute_code"], row["fuel_type_code"]): row["value"] for row in self.values},
                      {("overall_height", ""): "1586", ("overall_width_with_mirrors", ""): "2012"},
                  )

              def test_three_ranges_preserve_printed_endpoints(self) -> None:
                  self.assertEqual(
                      {(row["attribute_code"], row["fuel_type_code"]): (row["minimum_value"], row["maximum_value"]) for row in self.ranges},
                      {
                          ("ground_clearance", ""): ("170", "200"),
                          ("max_torque_rpm", "lpg"): ("1750", "3750"),
                          ("max_torque_rpm", "petrol"): ("2000", "4000"),
                      },
                  )

              def test_front_rear_parking_assistance_is_direct_standard_equipment(self) -> None:
                  row = self.availability[0]
                  self.assertEqual(row["attribute_code"], "parking_assist_system")
                  self.assertEqual(row["availability_status"], "standard")
                  self.assertIn("front/rear parking assistance", row["notes"])

              def test_materialized_ids_are_exact_contiguous_suffixes(self) -> None:
                  values = package.selected_by_codes(package.read_rows(package.VALUE_OUTPUT), {row["code"] for row in self.values})
                  ranges = package.selected_by_codes(package.read_rows(package.RANGE_OUTPUT), {row["code"] for row in self.ranges})
                  availability = package.selected_by_codes(package.read_rows(package.AVAILABILITY_OUTPUT), {row["code"] for row in self.availability})
                  self.assertEqual(sorted(int(row["id"]) for row in values), [3564, 3565])
                  self.assertEqual(sorted(int(row["id"]) for row in ranges), [314, 315, 316])
                  self.assertEqual(sorted(int(row["id"]) for row in availability), [5905])

              def test_review_partitions_resolved_out_of_scope_and_unstated_slots(self) -> None:
                  review = json.loads(package.REVIEW_JSON.read_text(encoding="utf-8"))
                  self.assertEqual(review, package.review_payload())
                  reconciliation = review["reconciliation"]
                  self.assertEqual(reconciliation["resolved_unique_slots"], 6)
                  self.assertEqual(reconciliation["preserved_out_of_scope_slots"], 1)
                  self.assertEqual(reconciliation["remaining_unique_slots"], 6)

              def test_reanalysis_exhausts_source_and_advances_selection(self) -> None:
                  payload = package.analysis.collect(package.ROOT)
                  current = next(item for item in payload["ranked_candidates"] if item["source_code"] == package.SOURCE_CODE)
                  self.assertEqual(current["selection_status"], package.EXHAUSTED_CLASSIFICATION)
                  selected = payload.get("selected_next_package")
                  if selected is not None:
                      self.assertEqual(selected["selection_status"], "eligible")
                      self.assertNotEqual(selected["source_code"], package.SOURCE_CODE)

              def test_full_materialized_contract_passes(self) -> None:
                  package.verify_materialized()


          if __name__ == "__main__":
              unittest.main()
          PYTEST
          python -m compileall -q \
            tools/import_sandero_stepway_extreme_auto_source_gap_20260626.py \
            tools/close_stepway_extreme_auto_reporting_dependencies_20260801.py \
            tools/align_sandero_stepway_extreme_auto_snapshot_contracts_20260801.py \
            tests/test_sandero_stepway_extreme_auto_source_gap_20260626.py
      - name: Apply package
        run: |
          python -m tools.import_sandero_stepway_extreme_auto_source_gap_20260626
          python -m tools.close_stepway_extreme_auto_reporting_dependencies_20260801
          python tools/dkb.py configuration-gap-resolution-plan \
            --write-plan-spec data/reporting/configuration_gap_resolution_plan.json \
            --json "$RUNNER_TEMP/configuration-gap-resolution-plan.json" \
            --markdown "$RUNNER_TEMP/configuration-gap-resolution-plan.md"
          python tools/dkb.py project-state --apply
          python -m tools.align_sandero_stepway_extreme_auto_snapshot_contracts_20260801
          python tools/dkb.py project-state --apply
          python tools/dkb.py documentation-baseline --apply
          python -m tools.import_sandero_stepway_extreme_auto_source_gap_20260626 --check
          python -m tools.close_stepway_extreme_auto_reporting_dependencies_20260801 --check
          python tools/dkb.py project-state --check
      - name: Run focused tests
        run: |
          python -m unittest -v tests.test_sandero_stepway_extreme_auto_source_gap_20260626
          python -m unittest -v tests.test_sandero_stepway_ecog120_automatic_reporting_scope
          python -m unittest -v tests.test_sandero_stepway_expression_auto_source_gap_20260626
          python -m unittest -v tests.test_configuration_value_ranges
          python -m unittest -v tests.test_sandero_equipment_availability
          python -m unittest -v tests.configuration_comparison_context_filter_contract
          python -m unittest -v tests.configuration_comparison_pair_summary_contract
          python -m unittest -v tests.test_configuration_comparison_workbook
      - name: Run full quality gate
        run: |
          set +e
          python tools/dkb.py quality --database "$RUNNER_TEMP/dkb.sqlite" > "$RUNNER_TEMP/quality.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            grep -nE 'FAIL|ERROR|AssertionError|Traceback|FAILED|expected|actual|ContractError|AlignmentError' "$RUNNER_TEMP/quality.log" | tail -n 220 || true
            tail -n 380 "$RUNNER_TEMP/quality.log"
          else
            tail -n 120 "$RUNNER_TEMP/quality.log"
          fi
          exit "$code"
      - name: Commit generated package
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- \
            ':!.github/workflows/temporary-sandero-extreme-auto-gap-audit.yml' \
            ':!tools/audit_sandero_stepway_extreme_auto_source_gap_20260801.py'
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'data: close Stepway Extreme automatic source gap'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
