name: AI trace Spring commercial migrator

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture traceback
        shell: bash
        run: |
          set -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/ai-trace-spring-commercial-migrator.yml
          git add -A
          git commit -m 'ci: remove Spring commercial migrator tracer'
          git push origin HEAD:main
          git fetch origin agent/spring-charging-cable-commercial-semantics-migration-20260802
          git checkout -B agent/spring-charging-cable-commercial-semantics-migration-20260802 origin/agent/spring-charging-cable-commercial-semantics-migration-20260802
          git merge origin/main --no-edit > /tmp/merge.log 2>&1
          merge_status=$?
          python3 tools/apply_spring_charging_cable_commercial_semantics_migration_20260802.py > /tmp/migrate.log 2>&1
          migrate_status=$?
          {
            echo "merge_status=$merge_status"
            cat /tmp/merge.log
            echo
            echo "migrate_status=$migrate_status"
            cat /tmp/migrate.log
          } > project/spring-commercial-migrator-trace.txt
          git reset --hard HEAD
          cp /tmp/merge.log /tmp/merge.saved
          {
            echo "merge_status=$merge_status"
            cat /tmp/merge.saved
            echo
            echo "migrate_status=$migrate_status"
            cat /tmp/migrate.log
          } > project/spring-commercial-migrator-trace.txt
          git add project/spring-commercial-migrator-trace.txt
          git commit -m 'diagnostic: capture Spring commercial migrator traceback'
          git push origin HEAD:agent/spring-charging-cable-commercial-semantics-migration-20260802
          exit 0
