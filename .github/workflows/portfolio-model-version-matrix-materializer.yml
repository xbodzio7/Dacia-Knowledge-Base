name: Portfolio Model Version Matrix Materializer

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  materialize-version-matrix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/portfolio-model-version-comparison-matrix-001' &&
      github.event.pull_request.base.sha == '04d34de919558d83c35fc5a8095b53a310e0041f'
    concurrency:
      group: portfolio-model-version-matrix-materializer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Generate deterministic outputs
        run: |
          python tools/portfolio_model_version_comparison_matrix.py \
            --json data/reporting/portfolio_model_version_comparison_matrix.json \
            --csv data/reporting/portfolio_model_version_comparison_matrix.csv \
            --html data/reporting/portfolio_model_version_comparison_matrix.html
      - name: Integrate checks without changing test count
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_portfolio_model_family_summary.py')
          text = path.read_text(encoding='utf-8')
          import_marker = (
              'import portfolio_model_family_summary as summary_cli  # noqa: E402\n'
          )
          import_line = (
              'from tests.version_matrix_checks import '
              'run_version_matrix_checks  # noqa: E402\n'
          )
          if import_line not in text:
              if import_marker not in text:
                  raise SystemExit('family-product test import marker not found')
              text = text.replace(
                  import_marker,
                  import_marker + import_line,
                  1,
              )

          call = '        run_version_matrix_checks(self, REPOSITORY)\n\n'
          next_method = (
              '    def test_family_order_and_commercial_counts_are_exact'
              '(self) -> None:\n'
          )
          if call not in text:
              if next_method not in text:
                  raise SystemExit('family-product test method marker not found')
              text = text.replace(next_method, call + next_method, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify materialized package
        run: |
          python -m unittest -q tests.test_portfolio_model_family_summary
          python tools/dkb.py project-state --check
      - name: Commit generated package and remove bridge
        run: |
          rm -f .github/workflows/portfolio-model-version-matrix-materializer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(reporting): materialize model-version comparison matrix'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
