name: Temporary Spring Colour Materializer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-spring-colour-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/spring-exterior-colour-options-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Apply reviewed colour contract
        shell: bash
        run: |
          set -euo pipefail
          python tools/import_spring_exterior_colour_options.py --apply

          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          aggregate_path = Path("tests/test_commercial_items_20260703.py")
          aggregate = aggregate_path.read_text(encoding="utf-8")
          replacements = {
              "self.assertEqual(len(self.items), 33)": "self.assertEqual(len(self.items), 39)",
              "self.assertEqual(len(self.members), 87)": "self.assertEqual(len(self.members), 93)",
              "self.assertEqual(len(self.mappings), 149)": "self.assertEqual(len(self.mappings), 167)",
          }
          for old, new in replacements.items():
              if aggregate.count(old) != 1:
                  raise SystemExit(f"Aggregate count anchor not found exactly once: {old}")
              aggregate = aggregate.replace(old, new, 1)
          aggregate_path.write_text(aggregate, encoding="utf-8")

          manifest = sorted([
              "CHANGELOG.md",
              "README.md",
              "data/imports/spring_exterior_colour_options_20260219.csv",
              "data/master/commercial_item_attributes.csv",
              "data/master/commercial_item_configurations.csv",
              "data/master/commercial_items.csv",
              "project/ROADMAP.md",
              "project/SESSION_STATE.md",
              "project/STATE_SUMMARY.md",
              "project/packages/spring-exterior-colour-options-20260731.md",
              "project/state.json",
              "tests/test_commercial_items_20260703.py",
              "tests/test_spring_exterior_colour_options.py",
              "tools/import_spring_exterior_colour_options.py",
          ])
          state_path = Path("project/state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          state["phase"] = "Spring Exterior Colour Options"
          state["current_package"] = {
              "package_id": "spring_exterior_colour_options_001",
              "kind": "commercial_catalog_import",
              "name": "Spring Exterior Colour Options",
              "status": "complete",
              "goal": "Register the six source-visible Spring exterior-colour choices as unpriced options for exactly the three existing Spring configurations, preserving finish classes and avoiding a fabricated standard colour or current price.",
              "manifest_paths": manifest,
          }
          state["next_package"] = {
              "package_id": "jogger_my26_fog_light_superseding_observations_001",
              "kind": "equipment_availability_import",
              "name": "Jogger MY26 Fog-Light Superseding Observations",
              "status": "planned",
              "goal": "Add six dated July 2026 not-available observations for front fog lights on the existing Jogger Expression configurations while retaining the April 2026 standard history.",
              "manifest_paths": [
                  "CHANGELOG.md",
                  "README.md",
                  "data/imports/jogger_front_fog_lights_20260703.csv",
                  "data/master/configuration_attribute_availability.csv",
                  "project/STATE_SUMMARY.md",
                  "project/packages/jogger-my26-fog-light-superseding-observations-20260731.md",
                  "project/state.json",
                  "tests/test_jogger_fog_light_superseding_observations.py",
                  "tools/import_jogger_fog_light_superseding_observations.py",
              ],
          }
          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          anchor = (
              "schematu i nie tworzy ceny. Nie dodano modeli, wersji ani konfiguracji.\n"
          )
          addition = anchor + (
              "\nPaleta Spring ze strony 12 jest modelowana osobno jako sześć wybieralnych\n"
              "opcji kolorystycznych dla trzech istniejących konfiguracji: Czerwony Brick,\n"
              "Seafoam, Szary Diamond, Lichen Khaki, Niebieski Stonewash i Biel Alpejska.\n"
              "Zachowano pięć lakierów niemetalizowanych i jeden metalizowany. Źródło nie\n"
              "podaje ceny, koloru standardowego ani ograniczeń wersji, więc kwoty i daty\n"
              "cen są puste, a pojedyncza wartość koloru konfiguracji nie jest wymyślana.\n"
          )
          if addition not in readme:
              if anchor not in readme:
                  raise SystemExit("Spring colour README anchor not found")
              readme_path.write_text(readme.replace(anchor, addition, 1), encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "### Added\n\n"
          bullet = (
              "* Added six source-bounded Spring exterior-colour options from brochure page 12, with five non-metallic and one metallic finish, eighteen exact optional mappings to the three existing Spring configurations, blank amounts and price dates, no fabricated standard colour and no new model, version or configuration.\n"
          )
          if bullet not in changelog:
              if marker not in changelog:
                  raise SystemExit("CHANGELOG Added marker not found")
              changelog_path.write_text(changelog.replace(marker, marker + bullet, 1), encoding="utf-8")
          PY

          python tools/dkb.py project-state --apply

      - name: Verify focused package
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_spring_exterior_colour_options \
            tests.test_commercial_items_20260703 \
            -v
          python tools/import_spring_exterior_colour_options.py --check
          python tools/validate_dkb.py
          python tools/dkb.py project-state --check

      - name: Commit final package and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch -- \
            .github/workflows/temporary-spring-colour-extraction.yml \
            .github/workflows/temporary-spring-colour-materializer.yml
          git add -- \
            CHANGELOG.md \
            README.md \
            data/imports/spring_exterior_colour_options_20260219.csv \
            data/master/commercial_item_attributes.csv \
            data/master/commercial_item_configurations.csv \
            data/master/commercial_items.csv \
            project/ROADMAP.md \
            project/SESSION_STATE.md \
            project/STATE_SUMMARY.md \
            project/packages/spring-exterior-colour-options-20260731.md \
            project/state.json \
            tests/test_commercial_items_20260703.py \
            tests/test_spring_exterior_colour_options.py \
            tools/import_spring_exterior_colour_options.py
          git commit -m "feat(data): import Spring exterior colour options"
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = sorted(
              json.loads(Path("project/state.json").read_text(encoding="utf-8"))
              ["current_package"]["manifest_paths"]
          )
          actual = sorted(
              line
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"],
                  text=True,
              ).splitlines()
              if line
          )
          if actual != expected:
              raise SystemExit(
                  f"Final manifest mismatch:\nexpected={expected!r}\nactual={actual!r}"
              )
          print(f"Final package manifest verified: {len(actual)} paths.")
          PY
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
