name: Temporary Stepway Default Evidence Closer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temporary-stepway-default-evidence-closer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close:
    if: github.event.pull_request.head.ref == 'agent/stepway-essential-source-gap-20260801'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install PDF backend
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
      - name: Align package and export contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          importer = Path('tools/import_sandero_stepway_essential_source_gap_20260626.py')
          text = importer.read_text(encoding='utf-8')
          marker = 'MANIFEST_PATHS = [\n'
          additions = [
              '    "data/reporting/configuration_gap_evidence.json",',
              '    "data/reporting/configuration_gap_resolution_plan.json",',
              '    "tests/configuration_comparison_context_filter_contract.py",',
              '    "tests/configuration_comparison_pair_summary_contract.py",',
              '    "tests/test_duster_ecog120_reporting_scope.py",',
          ]
          missing = [line for line in additions if line not in text]
          if missing:
              text = text.replace(marker, marker + '\n'.join(missing) + '\n', 1)
              importer.write_text(text, encoding='utf-8')

          replacements_by_path = {
              Path('tests/configuration_comparison_context_filter_contract.py'): {
                  'len(core.difference_csv_rows(report)), 365': 'len(core.difference_csv_rows(report)), 371',
                  '"fuel_type_code=": 160': '"fuel_type_code=": 164',
              },
              Path('tests/configuration_comparison_pair_summary_contract.py'): {
                  '        365,': '        371,',
              },
              Path('tests/test_duster_ecog120_reporting_scope.py'): {
                  'default["summary"]["total_differences"], 365': 'default["summary"]["total_differences"], 371',
              },
          }
          for path, replacements in replacements_by_path.items():
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  if old in text:
                      text = text.replace(old, new, 1)
                  elif new not in text:
                      raise SystemExit(f'Missing contract in {path}: {old}')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Materialize dependencies
        run: |
          rm -f stepway-current-report.json stepway-essential-quality-diagnostic.txt
          python -m tools.close_stepway_essential_reporting_dependencies_20260801
          python tools/dkb.py configuration-gap-resolution-plan \
            --write-plan-spec data/reporting/configuration_gap_resolution_plan.json \
            --json "$RUNNER_TEMP/configuration-gap-resolution-plan.json" \
            --markdown "$RUNNER_TEMP/configuration-gap-resolution-plan.md"
          python tools/dkb.py project-state --apply
          python tools/dkb.py documentation-baseline --apply
          python tools/dkb.py project-state --check
          python -m tools.close_stepway_essential_reporting_dependencies_20260801 --check
      - name: Run package tests
        run: |
          python -m unittest -v tests.test_sandero_stepway_essential_source_gap_20260626
          python -m unittest -v tests.configuration_comparison_context_filter_contract
          python -m unittest -v tests.configuration_comparison_pair_summary_contract
          python -m unittest -v tests.test_duster_ecog120_reporting_scope
          python -m unittest -v \
            tests.test_bigster_brochure_cargo_20260726.BigsterBrochureCargoTests.test_gap_resolution_plan_accepts_contextual_bigster_history \
            tests.test_duster_brochure_cargo_20260726.DusterBrochureCargoTests.test_gap_resolution_plan_accepts_contextual_duster_history \
            tests.test_jogger_brochure_cargo_20260726.JoggerBrochureCargoTests.test_gap_resolution_plan_accepts_contextual_jogger_history \
            tests.test_sandero_stepway_brochure_cargo_20260725.SanderoStepwayBrochureCargoTests.test_import_contract_check_passes
      - name: Run full quality gate
        run: |
          cp .github/workflows/temporary-stepway-default-evidence-closer.yml "$RUNNER_TEMP/workflow.yml"
          rm .github/workflows/temporary-stepway-default-evidence-closer.yml
          set +e
          python tools/dkb.py quality --database "$RUNNER_TEMP/dkb.sqlite" > "$RUNNER_TEMP/quality.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo '--- concise quality failure ---'
            grep -nE 'FAIL|ERROR|AssertionError|Traceback|FAILED|expected|actual' "$RUNNER_TEMP/quality.log" | tail -n 120 || true
            echo '--- final quality log ---'
            tail -n 240 "$RUNNER_TEMP/quality.log"
          else
            tail -n 80 "$RUNNER_TEMP/quality.log"
          fi
          cp "$RUNNER_TEMP/workflow.yml" .github/workflows/temporary-stepway-default-evidence-closer.yml
          exit "$code"
      - name: Commit package
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- ':!.github/workflows/temporary-stepway-default-evidence-closer.yml'
          if git diff --cached --quiet; then
            echo 'No package changes.'
            exit 0
          fi
          git commit -m 'fix(reporting): close Stepway default evidence decisions'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
