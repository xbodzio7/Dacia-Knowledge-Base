name: Verify Cross-Model Comparison View Foundation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/verify-cross-model-comparison-view-foundation.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out foundation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/cross-model-comparison-view-foundation
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install PDF backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Verify complete foundation
        shell: bash
        run: |
          set +e
          log=.github/cross-model-comparison-view-foundation.log
          : > "$log"
          status=0
          python -m py_compile \
            tools/cross_model_comparison_view.py \
            tools/reporting/cross_model_comparison_view.py \
            tools/reporting/data_product_release.py \
            tools/dkb.py \
            tests/test_cross_model_comparison_view.py \
            tests/test_data_product_release.py >> "$log" 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest tests.test_cross_model_comparison_view >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest tests.test_data_product_release >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py cross-model-comparison-view \
              --json "${RUNNER_TEMP}/cross-model-view.json" \
              --html "${RUNNER_TEMP}/cross-model-view.html" >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py data-product-release \
              --version 9.9.9 \
              --commit-sha 9999999999999999999999999999999999999999 \
              --output-directory "${RUNNER_TEMP}/release" >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py data-product-release \
              --verify \
              --version 9.9.9 \
              --commit-sha 9999999999999999999999999999999999999999 \
              --output-directory "${RUNNER_TEMP}/release" >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py validate >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> "$log" 2>&1 || status=$?
          fi
          echo "exit_status=$status" >> "$log"
          cat "$log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$log" README.md CHANGELOG.md project/ROADMAP.md \
            project/SESSION_STATE.md project/STATE_SUMMARY.md project/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'feat(data-products): materialize cross-model view foundation'
            git push origin HEAD:agent/cross-model-comparison-view-foundation
          fi
          exit "$status"
