name: Materialize Official Dacia Brochure Registration

on:
  push:
    branches:
      - agent/official-dacia-brochure-source-registration
    paths:
      - .github/workflows/materialize-official-dacia-brochures.yml
  pull_request:
    branches:
      - main
    types:
      - reopened
    paths:
      - .github/workflows/materialize-official-dacia-brochures.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/official-dacia-brochure-source-registration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Materialize registered sources and project state
        run: |
          python tools/register_official_dacia_brochures_20260725.py --apply
          python tools/dkb.py project-state --apply

      - name: Add package narrative
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('CHANGELOG.md'): (
                  '* Added six exact Duster Eco-G 120 automatic ISO 3832 cargo observations: 439 dm3 without a spare wheel and 1373 dm3 maximum capacity for Expression, Extreme and Journey; petrol CO2 remains unknown because the catalogue does not split 123 g/km by fuel.\n',
                  '* Added six exact Duster Eco-G 120 automatic ISO 3832 cargo observations: 439 dm3 without a spare wheel and 1373 dm3 maximum capacity for Expression, Extreme and Journey; petrol CO2 remains unknown because the catalogue does not split 123 g/km by fuel.\n'
                  '* Archived and registered five official Polish Bigster, Jogger, Sandero, Sandero Stepway and Duster brochures with immutable SHA-256 identities, model-level relationships and a context-preserving technical gap review; no brochure observations were imported.\n',
              ),
              Path('README.md'): (
                  'Następny pakiet zamyka lukę bagażnika automatów na podstawie oficjalnego polskiego cennika MY26: każda z konfiguracji Expression, Extreme i Journey otrzymuje 439 dm3 ISO 3832 bez koła zapasowego oraz 1373 dm3 maksymalnej pojemności. Wartość 123 g/km z kolumny dwupaliwowej nie jest przypisywana benzynie bez jawnego rozdzielenia paliwa. Szczegóły zawiera `project/packages/duster-ecog120-automatic-cargo-emissions-review-20260725.md`.\n',
                  'Następny pakiet zamyka lukę bagażnika automatów na podstawie oficjalnego polskiego cennika MY26: każda z konfiguracji Expression, Extreme i Journey otrzymuje 439 dm3 ISO 3832 bez koła zapasowego oraz 1373 dm3 maksymalnej pojemności. Wartość 123 g/km z kolumny dwupaliwowej nie jest przypisywana benzynie bez jawnego rozdzielenia paliwa. Szczegóły zawiera `project/packages/duster-ecog120-automatic-cargo-emissions-review-20260725.md`.\n\n'
                  'Kolejny pakiet archiwizuje i rejestruje pięć oficjalnych polskich broszur Dacii: Bigster, Jogger, Sandero, Sandero Stepway i Duster. Broszury są powiązane wyłącznie z modelami, a audyt klasyfikuje wartości powtarzające istniejące źródła, dane wymagające kontekstu biegu, układu siedzeń lub standardu pomiaru oraz jawne zakazy importu. W tym pakiecie nie dodano żadnych obserwacji technicznych. Szczegóły zawierają `project/packages/official-dacia-brochure-source-registration-20260725.md` i `project/reviews/official-dacia-brochure-gap-review-2026-07-25.md`.\n',
              ),
              Path('project/ROADMAP.md'): (
                  '- sześć katalogowych obserwacji bagażnika ISO 3832 dla Duster Eco-G 120 automatic: 439 dm3 bez koła zapasowego i 1373 dm3 maksymalnej pojemności dla Expression, Extreme i Journey, z zachowaniem benzynowego CO2 jako niewiadomego,\n',
                  '- sześć katalogowych obserwacji bagażnika ISO 3832 dla Duster Eco-G 120 automatic: 439 dm3 bez koła zapasowego i 1373 dm3 maksymalnej pojemności dla Expression, Extreme i Journey, z zachowaniem benzynowego CO2 jako niewiadomego,\n'
                  '- pięć zarchiwizowanych oficjalnych broszur Bigster, Jogger, Sandero, Sandero Stepway i Duster z przypiętymi SHA-256, modelowymi relacjami źródłowymi oraz audytem luk zachowującym kontekst standardu pomiaru, siedzeń, biegu i wyposażenia bagażnika,\n',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'missing narrative anchor: {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify complete package
        run: |
          python tools/register_official_dacia_brochures_20260725.py --check
          python tools/dkb.py project-state --check
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit materialized package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/master/sources.csv \
            data/master/source_models.csv \
            project/STATE_SUMMARY.md \
            project/SESSION_STATE.md \
            project/ROADMAP.md \
            README.md \
            CHANGELOG.md
          git diff --cached --check
          git commit -m 'data(sources): materialize official Dacia brochure registration' || true
          git push origin HEAD:agent/official-dacia-brochure-source-registration
