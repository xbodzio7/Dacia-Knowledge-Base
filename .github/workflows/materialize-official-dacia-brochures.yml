name: Verify Official Dacia Brochure Registration

on:
  pull_request:
    branches:
      - main
    types:
      - reopened
    paths:
      - .github/workflows/materialize-official-dacia-brochures.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/official-dacia-brochure-source-registration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Refresh historical state contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tests/test_duster_ecog120_automatic_cargo_20260725.py'): [
                  (
                      '"Duster Eco-G 120 Automatic Cargo and Emissions Gap Review"',
                      '"Official Dacia Brochure Source Registration and Gap Review"',
                  ),
                  ('state["baseline"]["tests"], 758', 'state["baseline"]["tests"], 765'),
                  ('state["baseline"]["rows"], 8135', 'state["baseline"]["rows"], 8145'),
              ],
              Path('tests/test_duster_ecog120_automatic_homologation_20260725.py'): [
                  (
                      '"Duster Eco-G 120 Automatic Cargo and Emissions Gap Review"',
                      '"Official Dacia Brochure Source Registration and Gap Review"',
                  ),
                  ('state["baseline"]["tests"], 758', 'state["baseline"]["tests"], 765'),
                  ('state["baseline"]["rows"], 8135', 'state["baseline"]["rows"], 8145'),
              ],
              Path('tests/test_jogger_payload_performance_ranges.py'): [
                  ('baseline["tests"], 758', 'baseline["tests"], 765'),
                  ('baseline["rows"], 8135', 'baseline["rows"], 8145'),
              ],
              Path('tests/test_jogger_wltp_efficiency_ranges.py'): [
                  ('baseline["tests"], 758', 'baseline["tests"], 765'),
                  ('baseline["rows"], 8135', 'baseline["rows"], 8145'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
                  elif new not in text:
                      raise SystemExit(f'missing regression anchor: {path}: {old}')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify complete package
        run: |
          python tools/register_official_dacia_brochures_20260725.py --check
          python tools/dkb.py project-state --check
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit repaired regression contracts
        run: |
          rm -f .github/official-dacia-brochures-error.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/test_duster_ecog120_automatic_cargo_20260725.py \
            tests/test_duster_ecog120_automatic_homologation_20260725.py \
            tests/test_jogger_payload_performance_ranges.py \
            tests/test_jogger_wltp_efficiency_ranges.py \
            .github/official-dacia-brochures-error.log
          git diff --cached --check
          git commit -m 'test(project): refresh brochure package state contracts' || true
          git push origin HEAD:agent/official-dacia-brochure-source-registration
