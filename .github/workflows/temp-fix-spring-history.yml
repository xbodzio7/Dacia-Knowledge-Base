name: Temporary Fix Spring Historical Contracts

on:
  push:
    branches:
      - agent/spring-essential-khaki-price-apply-20260802
    paths:
      - .github/workflows/temp-fix-spring-history.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-essential-khaki-price-apply-20260802
          fetch-depth: 0

      - name: Allow the single approved post-review state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/review_spring_exact_current_semantic_migration_20260802.py")
          text = path.read_text(encoding="utf-8")
          old = (
              '    if khaki["availability_status"] != "optional" or khaki["amount"]:\n'
              '        raise RuntimeError("Essential Khaki mapping is not the expected blank option")\n'
          )
          new = (
              '    khaki_before_apply = (\n'
              '        khaki["availability_status"] == "optional"\n'
              '        and not khaki["amount"]\n'
              '        and not khaki["price_date"]\n'
              '        and khaki["source_code"] == "src_pl_spring_brochure_20260219"\n'
              '    )\n'
              '    khaki_after_apply = (\n'
              '        khaki["availability_status"] == "optional"\n'
              '        and khaki["amount"] == "2300"\n'
              '        and khaki["currency_code"] == "PLN"\n'
              '        and khaki["price_date"] == "2026-08-02"\n'
              '        and khaki["source_code"] == "src_pl_spring_commercial_context_20260802"\n'
              '    )\n'
              '    if not (khaki_before_apply or khaki_after_apply):\n'
              '        raise RuntimeError("Essential Khaki mapping is outside the reviewed transition")\n'
          )
          if text.count(old) != 1:
              raise SystemExit("Khaki validation block drifted")
          text = text.replace(old, new)
          old_state = (
              '                "current_state": {\n'
              '                    "availability_status": khaki["availability_status"],\n'
              '                    "amount": None,\n'
              '                    "source_code": khaki["source_code"],\n'
              '                },'
          )
          new_state = (
              '                "current_state": {\n'
              '                    "availability_status": "optional",\n'
              '                    "amount": None,\n'
              '                    "source_code": "src_pl_spring_brochure_20260219",\n'
              '                },'
          )
          if text.count(old_state) != 1:
              raise SystemExit("historical current-state block drifted")
          path.write_text(text.replace(old_state, new_state), encoding="utf-8", newline="\n")
          PY

      - name: Run focused semantic history checks
        run: |
          python tools/review_spring_exact_current_semantic_migration_20260802.py --verify
          python -m unittest -v tests.test_spring_exact_current_semantic_migration_review_20260802 tests.test_spring_essential_khaki_price_apply_20260802

      - name: Commit repaired historical tool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/review_spring_exact_current_semantic_migration_20260802.py
          git commit -m "tool: preserve Spring review after approved apply"
          git push origin HEAD:agent/spring-essential-khaki-price-apply-20260802
