name: Temporary Inspect Configuration Value Specs

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-probe-configuration-value-specs.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-biel-alpejska-default-colour-migration-20260802
          fetch-depth: 0

      - name: Capture canonical scalar import examples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/imports/configuration_values")
          files = sorted(root.glob("*.json"))
          payload = {
              "count": len(files),
              "examples": [
                  {
                      "path": path.as_posix(),
                      "content": json.loads(path.read_text(encoding="utf-8")),
                  }
                  for path in files[-3:]
              ],
          }
          Path("project/tmp_configuration_value_spec_probe.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/tmp_configuration_value_spec_probe.json
          git commit -m "chore: capture temporary scalar import schema"
          git push origin HEAD:agent/spring-biel-alpejska-default-colour-migration-20260802
