name: Temporary Probe Configuration Value Specs

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-probe-configuration-value-specs.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Inspect configuration-value import contracts
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          root = Path('data/imports')
          files = sorted(root.rglob('*.csv'))
          print(f'IMPORT_FILE_COUNT={len(files)}')
          candidates = []
          for path in files:
              with path.open(encoding='utf-8-sig', newline='') as handle:
                  reader = csv.DictReader(handle)
                  fields = reader.fieldnames or []
                  first = next(reader, None)
              field_set = set(fields)
              if {'configuration_code', 'attribute_code', 'value'} <= field_set:
                  candidates.append((path, fields, first))
          print(f'CONFIG_VALUE_CANDIDATES={len(candidates)}')
          for path, fields, first in candidates[-20:]:
              print(f'FILE={path.as_posix()}')
              print(f'HEADER={fields}')
              print(f'FIRST={first}')
          print('TOP_LEVEL_IMPORTS=')
          for path in sorted(root.glob('*.csv'))[-30:]:
              print(path.as_posix())
          PY
