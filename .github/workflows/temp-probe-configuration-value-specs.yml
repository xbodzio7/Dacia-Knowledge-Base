name: Temporary Inspect Configuration Value Specs

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-probe-configuration-value-specs.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-biel-alpejska-default-colour-migration-20260802
          fetch-depth: 0

      - name: Capture exterior-colour import examples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/imports/configuration_values")
          matches = []
          for path in sorted(root.glob("*.json")):
              content = json.loads(path.read_text(encoding="utf-8"))
              if content.get("attribute_code") == "exterior_color":
                  matches.append({"path": path.as_posix(), "content": content})
          payload = {"count": len(matches), "examples": matches}
          Path("project/tmp_configuration_value_spec_probe.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/tmp_configuration_value_spec_probe.json
          git commit -m "chore: capture exterior colour import schema"
          git push origin HEAD:agent/spring-biel-alpejska-default-colour-migration-20260802
