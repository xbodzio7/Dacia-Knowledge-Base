name: Temporary Apply Spring Biel Alpejska Migration

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-probe-configuration-value-specs.yml
      - tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py
      - data/imports/spring_biel_alpejska_default_colour_20260802.csv

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-biel-alpejska-default-colour-migration-20260802
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply and verify bounded migration
        run: |
          python tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py --apply
          python tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py --verify

      - name: Commit generated data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/master/configuration_attribute_values.csv \
            data/master/commercial_item_configurations.csv \
            data/reporting/spring_biel_alpejska_default_colour_migration.json \
            data/reporting/spring_biel_alpejska_default_colour_migration.md
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "data: migrate Spring Essential default colour"
            git push origin HEAD:agent/spring-biel-alpejska-default-colour-migration-20260802
          fi
