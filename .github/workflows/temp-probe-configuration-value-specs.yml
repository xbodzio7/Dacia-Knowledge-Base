name: Temporary Inspect Configuration Value Specs

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-probe-configuration-value-specs.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-biel-alpejska-default-colour-migration-20260802
          fetch-depth: 0

      - name: Inspect canonical scalar import specifications
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/imports/configuration_values")
          files = sorted(root.glob("*.json"))
          print(f"COUNT={len(files)}")
          for path in files[-5:]:
              print(f"FILE={path.as_posix()}")
              payload = json.loads(path.read_text(encoding="utf-8"))
              print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
