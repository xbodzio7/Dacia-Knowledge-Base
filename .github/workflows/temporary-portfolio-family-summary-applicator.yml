name: Temporary Portfolio Family Summary Applicator

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/portfolio-model-family-summary-001'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true
      - name: Apply and verify portfolio family summary
        shell: bash
        run: |
          set -euo pipefail
          echo 'caa8d3a8885f6dfe51a69e13588e4d6b005e1da606a9324d67a228f9899430de  project/portfolio-family-payload.seg00' | sha256sum --check
          echo '550d955ffcffcfdab921b7dad1525a55b848fc9355973fb8f5812c4829391976  project/portfolio-family-payload.seg01' | sha256sum --check
          echo '86a221d7c706d889561fbe4ee1642d0232643ae34e498215df4c085e06418d14  project/portfolio-family-payload.seg02' | sha256sum --check
          echo '82eae111723d2be0f73760c2ad1624697e30167733612a2e6b23249455f5a599  project/portfolio-family-payload.seg03' | sha256sum --check
          echo '84ca49d0ff2e25170428539f6adc93945a37fb88bf77114eab672e4bd68471b4  project/portfolio-family-payload.seg04' | sha256sum --check
          echo '359e880b2d81e00690aa837c592d92d526ed7aab098c4345454f579900c94e9f  project/portfolio-family-payload.seg05' | sha256sum --check
          echo 'e4d0471ffcff32b7b0190e2169f907d3d85a36e121a11f5f4f5ff2d0b48c4a21  project/portfolio-family-payload.seg06' | sha256sum --check
          cat project/portfolio-family-payload.seg* > /tmp/portfolio-payload.tar.gz
          echo 'a1019a214246f033270b2e846c1d3483c560176f6eb2135efdeb19f1d19dfae9  /tmp/portfolio-payload.tar.gz' | sha256sum --check
          tar -xzf /tmp/portfolio-payload.tar.gz
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_portfolio_model_family_summary.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'self.assertEqual(rendered.count("SHA-256 "), 33)',
              'self.assertEqual(rendered.count("SHA-256 "), 37)',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('tools/dkb.py')
          text = path.read_text(encoding='utf-8')
          needle = '''    "cross-model-comparison-view": (
                  "cross_model_comparison_view.py",
                  "Generate scope-preserving model and reporting-scope navigation.",
                  "[--json FILE] [--html FILE]",
              ),
          '''
          insertion = needle + '''    "portfolio-model-family-summary": (
                  "portfolio_model_family_summary.py",
                  "Generate source-preserving JSON, Markdown and HTML model-family summaries.",
                  "[--json FILE] [--markdown FILE] [--html FILE]",
              ),
          '''
          if '"portfolio-model-family-summary"' not in text:
              if needle not in text:
                  raise SystemExit('cross-model command insertion point not found')
              path.write_text(text.replace(needle, insertion, 1), encoding='utf-8')
          PY
          python tools/generate_portfolio_model_family_summary_package_20260803.py --apply
          python tools/dkb.py project-state --apply
          python tools/dkb.py documentation-baseline --apply
          python tools/generate_portfolio_model_family_summary_package_20260803.py --verify
          python -m unittest -q \
            tests.test_portfolio_model_family_summary \
            tests.test_cross_model_comparison_view
          python tools/dkb.py project-state --check
          python tools/dkb.py portfolio-model-family-summary \
            --json /tmp/portfolio-summary.json \
            --markdown /tmp/portfolio-summary.md \
            --html /tmp/portfolio-summary.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'reporting: add portfolio model-family summary'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
