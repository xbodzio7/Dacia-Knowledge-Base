name: Reconcile Sandero full modal once

on:
  push:
    branches:
      - agent/sandero-stepway-full-modal-canonical-reconciliation-001
    paths:
      - .github/workflows/_reconcile_sandero_full_modal_once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reconciliation
        run: python tools/import_sandero_stepway_full_modal_canonical_reconciliation_20260809.py --apply
      - name: Verify reconciliation
        run: python tools/import_sandero_stepway_full_modal_canonical_reconciliation_20260809.py --verify
      - name: Repair historical boundaries and current reporting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('.')

          def replace(path, old, new, expected=None):
              p = root / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f'{path}: expected {expected} replacements, found {count}')
              if count == 0:
                  raise SystemExit(f'{path}: replacement target not found')
              p.write_text(text.replace(old, new), encoding='utf-8')

          def regex_replace(path, pattern, repl, expected=1, flags=0):
              p = root / path
              text = p.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, repl, text, flags=flags)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} regex replacements, found {count}')
              p.write_text(updated, encoding='utf-8')

          # Historical Duster tests must evaluate their original 2026-06-26 reporting boundary.
          for path in (
              'tests/test_duster_catalog_bootstrap.py',
              'tests/test_duster_technical_specifications.py',
          ):
              regex_replace(
                  path,
                  r'(report = configuration_completeness\.collect_report\(\n(?:.|\n)*?ROOT\s*/\s*"data"\s*/\s*"reporting"\s*/\s*"configuration_completeness\.json",?)(\n\s*\))',
                  r'\1,\n            as_of_value="2026-06-26",\2',
                  expected=1,
              )

          # Closed Sandero model packages assert their own historical observations, not later append-only rows.
          replace(
              'tests/test_sandero_50_kmh_noise_level_model.py',
              'if row["attribute_code"] == "noise_level_at_50_kmh"\n        ]',
              'if row["attribute_code"] == "noise_level_at_50_kmh"\n            and row["observation_date"] == "2026-06-26"\n        ]',
              expected=1,
          )
          for path in (
              'tests/test_sandero_maximum_payload_model.py',
              'tests/test_sandero_total_valve_count_model.py',
          ):
              replace(
                  path,
                  'and row["configuration_code"] in EXPECTED_MAPPING',
                  'and row["configuration_code"] in EXPECTED_MAPPING\n                and row["observation_date"] == "2026-06-26"',
              )

          # Dated 2026-07-26 brochure closure reviews must ignore later observations.
          replace(
              'tools/review_brochure_generic_dimensions_semantic_mapping_20260726.py',
              'and row.get("attribute_code") in ATTRIBUTE_CODES\n',
              'and row.get("attribute_code") in ATTRIBUTE_CODES\n                and (not row.get("observation_date") or row.get("observation_date") <= "2026-07-26")\n',
          )
          replace(
              'tools/review_official_brochure_residual_evidence_20260726.py',
              'if model in selected and row.get("attribute_code") in CORE_DIMENSIONS:\n',
              'if (\n            model in selected\n            and row.get("attribute_code") in CORE_DIMENSIONS\n            and (not row.get("observation_date") or row.get("observation_date") <= "2026-07-26")\n        ):\n',
              expected=1,
          )

          # Closed same-day exact-state importer verifies append-only minima, not global table maxima.
          replace(
              'tools/import_sandero_stepway_exact_configurator_states_20260809.py',
              'if len(rows) != count:\n            raise RuntimeError(f"{name}: expected {count} rows, found {len(rows)}")',
              'if len(rows) < count:\n            raise RuntimeError(f"{name}: expected at least {count} rows, found {len(rows)}")',
              expected=1,
          )
          replace(
              'tests/test_sandero_stepway_exact_design_factory_option_normalization_20260809.py',
              'self.assertEqual(len(self.sources), 37)',
              'self.assertGreaterEqual(len(self.sources), 37)',
              expected=1,
          )

          # The 2026-08-03 priority review owns a dated source denominator.
          replace(
              'tools/review_post_v1_11_0_release_priority_selection_20260803.py',
              'rows = read_csv(ROOT / "data/master/sources.csv")\n',
              'rows = [\n        row for row in read_csv(ROOT / "data/master/sources.csv")\n        if not row.get("document_date") or row.get("document_date") <= "2026-08-03"\n    ]\n',
              expected=1,
          )
          replace(
              'tests/test_post_v1_11_0_release_priority_selection_20260803.py',
              'rows = list(csv.DictReader(handle))',
              'rows = [\n                row for row in csv.DictReader(handle)\n                if not row.get("document_date") or row.get("document_date") <= "2026-08-03"\n            ]',
              expected=1,
          )

          # Current portfolio reports legitimately include the new 2026-08-09 source and 15 relationships.
          path = 'tests/test_portfolio_model_family_summary.py'
          replacements = {
              '"provenance_source_count": 34': '"provenance_source_count": 35',
              '"source_configuration_relationship_count": 269': '"source_configuration_relationship_count": 284',
              '"sandero_iii": (9, 36, "2026-02-02", "2026-08-09")': '"sandero_iii": (10, 43, "2026-02-02", "2026-08-09")',
              '"sandero_stepway_iii": (12, 44, "2026-02-02", "2026-08-09")': '"sandero_stepway_iii": (13, 52, "2026-02-02", "2026-08-09")',
              'self.assertEqual(matrix_relationship_total, 269)': 'self.assertEqual(matrix_relationship_total, 284)',
              'self.assertEqual(relation_total, 269)': 'self.assertEqual(relation_total, 284)',
              'self.assertEqual(len(used_sources), 34)': 'self.assertEqual(len(used_sources), 35)',
              'self.assertEqual(summary_rendered.count("SHA-256 "), 39)': 'self.assertEqual(summary_rendered.count("SHA-256 "), 41)',
          }
          for old, new in replacements.items():
              replace(path, old, new)

          replace(
              'tests/test_configuration_comparison_workbook.py',
              '"A1:K13"',
              '"A1:K14"',
              expected=1,
          )

          # Refresh only the dated analysis artifacts; do not move project state backwards.
          sys.path.insert(0, str(root / 'tools'))
          import existing_configuration_missing_data_analysis as analysis
          payload = analysis.collect(root.resolve())
          analysis.write_json(root / 'data/reporting/existing_configuration_missing_data_analysis.json', payload)
          (root / 'data/reporting/existing_configuration_missing_data_analysis.md').write_text(
              analysis.render_markdown(payload), encoding='utf-8'
          )
          PY
          python tools/dkb.py portfolio-model-family-summary \
            --json data/reporting/portfolio_model_family_summary.json \
            --markdown data/reporting/portfolio_model_family_summary.md \
            --html data/reporting/portfolio_model_family_summary.html
          python tools/portfolio_model_family_comparison_matrix.py \
            --json data/reporting/portfolio_model_family_comparison_matrix.json \
            --csv data/reporting/portfolio_model_family_comparison_matrix.csv \
            --html data/reporting/portfolio_model_family_comparison_matrix.html
      - name: Run full quality and persist result
        shell: bash
        run: |
          set +e
          python tools/dkb.py quality > /tmp/reconcile-quality.log 2>&1
          status=$?
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            cp /tmp/reconcile-quality.log .reconcile-quality.log
            git add .reconcile-quality.log tools tests data/reporting
            git commit -m "fix: align reconciliation with dated contracts" || true
            git push origin HEAD
            tail -n 600 /tmp/reconcile-quality.log
            exit "$status"
          fi
          git rm -f .reconcile-quality.log 2>/dev/null || true
          git rm .github/workflows/_reconcile_sandero_full_modal_once.yml
          git add data/master data/reporting tools tests project
          git commit -m "data: reconcile Sandero full-modal canonical observations"
          git push origin HEAD
          cat /tmp/reconcile-quality.log
