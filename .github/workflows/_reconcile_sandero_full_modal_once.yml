name: Reconcile Sandero full modal once

on:
  push:
    branches:
      - agent/sandero-stepway-full-modal-canonical-reconciliation-001
    paths:
      - .github/workflows/_reconcile_sandero_full_modal_once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reconciliation
        run: python tools/import_sandero_stepway_full_modal_canonical_reconciliation_20260809.py --apply
      - name: Verify reconciliation
        run: python tools/import_sandero_stepway_full_modal_canonical_reconciliation_20260809.py --verify
      - name: Diagnose canonical business keys
        run: |
          python - <<'PY'
          import csv, re
          from collections import Counter
          from pathlib import Path
          root=Path('data/master')
          def rows(name):
              with (root/name).open(encoding='utf-8-sig',newline='') as f: return list(csv.DictReader(f))
          configs={r['code'] for r in rows('configurations.csv')}
          attrs={r['code'] for r in rows('attributes.csv')}
          sources={r['code'] for r in rows('sources.csv')}
          for name in ('configuration_attribute_values.csv','configuration_attribute_availability.csv'):
              rs=rows(name)
              keys=Counter((r['configuration_code'],r['attribute_code'],r['observation_date']) for r in rs)
              dup=[(k,n) for k,n in keys.items() if n>1]
              missing=[r for r in rs if r['configuration_code'] not in configs or r['attribute_code'] not in attrs or r['source_code'] not in sources]
              print(name,'rows',len(rs),'duplicates',len(dup),'missing refs',len(missing))
              print('duplicate sample',dup[:30])
              print('missing sample',missing[:10])
          av=rows('configuration_attribute_availability.csv')
          print('availability statuses',Counter(r['availability_status'] for r in av))
          src=rows('sources.csv')
          print('bad source codes',[r['code'] for r in src if not re.fullmatch(r'[a-z0-9]+(?:_[a-z0-9]+)*',r['code'])])
          sc=rows('source_configurations.csv')
          print('relationships',Counter(r['relationship'] for r in sc))
          print('source types',Counter(r['source_type'] for r in src))
          print('source count',len(src),'source-config count',len(sc))
          PY
