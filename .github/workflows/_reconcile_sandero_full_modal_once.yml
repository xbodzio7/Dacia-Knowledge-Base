name: Reconcile Sandero full modal once

on:
  push:
    branches:
      - agent/sandero-stepway-full-modal-canonical-reconciliation-001
    paths:
      - .github/workflows/_reconcile_sandero_full_modal_once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Apply reconciliation
        run: python tools/import_sandero_stepway_full_modal_canonical_reconciliation_20260809.py --apply
      - name: Verify reconciliation
        run: python tools/import_sandero_stepway_full_modal_canonical_reconciliation_20260809.py --verify
      - name: Diagnose focused contracts
        run: |
          echo '=== matching test definitions ==='
          grep -R -n -E 'source_configuration_pair_uniqueness|source_code_snake_case|source_configuration_relationship_enum|source_configurations_reference_existing_codes|source_type_enum|sources_expected_count|duplicate_business_keys_are_disallowed|availability_status_enum|all_rows_reference_existing_codes' . --include='*.py' || true
          echo '=== full quality failure detail ==='
          set +e
          python tools/dkb.py quality > /tmp/quality.log 2>&1
          status=$?
          tail -n 500 /tmp/quality.log
          exit $status
      - name: Commit verified generated changes
        run: |
          git rm .github/workflows/_reconcile_sandero_full_modal_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master data/reporting tools/import_sandero_stepway_full_modal_canonical_reconciliation_20260809.py
          git commit -m "data: reconcile Sandero full-modal canonical observations"
          git push origin HEAD
