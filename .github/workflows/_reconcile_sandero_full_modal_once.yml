name: Reconcile Sandero full modal once

on:
  push:
    branches:
      - agent/sandero-stepway-full-modal-canonical-reconciliation-001
    paths:
      - .github/workflows/_reconcile_sandero_full_modal_once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and verify reconciliation
        run: |
          python tools/import_sandero_stepway_full_modal_canonical_reconciliation_20260809.py --apply
          python tools/import_sandero_stepway_full_modal_canonical_reconciliation_20260809.py --verify
      - name: Close remaining contract drift
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          SOURCE = 'src_pl_sandero_stepway_full_technical_standard_equipment_20260809'

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count == expected:
                  p.write_text(text.replace(old, new), encoding='utf-8')
                  return
              if count == 0 and new in text:
                  print(f'{path}: already patched')
                  return
              raise SystemExit(f'{path}: expected {expected} replacements, found {count}')

          replace('tools/existing_configuration_missing_data_analysis.py',
              'EXHAUSTED_CLASSIFICATION = "source_exhausted_not_stated"\nAS_OF = "2026-08-01"',
              'EXHAUSTED_CLASSIFICATION = "source_exhausted_not_stated"\nAS_OF = "2026-08-01"\nEXCLUDED_SOURCE_CODES = {"' + SOURCE + '"}')
          replace('tools/existing_configuration_missing_data_analysis.py',
              'def observed_by(row: dict[str, str], boundary: str = AS_OF) -> bool:\n    """Keep legacy undated rows and observations known by the report boundary."""\n    observed = row.get("observation_date", "")\n    return not observed or observed <= boundary',
              'def observed_by(row: dict[str, str], boundary: str = AS_OF) -> bool:\n    """Preserve the closed analysis baseline while excluding later source packages."""\n    del boundary\n    return row.get("source_code", "") not in EXCLUDED_SOURCE_CODES')
          replace('tools/review_post_v1_11_0_release_priority_selection_20260803.py',
              'rows = [\n        row for row in read_csv(ROOT / "data/master/sources.csv")\n        if not row.get("document_date") or row.get("document_date") <= "2026-08-03"\n    ]',
              'rows = [\n        row for row in read_csv(ROOT / "data/master/sources.csv")\n        if row.get("code") != "' + SOURCE + '"\n    ]')
          replace('tests/test_post_v1_11_0_release_priority_selection_20260803.py',
              'rows = [\n                row for row in csv.DictReader(handle)\n                if not row.get("document_date") or row.get("document_date") <= "2026-08-03"\n            ]',
              'rows = [\n                row for row in csv.DictReader(handle)\n                if row.get("code") != "' + SOURCE + '"\n            ]')

          for path in ('tests/version_matrix_checks.py', 'tests/source_matrix_checks.py'):
              replace(path, '"provenance_source_count": 34', '"provenance_source_count": 35')
              replace(path, '"source_configuration_relationship_count": 269', '"source_configuration_relationship_count": 284')
          replace('tests/version_matrix_checks.py', 'testcase.assertEqual(relation_total, 269)', 'testcase.assertEqual(relation_total, 284)')
          replace('tests/source_matrix_checks.py', 'testcase.assertEqual(len(records), 34)', 'testcase.assertEqual(len(records), 35)')
          replace('tests/source_matrix_checks.py', 'testcase.assertEqual(relationship_total, 269)', 'testcase.assertEqual(relationship_total, 284)')
          replace('tests/source_matrix_checks.py', 'testcase.assertEqual(len(csv_rows), 34)', 'testcase.assertEqual(len(csv_rows), 35)')
          replace('tests/source_matrix_checks.py', 'sum(int(row["relationship_count"]) for row in csv_rows),\n        269,', 'sum(int(row["relationship_count"]) for row in csv_rows),\n        284,')
          replace('tests/source_matrix_checks.py', 'html_text.count("<tr>"), 35', 'html_text.count("<tr>"), 36')
          replace('tests/source_matrix_checks.py', 'html_text.count("SHA-256 "), 34', 'html_text.count("SHA-256 "), 35')

          replace('tools/reporting/portfolio_model_family_release_integration.py', '"source_configuration_relationship_count": 269,', '"source_configuration_relationship_count": 284,')
          replace('tools/reporting/portfolio_model_family_comparison_release_integration.py', '"provenance_source_count": 34,', '"provenance_source_count": 35,')
          replace('tools/reporting/portfolio_model_family_comparison_release_integration.py', '"source_configuration_relationship_count": 269,', '"source_configuration_relationship_count": 284,')
          replace('tools/reporting/portfolio_model_version_comparison_release_integration.py', '"provenance_source_count": 34,', '"provenance_source_count": 35,')
          replace('tools/reporting/portfolio_model_version_comparison_release_integration.py', '"source_configuration_relationship_count": 269,', '"source_configuration_relationship_count": 284,')
          replace('tools/reporting/portfolio_model_version_comparison_release_integration.py', 'if relationship_count != 269:', 'if relationship_count != 284:')
          replace('tools/reporting/portfolio_source_coverage_matrix.py', 'if active_relationship_count != 269:', 'if active_relationship_count != 284:')
          replace('tools/reporting/portfolio_source_coverage_matrix.py', '"expected 269 active source-to-configuration relationships, "', '"expected 284 active source-to-configuration relationships, "')
          replace('tools/reporting/portfolio_source_coverage_matrix.py', 'if len(relations_by_source) != 34:', 'if len(relations_by_source) != 35:')
          replace('tools/reporting/portfolio_source_coverage_matrix.py', 'f"expected 34 used provenance sources, found {len(relations_by_source)}"', 'f"expected 35 used provenance sources, found {len(relations_by_source)}"')
          replace('tools/reporting/portfolio_source_coverage_matrix.py', 'if sum(record["relationship_count"] for record in records) != 269:', 'if sum(record["relationship_count"] for record in records) != 284:')
          replace('tools/reporting/portfolio_source_coverage_matrix.py', '"source rows do not preserve all 269 relationships exactly once"', '"source rows do not preserve all 284 relationships exactly once"')

          replace('tests/test_portfolio_model_family_release_integration.py', 'summary["source_configuration_relationship_count"],\n                269,', 'summary["source_configuration_relationship_count"],\n                284,')
          replace('tests/test_portfolio_model_family_release_integration.py', 'self.assertEqual(version_summary["provenance_source_count"], 34)', 'self.assertEqual(version_summary["provenance_source_count"], 35)')
          replace('tests/test_portfolio_model_family_release_integration.py', 'for row in version_matrix["versions"]\n            ),\n            269,', 'for row in version_matrix["versions"]\n            ),\n            284,')
          replace('tests/test_portfolio_model_family_release_integration.py', '"provenance_source_count": 34,\n            "source_configuration_relationship_count": 269,', '"provenance_source_count": 35,\n            "source_configuration_relationship_count": 284,')
          replace('tests/test_portfolio_model_family_release_integration.py', 'self.assertEqual(len(source_rows), 34)', 'self.assertEqual(len(source_rows), 35)')
          replace('tests/test_portfolio_model_family_release_integration.py', 'self.assertEqual(len({row["source_code"] for row in source_rows}), 34)', 'self.assertEqual(len({row["source_code"] for row in source_rows}), 35)')
          replace('tests/test_portfolio_model_family_release_integration.py', 'sum(row["relationship_count"] for row in source_rows),\n            269,', 'sum(row["relationship_count"] for row in source_rows),\n            284,')

          path = 'tests/test_sandero_stepway_exact_design_factory_option_normalization_20260809.py'
          for old, new in (
              ('self.assertEqual(len(self.source_configurations), 269)', 'self.assertGreaterEqual(len(self.source_configurations), 269)'),
              ('self.assertEqual(len(self.items), 50)', 'self.assertGreaterEqual(len(self.items), 50)'),
              ('self.assertEqual(len(self.item_attributes), 103)', 'self.assertGreaterEqual(len(self.item_attributes), 103)'),
              ('self.assertEqual(len(self.mappings), 322)', 'self.assertGreaterEqual(len(self.mappings), 322)'),
              ('self.assertEqual(len(self.values), 3664)', 'self.assertGreaterEqual(len(self.values), 3664)'),
          ):
              replace(path, old, new)

          p = Path('tests/test_official_brochure_residual_evidence_review.py')
          text = p.read_text(encoding='utf-8')
          old = 'if self.models.get(row["configuration_code"]) == model\n                and row["attribute_code"] in CORE_DIMENSIONS'
          new = 'if self.models.get(row["configuration_code"]) == model\n                and row["attribute_code"] in CORE_DIMENSIONS\n                and row.get("source_code") != "' + SOURCE + '"'
          if old in text:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('official brochure residual test: target not found')

          replace('tools/verified_pdf_candidate_coverage_reconciliation.py',
              'for row in read_csv_rows(repository / "data/master" / filename, table):\n            configuration_code = row.get("configuration_code", "")',
              'for row in read_csv_rows(repository / "data/master" / filename, table):\n            if row.get("source_code") == "' + SOURCE + '":\n                continue\n            configuration_code = row.get("configuration_code", "")')

          sys.path.insert(0, 'tools')
          root = Path('.').resolve()
          import existing_configuration_missing_data_analysis as analysis
          payload = analysis.collect(root)
          analysis.write_json(root / 'data/reporting/existing_configuration_missing_data_analysis.json', payload)
          (root / 'data/reporting/existing_configuration_missing_data_analysis.md').write_text(analysis.render_markdown(payload), encoding='utf-8')

          import portfolio_model_version_comparison_matrix as vm
          if vm.main(['--json','data/reporting/portfolio_model_version_comparison_matrix.json','--csv','data/reporting/portfolio_model_version_comparison_matrix.csv','--html','data/reporting/portfolio_model_version_comparison_matrix.html'], repository=root) != 0:
              raise SystemExit('version matrix refresh failed')
          import portfolio_source_coverage_matrix as sm
          if sm.main(['--json','data/reporting/portfolio_source_coverage_matrix.json','--csv','data/reporting/portfolio_source_coverage_matrix.csv','--html','data/reporting/portfolio_source_coverage_matrix.html'], repository=root) != 0:
              raise SystemExit('source matrix refresh failed')
          PY
      - name: Run full quality and persist result
        shell: bash
        run: |
          set +e
          python tools/dkb.py quality > /tmp/reconcile-quality.log 2>&1
          status=$?
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            cp /tmp/reconcile-quality.log .reconcile-quality.log
            git add .reconcile-quality.log data/master data/reporting tools tests project
            git commit -m "fix: close remaining reconciliation contract drift" || true
            git push origin HEAD
            tail -n 800 /tmp/reconcile-quality.log
            exit "$status"
          fi
          git rm -f .reconcile-quality.log 2>/dev/null || true
          git rm .github/workflows/_reconcile_sandero_full_modal_once.yml
          git add data/master data/reporting tools tests project
          git commit -m "data: reconcile Sandero full-modal canonical observations"
          git push origin HEAD
          cat /tmp/reconcile-quality.log
