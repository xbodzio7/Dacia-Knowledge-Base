name: Reconcile Sandero full modal once

on:
  push:
    branches:
      - agent/sandero-stepway-full-modal-canonical-reconciliation-001
    paths:
      - .github/workflows/_reconcile_sandero_full_modal_once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Apply reconciliation
        run: python tools/import_sandero_stepway_full_modal_canonical_reconciliation_20260809.py --apply
      - name: Verify reconciliation
        run: python tools/import_sandero_stepway_full_modal_canonical_reconciliation_20260809.py --verify
      - name: Diagnose schema contracts
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          for name in ('sources.csv','source_configurations.csv','configuration_attribute_availability.csv'):
              path = Path('data/master') / name
              with path.open(encoding='utf-8-sig', newline='') as fh:
                  reader = csv.DictReader(fh)
                  rows = list(reader)
              print('\n===', name, '===')
              print('headers:', reader.fieldnames)
              print('tail:')
              for row in rows[-4:]: print(row)
          PY
          set +e
          python -m pytest tests -k 'source_configuration_pair_uniqueness or source_code_snake_case or source_configuration_relationship_enum or source_configurations_reference_existing_codes or source_type_enum or sources_expected_count or configuration_attribute_availability' -vv --tb=long
          status=$?
          exit $status
      - name: Full quality gate
        run: python tools/dkb.py quality
      - name: Commit verified generated changes
        run: |
          git rm .github/workflows/_reconcile_sandero_full_modal_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master data/reporting tools/import_sandero_stepway_full_modal_canonical_reconciliation_20260809.py
          git commit -m "data: reconcile Sandero full-modal canonical observations"
          git push origin HEAD
