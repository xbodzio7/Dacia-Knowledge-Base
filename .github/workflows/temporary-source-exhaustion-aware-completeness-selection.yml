name: Temporary Source-Exhaustion-Aware Completeness Selection

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temporary-source-exhaustion-aware-completeness-selection-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/source-exhaustion-aware-completeness-selection-20260801'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install PDF backend
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
      - name: Materialize and verify
        run: |
          python tools/existing_configuration_missing_data_analysis.py
          python tools/dkb.py project-state --apply
          python tools/dkb.py documentation-baseline --apply
          python tools/existing_configuration_missing_data_analysis.py --check
          python -m unittest -v tests.test_existing_configuration_missing_data_analysis
          python tools/dkb.py quality --concise --database "$RUNNER_TEMP/dkb.sqlite"
          git diff --check
      - name: Commit package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'fix(reporting): exclude exhausted sources from selection'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
