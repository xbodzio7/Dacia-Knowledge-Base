Status: complete

Package ID: `spring_commercial_context_resolution_001`

## Scope

Resolve the Spring Type 2 cable conflict and separate exact current MY26 evidence from MY2025 dealer-stock prices and whole-vehicle stock context before any commercial migration.

## Delivered

- exact current Essential and Extreme states classify the Type 2 cable as standard equipment;
- current Expression remains unresolved because the exact captured matrix is MY2025 stock-only;
- exact current Essential paint context records Alpine White as included and Lichen Khaki at 2300 PLN;
- MY2025 paint, DC 40 kW and Techno prices remain bounded to MY2025 stock;
- dealer-stock totals are not decomposed into reusable option prices;
- master data remains unchanged.

## Semantic boundary

The existing Type 2 commercial item is option-shaped. Changing its mappings to `standard` would mix equipment semantics with an option-price entity, while writing 0 PLN would fabricate a price record. This review therefore defers that migration until the current Expression and Extreme grade snapshots are complete and a bounded representation is selected.

## Result

- master rows changed: 0;
- prices imported: 0;
- availability states changed: 0;
- exact current Type 2 standard states: 2;
- exact current Essential paint rows: 2;
- MY2025 prices promoted to MY26: 0.

## Follow-up

`spring_current_grade_snapshot_capture_001` will capture exact current Expression and Extreme palettes and charging-equipment semantics before any bounded master-data migration.
''', encoding='utf-8')

