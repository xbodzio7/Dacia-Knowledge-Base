import csv
import json
import subprocess
import sys
import unittest
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]


def payload(path: Path) -> dict:
    return json.loads(path.read_text(encoding="utf-8"))


def rows(path: Path) -> list[dict[str, str]]:
    with path.open(encoding="utf-8", newline="") as handle:
        return list(csv.DictReader(handle))


class SpringCommercialContextResolutionTests(unittest.TestCase):
    def test_exact_current_source_boundaries(self) -> None:
        source = payload(ROOT / "project/sources/dacia-pl-spring-commercial-context-20260802.json")
        sources = {item["source_id"]: item for item in source["official_sources"]}
        essential = sources["current_essential_configurator_my26b"]["observations"]
        extreme = sources["current_extreme_comparison_my26"]["observations"]
        self.assertEqual(essential["type2_charging_cable"]["availability_status"], "standard")
        self.assertEqual(extreme["type2_charging_cable"]["availability_status"], "standard")
        self.assertEqual(essential["paints"][0]["price_pln"], 0)
        self.assertEqual(essential["paints"][1]["price_pln"], 2300)

    def test_report_preserves_context_and_zero_mutations(self) -> None:
        report = payload(ROOT / "data/reporting/spring_commercial_context_resolution.json")
        self.assertEqual(report["type2_resolution"]["exact_current_standard_count"], 2)
        self.assertEqual(report["type2_resolution"]["current_grade_unresolved_count"], 1)
        self.assertEqual(report["paint_resolution"]["exact_current_my26_count"], 2)
        self.assertEqual(report["paint_resolution"]["my2025_price_promotions"], 0)
        self.assertEqual(report["mutation_summary"]["master_rows_changed"], 0)

    def test_review_artifacts_are_deterministic_and_master_is_unchanged(self) -> None:
        subprocess.run(
            [sys.executable, "tools/review_spring_commercial_context_20260802.py", "--verify"],
            cwd=ROOT,
            check=True,
        )
        mappings = {
            (row["commercial_item_code"], row["configuration_code"]): row
            for row in rows(ROOT / "data/master/commercial_item_configurations.csv")
        }
        item = "spring_type2_charging_cable_option"
        for configuration in (
            "spring_essential_electric70_automatic",
            "spring_expression_electric70_automatic",
            "spring_extreme_electric100_automatic",
        ):
            row = mappings[(item, configuration)]
            self.assertEqual(row["availability_status"], "optional")
            self.assertEqual(row["amount"], "")
            self.assertEqual(row["source_code"], "src_pl_spring_brochure_20260219")

    def test_project_state_advances_to_snapshot_capture(self) -> None:
        state = payload(ROOT / "project/state.json")
        self.assertEqual(state["current_package"]["package_id"], "spring_commercial_context_resolution_001")
        self.assertEqual(state["current_package"]["status"], "complete")
        self.assertEqual(state["next_package"]["package_id"], "spring_current_grade_snapshot_capture_001")
        self.assertEqual(state["baseline"]["tests"], 1792)


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')

