name: Publish Data Products v1.8.1

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/data-products-v1-8-1-publish.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 0b7009fd1950693e347638a6b96756aeefb43b8a
      VERSION: 1.8.1
      TAG: data-products-v1.8.1
      ARCHIVE: dacia-knowledge-base-data-products-v1.8.1.zip
      EXPECTED_ARCHIVE_SIZE: '62141954'
      EXPECTED_ARCHIVE_SHA256: 3bb8ba7c48195651bbe24cae042560273c5e4083467c01b203bb07dab7401bc5
      EXPECTED_MANIFEST_SIZE: '20607'
      EXPECTED_MANIFEST_SHA256: f4ed40ed7e469876c80ee95c6b1ad18fcf6c86f215934ab5942373f2889a54fd
      EXPECTED_CHECKSUMS_SIZE: '213'
      EXPECTED_CHECKSUMS_SHA256: ca59fb187c8fbdcbacf7c62d0c65559a8f604defc5634b1d7fe257df7f7e668e
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/data-products-v1-8-1-publish
          fetch-depth: 0

      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 0b7009fd1950693e347638a6b96756aeefb43b8a
          path: source
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Verify exact source and publication state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"

          tag_exists=false
          release_exists=false
          if git -C source ls-remote --exit-code --tags origin "refs/tags/$TAG" >"$RUNNER_TEMP/tag.txt"; then
            tag_exists=true
          else
            status=$?
            test "$status" -eq 2
          fi
          if gh api "repos/xbodzio7/Dacia-Knowledge-Base/releases/tags/$TAG" >"$RUNNER_TEMP/existing-release.json" 2>"$RUNNER_TEMP/existing-release.err"; then
            release_exists=true
          else
            grep -q "HTTP 404" "$RUNNER_TEMP/existing-release.err"
          fi

          if [[ "$tag_exists" == false && "$release_exists" == false ]]; then
            echo "SHOULD_PUBLISH=true" >> "$GITHUB_ENV"
          elif [[ "$tag_exists" == true && "$release_exists" == true ]]; then
            gh api "repos/xbodzio7/Dacia-Knowledge-Base/git/ref/tags/$TAG" > "$RUNNER_TEMP/existing-tag-ref.json"
            TAG_JSON="$RUNNER_TEMP/existing-tag-ref.json" RELEASE_JSON="$RUNNER_TEMP/existing-release.json" python - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = json.loads(Path(os.environ["TAG_JSON"]).read_text(encoding="utf-8"))
          release = json.loads(Path(os.environ["RELEASE_JSON"]).read_text(encoding="utf-8"))
          assert tag["object"]["type"] == "commit"
          assert tag["object"]["sha"] == os.environ["SOURCE_SHA"]
          assert release["tag_name"] == os.environ["TAG"]
          assert release["draft"] is False
          assert release["prerelease"] is False
          PY
            echo "SHOULD_PUBLISH=false" >> "$GITHUB_ENV"
          else
            echo "Inconsistent publication state: tag=$tag_exists release=$release_exists" >&2
            exit 1
          fi

      - name: Rebuild and require exact preflight identity
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/v1.8.1-publication-candidate"
          python source/tools/dkb.py data-product-release \
            --version "$VERSION" \
            --commit-sha "$SOURCE_SHA" \
            --output-directory "$candidate"
          python source/tools/dkb.py data-product-release \
            --verify \
            --version "$VERSION" \
            --commit-sha "$SOURCE_SHA" \
            --output-directory "$candidate"
          test "$(stat -c '%s' "$candidate/$ARCHIVE")" = "$EXPECTED_ARCHIVE_SIZE"
          test "$(sha256sum "$candidate/$ARCHIVE" | cut -d' ' -f1)" = "$EXPECTED_ARCHIVE_SHA256"
          test "$(stat -c '%s' "$candidate/data-product-release-manifest.json")" = "$EXPECTED_MANIFEST_SIZE"
          test "$(sha256sum "$candidate/data-product-release-manifest.json" | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          test "$(stat -c '%s' "$candidate/SHA256SUMS")" = "$EXPECTED_CHECKSUMS_SIZE"
          test "$(sha256sum "$candidate/SHA256SUMS" | cut -d' ' -f1)" = "$EXPECTED_CHECKSUMS_SHA256"
          unzip -p "$candidate/$ARCHIVE" RELEASE_NOTES.md > "$RUNNER_TEMP/v1.8.1-release-notes.md"
          grep -q "Data Products v1.8.1" "$RUNNER_TEMP/v1.8.1-release-notes.md"
          grep -q "$SOURCE_SHA" "$RUNNER_TEMP/v1.8.1-release-notes.md"

      - name: Publish exact three-asset release
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/v1.8.1-publication-candidate"
          if [[ "$SHOULD_PUBLISH" == "true" ]]; then
            gh release create "$TAG" \
              "$candidate/$ARCHIVE" \
              "$candidate/data-product-release-manifest.json" \
              "$candidate/SHA256SUMS" \
              --repo xbodzio7/Dacia-Knowledge-Base \
              --target "$SOURCE_SHA" \
              --title "Data Products v1.8.1" \
              --notes-file "$RUNNER_TEMP/v1.8.1-release-notes.md"
          else
            echo "Exact release already exists; verifying it without republishing."
          fi

      - name: Re-download and verify public identity
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/v1.8.1-publication-candidate"
          downloaded="$RUNNER_TEMP/v1.8.1-public-download"
          mkdir -p "$downloaded"
          gh release download "$TAG" \
            --repo xbodzio7/Dacia-Knowledge-Base \
            --dir "$downloaded"
          test "$(find "$downloaded" -maxdepth 1 -type f | wc -l)" -eq 3
          cmp "$candidate/$ARCHIVE" "$downloaded/$ARCHIVE"
          cmp "$candidate/data-product-release-manifest.json" "$downloaded/data-product-release-manifest.json"
          cmp "$candidate/SHA256SUMS" "$downloaded/SHA256SUMS"
          python source/tools/dkb.py data-product-release \
            --verify \
            --version "$VERSION" \
            --commit-sha "$SOURCE_SHA" \
            --output-directory "$downloaded"
          gh api "repos/xbodzio7/Dacia-Knowledge-Base/releases/tags/$TAG" > "$RUNNER_TEMP/public-release.json"
          gh api "repos/xbodzio7/Dacia-Knowledge-Base/git/ref/tags/$TAG" > "$RUNNER_TEMP/public-tag-ref.json"

      - name: Record publication receipt
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$RUNNER_TEMP/public-release.json" TAG_JSON="$RUNNER_TEMP/public-tag-ref.json" python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          release = json.loads(Path(os.environ["RELEASE_JSON"]).read_text(encoding="utf-8"))
          tag = json.loads(Path(os.environ["TAG_JSON"]).read_text(encoding="utf-8"))
          source_sha = os.environ["SOURCE_SHA"]
          expected = {
              os.environ["ARCHIVE"]: {
                  "size": int(os.environ["EXPECTED_ARCHIVE_SIZE"]),
                  "sha256": os.environ["EXPECTED_ARCHIVE_SHA256"],
              },
              "data-product-release-manifest.json": {
                  "size": int(os.environ["EXPECTED_MANIFEST_SIZE"]),
                  "sha256": os.environ["EXPECTED_MANIFEST_SHA256"],
              },
              "SHA256SUMS": {
                  "size": int(os.environ["EXPECTED_CHECKSUMS_SIZE"]),
                  "sha256": os.environ["EXPECTED_CHECKSUMS_SHA256"],
              },
          }
          assert release["tag_name"] == os.environ["TAG"]
          assert release["draft"] is False
          assert release["prerelease"] is False
          assert tag["object"]["type"] == "commit"
          assert tag["object"]["sha"] == source_sha
          assets = release["assets"]
          assert {item["name"] for item in assets} == set(expected)
          records = {}
          for asset in assets:
              identity = expected[asset["name"]]
              assert asset["size"] == identity["size"]
              digest = asset.get("digest")
              if digest is not None:
                  assert digest == "sha256:" + identity["sha256"]
              records[asset["name"]] = {
                  "asset_id": asset["id"],
                  "size_bytes": asset["size"],
                  "sha256": identity["sha256"],
                  "api_digest": digest,
                  "download_url": asset["browser_download_url"],
              }
          receipt = {
              "version": 1,
              "kind": "data_products_v1_8_1_publication",
              "status": "PASS",
              "release_id": release["id"],
              "release_tag": release["tag_name"],
              "release_url": release["html_url"],
              "published_at": release["published_at"],
              "source_commit": source_sha,
              "workflow_run": int(os.environ["GITHUB_RUN_ID"]),
              "draft": release["draft"],
              "prerelease": release["prerelease"],
              "asset_count": len(assets),
              "assets": dict(sorted(records.items())),
              "public_redownload_verification": "PASS",
          }
          output = Path(".github/data-products-v1.8.1-publication.json")
          output.write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, ensure_ascii=False, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/data-products-v1.8.1-publication.json
          if git diff --cached --quiet; then
            echo "Publication receipt already recorded."
          else
            git commit -m 'ci(release): record v1.8.1 publication'
            git push origin HEAD:agent/data-products-v1-8-1-publish
          fi
