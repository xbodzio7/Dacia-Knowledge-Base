name: AI generate Sandero Stepway reconciliation documentation

on:
  push:
    branches:
      - ai/sandero-stepway-full-modal-reconciliation-001
    paths:
      - .github/workflows/ai-apply-sandero-stepway-full-modal-reconciliation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/sandero-stepway-full-modal-reconciliation-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate project documentation
        shell: bash
        run: |
          set -euo pipefail
          python tools/dkb.py documentation-baseline --apply
          python tools/dkb.py project-state --apply
      - name: Run focused reconciliation tests
        run: python -m unittest -q tests.test_sandero_stepway_full_modal_canonical_reconciliation_20260809
      - name: Commit generated documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md project/ROADMAP.md project/SESSION_STATE.md project/STATE_SUMMARY.md
          if git diff --cached --quiet; then
            echo "No generated documentation changes to commit."
            exit 0
          fi
          git commit -m "docs(project): refresh reconciliation baseline"
          git push origin HEAD:ai/sandero-stepway-full-modal-reconciliation-001
