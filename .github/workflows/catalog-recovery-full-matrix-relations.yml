name: Catalog Recovery Latest Snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sandero-stepway-catalog-recovery-restored
      - name: Build latest recovery snapshot
        shell: bash
        run: |
          zip -q -r /tmp/dkb-recovery-latest.zip . -x '.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: dkb-recovery-latest
          path: /tmp/dkb-recovery-latest.zip
          retention-days: 7
          if-no-files-found: error
