name: Catalog Recovery Snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sandero-stepway-catalog-recovery-restored
      - name: Build repository snapshot
        shell: bash
        run: |
          zip -q -r /tmp/dkb-recovery-snapshot.zip . -x '.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: dkb-recovery-snapshot
          path: /tmp/dkb-recovery-snapshot.zip
