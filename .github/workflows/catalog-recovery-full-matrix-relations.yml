name: Catalog Main Snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build main snapshot
        shell: bash
        run: |
          zip -q -r /tmp/dkb-main-snapshot.zip . -x '.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: dkb-main-snapshot
          path: /tmp/dkb-main-snapshot.zip
          retention-days: 7
