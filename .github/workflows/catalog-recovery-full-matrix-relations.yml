name: Catalog Recovery Full Matrix Relations

on:
  push:
    branches:
      - agent/sandero-stepway-catalog-recovery-restored
    paths:
      - .github/workflows/catalog-recovery-full-matrix-relations.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sandero-stepway-catalog-recovery-restored
      - name: Patch, apply and test
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics/catalog-recovery
          python tools/patch_catalog_source_relationship_scope.py > diagnostics/catalog-recovery/matrix-relations.log 2>&1
          patch=$?
          apply=99
          verify=99
          validator=99
          tests=99
          if [ "$patch" -eq 0 ]; then
            python tools/import_sandero_stepway_catalog_completion.py --apply >> diagnostics/catalog-recovery/matrix-relations.log 2>&1
            apply=$?
          fi
          if [ "$apply" -eq 0 ]; then
            python tools/import_sandero_stepway_catalog_completion.py --verify >> diagnostics/catalog-recovery/matrix-relations.log 2>&1
            verify=$?
            python tools/dkb.py validate > diagnostics/catalog-recovery/matrix-relations-validator.log 2>&1
            validator=$?
            python -m unittest discover -s tests -p 'test_*.py' -q > diagnostics/catalog-recovery/matrix-relations-tests.log 2>&1
            tests=$?
          fi
          printf '{"patch_exit":%s,"apply_exit":%s,"verify_exit":%s,"validator_exit":%s,"tests_exit":%s}\n' "$patch" "$apply" "$verify" "$validator" "$tests" > diagnostics/catalog-recovery/matrix-relations-summary.json
          exit 0
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data project/sources tools diagnostics/catalog-recovery/matrix-relations-*.log diagnostics/catalog-recovery/matrix-relations-summary.json
          git commit -m "fix(data): cover full equipment matrix source scope"
          git push origin HEAD:agent/sandero-stepway-catalog-recovery-restored
