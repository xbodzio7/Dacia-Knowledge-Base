name: _tmp_regenerate_existing_analysis_686

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  regenerate:
    if: github.event.pull_request.head.ref == 'agent/duster-jogger-july-technical-reconciliation-007'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Regenerate dependent analysis
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from tools import existing_configuration_missing_data_analysis as analysis
          root = Path(".")
          payload = analysis.collect(root)
          (root/"data/reporting/existing_configuration_missing_data_analysis.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2)+"\n", encoding="utf-8"
          )
          (root/"data/reporting/existing_configuration_missing_data_analysis.md").write_text(
              analysis.render_markdown(payload), encoding="utf-8"
          )
          PY
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reporting/existing_configuration_missing_data_analysis.json data/reporting/existing_configuration_missing_data_analysis.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: regenerate dependent analysis outputs"
            git push
          fi
