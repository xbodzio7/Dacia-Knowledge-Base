name: AI extract representative dimension pages
on:
  push:
    branches: [ai/dacia-configurator-pdf-archive-20260809]
    paths: [.github/workflows/ai-extract-representative-dimension-pages.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - name: Extract exact page text
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('project/sources/dacia-pl-configurator-native-pdf-page-ledger-20260809.json').read_text(encoding='utf-8'))
          wanted={'bigster_essential_mildhybrid140_4x2_manual','duster_iii_essential_ecog120_4x2_manual','jogger_essential_5seat_ecog120_manual','spring_essential_electric70_automatic'}
          out=[]
          for doc in d['documents']:
              if doc['configuration_code'] not in wanted: continue
              out.append('='*80+'\n'+doc['configuration_code'])
              for p in doc['pages_ledger']:
                  if p['page'] in (5,6,7): out.append(f"\n--- PAGE {p['page']} ---\n{p['text']}")
          Path('data/reporting/dacia_configurator_representative_technical_pages_20260809.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reporting/dacia_configurator_representative_technical_pages_20260809.txt
          git commit -m "data(reporting): extract representative technical pages"
          git pull --rebase origin ai/dacia-configurator-pdf-archive-20260809
          git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
