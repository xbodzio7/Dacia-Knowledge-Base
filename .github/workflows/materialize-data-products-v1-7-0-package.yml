name: Materialize Data Products v1.7.0 Package

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/materialize-data-products-v1-7-0-package.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/data-products-v1-7-0-release-preparation
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install PDF backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Synchronize, verify and persist package
        shell: bash
        run: |
          set +e
          log=.github/data-products-v1.7.0-package.log
          : > "$log"
          status=0

          python tools/dkb.py project-state --apply >> "$log" 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            python tools/review_data_products_v1_7_0_release_preparation_20260726.py \
              --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest \
              tests.test_data_products_v1_7_0_release_preparation \
              >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' \
              >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py validate >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> "$log" 2>&1 || status=$?
          fi

          echo "exit_status=$status" >> "$log"
          cat "$log"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$log" README.md CHANGELOG.md project/ROADMAP.md \
            project/SESSION_STATE.md project/STATE_SUMMARY.md project/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs(release): materialize v1.7.0 preparation state'
            git push origin HEAD:agent/data-products-v1-7-0-release-preparation
          fi
          exit "$status"
