name: AI dry-run complete configurator PDF assimilation
on:
  push:
    branches: [ai/dacia-configurator-pdf-archive-20260809]
    paths: [.github/workflows/ai-dry-run-complete-current-configurator-import.yml]
permissions:
  contents: write
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Stage first-pass import in workspace
        run: python tools/import_current_configurator_pdfs_20260809.py --apply
      - name: Dry-run completion import
        run: python tools/import_current_configurator_pdfs_completion_20260809.py
      - name: Commit only completion report
        run: |
          git reset --hard HEAD -- data/master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reporting/dacia_configurator_pdf_canonical_import_20260809.json data/reporting/dacia_configurator_pdf_completion_import_20260809.json
          git commit -m "data(reporting): dry-run complete configurator PDF assimilation"
          git pull --rebase origin ai/dacia-configurator-pdf-archive-20260809
          git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
