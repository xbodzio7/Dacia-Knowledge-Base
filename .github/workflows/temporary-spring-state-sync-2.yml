name: Temporary Spring Package State Synchronization 2

on:
  push:
    branches:
      - agent/spring-my26-dimension-dc40-review-20261120-001

permissions:
  contents: write

concurrency:
  group: temporary-spring-state-sync-2
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Apply canonical state and generated documentation
        run: python tools/dkb.py project-state --apply
      - name: Verify canonical state and generated documentation
        run: |
          python tools/dkb.py project-state --check
          python tools/dkb.py documentation-baseline --check
      - name: Commit generated files to this package branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git add project/state.json project/STATE_SUMMARY.md README.md CHANGELOG.md project/ROADMAP.md project/SESSION_STATE.md
          if git diff --cached --quiet; then
            echo "Canonical state and generated documentation are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(state): synchronize Spring comparison-scope baseline"
          git push origin "HEAD:${BRANCH_NAME}"
