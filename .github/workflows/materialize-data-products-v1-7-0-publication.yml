name: Materialize Data Products v1.7.0 Publication

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/materialize-data-products-v1-7-0-publication.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/record-data-products-v1.7.0-publication
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install PDF backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Materialize and verify publication record
        shell: bash
        run: |
          set +e
          log=.github/data-products-v1.7.0-publication.log
          : > "$log"
          status=0

          python - >> "$log" 2>&1 <<'PY' || status=$?
          from pathlib import Path

          verifier = Path("tools/review_data_products_v1_7_0_release_preparation_20260726.py")
          text = verifier.read_text(encoding="utf-8")
          old_constants = '''PREVIOUS_RELEASE = ROOT / "project" / "releases" / "data-products-v1.6.1.md"
          TARGET_RELEASE = ROOT / "project" / "releases" / "data-products-v1.7.0.md"
          '''
          new_constants = '''PREVIOUS_RELEASE = ROOT / "project" / "releases" / "data-products-v1.6.1.md"
          TARGET_RELEASE = ROOT / "project" / "releases" / "data-products-v1.7.0.md"
          TARGET_AUDIT = (
              ROOT
              / "project"
              / "releases"
              / "data-products-v1.7.0-publication-audit.json"
          )
          '''
          if "TARGET_AUDIT" not in text:
              if old_constants not in text:
                  raise SystemExit("preparation verifier constants differ")
              text = text.replace(old_constants, new_constants, 1)

          old_repository = '''    ensure(all(path.is_file() for path in required_tools), "release tooling is incomplete")
              ensure(PREVIOUS_RELEASE.is_file(), "previous public release record is missing")
              ensure(not TARGET_RELEASE.exists(), "v1.7.0 publication record exists during preparation")

              state = load_json(STATE)
              ensure(state.get("phase") == "Data Products v1.7.0 Release Preparation", "project phase differs")
              ensure(
                  state.get("current_package", {}).get("name")
                  == "Data Products v1.7.0 Release Preparation",
                  "current package differs",
              )
              ensure(state.get("current_package", {}).get("status") == "complete", "current package is not complete")
              ensure(
                  state.get("next_package", {}).get("name") == "Data Products v1.7.0 Preflight",
                  "state next package differs",
              )
          '''
          new_repository = '''    ensure(all(path.is_file() for path in required_tools), "release tooling is incomplete")
              ensure(PREVIOUS_RELEASE.is_file(), "previous public release record is missing")

              publication_recorded = TARGET_RELEASE.is_file() or TARGET_AUDIT.is_file()
              ensure(
                  TARGET_RELEASE.is_file() == TARGET_AUDIT.is_file(),
                  "v1.7.0 publication records are incomplete",
              )
              if publication_recorded:
                  audit = load_json(TARGET_AUDIT)
                  ensure(audit.get("release_id") == 360090447, "v1.7.0 release ID differs")
                  ensure(audit.get("tag") == "data-products-v1.7.0", "v1.7.0 release tag differs")
                  ensure(
                      audit.get("target_commit_sha")
                      == "99e0e19b86cad6eae619f37702464e6a5a761cd8",
                      "v1.7.0 target commit differs",
                  )
                  ensure(audit.get("verification") == "PASS", "v1.7.0 audit did not pass")

              state = load_json(STATE)
              if publication_recorded:
                  ensure(state.get("phase") == "Data Products v1.7.0 Publication", "project phase differs")
                  ensure(
                      state.get("current_package", {}).get("name")
                      == "Data Products v1.7.0 Publication",
                      "current package differs",
                  )
                  ensure(
                      state.get("next_package", {}).get("name")
                      == "Cross-Model Comparison View Review",
                      "state next package differs",
                  )
              else:
                  ensure(state.get("phase") == "Data Products v1.7.0 Release Preparation", "project phase differs")
                  ensure(
                      state.get("current_package", {}).get("name")
                      == "Data Products v1.7.0 Release Preparation",
                      "current package differs",
                  )
                  ensure(
                      state.get("next_package", {}).get("name")
                      == "Data Products v1.7.0 Preflight",
                      "state next package differs",
                  )
              ensure(state.get("current_package", {}).get("status") == "complete", "current package is not complete")
          '''
          if "publication_recorded = TARGET_RELEASE.is_file()" not in text:
              if old_repository not in text:
                  raise SystemExit("preparation verifier repository block differs")
              text = text.replace(old_repository, new_repository, 1)
          verifier.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_data_products_v1_7_0_release_preparation.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_test_constants = '''STATE = ROOT / "project" / "state.json"
          SHA256 = re.compile(r"[0-9a-f]{64}\\Z")
          '''
          new_test_constants = '''STATE = ROOT / "project" / "state.json"
          TARGET_RELEASE = ROOT / "project" / "releases" / "data-products-v1.7.0.md"
          TARGET_AUDIT = (
              ROOT / "project" / "releases" / "data-products-v1.7.0-publication-audit.json"
          )
          SHA256 = re.compile(r"[0-9a-f]{64}\\Z")
          '''
          if "TARGET_AUDIT" not in test_text:
              if old_test_constants not in test_text:
                  raise SystemExit("preparation test constants differ")
              test_text = test_text.replace(old_test_constants, new_test_constants, 1)

          old_assertion = '''        self.assertFalse((ROOT / "project/releases/data-products-v1.7.0.md").exists())
          '''
          new_assertion = '''        self.assertEqual(TARGET_RELEASE.is_file(), TARGET_AUDIT.is_file())
              if TARGET_AUDIT.is_file():
                  audit = json.loads(TARGET_AUDIT.read_text(encoding="utf-8"))
                  self.assertEqual(audit["release_id"], 360090447)
                  self.assertEqual(audit["tag"], "data-products-v1.7.0")
                  self.assertEqual(
                      audit["target_commit_sha"],
                      "99e0e19b86cad6eae619f37702464e6a5a761cd8",
                  )
                  self.assertEqual(audit["verification"], "PASS")
          '''
          if "self.assertEqual(TARGET_RELEASE.is_file(), TARGET_AUDIT.is_file())" not in test_text:
              if old_assertion not in test_text:
                  raise SystemExit("preparation test publication assertion differs")
              test_text = test_text.replace(old_assertion, new_assertion, 1)

          old_state_test = '''    def test_project_state_advances_to_post_merge_preflight(self) -> None:
              state = json.loads(STATE.read_text(encoding="utf-8"))
              self.assertEqual(state["phase"], "Data Products v1.7.0 Release Preparation")
              self.assertEqual(
                  state["current_package"]["name"],
                  "Data Products v1.7.0 Release Preparation",
              )
              self.assertEqual(state["current_package"]["status"], "complete")
              self.assertEqual(
                  state["next_package"]["name"],
                  "Data Products v1.7.0 Preflight",
              )
              self.assertEqual(state["next_package"]["status"], "planned")
              self.assertEqual(state["baseline"]["tests"], 971)
              self.assertEqual(state["baseline"]["rows"], 9688)
              self.assertEqual(state["baseline"]["configuration_values"], 2949)
              self.assertEqual(state["baseline"]["configuration_value_ranges"], 244)
              self.assertEqual(state["baseline"]["attributes"], 385)
          '''
          new_state_test = '''    def test_project_state_advances_after_release_preparation(self) -> None:
              state = json.loads(STATE.read_text(encoding="utf-8"))
              if TARGET_RELEASE.is_file():
                  self.assertEqual(state["phase"], "Data Products v1.7.0 Publication")
                  self.assertEqual(
                      state["current_package"]["name"],
                      "Data Products v1.7.0 Publication",
                  )
                  self.assertEqual(
                      state["next_package"]["name"],
                      "Cross-Model Comparison View Review",
                  )
              else:
                  self.assertEqual(state["phase"], "Data Products v1.7.0 Release Preparation")
                  self.assertEqual(
                      state["current_package"]["name"],
                      "Data Products v1.7.0 Release Preparation",
                  )
                  self.assertEqual(
                      state["next_package"]["name"],
                      "Data Products v1.7.0 Preflight",
                  )
              self.assertEqual(state["current_package"]["status"], "complete")
              self.assertEqual(state["next_package"]["status"], "planned")
              self.assertEqual(state["baseline"]["tests"], 971)
              self.assertEqual(state["baseline"]["rows"], 9688)
              self.assertEqual(state["baseline"]["configuration_values"], 2949)
              self.assertEqual(state["baseline"]["configuration_value_ranges"], 244)
              self.assertEqual(state["baseline"]["attributes"], 385)
          '''
          if "def test_project_state_advances_after_release_preparation" not in test_text:
              if old_state_test not in test_text:
                  raise SystemExit("preparation state test differs")
              test_text = test_text.replace(old_state_test, new_state_test, 1)
          test_path.write_text(test_text, encoding="utf-8")
          print("PASS: v1.7.0 preparation contracts made publication-aware")
          PY

          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/review_data_products_v1_7_0_release_preparation_20260726.py --check >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest tests.test_data_products_v1_7_0_release_preparation >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py validate >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> "$log" 2>&1 || status=$?
          fi

          echo "exit_status=$status" >> "$log"
          cat "$log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$log" CHANGELOG.md README.md project/ROADMAP.md \
            project/STATE_SUMMARY.md project/state.json \
            tools/review_data_products_v1_7_0_release_preparation_20260726.py \
            tests/test_data_products_v1_7_0_release_preparation.py
          if ! git diff --cached --quiet; then
            git commit -m 'docs(release): materialize v1.7.0 publication record'
            git push origin HEAD:docs/record-data-products-v1.7.0-publication
          fi
          exit "$status"
