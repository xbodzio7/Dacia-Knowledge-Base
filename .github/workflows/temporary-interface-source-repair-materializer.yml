name: Temporary Interface Source Repair Materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/interface-source-coverage-repair-20260801'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/interface-source-coverage-repair-20260801
          fetch-depth: 0
      - name: Apply repair
        run: python tools/apply_interface_source_coverage_repair_20260801.py
      - name: Commit materialized changes
        run: |
          if git diff --quiet; then
            echo "Repair already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master/commercial_item_configurations.csv tools/reporting/configuration_shortlist_selection.js tools/reporting/configuration_shortlist_v12_pricing.js tests/test_configuration_selection_export.py
          git commit -m "data: materialize interface source coverage repair"
          git push origin HEAD:agent/interface-source-coverage-repair-20260801
