name: Materialize Portfolio Powertrain Transmission Matrix

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: materialize-portfolio-powertrain-transmission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/portfolio-powertrain-transmission-matrix-001'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Apply canonical project state
        run: python tools/dkb.py project-state --apply
      - name: Verify focused package
        run: |
          python -m unittest -v tests.test_portfolio_powertrain_transmission_matrix
          python tools/dkb.py project-state --check
      - name: Generate matrix artifacts
        run: python tools/reporting/portfolio_powertrain_transmission_matrix.py
      - name: Upload matrix artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: portfolio-powertrain-transmission-matrix
          path: output/portfolio-powertrain-transmission-matrix/
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated documentation
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          rm .github/workflows/materialize-portfolio-powertrain-transmission-matrix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(project): materialize powertrain matrix state"
          git push origin "HEAD:${HEAD_BRANCH}"
