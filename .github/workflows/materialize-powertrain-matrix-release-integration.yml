name: Materialize Powertrain Matrix Release Integration
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
permissions:
  contents: write
jobs:
  materialize:
    if: github.head_ref == 'agent/portfolio-powertrain-transmission-matrix-release-integration-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Materialize
        run: |
          python tools/materialize_powertrain_matrix_release_integration.py
          python tools/dkb.py project-state --apply
      - name: Verify
        run: |
          python -m unittest -v tests.test_portfolio_powertrain_transmission_matrix_release_integration
          python tools/dkb.py project-state --check
          d1=$(mktemp -d); d2=$(mktemp -d)
          python tools/data_product_release.py --version 1.16.0 --commit-sha 1111111111111111111111111111111111111111 --output-directory "$d1"
          python tools/data_product_release.py --version 1.16.0 --commit-sha 1111111111111111111111111111111111111111 --output-directory "$d2"
          cmp "$d1/dacia-knowledge-base-data-products-v1.16.0.zip" "$d2/dacia-knowledge-base-data-products-v1.16.0.zip"
      - name: Commit final package
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          rm .github/workflows/materialize-powertrain-matrix-release-integration.yml
          rm tools/materialize_powertrain_matrix_release_integration.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'release: integrate powertrain transmission matrix'
          git push origin "HEAD:${HEAD_BRANCH}"
