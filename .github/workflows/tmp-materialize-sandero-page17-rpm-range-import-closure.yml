name: Temporary materialize Sandero page 17 RPM range import closure

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-materialize-sandero-page17-rpm-range-import-closure.yml'

permissions:
  contents: write

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/sandero-page17-rpm-range-import-closure-20260731
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install PDF text extraction backend
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Materialize exact five-file closure package
        shell: python
        run: |
          from __future__ import annotations

          import csv
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          root = Path('.')
          master = root / 'data' / 'master'
          reporting = root / 'data' / 'reporting'
          specs_dir = root / 'data' / 'imports' / 'configuration_value_ranges'

          source_code = 'src_pl_sandero_brochure_20260202'
          source_file = root / 'PDF' / 'Broszury' / 'DACIA SANDERO broszura 20260202.pdf'
          source_sha = 'adee5017a405a22dffaca0555b47b84b718f2166534652c9863ba2f97f325f97'
          observation_date = '2026-02-02'
          package_id = 'post_residual_sandero_page17_power_torque_rpm_range_import_closure_001'

          power_spec_path = specs_dir / 'sandero-page17-max-power-rpm-ranges-20260202.json'
          torque_spec_path = specs_dir / 'sandero-page17-max-torque-rpm-ranges-20260202.json'
          reconciliation_path = reporting / 'sandero_technical_page17_reviewed_fact_reconciliation.json'

          report_path = reporting / 'sandero_page17_power_torque_rpm_range_import_closure.json'
          report_md_path = reporting / 'sandero_page17_power_torque_rpm_range_import_closure.md'
          review_path = root / 'project' / 'reviews' / 'sandero-page17-power-torque-rpm-range-import-closure-2026-07-31.md'
          state_path = root / 'project' / 'state.json'

          expected_targets = {
              'sandero_iii_essential_tce100_manual',
              'sandero_iii_expression_tce100_manual',
              'sandero_iii_journey_tce100_manual',
              'sandero_iii_expression_ecog120_manual',
              'sandero_iii_journey_ecog120_manual',
              'sandero_iii_expression_ecog120_automatic',
              'sandero_iii_journey_ecog120_automatic',
          }

          def load_json(path: Path) -> dict:
              payload = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(payload, dict):
                  raise RuntimeError(f'expected JSON object: {path}')
              return payload

          def csv_rows(path: Path) -> list[dict[str, str]]:
              with path.open(encoding='utf-8-sig', newline='') as handle:
                  reader = csv.DictReader(handle)
                  if reader.fieldnames is None:
                      raise RuntimeError(f'missing CSV header: {path}')
                  return list(reader)

          if hashlib.sha256(source_file.read_bytes()).hexdigest() != source_sha:
              raise RuntimeError('Sandero brochure SHA-256 differs')

          reconciliation = load_json(reconciliation_path)
          if reconciliation.get('kind') != 'sandero_technical_page17_reviewed_fact_reconciliation':
              raise RuntimeError('unexpected reconciliation kind')
          if reconciliation.get('status') != 'complete_with_small_range_import_handoff':
              raise RuntimeError('reconciliation is not complete')
          if reconciliation.get('partition_check') != {
              'candidate_count': 46,
              'classified_once': True,
              'class_counts': {
                  'current_exact_scalar_coverage': 11,
                  'current_configuration_or_fuel_identity_coverage': 2,
                  'import_ready_range_gap': 2,
                  'context_model_required': 1,
                  'explicit_non_import_or_context': 30,
              },
          }:
              raise RuntimeError('46-candidate reconciliation partition differs')

          gap = reconciliation['candidate_reconciliation']['import_ready_range_gap']
          if gap.get('planned_range_observations') != 20 or gap.get('planned_range_id_start') != 279 or gap.get('planned_range_id_end') != 298:
              raise RuntimeError('planned range handoff differs')
          if gap.get('attribute_counts') != {'max_power_rpm': 11, 'max_torque_rpm': 9}:
              raise RuntimeError('planned attribute counts differ')
          if gap.get('excluded_automatic_petrol_torque_range', {}).get('configuration_count') != 2:
              raise RuntimeError('automatic petrol torque exclusion differs')

          power_spec = load_json(power_spec_path)
          torque_spec = load_json(torque_spec_path)
          if power_spec.get('id_start') != 279 or power_spec.get('attribute_code') != 'max_power_rpm' or len(power_spec.get('rows', [])) != 11:
              raise RuntimeError('max-power range specification differs')
          if torque_spec.get('id_start') != 290 or torque_spec.get('attribute_code') != 'max_torque_rpm' or len(torque_spec.get('rows', [])) != 9:
              raise RuntimeError('max-torque range specification differs')
          for payload in (power_spec, torque_spec):
              if payload.get('source_page') != 17 or payload.get('source_section') != 'SILNIKI':
                  raise RuntimeError('range specification source boundary differs')
              if payload.get('observation_date') != observation_date:
                  raise RuntimeError('range specification observation date differs')
              if payload.get('attribute_contract') != {'data_type': 'integer', 'unit': 'rpm', 'status': 'active'}:
                  raise RuntimeError('range specification attribute contract differs')

          all_ranges = csv_rows(master / 'configuration_attribute_value_ranges.csv')
          selected = sorted(
              [row for row in all_ranges if 279 <= int(row['id']) <= 298],
              key=lambda row: int(row['id']),
          )
          if [int(row['id']) for row in selected] != list(range(279, 299)):
              raise RuntimeError('range IDs 279-298 are not one exact contiguous receipt')
          if Counter(row['attribute_code'] for row in selected) != Counter({'max_power_rpm': 11, 'max_torque_rpm': 9}):
              raise RuntimeError('master range attribute counts differ')
          if {row['source_code'] for row in selected} != {source_code}:
              raise RuntimeError('master range source differs')
          if {row['observation_date'] for row in selected} != {observation_date}:
              raise RuntimeError('master range observation date differs')
          if {(row['lower_inclusive'], row['upper_inclusive']) for row in selected} != {('true', 'true')}:
              raise RuntimeError('master ranges are not closed intervals')
          if {row['configuration_code'] for row in selected} != expected_targets:
              raise RuntimeError('master range target set differs')
          if Counter(row['fuel_type_code'] for row in selected) != Counter({'petrol': 12, 'lpg': 8}):
              raise RuntimeError('master range fuel-context counts differ')

          power_distribution = Counter(
              (row['fuel_type_code'], row['minimum_value'], row['maximum_value'])
              for row in selected
              if row['attribute_code'] == 'max_power_rpm'
          )
          if power_distribution != Counter({
              ('petrol', '5000', '5250'): 3,
              ('lpg', '4500', '5000'): 4,
              ('petrol', '4500', '5750'): 4,
          }):
              raise RuntimeError('max-power range distribution differs')

          torque_distribution = Counter(
              (row['fuel_type_code'], row['minimum_value'], row['maximum_value'])
              for row in selected
              if row['attribute_code'] == 'max_torque_rpm'
          )
          if torque_distribution != Counter({
              ('petrol', '2900', '3500'): 3,
              ('lpg', '1750', '3750'): 4,
              ('petrol', '2000', '4000'): 2,
          }):
              raise RuntimeError('max-torque range distribution differs')
          if any(
              row['attribute_code'] == 'max_torque_rpm'
              and row['fuel_type_code'] == 'petrol'
              and row['configuration_code'].endswith('ecog120_automatic')
              for row in selected
          ):
              raise RuntimeError('automatic-petrol Eco-G torque range was inferred')

          configurations = {row['code']: row for row in csv_rows(master / 'configurations.csv')}
          if not all(configurations[code]['status'] == 'active' for code in expected_targets):
              raise RuntimeError('one or more target configurations are not active')
          linked = {
              row['configuration_code']
              for row in csv_rows(master / 'source_configurations.csv')
              if row['source_code'] == source_code and row['relationship'] == 'brochure_technical_data_for'
          }
          if not expected_targets <= linked:
              raise RuntimeError('one or more target configurations are not linked to the brochure')

          next_package = {
              'package_id': 'data_products_v1_9_0_release_preparation_001',
              'kind': 'release_preparation',
              'name': 'Data Products v1.9.0 Release Preparation',
              'status': 'planned',
              'goal': 'Prepare and verify an immutable minor-release candidate containing the completed Sandero page-17 RPM range coverage and all current source-backed data products, without publishing or changing source data.',
              'manifest_paths': [
                  'data/reporting/data_products_v1_9_0_release_preparation.json',
                  'project/packages/data-products-v1.9.0-release-preparation.md',
                  'tests/test_data_products_v1_9_0_release_preparation.py',
                  'tools/review_data_products_v1_9_0_release_preparation_20260731.py',
                  'tools/reporting/data_product_release.py',
                  'README.md',
                  'CHANGELOG.md',
                  'project/ROADMAP.md',
                  'project/SESSION_STATE.md',
                  'project/state.json',
                  'project/STATE_SUMMARY.md',
              ],
          }

          closure = {
              'version': 1,
              'kind': 'sandero_page17_power_torque_rpm_range_import_closure',
              'reviewed_on': '2026-07-31',
              'status': 'complete_with_preserved_boundaries',
              'package_id': package_id,
              'source': {
                  'source_code': source_code,
                  'file_path': 'PDF/Broszury/DACIA SANDERO broszura 20260202.pdf',
                  'sha256': source_sha,
                  'page': 17,
                  'observation_date': observation_date,
              },
              'scope': {
                  'reviewed_candidates': 46,
                  'import_ready_candidate_decisions': 2,
                  'imported_range_observations': 20,
                  'target_configurations': 7,
                  'import_specs': 2,
              },
              'completed_import_receipts': [
                  {
                      'attribute': 'max_power_rpm',
                      'spec_path': 'data/imports/configuration_value_ranges/sandero-page17-max-power-rpm-ranges-20260202.json',
                      'id_range': [279, 289],
                      'observations': 11,
                      'fuel_context_counts': {'petrol': 7, 'lpg': 4},
                      'closed_intervals': [
                          {'fuel_type_code': 'petrol', 'minimum_value': '5000', 'maximum_value': '5250', 'observations': 3},
                          {'fuel_type_code': 'lpg', 'minimum_value': '4500', 'maximum_value': '5000', 'observations': 4},
                          {'fuel_type_code': 'petrol', 'minimum_value': '4500', 'maximum_value': '5750', 'observations': 4},
                      ],
                  },
                  {
                      'attribute': 'max_torque_rpm',
                      'spec_path': 'data/imports/configuration_value_ranges/sandero-page17-max-torque-rpm-ranges-20260202.json',
                      'id_range': [290, 298],
                      'observations': 9,
                      'fuel_context_counts': {'petrol': 5, 'lpg': 4},
                      'closed_intervals': [
                          {'fuel_type_code': 'petrol', 'minimum_value': '2900', 'maximum_value': '3500', 'observations': 3},
                          {'fuel_type_code': 'lpg', 'minimum_value': '1750', 'maximum_value': '3750', 'observations': 4},
                          {'fuel_type_code': 'petrol', 'minimum_value': '2000', 'maximum_value': '4000', 'observations': 2},
                      ],
                  },
              ],
              'master_receipt': {
                  'id_range': [279, 298],
                  'observations': 20,
                  'attribute_counts': {'max_power_rpm': 11, 'max_torque_rpm': 9},
                  'fuel_context_counts': {'petrol': 12, 'lpg': 8},
                  'configuration_group_counts': {
                      'tce100_manual': 6,
                      'ecog120_manual': 8,
                      'ecog120_automatic': 6,
                  },
                  'source_code': source_code,
                  'observation_date': observation_date,
                  'closed_intervals_only': True,
              },
              'reconciliation_closure': {
                  'candidate_partition_preserved': True,
                  'current_exact_scalar_coverage': 11,
                  'current_configuration_or_fuel_identity_coverage': 2,
                  'import_ready_candidate_decisions_closed': 2,
                  'planned_range_observations_materialized': 20,
                  'remaining_context_model_required': 1,
                  'remaining_explicit_non_import_or_context': 30,
                  'remaining_import_ready_exact_gaps': 0,
              },
              'preserved_boundaries': [
                  {
                      'code': 'printed_tce_power_literal_conflict',
                      'classification': 'source_literal_preserved',
                      'decision': 'retain the printed 100 TCe / 74 (120 KM) inconsistency without creating or normalizing another scalar power value',
                  },
                  {
                      'code': 'automatic_petrol_ecog_torque_rpm',
                      'classification': 'not_stated_on_aligned_source_continuation',
                      'decision': 'do not infer a petrol torque-speed interval for the two Eco-G automatic configurations',
                  },
                  {
                      'code': 'direct_injection_dual_fuel_context',
                      'classification': 'fuel_context_model_required',
                      'decision': 'do not create an unscoped dual-fuel injection scalar from the shared brochure row',
                  },
                  {
                      'code': 'explicit_non_import_or_context',
                      'candidate_count': 30,
                      'decision': 'retain all authored protocol, continuation, country-dependent and context-only boundaries',
                  },
              ],
              'closure_decision': {
                  'exact_range_import_complete': True,
                  'master_values_overwritten': False,
                  'automatic_promotion_used': False,
                  'fuel_subcolumns_collapsed': False,
                  'automatic_petrol_torque_range_inferred': False,
                  'sandero_page17_import_ready_boundary_complete': True,
                  'release_checkpoint_ready': True,
                  'target_release': 'data-products-v1.9.0',
              },
              'next_package': next_package,
          }

          report_path.write_text(json.dumps(closure, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          report_md_path.write_text(
              """# Sandero Page 17 Power and Torque RPM Range Import Closure

Status: complete with preserved boundaries  
Package: `post_residual_sandero_page17_power_torque_rpm_range_import_closure_001`  
Source: `src_pl_sandero_brochure_20260202`, page 17

## Exact receipt

- two strict range specifications are present and source-bounded;
- IDs `279–298` form one contiguous 20-row suffix;
- `max_power_rpm` contains 11 observations and `max_torque_rpm` contains 9 observations;
- all intervals are closed, use `rpm`, retain observation date `2026-02-02` and target exactly seven active Sandero III configurations;
- fuel context remains explicit: 12 petrol observations and 8 LPG observations.

## Reconciliation closure

Both import-ready decisions from the 46-candidate Sandero page-17 reconciliation are fully materialized. The original partition remains exact: 11 scalar-coverage candidates, 2 configuration/fuel-identity candidates, 2 imported range candidates, 1 context-model boundary and 30 explicit non-import/context candidates. No import-ready exact gap remains.

## Preserved boundaries

- the printed `100 TCe` / `74 (120 KM)` inconsistency remains literal and does not create another scalar power value;
- no petrol torque-speed interval is inferred for the two Eco-G automatic configurations because the reviewed source has no aligned RPM continuation;
- petrol and LPG subcolumns remain separate source contexts;
- the shared direct-injection row remains deferred for dual-fuel Eco-G rather than becoming an unscoped scalar;
- protocol labels, country-dependent continuations and context-only fragments remain non-imports.

## Release checkpoint

The bounded Sandero page-17 import chain is complete. The next package prepares, but does not publish, `data-products-v1.9.0` from the current source-backed repository state.
""",
              encoding='utf-8',
          )

          review_path.parent.mkdir(parents=True, exist_ok=True)
          review_path.write_text(
              """# Review — Sandero page 17 power and torque RPM range import closure

Date: 2026-07-31  
Package: `post_residual_sandero_page17_power_torque_rpm_range_import_closure_001`

## Inputs

- the 46-candidate Sandero page-17 reviewed-fact reconciliation;
- two strict configuration-value-range import specifications;
- master range observations `279–298`;
- current configuration, source-relationship and fuel-context contracts.

## Result

The two import-ready reconciliation decisions are fully closed by 20 exact, append-only, source-specific closed intervals. The receipt contains 11 maximum-power-speed and 9 maximum-torque-speed observations across the exact seven active Sandero III configurations. No import-ready exact gap remains in this source boundary.

## Safety boundary

The printed TCe power inconsistency remains literal. Petrol and LPG evidence is not collapsed. No petrol torque-speed interval is inferred for Eco-G automatic, and the shared direct-injection row remains deferred because dual-fuel context is required. All 30 explicit non-import/context decisions remain unchanged.

## Handoff

The completed Sandero page-17 chain releases the deferred checkpoint. The next package is `data_products_v1_9_0_release_preparation_001`, which prepares and verifies an immutable `data-products-v1.9.0` candidate without publishing it.
""",
              encoding='utf-8',
          )

          state = load_json(state_path)
          state['phase'] = 'Sandero Page 17 Power and Torque RPM Range Import Closure'
          state['current_package'] = {
              'package_id': package_id,
              'kind': 'review_closure',
              'name': 'Sandero Page 17 Power and Torque RPM Range Import Closure',
              'status': 'complete',
              'goal': 'Verify the exact 20-range receipt, close the only import-ready Sandero page-17 gap, preserve scalar, fuel-context and non-import boundaries, and release the data-products-v1.9.0 preparation checkpoint.',
              'manifest_paths': [
                  'data/reporting/sandero_page17_power_torque_rpm_range_import_closure.json',
                  'data/reporting/sandero_page17_power_torque_rpm_range_import_closure.md',
                  'project/reviews/sandero-page17-power-torque-rpm-range-import-closure-2026-07-31.md',
                  'project/state.json',
                  'project/STATE_SUMMARY.md',
              ],
          }
          state['next_package'] = next_package
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Synchronize and verify canonical project state
        run: |
          python tools/dkb.py project-state --apply
          python tools/dkb.py project-state --check
          python tools/dkb.py documentation-baseline --check

      - name: Verify exact five-file manifest before quality
        shell: python
        run: |
          import subprocess
          expected = {
              'data/reporting/sandero_page17_power_torque_rpm_range_import_closure.json',
              'data/reporting/sandero_page17_power_torque_rpm_range_import_closure.md',
              'project/reviews/sandero-page17-power-torque-rpm-range-import-closure-2026-07-31.md',
              'project/state.json',
              'project/STATE_SUMMARY.md',
          }
          changed = {
              line.strip()
              for line in subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
              if line.strip()
          }
          if changed != expected:
              raise RuntimeError(f'unexpected working-tree manifest: {sorted(changed)}')

      - name: Run full quality gate
        run: python tools/dkb.py quality --concise --database '${{ runner.temp }}/dkb.sqlite' --log-file '${{ runner.temp }}/quality.log' --summary-json '${{ runner.temp }}/quality-summary.json'

      - name: Commit package and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-materialize-sandero-page17-rpm-range-import-closure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(sandero): close page 17 RPM range import'
          git fetch origin main
          python - <<'PY'
          import subprocess
          expected = {
              'data/reporting/sandero_page17_power_torque_rpm_range_import_closure.json',
              'data/reporting/sandero_page17_power_torque_rpm_range_import_closure.md',
              'project/reviews/sandero-page17-power-torque-rpm-range-import-closure-2026-07-31.md',
              'project/state.json',
              'project/STATE_SUMMARY.md',
          }
          changed = {
              line.strip()
              for line in subprocess.check_output(['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True).splitlines()
              if line.strip()
          }
          if changed != expected:
              raise RuntimeError(f'unexpected final PR manifest: {sorted(changed)}')
          PY
          git push origin HEAD:agent/sandero-page17-rpm-range-import-closure-20260731
