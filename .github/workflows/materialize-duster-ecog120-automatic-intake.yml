name: Materialize Duster Eco-G 120 automatic intake

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: materialize-duster-ecog120-automatic-intake
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/duster-ecog120-automatic-intake'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/duster-ecog120-automatic-intake
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Materialize package
        id: materialize
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/import_duster_ecog120_automatic_engine_20260724.py')
          text = path.read_text(encoding='utf-8')
          old = '''    units = {
              row["code"]
              for row in read_rows(MASTER / "units.csv")
              if row.get("status") == "active"
          }
          '''
          old = old.replace('          ', '')
          new = '''    units = {
              row["symbol"]
              for row in read_rows(MASTER / "units.csv")
          }
          '''
          new = new.replace('          ', '')
          if old not in text:
              raise SystemExit('missing engine unit registry anchor')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          set +e
          python tools/_materialize_duster_ecog120_automatic_intake.py > "${RUNNER_TEMP}/materialize.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "${RUNNER_TEMP}/materialize.status"
          exit "$status"
      - name: Upload materializer diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: duster-automatic-materializer-diagnostic
          path: |
            ${{ runner.temp }}/materialize.log
            ${{ runner.temp }}/materialize.status
          if-no-files-found: error
          retention-days: 1
      - name: Require materialization success
        shell: bash
        run: |
          cat "${RUNNER_TEMP}/materialize.log"
          test "$(cat "${RUNNER_TEMP}/materialize.status")" = "0"
      - name: Remove transport files
        run: |
          rm -f .github/workflows/materialize-duster-ecog120-automatic-intake.yml
          rm -f tools/_materialize_duster_ecog120_automatic_intake.py
      - name: Synchronize canonical state
        run: python tools/dkb.py project-state --apply
      - name: Verify targeted contracts
        shell: bash
        run: |
          python -m unittest -q \
            tests.test_duster_ecog120_automatic_stock_20260724 \
            tests.test_duster_catalog_bootstrap \
            tests.test_duster_equipment_availability_import \
            tests.test_duster_technical_specifications
          python tools/import_duster_ecog120_automatic_stock_20260724.py --check
          python tools/import_duster_ecog120_automatic_engine_20260724.py --check
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from reporting.configuration_comparison_bundle import discover_scopes
          scopes = discover_scopes(Path('.').resolve())
          assert len(scopes) == 19
          assert any(scope.slug == 'duster_ecog120_automatic' for scope in scopes)
          PY
      - name: Run complete unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Run full quality gate
        shell: bash
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
          python tools/dkb.py quality \
            --concise \
            --database "${RUNNER_TEMP}/dacia_knowledge_base.sqlite" \
            --log-file "${RUNNER_TEMP}/quality.log" \
            --summary-json "${RUNNER_TEMP}/quality-summary.json"
      - name: Commit one logical package
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/materialize-duster-ecog120-automatic-intake.yml
          test ! -e tools/_materialize_duster_ecog120_automatic_intake.py
          git diff --check
          git status --short
          git config user.name 'Dacia Knowledge Base Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(data): add Duster Eco-G 120 automatic configurations'
          git push origin HEAD:agent/duster-ecog120-automatic-intake
