name: Materialize Duster Eco-G 120 automatic intake

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: materialize-duster-ecog120-automatic-intake
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/duster-ecog120-automatic-intake'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/duster-ecog120-automatic-intake
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Materialize package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('tools/import_duster_ecog120_automatic_engine_20260724.py')
          text = engine.read_text(encoding='utf-8')
          old = (
              '    units = {\n'
              '        row["code"]\n'
              '        for row in read_rows(MASTER / "units.csv")\n'
              '        if row.get("status") == "active"\n'
              '    }\n'
          )
          new = (
              '    units = {\n'
              '        row["symbol"]\n'
              '        for row in read_rows(MASTER / "units.csv")\n'
              '    }\n'
          )
          if old not in text:
              raise SystemExit('missing engine unit registry anchor')
          engine.write_text(text.replace(old, new, 1), encoding='utf-8')

          release = Path('tools/reporting/data_product_release.py')
          text = release.read_text(encoding='utf-8')
          text = text.replace('bundle.get("scope_group_count") != 18', 'bundle.get("scope_group_count") != 19')
          text = text.replace('must contain 18 independent scopes', 'must contain 19 independent scopes')
          release.write_text(text, encoding='utf-8')

          bundle_test = Path('tests/test_configuration_comparison_bundle.py')
          text = bundle_test.read_text(encoding='utf-8')
          text = text.replace('self.assertEqual(len(scopes), 18)', 'self.assertEqual(len(scopes), 19)')
          text = text.replace('self.assertEqual(len(codes), 69)', 'self.assertEqual(len(codes), 72)')
          text = text.replace('self.assertEqual(len(set(codes)), 69)', 'self.assertEqual(len(set(codes)), 72)')
          text = text.replace(
              '        self.assertEqual(\n            sum(scope.slug.startswith("duster_") for scope in scopes),\n            7,\n        )',
              '        self.assertEqual(\n            sum(scope.slug.startswith("duster_") for scope in scopes),\n            8,\n        )',
          )
          bundle_test.write_text(text, encoding='utf-8')

          release_test = Path('tests/test_data_product_release.py')
          text = release_test.read_text(encoding='utf-8')
          replacements = {
              'self.manifest["selected_configuration_count"], 69)': 'self.manifest["selected_configuration_count"], 72)',
              'self.manifest["scope_group_count"], 18)': 'self.manifest["scope_group_count"], 19)',
              'self.manifest["comparable_scope_count"], 18)': 'self.manifest["comparable_scope_count"], 19)',
              'self.assertEqual(len(names), 79)': 'self.assertEqual(len(names), 83)',
              'report["summary"]["active_configurations"], 69)': 'report["summary"]["active_configurations"], 72)',
              'report["summary"]["matched_configurations"], 69)': 'report["summary"]["matched_configurations"], 72)',
              'self.assertEqual(len(report["results"]), 69)': 'self.assertEqual(len(report["results"]), 72)',
              'self.assertEqual(len(rows), 69)': 'self.assertEqual(len(rows), 72)',
              'bundle["selected_configuration_count"], 69)': 'bundle["selected_configuration_count"], 72)',
              'bundle["scope_group_count"], 18)': 'bundle["scope_group_count"], 19)',
              'bundle["comparable_scope_count"], 18)': 'bundle["comparable_scope_count"], 19)',
              'self.assertEqual(len(bundle["groups"]), 18)': 'self.assertEqual(len(bundle["groups"]), 19)',
              'Selected configurations: 69': 'Selected configurations: 72',
              'Independent scopes: 18': 'Independent scopes: 19',
          }
          for old_value, new_value in replacements.items():
              if old_value not in text:
                  raise SystemExit(f'missing release-test anchor: {old_value}')
              text = text.replace(old_value, new_value)
          release_test.write_text(text, encoding='utf-8')

          scalar_updates = {
              'tests/test_jogger_payload_performance_ranges.py': (
                  'self.assertEqual(len(self.scalars), 1756)',
                  'self.assertEqual(len(self.scalars), 1765)',
              ),
              'tests/test_jogger_wltp_efficiency_ranges.py': (
                  'self.assertEqual(len(self.scalar_rows), 1756)',
                  'self.assertEqual(len(self.scalar_rows), 1765)',
              ),
          }
          for name, (old_value, new_value) in scalar_updates.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if old_value not in text:
                  raise SystemExit(f'missing scalar-count anchor: {old_value}')
              path.write_text(text.replace(old_value, new_value, 1), encoding='utf-8')
          PY
          python tools/_materialize_duster_ecog120_automatic_intake.py
      - name: Remove transport files
        run: |
          rm -f .github/workflows/materialize-duster-ecog120-automatic-intake.yml
          rm -f tools/_materialize_duster_ecog120_automatic_intake.py
      - name: Synchronize canonical state
        run: python tools/dkb.py project-state --apply
      - name: Verify targeted contracts
        shell: bash
        run: |
          python -m unittest -q \
            tests.test_duster_ecog120_automatic_stock_20260724 \
            tests.test_duster_catalog_bootstrap \
            tests.test_duster_equipment_availability_import \
            tests.test_duster_technical_specifications \
            tests.test_configuration_comparison_bundle \
            tests.test_data_product_release
          python tools/import_duster_ecog120_automatic_stock_20260724.py --check
          python tools/import_duster_ecog120_automatic_engine_20260724.py --check
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from reporting.configuration_comparison_bundle import discover_scopes
          scopes = discover_scopes(Path('.').resolve())
          assert len(scopes) == 19
          assert any(scope.slug == 'duster_ecog120_automatic' for scope in scopes)
          PY
      - name: Run complete unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Run full quality gate
        shell: bash
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
          python tools/dkb.py quality \
            --concise \
            --database "${RUNNER_TEMP}/dacia_knowledge_base.sqlite" \
            --log-file "${RUNNER_TEMP}/quality.log" \
            --summary-json "${RUNNER_TEMP}/quality-summary.json"
      - name: Commit one logical package
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/materialize-duster-ecog120-automatic-intake.yml
          test ! -e tools/_materialize_duster_ecog120_automatic_intake.py
          git diff --check
          git status --short
          git config user.name 'Dacia Knowledge Base Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(data): add Duster Eco-G 120 automatic configurations'
          git push origin HEAD:agent/duster-ecog120-automatic-intake
