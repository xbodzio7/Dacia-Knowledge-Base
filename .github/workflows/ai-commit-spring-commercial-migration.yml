name: AI commit Spring commercial migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migrator and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/ai-commit-spring-commercial-migration.yml
          git add -A
          git commit -m 'ci: remove Spring commercial migration committer'
          git push origin HEAD:main
          git fetch origin agent/spring-charging-cable-commercial-semantics-migration-20260802
          git checkout -B agent/spring-charging-cable-commercial-semantics-migration-20260802 origin/agent/spring-charging-cable-commercial-semantics-migration-20260802
          git merge origin/main --no-edit
          rm -f project/spring-commercial-migrator-trace.txt
          python3 tools/apply_spring_charging_cable_commercial_semantics_migration_20260802.py
          git add -A
          git commit -m 'data: migrate Spring charging cable commercial semantics'
          git push origin HEAD:agent/spring-charging-cable-commercial-semantics-migration-20260802
