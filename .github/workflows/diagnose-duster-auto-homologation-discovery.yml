name: Temporary Duster Homologation Discovery Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install PDF text extraction backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Reproduce materialized state
        run: |
          python tools/import_duster_ecog120_automatic_homologation_20260725.py --apply
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("tests/test_duster_ecog120_automatic_stock_20260724.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'self.assertEqual(report["scope"]["technical_slots"], 3)',
              'self.assertEqual(report["scope"]["technical_slots"], 29)',
          ).replace(
              'self.assertEqual(report["technical"]["present"], 9)',
              'self.assertEqual(report["technical"]["present"], 87)',
          )
          path.write_text(text, encoding="utf-8")

          state_path = Path("project/state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          state["updated_on"] = "2026-07-25"
          state["phase"] = "Duster Eco-G 120 Automatic Homologation Evidence"
          state["current_package"] = {
              "name": "Duster Eco-G 120 Automatic Homologation Evidence",
              "status": "complete",
              "goal": "Import exact automatic-specific power, torque, performance, WLTP, mass and towing evidence for the 2026 Duster Eco-G 120 Expression, Extreme and Journey configurations without inheriting manual cargo values.",
          }
          state["next_package"] = {
              "name": "Duster Eco-G 120 Automatic Cargo and Emissions Gap Review",
              "status": "planned",
              "goal": "Locate exact automatic-specific luggage-volume and petrol CO2 evidence while preserving current unknown states if no authoritative source exists.",
          }
          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python tools/dkb.py project-state --apply
          python tools/dkb.py documentation-baseline --apply

      - name: Capture full discovery
        run: |
          set +e
          python -m unittest discover -s tests -p "test_*.py" -q > "${RUNNER_TEMP}/discovery.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/discovery.log"
          if [ "$status" -ne 0 ]; then
            tail -n 240 "${RUNNER_TEMP}/discovery.log" > .github/duster-auto-homologation-discovery-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/duster-auto-homologation-discovery-error.log
            git commit -m "diagnostic: capture Duster homologation discovery failure"
            git push origin HEAD:${{ github.head_ref }}
          fi
          exit "$status"
