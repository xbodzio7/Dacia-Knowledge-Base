name: AI count Spring white v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/ai-count-spring-white-v2.yml
          git add -A && git commit -m 'ci: remove Spring white v2 counter' && git push origin HEAD:main
          branch=agent/spring-biel-alpejska-default-colour-migration-v2-20260802
          old=7d99eb39ba2c5e7db791d6244ddebd8d5650edf8
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          git merge origin/main --no-edit
          mkdir -p data/imports/configuration_values data/reporting project/packages tests tools
          git show "${old}:data/imports/configuration_values/spring_biel_alpejska_default_colour_20260802.json" > data/imports/configuration_values/spring_biel_alpejska_default_colour_20260802.json
          git show "${old}:tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py" > tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py')
          t=p.read_text(encoding='utf-8').replace('11715','11728')
          t=t.replace('        raise RuntimeError("unexpected verified counts after migration")','        print(json.dumps(report["verified_after_counts"], sort_keys=True))')
          p.write_text(t,encoding='utf-8')
          PY
          out=$(python3 tools/apply_spring_biel_alpejska_default_colour_migration_20260802.py --apply)
          git reset --hard HEAD
          printf '%s\n' "$out" > project/spring-white-v2-counts.txt
          git add project/spring-white-v2-counts.txt
          git commit -m 'diagnostic: capture Spring white v2 verified counts'
          git push origin HEAD:"$branch"
