name: Temporary Spring Reconciliation Refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-spring-reconciliation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.head_ref == 'agent/spring-version-equipment-matrix-availability-20260731'
    runs-on: ubuntu-latest

    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Regenerate data-dependent reconciliation artifact
        shell: bash
        run: |
          set -euo pipefail
          python tools/verified_pdf_candidate_coverage_reconciliation.py
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          state_path = Path("project/state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          expected = sorted([
              "CHANGELOG.md",
              "README.md",
              "data/imports/spring_equipment_availability_20260219.csv",
              "data/master/configuration_attribute_availability.csv",
              "data/master/source_configurations.csv",
              "data/reporting/spring_electric100_automatic_completeness.json",
              "data/reporting/spring_electric70_automatic_completeness.json",
              "data/reporting/verified_pdf_candidate_coverage_reconciliation.json",
              "project/ROADMAP.md",
              "project/SESSION_STATE.md",
              "project/STATE_SUMMARY.md",
              "project/packages/spring-version-equipment-matrix-availability-20260731.md",
              "project/state.json",
              "tests/test_spring_equipment_availability.py",
              "tools/import_spring_equipment_availability.py",
          ])
          state["current_package"]["manifest_paths"] = expected
          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          package_path = Path(
              "project/packages/spring-version-equipment-matrix-availability-20260731.md"
          )
          package = package_path.read_text(encoding="utf-8")
          package = package.replace(
              "The final cumulative diff contains exactly the fourteen package paths declared in `project/state.json`; the temporary workflow, materializer and encoded payload parts are absent.",
              "The final cumulative diff contains exactly the fifteen package paths declared in `project/state.json`; the temporary workflows, materializer and encoded payload parts are absent. The deterministic verified-PDF coverage reconciliation JSON is regenerated because its master-data evidence counts depend on `configuration_attribute_availability.csv`; the Markdown rendering remains byte-identical.",
          )
          if "exactly the fifteen package paths" not in package:
              raise SystemExit("package manifest statement was not updated")
          package_path.write_text(package, encoding="utf-8")
          PY
          python tools/dkb.py project-state --apply

      - name: Verify focused contract and regenerated artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_spring_equipment_availability \
            tests.test_verified_pdf_candidate_coverage_reconciliation \
            -v
          python tools/import_spring_equipment_availability.py --check
          python tools/verified_pdf_candidate_coverage_reconciliation.py --verify
          python tools/validate_dkb.py
          python tools/dkb.py project-state --check

      - name: Commit refreshed final package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -- .github/workflows/temporary-spring-reconciliation-refresh.yml
          git add -- \
            CHANGELOG.md \
            README.md \
            data/imports/spring_equipment_availability_20260219.csv \
            data/master/configuration_attribute_availability.csv \
            data/master/source_configurations.csv \
            data/reporting/spring_electric100_automatic_completeness.json \
            data/reporting/spring_electric70_automatic_completeness.json \
            data/reporting/verified_pdf_candidate_coverage_reconciliation.json \
            project/ROADMAP.md \
            project/SESSION_STATE.md \
            project/STATE_SUMMARY.md \
            project/packages/spring-version-equipment-matrix-availability-20260731.md \
            project/state.json \
            tests/test_spring_equipment_availability.py \
            tools/import_spring_equipment_availability.py

          git diff --cached --quiet && {
            echo "Reconciliation refresh produced no staged changes." >&2
            exit 1
          }
          git commit -m "fix(data): refresh Spring coverage reconciliation"

          python - <<'PY'
          from __future__ import annotations

          import subprocess

          expected = sorted([
              "CHANGELOG.md",
              "README.md",
              "data/imports/spring_equipment_availability_20260219.csv",
              "data/master/configuration_attribute_availability.csv",
              "data/master/source_configurations.csv",
              "data/reporting/spring_electric100_automatic_completeness.json",
              "data/reporting/spring_electric70_automatic_completeness.json",
              "data/reporting/verified_pdf_candidate_coverage_reconciliation.json",
              "project/ROADMAP.md",
              "project/SESSION_STATE.md",
              "project/STATE_SUMMARY.md",
              "project/packages/spring-version-equipment-matrix-availability-20260731.md",
              "project/state.json",
              "tests/test_spring_equipment_availability.py",
              "tools/import_spring_equipment_availability.py",
          ])
          actual = sorted(
              line
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"],
                  text=True,
              ).splitlines()
              if line
          )
          if actual != expected:
              raise SystemExit(
                  "Final package manifest mismatch:\n"
                  f"expected={expected!r}\n"
                  f"actual={actual!r}"
              )
          print(f"Final package manifest verified: {len(actual)} paths.")
          PY

          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
