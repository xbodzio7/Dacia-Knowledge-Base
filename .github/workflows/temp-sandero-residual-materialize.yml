name: Temporary Sandero Residual Closure Materializer

on:
  push:
    branches:
      - data/sandero-residual-source-closure-006
    paths:
      - .github/workflows/temp-sandero-residual-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/sandero-residual-source-closure-006
          fetch-depth: 0
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Apply package and focused validation
        shell: bash
        run: |
          set +e
          export PYTHONPATH="$PWD:$PWD/tools"
          mkdir -p project/tmp/sandero-residual-materialize
          status=0
          python -m tools.import_sandero_residual_source_closure_20260801 > project/tmp/sandero-residual-materialize/materialize.log 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply > project/tmp/sandero-residual-materialize/project-state-apply.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m tools.import_sandero_residual_source_closure_20260801 --check > project/tmp/sandero-residual-materialize/check.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_sandero_residual_source_closure_20260801.py' > project/tmp/sandero-residual-materialize/focused-tests.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py validate > project/tmp/sandero-residual-materialize/validate.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check > project/tmp/sandero-residual-materialize/project-state-check.log 2>&1 || status=$?
          fi
          echo "$status" > project/tmp/sandero-residual-materialize/status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: materialize Sandero residual source closure" || true
          git push origin HEAD:data/sandero-residual-source-closure-006
          exit "$status"
