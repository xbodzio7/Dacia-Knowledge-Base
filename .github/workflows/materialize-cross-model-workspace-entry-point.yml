name: Materialize Cross-Model Workspace Entry Point

on:
  push:
    branches:
      - agent/cross-model-workspace-entry-point

permissions:
  contents: write

concurrency:
  group: materialize-cross-model-workspace-entry-point
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/cross-model-workspace-entry-point
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install PDF backend
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi

      - name: Materialize implementation package
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path.cwd()

          def write(path: str, content: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8", newline="")

          index_path = ROOT / "tools/reporting/data_product_workspace_index.py"
          source = index_path.read_text(encoding="utf-8")
          marker = 'BUNDLE_MANIFEST_MEMBER = (\n    "comparison-bundle/comparison-bundle-manifest.json"\n)\n'
          replacement = marker + 'CROSS_MODEL_HTML_MEMBER = "cross-model/cross-model-comparison-view.html"\n'
          if "CROSS_MODEL_HTML_MEMBER" not in source:
              if marker not in source:
                  raise SystemExit("workspace index constant marker not found")
              source = source.replace(marker, replacement, 1)
          start = source.index("def _primary_links(")
          end = source.index("\n\ndef _asset_links", start)
          primary = '''def _primary_links(
    workspace_root: Path,
    release_members: set[str],
    bundle: Mapping[str, Any],
) -> tuple[dict[str, str], ...]:
    workbook_name = _file_record_path(
        bundle.get("workbook"),
        "comparison bundle workbook",
    )
    links: list[dict[str, str]] = [
        {
            "title": "Configuration shortlist",
            "description": "Browse and filter all released active configurations.",
            "path": _verified_content_path(
                workspace_root,
                release_members,
                "shortlist/configuration-shortlist.html",
                label="shortlist HTML",
            ),
        },
        {
            "title": "Comparison workbook",
            "description": "Open the six-sheet XLSX overview of all release scopes.",
            "path": _verified_bundle_path(
                workspace_root,
                release_members,
                workbook_name,
                label="comparison workbook",
            ),
        },
        {
            "title": "Comparison bundle manifest",
            "description": "Inspect scope groups, counts, artifact paths and hashes.",
            "path": _verified_content_path(
                workspace_root,
                release_members,
                BUNDLE_MANIFEST_MEMBER,
                label="comparison bundle manifest",
            ),
        },
        {
            "title": "Release notes",
            "description": "Read the immutable product inventory and provenance summary.",
            "path": _verified_content_path(
                workspace_root,
                release_members,
                "RELEASE_NOTES.md",
                label="release notes",
            ),
        },
    ]
    if CROSS_MODEL_HTML_MEMBER in release_members:
        links.append(
            {
                "title": "Models and comparison scopes",
