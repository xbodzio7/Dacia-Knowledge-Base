name: AI finalize Spring cable state

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Advance canonical package state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('project/state.json')
          state = json.loads(path.read_text(encoding='utf-8'))
          state['current_package'] = {
              'package_id': 'spring_charging_cable_representation_migration_001',
              'kind': 'bounded_schema_and_data_migration',
              'name': 'Spring Charging Cable Representation Migration',
              'status': 'complete',
              'goal': 'Add two independent boolean charging-cable attributes and import only exact-current configuration-level availability supported by the accepted evidence matrix, while preserving historical commercial records.',
              'manifest_paths': [
                  'data/master/attributes.csv',
                  'data/master/configuration_attribute_availability.csv',
                  'data/imports/configuration_attribute_availability_sources.csv',
                  'data/imports/configuration_attribute_availability_source_links.csv',
                  'project/STATE_SUMMARY.md',
                  'project/state.json',
                  'tests/test_spring_charging_cable_representation_migration_20260802.py',
                  'tests/test_spring_standard_equipment_representation_review_20260802.py',
                  'tools/review_spring_charging_cable_representation_migration_20260802.py',
              ],
          }
          state['next_package'] = {
              'package_id': 'post_spring_charging_cable_priority_selection_001',
              'kind': 'bounded_priority_selection_review',
              'name': 'Post-Spring Charging Cable Priority Selection Review',
              'status': 'planned',
              'goal': 'Select the next evidence-backed bounded package from the repository roadmap after closing the Spring charging-cable migration, without inventing unsupported data work.',
              'manifest_paths': [
                  'project/ROADMAP.md',
                  'project/STATE_SUMMARY.md',
                  'project/state.json',
              ],
          }
          for key in ('updated_at', 'summary', 'candidate_next_work_packages', 'next_work_package', 'context'):
              state.pop(key, None)
          path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python3 tools/dkb.py project-state --apply
          python3 tools/dkb.py project-state --check
          rm .github/workflows/ai-finalize-spring-cable-state.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(project): complete Spring cable migration state'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
