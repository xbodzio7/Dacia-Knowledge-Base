name: Temporary Sandero page 17 range diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-sandero-page17-range-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sandero-page17-power-torque-rpm-ranges-20260731
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Materialize ephemeral data and report focused contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path
          path=Path('data/master/source_configurations.csv')
          with path.open(encoding='utf-8-sig',newline='') as h:
              r=csv.DictReader(h); fields=list(r.fieldnames or []); rows=list(r)
          src='src_pl_sandero_brochure_20260202'
          targets=['sandero_iii_essential_tce100_manual','sandero_iii_expression_tce100_manual','sandero_iii_journey_tce100_manual']
          existing={(x['source_code'],x['configuration_code']) for x in rows}; n=max(int(x['id']) for x in rows)+1
          for code in targets:
              if (src,code) not in existing:
                  item={f:'' for f in fields}; item.update(id=str(n),source_code=src,configuration_code=code,relationship='brochure_technical_data_for',notes='diagnostic'); rows.append(item); n+=1
          with path.open('w',encoding='utf-8',newline='') as h:
              w=csv.DictWriter(h,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/tmp_materialize_sandero_page17_ranges.py > /tmp/materialize.log 2>&1 || true
          echo '=== BASELINE AND FAILURE IDS ==='
          grep -E 'Tests +:|Master rows|Value ranges|Range import specs|^(ERROR|FAIL): ' /tmp/materialize.log | tail -120 || true
          echo '=== RESIDUAL PACKAGE SUMMARIES ==='
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('data/reporting/verified_pdf_candidate_residual_gap_prioritization.json').read_text())
          print(json.dumps(payload['summary'],sort_keys=True))
          wanted={
              ('src_pl_bigster_brochure_20251210','bigster','technical_tables',20),
              ('src_pl_jogger_brochure_20251217','jogger','technical_tables',19),
              ('src_pl_duster_mini_brochure_20251020','duster_iii','technical_tables',20),
              ('src_pl_sandero_brochure_20260202','sandero_iii','technical_tables',17),
          }
          for item in payload['packages']:
              key=(item.get('source_code'),item.get('model_code'),item.get('domain'),item.get('page'))
              if key in wanted:
                  compact={k:item.get(k) for k in ('package_id','priority','source_code','model_code','domain','page','coverage_status','candidate_count','group_candidate_count','chunk_index','chunk_count','evidence_signature_count','evidence_record_count')}
                  compact['first_candidate_id']=(item.get('candidate_ids') or [''])[0]
                  compact['last_candidate_id']=(item.get('candidate_ids') or [''])[-1]
                  print(json.dumps(compact,sort_keys=True))
          PY
          echo '=== EXACT GUARDS ==='
          grep -RInE 'candidate_count[^\n]*(23|16|5)|group_candidate_count[^\n]*69|src_pl_sandero_brochure_20260202[^\n]*4|expected exactly 102 current brochure ranges|len\(self\.ranges\), 102|source relationships differ from imported chassis targets|source relationship counts differ' tools tests | head -240 || true
