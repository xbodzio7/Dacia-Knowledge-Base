name: Temporary Sandero page 17 range diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-sandero-page17-range-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sandero-page17-power-torque-rpm-ranges-20260731
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Materialize ephemeral data and report contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path
          path=Path('data/master/source_configurations.csv')
          with path.open(encoding='utf-8-sig',newline='') as h:
              r=csv.DictReader(h); fields=list(r.fieldnames or []); rows=list(r)
          src='src_pl_sandero_brochure_20260202'
          targets=['sandero_iii_essential_tce100_manual','sandero_iii_expression_tce100_manual','sandero_iii_journey_tce100_manual']
          existing={(x['source_code'],x['configuration_code']) for x in rows}; n=max(int(x['id']) for x in rows)+1
          for code in targets:
              if (src,code) not in existing:
                  item={f:'' for f in fields}; item.update(id=str(n),source_code=src,configuration_code=code,relationship='brochure_technical_data_for',notes='diagnostic'); rows.append(item); n+=1
          with path.open('w',encoding='utf-8',newline='') as h:
              w=csv.DictWriter(h,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/tmp_materialize_sandero_page17_ranges.py > /tmp/materialize.log 2>&1 || true
          echo '=== MATERIALIZE TERMINAL SUMMARY ==='
          tail -45 /tmp/materialize.log
          echo '=== REPORTING SPECS CONTAINING TARGETS ==='
          python - <<'PY'
          import json
          from pathlib import Path
          needles={'sandero_iii_expression_ecog120_manual','sandero_iii_expression_ecog120_automatic','sandero_iii_essential_tce100_manual'}
          for path in sorted(Path('data/reporting').glob('*.json')):
              try: data=json.loads(path.read_text(encoding='utf-8'))
              except Exception: continue
              text=json.dumps(data)
              if any(n in text for n in needles):
                  print('\nFILE',path)
                  print(json.dumps(data,ensure_ascii=False,indent=2)[:10000])
          PY
          echo '=== CURRENT PRIORITIZATION BOUNDARIES ==='
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/reporting/verified_pdf_candidate_residual_gap_prioritization.json').read_text())
          print('SUMMARY',p['summary'])
          for item in p['packages']:
              key=(item.get('source_code'),item.get('model_code'),item.get('domain'),item.get('page'))
              if key in {
                  ('src_pl_bigster_brochure_20251210','bigster','technical_tables',20),
                  ('src_pl_jogger_brochure_20251217','jogger','technical_tables',19),
                  ('src_pl_duster_mini_brochure_20251020','duster_iii','technical_tables',20),
                  ('src_pl_sandero_brochure_20260202','sandero_iii','technical_tables',17),
              }:
                  print(json.dumps(item,ensure_ascii=False,sort_keys=True))
          PY
          echo '=== EXACT CONTRACT LOCATIONS ==='
          grep -RInE 'expected exactly 102 current brochure ranges|len\(self\.ranges\), 102|src_pl_sandero_brochure_20260202.*4|source relationships differ from imported chassis targets|source relationship counts differ|candidate_count.*23|group_candidate_count.*69' tools tests | head -160 || true
