name: Catalog Recovery Diagnostics

on:
  push:
    branches:
      - agent/sandero-stepway-catalog-recovery
    paths:
      - .github/workflows/catalog-recovery.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Build targeted recovery artifacts
        shell: bash
        run: |
          mkdir -p diagnostics/catalog-recovery
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path('.')
          target = root / 'diagnostics/catalog-recovery'

          def read_csv(path: Path) -> tuple[list[str], list[dict[str, str]]]:
              with path.open(encoding='utf-8', newline='') as handle:
                  reader = csv.DictReader(handle)
                  return list(reader.fieldnames or []), list(reader)

          configurations_path = root / 'data/master/configurations.csv'
          configuration_fields, configurations = read_csv(configurations_path)
          selected_configurations = [
              row for row in configurations
              if any(token in ' | '.join(row.values()).lower() for token in ('sandero', 'stepway'))
          ]
          configuration_codes = {
              row.get('code', '') or row.get('configuration_code', '')
              for row in selected_configurations
          }
          configuration_codes.discard('')

          payload: dict[str, object] = {
              'base_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'configuration_fields': configuration_fields,
              'configuration_codes': sorted(configuration_codes),
              'tables': {},
          }

          for path in sorted((root / 'data/master').rglob('*.csv')):
              try:
                  fields, rows = read_csv(path)
              except Exception as exc:
                  payload['tables'][path.as_posix()] = {'error': repr(exc)}
                  continue
              selected: list[dict[str, str]] = []
              for row in rows:
                  values = set(row.values())
                  joined = ' | '.join(row.values()).lower()
                  if values & configuration_codes or 'sandero' in joined or 'stepway' in joined:
                      selected.append(row)
              if selected or path.name in {
                  'configuration_attribute_availability.csv',
                  'configuration_attribute_values.csv',
                  'configuration_attribute_value_ranges.csv',
                  'configuration_cargo_volume_contexts.csv',
                  'configuration_prices.csv',
                  'configurations.csv',
                  'source_configurations.csv',
              }:
                  numeric_ids = []
                  for row in rows:
                      raw = row.get('id', '')
                      if raw.isdigit():
                          numeric_ids.append(int(raw))
                  payload['tables'][path.as_posix()] = {
                      'fields': fields,
                      'row_count': len(rows),
                      'max_numeric_id': max(numeric_ids, default=None),
                      'selected_count': len(selected),
                      'selected_rows': selected,
                  }

          import_specs: dict[str, object] = {}
          for path in sorted((root / 'data/imports').rglob('*')):
              if not path.is_file() or path.suffix.lower() not in {'.json', '.csv', '.md', '.txt'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              lowered = text.lower()
              if 'sandero' in lowered or 'stepway' in lowered:
                  import_specs[path.as_posix()] = text
          payload['import_specs'] = import_specs

          (target / 'key-data.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          source_index = []
          for path in sorted(root.rglob('*.pdf')):
              lowered = path.name.lower()
              if 'sandero' not in lowered and 'stepway' not in lowered:
                  continue
              data = path.read_bytes()
              info = subprocess.run(
                  ['pdfinfo', path.as_posix()],
                  text=True,
                  encoding='utf-8',
                  errors='replace',
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=False,
              ).stdout
              pages = None
              for line in info.splitlines():
                  if line.startswith('Pages:'):
                      pages = int(line.split(':', 1)[1].strip())
              txt = target / f'{path.stem}.txt'
              subprocess.run(['pdftotext', '-layout', path.as_posix(), txt.as_posix()], check=False)
              source_index.append({
                  'path': path.as_posix(),
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'pages': pages,
                  'text_path': txt.as_posix() if txt.exists() else None,
              })
          (target / 'source-index.json').write_text(
              json.dumps(source_index, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          {
            echo '===== ALL REFS ====='
            git for-each-ref --format='%(refname) %(objectname) %(subject)'
            echo
            echo '===== REMOTE HEADS ====='
            git ls-remote --heads origin
            echo
            echo '===== TARGET REMOTE REFLOG ====='
            git reflog show --all --date=iso | grep -E 'sandero-stepway-catalog-completion|catalog-recovery' || true
            echo
            echo '===== UNREACHABLE OBJECTS ====='
            git fsck --full --unreachable --no-reflogs || true
            echo
            echo '===== RECENT ALL-BRANCH GRAPH ====='
            git log --all --decorate --oneline --graph -n 400
          } > diagnostics/catalog-recovery/git-context.txt

      - name: Commit targeted artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/catalog-recovery
          git commit -m "chore(data): refine catalog recovery context"
          git push origin HEAD:agent/sandero-stepway-catalog-recovery
