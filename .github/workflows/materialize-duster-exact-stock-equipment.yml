name: Temporary Duster Exact Stock Equipment Materializer

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: temporary-duster-materializer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install PDF text extraction backend
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
          pdftotext -v

      - name: Reconcile established equipment and package semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/materialize_duster_exact_stock_equipment.py')
          text = path.read_text(encoding='utf-8')

          old_membership = 'missing_components = sorted(attr for attr in memberships[item] if card_status.get(attr) != "standard")'
          new_membership = '''component_aliases = {"passenger_seat_adjustment": "passenger_seat_height_adjustment"}\n            missing_components = sorted(\n                attr for attr in memberships[item]\n                if card_status.get(component_aliases.get(attr, attr)) != "standard"\n            )'''
          if old_membership not in text:
              raise SystemExit('expected package membership validation line not found')
          text = text.replace(old_membership, new_membership)

          old_type = 'if definition is None or definition.get("data_type") != "boolean":\n                raise ContractError(f"inactive or non-boolean equipment attribute: {attribute}")'
          new_type = '''if definition is None or (\n                definition.get("data_type") != "boolean"\n                and attribute not in {"rear_seat_folding"}\n            ):\n                raise ContractError(f"inactive or unsupported equipment attribute: {attribute}")'''
          if old_type not in text:
              raise SystemExit('expected equipment attribute type validation block not found')
          path.write_text(text.replace(old_type, new_type), encoding='utf-8')
          PY

      - name: Materialize package
        run: |
          set +e
          python .github/materialize_duster_exact_stock_equipment.py > "${RUNNER_TEMP}/materializer.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/materializer.log"
          if [ "$status" -ne 0 ]; then
            cp "${RUNNER_TEMP}/materializer.log" .github/duster-materializer-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/duster-materializer-error.log
            git commit -m "diagnostic: capture Duster materializer failure"
            git push origin HEAD:${{ github.head_ref }}
            exit "$status"
          fi

      - name: Update affected regression contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tests/test_configuration_comparison_workbook.py'): (
                  ('"A1:M296"', '"A1:M302"'),
                  ('self.assertEqual(overview["commercial_equipment_as_of"], "2026-07-03")', 'self.assertEqual(overview["commercial_equipment_as_of"], "2026-07-25")'),
              ),
              Path('tests/test_jogger_payload_performance_ranges.py'): (
                  ('self.assertEqual(baseline["tests"], 735)', 'self.assertEqual(baseline["tests"], 743)'),
                  ('self.assertEqual(baseline["rows"], 7813)', 'self.assertEqual(baseline["rows"], 8034)'),
              ),
              Path('tests/test_jogger_wltp_efficiency_ranges.py'): (
                  ('self.assertEqual(baseline["tests"], 735)', 'self.assertEqual(baseline["tests"], 743)'),
                  ('self.assertEqual(baseline["rows"], 7813)', 'self.assertEqual(baseline["rows"], 8034)'),
              ),
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'expected regression contract not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Run package tests
        run: |
          set +e
          python -m unittest -v \
            tests.test_duster_exact_stock_equipment_20260725 \
            tests.test_commercial_items_20260703 \
            tests.test_configuration_comparison_workbook \
            tests.test_jogger_payload_performance_ranges \
            tests.test_jogger_wltp_efficiency_ranges \
            > "${RUNNER_TEMP}/package-tests.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/package-tests.log"
          if [ "$status" -ne 0 ]; then
            tail -n 180 "${RUNNER_TEMP}/package-tests.log" > .github/duster-package-tests-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/duster-package-tests-error.log
            git commit -m "diagnostic: capture Duster package test failure"
            git push origin HEAD:${{ github.head_ref }}
            exit "$status"
          fi

      - name: Run full test discovery
        run: |
          set +e
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -q > "${RUNNER_TEMP}/discovery.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/discovery.log"
          if [ "$status" -ne 0 ]; then
            tail -n 160 "${RUNNER_TEMP}/discovery.log" > .github/duster-discovery-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/duster-discovery-error.log
            git commit -m "diagnostic: capture Duster discovery failure"
            git push origin HEAD:${{ github.head_ref }}
            exit "$status"
          fi

      - name: Run full quality gate
        run: |
          python tools/dkb.py quality \
            --concise \
            --database "${RUNNER_TEMP}/dacia_knowledge_base.sqlite" \
            --log-file "${RUNNER_TEMP}/quality.log" \
            --summary-json "${RUNNER_TEMP}/quality-summary.json"

      - name: Verify canonical project state
        run: python tools/dkb.py project-state --check

      - name: Review generated diff
        run: git status --short && git diff --stat

      - name: Commit materialized package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            CHANGELOG.md \
            data/master/sources.csv \
            data/master/source_models.csv \
            data/master/source_versions.csv \
            data/master/source_configurations.csv \
            data/master/configuration_attribute_availability.csv \
            data/master/commercial_item_configurations.csv \
            project/ROADMAP.md \
            project/SESSION_STATE.md \
            project/STATE_SUMMARY.md \
            project/state.json \
            project/sources/dacia-pl-duster-exact-stock-equipment-20260725.json \
            project/packages/duster-exact-stock-equipment-expansion-20260725.md \
            project/reviews/duster-exact-stock-equipment-review-2026-07-25.md \
            tests/test_commercial_items_20260703.py \
            tests/test_configuration_comparison_workbook.py \
            tests/test_duster_exact_stock_equipment_20260725.py \
            tests/test_jogger_payload_performance_ranges.py \
            tests/test_jogger_wltp_efficiency_ranges.py \
            tools/import_duster_exact_stock_equipment_20260725.py
          git diff --cached --check
          git commit -m "feat(data): expand exact Duster stock equipment"
          git push origin HEAD:${{ github.head_ref }}
