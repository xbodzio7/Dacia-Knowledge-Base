name: Temporary Duster Exact Stock Equipment Materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: temporary-duster-materializer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install PDF text extraction backend
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi

      - name: Finalize materializer contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/materialize_duster_exact_stock_equipment.py')
          text = path.read_text(encoding='utf-8')

          def replace(old: str, new: str, *, required: bool = True) -> None:
              global text
              if old not in text:
                  if required and new not in text:
                      raise SystemExit(f'materializer contract fragment not found: {old[:100]}')
                  return
              text = text.replace(old, new)

          replace(
              'missing_components = sorted(attr for attr in memberships[item] if card_status.get(attr) != "standard")',
              '''component_aliases = {"passenger_seat_adjustment": "passenger_seat_height_adjustment"}\n            missing_components = sorted(\n                attr for attr in memberships[item]\n                if card_status.get(component_aliases.get(attr, attr)) != "standard"\n            )''',
          )
          replace(
              'if definition is None or definition.get("data_type") != "boolean":\n                raise ContractError(f"inactive or non-boolean equipment attribute: {attribute}")',
              '''if definition is None or (\n                definition.get("data_type") != "boolean"\n                and attribute not in {"rear_seat_folding"}\n            ):\n                raise ContractError(f"inactive or unsupported equipment attribute: {attribute}")''',
          )
          replace('src_pl_duster_exact_stock_equipment_20260725', 'src_pl_duster_exact_stock_equipment_20260724')
          replace('dacia-pl-duster-exact-stock-equipment-20260725.json', 'dacia-pl-duster-exact-stock-equipment-20260724.json')
          replace('DATE = "2026-07-25"', 'DATE = "2026-07-24"')
          replace('_exact_stock_20260725', '_exact_stock_20260724')

          replace('"duster_iii_extreme_ecog120_4x2_automatic": 76', '"duster_iii_extreme_ecog120_4x2_automatic": 75')
          replace('"duster_iii_journey_ecog120_4x2_automatic": 75', '"duster_iii_journey_ecog120_4x2_automatic": 74')

          source_anchor = '''    source_codes = {row["code"] for row in read_rows(MASTER / "sources.csv") if row.get("status") == "active"}\n    if PRICE_SOURCE not in source_codes:'''
          source_insert = '''    source_codes = {row["code"] for row in read_rows(MASTER / "sources.csv") if row.get("status") == "active"}\n    prior_exact_availability = {\n        (row["configuration_code"], row["attribute_code"]): row\n        for row in read_rows(MASTER / "configuration_attribute_availability.csv")\n        if row.get("source_code") == "src_pl_duster_ecog120_automatic_stock_20260724"\n    }\n    if PRICE_SOURCE not in source_codes:'''
          replace(source_anchor, source_insert)

          availability_anchor = '''            card_status[attribute] = status\n            counts[config] += 1'''
          availability_insert = '''            card_status[attribute] = status\n            if attribute == "side_mirrors_folding" and config in {\n                "duster_iii_extreme_ecog120_4x2_automatic",\n                "duster_iii_journey_ecog120_4x2_automatic",\n            }:\n                prior = prior_exact_availability.get((config, attribute))\n                if not prior or prior.get("availability_status") != "standard" or prior.get("observation_date") != DATE:\n                    raise ContractError(f"reused exact folding-mirror observation missing: {config}")\n                continue\n            counts[config] += 1'''
          replace(availability_anchor, availability_insert)

          replace('if len(availability) != 205 or dict(statuses_count) != {"standard": 201, "not_available": 4}:', 'if len(availability) != 203 or dict(statuses_count) != {"standard": 199, "not_available": 4}:')
          replace('self.assertEqual(len(self.availability), 205)', 'self.assertEqual(len(self.availability), 203)')
          replace('Counter(row["availability_status"] for row in self.availability), {"standard": 201, "not_available": 4}', 'Counter(row["availability_status"] for row in self.availability), {"standard": 199, "not_available": 4}')

          replace('The package adds 205 dated configuration-level equipment observations:', 'The package adds 203 new dated configuration-level equipment observations:')
          replace('- Extreme automatic — 76 records;', '- Extreme automatic — 75 new records;')
          replace('- Journey automatic — 75 records.', '- Journey automatic — 74 new records.')
          replace('The distribution is 201 `standard` and four explicit `not_available` states.', 'The distribution is 199 `standard` and four explicit `not_available` states. Two standard folding-mirror observations for Extreme and Journey are reused from the immediately preceding exact-stock intake instead of being duplicated on the same observation date.')
          replace('205 datowanych obserwacji wyposażenia', '203 nowe datowane obserwacje wyposażenia')
          replace('with 205 dated equipment observations', 'with 203 new dated equipment observations')
          replace('z 205 obserwacjami', 'z 203 nowymi obserwacjami')
          replace(
              '"Factory antenna type and the conflicting Expression folding-mirror state remain unimported.",',
              '"Factory antenna type and the conflicting Expression folding-mirror state remain unimported.",\n            "Existing exact folding-mirror observations for Extreme and Journey from the 2026-07-24 stock intake are reused rather than duplicated.",',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Materialize package
        run: python .github/materialize_duster_exact_stock_equipment.py

      - name: Synchronize affected regression contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          replacements = {
              Path('tests/test_configuration_comparison_workbook.py'): (
                  ('"A1:M296"', '"A1:M302"'),
                  ('"A1:K7"', '"A1:K9"'),
                  ('self.assertEqual(overview["commercial_equipment_as_of"], "2026-07-03")', 'self.assertEqual(overview["commercial_equipment_as_of"], "2026-07-24")'),
              ),
              Path('tests/test_commercial_items_20260703.py'): (
                  ('STOCK_DATE = "2026-07-25"', 'STOCK_DATE = "2026-07-24"'),
              ),
              Path('tests/test_jogger_payload_performance_ranges.py'): (
                  ('self.assertEqual(baseline["tests"], 735)', 'self.assertEqual(baseline["tests"], 743)'),
                  ('self.assertEqual(baseline["rows"], 7813)', 'self.assertEqual(baseline["rows"], 8032)'),
              ),
              Path('tests/test_jogger_wltp_efficiency_ranges.py'): (
                  ('self.assertEqual(baseline["tests"], 735)', 'self.assertEqual(baseline["tests"], 743)'),
                  ('self.assertEqual(baseline["rows"], 7813)', 'self.assertEqual(baseline["rows"], 8032)'),
              ),
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new, 1)
                  elif new not in text:
                      raise SystemExit(f'expected regression contract not found in {path}: {old}')
              path.write_text(text, encoding='utf-8')

          state_path = Path('project/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['updated_on'] = '2026-07-25'
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python tools/dkb.py project-state --apply
          python tools/dkb.py documentation-baseline --apply

      - name: Run package tests
        run: |
          python -m unittest -v \
            tests.test_duster_exact_stock_equipment_20260725 \
            tests.test_commercial_items_20260703 \
            tests.test_configuration_comparison_workbook \
            tests.test_jogger_payload_performance_ranges \
            tests.test_jogger_wltp_efficiency_ranges

      - name: Run full test discovery
        run: python -m unittest discover -s tests -p "test_*.py" -q

      - name: Run full quality gate
        run: |
          python tools/dkb.py quality \
            --concise \
            --database "${RUNNER_TEMP}/dacia_knowledge_base.sqlite" \
            --log-file "${RUNNER_TEMP}/quality.log" \
            --summary-json "${RUNNER_TEMP}/quality-summary.json"

      - name: Verify canonical state
        run: |
          python tools/dkb.py project-state --check
          python tools/dkb.py documentation-baseline --check

      - name: Commit materialized package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md CHANGELOG.md \
            data/master/sources.csv \
            data/master/source_models.csv \
            data/master/source_versions.csv \
            data/master/source_configurations.csv \
            data/master/configuration_attribute_availability.csv \
            data/master/commercial_item_configurations.csv \
            project/ROADMAP.md \
            project/SESSION_STATE.md \
            project/STATE_SUMMARY.md \
            project/state.json \
            project/sources/dacia-pl-duster-exact-stock-equipment-20260724.json \
            project/packages/duster-exact-stock-equipment-expansion-20260725.md \
            project/reviews/duster-exact-stock-equipment-review-2026-07-25.md \
            tests/test_commercial_items_20260703.py \
            tests/test_configuration_comparison_workbook.py \
            tests/test_duster_exact_stock_equipment_20260725.py \
            tests/test_jogger_payload_performance_ranges.py \
            tests/test_jogger_wltp_efficiency_ranges.py \
            tools/import_duster_exact_stock_equipment_20260725.py
          git diff --cached --check
          git commit -m "feat(data): expand exact Duster stock equipment"
          git push origin HEAD:${{ github.head_ref }}
