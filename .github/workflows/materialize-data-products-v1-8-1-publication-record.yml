              except (OSError, json.JSONDecodeError, PublicationError, ValueError) as exc:
                  print(f"ERROR: {exc}", file=sys.stderr)
                  return 1
              print("PASS: Data Products v1.8.1 publication")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          """)
