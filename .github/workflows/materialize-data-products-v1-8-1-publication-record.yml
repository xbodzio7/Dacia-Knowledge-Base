          import argparse
          import json
          import sys
          from pathlib import Path
          from typing import Any, Mapping, Sequence

          ROOT = Path(__file__).resolve().parents[1]
          PUBLICATION = ROOT / ".github" / "data-products-v1.8.1-publication.json"
