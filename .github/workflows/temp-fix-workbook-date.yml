name: Temporary Fix Workbook Date Contract

on:
  push:
    branches:
      - agent/spring-essential-khaki-price-apply-20260802
    paths:
      - .github/workflows/temp-fix-workbook-date.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-essential-khaki-price-apply-20260802
          fetch-depth: 0

      - name: Update exact commercial cutoff contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_configuration_comparison_workbook.py")
          text = path.read_text(encoding="utf-8")
          old = 'self.assertEqual(overview["commercial_equipment_as_of"], "2026-07-31")'
          new = 'self.assertEqual(overview["commercial_equipment_as_of"], "2026-08-02")'
          if text.count(old) != 1:
              raise SystemExit("expected one stale commercial cutoff assertion")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY

      - name: Run focused workbook regression
        run: python -m unittest -v tests.test_configuration_comparison_workbook

      - name: Commit repaired contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_configuration_comparison_workbook.py
          git commit -m "test: advance commercial equipment cutoff"
          git push origin HEAD:agent/spring-essential-khaki-price-apply-20260802
