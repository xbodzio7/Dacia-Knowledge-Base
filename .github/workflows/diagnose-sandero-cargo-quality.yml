name: Diagnose Sandero Cargo Quality

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/diagnose-sandero-cargo-quality.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/sandero-stepway-brochure-cargo-import
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install PDF backend
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi

      - name: Make gap planning cargo-context aware
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, marker: str) -> None:
              text = path.read_text(encoding="utf-8")
              if marker in text:
                  return
              if old not in text:
                  raise SystemExit(f"patch anchor missing in {path}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          tool = Path("tools/configuration_gap_resolution_plan.py")
          replace_once(
              tool,
              "from typing import Any, Mapping, Sequence\n",
              "from typing import Any, Mapping, Sequence\n\nfrom reporting.cargo_context import context_index, semantic_signature\n",
              "from reporting.cargo_context import context_index, semantic_signature",
          )
          replace_once(
              tool,
              ") -> set[tuple[str, str, str, str]]:\n    result: set[tuple[str, str, str, str]] = set()\n",
              ") -> set[tuple[str, str, str, str, str]]:\n    result: set[tuple[str, str, str, str, str]] = set()\n",
              "set[tuple[str, str, str, str, str]]",
          )
          replace_once(
              tool,
              '''            semantic = (
                  configuration_code,
                  attribute_code,
                  fuel_type_code,
                  observation_date,
              )
          '''.replace("          ", ""),
              '''            semantic = (
                  configuration_code,
                  attribute_code,
                  fuel_type_code,
                  observation_date,
                  "",
              )
          '''.replace("          ", ""),
              'observation_date,\n                "",\n            )',
          )
          replace_once(
              tool,
              '''    values = read_csv(
              master / "configuration_attribute_values.csv",
              "configuration attribute values",
          )
              semantics: dict[
              tuple[str, str, str, str],
              Mapping[str, str],
          ] = {}
          '''.replace("          ", ""),
              '''    context_path = master / "configuration_cargo_volume_contexts.csv"
              cargo_contexts = (
                  context_index(read_csv(context_path, "configuration cargo contexts"))
                  if context_path.is_file()
                  else {}
              )
              values = read_csv(
                  master / "configuration_attribute_values.csv",
                  "configuration attribute values",
              )
              semantics: dict[
                  tuple[str, str, str, str, str],
                  Mapping[str, str],
              ] = {}
          '''.replace("          ", ""),
              "configuration cargo contexts",
          )
          replace_once(
              tool,
              '''        key = (
                  row.get("configuration_code", ""),
                  row.get("attribute_code", ""),
                  row.get("fuel_type_code", ""),
                  row.get("observation_date", ""),
              )
          '''.replace("          ", ""),
              '''        cargo_context = cargo_contexts.get(row.get("code", ""))
              key = (
                  row.get("configuration_code", ""),
                  row.get("attribute_code", ""),
                  row.get("fuel_type_code", ""),
                  row.get("observation_date", ""),
                  semantic_signature(cargo_context) if cargo_context else "",
              )
          '''.replace("          ", ""),
              "semantic_signature(cargo_context) if cargo_context else",
          )
          replace_once(
              tool,
              '''    semantic = (
                  configuration_code,
                  attribute_code,
                  fuel_type_code,
                  observation_date,
              )
              existing = context["values"].get(semantic)
          '''.replace("          ", ""),
              '''    semantic = (
                  configuration_code,
                  attribute_code,
                  fuel_type_code,
                  observation_date,
                  "",
              )
              existing = context["values"].get(semantic)
          '''.replace("          ", ""),
              'observation_date,\n        "",\n    )\n    existing = context["values"]',
          )

          test = Path("tests/test_sandero_stepway_brochure_cargo_20260725.py")
          replace_once(
              test,
              "import sys\nimport unittest\n",
              "import sys\nimport tempfile\nimport unittest\n",
              "import tempfile",
          )
          replace_once(
              test,
              '''        self.assertIn(
                  "PASS: Sandero and Stepway official brochure cargo import contract",
                  completed.stdout,
              )
          '''.replace("          ", ""),
              '''        self.assertIn(
                  "PASS: Sandero and Stepway official brochure cargo import contract",
                  completed.stdout,
              )
              with tempfile.TemporaryDirectory() as directory:
                  plan = subprocess.run(
                      [
                          sys.executable,
                          "tools/dkb.py",
                          "configuration-gap-resolution-plan",
                          "--json",
                          str(Path(directory) / "plan.json"),
                          "--markdown",
                          str(Path(directory) / "plan.md"),
                      ],
                      cwd=ROOT,
                      text=True,
                      capture_output=True,
                      check=False,
                  )
              self.assertEqual(plan.returncode, 0, plan.stdout + plan.stderr)
          '''.replace("          ", ""),
              '"configuration-gap-resolution-plan",',
          )
          PY

      - name: Run and persist quality diagnostics
        run: |
          set +e
          python tools/dkb.py quality \
            --concise \
            --database "${RUNNER_TEMP}/dkb.sqlite" \
            --log-file .github/sandero-quality-diagnostic.log \
            --summary-json .github/sandero-quality-summary.json
          status=$?
          cat .github/sandero-quality-diagnostic.log
          cat .github/sandero-quality-summary.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'fix(reporting): preserve cargo contexts in gap planning'
            git push origin HEAD:agent/sandero-stepway-brochure-cargo-import
          fi
          exit "$status"
