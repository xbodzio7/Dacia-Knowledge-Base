name: Diagnose Sandero Cargo Quality

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/diagnose-sandero-cargo-quality.yml
      - tools/patch_gap_resolution_cargo_context_20260725.py

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/sandero-stepway-brochure-cargo-import
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install PDF backend
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi

      - name: Apply cargo-context gap-planning repair
        run: python tools/patch_gap_resolution_cargo_context_20260725.py

      - name: Run and persist quality diagnostics
        run: |
          set +e
          python tools/dkb.py quality \
            --concise \
            --database "${RUNNER_TEMP}/dkb.sqlite" \
            --log-file .github/sandero-quality-diagnostic.log \
            --summary-json .github/sandero-quality-summary.json
          status=$?
          cat .github/sandero-quality-diagnostic.log
          cat .github/sandero-quality-summary.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'fix(reporting): preserve cargo contexts in gap planning'
            git push origin HEAD:agent/sandero-stepway-brochure-cargo-import
          fi
          exit "$status"
