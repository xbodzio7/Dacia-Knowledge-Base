name: AI sync PR 464 generated docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize generated documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/ai-sync-pr464-generated-docs.yml .github/ai-trigger-pr464-generated-docs.txt
          git add -A
          git commit -m 'ci: remove temporary PR 464 documentation synchronizer'
          git push origin HEAD:main

          git fetch origin agent/post-spring-charging-cable-priority-selection-review-20260802
          git checkout -B agent/post-spring-charging-cable-priority-selection-review-20260802 origin/agent/post-spring-charging-cable-priority-selection-review-20260802
          git merge origin/main --no-edit
          python3 tools/dkb.py project-state --apply
          python3 tools/dkb.py project-state --check
          git add CHANGELOG.md README.md project/ROADMAP.md project/SESSION_STATE.md project/STATE_SUMMARY.md project/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs: synchronize post-Spring priority review state'
          fi
          git push origin HEAD:agent/post-spring-charging-cable-priority-selection-review-20260802
