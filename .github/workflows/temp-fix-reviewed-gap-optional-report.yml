name: Temporary Reviewed Gap Optional Report Fix

on:
  push:
    branches:
      - agent/reviewed-gap-state-materialization-20260802
    paths:
      - .github/workflows/temp-fix-reviewed-gap-optional-report.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Make reviewed report optional for fixture repositories
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/configuration_shortlist.py')
          text = path.read_text(encoding='utf-8')
          old = '''    try:
        payload = json.loads(path.read_text(encoding="utf-8"))
    except (OSError, json.JSONDecodeError) as exc:
        raise ShortlistError(f"cannot read reviewed gap report: {exc}") from exc
'''
          new = '''    try:
        payload = json.loads(path.read_text(encoding="utf-8"))
    except FileNotFoundError:
        return {}
    except (OSError, json.JSONDecodeError) as exc:
        raise ShortlistError(f"cannot read reviewed gap report: {exc}") from exc
'''
          if text.count(old) != 1:
              raise SystemExit('reviewed report loader marker mismatch')
          text = text.replace(old, new, 1)
          old_apply = '''    payload = _read_reviewed_gap_report(repository)
    configurations = catalog.get("configurations")
'''
          new_apply = '''    payload = _read_reviewed_gap_report(repository)
    if not payload:
        return
    configurations = catalog.get("configurations")
'''
          if text.count(old_apply) != 1:
              raise SystemExit('reviewed state apply marker mismatch')
          path.write_text(text.replace(old_apply, new_apply, 1), encoding='utf-8')
          PY
          python -m unittest -q \
            tests.test_configuration_shortlist_html \
            tests.test_reviewed_gap_state_materialization_20260802
      - name: Commit clean fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-fix-reviewed-gap-optional-report.yml
          git add tools/configuration_shortlist.py
          git diff --cached --check
          git commit -m 'fix: tolerate absent reviewed gap report'
          git push
