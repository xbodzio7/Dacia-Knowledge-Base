name: Materialize Brochure Cargo Context Schema

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
    paths:
      - .github/workflows/materialize-brochure-cargo-context-schema.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/brochure-cargo-context-schema-foundation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare deterministic state counters
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/establish_brochure_cargo_context_schema_20260725.py")
          text = path.read_text(encoding="utf-8")
          old = '''    state["updated_on"] = "2026-07-25"
              state["phase"] = "Brochure Cargo Context Schema Foundation"
          '''.replace("              ", "    ")
          new = '''    state["updated_on"] = "2026-07-25"
              state["baseline"]["tests"] = 776
              state["baseline"]["csv_files"] = 46
              state["baseline"]["rows"] = 8156
              state["phase"] = "Brochure Cargo Context Schema Foundation"
          '''.replace("              ", "    ")
          if new not in text:
              if old not in text:
                  raise SystemExit("state counter patch anchor missing")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Materialize schema package
        run: |
          python tools/establish_brochure_cargo_context_schema_20260725.py --apply
          python tools/dkb.py project-state --apply

      - name: Commit materialized package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'feat(schema): establish cargo context foundation'
            git push origin HEAD:agent/brochure-cargo-context-schema-foundation
          fi

      - name: Verify package contract
        run: |
          python tools/establish_brochure_cargo_context_schema_20260725.py --check
          python tools/dkb.py project-state --check

      - name: Run complete test suite
        run: python -m unittest discover -s tests -p 'test_*.py'
