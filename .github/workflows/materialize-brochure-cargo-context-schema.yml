name: Materialize Brochure Cargo Context Schema

on:
  pull_request:
    branches:
      - main
    types:
      - reopened
    paths:
      - .github/workflows/materialize-brochure-cargo-context-schema.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/brochure-cargo-context-schema-foundation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Repair test import and verify package
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_brochure_cargo_context_schema_foundation.py")
          text = path.read_text(encoding="utf-8")
          old = "from tools.reporting.data_dictionary import generate_data_dictionary\n"
          new = '''from importlib.util import module_from_spec, spec_from_file_location

_DATA_DICTIONARY_SPEC = spec_from_file_location(
    "dkb_data_dictionary",
    Path(__file__).resolve().parents[1]
    / "tools"
    / "reporting"
    / "data_dictionary.py",
)
if _DATA_DICTIONARY_SPEC is None or _DATA_DICTIONARY_SPEC.loader is None:
    raise RuntimeError("cannot load data dictionary module")
_DATA_DICTIONARY_MODULE = module_from_spec(_DATA_DICTIONARY_SPEC)
_DATA_DICTIONARY_SPEC.loader.exec_module(_DATA_DICTIONARY_MODULE)
generate_data_dictionary = _DATA_DICTIONARY_MODULE.generate_data_dictionary
'''
          if new not in text:
              if old not in text:
                  raise SystemExit("data dictionary import patch anchor missing")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          rm -f .github/cargo-schema-diagnostic.log
          set +e
          : > .github/cargo-schema-diagnostic.log
          python tools/establish_brochure_cargo_context_schema_20260725.py --apply >> .github/cargo-schema-diagnostic.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --apply >> .github/cargo-schema-diagnostic.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/establish_brochure_cargo_context_schema_20260725.py --check >> .github/cargo-schema-diagnostic.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/dkb.py project-state --check >> .github/cargo-schema-diagnostic.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m unittest discover -s tests -p 'test_*.py' >> .github/cargo-schema-diagnostic.log 2>&1
            status=$?
          fi
          cat .github/cargo-schema-diagnostic.log

          if [ "$status" -eq 0 ]; then
            rm -f .github/cargo-schema-diagnostic.log
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'test(schema): verify cargo context foundation'
            git push origin HEAD:agent/brochure-cargo-context-schema-foundation
          fi
          exit "$status"
