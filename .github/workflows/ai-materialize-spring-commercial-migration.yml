name: AI materialize Spring commercial migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/ai-materialize-spring-commercial-migration.yml
          git add -A
          git commit -m 'ci: remove Spring commercial materializer'
          git push origin HEAD:main

          git fetch origin agent/spring-charging-cable-commercial-semantics-migration-20260802
          git checkout -B agent/spring-charging-cable-commercial-semantics-migration-20260802 origin/agent/spring-charging-cable-commercial-semantics-migration-20260802
          git merge origin/main --no-edit
          rm -f project/spring-commercial-migration-diagnostic.txt

          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path('.')
          def read(path):
              with path.open(encoding='utf-8', newline='') as f: return list(csv.DictReader(f))
          def write(path, rows, fields):
              with path.open('w', encoding='utf-8', newline='') as f:
                  w=csv.DictWriter(f, fieldnames=fields, lineterminator='\n'); w.writeheader(); w.writerows(rows)

          p=root/'data/master/commercial_items.csv'; rows=read(p)
          if not any(r['code']=='spring_domestic_socket_charging_cable_option' for r in rows):
              rows.append({'id':str(max(map(lambda r:int(r['id']),rows))+1),'code':'spring_domestic_socket_charging_cable_option','name':'Przewód do ładowania z gniazdka domowego','item_type':'option','observation_date':'2026-08-02','source_code':'src_pl_spring_commercial_context_20260802','status':'active','notes':'Exact-current separate domestic-socket charging cable option; Expression applicability remains unresolved.'})
          write(p,rows,['id','code','name','item_type','observation_date','source_code','status','notes'])

          p=root/'data/master/commercial_item_attributes.csv'; rows=read(p)
          for r in rows:
              if r['commercial_item_code']=='spring_type2_charging_cable_option':
                  r['code']='spring_type2_charging_cable_option__type2_charging_cable_supplied'; r['attribute_code']='type2_charging_cable_supplied'; r['notes']='Corrected membership: the brochure item describes a physical Type 2 cable, not the vehicle charging connector.'
          if not any(r['commercial_item_code']=='spring_domestic_socket_charging_cable_option' for r in rows):
              rows.append({'id':str(max(map(lambda r:int(r['id']),rows))+1),'code':'spring_domestic_socket_charging_cable_option__domestic_socket_charging_cable','commercial_item_code':'spring_domestic_socket_charging_cable_option','attribute_code':'domestic_socket_charging_cable','source_text':'Przewód do ładowania z gniazdka domowego','notes':'Separate from the supplied Type 2 cable and from the vehicle connector standard.'})
          write(p,rows,['id','code','commercial_item_code','attribute_code','source_text','notes'])

          p=root/'data/master/commercial_item_configurations.csv'; rows=read(p); nxt=max(map(lambda r:int(r['id']),rows))+1
          for cfg,label in [('spring_essential_electric70_automatic','Essential 70'),('spring_extreme_electric100_automatic','Extreme 100')]:
              code=f'spring_domestic_socket_charging_cable_option__{cfg}'
              if not any(r['code']==code for r in rows):
                  rows.append({'id':str(nxt),'code':code,'commercial_item_code':'spring_domestic_socket_charging_cable_option','configuration_code':cfg,'availability_status':'optional','amount':'1500','currency_code':'PLN','price_date':'2026-08-02','source_code':'src_pl_spring_commercial_context_20260802','notes':f'Exact-current {label} option state. No mapping is inferred for Spring Expression.'}); nxt+=1
          write(p,rows,['id','code','commercial_item_code','configuration_code','availability_status','amount','currency_code','price_date','source_code','notes'])

          report={'version':1,'generated_on':'2026-08-02','status':'complete','package_id':'spring_charging_cable_commercial_semantics_migration_001','type2_membership':{'commercial_item_code':'spring_type2_charging_cable_option','attribute_code':'type2_charging_cable_supplied','historical_mapping_count_preserved':3},'domestic_socket_item':{'commercial_item_code':'spring_domestic_socket_charging_cable_option','attribute_code':'domestic_socket_charging_cable','mapping_count':2,'amount_pln':1500,'mapped_configurations':['spring_essential_electric70_automatic','spring_extreme_electric100_automatic'],'unresolved_configurations':['spring_expression_electric70_automatic']},'master_data_delta':{'commercial_items':1,'commercial_item_attributes':1,'commercial_item_configurations':2,'net_master_rows':3,'historical_type2_mappings_changed':0}}
          (root/'data/reporting/spring_charging_cable_commercial_semantics_migration.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'data/reporting/spring_charging_cable_commercial_semantics_migration.md').write_text('# Spring Charging-Cable Commercial Semantics Migration\n\n- corrected the historical Type 2 item membership to `type2_charging_cable_supplied`;\n- preserved all three brochure-backed historical option mappings;\n- added a separate domestic-socket cable option;\n- added exact 1500 PLN optional mappings for Essential 70 and Extreme 100;\n- created no Expression mapping.\n',encoding='utf-8')
          (root/'project/packages/spring-charging-cable-commercial-semantics-migration-20260802.md').write_text('# Spring Charging-Cable Commercial Semantics Migration\n\nPackage: `spring_charging_cable_commercial_semantics_migration_001`\n\nStatus: complete\n\nThe package applies the accepted commercial semantics decision with a net three-row master-data increase and preserves historical Type 2 configuration mappings.\n',encoding='utf-8')

          s=root/'project/state.json'; state=json.loads(s.read_text(encoding='utf-8')); state['phase']='Spring Charging Cable Commercial Semantics Migration'; state['baseline']['rows']=11726
          state['current_package']={'package_id':'spring_charging_cable_commercial_semantics_migration_001','kind':'bounded_commercial_data_migration','name':'Spring Charging Cable Commercial Semantics Migration','status':'complete','goal':'Materialize the accepted Type 2 membership correction and exact-current domestic-socket commercial item without rewriting historical mappings.','manifest_paths':['data/master/commercial_items.csv','data/master/commercial_item_attributes.csv','data/master/commercial_item_configurations.csv','data/reporting/spring_charging_cable_commercial_semantics_migration.json','data/reporting/spring_charging_cable_commercial_semantics_migration.md','project/STATE_SUMMARY.md','project/state.json','tests/test_spring_charging_cable_commercial_semantics_migration_20260802.py']}
          state['next_package']={'package_id':'post_spring_charging_cable_priority_selection_review_001','kind':'bounded_priority_selection_review','name':'Post-Spring Charging Cable Priority Selection Review','status':'planned','goal':'Select the next bounded repository package from current evidence and unresolved queues without changing master data.','manifest_paths':['project/state.json','project/STATE_SUMMARY.md','data/reporting/']}
          s.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          cat > tests/test_spring_charging_cable_commercial_semantics_migration_20260802.py <<'PYTEST'
          import csv
          import unittest
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]
          def rows(path):
              with (ROOT/path).open(encoding='utf-8',newline='') as f:return list(csv.DictReader(f))
          class SpringChargingCableCommercialSemanticsMigrationTests(unittest.TestCase):
              def test_type2_membership_and_history(self):
                  memberships=rows('data/master/commercial_item_attributes.csv'); row=next(r for r in memberships if r['commercial_item_code']=='spring_type2_charging_cable_option'); self.assertEqual(row['attribute_code'],'type2_charging_cable_supplied')
                  mappings=[r for r in rows('data/master/commercial_item_configurations.csv') if r['commercial_item_code']=='spring_type2_charging_cable_option']; self.assertEqual(len(mappings),3); self.assertTrue(all(r['availability_status']=='optional' and r['source_code']=='src_pl_spring_brochure_20260219' for r in mappings))
              def test_domestic_socket_exact_boundary(self):
                  items={r['code']:r for r in rows('data/master/commercial_items.csv')}; self.assertIn('spring_domestic_socket_charging_cable_option',items)
                  memberships={r['commercial_item_code']:r for r in rows('data/master/commercial_item_attributes.csv')}; self.assertEqual(memberships['spring_domestic_socket_charging_cable_option']['attribute_code'],'domestic_socket_charging_cable')
                  mappings=[r for r in rows('data/master/commercial_item_configurations.csv') if r['commercial_item_code']=='spring_domestic_socket_charging_cable_option']; self.assertEqual({r['configuration_code'] for r in mappings},{'spring_essential_electric70_automatic','spring_extreme_electric100_automatic'}); self.assertTrue(all(r['availability_status']=='optional' and r['amount']=='1500' and r['currency_code']=='PLN' and r['price_date']=='2026-08-02' and r['source_code']=='src_pl_spring_commercial_context_20260802' for r in mappings))
          if __name__=='__main__':unittest.main()
          PYTEST

          python3 tools/dkb.py project-state --apply
          python3 -m compileall -q tests
          python3 -m unittest tests.test_spring_charging_cable_commercial_semantics_migration_20260802 -q
          git add -A
          git commit -m 'data: migrate Spring charging cable commercial semantics'
          git push origin HEAD:agent/spring-charging-cable-commercial-semantics-migration-20260802
