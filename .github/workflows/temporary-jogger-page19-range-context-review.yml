name: Temporary Jogger page 19 range context review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/jogger-page19-range-context-review-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/jogger-page19-range-context-review-20260730
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Materialize and validate review
        run: python tools/temporary_materialize_jogger_page19_range_context_review.py
      - name: Commit final package and remove temporary tools
        run: |
          rm .github/workflows/temporary-jogger-page19-range-context-review.yml
          rm tools/temporary_materialize_jogger_page19_range_context_review.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/reporting/jogger_page19_range_context_follow_up_review.json \
            data/reporting/jogger_page19_range_context_follow_up_review.md \
            project/reviews/jogger-page19-range-context-follow-up-review-2026-07-30.md \
            project/state.json project/STATE_SUMMARY.md \
            .github/workflows/temporary-jogger-page19-range-context-review.yml \
            tools/temporary_materialize_jogger_page19_range_context_review.py
          git commit -m "docs(jogger): close page 19 range context review"
          git push origin HEAD:agent/jogger-page19-range-context-review-20260730
