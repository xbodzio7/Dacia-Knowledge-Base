name: Temporary Portfolio Family Release Integration Applicator

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  placeholder:
    runs-on: ubuntu-latest
    steps:
      - name: Package applicator payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = '* Integrated the verified portfolio model-family JSON, Markdown and HTML summary into deterministic versioned data-product archives and offline navigation without changing source data or comparison semantics.'
          if entry not in text:
              marker = '### Added\n'
              if marker not in text:
                  raise SystemExit('CHANGELOG Added marker missing')
              changelog.write_text(text.replace(marker, marker + '\n' + entry + '\n', 1), encoding='utf-8')

          roadmap = Path('project/ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          receipt = '\n## Portfolio model-family release integration\n\nThe verified family-summary JSON, Markdown and HTML are integrated into new deterministic release archives. The next package prepares immutable Data Products v1.12.0 assets.\n'
          if '## Portfolio model-family release integration' not in text:
              roadmap.write_text(text.rstrip() + receipt, encoding='utf-8')

          session = Path('project/SESSION_STATE.md')
          text = session.read_text(encoding='utf-8')
          receipt = '\n## Current continuation point\n\n`data_products_v1_12_0_accelerated_release_preparation_001` — prepare and verify immutable v1.12.0 assets containing the integrated portfolio model-family summary.\n'
          if '`data_products_v1_12_0_accelerated_release_preparation_001`' not in text:
              session.write_text(text.rstrip() + receipt, encoding='utf-8')
          PY
          python tools/dkb.py project-state --apply
          python tools/dkb.py documentation-baseline --apply
          python tools/generate_portfolio_model_family_summary_release_integration_20260803.py --verify
          python -m unittest -q tests.test_portfolio_model_family_release_integration
          python tools/dkb.py project-state --check
          rm -f .github/workflows/temporary-portfolio-family-release-integration-applicator.yml
          rm -rf project/diagnostics
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'reporting: integrate model-family summary into releases'
          git push origin HEAD:agent/portfolio-model-family-summary-release-integration-001
