name: Temporary Portfolio Family Release Integration Applicator

on:
  push:
    branches:
      - agent/portfolio-model-family-summary-release-integration-001
    paths:
      - ".github/workflows/temporary-portfolio-family-release-integration-applicator.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/portfolio-model-family-summary-release-integration-001
          fetch-depth: 1
          persist-credentials: true
      - name: Apply and verify release integration
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_portfolio_model_family_summary_release_integration_20260803.py
          python tools/generate_portfolio_model_family_summary_release_integration_20260803.py --apply
          python tools/dkb.py project-state --apply
          python tools/dkb.py documentation-baseline --apply
          python tools/generate_portfolio_model_family_summary_release_integration_20260803.py --verify
          python -m unittest -q \
            tests.test_portfolio_model_family_summary_release_integration \
            tests.test_data_product_release \
            tests.test_data_product_release_download
          python tools/dkb.py project-state --check
          python tools/dkb.py data-product-release \
            --output-directory /tmp/family-integration-release \
            --version 1.2.3 \
            --commit-sha 1111111111111111111111111111111111111111
          python tools/dkb.py data-product-release \
            --output-directory /tmp/family-integration-release \
            --verify \
            --version 1.2.3 \
            --commit-sha 1111111111111111111111111111111111111111
          rm -f .github/workflows/temporary-portfolio-family-release-integration-applicator.yml
          rm -f .github/workflows/temporary-family-integration-diagnostic.yml
          rm -f .github/workflows/temporary-main-family-integration-applicator.yml
          rm -rf project/diagnostics
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'reporting: integrate model-family summary into releases'
          git push origin HEAD:agent/portfolio-model-family-summary-release-integration-001
