          workspace_path = 'tools/reporting/data_product_workspace_index.py'
          replace_once(
              workspace_path,
              '''CROSS_MODEL_HTML_MEMBER = "cross-model/cross-model-comparison-view.html"
          SCOPE_PATTERN = re.compile''',
              '''CROSS_MODEL_HTML_MEMBER = "cross-model/cross-model-comparison-view.html"
          MODEL_FAMILY_HTML_MEMBER = (
