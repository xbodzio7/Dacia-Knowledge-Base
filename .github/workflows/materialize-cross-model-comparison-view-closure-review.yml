name: Materialize Cross-Model Comparison View Closure Review

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/materialize-cross-model-comparison-view-closure-review.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out closure branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/cross-model-comparison-view-closure-review
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install PDF backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Synchronize and verify closure
        run: |
          set -euo pipefail
          python tools/dkb.py project-state --apply
          python tools/review_cross_model_comparison_view_closure_20260726.py --check
          python -m unittest tests.test_cross_model_comparison_view_closure_review
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/dkb.py validate
          python tools/dkb.py project-state --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md project/ROADMAP.md \
            project/SESSION_STATE.md project/STATE_SUMMARY.md project/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs(report): materialize cross-model view closure'
            git push origin HEAD:agent/cross-model-comparison-view-closure-review
          fi
