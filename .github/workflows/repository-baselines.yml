name: Repository Baselines

on:
  pull_request:
  push:
    branches:
      - main
      - "dev/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-baselines-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  project-state:
    name: Repository state / project-state --check
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Run fail-fast package data preflight
        run: python tools/dkb.py package-preflight

      - name: Check canonical project state
        run: python tools/dkb.py project-state --check

      - name: Check generated documentation in the same required gate
        run: python tools/dkb.py documentation-baseline --check
 
  documentation-baseline:
    name: Generated documentation / documentation-baseline --check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Check generated documentation baseline
        run: python tools/dkb.py documentation-baseline --check

  governance-audit:
    name: Repository governance / main workflow integrity
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Audit trusted main-branch workflow and repository configuration
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          github-token: ${{ github.token }}
          script: |
            if (context.ref !== "refs/heads/main" ||
                !["push", "workflow_dispatch"].includes(context.eventName)) {
              throw new Error("Governance audit is restricted to trusted main-branch push or dispatch events.");
            }
            const { owner, repo } = context.repo;
            const ref = context.sha;
            async function readText(path) {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref });
              const file = response.data;
              if (Array.isArray(file) || file.type !== "file" || !file.content) {
                throw new Error(`Cannot read trusted main-branch file: ${path}`);
              }
              return Buffer.from(file.content, "base64").toString("utf8");
            }
            const paths = [
              ".github/workflows/quality.yml",
              ".github/workflows/repository-baselines.yml",
              ".github/workflows/baseline-repair.yml"
            ];
            const workflow = {};
            for (const path of paths) {
              const content = await readText(path);
              workflow[path] = content;
              const unpinned = [...content.matchAll(/^\\s*uses:\\s*([^\\s#]+)/gm)]
                .map(match => match[1])
                .filter(action => !action.startsWith("./") && !action.startsWith("docker://"))
                .filter(action => !/^[0-9a-f]{40}$/.test(action.slice(action.lastIndexOf("@") + 1)));
              if (unpinned.length) throw new Error(`${path} has non-SHA-pinned actions: ${unpinned.join(", ")}`);
            }
            for (const path of paths.slice(0, 2)) {
              if (!/^  pull_request:\\s*$/m.test(workflow[path]) ||
                  /^  pull_request_target:\\s*$/m.test(workflow[path])) {
                throw new Error(`${path} must validate PRs only through the unprivileged pull_request event.`);
              }
            }
            const stateResponse = await github.rest.repos.getContent({
              owner, repo, path: "project/state.json", ref
            });
            const state = JSON.parse(Buffer.from(stateResponse.data.content, "base64").toString("utf8"));
            const expected = [
              "Python 3.14",
              "Repository state / project-state --check",
              "Python 3.10",
              "Python 3.13",
              "Package workflow / Windows",
              "Generated documentation / documentation-baseline --check"
            ].sort();
            const declared = [...(state.review_policy?.required_status_checks || [])].sort();
            if (JSON.stringify(declared) !== JSON.stringify(expected)) {
              throw new Error("Canonical state no longer declares the exact six owner-required checks.");
            }
            const contracts = [
              [workflow[paths[0]], [
                "name: Python ${{ matrix.python-version }}",
                "name: Package workflow / Windows",
                '- "3.10"', '- "3.13"', '- "3.14"'
              ]],
              [workflow[paths[1]], [
                "name: Repository state / project-state --check",
                "name: Generated documentation / documentation-baseline --check"
              ]]
            ];
            for (const [content, markers] of contracts) {
              for (const marker of markers) {
                if (!content.includes(marker)) throw new Error(`Missing required check contract marker: ${marker}`);
              }
            }
            const { data: settings } = await github.rest.repos.get({ owner, repo });
            const expectedSettings = {
              allow_squash_merge: true,
              allow_merge_commit: true,
              allow_rebase_merge: true,
              allow_auto_merge: false,
              delete_branch_on_merge: false
            };
            for (const [key, value] of Object.entries(expectedSettings)) {
              if (settings[key] !== value) {
                throw new Error(`Repository setting drift: ${key} expected ${value}, received ${settings[key]}.`);
              }
            }
            if (settings.allow_update_branch === undefined) {
              core.notice("The GitHub Actions REST response omits allow_update_branch; do not infer drift from an absent field.");
            } else if (settings.allow_update_branch !== true) {
              throw new Error("Repository setting drift: allow_update_branch must be enabled.");
            }
            core.notice(`Trusted main-branch workflow integrity PASS at ${ref}; PR execution uses unprivileged pull_request only.`);
