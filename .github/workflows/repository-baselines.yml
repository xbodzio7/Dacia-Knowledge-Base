name: Repository Baselines

on:
  pull_request:
  push:
    branches:
      - main
      - "dev/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open same-repository PR number to repair"
        required: true
        type: number
      expected_head_sha:
        description: "Exact current 40-character PR head SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: repository-baselines-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-state:
    name: Repository state / project-state --check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Run fail-fast package data preflight
        run: python tools/dkb.py package-preflight

      - name: Check canonical project state
        run: python tools/dkb.py project-state --check

      - name: Check generated documentation in the same required gate
        run: python tools/dkb.py documentation-baseline --check

  documentation-baseline:
    name: Generated documentation / documentation-baseline --check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Check generated documentation baseline
        run: python tools/dkb.py documentation-baseline --check

  generate-baseline-repair:
    name: Generate canonical baseline repair (read-only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branch: ${{ steps.verify.outputs.branch }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
    steps:
      - name: Verify exact open same-repository PR head
        id: verify
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const number = Number(context.payload.inputs.pr_number);
            const expected = String(context.payload.inputs.expected_head_sha || "");
            if (!Number.isInteger(number) || number < 1 || !/^[0-9a-f]{40}$/.test(expected)) {
              throw new Error("Provide a valid PR number and exact 40-character lowercase head SHA.");
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: number
            });
            if (pr.state !== "open" || pr.base.ref !== "main") {
              throw new Error("Target must be an open PR against main.");
            }
            if (!pr.head.repo || pr.head.repo.full_name.toLowerCase() !== `${context.repo.owner}/${context.repo.repo}`.toLowerCase()) {
              throw new Error("Fork PRs are not eligible for a write-back repair.");
            }
            if (pr.head.sha !== expected) {
              throw new Error(`Stale SHA: supplied ${expected}, current PR head is ${pr.head.sha}.`);
            }
            core.setOutput("branch", pr.head.ref);
            core.setOutput("head_sha", pr.head.sha);
      - name: Check out the verified immutable PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.verify.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Apply canonical project-state generator
        env:
          DKB_EXPECTED_REPOSITORY: ${{ github.repository }}
          DKB_EXPECTED_DEFAULT_BRANCH: main
          DKB_EXPECTED_BASE_BRANCH: main
        run: python tools/dkb.py project-state --apply
      - name: Apply canonical documentation baseline generator
        run: python tools/dkb.py documentation-baseline --apply
      - name: Recheck both generated baselines
        env:
          DKB_EXPECTED_REPOSITORY: ${{ github.repository }}
          DKB_EXPECTED_DEFAULT_BRANCH: main
          DKB_EXPECTED_BASE_BRANCH: main
        run: |
          python tools/dkb.py project-state --check
          python tools/dkb.py documentation-baseline --check
      - name: Reject unexpected generated paths
        shell: bash
        run: |
          set -euo pipefail
          allowed=$'CHANGELOG.md\nREADME.md\nproject/ROADMAP.md\nproject/SESSION_STATE.md\nproject/state.json\nproject/STATE_SUMMARY.md'
          changed="$(git status --short --untracked-files=all | sed -E 's/^...//')"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            grep -Fqx -- "$path" <<< "$allowed" || {
              echo "Unexpected generated path: $path" >&2
              exit 1
            }
          done <<< "$changed"
          [[ -n "$changed" ]] || {
            echo "No baseline changes were generated; nothing to repair."
            exit 1
          }
      - name: Upload only allowlisted generated files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: canonical-baseline-repair
          path: |
            CHANGELOG.md
            README.md
            project/ROADMAP.md
            project/SESSION_STATE.md
            project/state.json
            project/STATE_SUMMARY.md
          if-no-files-found: error
          retention-days: 1

  commit-baseline-repair:
    name: Commit allowlisted generated files to the same PR
    if: github.event_name == 'workflow_dispatch'
    needs: generate-baseline-repair
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Download generated artifact (never execute its contents)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: canonical-baseline-repair
          path: baseline-output
      - name: Revalidate PR head and commit only allowlisted text files
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.generate-baseline-repair.outputs.head_sha }}
          EXPECTED_BRANCH: ${{ needs.generate-baseline-repair.outputs.branch }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const number = Number(process.env.PR_NUMBER);
            const expected = process.env.EXPECTED_HEAD_SHA;
            const expectedBranch = process.env.EXPECTED_BRANCH;
            const allowed = [
              "CHANGELOG.md",
              "README.md",
              "project/ROADMAP.md",
              "project/SESSION_STATE.md",
              "project/state.json",
              "project/STATE_SUMMARY.md"
            ];
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: number
            });
            if (pr.state !== "open" || pr.base.ref !== "main" ||
                !pr.head.repo || pr.head.repo.full_name.toLowerCase() !== `${context.repo.owner}/${context.repo.repo}`.toLowerCase() ||
                pr.head.ref !== expectedBranch || pr.head.sha !== expected) {
              throw new Error("PR changed or is no longer eligible; refusing write-back.");
            }
            const root = path.resolve("baseline-output");
            const entries = [];
            for (const relative of allowed) {
              const file = path.resolve(root, relative);
              if (!file.startsWith(root + path.sep) || !fs.existsSync(file) || !fs.lstatSync(file).isFile()) {
                throw new Error(`Missing or unsafe generated file: ${relative}`);
              }
              const stat = fs.statSync(file);
              if (stat.size > 2 * 1024 * 1024) {
                throw new Error(`Generated file exceeds 2 MiB: ${relative}`);
              }
              const content = fs.readFileSync(file, "utf8");
              const blob = await github.rest.git.createBlob({
                owner: context.repo.owner, repo: context.repo.repo,
                content, encoding: "utf-8"
              });
              entries.push({ path: relative, mode: "100644", type: "blob", sha: blob.data.sha });
            }
            const base = await github.rest.git.getCommit({
              owner: context.repo.owner, repo: context.repo.repo, commit_sha: expected
            });
            const tree = await github.rest.git.createTree({
              owner: context.repo.owner, repo: context.repo.repo,
              base_tree: base.data.tree.sha, tree: entries
            });
            if (tree.data.sha === base.data.tree.sha) {
              core.info("Generated files already match the PR head; no commit needed.");
              return;
            }
            const commit = await github.rest.git.createCommit({
              owner: context.repo.owner, repo: context.repo.repo,
              message: "docs: synchronize canonical repository baselines",
              tree: tree.data.sha, parents: [expected]
            });
            await github.rest.git.updateRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `heads/${expectedBranch}`, sha: commit.data.sha, force: false
            });
            core.notice(`Committed generated baselines as ${commit.data.sha}`);
