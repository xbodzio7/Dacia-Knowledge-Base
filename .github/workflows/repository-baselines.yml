name: Repository Baselines

on:
  pull_request:
  push:
    branches:
      - main
      - "dev/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-baselines-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-state:
    name: Repository state / project-state --check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Check canonical project state
        run: python tools/dkb.py project-state --check

  documentation-baseline:
    name: Generated documentation / documentation-baseline --check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Check generated documentation baseline
        run: python tools/dkb.py documentation-baseline --check
