name: Diagnose equipment facet v3

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'fix/equipment-facet-interaction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/equipment-facet-interaction
      - name: Reproduce and capture validation
        shell: bash
        run: |
          set +e
          python project/tmp/materialize_equipment_facet_fix.py >apply.txt 2>&1
          echo $? >apply.exit
          rm -f .github/workflows/materialize-equipment-facet-interaction-fix.yml
          rm -f .github/workflows/materialize-equipment-facet-interaction-fix-pr.yml
          rm -f .github/workflows/materialize-equipment-facet-interaction-fix-v2.yml
          rm -f .github/workflows/materialize-equipment-facet-interaction-fix-v3.yml
          rm -f .github/workflows/diagnose-equipment-facet-materializer.yml
          rm -f .github/workflows/diagnose-equipment-facet-v3.yml
          rm -f project/tmp/materialize_equipment_facet_fix.py
          rm -f project/tmp/please-ignore.txt project/tmp/ignore-marker-*.txt
          python tools/dkb.py project-state --apply >state-apply.txt 2>&1
          echo $? >state-apply.exit
          git diff --check >diff-check.txt 2>&1
          echo $? >diff-check.exit
          python tools/dkb.py project-state --check >state-check.txt 2>&1
          echo $? >state-check.exit
          python -m unittest discover -s tests -p 'test_*.py' >tests.txt 2>&1
          echo $? >tests.exit
          git add -A
          git diff --cached --check >cached-diff-check.txt 2>&1
          echo $? >cached-diff-check.exit
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit --dry-run -m "fix(ui): make equipment facets monotonic and searchable" >commit-dry-run.txt 2>&1
          echo $? >commit-dry-run.exit
          git status --short >status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: equipment-facet-v3-diagnostic
          path: |
            apply.txt
            apply.exit
            state-apply.txt
            state-apply.exit
            diff-check.txt
            diff-check.exit
            state-check.txt
            state-check.exit
            tests.txt
            tests.exit
            cached-diff-check.txt
            cached-diff-check.exit
            commit-dry-run.txt
            commit-dry-run.exit
            status.txt
          retention-days: 1
