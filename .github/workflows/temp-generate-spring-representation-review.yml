name: Temporary Generate Spring Representation Review

on:
  push:
    branches:
      - agent/spring-standard-equipment-representation-review-20260802
    paths:
      - .github/workflows/temp-generate-spring-representation-review.yml
      - tools/review_spring_standard_equipment_representation_20260802.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-standard-equipment-representation-review-20260802
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate and verify review
        run: |
          python tools/review_spring_standard_equipment_representation_20260802.py --apply
          python tools/review_spring_standard_equipment_representation_20260802.py --verify

      - name: Commit deterministic reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/reporting/spring_standard_equipment_representation_review.json \
            data/reporting/spring_standard_equipment_representation_review.md
          git commit -m "report: review Spring equipment representations"
          git push origin HEAD:agent/spring-standard-equipment-representation-review-20260802

# Trigger regeneration after workflow registration.
