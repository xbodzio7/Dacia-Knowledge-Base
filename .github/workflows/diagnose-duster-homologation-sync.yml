name: Temporary Duster Homologation Sync Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Materialize homologation data
        run: python tools/import_duster_ecog120_automatic_homologation_20260725.py --apply

      - name: Verify synchronized test contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          expectations = {
              Path("tests/test_duster_ecog120_automatic_stock_20260724.py"): (
                  'self.assertEqual(report["scope"]["technical_slots"], 29)',
                  'self.assertEqual(report["technical"]["present"], 87)',
              ),
              Path("tests/test_duster_ecog120_automatic_homologation_20260725.py"): (
                  'self.assertEqual(state["baseline"]["tests"], 752)',
              ),
              Path("tests/test_jogger_payload_performance_ranges.py"): (
                  'self.assertEqual(baseline["tests"], 752)',
                  'self.assertEqual(baseline["rows"], 8126)',
              ),
              Path("tests/test_jogger_wltp_efficiency_ranges.py"): (
                  'self.assertEqual(baseline["tests"], 752)',
                  'self.assertEqual(baseline["rows"], 8126)',
              ),
          }
          for path, needles in expectations.items():
              text = path.read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"missing contract in {path}: {needle}")
          PY

      - name: Write package state fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("project/state.json")
          state = json.loads(path.read_text(encoding="utf-8"))
          state["updated_on"] = "2026-07-25"
          state["phase"] = "Duster Eco-G 120 Automatic Homologation Evidence"
          state["current_package"] = {
              "name": "Duster Eco-G 120 Automatic Homologation Evidence",
              "status": "complete",
              "goal": "Import exact automatic-specific power, torque, performance, WLTP, mass and towing evidence for the 2026 Duster Eco-G 120 Expression, Extreme and Journey configurations without inheriting manual cargo values.",
          }
          state["next_package"] = {
              "name": "Duster Eco-G 120 Automatic Cargo and Emissions Gap Review",
              "status": "planned",
              "goal": "Locate exact automatic-specific luggage-volume and petrol CO2 evidence while preserving current unknown states if no authoritative source exists.",
          }
          path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Verify narrative anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = {
              Path("README.md"): "Najnowsze rozszerzenie dokładnych konfiguracji Dustera zapisuje 203 nowe datowane obserwacje wyposażenia",
              Path("CHANGELOG.md"): "* Expanded the three exact Duster Eco-G 120 automatic stock configurations with 203 new dated equipment observations",
              Path("project/ROADMAP.md"): "- dokładne wyposażenie trzech automatów Duster Eco-G 120 z 203 nowymi obserwacjami",
          }
          for path, needle in checks.items():
              if needle not in path.read_text(encoding="utf-8"):
                  raise SystemExit(f"missing narrative anchor: {path}")
          PY

      - name: Apply canonical project state
        run: python tools/dkb.py project-state --apply

      - name: Apply documentation baseline
        run: python tools/dkb.py documentation-baseline --apply
