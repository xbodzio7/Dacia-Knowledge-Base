name: AI integrate Dacia configurator PDF archive

on:
  push:
    branches:
      - ai/dacia-configurator-pdf-archive-20260809
    paths:
      - .github/workflows/ai-integrate-dacia-configurator-pdf-archive.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/dacia-configurator-pdf-archive-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Align current provenance contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, minimum: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} occurrence(s) of {old!r}, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: {old!r} -> {new!r} ({count})')

          # Current source-coverage product: 35 + 70 exact native PDFs = 105 used sources;
          # 284 + 70 exact documents relations = 354 active relationships.
          replace('tools/reporting/portfolio_source_coverage_matrix.py', 'if active_relationship_count != 284:', 'if active_relationship_count != 354:')
          replace('tools/reporting/portfolio_source_coverage_matrix.py', '"expected 284 active source-to-configuration relationships, "', '"expected 354 active source-to-configuration relationships, "')
          replace('tools/reporting/portfolio_source_coverage_matrix.py', 'if len(relations_by_source) != 35:', 'if len(relations_by_source) != 105:')
          replace('tools/reporting/portfolio_source_coverage_matrix.py', 'f"expected 35 used provenance sources, found {len(relations_by_source)}"', 'f"expected 105 used provenance sources, found {len(relations_by_source)}"')
          replace('tools/reporting/portfolio_source_coverage_matrix.py', 'if sum(record["relationship_count"] for record in records) != 284:', 'if sum(record["relationship_count"] for record in records) != 354:')
          replace('tools/reporting/portfolio_source_coverage_matrix.py', '"source rows do not preserve all 284 relationships exactly once"', '"source rows do not preserve all 354 relationships exactly once"')

          replace('tests/source_matrix_checks.py', '"provenance_source_count": 35', '"provenance_source_count": 105')
          replace('tests/source_matrix_checks.py', '"source_configuration_relationship_count": 284', '"source_configuration_relationship_count": 354')
          replace('tests/source_matrix_checks.py', 'testcase.assertEqual(len(records), 35)', 'testcase.assertEqual(len(records), 105)')
          replace('tests/source_matrix_checks.py', 'testcase.assertEqual(relationship_total, 284)', 'testcase.assertEqual(relationship_total, 354)')
          replace('tests/source_matrix_checks.py', 'testcase.assertEqual(len(csv_rows), 35)', 'testcase.assertEqual(len(csv_rows), 105)')
          replace('tests/source_matrix_checks.py', '        284,\n    )\n    lowered = html_text.lower()', '        354,\n    )\n    lowered = html_text.lower()')
          replace('tests/source_matrix_checks.py', 'html_text.count("<tr>"), 36', 'html_text.count("<tr>"), 106')
          replace('tests/source_matrix_checks.py', 'html_text.count("SHA-256 "), 35', 'html_text.count("SHA-256 "), 105')

          replace('tests/version_matrix_checks.py', '"provenance_source_count": 35', '"provenance_source_count": 105')
          replace('tests/version_matrix_checks.py', '"source_configuration_relationship_count": 284', '"source_configuration_relationship_count": 354')
          replace('tests/version_matrix_checks.py', 'testcase.assertEqual(relation_total, 284)', 'testcase.assertEqual(relation_total, 354)')

          # Current model-family contracts. Historical release-note prose remains untouched.
          replace('tests/test_portfolio_model_family_summary.py', '"provenance_source_count": 35', '"provenance_source_count": 105')
          replace('tests/test_portfolio_model_family_summary.py', '"source_configuration_relationship_count": 284', '"source_configuration_relationship_count": 354')
          replace('tests/test_portfolio_model_family_summary.py', '"sandero_iii": (10, 43, "2026-02-02", "2026-08-09")', '"sandero_iii": (17, 50, "2026-02-02", "2026-08-09")')
          replace('tests/test_portfolio_model_family_summary.py', '"sandero_stepway_iii": (13, 52, "2026-02-02", "2026-08-09")', '"sandero_stepway_iii": (21, 60, "2026-02-02", "2026-08-09")')
          replace('tests/test_portfolio_model_family_summary.py', '"jogger": (4, 88, "2025-12-17", "2026-07-24")', '"jogger": (26, 110, "2025-12-17", "2026-08-09")')
          replace('tests/test_portfolio_model_family_summary.py', '"duster_iii": (8, 65, "2025-10-20", "2026-07-25")', '"duster_iii": (24, 81, "2025-10-20", "2026-08-09")')
          replace('tests/test_portfolio_model_family_summary.py', '"bigster": (2, 28, "2025-12-10", "2026-07-03")', '"bigster": (16, 42, "2025-12-10", "2026-08-09")')
          replace('tests/test_portfolio_model_family_summary.py', '"spring": (4, 8, "2026-02-19", "2026-08-02")', '"spring": (7, 11, "2026-02-19", "2026-08-09")')
          replace('tests/test_portfolio_model_family_summary.py', 'self.assertEqual(matrix_relationship_total, 284)', 'self.assertEqual(matrix_relationship_total, 354)')
          replace('tests/test_portfolio_model_family_summary.py', 'self.assertEqual(relation_total, 284)', 'self.assertEqual(relation_total, 354)')
          replace('tests/test_portfolio_model_family_summary.py', 'self.assertEqual(len(used_sources), 35)', 'self.assertEqual(len(used_sources), 105)')

          replace('tools/reporting/portfolio_model_family_release_integration.py', '"source_configuration_relationship_count": 284,', '"source_configuration_relationship_count": 354,')
          replace('tools/reporting/portfolio_model_family_comparison_release_integration.py', '"provenance_source_count": 35,', '"provenance_source_count": 105,')
          replace('tools/reporting/portfolio_model_family_comparison_release_integration.py', '"source_configuration_relationship_count": 284,', '"source_configuration_relationship_count": 354,')
          replace('tools/reporting/portfolio_model_version_comparison_release_integration.py', '"provenance_source_count": 35,', '"provenance_source_count": 105,')
          replace('tools/reporting/portfolio_model_version_comparison_release_integration.py', '"source_configuration_relationship_count": 284,', '"source_configuration_relationship_count": 354,')
          replace('tools/reporting/portfolio_model_version_comparison_release_integration.py', 'if relationship_count != 284:', 'if relationship_count != 354:')
          replace('tools/reporting/portfolio_source_coverage_matrix_release_integration.py', '"provenance_source_count": 35,', '"provenance_source_count": 105,')
          replace('tools/reporting/portfolio_source_coverage_matrix_release_integration.py', '"source_configuration_relationship_count": 284,', '"source_configuration_relationship_count": 354,')
          replace('tools/reporting/portfolio_source_coverage_matrix_release_integration.py', 'if not isinstance(sources, list) or len(sources) != 35:', 'if not isinstance(sources, list) or len(sources) != 105:')
          replace('tools/reporting/portfolio_source_coverage_matrix_release_integration.py', '"portfolio source coverage matrix must contain 35 source rows"', '"portfolio source coverage matrix must contain 105 source rows"')
          replace('tools/reporting/portfolio_source_coverage_matrix_release_integration.py', 'if relationship_count != 284:', 'if relationship_count != 354:')

          # Release-integration tests validate current generated products; immutable
          # historical release-note prose is not modified.
          replace('tests/test_portfolio_model_family_release_integration.py', 'version_summary["provenance_source_count"], 35', 'version_summary["provenance_source_count"], 105')
          replace('tests/test_portfolio_model_family_release_integration.py', '            284,\n        )\n\n        self.assertEqual(source_matrix["kind"]', '            354,\n        )\n\n        self.assertEqual(source_matrix["kind"]')
          replace('tests/test_portfolio_model_family_release_integration.py', '"provenance_source_count": 35,', '"provenance_source_count": 105,')
          replace('tests/test_portfolio_model_family_release_integration.py', '"source_configuration_relationship_count": 284,', '"source_configuration_relationship_count": 354,')
          replace('tests/test_portfolio_model_family_release_integration.py', 'self.assertEqual(len(source_rows), 35)', 'self.assertEqual(len(source_rows), 105)')
          replace('tests/test_portfolio_model_family_release_integration.py', 'self.assertEqual(len({row["source_code"] for row in source_rows}), 35)', 'self.assertEqual(len({row["source_code"] for row in source_rows}), 105)')
          replace('tests/test_portfolio_model_family_release_integration.py', 'sum(row["relationship_count"] for row in source_rows),\n            284,', 'sum(row["relationship_count"] for row in source_rows),\n            354,')
          replace('tests/test_portfolio_model_family_release_integration.py', 'self.assertEqual(source_html.count("<tr>"), 36)', 'self.assertEqual(source_html.count("<tr>"), 106)')
          PY
      - name: Regenerate current provenance products
        shell: bash
        run: |
          set -euo pipefail
          python tools/portfolio_model_family_summary.py \
            --json data/reporting/portfolio_model_family_summary.json \
            --markdown data/reporting/portfolio_model_family_summary.md \
            --html data/reporting/portfolio_model_family_summary.html
          python tools/portfolio_model_family_comparison_matrix.py \
            --json data/reporting/portfolio_model_family_comparison_matrix.json \
            --csv data/reporting/portfolio_model_family_comparison_matrix.csv \
            --html data/reporting/portfolio_model_family_comparison_matrix.html
          python tools/portfolio_model_version_comparison_matrix.py \
            --json data/reporting/portfolio_model_version_comparison_matrix.json \
            --csv data/reporting/portfolio_model_version_comparison_matrix.csv \
            --html data/reporting/portfolio_model_version_comparison_matrix.html
          python tools/portfolio_source_coverage_matrix.py \
            --json data/reporting/portfolio_source_coverage_matrix.json \
            --csv data/reporting/portfolio_source_coverage_matrix.csv \
            --html data/reporting/portfolio_source_coverage_matrix.html
          python tools/dkb.py documentation-baseline --apply
          python tools/dkb.py project-state --apply
      - name: Run focused archive and provenance tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -q \
            tests.test_dacia_configurator_native_pdf_archive \
            tests.test_portfolio_model_family_summary \
            tests.test_portfolio_model_family_release_integration \
            tests.test_portfolio_source_coverage_matrix \
            tests.test_portfolio_model_version_comparison_matrix
      - name: Commit integrated archive state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/ai-integrate-dacia-configurator-pdf-archive.yml
          if ! git diff --cached --quiet; then
            git commit -m "test(source): integrate configurator PDF provenance"
            git push origin HEAD:ai/dacia-configurator-pdf-archive-20260809
          fi
      - name: Run full unit suite
        run: python -m unittest discover -s tests -p "test_*.py" -q
