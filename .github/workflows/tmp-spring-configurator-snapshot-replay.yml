name: Temporary Spring Configurator Snapshot Replay

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  replay:
    if: github.head_ref == 'agent/spring-official-configurator-snapshot-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: agent/spring-official-configurator-snapshot-20260731
          fetch-depth: 0

      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Replay corrected materializer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path

          import yaml

          original = Path('.github/workflows/tmp-spring-configurator-snapshot-materialization.yml')
          replay = Path('.github/workflows/tmp-spring-configurator-snapshot-replay.yml')
          workflow = yaml.safe_load(original.read_text(encoding='utf-8'))
          script = workflow['jobs']['materialize']['steps'][1]['run']
          script = script.replace('"imported": false', '"imported": False')
          script = script.replace('"catalog_price_pln": null', '"catalog_price_pln": None')
          script = script.replace('"registration_only": true', '"registration_only": True')
          replay.unlink()
          subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
          PY
