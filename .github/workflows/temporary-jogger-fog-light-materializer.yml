name: Temporary Jogger Fog-Light Materializer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-jogger-fog-light-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/jogger-my26-fog-light-superseding-observations-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Apply reviewed dated observations
        shell: bash
        run: |
          set -euo pipefail
          python tools/import_jogger_fog_light_superseding_observations.py --apply
          python tools/verified_pdf_candidate_coverage_reconciliation.py

          python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          state_path = Path("project/state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          state["phase"] = "Jogger MY26 Fog-Light Superseding Observations"
          state["current_package"] = {
              "package_id": "jogger_my26_fog_light_superseding_observations_001",
              "kind": "equipment_availability_import",
              "name": "Jogger MY26 Fog-Light Superseding Observations",
              "status": "complete",
              "goal": "Append six direct July 2026 not-available fog-light observations for the six existing Jogger Expression configurations while preserving the six April 2026 standard observations and using the source-faithful generic fog_lights attribute.",
              "manifest_paths": [],
          }
          state["next_package"] = {
              "package_id": "bigster_my26_exact_paint_options_001",
              "kind": "commercial_catalog_import",
              "name": "Bigster MY26 Exact Paint Options",
              "status": "planned",
              "goal": "Import only exact fixed-price Bigster MY26 paint and two-tone commercial options for existing configurations, preserving grade applicability and avoiding named-colour or price-range inference.",
              "manifest_paths": [
                  "CHANGELOG.md",
                  "README.md",
                  "data/imports/bigster_exact_paint_options_20260703.csv",
                  "data/master/commercial_items.csv",
                  "data/master/commercial_item_attributes.csv",
                  "data/master/commercial_item_configurations.csv",
                  "project/STATE_SUMMARY.md",
                  "project/packages/bigster-my26-exact-paint-options-20260731.md",
                  "project/state.json",
                  "tests/test_bigster_exact_paint_options.py",
                  "tools/import_bigster_exact_paint_options.py",
              ],
          }
          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          anchor = (
              "pojedyncza wartość koloru konfiguracji nie jest wymyślana.\n"
          )
          addition = anchor + (
              "\nDwa cenniki Joggera MY26 zachowują jawną zmianę wyposażenia wersji\n"
              "Expression: na stronie 5 źródła z 1 kwietnia 2026 r. światła\n"
              "przeciwmgłowe są seryjne, a na stronie 4 źródła z 3 lipca 2026 r.\n"
              "są niedostępne. Sześć lipcowych obserwacji `fog_lights=not_available`\n"
              "uzupełnia sześć istniejących rekordów kwietniowych bez ich usuwania.\n"
              "Użyto ogólnego atrybutu `fog_lights`, ponieważ źródło nie mówi, że są\n"
              "to światła przednie. Nie dodano modeli, wersji ani konfiguracji.\n"
          )
          if addition not in readme:
              if anchor not in readme:
                  raise SystemExit("Jogger README anchor not found")
              readme_path.write_text(readme.replace(anchor, addition, 1), encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "### Added\n\n"
          bullet = (
              "* Added six direct July 2026 Jogger Expression `fog_lights=not_available` observations from the exact page-4 matrix, preserving the six existing April 2026 standard observations, both source hashes, all exact seat-count and powertrain relationships, and no new model, version, configuration or front/rear reinterpretation.\n"
          )
          if bullet not in changelog:
              if marker not in changelog:
                  raise SystemExit("CHANGELOG Added marker not found")
              changelog_path.write_text(changelog.replace(marker, marker + bullet, 1), encoding="utf-8")

          temporary_paths = {
              ".github/workflows/temporary-jogger-fog-light-extraction.yml",
              ".github/workflows/temporary-jogger-fog-light-materializer.yml",
          }

          def changed_paths() -> list[str]:
              committed = set(
                  line
                  for line in subprocess.check_output(
                      ["git", "diff", "--name-only", "origin/main...HEAD"],
                      text=True,
                  ).splitlines()
                  if line
              )
              working = set(
                  line
                  for line in subprocess.check_output(
                      ["git", "diff", "--name-only"],
                      text=True,
                  ).splitlines()
                  if line
              )
              return sorted((committed | working) - temporary_paths)

          state["current_package"]["manifest_paths"] = changed_paths()
          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          python tools/dkb.py project-state --apply

          python - <<'PY'
          from __future__ import annotations
          import json
          import subprocess
          from pathlib import Path

          temporary_paths = {
              ".github/workflows/temporary-jogger-fog-light-extraction.yml",
              ".github/workflows/temporary-jogger-fog-light-materializer.yml",
          }
          committed = set(
              line for line in subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
              ).splitlines() if line
          )
          working = set(
              line for line in subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines() if line
          )
          expected = sorted((committed | working) - temporary_paths)
          state_path = Path("project/state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          if state["current_package"]["manifest_paths"] != expected:
              state["current_package"]["manifest_paths"] = expected
              state_path.write_text(
                  json.dumps(state, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY
          python tools/dkb.py project-state --apply

      - name: Verify full package contract
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_jogger_fog_light_superseding_observations \
            tests.test_verified_pdf_candidate_coverage_reconciliation \
            -v
          python tools/import_jogger_fog_light_superseding_observations.py --check
          python tools/verified_pdf_candidate_coverage_reconciliation.py --verify
          python tools/validate_dkb.py
          python tools/dkb.py project-state --check

      - name: Commit final package and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm --ignore-unmatch -- \
            .github/workflows/temporary-jogger-fog-light-extraction.yml \
            .github/workflows/temporary-jogger-fog-light-materializer.yml
          git add -A
          git commit -m "feat(data): add Jogger fog-light superseding observations"

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          state = json.loads(Path("project/state.json").read_text(encoding="utf-8"))
          expected = sorted(state["current_package"]["manifest_paths"])
          actual = sorted(
              line
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"],
                  text=True,
              ).splitlines()
              if line
          )
          if actual != expected:
              raise SystemExit(
                  f"Final manifest mismatch:\nexpected={expected!r}\nactual={actual!r}"
              )
          print(f"Final package manifest verified: {len(actual)} paths.")
          PY

          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
