name: Temporary Publish Data Products v1.10.0

on:
  push:
    branches:
      - main
    paths:
      - "project/packages/data-products-v1.10.0-accelerated-release-preparation-20260801.md"

permissions:
  contents: write

concurrency:
  group: publish-data-products-v1-10-0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Verify release is absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view data-products-v1.10.0 >/dev/null 2>&1; then
            echo "Release already exists; refusing to rewrite it."
            exit 1
          fi
          if git rev-parse data-products-v1.10.0 >/dev/null 2>&1; then
            echo "Tag already exists; refusing to rewrite it."
            exit 1
          fi

      - name: Run focused release and interface contracts
        run: |
          python -m unittest -q \
            tests.test_data_products_v1_10_0_release_contract \
            tests.test_configuration_comparison_sticky_offset \
            tests.test_configuration_selection_export \
            tests.test_configuration_shortlist_html \
            tests.test_data_product_release
          python tools/dkb.py project-state --check

      - name: Build exact assets twice
        run: |
          python tools/dkb.py data-product-release \
            --output-directory "${RUNNER_TEMP}/release-a" \
            --version 1.10.0 \
            --commit-sha "${GITHUB_SHA}"
          python tools/dkb.py data-product-release \
            --output-directory "${RUNNER_TEMP}/release-b" \
            --version 1.10.0 \
            --commit-sha "${GITHUB_SHA}"
          diff -qr "${RUNNER_TEMP}/release-a" "${RUNNER_TEMP}/release-b"

      - name: Verify assets and offline workspace
        run: |
          python tools/dkb.py data-product-release \
            --output-directory "${RUNNER_TEMP}/release-a" \
            --verify
          mkdir "${RUNNER_TEMP}/workspace"
          unzip -q \
            "${RUNNER_TEMP}/release-a/dacia-knowledge-base-data-products-v1.10.0.zip" \
            -d "${RUNNER_TEMP}/workspace"
          python tools/dkb.py data-product-workspace-verify \
            --workspace-directory "${RUNNER_TEMP}/workspace" \
            --json
          unzip -p \
            "${RUNNER_TEMP}/release-a/dacia-knowledge-base-data-products-v1.10.0.zip" \
            RELEASE_NOTES.md > "${RUNNER_TEMP}/release-notes.md"

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create data-products-v1.10.0 \
            "${RUNNER_TEMP}/release-a/dacia-knowledge-base-data-products-v1.10.0.zip" \
            "${RUNNER_TEMP}/release-a/data-product-release-manifest.json" \
            "${RUNNER_TEMP}/release-a/SHA256SUMS" \
            --target "${GITHUB_SHA}" \
            --title "Dacia Knowledge Base Data Products v1.10.0" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
          gh release view data-products-v1.10.0 --json databaseId -q '.databaseId' \
            > "${RUNNER_TEMP}/release-id.txt"

      - name: Verify public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "${RUNNER_TEMP}/public"
          gh release download data-products-v1.10.0 \
            --dir "${RUNNER_TEMP}/public"
          diff -q \
            "${RUNNER_TEMP}/release-a/dacia-knowledge-base-data-products-v1.10.0.zip" \
            "${RUNNER_TEMP}/public/dacia-knowledge-base-data-products-v1.10.0.zip"
          diff -q \
            "${RUNNER_TEMP}/release-a/data-product-release-manifest.json" \
            "${RUNNER_TEMP}/public/data-product-release-manifest.json"
          diff -q \
            "${RUNNER_TEMP}/release-a/SHA256SUMS" \
            "${RUNNER_TEMP}/public/SHA256SUMS"

      - name: Record publication
        env:
          RELEASE_DIR: ${{ runner.temp }}/release-a
          RELEASE_ID_FILE: ${{ runner.temp }}/release-id.txt
          SOURCE_SHA: ${{ github.sha }}
        run: |
          export RELEASE_ID="$(cat "${RELEASE_ID_FILE}")"
          python tools/record_data_products_v1_10_0_publication_20260801.py
          python tools/dkb.py project-state --apply
          rm tools/record_data_products_v1_10_0_publication_20260801.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/reporting/data_products_v1_10_0_publication.json \
            project/STATE_SUMMARY.md \
            project/packages/data-products-v1.10.0-publication-20260801.md \
            project/state.json \
            README.md \
            CHANGELOG.md \
            project/ROADMAP.md \
            project/SESSION_STATE.md \
            tools/record_data_products_v1_10_0_publication_20260801.py
          git commit -m "release(data-products): record v1.10.0 publication"
          git push origin HEAD:main
