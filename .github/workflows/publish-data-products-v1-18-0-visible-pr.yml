name: Data Products v1.18.0 Visible PR Publisher

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  publish-data-products-v1-18-0:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/data-products-v1-18-0-visible-trigger-003' &&
      github.event.pull_request.base.sha == 'a13587ff0bf9d683d7a450f0fbb15aa610693f03'
    concurrency:
      group: publish-data-products-v1-18-0
      cancel-in-progress: false
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact publication source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Publish and record Data Products v1.18.0
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_SOURCE_SHA: ${{ github.event.pull_request.base.sha }}
          PUBLICATION_PR: ${{ github.event.pull_request.number }}
        run: bash tools/publish_data_products_v1_18_0_20260805.sh
