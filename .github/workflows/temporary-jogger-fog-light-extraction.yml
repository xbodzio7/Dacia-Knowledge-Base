name: Temporary Jogger Fog-Light Extraction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    if: github.head_ref == 'agent/jogger-my26-fog-light-superseding-observations-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install renderer
        run: python -m pip install --disable-pip-version-check pypdfium2==4.30.0 Pillow==11.3.0
      - name: Verify and render exact equipment pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import pypdfium2 as pdfium

          sources = [
              (
                  Path('PDF/Cenniki/DACIA JOGGER cennik MY26 20260401.pdf'),
                  'a03bb2de2cdadd51223e7d1a50aee898729172f39953bf2bfc946613d6e30d7b',
                  'april',
              ),
              (
                  Path('PDF/Cenniki/DACIA JOGGER cennik MY26 20260703.pdf'),
                  '92606411c4d8c10dd830b0d1c387fe663c4c9618422c5db639c13a23138f4a87',
                  'july',
              ),
          ]
          output = Path('rendered-jogger-fog-pages')
          output.mkdir(parents=True, exist_ok=True)
          for path, expected, label in sources:
              actual = sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{label} SHA mismatch: {actual}')
              document = pdfium.PdfDocument(path)
              print(label, 'pages', len(document), 'sha', actual)
              for page_number in range(2, min(len(document), 6) + 1):
                  page = document[page_number - 1]
                  image = page.render(scale=220 / 72).to_pil()
                  destination = output / f'{label}-page-{page_number}.png'
                  image.save(destination)
                  print(destination, image.size)
          PY
      - name: Upload rendered pages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.2.0
        with:
          name: jogger-fog-light-source-pages
          path: rendered-jogger-fog-pages/*.png
          if-no-files-found: error
          retention-days: 1
