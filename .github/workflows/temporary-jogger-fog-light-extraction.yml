name: Temporary Jogger Fog-Light Extraction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  extract:
    if: github.head_ref == 'agent/jogger-my26-fog-light-superseding-observations-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Verify source
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          path = Path('PDF/Cenniki/DACIA JOGGER cennik MY26 20260703.pdf')
          expected = '92606411c4d8c10dd830b0d1c387fe663c4c9618422c5db639c13a23138f4a87'
          actual = sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA mismatch: {actual}')
          print(f'SOURCE_SHA256={actual}')
          PY
      - name: Render image-only table pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rendered-jogger-pages
          pdf='PDF/Cenniki/DACIA JOGGER cennik MY26 20260703.pdf'
          pdftoppm -png -r 220 -f 3 -l 4 "$pdf" rendered-jogger-pages/page >/dev/null
          pdftoppm -png -r 220 -f 6 -l 6 "$pdf" rendered-jogger-pages/page6 >/dev/null
          ls -lh rendered-jogger-pages
      - name: Upload rendered pages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.2.0
        with:
          name: jogger-price-list-rendered-pages
          path: rendered-jogger-pages/*.png
          if-no-files-found: error
          retention-days: 1
