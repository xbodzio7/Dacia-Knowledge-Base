name: Temporary Jogger Fog-Light Extraction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/jogger-my26-fog-light-superseding-observations-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Verify complete dated contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          from pathlib import Path

          root = Path('.')
          configurations = {
              'jogger_expression_5seat_ecog120_manual',
              'jogger_expression_5seat_tce110_manual',
              'jogger_expression_5seat_hybrid155_automatic',
              'jogger_expression_7seat_ecog120_manual',
              'jogger_expression_7seat_tce110_manual',
              'jogger_expression_7seat_hybrid155_automatic',
          }
          sources = {
              'src_pl_jogger_price_my26_20260401': (
                  root / 'PDF/Cenniki/DACIA JOGGER cennik MY26 20260401.pdf',
                  'a03bb2de2cdadd51223e7d1a50aee898729172f39953bf2bfc946613d6e30d7b',
              ),
              'src_pl_jogger_price_my26_20260703': (
                  root / 'PDF/Cenniki/DACIA JOGGER cennik MY26 20260703.pdf',
                  '92606411c4d8c10dd830b0d1c387fe663c4c9618422c5db639c13a23138f4a87',
              ),
          }

          def rows(path: str):
              with (root / path).open(encoding='utf-8-sig', newline='') as handle:
                  return list(csv.DictReader(handle))

          for code, (path, expected) in sources.items():
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{code} SHA mismatch: {actual}')
              print('SOURCE', code, path, actual)

          attributes = {row['code']: row for row in rows('data/master/attributes.csv')}
          print('FOG_ATTRIBUTE', attributes['fog_lights'])
          for code in ('fog_lights', 'fog_lights_front', 'fog_lights_rear'):
              matching = [
                  row for row in rows('data/master/configuration_attribute_availability.csv')
                  if row['attribute_code'] == code
              ]
              print('EXISTING_ATTRIBUTE_ROWS', code, len(matching))

          links = rows('data/master/source_configurations.csv')
          for source_code in sources:
              selected = [
                  row for row in links
                  if row['source_code'] == source_code
                  and row['configuration_code'] in configurations
              ]
              print('SOURCE_LINKS', source_code, len(selected))
              for row in selected:
                  print(row)

          availability = rows('data/master/configuration_attribute_availability.csv')
          print('MAX_AVAILABILITY_ID', max(int(row['id']) for row in availability))
          existing = [
              row for row in availability
              if row['configuration_code'] in configurations
              and row['attribute_code'] == 'fog_lights'
          ]
          print('EXISTING_TARGET_HISTORY', len(existing))
          for row in existing:
              print(row)
          PY
