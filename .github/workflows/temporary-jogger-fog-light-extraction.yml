name: Temporary Jogger Fog-Light Extraction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/jogger-my26-fog-light-superseding-observations-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Locate canonical fog-light semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import unicodedata
          from pathlib import Path

          root = Path('.')

          def rows(path: str):
              with (root / path).open(encoding='utf-8-sig', newline='') as handle:
                  reader = csv.DictReader(handle)
                  print('HEADER', path, reader.fieldnames)
                  return list(reader)

          def key(value: str) -> str:
              text = unicodedata.normalize('NFKD', value).casefold().replace('ł', 'l')
              return ''.join(ch for ch in text if not unicodedata.combining(ch))

          attributes = rows('data/master/attributes.csv')
          print('ATTRIBUTE_MATCHES')
          for row in attributes:
              joined = key(' '.join(row.values()))
              if 'fog' in joined or 'mgiel' in joined or 'przeciw' in joined:
                  print(row)

          spec_path = 'data/imports/jogger_equipment_availability_comfort_20260401.csv'
          spec = rows(spec_path)
          print('APRIL_SPEC_MATCHES')
          for row in spec:
              joined = key(' '.join(row.values()))
              if 'fog' in joined or 'mgiel' in joined or 'przeciw' in joined:
                  print(row)

          availability = rows('data/master/configuration_attribute_availability.csv')
          candidate_codes = {
              row.get('attribute_code', '')
              for row in spec
              if 'fog' in key(' '.join(row.values()))
              or 'mgiel' in key(' '.join(row.values()))
              or 'przeciw' in key(' '.join(row.values()))
          }
          print('CANDIDATE_CODES', sorted(candidate_codes))
          for code in sorted(candidate_codes):
              matching = [row for row in availability if row['attribute_code'] == code]
              print('AVAILABILITY', code, len(matching))
              for row in matching:
                  if row['configuration_code'].startswith('jogger_expression_'):
                      print(row)
          PY
