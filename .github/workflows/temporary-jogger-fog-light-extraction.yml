name: Temporary Jogger Fog-Light Extraction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  extract:
    if: github.head_ref == 'agent/jogger-my26-fog-light-superseding-observations-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check pypdfium2==4.30.0
      - name: Verify source and render image-only table pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import pypdfium2 as pdfium

          path = Path('PDF/Cenniki/DACIA JOGGER cennik MY26 20260703.pdf')
          expected = '92606411c4d8c10dd830b0d1c387fe663c4c9618422c5db639c13a23138f4a87'
          actual = sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA mismatch: {actual}')
          print(f'SOURCE_SHA256={actual}')

          output = Path('rendered-jogger-pages')
          output.mkdir(parents=True, exist_ok=True)
          document = pdfium.PdfDocument(path)
          for page_number in (3, 4, 6):
              page = document[page_number - 1]
              bitmap = page.render(scale=220 / 72)
              image = bitmap.to_pil()
              destination = output / f'page-{page_number}.png'
              image.save(destination)
              print(f'{destination}: {image.width}x{image.height}')
          PY
          ls -lh rendered-jogger-pages
      - name: Upload rendered pages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.2.0
        with:
          name: jogger-price-list-rendered-pages
          path: rendered-jogger-pages/*.png
          if-no-files-found: error
          retention-days: 1
