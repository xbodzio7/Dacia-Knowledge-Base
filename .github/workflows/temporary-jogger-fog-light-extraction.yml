name: Temporary Jogger Fog-Light Extraction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  extract:
    if: github.head_ref == 'agent/jogger-my26-fog-light-superseding-observations-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install extraction backend
        run: python -m pip install --disable-pip-version-check pypdf==6.0.0
      - name: Verify source and extract matching pages
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from pypdf import PdfReader

          path = Path('PDF/Cenniki/DACIA JOGGER cennik MY26 20260703.pdf')
          expected = '92606411c4d8c10dd830b0d1c387fe663c4c9618422c5db639c13a23138f4a87'
          actual = sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA mismatch: {actual}')
          reader = PdfReader(path)
          print(f'SOURCE_SHA256={actual}')
          print(f'PAGE_COUNT={len(reader.pages)}')
          for index, page in enumerate(reader.pages):
              text = page.extract_text(extraction_mode='layout') or ''
              normalized = text.casefold()
              if 'przeciwmgiel' in normalized or 'expression' in normalized and ('wyposażenie' in normalized or 'wyposazenie' in normalized):
                  print(f'\n===== PDF PAGE {index + 1} =====')
                  print(text)
          PY
