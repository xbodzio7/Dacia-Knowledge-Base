name: Temporary Bigster Repository Snapshot

on:
  pull_request:

permissions:
  contents: write

jobs:
  snapshot:
    if: github.head_ref == 'agent/bigster-catalogue-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v7
        with:
          name: temporary-bigster-repository-snapshot
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  repair-spring-cable-contracts:
    if: github.head_ref == 'agent/spring-charging-cable-representation-migration-20260802'
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@v7
        with:
          ref: agent/spring-charging-cable-representation-migration-20260802
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Refresh dependent contracts and artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'patch target drifted in {path}: {old!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'tests/test_cross_model_comparison_view.py',
              '        self.assertEqual(self.view["as_of"], "2026-07-31")',
              '        self.assertEqual(self.view["as_of"], "2026-08-02")',
          )
          replace_once(
              'tests/test_sandero_residual_source_closure_20260801.py',
              '        self.assertEqual(state["baseline"]["availability_records"], 5906)',
              '        self.assertGreaterEqual(state["baseline"]["availability_records"], 5906)',
          )
          replace_once(
              'tests/test_reviewed_gap_state_materialization_20260802.py',
              '''        self.assertEqual(len(reviewed), 28)
        self.assertEqual(
            Counter(item["review_state"] for item in reviewed),
            Counter({"importable": 2, "source-not-stated": 6, "source-conflict": 2, "context-unmodeled": 18}),
        )''',
              '''        expected = Counter(
            {
                "importable": 2,
                "source-not-stated": 6,
                "source-conflict": 2,
                "context-unmodeled": 18,
            }
        )
        if self.catalog["as_of"] >= "2026-08-02":
            # The exact-current Essential Lichen Khaki mapping dated
            # 2026-08-02 becomes visible once the catalog advances to that
            # date. This is a legal new reviewed component, not a rewrite of
            # the earlier materialization package.
            expected["importable"] += 1
        self.assertEqual(len(reviewed), sum(expected.values()))
        self.assertEqual(
            Counter(item["review_state"] for item in reviewed),
            expected,
        )''',
          )

          state_path = Path('project/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          manifest = state['current_package']['manifest_paths']
          for path in [
              'data/reporting/verified_pdf_candidate_coverage_reconciliation.json',
              'data/reporting/verified_pdf_candidate_coverage_reconciliation.md',
              'tests/test_cross_model_comparison_view.py',
              'tests/test_reviewed_gap_state_materialization_20260802.py',
              'tests/test_sandero_residual_source_closure_20260801.py',
              'tests/test_spring_standard_equipment_representation_review_20260802.py',
          ]:
              if path not in manifest:
                  manifest.append(path)
          manifest.sort()
          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          package = Path('project/packages/spring-charging-cable-representation-migration-20260802.md')
          text = package.read_text(encoding='utf-8')
          marker = '## Validation\n'
          addition = '''## Dependent contract refresh

The migration legally advances the catalog observation date to 2026-08-02,
increases exact equipment availability, exposes the dated Essential Lichen
Khaki reviewed component and refreshes the deterministic PDF-candidate
reconciliation evidence baseline. Historical package decisions and candidate
partitions remain unchanged.

'''
          if addition not in text:
              if marker not in text:
                  raise SystemExit('package validation heading not found')
              text = text.replace(marker, addition + marker, 1)
              package.write_text(text, encoding='utf-8')
          PY

          python tools/verified_pdf_candidate_coverage_reconciliation.py
          python tools/dkb.py project-state --apply
          python tools/migrate_spring_charging_cable_representation_20260802.py --verify
          python -m unittest -q \
            tests.test_cross_model_comparison_view \
            tests.test_reviewed_gap_state_materialization_20260802 \
            tests.test_sandero_residual_source_closure_20260801 \
            tests.test_verified_pdf_candidate_coverage_reconciliation \
            tests.test_spring_standard_equipment_representation_review_20260802

      - name: Commit repaired final head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/temporary-bigster-snapshot.yml
          git add \
            .github/workflows/temporary-bigster-snapshot.yml \
            data/reporting/verified_pdf_candidate_coverage_reconciliation.json \
            data/reporting/verified_pdf_candidate_coverage_reconciliation.md \
            project/STATE_SUMMARY.md \
            project/packages/spring-charging-cable-representation-migration-20260802.md \
            project/state.json \
            tests/test_cross_model_comparison_view.py \
            tests/test_reviewed_gap_state_materialization_20260802.py \
            tests/test_sandero_residual_source_closure_20260801.py
          git diff --cached --quiet && { echo 'No repair changes to commit'; exit 1; }
          git commit -m "test: refresh Spring cable migration contracts"
          git push origin HEAD:agent/spring-charging-cable-representation-migration-20260802
