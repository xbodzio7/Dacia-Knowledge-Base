name: Temporary Spring Downstream Report Freshness Revalidation

on:
  push:
    branches:
      - agent/spring-my26-dimension-dc40-review-20261120-001

permissions:
  contents: write

concurrency:
  group: temporary-spring-report-refresh
  cancel-in-progress: false

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Revalidate unchanged non-Spring report scopes and refresh input fingerprints
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          ids = [
              "duster_my26_20261102_dimension_diagram_crosswalk_review_20261119_001",
              "bigster_my26_20261001_hdc_applicability_evidence_review_20261119_001",
              "sandero_my26_20261102_ecog120_injection_lpg_semantics_review_20261119_001",
              "sandero_my26_20261102_interior_dimensions_and_trim_semantics_review_20261119_001",
              "jogger_my26_20261001_paint_and_heated_seat_applicability_review_20261119_001",
          ]
          registry = json.loads((root / "data/reporting/report_registry.json").read_text(encoding="utf-8"))
          entries = {row["report_id"]: row for row in registry["reports"]}
          changed_values = list(csv.DictReader((root / "data/master/configuration_attribute_values.csv").open(encoding="utf-8-sig", newline="")))
          spring_delta = [row for row in changed_values if row["id"] in {"8545", "8546"}]
          assert len(spring_delta) == 2 and all(row["configuration_code"].startswith("spring_") for row in spring_delta)
          source_rows = list(csv.DictReader((root / "data/master/sources.csv").open(encoding="utf-8-sig", newline="")))
          spring_source = next(row for row in source_rows if row["code"] == "src_pl_spring_price_my26_20260206")
          assert "155 mm ground-clearance observations" in spring_source["notes"]
          base_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          generated = datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
          for report_id in ids:
              entry = entries[report_id]
              json_path = root / entry["json_path"]
              markdown_path = root / entry["markdown_path"]
              report = json.loads(json_path.read_text(encoding="utf-8"))
              serialized = json.dumps(report, ensure_ascii=False)
              assert "spring_" not in serialized and "src_pl_spring_" not in serialized, report_id
              metadata = report["report_metadata"]
              metadata["base_commit_sha"] = base_sha
              metadata["generated_at"] = generated
              for item in metadata["input_files"]:
                  path = item["path"]
                  if path in {"data/master/sources.csv", "data/master/configuration_attribute_values.csv"}:
                      data = (root / path).read_bytes()
                      item["git_blob_sha"] = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
                      item["sha256"] = hashlib.sha256(data).hexdigest()
              if isinstance(report.get("analysed_commit_sha"), str):
                  report["analysed_commit_sha"] = base_sha
              if isinstance(report.get("reviewed_on"), str):
                  report["reviewed_on"] = "2026-11-20"
              json_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8", newline="\n")
              markdown = markdown_path.read_text(encoding="utf-8")
              markdown = re.sub(r"(?m)^Generated: .*?$", f"Generated: {generated}", markdown)
              markdown = re.sub(r"(?m)^Analysed commit: .*?$", f"Analysed commit: {base_sha}", markdown)
              markdown_path.write_text(markdown, encoding="utf-8", newline="\n")
          PY
      - name: Validate refreshed analytical reports
        run: python tools/dkb.py report-freshness
      - name: Commit and push revalidated report metadata
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git add data/reporting
          if git diff --cached --quiet; then
            echo "No report metadata changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(reports): refresh scoped input provenance"
          git push origin "HEAD:${BRANCH_NAME}"
