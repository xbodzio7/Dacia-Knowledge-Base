name: Temporary Sandero Expression Source Gap Audit

on:
  push:
    branches:
      - agent/sandero-expression-source-gap-20260801
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: temporary-sandero-expression-source-gap-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/sandero-expression-source-gap-20260801'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install PDF backend
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
      - name: Check canonical state
        run: python tools/dkb.py project-state --check
      - name: Export exact source and current contracts
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv
          import json
          from pathlib import Path

          root = Path('.')
          source_code = 'src_pl_sandero_stepway_expression_ecog120_mt_20260626'
          configuration = 'sandero_stepway_iii_expression_ecog120_manual'

          def csv_rows(path: Path):
              with path.open(encoding='utf-8-sig', newline='') as handle:
                  return list(csv.DictReader(handle))

          def json_object(path: Path):
              return json.loads(path.read_text(encoding='utf-8'))

          source = next(
              row for row in csv_rows(root / 'data/master/sources.csv')
              if row.get('code') == source_code
          )
          evidence = [
              row for row in json_object(root / 'data/reporting/configuration_gap_evidence.json')['decisions']
              if row.get('source_code') == source_code
              and row.get('configuration_code') == configuration
          ]
          plan = [
              row for row in json_object(root / 'data/reporting/configuration_gap_resolution_plan.json')['decisions']
              if row.get('source_code') == source_code
              and row.get('configuration_code') == configuration
          ]
          source_review = json_object(root / 'data/reporting/configuration_gap_source_review.json')
          review_keys = [
              key for key in source_review.get('review_triage_keys', [])
              if source_code in key and configuration in key
          ]
          values = [
              row for row in csv_rows(root / 'data/master/configuration_attribute_values.csv')
              if row.get('configuration_code') == configuration
          ]
          ranges = [
              row for row in csv_rows(root / 'data/master/configuration_attribute_value_ranges.csv')
              if row.get('configuration_code') == configuration
          ]
          availability = [
              row for row in csv_rows(root / 'data/master/equipment_availability.csv')
              if row.get('configuration_code') == configuration
          ]
          payload = {
              'source': source,
              'configuration': configuration,
              'evidence_decisions': evidence,
              'resolution_decisions': plan,
              'source_review_keys': review_keys,
              'existing_values': values,
              'existing_ranges': ranges,
              'equipment_availability': availability,
          }
          Path('/tmp/relevant.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          Path('/tmp/source-path.txt').write_text(source['file_path'], encoding='utf-8')
          print('Evidence decisions:', len(evidence))
          print('Resolution decisions:', len(plan))
          print('Existing scalar values:', len(values))
          print('Existing ranges:', len(ranges))
          print('Equipment rows:', len(availability))
          PY
          source_path="$(cat /tmp/source-path.txt)"
          pdfinfo "$source_path" > /tmp/pdfinfo.txt
          pdftotext -layout "$source_path" /tmp/source.txt
          cat /tmp/pdfinfo.txt
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          payload=json.loads(Path('/tmp/relevant.json').read_text(encoding='utf-8'))
          print('Evidence by domain/classification:')
          print(Counter((row['domain'], row['classification']) for row in payload['evidence_decisions']))
          print('Technical evidence:')
          for row in payload['evidence_decisions']:
              if row['domain']=='technical':
                  print(row['attribute_code'], row.get('fuel_type_code',''), row['classification'])
          print('Equipment evidence:')
          for row in payload['evidence_decisions']:
              if row['domain']=='equipment':
                  print(row['attribute_code'], row['classification'], row.get('reason_code',''))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sandero-expression-source-gap-audit-concise
          path: |
            /tmp/relevant.json
            /tmp/source.txt
            /tmp/pdfinfo.txt
          retention-days: 3
