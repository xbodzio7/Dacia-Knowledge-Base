name: Materialize Brochure Chassis Modeling Closure

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/materialize-brochure-chassis-modeling-closure.yml
      - data/reporting/brochure_chassis_modeling_closure_review.json
      - tools/review_brochure_chassis_modeling_closure_20260726.py
      - tools/materialize_brochure_chassis_modeling_closure_20260726.py
      - tests/test_brochure_chassis_modeling_closure_review.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/brochure-chassis-modeling-closure-review
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Materialize and validate closure review
        shell: bash
        run: |
          set -euo pipefail
          python tools/materialize_brochure_chassis_modeling_closure_20260726.py
          python tools/dkb.py project-state --apply
          python tools/review_brochure_chassis_modeling_closure_20260726.py --check
          python tools/verify_brochure_chassis_measurement_context_model_20260726.py --check
          python tools/dkb.py validate
          python tools/dkb.py project-state --check
          python tests/test_brochure_chassis_modeling_closure_review.py -v
          python -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'docs(data): materialize brochure chassis modeling closure'
            git push origin HEAD:agent/brochure-chassis-modeling-closure-review
          fi
